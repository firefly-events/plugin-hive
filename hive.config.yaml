# Hive Configuration
# All settings have sensible defaults. Override only what you need.

schema_version: "1.2"

# File system paths
paths:
  state_dir: .pHive
  # Primary source for the attached project path.
  # When unset (null), the resolver falls back to the invoking cwd.
  # No CLI argument form exists; config-first, cwd-fallback only.
  target_project: null
  # Kickoff-gate behavior for procedural skills (/plan, /execute).
  # warning: emit warning + proceed with sane defaults (auto-detect methodology,
  #   placeholder project-profile written to disk).
  # hard: original behavior — block when project-profile.yaml is missing.
  # Read-only skills (status, review, test, standup, ui-audit) already warn-and-
  # proceed per Epic A W1 (commit 08b472d); this knob extends that pattern to
  # /plan and /execute, which previously hard-blocked.
  gate_mode: warning

# Metrics — local maintainer override. The shipped baseline at
# `hive/hive.config.yaml` keeps `enabled: false` per the original opt-in-at-
# kickoff design. For plugin-hive itself we turn it on so the meta-meta
# improvement loop has real per-agent token + wall-clock signal to grade
# against. Hooks (metrics-token-capture, metrics-stop-dispatch, etc.) silently
# no-op when disabled, so flipping this is the only switch needed.
metrics:
  enabled: true

# KG lifecycle emission granularity.
# phase: emit lifecycle KG triples at phase boundaries (default, low volume).
# story: emit at story boundaries.
# step: emit at individual workflow steps (highest volume).
# off: disable lifecycle KG emission without disabling KG reads/imports.
emit_lifecycle_at: phase

# Meta-optimize signal weights (design §3.2)
# Per-source multiplier applied to the base priority score in step-03 ranking.
# Weighted score = weight × Impact × (6 − Risk) / Effort.
# Default 1.0 for every key preserves ranking order when unset.
meta_optimize:
  # Flip step-03c metric gate to blocking per locked Q3 + design §3.3.
  # Per-proposal scope: passing proposals enter step-04; failed proposals get
  # status: rejected_metric_gate. Cycle continues with passing subset.
  # Set to advisory to restore legacy non-blocking behavior.
  metric_gate: blocking
  signal_weights:
    metrics: 1.0
    external_research: 0.9
    kg_signal: 0.4         # demoted pending KG repair
    dreaming_replay: 0.5
    backlog: 0.2

# Quality gate thresholds
quality_gates:
  auto_pass_threshold: 0.9
  human_escalation_threshold: 0.3

# Per-agent-pair trust scoring
trust:
  initial_score: 0.5
  high_threshold: 0.8
  low_threshold: 0.5
  decay_rate: 0.05
  decay_interval_days: 7

# Token budget limits
tokens:
  per_task_limit: 100000
  per_story_limit: 500000
  per_epic_limit: 2000000
  warning_threshold: 0.8

# Context window management
context_window:
  budget_fraction: 0.7
  degradation_threshold: 0.85

# External task tracking (Epic C — task-tracking-adapter-abi)
# Maintainer override layer. Keep `adapter: null` so opt-in is explicit.
# See hive/hive.config.yaml for the full schema commentary.
#
# Examples — uncomment ONE block to enable a tracker:
#
#   # GitHub (built-in):
#   task_tracking:
#     adapter: github
#     team_value: firefly-events     # GitHub owner/org
#     project_value: plugin-hive     # GitHub repo
#     github:
#       token: null                  # falls through to GITHUB_TOKEN / `gh auth token`
#
#   # Linear (built-in):
#   task_tracking:
#     adapter: linear
#     team_value: ACME               # Linear team key
#     project_value: my-project      # Linear project name (optional)
#     linear:
#       api_key: null                # falls through to LINEAR_API_KEY env
#       team: ACME                   # falls through to LINEAR_TEAM env
#
#   # Multica (built-in):
#   task_tracking:
#     adapter: multica
#     team_value: <multica-workspace-slug>   # e.g. plugin-hive
#     project_value: null                    # not used by multica
#     multica:
#       server_url: null                     # falls through to ~/.multica/config.json server_url
#       token: null                          # falls through to MULTICA_TOKEN env, then ~/.multica/config.json token
task_tracking:
  # Flipped 2026-05-21 github → multica per local-first direction (v2.6.0
  # multica-substrate-adoption shipped; multica-execute-routing follow-on
  # in flight). /plan Phase D now files stories as Multica issues in the
  # local spike workspace. Override back to github (or null) if needed.
  adapter: multica
  adapter_timeout_ms: 30000
  gate_mode: warning
  team_value: plugin-hive        # Multica workspace slug
  project_value: null            # not used by multica
  multica:
    server_url: null             # falls through to ~/.multica/config.json server_url
    token: null                  # falls through to MULTICA_TOKEN env, then ~/.multica/config.json token
  # GitHub Issues adapter (sandcastle-ops-layer s1) — labeled-issue publish
  # + dependency-sweep. Wired into Phase D and gated on `adapter == "github"`.
  # Retained as a fall-back; switch adapter:github above to re-activate.
  github_owner: null             # falls through to team_value when null
  github_repo: null              # falls through to project_value when null
  label_prefix: "hive"           # prefix for hive:ready / hive:blocked-by:<id> labels
  github:
    token: null
  linear:
    api_key: null
    team: null
  # Legacy keys retained for pre-ABI tooling; will graduate to deprecated in c-5b.
  queue_name: "Hive — Human Intervention"
  auto_expire_days: 7
  linear_team: null
  linear_project: null
  linear_user_id: null
  linear_prefix: "[Hive]"
  branch_prefix: "acme"

# Model tier routing
# Assigns the right model to the right job. Orchestrator and complex reasoning
# get Opus. Analytical/implementation work gets Sonnet. Fast execution gets Haiku.
model_tiers:
  opus:                          # heavy reasoning, coordination, complex decisions
    - orchestrator
    - team-lead
    - architect
    - analyst
    - tpm
  sonnet:                        # analytical, implementation, review
    - researcher
    - developer                    # still referenced by workflows; use frontend/backend-developer for new work
    - frontend-developer
    - backend-developer
    - tester
    - reviewer
    - pair-programmer
    - peer-validator
    - ui-designer
    - technical-writer
    - test-scout
    - test-architect
    - test-inspector
    - test-sentinel
    # Specialist teams
    - animations-specialist
    - accessibility-specialist
    - idiomatic-reviewer
    - performance-reviewer
    - security-reviewer
  haiku:                         # fast execution, mechanical tasks
    - test-worker

# Override a specific agent's model (takes precedence over tier)
model_overrides:
  reviewer: opus               # Opus 4.7 verifies Codex-produced work (cross-LLM gate)
  peer-validator: opus         # peer-validator runs alongside reviewer — same tier
  # example: researcher: opus    # promote researcher to opus for complex projects

# Per-persona backend routing.
# Per feedback_codex_general_backend.md (2026-05-01 policy):
#   Codex on (creates): researcher, developer(s), technical-writer, architect
#   Claude on (verifies/sequences): reviewer, tester, tpm, analyst, team-lead,
#     pair-programmer, peer-validator, all specialists, all test-* agents
# Personas omitted from this map default to direct TeamCreate (Claude). The plan
# skill emits one INFO-log line per persona at spawn time documenting the route.
# Originally wired in shipped baseline at eefbff3 (2026-04-21); reverted at
# 59a5451 to keep shipped neutral; re-applied here in maintainer-local root.
agent_backends:
  researcher: codex
  developer: codex
  frontend-developer: codex
  backend-developer: codex
  technical-writer: codex
  architect: codex
  # ui-designer omitted — known-incompatible per skills/hive/skills/codex-invoke
  # tpm/pair-programmer/analyst/team-lead/reviewer/tester/qa/peer-validator omitted
  # — verifier + sequencing roles stay on Claude per 2026-05-01 policy

# Circuit breakers — prevent wasted time and tokens
circuit_breakers:
  step_timeout_minutes: 10       # max time for a single workflow step
  fix_loop_timeout_minutes: 20   # max time for all fix loop iterations combined
  story_timeout_minutes: 45      # max time for a single story (all steps)
  ceremony_timeout_hours: 4      # max time for the full daily ceremony
  max_step_retries: 2            # retry a failed step this many times
  max_fix_iterations: 3          # fix loop iterations before back-to-planning
  max_same_error_repeats: 3      # same error N times = stop, change strategy
  # Advisory token caps (story w5-sidecar-bundle, A-31). Fail-open: missing
  # token data silently skips the cap (NOT an error). Crossing the cap emits
  # a budget_exceeded telemetry event but does NOT hard-block — tuning
  # signals, not runtime gates. See skills/execute/SKILL.md.
  max_tokens_per_step: null      # null = unset (no warning, no cap)
  max_tokens_per_fix_loop: null  # null = unset
  max_tokens_per_story: null     # null = unset

# Example codebases — directories agents can reference to learn your coding
# style, structure patterns, naming conventions, etc. Add paths to your own
# projects so agents understand how YOU write code.
example_codebases: []
  # - path: /path/to/your/go-project
  #   label: "Go API project"
  #   notes: "Clean architecture, Chi router, PostgreSQL"
  # - path: /path/to/your/react-app
  #   label: "React Native app"
  #   notes: "Expo managed, TypeScript, MobX state"

# External model integrations
# Codex (OpenAI) can be used as a second-model reviewer for adversarial review.
# Requires: npm install -g @openai/codex && codex login
external_models:
  codex:
    enabled: true               # codex-cli 0.118+ installed + ChatGPT auth active (verified 2026-05-07)
    use_for:
      - adversarial-review      # run after Claude review, before optimize/integrate
    # companion_path is auto-detected from the codex plugin if installed

# Git workflow settings (per-epic-branch-pr-flow epic, story pe-1)
# Resolved by `hive/lib/git_flow.mjs` (`resolveGitFlow`). Uncomment to override
# the plugin defaults shipped at `hive/hive.config.yaml`.
#
# git_flow:
#   default_pr_base: auto         # auto | <branch-name>; "auto" = develop if origin/develop exists, else main
#   branch_strategy: per-epic     # per-epic | per-story (back-compat for in-flight epics)

# Planning substrate routing (multica-plan-test-cycles epic).
# Routes /plan Phase 0 persona dispatch through the Multica daemon instead of
# direct TeamCreate. Per-persona fan-out (one Multica issue + agent UUID per
# planning persona); Hive owns mode-resolve, polling, episode markers, and all
# user review/sign-off gates (gates never advance from the Multica side).
# Prereq: `/hive:multica-init` bootstrap. Env override: HIVE_PLANNING_MODE=multica.
planning:
  mode: multica
  multica:
    poll_interval_seconds: 5
    persona_timeout_seconds: 1800   # 30-min wall clock per persona
    messages_capture_max: 200       # last N messages into episode sidecar

# Execution defaults
execution:
  runtime: auto         # auto | workflows | multica  (Q4 maintainer-confirmed default: auto)
  # cwfp-s2-2 execute-dispatch resolver precedence:
  # env HIVE_EXECUTION_RUNTIME > root config > shipped baseline > skill override > default.
  # Per-epic-override rule (architect Q2 tightening): when runtime is 'auto',
  # execute-dispatch reads .pHive/cycle-state/<epic-id>.yaml execution_runtime
  # block; if present, the per-epic value overrides auto. Explicit 'workflows'
  # or 'multica' bypass the per-epic override.
  default_methodology: classic
  parallel_teams: true
  max_retry_attempts: 2
  terminal_mux: cmux            # required for codex-backend panes
  interactive_panes: true       # visible agent conversation in cmux panes
  idle_timeout_seconds: 300     # 5-min idle reaper for persistent Codex panes
  # Multica substrate adoption per project_multica_substrate_adoption (2026-05-20)
  # + multica-execute-routing follow-on. Hands each Hive story to a bootstrapped
  # Multica agent (developer / tester / reviewer) which owns the work dir +
  # task execution after assignment. Hive owns dispatch + polling + episode
  # markers. Override via HIVE_EXECUTION_MODE env when needed (sandcastle, etc.).
  mode: multica
  multica:
    poll_interval_seconds: 5
    story_timeout_seconds: 1800   # 30-min wall clock per story
    messages_capture_max: 200     # last N messages captured into episode sidecar

# Autonomous cycle loop (epic: autonomous-cycle-loop, story s0-1 foundation)
# Root-layer override surface for the same block declared in
# `hive/hive.config.yaml`. Schema-only foundation — no consumer reads these
# knobs yet. See hive/references/sandcastle-mode.md and
# hive/references/test-scenario-schema.md for semantics. Defaults match the
# shipped baseline; uncomment to override locally without forking the plugin.
# autonomous_cycle_loop:
#   enabled: false
#   sandcastle_mode: shared       # shared | dedicated
#   test_scenarios_path: .pHive/test-scenarios
#   max_cycles_per_run: 1
