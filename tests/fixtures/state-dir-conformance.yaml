      "config_path": "$TMP/hive.config.yaml",
      "cwd": "$TMP/cwd",
      "dirs": ["$TMP/cwd", "$TMP/proj"],
      "symlinks": {},
      "expected": "$TMP/proj/.env-state"
    },
