id: example-scenario
title: "Example simulated-manual scenario"
mode: spec-walk
story: example-story
epic: example-epic

preconditions:
  - "The feature under test is described in the story spec"
  - "The story spec is accessible in context"

steps:
  - action: "Open the story spec and locate the primary acceptance criterion"
    expected: "Acceptance criterion is clearly stated and has a single measurable outcome"
    actor: tester
  - action: "Trace the implementation path from acceptance criterion to affected files"
    expected: "At least one file is identified as the implementation target"
  - action: "Verify the implementation matches the acceptance criterion"
    expected: "Implementation satisfies the criterion; no deviation found"
    actor: tester

postconditions:
  - "All steps recorded with pass or fail outcome"
  - "Overall verdict written to cycle-state manual_verdict block"
