<svg viewBox="0 0 120 120" width="120" height="120" xmlns="http://www.w3.org/2000/svg">
  <!-- Hive favicon — Concept 4 (Hex with Adjacent Cells Forming), square-cropped, no wordmark -->
  <g transform="translate(38, 38)" fill="none" stroke="#3A255F" stroke-linecap="round" stroke-linejoin="round">
    <!-- Partial NE neighbor cell — 3 of 5 outer edges, ghosted -->
    <polyline points="22,0 22,-22 41.05,-33 60.10,-22 60.10,0"
              stroke-width="2" opacity="0.5"/>
    <!-- Partial SW neighbor cell — 3 of 5 outer edges, more ghosted -->
    <polyline points="2.95,33 -16.10,44 -16.10,66 2.95,77"
              stroke-width="2" opacity="0.35"/>
    <!-- Main hex — pointy-top, regular, edge length 22 -->
    <polygon points="22,0 41.05,11 41.05,33 22,44 2.95,33 2.95,11"
             stroke-width="2.4"/>
    <!-- Vertex dots (gold-led "points of light") -->
    <g stroke="none">
      <circle cx="22"    cy="0"  r="4.5" fill="#FFCD61"/>
      <circle cx="41.05" cy="11" r="4.5" fill="#A12468"/>
      <circle cx="41.05" cy="33" r="4.5" fill="#3A255F"/>
      <circle cx="22"    cy="44" r="4.5" fill="#FFCD61"/>
      <circle cx="2.95"  cy="33" r="4.5" fill="#A12468"/>
      <circle cx="2.95"  cy="11" r="4.5" fill="#3A255F"/>
    </g>
  </g>
</svg>
