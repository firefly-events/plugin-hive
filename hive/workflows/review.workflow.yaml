name: review
description: >
  Review flow graph — reviewer → reconcile-review → gate-review-artifact.
  This is the DAG front-door graph for `/review` (see skills/review/SKILL.md
  Phase 0b): it is artifact-readiness only. There is no in-graph fix/implement
  agent here — a needs_revision verdict is handled OUTSIDE this graph by
  re-triggering pickup through the same dispatch path `/execute` uses (see
  skills/review/SKILL.md step 7). Bounded retry on the reviewer node covers
  individual review-attempt flakiness (see reviewer.md "Retry" — no LOOP
  primitive needed). A prior draft of this file carried a disconnected
  `review-converge-loop` LOOP node (no feature/convergence_signal, zero body
  nodes) intended for an in-graph review<->fix cycle that was never built for
  this workflow; it was removed as vestigial dead code (pr20-fable-review M1) —
  it had no `depends_on` and nothing depended on it, so it never participated
  in the reviewer -> reconcile-review -> gate-review-artifact chain and only
  existed to crash the walker (LoopNodeInvariantError) once loaded. The
  in-graph converge-loop pattern IS used for real fix cycles elsewhere, e.g.
  development.classic.workflow.yaml's `review-converge-loop`
  (feature: review_converge, sub_graph: review-fix-cycle), which has a real
  `developer` agent to apply fixes in-graph.
version: "1.0.0"

steps:
  # ── Reviewer producer: run structured code review + commit artifact ──────────
  - id: reviewer
    agent: reviewer
    node_type: agent
    step_file: hive/workflows/step-files/review/reviewer.md
    task: >
      Run a structured code review on the provided diff / PR / branch.
      Produce a review artifact (verdict + findings) and commit it to the working
      tree so the reconcile + gate nodes can validate it.
    depends_on: []
    config:
      # Match-resolve-load-invoke seam (hive/lib/skill_binding.py): the
      # AgentHandler resolves this binding itself before spawning the agent,
      # injects skills/review/SKILL.md into the brief, and sets the
      # `skill_invoked` output deterministically — invocation no longer
      # depends on the spawned agent reading step 2 of reviewer.md prose.
      # Two authoritative skills govern this node: the review procedure AND
      # the verify (evidence-gathering) procedure the reviewer must run first
      # (reviewer.md step 2). BOTH are resolved+injected by the AgentHandler
      # and BOTH fail closed if missing/unreadable — verify is no longer an
      # inert prose request. (PR #74 review P1: verify inert binding.)
      skill_binding:
        - persona_path: hive/agents/reviewer.md
          trigger: "running any code review"
          # This node IS the in-graph execution of the review skill. Guard the
          # injection so the agent skips skills/review/SKILL.md Phase 0/0b
          # dispatch (which would re-enter this same review DAG) and runs the
          # review procedure directly. (PR #74 review P1: recursive self-launch.)
          in_graph: true
        - persona_path: hive/agents/reviewer.md
          trigger: "verifying acceptance-criteria, fallback, and command/test evidence before code review"
    inputs:
      - name: diff_target
        source: context
        context_key: diff_target
        optional: true
      - name: pr_number
        source: context
        context_key: pr_number
        optional: true
      - name: branch
        source: context
        context_key: branch
        optional: true
    outputs:
      - name: review_artifact
        type: string
      - name: commit_sha
        type: string
      # s3-convergence-signal: boolean convergence signal. True when the review
      # passes (verdict = passed or needs_optimization); false when it requires
      # a fix (verdict = needs_revision). Consumed by the review-converge-loop's
      # skip_when predicate to short-circuit subsequent rounds.
      - name: review_passed
        type: json
      # s1-code-review-actual-invocation: declared so the AgentHandler's
      # deterministic skill_invoked write (see config.skill_binding above)
      # is a real graph output, not merely a step-file-documented convention.
      # With review + verify bound, this surfaces as a list of both skill paths.
      - name: skill_invoked
        type: json
      # PR #74 review P1: verify_evidence is now a DECLARED output, so the
      # #13/#22 under-run guard fails the node closed when the reviewer does
      # not produce the verify evidence report — verify is enforced, not
      # advisory. An empty-domain review must still emit evidence explaining
      # that no acceptance claims or runnable commands were present.
      - name: verify_evidence
        type: string
    retry:
      max_attempts: 3
    timeout_ms: 1800000

  # ── Reconcile (s7): materialise the reviewer's committed artifact before gate ─
  - id: reconcile-review
    agent: reconciler
    node_type: reconcile
    step_file: hive/workflows/step-files/review/reconcile.md
    task: >
      Materialise the reviewer's committed review artifact so the gate can
      validate it exists and contains a non-empty verdict.
    depends_on:
      - reviewer
    inputs:
      - name: sha
        source: step_output
        step_id: reviewer
        output_name: commit_sha
        optional: true
      # C1: wire branch + repo from reviewer step_output so the Multica path
      # passes the real commit metadata to the reconcile handler.
      - name: branch
        source: step_output
        step_id: reviewer
        output_name: branch
        optional: true
      - name: repo
        source: step_output
        step_id: reviewer
        output_name: repo
        optional: true
      - name: work_dir
        source: step_output
        step_id: reviewer
        output_name: work_dir
        optional: true
    outputs:
      - name: reconcile_status
        type: string
    optional: true
    timeout_ms: 120000

  # ── Validation gate (s3): confirm review artifact exists and is non-empty ────
  - id: gate-review-artifact
    agent: validator
    node_type: gate
    gate: "review_artifact must not be empty"
    step_file: hive/workflows/step-files/review/gate-review.md
    depends_on:
      - reconcile-review
    inputs:
      - name: review_artifact
        source: step_output
        step_id: reviewer
        output_name: review_artifact
      - name: review_artifact_path
        source: context
        context_key: review_artifact_path
        optional: true
    outputs:
      - name: gate_passed
        type: json
    optional: false
    timeout_ms: 60000
