name: test-swarm
description: Generalized test swarm — 8-task pipeline from context through bug reporting.
version: "1.0.0"

steps:
  - id: rebuild
    agent: test-scout
    step_file: hive/workflows/steps/test-swarm/step-00-rebuild.md
    task: >
      Rebuild the project from latest commit and deploy to test targets.
      Verify build artifacts are fresh before any tests run.
    depends_on: []
    outputs:
      - name: build_report
        type: string
    optional: false
    timeout_ms: 300000

  - id: gather-context
    agent: test-scout
    step_file: hive/workflows/steps/test-swarm/step-01-scout.md
    task: >
      Read the story spec, PR, or commit context. Cross-reference with baseline
      knowledge. Produce a structured context document covering what was built,
      affected areas, acceptance criteria, and test-relevant details.
    depends_on: []
    inputs:
      - name: story_spec
        source: context
        context_key: story_spec
      - name: baseline_path
        source: context
        context_key: baseline_path
    outputs:
      - name: context_doc
        type: string
    optional: false
    timeout_ms: 300000

  - id: verify-baseline
    agent: test-scout
    step_file: hive/workflows/steps/test-swarm/step-01-scout.md
    task: >
      Check if baseline knowledge exists for this project. If missing, run a
      discovery pass: inspect codebase structure, detect test frameworks, map
      navigation/routing, catalog key modules. If baseline exists, verify it's
      current and update if the codebase has significantly changed.
    depends_on:
      - gather-context
    inputs:
      - name: context_doc
        source: step_output
        step_id: gather-context
        output_name: context_doc
      - name: baseline_path
        source: context
        context_key: baseline_path
    outputs:
      - name: baseline_status
        type: string
    optional: false
    timeout_ms: 600000

  - id: author-tests
    agent: test-architect
    step_file: hive/workflows/steps/test-swarm/step-02-architect.md
    task: >
      Detect the project's test framework. Author test scripts for each
      acceptance criterion: happy paths, edge cases, error states. Map every
      test to its source requirement. Flag regression candidates. Output test
      files and a structured test manifest.
    depends_on:
      - verify-baseline
    inputs:
      - name: context_doc
        source: step_output
        step_id: gather-context
        output_name: context_doc
      - name: baseline_path
        source: context
        context_key: baseline_path
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: test_manifest
        type: string
      - name: test_files
        type: artifact_ref
    optional: false
    timeout_ms: 600000

  - id: scenario-replay
    agent: test-inspector
    step_file: hive/workflows/steps/test-swarm/step-04b-scenario-replay.md
    task: >
      Load execution results produced by execute-platform-a via loadResults
      from hive/lib/scenarios/load.mjs. Replay the results into a structured
      replay_summary output for downstream consumers (validate-coverage and
      file-bugs). Compute replay_status. Emit failed_test_ids list.
    depends_on:
      - execute-platform-a
    inputs:
      - name: platform_a_results
        source: step_output
        step_id: execute-platform-a
        output_name: platform_a_results
    outputs:
      - name: replay_summary
        type: string
    optional: false
    timeout_ms: 300000

  - id: validate-coverage
    agent: test-inspector
    step_file: hive/workflows/steps/test-swarm/step-04-inspector.md
    task: >
      Validate that authored tests adequately cover the story's acceptance
      criteria. Map each requirement to its covering test(s). Identify gaps
      with specificity and severity classification. Produce a coverage report.
    depends_on:
      - author-tests
      - gather-context
      - scenario-replay
    inputs:
      - name: test_manifest
        source: step_output
        step_id: author-tests
        output_name: test_manifest
      - name: context_doc
        source: step_output
        step_id: gather-context
        output_name: context_doc
      - name: story_spec
        source: context
        context_key: story_spec
      - name: replay_summary
        source: step_output
        step_id: scenario-replay
        output_name: replay_summary
        optional: true
    outputs:
      - name: coverage_report
        type: string
    optional: false
    timeout_ms: 300000

  - id: execute-platform-a
    agent: test-worker
    step_file: hive/workflows/steps/test-swarm/step-03-worker.md
    task: >
      Execute authored tests on the primary platform. Detect connected
      devices/environments. Run each test, capturing pass/fail, timing,
      screenshots on failure, and logs. Compile structured results.
    depends_on:
      - author-tests
    inputs:
      - name: test_files
        source: step_output
        step_id: author-tests
        output_name: test_files
      - name: test_manifest
        source: step_output
        step_id: author-tests
        output_name: test_manifest
    outputs:
      - name: platform_a_results
        type: string
    optional: false
    timeout_ms: 600000

  - id: execute-platform-b
    agent: test-worker
    step_file: hive/workflows/steps/test-swarm/step-03-worker.md
    task: >
      Execute authored tests on the secondary platform (if configured).
      Same protocol as platform-a but targeting a different device/browser/environment.
      Skip if only one platform is configured.
    depends_on:
      - author-tests
    inputs:
      - name: test_files
        source: step_output
        step_id: author-tests
        output_name: test_files
      - name: test_manifest
        source: step_output
        step_id: author-tests
        output_name: test_manifest
    outputs:
      - name: platform_b_results
        type: string
    optional: true
    timeout_ms: 600000

  - id: file-bugs
    agent: test-sentinel
    step_file: hive/workflows/steps/test-swarm/step-05-sentinel.md
    task: >
      Process all test failures from both platforms. For each failure: gather
      expected vs actual, screenshots, repro steps. Generate AI hypothesis on
      root cause. Classify severity. Route based on severity and learned patterns.
      File bug reports for failures.
    depends_on:
      - execute-platform-a
      - execute-platform-b
    inputs:
      - name: platform_a_results
        source: step_output
        step_id: execute-platform-a
        output_name: platform_a_results
      - name: platform_b_results
        source: step_output
        step_id: execute-platform-b
        output_name: platform_b_results
      - name: context_doc
        source: step_output
        step_id: gather-context
        output_name: context_doc
    outputs:
      - name: bug_reports
        type: string
    optional: false
    timeout_ms: 300000

  - id: triage-failures
    agent: test-sentinel
    step_file: hive/workflows/steps/test-swarm/step-06-triage.md
    task: >
      Categorize failures: transient (retry), story issue (back to planning),
      human blocker (escalate). Map to error-handling categories. Produce
      routing decisions for each bug.
    depends_on:
      - file-bugs
    inputs:
      - name: bug_reports
        source: step_output
        step_id: file-bugs
        output_name: bug_reports
      - name: context_doc
        source: step_output
        step_id: gather-context
        output_name: context_doc
    outputs:
      - name: routing_decisions
        type: string
    optional: false
    timeout_ms: 300000

  - id: compile-report
    agent: test-inspector
    step_file: hive/workflows/steps/test-swarm/step-07-report.md
    task: >
      Compile the test session report. Synthesize: test results per platform,
      coverage analysis, bugs filed, severity distribution, and actionable
      recommendations. This is the final output of the test swarm run.
    depends_on:
      - execute-platform-a
      - execute-platform-b
      - file-bugs
      - triage-failures
      - validate-coverage
    inputs:
      - name: platform_a_results
        source: step_output
        step_id: execute-platform-a
        output_name: platform_a_results
      - name: platform_b_results
        source: step_output
        step_id: execute-platform-b
        output_name: platform_b_results
      - name: bug_reports
        source: step_output
        step_id: file-bugs
        output_name: bug_reports
      - name: routing_decisions
        source: step_output
        step_id: triage-failures
        output_name: routing_decisions
      - name: coverage_report
        source: step_output
        step_id: validate-coverage
        output_name: coverage_report
    outputs:
      - name: session_report
        type: string
    optional: false
    timeout_ms: 300000

  - id: promote-baseline
    agent: test-architect
    step_file: hive/workflows/steps/test-swarm/step-08-promote.md
    task: >
      Promote passing test patterns to baseline knowledge. Update baseline with
      verified framework detections and regression candidates. Archive test
      artifacts with timestamps.
    depends_on:
      - compile-report
    inputs:
      - name: session_report
        source: step_output
        step_id: compile-report
        output_name: session_report
      - name: test_manifest
        source: step_output
        step_id: author-tests
        output_name: test_manifest
      - name: baseline_path
        source: context
        context_key: baseline_path
    outputs:
      - name: promotion_summary
        type: string
    optional: false
    timeout_ms: 300000

  # Reconcile node (s7): materialise the compile-report agent's committed test
  # report into the working tree before the gate validates it. No-op on local
  # bindings (sha absent) — safe on both local and Multica execution paths.
  # C1 fixed: sha/branch/repo from compile-report step_output (the actual report producer).
  - id: reconcile-report
    agent: reconciler
    node_type: reconcile
    step_file: hive/workflows/step-files/execute/reconcile.md
    task: >
      Materialise the compile-report agent's committed test report so the gate
      can validate the artifact exists and parses correctly.
    depends_on:
      - compile-report
    inputs:
      - name: sha
        source: step_output
        step_id: compile-report
        output_name: commit_sha
        optional: true
      - name: branch
        source: step_output
        step_id: compile-report
        output_name: branch
        optional: true
      - name: repo
        source: step_output
        step_id: compile-report
        output_name: repo
        optional: true
      - name: work_dir
        source: step_output
        step_id: compile-report
        output_name: work_dir
        optional: true
    outputs:
      - name: reconcile_status
        type: string
    optional: true
    timeout_ms: 120000

  # Validation gate (s3): confirm the committed test report exists and parses.
  # report_artifact_path is parameterised on the actual artifact location from
  # SKILL.md: ${HIVE_STATE_DIR}/test-artifacts/{epic-id}/{story-id}/results.yaml
  - id: gate-test-report
    agent: validator
    node_type: gate
    gate: "session_report must not be empty"
    depends_on:
      - reconcile-report
    inputs:
      - name: session_report
        source: step_output
        step_id: compile-report
        output_name: session_report
      - name: report_artifact_path
        source: context
        context_key: report_artifact_path
        optional: true
    outputs:
      - name: gate_passed
        type: json
    optional: false
    timeout_ms: 60000
