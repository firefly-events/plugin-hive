name: development-tdd
description: TDD development workflow — tests first, then implement to make them pass.
version: "1.1.0"
methodology: tdd

# AGENT ROUTING:
# Steps reference generic agent roles (e.g., "developer"). The team lead resolves
# these to specific roster agents at runtime based on the story's scope:
#   developer → frontend-developer (UI/component work) or backend-developer (API/server work)

steps:
  - id: research
    agent: researcher
    step_file: hive/workflows/steps/development-classic/step-02-research.md
    task: >
      Read the story spec and explore the codebase. Gather raw findings:
      affected files, existing patterns, architectural constraints, risks,
      reusable utilities, test infrastructure, and external references.
      Deliver structured raw findings — do NOT write a formatted brief.
    depends_on: []
    inputs:
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: research_findings
        type: string
    optional: false
    timeout_ms: 300000

  - id: write-brief
    agent: technical-writer
    task: >
      Receive raw research findings and produce a formatted research brief.
      Use the research-brief skill if available. The brief should be
      actionable for the developer and tester: where to start, what to reuse,
      what test infrastructure exists, and what to watch out for.
    depends_on:
      - research
    inputs:
      - name: research_findings
        source: step_output
        step_id: research
        output_name: research_findings
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: research_brief
        type: string
    optional: false
    timeout_ms: 180000

  - id: test-spec
    agent: tester
    step_file: hive/workflows/steps/development-tdd/step-02-test-spec.md
    task: >
      Write failing tests from the story specification ONLY. You do NOT see any
      implementation code — this is TDD mode. Tests define the expected behavior
      based on acceptance criteria. Use existing test patterns found during research.
      Tests MUST fail when run (there is no implementation yet). Produce a test
      manifest listing each test with its target acceptance criterion.
    depends_on:
      - write-brief
    inputs:
      - name: research_brief
        source: step_output
        step_id: write-brief
        output_name: research_brief
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: test_files
        type: string
      - name: test_manifest
        type: string
    optional: false
    timeout_ms: 600000

  - id: implement
    agent: developer
    sub_graph: tdd-red-green-cycle
    step_file: hive/workflows/steps/development-tdd/step-03-implement.md
    task: >
      Implement the story to make all failing tests pass. You receive the test
      files and the research brief — write the minimum code needed to satisfy
      the tests. Follow existing patterns identified in the research phase.
      Do not modify the tests. Verify all tests pass after implementation.
    depends_on:
      - test-spec
    inputs:
      - name: test_files
        source: step_output
        step_id: test-spec
        output_name: test_files
      - name: research_brief
        source: step_output
        step_id: write-brief
        output_name: research_brief
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: implementation
        type: string
      # C2: emit commit metadata so the unroller's output_producers map maps
      # commit_sha/branch/repo/work_dir → implement__rN (not the tester exit
      # node fallback). Agents populate these on Multica remote execution;
      # local runs leave them absent and ReconcileHandler no-ops cleanly.
      - name: commit_sha
        type: string
      - name: branch
        type: string
      - name: repo
        type: string
      - name: work_dir
        type: string
    optional: false
    timeout_ms: 600000

  # tdd-tester: body node that runs the tests against the current implementation
  # and emits tests_green (boolean convergence signal). Tagged sub_graph so the
  # loop expander includes it in the unrolled round copies.
  - id: tdd-tester
    agent: tester
    sub_graph: tdd-red-green-cycle
    task: >
      Run the failing tests against the current implementation. Determine whether
      all tests pass (emit tests_green: true) or any still fail (emit
      tests_green: false). Do NOT modify the tests.
    depends_on:
      - implement
    inputs:
      - name: implementation
        source: step_output
        step_id: implement
        output_name: implementation
      - name: test_files
        source: step_output
        step_id: test-spec
        output_name: test_files
    outputs:
      - name: tests_green
        type: json
    optional: false
    timeout_ms: 300000

  # tdd-red-green-loop: LOOP node — expander unrolls implement→tdd-tester up to
  # max_rounds times. Converges when tdd-tester emits tests_green: true.
  # Disabled (loops.tdd_red_green.enabled=false) → single degenerate pass.
  - id: tdd-red-green-loop
    node_type: loop
    depends_on:
      - test-spec
    loop_config:
      feature: tdd_red_green
      convergence_signal: tests_green
      sub_graph: tdd-red-green-cycle
      max_rounds: 3
      gate_predicate: "tests_green must equal true"
    timeout_ms: 600000

  # Reconcile node (s7) after implement — materialise the developer's committed
  # work into the working tree before the gate validates it.
  # C1: sha/branch/repo from implement step_output (not context) so the Multica
  # path wires the real commit metadata from MulticaAgentSpawn's return value.
  - id: reconcile-implement
    agent: reconciler
    node_type: reconcile
    step_file: hive/workflows/step-files/execute/reconcile.md
    task: >
      Materialise the implement agent's commit so the gate validates committed code.
    depends_on:
      - tdd-red-green-loop
    inputs:
      - name: sha
        source: step_output
        step_id: tdd-red-green-loop
        output_name: commit_sha
        optional: true
      - name: branch
        source: step_output
        step_id: tdd-red-green-loop
        output_name: branch
        optional: true
      - name: repo
        source: step_output
        step_id: tdd-red-green-loop
        output_name: repo
        optional: true
      - name: work_dir
        source: step_output
        step_id: tdd-red-green-loop
        output_name: work_dir
        optional: true
    outputs:
      - name: reconcile_status
        type: string
    # NON-optional barrier: ReconcileHandler is a clean no-op when sha is absent
    # (local binding); with a real sha a materialisation failure MUST fail loud,
    # not be downgraded, or downstream review reads a stale tree.
    optional: false
    timeout_ms: 120000

  # Validation gate (s3): confirm implementation exists before review.
  # Bounded retry: on gate failure the implement node re-runs up to max_attempts
  # times (single-pass TDD red→green correction; no LOOP primitive).
  - id: gate-tests
    agent: validator
    node_type: gate
    step_file: hive/workflows/step-files/execute/gate-tests.md
    gate: "implementation must not be empty"
    retry:
      max_attempts: 3
      on: gate_failed
      retry_node: implement
    task: >
      Validate that the implement step produced an implementation artifact.
      Gate blocks review from proceeding until committed code exists in the tree.
    depends_on:
      - reconcile-implement
    inputs:
      - name: implementation
        source: step_output
        step_id: tdd-red-green-loop
        output_name: implementation
    outputs:
      - name: gate_passed
        type: json
    optional: false
    timeout_ms: 60000

  - id: review
    agent: reviewer
    step_file: hive/workflows/steps/development-classic/step-06-review.md
    task: >
      Review the implementation and tests for correctness, security, performance,
      and convention compliance. Check that all acceptance criteria are satisfied.
      Verify tests are meaningful (not trivially passing). Produce a verdict:
      passed, needs_optimization, or needs_revision.
    depends_on:
      - gate-tests
      - reconcile-implement
    inputs:
      - name: implementation
        source: step_output
        step_id: tdd-red-green-loop
        output_name: implementation
      - name: test_files
        source: step_output
        step_id: test-spec
        output_name: test_files
      - name: research_brief
        source: step_output
        step_id: write-brief
        output_name: research_brief
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: review_verdict
        type: string
      - name: review_findings
        type: string
      - name: review_passed
        type: json
    optional: false
    timeout_ms: 300000

  # Enforce the shared review contract: only an explicit passed verdict may
  # integrate. needs_revision, needs_optimization, and missing/malformed
  # values all fail closed. (Auto-fix-and-re-review is the bounded
  # converge-loop follow-on, t-005/t-006.)
  - id: gate-review
    node_type: gate
    gate: "$review.output.review_passed == true"
    # Bounded-retry contract (test_classic_gate_has_bounded_retry). The walker
    # re-dispatches the SAME gate node, so re-evaluating an unchanged verdict
    # just fails identically — max_attempts:1 = fail loud immediately, no wasted
    # re-dispatch. Auto-fix-and-re-review (retry_node: review + a fix step) is
    # the bounded converge-loop follow-on, t-005/t-006.
    retry:
      max_attempts: 1
      on: gate_failed
      retry_node: review
    depends_on:
      - review
    inputs:
      - name: review_verdict
        source: step_output
        step_id: review
        output_name: review_verdict
      - name: review_passed
        source: step_output
        step_id: review
        output_name: review_passed
        optional: true
    outputs:
      - name: gate_passed
        type: json
    timeout_ms: 30000

  # gate-tests-green: terminal gate that blocks integrate when the TDD red-green
  # loop did not achieve tests_green=true within max_rounds.  Depends on the
  # reconcile-implement node (ensuring a RECONCILE node precedes this gate in
  # topological order) as well as the loop node (rewired to last round exit by
  # the expander).
  - id: gate-tests-green
    node_type: gate
    gate: "$tdd-red-green-loop.output.tests_green == true"
    retry:
      max_attempts: 1
      on: gate_failed
      retry_node: tdd-red-green-loop
    depends_on:
      - tdd-red-green-loop
      - reconcile-implement
    outputs:
      - name: gate_passed
        type: json
    timeout_ms: 60000

  - id: optimize
    agent: developer
    step_file: hive/workflows/steps/development-classic/step-07-optimize.md
    task: >
      Apply the improvements listed in the review findings. Address each
      needs_optimization item. Do not change behavior — only improve quality,
      performance, or clarity as directed. Re-verify all tests still pass.
    depends_on:
      - review
    inputs:
      - name: review_findings
        source: step_output
        step_id: review
        output_name: review_findings
      - name: implementation
        source: step_output
        step_id: tdd-red-green-loop
        output_name: implementation
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: optimized_implementation
        type: string
    optional: true
    timeout_ms: 600000

  - id: integrate
    agent: developer
    step_file: hive/workflows/steps/development-classic/step-08-integrate.md
    task: >
      Commit and integrate the implementation. Stage all changed files, write a
      clear commit message following the repository convention, and push to the
      feature branch. Verify CI passes if available. Report the commit hash and
      files changed.
    depends_on:
      - tdd-red-green-loop
      - gate-tests-green
      - gate-review
    inputs:
      - name: implementation
        source: step_output
        step_id: tdd-red-green-loop
        output_name: implementation
      - name: review_verdict
        source: step_output
        step_id: review
        output_name: review_verdict
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: commit_ref
        type: string
    optional: false
    timeout_ms: 600000
