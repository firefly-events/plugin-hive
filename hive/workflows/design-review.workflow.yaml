name: design-review
description: Target-aware UI review ceremony — accessibility and animations specialists contribute domain critiques; ui-designer synthesizes findings into a verdict. Mirrors code-review.workflow.yaml shape.
version: "1.0.0"
timeout_ms: 2700000

steps:
  - id: accessibility-critique
    agent: accessibility-specialist
    task: >
      Review the provided UI artifacts for accessibility issues and WCAG 2.1 AA compliance.
      Evaluate: ARIA patterns in any implementation referenced by the briefs, keyboard
      navigation implications of the proposed layouts, touch target sizing in wireframes,
      color contrast of the brand palette, semantic structure of the proposed UI.
      Flag any design-level decisions or implementation choices that would create
      accessibility barriers. Produce a domain critique using your Work Report format.
    depends_on: []
    inputs:
      - name: design_artifacts
        source: context
        context_key: design_artifacts
    outputs:
      - name: accessibility_critique
        type: string
    optional: true
    timeout_ms: 600000

  - id: animations-critique
    agent: animations-specialist
    task: >
      Review the provided UI artifacts for animation and motion design quality.
      Evaluate: whether proposed interactions have appropriate motion feedback,
      loading state treatments, transition quality between screens, missing
      microinteractions that would improve UX, prefers-reduced-motion considerations.
      Reference the accessibility critique (if provided) — flag any animations
      that compound accessibility issues identified there.
      Produce a domain critique using your Work Report format.
    depends_on:
      - accessibility-critique
    inputs:
      - name: design_artifacts
        source: context
        context_key: design_artifacts
      - name: accessibility_critique
        source: step_output
        step_id: accessibility-critique
        output_name: accessibility_critique
        optional: true
    outputs:
      - name: animations_critique
        type: string
    optional: true
    timeout_ms: 600000

  - id: design-critique
    agent: ui-designer
    step_file: hive/references/ui-prompts/design-review-design-critique.md
    depends_on:
      - animations-critique
    inputs:
      - name: design_artifacts
        source: context
        context_key: design_artifacts
      - name: accessibility_critique
        source: step_output
        step_id: accessibility-critique
        output_name: accessibility_critique
        optional: true
      - name: animations_critique
        source: step_output
        step_id: animations-critique
        output_name: animations_critique
        optional: true
    outputs:
      - name: design_critique
        type: string
    optional: false
    timeout_ms: 600000

  - id: synthesis
    agent: ui-designer
    step_file: hive/references/ui-prompts/design-review-synthesis.md
    depends_on:
      - accessibility-critique
      - animations-critique
      - design-critique
    inputs:
      - name: accessibility_critique
        source: step_output
        step_id: accessibility-critique
        output_name: accessibility_critique
        optional: true
      - name: animations_critique
        source: step_output
        step_id: animations-critique
        output_name: animations_critique
        optional: true
      - name: design_critique
        source: step_output
        step_id: design-critique
        output_name: design_critique
    outputs:
      - name: review_verdict
        type: string
      - name: review_summary
        type: string
    optional: false
    timeout_ms: 600000
