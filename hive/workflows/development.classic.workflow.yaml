name: development-classic
description: Classic development workflow — implement first, then test and review.
version: "2.1.0"
methodology: classic

# ENFORCEMENT RULES:
# 1. Preflight MUST pass before any other step runs
# 2. Research is skippable for low-complexity stories (orchestrator decides)
# 3. Test step MUST produce test artifacts — review is BLOCKED without them
# 4. Platform verification required for cross-platform stories
# 5. Each step MUST run as a SEPARATE agent instance — no self-review, no shared context
#    between researcher and developer (developer should not "remember" research shortcuts)
#
# AGENT ROUTING:
# Steps reference generic agent roles (e.g., "developer"). The team lead resolves
# these to specific roster agents at runtime based on the story's scope:
#   developer → frontend-developer (UI/component work) or backend-developer (API/server work)
# The generic "developer" agent is kept for backward compatibility.
#
# MULTI-DOMAIN STORIES (executor cutover, hde-10 / Order 8 / Q9 path-A):
# Multi-domain stories are decomposed at the YAML LEVEL rather than via
# orchestrator-narrated sub-steps. Two declarative nodes — `backend-implement`
# and `frontend-implement` — each gate on a `when:` predicate against
# story-domain booleans surfaced by `preflight`
# (`$preflight.output.needs_backend`, `$preflight.output.needs_frontend` —
# see `hive/references/story-spec-schema.md`). Backend-first sequencing is
# preserved by `frontend-implement.depends_on: [..., backend-implement]`.
#
# Downstream consumers (test, platform-verify, review, codex-review,
# optimize, dev-standby, integrate, doc-check) bind the `implementation`
# input from BOTH `backend-implement` and `frontend-implement` as
# `optional: true`. When a domain skips (its predicate is false), the
# binding receives None per per-input optional semantics. When BOTH
# implement nodes skip (empty-domain story), `review`'s
# `trigger_rule: none_failed_min_one_success` cascades a SKIP through
# the rest of the pipeline.
#
# The strict-Archon predicate grammar
# (`hive/references/predicate-grammar.md`) does not support `contains` or
# string membership operators. Pre-computed booleans are the canonical
# solution.

steps:
  - id: preflight
    agent: researcher
    step_file: hive/workflows/steps/development-classic/step-01-preflight.md
    task: >
      Before any implementation, verify the project is in a buildable state:
      1. Run the project's build command (from CLAUDE.md or project config)
      2. Verify critical config files exist (check story context for platform-specific files)
      3. If cross-platform: verify each platform builds independently
      4. Report: build status per platform, missing configs, blocking issues

      If preflight FAILS: halt execution. Mark story as blocked. The issue
      must be resolved before any code changes. This prevents wasting time
      implementing on a broken foundation.
    depends_on: []
    inputs:
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: preflight_status
        type: string
      # Story-domain booleans surfaced from `story.metadata` so the
      # downstream `when:` predicates on `backend-implement` /
      # `frontend-implement` can address them. See
      # `hive/references/story-spec-schema.md` for the schema and
      # step-01-preflight.md OUTPUT FORMAT for the materialisation
      # contract. Type `json` is the graph-validator container — runtime
      # values are scalar bool per the step file's declaration.
      - name: needs_backend
        type: json
      - name: needs_frontend
        type: json
    optional: false
    timeout_ms: 300000

  - id: research
    agent: researcher
    step_file: hive/workflows/steps/development-classic/step-02-research.md
    task: >
      Read the story spec and explore the codebase. Gather raw findings:
      affected files, existing patterns, architectural constraints, risks,
      reusable utilities, and external references. Deliver structured raw
      findings — do NOT write a formatted brief.

      SKIP THIS STEP for low-complexity stories. The orchestrator decides based on
      the story's complexity field. Low = skip research, read files directly.
    depends_on:
      - preflight
    inputs:
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: research_findings
        type: string
    optional: true
    skip_when: "story.complexity == 'low'"
    timeout_ms: 300000

  - id: write-brief
    agent: technical-writer
    task: >
      Receive raw research findings and produce a formatted research brief.
      Use the research-brief skill if available. The brief should be
      actionable for the developer: where to start, what to reuse, what
      to watch out for.

      This agent is short-lived: write the document, record any insights,
      then shut down.
    depends_on:
      - research
    inputs:
      - name: research_findings
        source: step_output
        step_id: research
        output_name: research_findings
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: research_brief
        type: string
    optional: true
    skip_when: "story.complexity == 'low'"
    timeout_ms: 180000

  # Q9 path-A YAML decomposition (hde-10 / Order 8): the legacy
  # `implement` step is split into two declarative nodes guarded by
  # story-domain `when:` predicates. Backend-first sequencing is the
  # historical contract; `frontend-implement.depends_on` includes
  # `backend-implement` so the front-end agent reads the back-end's
  # API surface from its output graph.
  - id: backend-implement
    agent: backend-developer
    step_file: hive/workflows/steps/development-classic/step-03-implement-backend.md
    task: >
      Implement the story per the research brief. Primary scope is the
      BACKEND (APIs, server logic, database, services, infrastructure), but
      this lane is ALSO the general/default implementer: when preflight
      classifies a story as neither backend-code nor frontend-code (e.g.
      docs, analysis, config, or a research deliverable), the work still
      belongs to a developer and lands here rather than being skipped.
    depends_on:
      - preflight
      - write-brief
    # Default-lane predicate: run when backend work is needed OR when the story
    # needs NEITHER backend nor frontend code (analysis/doc/config deliverables).
    # A story with a deliverable must never skip every implement lane and still
    # report "completed" (the ph-6 false-green class). Only a frontend-ONLY story
    # (needs_frontend && !needs_backend) skips this lane. Grammar: && binds tighter
    # than ||, no parens -> parses as (nb==true) || (nb==false && nf==false).
    when: "$preflight.output.needs_backend == true || $preflight.output.needs_backend == false && $preflight.output.needs_frontend == false"
    inputs:
      - name: research_brief
        source: step_output
        step_id: write-brief
        output_name: research_brief
        optional: true
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: implementation
        type: string
    optional: false
    timeout_ms: 600000

  - id: frontend-implement
    agent: frontend-developer
    step_file: hive/workflows/steps/development-classic/step-03-implement-frontend.md
    task: >
      Implement the FRONTEND scope of the story per the research brief.
      UI components, view layer, client-side state, presentation logic
      ONLY. Consume the backend's published API surface from
      `backend-implement.output.implementation` when needed.
    depends_on:
      - preflight
      - write-brief
      - backend-implement
    when: "$preflight.output.needs_frontend == true"
    inputs:
      - name: research_brief
        source: step_output
        step_id: write-brief
        output_name: research_brief
        optional: true
      - name: backend_implementation
        source: step_output
        step_id: backend-implement
        output_name: implementation
        optional: true
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: implementation
        type: string
    optional: false
    timeout_ms: 600000

  # Reconcile nodes (s7): materialise each implement agent's committed work into
  # the working tree before the test step validates it. No-op on local bindings
  # (sha absent) — safe to insert on both local and Multica execution paths.
  # C1: sha/branch/repo bound from the producing agent's step_output so the
  # Multica path wires the real commit metadata (not stale context values).
  - id: reconcile-backend
    agent: reconciler
    node_type: reconcile
    step_file: hive/workflows/step-files/execute/reconcile.md
    task: >
      Materialise the backend-implement agent's commit before tests run.
    depends_on:
      - backend-implement
    # Mirror backend-implement's default-lane predicate so the reconcile+test+
    # review+integrate chain runs for analysis/doc stories too (they route
    # through backend-implement as the general lane).
    when: "$preflight.output.needs_backend == true || $preflight.output.needs_backend == false && $preflight.output.needs_frontend == false"
    inputs:
      - name: sha
        source: step_output
        step_id: backend-implement
        output_name: commit_sha
        optional: true
      - name: branch
        source: step_output
        step_id: backend-implement
        output_name: branch
        optional: true
      - name: repo
        source: step_output
        step_id: backend-implement
        output_name: repo
        optional: true
      - name: work_dir
        source: step_output
        step_id: backend-implement
        output_name: work_dir
        optional: true
    outputs:
      - name: reconcile_status
        type: string
    # NON-optional barrier: ReconcileHandler no-ops cleanly when sha is absent
    # (local binding); with a real sha a materialisation failure MUST fail loud
    # so downstream test/review never read a stale tree.
    optional: false
    timeout_ms: 120000

  - id: reconcile-frontend
    agent: reconciler
    node_type: reconcile
    step_file: hive/workflows/step-files/execute/reconcile.md
    task: >
      Materialise the frontend-implement agent's commit before tests run.
    depends_on:
      - frontend-implement
    when: "$preflight.output.needs_frontend == true"
    inputs:
      - name: sha
        source: step_output
        step_id: frontend-implement
        output_name: commit_sha
        optional: true
      - name: branch
        source: step_output
        step_id: frontend-implement
        output_name: branch
        optional: true
      - name: repo
        source: step_output
        step_id: frontend-implement
        output_name: repo
        optional: true
      - name: work_dir
        source: step_output
        step_id: frontend-implement
        output_name: work_dir
        optional: true
    outputs:
      - name: reconcile_status
        type: string
    # NON-optional barrier: ReconcileHandler no-ops cleanly when sha is absent
    # (local binding); with a real sha a materialisation failure MUST fail loud
    # so downstream test/review never read a stale tree.
    optional: false
    timeout_ms: 120000

  - id: test
    agent: tester
    step_file: hive/workflows/steps/development-classic/step-05-test.md
    task: >
      Write tests for the implementation. Tests should cover the acceptance criteria
      in the story spec. Use the existing test patterns found during research. Include
      unit tests for core logic and integration tests for system boundaries. Verify
      tests pass against the implementation.

      You MUST produce test artifacts (test files). This step cannot complete
      with only a "tests look good" assessment — actual test code is required.
      The review step is BLOCKED until test artifacts exist.
    depends_on:
      - reconcile-backend
      - reconcile-frontend
    inputs:
      - name: backend_implementation
        source: step_output
        step_id: backend-implement
        output_name: implementation
        optional: true
      - name: frontend_implementation
        source: step_output
        step_id: frontend-implement
        output_name: implementation
        optional: true
      - name: research_brief
        source: step_output
        step_id: write-brief
        output_name: research_brief
        optional: true
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: test_results
        type: string
      - name: test_artifacts
        type: artifact_ref
    optional: false
    gate: "test_artifacts must not be empty"
    timeout_ms: 600000

  # Reconcile node (s7) after test — materialise tester's committed work before
  # the gate validates it. No-op on local bindings.
  # C1: sha/branch/repo from test step_output, not context.
  - id: reconcile-test
    agent: reconciler
    node_type: reconcile
    step_file: hive/workflows/step-files/execute/reconcile.md
    task: >
      Materialise the test agent's commit so the gate validates committed test files.
    depends_on:
      - test
    # C4: single-upstream (trigger_rule doesn't gate here, walker.py:~548).
    # `test` itself is a multi-upstream join (reconcile-backend/-frontend)
    # that SKIPS on an empty-domain story — but a skipped upstream still
    # falls through the legacy single-upstream RUN path unless gated here.
    # Grammar-legal null-check (predicate-grammar.md's own canonical
    # example) fail-closes to False (skip) when `test` didn't materialise.
    when: "$test.output.test_artifacts != null"
    inputs:
      - name: sha
        source: step_output
        step_id: test
        output_name: commit_sha
        optional: true
      - name: branch
        source: step_output
        step_id: test
        output_name: branch
        optional: true
      - name: repo
        source: step_output
        step_id: test
        output_name: repo
        optional: true
      - name: work_dir
        source: step_output
        step_id: test
        output_name: work_dir
        optional: true
    outputs:
      - name: reconcile_status
        type: string
    # NON-optional barrier: ReconcileHandler no-ops cleanly when sha is absent
    # (local binding); with a real sha a materialisation failure MUST fail loud
    # so downstream test/review never read a stale tree.
    optional: false
    timeout_ms: 120000

  # Validation gate (s3): confirm test artifacts exist before review.
  # Bounded retry: on gate failure the test node re-runs up to max_attempts times.
  - id: gate-code
    agent: validator
    node_type: gate
    step_file: hive/workflows/step-files/execute/gate-code.md
    gate: "test_artifacts must not be empty"
    retry:
      max_attempts: 3
      on: gate_failed
      retry_node: test
    task: >
      Validate that the test step produced test artifacts. Gate blocks review from
      proceeding until committed code and tests exist in the tree.
    depends_on:
      - reconcile-test
    # C4: single-upstream twin of reconcile-test's `when:` above — without
    # it, an empty-domain story's skipped `test` still reaches GateHandler,
    # which hard-fails on the empty `test_artifacts` instead of skipping.
    when: "$test.output.test_artifacts != null"
    inputs:
      - name: test_artifacts
        source: step_output
        step_id: test
        output_name: test_artifacts
    outputs:
      - name: gate_passed
        type: json
    optional: false
    timeout_ms: 60000

  - id: platform-verify
    agent: tester
    step_file: hive/workflows/steps/development-classic/step-04-platform-verify.md
    task: >
      For cross-platform stories: build and run on EACH target platform to verify
      the implementation works everywhere, not just where it was developed.

      1. Identify target platforms from story spec and project profile
      2. Build on each platform (e.g., ./gradlew assembleDebug, xcodebuild)
      3. Run platform-specific tests if they exist
      4. Report: pass/fail per platform with any platform-specific issues

      SKIP THIS STEP if the story is single-platform or backend-only.
    depends_on:
      - gate-code
    # C4: single-upstream twin of gate-code's `when:` — gate-code SKIPPING
    # on an empty-domain story must not let platform-verify still RUN
    # (which would hand review a completed upstream and defeat the
    # none_failed_min_one_success skip cascade at review's join).
    when: "$test.output.test_artifacts != null"
    inputs:
      - name: backend_implementation
        source: step_output
        step_id: backend-implement
        output_name: implementation
        optional: true
      - name: frontend_implementation
        source: step_output
        step_id: frontend-implement
        output_name: implementation
        optional: true
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: platform_results
        type: string
    optional: true
    skip_when: "story is single-platform or backend-only"
    timeout_ms: 600000

  - id: review
    agent: reviewer
    step_file: hive/workflows/steps/development-classic/step-06-review.md
    task: >
      Review the implementation AND tests for correctness, security, performance,
      and convention compliance. Check that all acceptance criteria are satisfied.

      GATE: This step MUST NOT run unless the test step produced actual test
      artifacts. If test_artifacts is empty, reject and send back to test step.

      If platform-verify ran, review those results too — flag any platform
      where builds failed or tests didn't pass.

      The reviewer MUST be a different agent instance than the developer.

      Produce a verdict: passed, needs_optimization, or needs_revision.

      EMIT review_passed (the convergence signal consumed by gate-review):
      set review_passed=true when the verdict is passed OR needs_optimization
      (needs_optimization is non-blocking nits/suggestions, not a defect);
      set it false only for needs_revision. This MUST match review_verdict —
      the terminal gate permits integration only when both values agree.
      Missing, malformed, or inconsistent values fail closed.
    depends_on:
      - gate-code
      - platform-verify
      - reconcile-backend
      - reconcile-frontend
    inputs:
      - name: backend_implementation
        source: step_output
        step_id: backend-implement
        output_name: implementation
        optional: true
      - name: frontend_implementation
        source: step_output
        step_id: frontend-implement
        output_name: implementation
        optional: true
      - name: test_results
        source: step_output
        step_id: test
        output_name: test_results
      - name: test_artifacts
        source: step_output
        step_id: test
        output_name: test_artifacts
      - name: platform_results
        source: step_output
        step_id: platform-verify
        output_name: platform_results
        # optional: platform-verify is an optional node (skip_when can short-circuit it);
        # when it skips or returns no platform_results, review continues with None.
        optional: true
      - name: research_brief
        source: step_output
        step_id: write-brief
        output_name: research_brief
        optional: true
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: review_verdict
        type: string
      - name: review_findings
        type: string
      - name: review_passed
        type: json
    optional: false
    timeout_ms: 300000

  - id: codex-review
    agent: reviewer
    task: >
      Run a Codex adversarial review on the implementation using the codex
      companion script. This provides a second-model perspective after the
      Claude review — different training, different blind spots.

      Execute:
      ```
      node "{codex-companion-path}" adversarial-review "--scope auto"
      ```

      Parse the Codex output. If it finds P1 or P2 issues:
      - Add them to codex_findings
      - Set codex_verdict to "needs_attention"
      If no significant issues: set codex_verdict to "passed"

      This step is OPTIONAL — controlled by hive.config.yaml external_models.codex.enabled.
      Skip silently if Codex is not enabled, not installed, or not authenticated.
    depends_on:
      - review
    # C4: single-upstream (trigger_rule doesn't gate here) — without this,
    # an empty-domain story's skipped `review` still lets codex-review RUN,
    # which would hand downstream multi-upstream joins (optimize, integrate)
    # a completed upstream and defeat the skip cascade below `test`.
    when: "$test.output.test_artifacts != null"
    inputs:
      - name: backend_implementation
        source: step_output
        step_id: backend-implement
        output_name: implementation
        optional: true
      - name: frontend_implementation
        source: step_output
        step_id: frontend-implement
        output_name: implementation
        optional: true
      - name: review_verdict
        source: step_output
        step_id: review
        output_name: review_verdict
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: codex_verdict
        type: string
      - name: codex_findings
        type: string
    optional: true
    skip_when: "external_models.codex.enabled is false or Codex CLI is not installed"
    timeout_ms: 300000

  - id: optimize
    agent: developer
    step_file: hive/workflows/steps/development-classic/step-07-optimize.md
    task: >
      Apply the improvements listed in the review findings. Address each
      needs_optimization item. Do not change behavior — only improve quality,
      performance, or clarity as directed. Re-verify that acceptance criteria
      are still satisfied after changes. If Codex review found additional issues,
      address those as well.
    depends_on:
      - review
      - codex-review
    inputs:
      - name: review_findings
        source: step_output
        step_id: review
        output_name: review_findings
      - name: codex_findings
        source: step_output
        step_id: codex-review
        output_name: codex_findings
        optional: true
      - name: backend_implementation
        source: step_output
        step_id: backend-implement
        output_name: implementation
        optional: true
      - name: frontend_implementation
        source: step_output
        step_id: frontend-implement
        output_name: implementation
        optional: true
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: optimized_implementation
        type: string
    optional: true
    timeout_ms: 600000

  - id: dev-standby
    agent: developer
    step_file: hive/workflows/steps/development-classic/step-05b-dev-standby.md
    task: >
      Stay idle while the test swarm runs. The dev agent has full
      implementation context and can fix bugs faster than a cold agent.
      Receive bug reports from sentinel via SendMessage. Fix, re-test,
      report back. Circuit breaker: max 3 fix attempts per bug.
      Only shut down when all tests green or circuit breaker trips.
    depends_on:
      - review
    # C4: single-upstream twin of codex-review's `when:` above.
    when: "$test.output.test_artifacts != null"
    inputs:
      - name: backend_implementation
        source: step_output
        step_id: backend-implement
        output_name: implementation
        optional: true
      - name: frontend_implementation
        source: step_output
        step_id: frontend-implement
        output_name: implementation
        optional: true
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: fix_report
        type: string
    optional: true
    skip_when: "no test swarm is running for this story"
    timeout_ms: 1800000

  # ── review-fix-cycle body nodes (sub_graph: review-fix-cycle) ──────────────
  # These two steps form the iterated body of review-converge-loop. They are
  # separate from the pre-loop `review` step so that `codex-review`, `optimize`,
  # `dev-standby`, and other post-review steps continue to bind from the stable
  # pre-loop step ID.
  #
  # fix-cycle-implement: developer addresses the findings from the previous review
  # round and commits the updated implementation.
  - id: fix-cycle-implement
    agent: developer
    sub_graph: review-fix-cycle
    task: >
      Apply the changes requested by the reviewer. Address every needs_revision
      finding. Commit the updated implementation so the next review step can
      inspect it. Do not change the acceptance criteria — only fix the issues
      raised.
    depends_on:
      - review
    # C4: single-upstream loop-entry twin of codex-review's `when:` above.
    # copy.deepcopy in unroll.py propagates this onto round 1's node.when
    # (fix-cycle-implement__r1), so the whole review-fix-cycle loop
    # properly skips instead of running when `review` itself skipped.
    when: "$test.output.test_artifacts != null"
    inputs:
      - name: review_findings
        source: step_output
        step_id: review
        output_name: review_findings
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: fix_implementation
        type: string
    timeout_ms: 600000

  # fix-cycle-review: reviewer checks the updated implementation and emits
  # review_passed (bool) as the convergence signal. True for passed or
  # needs_optimization (Hive's own non-blocking verdict) → rounds K+1..N
  # skip; false only for needs_revision → the loop continues (up to
  # max_rounds ceiling).
  - id: fix-cycle-review
    agent: reviewer
    sub_graph: review-fix-cycle
    task: >
      Review the exact updated implementation commit identified by reviewed_sha
      and produced by this round's fix-cycle-implement step.
      Check that all needs_revision findings from the previous round have been
      addressed. Produce a verdict: passed, needs_optimization, or needs_revision.
      Set review_passed=true when the verdict is passed or needs_optimization;
      set it false only for needs_revision. The two outputs must
      agree; malformed or inconsistent output is rejected by gate-review.
    depends_on:
      - fix-cycle-implement
    # pr20-fable-review M3: single-upstream twin of fix-cycle-implement's
    # `when:` above (which mirrors codex-review's `when:` further up).
    # Without this, an empty-domain story skips fix-cycle-implement, but
    # fix-cycle-review is single-upstream (legacy RUN path, not a
    # multi-upstream join) — its k>1 skip_when OR-chain resolves a missing
    # upstream field to RUN, so every reviewer round would run with no
    # implementation to review, defeating the C4 skip cascade through
    # `integrate`'s join.
    when: "$test.output.test_artifacts != null"
    inputs:
      - name: reviewed_sha
        source: step_output
        step_id: fix-cycle-implement
        output_name: commit_sha
        # Local bindings can modify the shared tree without emitting git
        # metadata; Multica supplies this from its harvested work_dir HEAD.
        optional: true
      - name: fix_implementation
        source: step_output
        step_id: fix-cycle-implement
        output_name: fix_implementation
        # optional: fix-cycle-implement may return None if no code was changed;
        # the reviewer inspects the committed diff directly.
        optional: true
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: review_verdict
        type: string
      - name: review_findings
        type: string
      # s3-convergence-signal: boolean convergence signal. Consumed by the
      # loop skip_when predicate to short-circuit subsequent rounds.
      - name: review_passed
        type: json
    timeout_ms: 300000

  # #16 (t-006): bounded converge-loop — replaces the needs_revision hard-halt
  # (max_attempts: 1). The LOOP primitive iterates the review↔fix sub-graph
  # until review_verdict is not needs_revision OR max_rounds is exhausted,
  # then returns the last output without hard-failing (t-005 ceiling semantics).
  - id: review-converge-loop
    node_type: loop
    loop_config:
      sub_graph: review-fix-cycle
      gate_predicate: "review_verdict not equals needs_revision"
      max_rounds: 3
      feature: review_converge
      convergence_signal: review_passed
    depends_on:
      - review
    inputs:
      - name: review_verdict
        source: step_output
        step_id: review
        output_name: review_verdict
    outputs:
      - name: last_output
        type: json
      - name: review_verdict
        type: string
      - name: review_passed
        type: json

  # ── Terminal safety gate (prod bug #26): after the bounded converge-loop, a
  # final verdict that is neither passed NOR needs_optimization must BLOCK
  # integrate — bounded retries do not license silent integration of an
  # unresolved (needs_revision) review. Single-shot (max_attempts: 1) —
  # re-evaluating an unchanged verdict just fails identically.
  # review-converge-loop surfaces the last successful round's verdict and
  # review_passed signal. The grammar gate reads the boolean signal while the
  # handler validates the paired verdict, so a loop that revises
  # needs_revision → passed (or → needs_optimization) may integrate and
  # needs_revision alone blocks.
  #
  # s2-needs-optimization-passes-gate: needs_optimization is Hive's own
  # non-blocking verdict (nits/suggestions, not defects) and SATISFIES this
  # gate exactly like passed; only needs_revision (or a missing/malformed
  # signal) blocks. Pass-set is exactly {passed, needs_optimization} — see
  # gate.py's _PASS_VERDICTS.
  - id: gate-review
    node_type: gate
    # Terminal safety gate (prod bug #26 + the ph-8/ph-9 silent-pass bug).
    # Grammar-valid boolean gate. GateHandler validates the paired
    # review_verdict/review_passed outputs before evaluating this predicate:
    # review_passed must be true iff review_verdict is passed OR
    # needs_optimization, preserving the fail-closed policy without adding
    # string literals to the predicate grammar.
    gate: "$review-converge-loop.output.review_passed == true"
    retry:
      max_attempts: 1
      on: gate_failed
      retry_node: review
    depends_on:
      - review-converge-loop
    # C4: single-upstream (post-unroll the loop's last round is still a
    # single dep) twin of codex-review's `when:` above — without it, an
    # empty-domain story's skipped review chain still lets gate-review
    # attempt its predicate against never-materialised loop output.
    when: "$test.output.test_artifacts != null"
    inputs:
      - name: review_verdict
        source: step_output
        step_id: review-converge-loop
        output_name: review_verdict
      - name: review_passed
        source: step_output
        step_id: review-converge-loop
        output_name: review_passed
    outputs:
      - name: gate_passed
        type: json
    timeout_ms: 30000

  - id: integrate
    agent: developer
    step_file: hive/workflows/steps/development-classic/step-08-integrate.md
    task: >
      Commit and integrate the implementation. Stage all changed files, write a
      clear commit message following the repository convention, and push to the
      feature branch. Verify CI passes if available. Report the commit hash and
      files changed.
    depends_on:
      - review
      - codex-review
      - dev-standby
      - review-converge-loop
      - gate-review
    inputs:
      - name: backend_implementation
        source: step_output
        step_id: backend-implement
        output_name: implementation
        optional: true
      - name: frontend_implementation
        source: step_output
        step_id: frontend-implement
        output_name: implementation
        optional: true
      - name: review_verdict
        source: step_output
        step_id: review-converge-loop
        output_name: review_verdict
      - name: codex_verdict
        source: step_output
        step_id: codex-review
        output_name: codex_verdict
        optional: true
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: commit_ref
        type: string
    optional: false
    timeout_ms: 600000

  - id: doc-check
    agent: technical-writer
    task: >
      After integration, check whether the changes require documentation updates.
      Scan the implementation diff and story spec. Ask:

      1. Did we add, rename, or remove a public-facing feature, command, or config option?
      2. Did we change agent behavior, workflow phases, or planning process?
      3. Did we add new reference docs, skills, or agents?
      4. Did we change file paths, storage locations, or directory structure?

      If YES to any: identify which docs need updating (README, GUIDE, reference docs,
      config comments) and produce a brief update plan. If the structured outline
      flagged documentation impact, start from that list.

      If NO to all: report "no doc updates needed" and shut down.

      This is a lightweight check — not a full rewrite. Flag what needs changing
      so it can be addressed before the story is considered complete.
    depends_on:
      - integrate
    # C4: single-upstream twin of codex-review's `when:` above — `integrate`
    # SKIPping (multi-upstream trigger_rule, once its own upstreams are
    # properly gated) still falls through to RUN here without this.
    when: "$test.output.test_artifacts != null"
    inputs:
      - name: backend_implementation
        source: step_output
        step_id: backend-implement
        output_name: implementation
        optional: true
      - name: frontend_implementation
        source: step_output
        step_id: frontend-implement
        output_name: implementation
        optional: true
      - name: commit_ref
        source: step_output
        step_id: integrate
        output_name: commit_ref
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: doc_update_plan
        type: string
    optional: true
    skip_when: "story.complexity == 'low'"
    timeout_ms: 180000
