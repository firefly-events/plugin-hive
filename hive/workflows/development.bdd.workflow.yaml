name: development-bdd
description: BDD development workflow — behavior specs first, then implement and test.
version: "1.0.0"
methodology: bdd

# AGENT ROUTING:
# Steps reference generic agent roles (e.g., "developer"). The team lead resolves
# these to specific roster agents at runtime based on the story's scope:
#   developer → frontend-developer (UI/component work) or backend-developer (API/server work)

steps:
  - id: research
    agent: researcher
    task: >
      Read the story spec and explore the codebase. Gather raw findings:
      affected files, existing patterns, architectural constraints, risks,
      reusable utilities, and external references. Deliver structured raw
      findings — do NOT write a formatted brief.
    depends_on: []
    inputs:
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: research_findings
        type: string
    optional: false
    timeout_ms: 300000

  - id: write-brief
    agent: technical-writer
    task: >
      Receive raw research findings and produce a formatted research brief.
      Use the research-brief skill if available. The brief should be
      actionable for the analyst and developer: where to start, what to reuse,
      what to watch out for.
    depends_on:
      - research
    inputs:
      - name: research_findings
        source: step_output
        step_id: research
        output_name: research_findings
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: research_brief
        type: string
    optional: false
    timeout_ms: 180000

  - id: behavior-spec
    agent: analyst
    task: >
      Write formal behavior specifications in Given/When/Then format from the
      story spec and research brief. Each acceptance criterion becomes one or
      more scenarios. Cover the happy path, error cases, and edge cases. These
      specs drive both implementation and testing — they are the contract.
    depends_on:
      - write-brief
    inputs:
      - name: research_brief
        source: step_output
        step_id: write-brief
        output_name: research_brief
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: behavior_specs
        type: string
    optional: false
    timeout_ms: 300000

  - id: implement
    agent: developer
    task: >
      Implement the story to satisfy the behavior specifications. Each Given/When/Then
      scenario must be satisfied by the implementation. Follow existing patterns
      identified in the research phase. Write clean, minimal code.
    depends_on:
      - behavior-spec
    inputs:
      - name: behavior_specs
        source: step_output
        step_id: behavior-spec
        output_name: behavior_specs
      - name: research_brief
        source: step_output
        step_id: write-brief
        output_name: research_brief
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: implementation
        type: string
    optional: false
    timeout_ms: 600000

  # Reconcile node (s2): materialise the implement agent's committed work into
  # the working tree before test and review run. No-op on local bindings
  # (sha absent). C1: sha/branch/repo bound from implement step_output so the
  # Multica path wires the real commit metadata.
  - id: reconcile-implement
    agent: reconciler
    node_type: reconcile
    step_file: hive/workflows/step-files/execute/reconcile.md
    task: >
      Materialise the implement agent's commit before test and review run.
    depends_on:
      - implement
    inputs:
      - name: sha
        source: step_output
        step_id: implement
        output_name: commit_sha
        optional: true
      - name: branch
        source: step_output
        step_id: implement
        output_name: branch
        optional: true
      - name: repo
        source: step_output
        step_id: implement
        output_name: repo
        optional: true
      - name: work_dir
        source: step_output
        step_id: implement
        output_name: work_dir
        optional: true
    outputs:
      - name: reconcile_status
        type: string
    # NON-optional barrier: ReconcileHandler is a clean no-op when sha is absent
    # (local binding), so this never spuriously fails there. With a real sha, a
    # materialisation failure MUST fail the run loud — not be downgraded — or
    # review/test downstream read a stale tree.
    optional: false
    timeout_ms: 120000

  - id: test
    agent: tester
    task: >
      Derive tests from the behavior specifications. Each Given/When/Then scenario
      becomes one or more test cases. Tests verify the implementation satisfies
      the behavior contract. Use existing test patterns from the research brief.
      Verify all tests pass.
    depends_on:
      - reconcile-implement
    inputs:
      - name: behavior_specs
        source: step_output
        step_id: behavior-spec
        output_name: behavior_specs
      - name: implementation
        source: step_output
        step_id: implement
        output_name: implementation
      - name: research_brief
        source: step_output
        step_id: write-brief
        output_name: research_brief
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: test_results
        type: string
    optional: false
    timeout_ms: 600000

  # ── bdd-converge-cycle body nodes ──────────────────────────────────────────
  # These two steps form the iterated body of bdd-converge-loop. The loop
  # iterates bdd-implement→bdd-test until bdd-test emits behavior_satisfied=true
  # or max_rounds is exhausted. s3-convergence-signal: each round k>1 carries
  # skip_when referencing the prior round's bdd-test output so that once
  # behavior_satisfied=true the remaining rounds are short-circuited.

  - id: bdd-implement
    agent: developer
    sub_graph: bdd-converge-cycle
    task: >
      Implement or refine the code to satisfy the behavior specifications. Each
      Given/When/Then scenario must pass. In rounds after the first, address the
      failing scenarios reported by the tester. Commit the updated implementation.
    depends_on:
      - implement
    inputs:
      - name: behavior_specs
        source: step_output
        step_id: behavior-spec
        output_name: behavior_specs
      - name: implementation
        source: step_output
        step_id: implement
        output_name: implementation
        optional: true
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: implementation
        type: string
    optional: false
    timeout_ms: 600000

  - id: bdd-test
    agent: tester
    sub_graph: bdd-converge-cycle
    task: >
      Verify the implementation satisfies all Given/When/Then behavior specifications.
      Run the full scenario suite. Emit behavior_satisfied=true when ALL scenarios
      pass; emit behavior_satisfied=false when any scenario fails. Report failing
      scenarios so the next round's implementer can address them.
    depends_on:
      - bdd-implement
    inputs:
      - name: behavior_specs
        source: step_output
        step_id: behavior-spec
        output_name: behavior_specs
      - name: implementation
        source: step_output
        step_id: bdd-implement
        output_name: implementation
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: test_results
        type: string
      - name: behavior_satisfied
        type: json
    optional: false
    timeout_ms: 600000

  # s6: BDD convergence loop — the implement→test cycle iterates until
  # bdd-test emits behavior_satisfied=true or max_rounds is exhausted.
  # Static unroll (s2): each round-copy carries skip_when that short-circuits
  # when behavior_satisfied was achieved in the prior round.
  - id: bdd-converge-loop
    node_type: loop
    loop_config:
      sub_graph: bdd-converge-cycle
      feature: bdd_converge
      convergence_signal: behavior_satisfied
      max_rounds: 3
    depends_on:
      - implement

  # Terminal gate (s6): after the convergence loop, blocks integrate when
  # behavior_satisfied is not true at the ceiling. The predicate is rewritten
  # after unrolling to reference the last round's bdd-test output (s3).
  - id: gate-bdd
    node_type: gate
    gate: "$bdd-converge-loop.output.behavior_satisfied == true"
    depends_on:
      - bdd-converge-loop
    outputs:
      - name: gate_passed
        type: json
    timeout_ms: 30000

  - id: review
    agent: reviewer
    step_file: hive/workflows/steps/development-classic/step-06-review.md
    task: >
      Review the implementation, tests, and behavior specs for correctness,
      security, performance, and convention compliance. Check that all behavior
      scenarios are covered by tests and satisfied by implementation. Produce
      a verdict: passed, needs_optimization, or needs_revision. EMIT the paired
      review_passed convergence signal: true when the verdict is passed OR
      needs_optimization (non-blocking), false only for needs_revision. It MUST
      match review_verdict — inconsistent values fail closed at gate-review.
    depends_on:
      - test
      - reconcile-implement
    inputs:
      - name: implementation
        source: step_output
        step_id: implement
        output_name: implementation
      - name: test_results
        source: step_output
        step_id: test
        output_name: test_results
      - name: behavior_specs
        source: step_output
        step_id: behavior-spec
        output_name: behavior_specs
      - name: research_brief
        source: step_output
        step_id: write-brief
        output_name: research_brief
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: review_verdict
        type: string
      - name: review_findings
        type: string
      - name: review_passed
        type: json
    optional: false
    timeout_ms: 300000

  # Enforce the shared review contract: passed and needs_optimization (Hive's
  # own non-blocking verdict) both satisfy the gate; needs_revision and
  # missing/malformed values fail closed. (Auto-fix-and-re-review is the
  # bounded converge-loop follow-on, t-005/t-006.)
  - id: gate-review
    node_type: gate
    gate: "$review.output.review_passed == true"
    # Bounded-retry contract (test_classic_gate_has_bounded_retry). The walker
    # re-dispatches the SAME gate node, so re-evaluating an unchanged verdict
    # just fails identically — max_attempts:1 = fail loud immediately, no wasted
    # re-dispatch. Auto-fix-and-re-review (retry_node: review + a fix step) is
    # the bounded converge-loop follow-on, t-005/t-006.
    retry:
      max_attempts: 1
      on: gate_failed
      retry_node: review
    depends_on:
      - review
    inputs:
      - name: review_verdict
        source: step_output
        step_id: review
        output_name: review_verdict
      - name: review_passed
        source: step_output
        step_id: review
        output_name: review_passed
        optional: true
    outputs:
      - name: gate_passed
        type: json
    timeout_ms: 30000

  - id: optimize
    agent: developer
    task: >
      Apply the improvements listed in the review findings. Address each
      needs_optimization item. Do not change behavior — only improve quality,
      performance, or clarity as directed. Re-verify all tests still pass.
    depends_on:
      - review
    inputs:
      - name: review_findings
        source: step_output
        step_id: review
        output_name: review_findings
      - name: implementation
        source: step_output
        step_id: implement
        output_name: implementation
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: optimized_implementation
        type: string
    optional: true
    timeout_ms: 600000

  - id: integrate
    agent: developer
    task: >
      Commit and integrate the implementation. Stage all changed files, write a
      clear commit message following the repository convention, and push to the
      feature branch. Verify CI passes if available. Report the commit hash and
      files changed.
    depends_on:
      - review
      - gate-review
      - bdd-converge-loop
      - gate-bdd
    inputs:
      - name: implementation
        source: step_output
        step_id: implement
        output_name: implementation
      - name: review_verdict
        source: step_output
        step_id: review
        output_name: review_verdict
      - name: story_spec
        source: context
        context_key: story_spec
    outputs:
      - name: commit_ref
        type: string
    optional: false
    timeout_ms: 600000
