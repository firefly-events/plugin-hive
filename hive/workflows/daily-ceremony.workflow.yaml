name: daily-ceremony
description: Daily orchestrator ceremony — standup, planning, execution, testing, push.
version: "2.1.0"

# This workflow runs at session start with a fresh 1M Opus orchestrator.
# It is NOT a development workflow — it coordinates the day's work.
#
# TASK TRACKING MODES:
# The ceremony works in two modes based on hive.config.yaml task_tracking.adapter:
#
#   adapter: null (default) — LOCAL MODE
#     All tracking via status markers (.pHive/episodes/) and cycle state (.pHive/cycle-state/).
#     Blockers surfaced via cycle state "blocked" status. No external tool required.
#
#   adapter: linear — LINEAR MODE
#     Local tracking PLUS Linear board integration. Tickets created, claimed, transitioned.
#     See references/linear-integration.md and linear-commands.md.
#
# Every phase below has two sections:
#   - Core operations (always run)
#   - External tracker operations (only when adapter is configured)
#
# STRUCTURE NOTE (hde-0 prep):
# This workflow was normalized from a top-level `phases:` shape to flat `steps:`
# matching every other workflow in this directory. Phase identity is preserved
# via step-id prefixes (standup-*, planning-*, execution-*) and via single
# barrier steps (commit, test-handoff, fix-loop, final-review, push) for
# phases that previously had no child steps. Inter-phase ordering is preserved
# via inter-step depends_on between barrier steps. No behavior change.

steps:
  # ── standup phase ─────────────────────────────────────────────────────
  - id: standup-load-state
    step_file: hive/workflows/steps/daily-ceremony/step-01-load-state.md
    agent: orchestrator
    depends_on: []

  - id: standup-load-memories
    step_file: hive/workflows/steps/daily-ceremony/step-02-load-memories.md
    agent: orchestrator
    depends_on: [standup-load-state]

  - id: standup-present-standup
    step_file: hive/workflows/steps/daily-ceremony/step-03-present-standup.md
    agent: orchestrator
    depends_on: [standup-load-memories]

  # ── interactive-routing phase (Phase 1.5 — opt-in) ───────────────────
  # Enabled when /standup is invoked with --interactive OR when
  # standup.interactive_default: true is set in hive.config.yaml.
  # When neither is set this step is skipped and the workflow is
  # byte-equivalent to its pre-A.1 form.
  - id: interactive-routing
    step_file: hive/workflows/steps/daily-ceremony/step-interactive-routing.md
    agent: orchestrator
    depends_on: [standup-present-standup]
    when: "args.interactive or config.standup.interactive_default"

  # ── planning phase ────────────────────────────────────────────────────
  - id: planning-select-work
    step_file: hive/workflows/steps/daily-ceremony/step-04-select-work.md
    agent: orchestrator
    depends_on: [standup-present-standup, interactive-routing?]

  - id: planning-validate-stories
    step_file: hive/workflows/steps/daily-ceremony/step-05-validate-stories.md
    agent: analyst
    depends_on: [planning-select-work]

  # plan-approval was previously prose-narrated through
  # step-06-approve-plan.md — the orchestrator paused, presented the plan,
  # and waited for the user's "yes/approve/go". Under the executor it is a
  # declarative `node_type: pause` step. The operator approval signal is
  # written at `<runs_root>/<run_id>/pause/plan-approval.approve` with the
  # signed token from the `pause_suspended` telemetry event; rejection is
  # the matching `.reject` sentinel. The original step file is preserved
  # as the operator-facing presentation script (loaded as `task`) so the
  # plan view is unchanged.
  - id: plan-approval
    node_type: pause
    under_scheduler:
      auto_approve: true
    agent: orchestrator
    depends_on: [planning-select-work, planning-validate-stories]
    step_file: hive/workflows/steps/daily-ceremony/step-06-approve-plan.md
    task: >
      Pause for explicit plan approval. Present the validated plan
      (work list + validation results + cross-cutting concerns) per
      step-06-approve-plan.md, then write
      `<runs_root>/<run_id>/pause/plan-approval.approve` (token from
      `pause_suspended`) to resume, or `.reject` to halt the cycle.

  # ── execution phase ───────────────────────────────────────────────────
  - id: execution-kick-off
    step_file: hive/workflows/steps/daily-ceremony/step-07-kick-off.md
    agent: orchestrator
    depends_on: [plan-approval]

  # ── commit phase (no child steps in original; barrier step) ───────────
  - id: commit
    agent: orchestrator
    depends_on: [execution-kick-off]
    task: >
      After dev execution completes, commit all changes before testing.
      Clean checkpoint — fixes are separate commits for traceability.

      CORE (always):
      - Commit with descriptive message referencing epic and stories

      EXTERNAL TRACKER (when adapter configured):
      - Include ticket ID in commit message (enables auto-link)
      - Linear: "Refs: {TEAM}-{N}" in commit message

  # ── test-handoff phase (no child steps in original; barrier step) ─────
  - id: test-handoff
    agent: orchestrator
    depends_on: [commit]
    task: >
      Hand off to the test swarm. Package story specs, implementation artifacts,
      cycle state, and acceptance criteria.

      CORE (always):
      - Create cross-swarm handoff (see references/cross-swarm-handoff.md)
      - Run test swarm pipeline (test-swarm.workflow.yaml):
        context → baseline → author tests → validate coverage
        → execute (parallel platforms) → file bugs → report
      - High-severity bugs escalate to human
      - Low-severity bugs auto-route to dev queue

      EXTERNAL TRACKER (when adapter configured):
      - Move ticket to In Review status
      - Linear: see references/linear-integration.md (Test Handoff section)

  # ── fix-loop phase (no child steps in original; barrier step) ─────────
  - id: fix-loop
    agent: orchestrator
    depends_on: [test-handoff]
    task: >
      If the test swarm filed bugs that were auto-routed to the dev queue:

      CORE (always):
      1. Dev team picks up each bug
      2. Implements fix
      3. Commits the fix (separate commit per fix)
      4. Re-runs affected tests to verify
      5. If all resolved → proceed to final review
      6. If unresolved → surface for tomorrow's standup

      EXTERNAL TRACKER (when adapter configured):
      - Create bug sub-tickets for test failures
      - Close bug tickets when fixed
      - Linear: see references/linear-integration.md (Fix Loop section)

      TERMINAL ISSUES (both modes):
      If a bug cannot be resolved by a development fix:
      1. STOP the fix loop for that story
      2. Mark the story as BLOCKED in cycle state
      3. If adapter configured: escalate ticket with full context
         If no adapter: write blocked status to cycle state with context
      4. Notify the user directly (don't bury it in a report)
      5. Continue with any remaining non-blocked work
      6. Blocked items surface in tomorrow's standup

  # ── final-review phase (no child steps in original; barrier step) ─────
  - id: final-review
    agent: orchestrator
    depends_on: [fix-loop]
    task: >
      After all tests pass and fixes are committed, run a final code review.
      Last quality gate before code leaves the machine.

      CORE (always):
      - Use code-review.workflow.yaml (analyze → review → summarize)
      - Review the full session diff (all dev work + fixes)
      - If needs_revision → back to fix-loop
      - If passed → proceed to push

      No external tracker operations — this is a code review gate only.

  # ── push phase (no child steps in original; barrier step) ─────────────
  - id: push
    agent: orchestrator
    depends_on: [final-review]
    task: >
      Push all committed work to the remote branch.

      CORE (always):
      - Only push after: tests pass + review passes + no blocked stories
      - If feature branch: create PR via gh CLI
      - If main: push with user confirmation

      EXTERNAL TRACKER (when adapter configured):
      - Branch naming triggers auto-link (PR linked to ticket)
      - On merge: ticket auto-closes (native integration handles this)
      - No manual ticket update needed

  # ── session-end phase (single child step; id retained as session-end) ─
  - id: session-end
    step_file: hive/workflows/steps/daily-ceremony/step-08-session-end.md
    agent: orchestrator
    depends_on: [push]
