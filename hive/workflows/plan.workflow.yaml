name: plan
description: >
  Plan flow graph — decompose a requirement into a committed epic with
  dependency-tracked stories.
  Shape: research ‖ design → design-gate → author → user gates → reconcile
  → output-validation gate.
  User-facing review gates halt through user_gate pause sentinels on the
  graduated DAG path; the default narrated path remains orchestrator-local.
version: "1.0.0"

steps:
  # ── Phase A: research (runs in parallel with design) ────────────────────────
  - id: research
    agent: researcher
    node_type: agent
    step_file: hive/workflows/step-files/plan/research.md
    depends_on: []
    inputs:
      - name: requirement
        source: context
        context_key: requirement
    outputs:
      - name: research_brief
        type: string
    # Bounded retry re-dispatches on a transient AGENT failure (Multica task
    # terminal status != completed -> AgentHandlerError). Does NOT cover the
    # "completed but produced nothing" author under-run (no exception raised);
    # that is an agent-reliability issue tracked separately, not a force-stop.
    retry:
      max_attempts: 3
      on: agent_failed
    timeout_ms: 1800000

  # ── Phase B: design discussion (runs in parallel with research) ──────────────
  - id: design
    agent: architect
    node_type: agent
    step_file: hive/workflows/step-files/plan/design.md
    depends_on: []
    inputs:
      - name: requirement
        source: context
        context_key: requirement
    outputs:
      - name: design_discussion
        type: string
    retry:  # bounded retry on transient AGENT failure (status != completed)
      max_attempts: 3
      on: agent_failed
    timeout_ms: 1800000

  # ── Phase B.5: design user-gate (always-halt — design runs parallel to research
  #   and cannot emit a trustworthy confidence score; human review required) ───
  - id: design-gate
    agent: architect
    node_type: user_gate
    # No auto_pass_when → always-halt (design lacks full research context)
    depends_on:
      - design
    inputs:
      - name: design_discussion
        source: step_output
        step_id: design
        output_name: design_discussion
    outputs:
      - name: gate_verdict
        type: string
    timeout_ms: 1800000

  # ── Phase C: story decomposition + epic authoring ───────────────────────────
  - id: author
    agent: technical-writer
    node_type: agent
    step_file: hive/workflows/step-files/plan/author.md
    depends_on:
      - research
      - design-gate
    inputs:
      - name: research_brief
        source: step_output
        step_id: research
        output_name: research_brief
      - name: design_discussion
        source: step_output
        step_id: design
        output_name: design_discussion
      - name: requirement
        source: context
        context_key: requirement
    outputs:
      - name: epic_dir
        type: string
      - name: commit_sha
        type: string
      - name: branch
        type: string
      - name: repo
        type: string
      - name: work_dir
        type: string
    retry:  # author is heaviest; retry transient AGENT failures (not under-runs)
      max_attempts: 4
      on: agent_failed
    timeout_ms: 3600000

  # ── Phase C.5: H/V signal producer (confidence-scored) ─────────────────────
  - id: hv
    agent: technical-writer
    node_type: agent
    step_file: hive/workflows/step-files/plan/hv.md
    depends_on:
      - author
    inputs:
      - name: epic_dir
        source: step_output
        step_id: author
        output_name: epic_dir
    outputs:
      - name: confidence
        type: json
      - name: first_run
        type: json
    timeout_ms: 1800000

  # ── Phase C.6: H/V user-gate (confidence-scored) ───────────────────────────
  - id: hv-gate
    agent: technical-writer
    node_type: user_gate
    auto_pass_when: "$hv.output.first_run == false && $hv.output.confidence >= 80"
    depends_on:
      - hv
    inputs:
      - name: epic_dir
        source: step_output
        step_id: author
        output_name: epic_dir
      - name: confidence
        source: step_output
        step_id: hv
        output_name: confidence
      - name: first_run
        source: step_output
        step_id: hv
        output_name: first_run
    outputs:
      - name: gate_verdict
        type: string
    timeout_ms: 1800000

  # ── Phase C.7: SO signal producer (open-questions-driven) ──────────────────
  - id: so
    agent: technical-writer
    node_type: agent
    step_file: hive/workflows/step-files/plan/so.md
    depends_on:
      - author
    inputs:
      - name: epic_dir
        source: step_output
        step_id: author
        output_name: epic_dir
    outputs:
      - name: open_questions
        type: json
      - name: open_questions_count
        type: json
      - name: first_run
        type: json
    timeout_ms: 1800000

  # ── Phase C.8: SO user-gate (open-questions-driven) ────────────────────────
  - id: so-gate
    agent: technical-writer
    node_type: user_gate
    auto_pass_when: "$so.output.first_run == false && $so.output.open_questions_count == 0"
    depends_on:
      - so
    inputs:
      - name: epic_dir
        source: step_output
        step_id: author
        output_name: epic_dir
      - name: open_questions
        source: step_output
        step_id: so
        output_name: open_questions
      - name: open_questions_count
        source: step_output
        step_id: so
        output_name: open_questions_count
      - name: first_run
        source: step_output
        step_id: so
        output_name: first_run
    outputs:
      - name: gate_verdict
        type: string
    timeout_ms: 1800000

  # ── Reconcile: materialise author's committed work before gate ───────────────
  - id: reconcile
    agent: reconcile-handler
    node_type: reconcile
    depends_on:
      - hv-gate
      - so-gate
    inputs:
      - name: sha
        source: step_output
        step_id: author
        output_name: commit_sha
        optional: true
      # C1: wire branch + repo + work_dir from author's Multica outputs so the
      # reconcile handler can ff-merge the committed epic before the gate runs.
      - name: branch
        source: step_output
        step_id: author
        output_name: branch
        optional: true
      - name: repo
        source: step_output
        step_id: author
        output_name: repo
        optional: true
      - name: work_dir
        source: step_output
        step_id: author
        output_name: work_dir
        optional: true
      - name: epic_dir
        source: step_output
        step_id: author
        output_name: epic_dir
    outputs:
      - name: reconcile_status
        type: string
    timeout_ms: 120000

  # ── Output-validation gate: s3 schema-validates committed epic + stories ─────
  - id: output-validation
    agent: researcher
    node_type: gate
    # C3: "must be valid plan-epic" triggers validate_output.py schema check
    # (not just presence). A non-empty but schema-invalid epic now FAILS here.
    gate: "epic_dir must be valid plan-epic"
    depends_on:
      - reconcile
    inputs:
      - name: epic_dir
        source: step_output
        step_id: author
        output_name: epic_dir
    outputs:
      - name: validation_result
        type: string
    timeout_ms: 60000
