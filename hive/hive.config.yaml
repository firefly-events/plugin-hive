# Hive Configuration
# All settings have sensible defaults. Override only what you need.

schema_version: "1.2"

# File system paths
# Where Hive stores all per-project state (epics, episodes, cycle state,
# memories, sessions). Default: .pHive/ (hidden directory, like .git/ or
# .claude/). A custom value is honored at runtime by `hooks/common.sh`
# (`_resolve_state_dir`), which metrics hooks, the Stop hook, and the
# Tier-1 runtime step files read at invocation time. Broader runtime
# adoption across every skill/workflow is tracked under the
# `project_state_dir_resolver` follow-up — see
# `hive/references/state-relocation.md` for the current honors-list.
# Precedence: the root `hive.config.yaml` wins for `paths.*` keys; the
# shipped baseline below is the fall-through default.
paths:
  state_dir: .pHive
  # `target_project` overrides the invoking cwd for meta-team targeting.
  # When unset (null), the resolver falls back to $PWD at invocation.
  # Config-key first, cwd fallback, no CLI argument form.
  target_project: null
  # Kickoff-gate behavior for procedural skills (/plan, /execute).
  # warning: emit warning + proceed with sane defaults (auto-detect methodology,
  #   placeholder project-profile written to disk).
  # hard: original behavior — block when project-profile.yaml is missing.
  # Read-only skills (status, review, test, standup, design-review) already warn-and-
  # proceed per Epic A W1 (commit 08b472d); this knob extends that pattern to
  # /plan and /execute, which previously hard-blocked.
  gate_mode: warning

# Metrics collection
# Controls whether Hive emits per-run event records. Opt-in at kickoff time
# (user decision Q-new-B) — disabled by default so no writes occur unless the
# user explicitly enables this feature.
# Public `/meta-optimize` reads this kickoff-time opt-in. Consumers must choose
# `metrics.enabled: true` during kickoff (or later in their root
# `hive.config.yaml`) for the metrics-backed proposal path; otherwise the public
# command can only continue through its backlog fallback path when the consumer
# backlog file is populated.
# Note: after Slice 1 of hive-release-readiness, the metrics hooks read this
# block from the ROOT `hive.config.yaml` (consumer override layer). Keys here
# document the schema but do not drive runtime behavior — consumers opt in by
# adding `metrics: { enabled: true }` to their root `hive.config.yaml`.
metrics:
  enabled: false              # opt-in only; no <state_dir>/metrics/events/*.jsonl writes when false

# KG lifecycle emission granularity.
# phase: emit lifecycle KG triples at phase boundaries (default, low volume).
# story: emit at story boundaries.
# step: emit at individual workflow steps (highest volume).
# off: disable lifecycle KG emission without disabling KG reads/imports.
emit_lifecycle_at: phase

# Quality gate thresholds
quality_gates:
  auto_pass_threshold: 0.9
  human_escalation_threshold: 0.3

# Per-agent-pair trust scoring
trust:
  initial_score: 0.5
  high_threshold: 0.8
  low_threshold: 0.5
  decay_rate: 0.05
  decay_interval_days: 7

# Token budget limits
tokens:
  per_task_limit: 200000       # CWC 2026-05-06 doubled Opus quotas; 100000 -> 200000 keeps per-step headroom ~2x prior cap
  per_story_limit: 1000000     # CWC 2026-05-06 doubled Opus quotas; 500000 -> 1000000 keeps per-story budget aligned with the higher tier ceiling
  per_session_limit: 1000000   # CWC 2026-05-06 doubled Opus quotas; unset -> 1000000 keeps session-mode budgets aligned with the doubled per-story Opus cap
  per_epic_limit: 2000000      # CWC 2026-05-06 audit (s2-d2, issue #196): intentionally unchanged — epic-level ceiling already absorbs the doubled per-story budget at 2x; no Opus-quota delta to apply here
  warning_threshold: 0.8
  # Daily USD spend cap read by the autonomous-worker pre-flight gate at
  # hive/lib/budget-gate.js (see hive/references/sandcastle-ops-loop.md).
  # Unset → gate effectively disabled (limit defaults to Infinity).
  # Only applies when the maintainer-only .github/workflows/hive-worker.yml
  # is in use; default consumers see zero behavior change.
  # daily_usd_limit: 50

# Context window management
context_window:
  budget_fraction: 0.7
  degradation_threshold: 0.85

# External task tracking (Epic C — task-tracking-adapter-abi)
# Read by hive/lib/task-tracking-dispatch (ABI 1.x). Setting `adapter` enables
# executable tracker integration; leaving it null preserves the prior
# "skip tracker ops" behavior via gate_mode.
#
#   adapter:
#     null                        — no adapter; gate_mode controls behavior
#     github | linear             — built-in adapters in hive/adapters/
#     /abs/path/to/adapter.ts     — custom adapter conforming to ABI 1.x
#
#   gate_mode (when adapter is null):
#     warning  — emit warning + skip tracker ops (default)
#     hard     — hard-block on any tracker call
#
# Adapter credentials are read from env at call time (GITHUB_TOKEN /
# `gh auth token` for github; LINEAR_API_KEY + LINEAR_TEAM for linear). The
# nested `github`/`linear` keys below are an alternate config-driven path —
# values are propagated into the matching env vars before invocation.
task_tracking:
  adapter: null
  adapter_timeout_ms: 30000
  gate_mode: warning           # warning | hard — applies when adapter is null
  # Runtime context — passed at invoke time (not at load time):
  team_value: null             # github: owner; linear: team key (e.g., "ACME")
  project_value: null          # github: repo;  linear: project name
  # ─────────────────────────────────────────────────────────────────────────
  # Sandcastle ops layer (Epic sandcastle-ops-layer, story s1) — additive,
  # opt-in. When `adapter: github`, /plan Phase D publishes story YAMLs as
  # labeled GitHub Issues so an autonomous worker can pick them up. Default
  # consumers (adapter: null or other) see ZERO behavior change.
  #
  # github_owner / github_repo override team_value / project_value when the
  # caller wants to publish to a different owner/repo than the dispatch ABI
  # default. Leave null to fall through to team_value / project_value.
  #
  # label_prefix is the namespace for hive:ready, hive:blocked-by:<id>, etc.
  # Default "hive" matches sandcastle-ops-layer spec.
  github_owner: null
  github_repo: null
  label_prefix: "hive"
  # ─────────────────────────────────────────────────────────────────────────
  # Adapter-specific sub-config (propagated to env if non-null):
  github:
    token: null                # falls through to GITHUB_TOKEN env / `gh auth token`
  linear:
    api_key: null              # falls through to LINEAR_API_KEY env
    team: null                 # falls through to LINEAR_TEAM env
  # Legacy keys retained for the pre-ABI queue/prefix tooling; c-5b will swap
  # callers to the dispatch module and these will graduate to deprecated.
  queue_name: "Hive — Human Intervention"
  auto_expire_days: 7
  linear_team: null            # legacy — same as task_tracking.linear.team
  linear_project: null
  linear_user_id: null
  linear_prefix: "[Hive]"
  branch_prefix: "acme"

# Model tier routing
# Only the orchestrator runs on Opus by default — planning + process
# discipline carry most of the load, so the downstream roster is on Sonnet.
# Haiku is reserved for purely mechanical execution. Research/exploration
# personas (researcher, technical-writer, etc.) MUST stay on Sonnet at
# minimum — never demote them to Haiku.
model_tiers:
  opus:                          # top-level coordination only
    - orchestrator
  sonnet:                        # planning, analytical, implementation, review, writing, test design
    - team-lead
    - architect
    - analyst
    - tpm
    - researcher
    - developer                    # still referenced by workflows; use frontend/backend-developer for new work
    - frontend-developer
    - backend-developer
    - tester
    - reviewer
    - pair-programmer
    - peer-validator
    - ui-designer
    - technical-writer
    - test-scout
    - test-architect
    - test-inspector
    - test-sentinel
  haiku:                         # fast mechanical execution (never research/exploration)
    - test-worker

# PROMOTE specific personas above their default tier. The defaults above are
# intentionally lean (Sonnet for the roster, Opus for the orchestrator only);
# use this map to opt a persona UP for projects that genuinely need the extra
# horsepower. Never demote below the default — research/exploration personas
# in particular must stay on Sonnet at minimum.
model_overrides:
  reviewer: opus               # promoted: Opus 4.7 reviews Codex-produced work as the cross-LLM verification gate
  peer-validator: opus         # promoted: runs alongside reviewer — same cross-LLM gate, same tier
  # example: architect: opus     # promote architect to Opus for architecturally complex projects

# Circuit breakers — prevent wasted time and tokens
circuit_breakers:
  step_timeout_minutes: 10       # max time for a single workflow step
  fix_loop_timeout_minutes: 20   # max time for all fix loop iterations combined
  story_timeout_minutes: 45      # max time for a single story (all steps)
  ceremony_timeout_hours: 4      # max time for the full daily ceremony
  max_step_retries: 2            # retry a failed step this many times
  max_fix_iterations: 3          # fix loop iterations before back-to-planning
  max_outcomes_iterations: 3     # Outcomes loop iterations before deterministic stop
  max_same_error_repeats: 3      # same error N times = stop, change strategy
  # Advisory token caps (story w5-sidecar-bundle, A-31). Fail-open: when token
  # data is missing for a step, the cap is silently skipped (NOT an error).
  # When data is present, crossing the cap emits a budget_exceeded telemetry
  # event but does NOT hard-block — these are tuning signals, not runtime gates.
  # See skills/execute/SKILL.md "Per-step token budgets" for full semantics.
  max_tokens_per_step: null      # null = unset (no warning, no cap). Set per project.
  max_tokens_per_fix_loop: null  # null = unset
  max_tokens_per_story: null     # null = unset

# Example codebases — directories agents can reference to learn your coding
# style, structure patterns, naming conventions, etc. Add paths to your own
# projects so agents understand how YOU write code.
example_codebases: []
  # - path: /path/to/your/go-project
  #   label: "Go API project"
  #   notes: "Clean architecture, Chi router, PostgreSQL"
  # - path: /path/to/your/react-app
  #   label: "React Native app"
  #   notes: "Expo managed, TypeScript, MobX state"

# External model integrations
# Codex (OpenAI) can be used as a second-model reviewer for adversarial review.
# Requires: npm install -g @openai/codex && codex login
external_models:
  codex:
    enabled: false              # set to true after installing and authenticating Codex CLI
    use_for:
      - adversarial-review      # run after Claude review, before optimize/integrate
    # companion_path is auto-detected from the codex plugin if installed

# Per-agent spawn backend (PoC — external-model-integration epic)
# Lets the orchestrator route specific agent personas through an external
# model instead of Claude. Unset agents default to `claude` (auto-spawn path).
# Supported backends: claude | codex
# - `codex` requires Codex CLI authentication plus the external model flag,
#   codex login. macOS-only during PoC (cmux constraint). See
#   skills/hive/skills/codex-invoke/SKILL.md for pre-flight details.
# Optional config example — to enable, uncomment the agent_backends map and
# the per-persona entries beneath it:
# agent_backends:
#   reviewer: codex                # run reviewer in a cmux pane via OpenAI Codex
#   backend-developer: codex       # run backend-developer in a cmux pane via OpenAI Codex

# Developer preferences (populated by Phase 2b-ii: Developer Discovery)
# These configure how Hive adapts to the developer's working style.
# All fields are optional — null means "not yet discovered".
developer:
  pr_style: null               # single-commit | squash-merge | atomic-prs | bundled
  commit_granularity: null     # fine (per-change) | medium (per-task) | coarse (per-story)
  review_depth: null           # thorough | standard | light
  notes: null                  # free-text developer preferences or workflow notes

# Meta-team settings
meta_team:
  github_forwarding: false   # opt-in: forward plugin-level issues to GitHub repo
                             # when false, meta-team only optimizes locally
                             # when true, out-of-scope plugin issues are filed as GitHub issues

# Meta-optimize cycle inputs
# Knowledge-graph-derived signal source. Step-02c reads kg.sqlite for triples
# within the recency window; if non-empty, step-03 routes through the
# kg_signal proposal source before falling back to backlog.
# Cross-session dreaming replay is the 5th source. It runs after kg_signal and
# before backlog because it is still automatic signal, not human-curated input.
# When either source is disabled or unavailable, routing falls through without
# error and remaining sources continue normally.
#
# signal_weights: per-source multiplier applied to the base priority score in
# step-03 ranking. Weighted score = weight × Impact × (6 − Risk) / Effort.
# Default 1.0 for every source preserves existing ranking order byte-for-byte.
# Override in your root hive.config.yaml (see design §3.2 for guidance).
#
# signal_weights:
#   metrics: 1.0           # internal_audit (step-02 findings)
#   external_research: 1.0
#   kg_signal: 1.0
#   dreaming_replay: 1.0
#   backlog: 1.0
meta_optimize:
  # Metric gate mode for step-03c-metric-declaration.
  # blocking (default): proposals failing the metric gate receive status: rejected_metric_gate
  #   and are excluded from step-04. Cycle continues with passing subset; cycle-level
  #   failure only when zero proposals pass. Rejected proposals surface in PR body.
  # advisory: gate failures are reported but all proposals pass through to step-04
  #   (legacy non-blocking behavior; restores orchestrator/user latitude over gaps).
  # metric_gate: blocking
  kg_signal:
    enabled: true              # set false to disable kg_signal source
    window_days: 30            # recency window for triple inclusion
    cross_project_penalty: 0.7 # rank multiplier for cross-project signal
  dreaming_source:
    enabled: true              # set false to skip the 5th source entirely
    rank_weight: 0.65          # lower than direct metrics/KG; still above backlog fallback
    episode_root: .pHive/episodes # cross-session replay corpus; mirrors local episode walker input

# Dreaming preview runs asynchronously and is waitlist-gated upstream. Hive's
# local adapter uses this timeout as the scheduler budget for the cross-session
# replay window rather than extending per-session session-end phases.
dreaming:
  timeout_hours: 12            # overnight replay window; keeps capability-skip bounded for daily routines

# Git workflow settings (per-epic-branch-pr-flow epic, story pe-1)
# Controls how Hive epics branch + open PRs. Resolved by
# `hive/lib/git_flow.py` (`resolve_git_flow`).
#
# default_pr_base:
#   auto                — develop if origin/develop exists, else main (default)
#   <branch-name>       — pin to a specific base (e.g., main, develop, dev/foo)
#
# branch_strategy:
#   per-epic            — one branch per epic (one PR aggregating all stories) [default]
#   per-story           — one branch per story (back-compat for in-flight epics)
git_flow:
  default_pr_base: auto
  branch_strategy: per-epic

# Planning settings
planning:
  collaborative_review: true   # set to false to skip collaborative review gates
                              # gates run after design discussion, H/V plans, and structured outline
                              # disabling skips the team review cycle and presents docs directly
  visual: true                # visual planning: HTML sidecars + Mermaid + figure slots + concept illustration
                              # default on; set false (or pass /plan --no-visual) to skip sidecar
                              # generation and the concept-illustration step. Markdown stays canonical;
                              # Mermaid/figure slots are unaffected. PRD stays HTML-primary regardless.
                              # see hive/references/planning-format-contract.md §7

# Execution defaults
# Note: default_methodology can be populated by developer elicitation (Phase 2b-ii)
execution:
  runtime: auto         # auto | workflows | multica  (Q4 maintainer-confirmed default: auto)
  # cwfp-s2-2 execute-dispatch resolver precedence:
  # env HIVE_EXECUTION_RUNTIME > root config > shipped baseline > skill override > default.
  # When runtime is 'auto', execute-dispatch may use a per-epic
  # .pHive/cycle-state/<epic-id>.yaml execution_runtime override; explicit
  # 'workflows' or 'multica' bypass that per-epic override.
  default_methodology: classic
  parallel_teams: true
  max_retry_attempts: 2
  substrate: messages         # default caller-side Messages API substrate; sessions-cloud stays explicit opt-in
  # Terminal handoff default (epic: autonomous-cycle-loop, story d-1).
  # Controls what /execute dispatches after each story's integrate step when the
  # story YAML does not declare terminal_handoff.next. Enum: none | test | review | both.
  # Default 'none' preserves prior behavior byte-equivalently.
  terminal_handoff_default: none
  # Terminal handoff per-invocation timeout (epic: autonomous-cycle-loop, story d-2).
  # Consumer projects may override in their root hive.config.yaml.
  terminal_handoff:
    timeout_seconds: 1800  # 30 min per sub-invocation; dispatch.mjs reads this key
  # Optional maintainer-only execution tuning — consumers do NOT need these
  # keys. Uncomment in your root `hive.config.yaml` to override:
  #   terminal_mux: auto           # tmux | cmux | auto  (default: built-in tmux)
  #   interactive_panes: true      # visible agent conversation (cmux only)
  #   idle_timeout_seconds: 300    # 5-min idle reaper for persistent Codex panes

# Cloud adapter gate
# Keeps the legacy Sessions-API substrate dark by default until cloud
# bootstrap (agent_id + environment_id provisioning) is configured.
cloud-adapter:
  enabled: false             # explicit guardrail: sessions-cloud must opt in and prove adapter capability

# Session-based execution (Phase 2 of memory-autonomy-foundation)
# When enabled, the execute skill uses the Claude Agent SDK /v1/sessions API
# (one session per story) instead of spawn-and-destroy-per-story. See step 6c in
# skills/execute/SKILL.md and hive/references/session-resilience.md.
# Default OFF — opt-in only. Activate via this flag OR HIVE_SESSIONS_ENABLED=1.
sessions:
  enabled: false               # set true to route execute through /v1/sessions
  # model: <inherits from model_tiers when unset>
  timeout_ms: 600000           # max session wall-time (10 min)
  stuck_timeout_ms: 90000      # SSE silence before stuck (90s; doubled for implement/test/optimize)
  max_retries: 3               # max stuck+retry cycles per story before user escalation

# Autonomous cycle loop (epic: autonomous-cycle-loop, story s0-1 foundation)
# Schema-only foundation block for a self-running development cycle that
# replays planned test scenarios through Hive end-to-end inside sandcastles.
# Additive — no consumer reads these knobs yet. Behavior arrives in later
# stories of the epic; this block exists so downstream stories can land
# without re-bumping the shipped baseline. Leaving every knob at its default
# preserves prior behavior byte-equivalently.
#
# See:
#   - hive/references/sandcastle-mode.md       (sandcastle_mode semantics)
#   - hive/references/test-scenario-schema.md  (test scenario YAML shape)
autonomous_cycle_loop:
  enabled: false                              # opt-in toggle; default OFF preserves prior behavior
  sandcastle_mode: shared                     # shared | dedicated — see sandcastle-mode.md
  test_scenarios_path: .pHive/test-scenarios  # carrier dir for test-scenario YAMLs
  max_cycles_per_run: 1                       # safety bound; 1 = single-cycle execution per invocation

# Standup skill settings (epic: autonomous-cycle-loop, story a-1)
# Consumer override layer wins. Root layer sets the default for all consumers.
standup:
  interactive_default: false  # true: /standup behaves as if --interactive is always passed

# Loop template feature settings (epic: loop-unroll-templates, story s1-loops-config-schema)
# Per-feature enabled toggle and max_rounds cap. Shape: { enabled: bool, max_rounds: int >= 1 }
# Precedence: HIVE_LOOPS_<FEATURE>_ENABLED / MAX_ROUNDS env > root hive.config.yaml > here.
# Loop templates are OPT-IN. Each defaults to a single degenerate pass
# (no iteration); set enabled: true (or HIVE_LOOPS_<FEATURE>_ENABLED=true) to
# unroll into a bounded multi-round converge loop, and max_rounds to the ceiling.
# Disabled = one pass under the declared node ids (identity), so pre-loop
# behaviour and declared-name-coupled consumers are unchanged until you turn a
# loop on. This is the "turn grill on and set N rounds" contract.
loops:
  review_converge:
    enabled: true               # core methodology loop — on by default
    max_rounds: 3
  tdd_red_green:
    enabled: true               # core methodology loop — on by default
    max_rounds: 5
  bdd_converge:
    enabled: true               # core methodology loop — on by default
    max_rounds: 3
  test_swarm:
    enabled: false              # opt-in only — swarm is expensive; set true or HIVE_LOOPS_TEST_SWARM_ENABLED=true to enable multi-round unroll
    max_rounds: 3
  grill:
    enabled: false              # opt-in only — turn on + set max_rounds to iterate the grill loop
    max_rounds: 3
