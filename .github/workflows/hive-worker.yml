name: Hive Worker

# Reference / maintainer-only workflow. Closes the sandcastle-ops autonomous
# execution loop (see hive/references/sandcastle-ops-loop.md).
#
# OPT-IN CONTRACT: this workflow ships in plugin-hive's repo for the
# maintainer's own use. It does NOT auto-deploy to consumer repos — Claude
# Code plugins distribute via `.claude-plugin/`, not `.github/`. Consumers
# who want autonomous execution copy this file into their own repo,
# configure `external_task_tracking.adapter: github`, adopt sandcastle,
# and tune the cron cadence to their token budget.
#
# Trigger surface:
#   - cron every 15 minutes (default cadence; tunable post-observation)
#   - workflow_dispatch with optional `issue_number` to pin pickup to one issue
#
# No `on: push` — this loop must not run on every commit.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Pin worker pickup to a single issue (optional)'
        type: string
        required: false

permissions:
  issues: write
  pull-requests: write
  contents: write

concurrency:
  group: hive-worker
  cancel-in-progress: false

jobs:
  # Preflight: short-circuit when the queue is empty so the cron path doesn't
  # spin a container, boot Claude CLI, and burn subscription quota on a noop.
  # Manual dispatch with an explicit `issue_number` bypasses the check (force-
  # run path). This job is cheap — gh CLI is preinstalled on the runner, so
  # the only cost is a runner-start (~10s) + a single REST list call.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      has_work: ${{ steps.check.outputs.has_work }}
    steps:
      - name: Check hive:ready queue (or honor manual force)
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_ISSUE: ${{ inputs.issue_number }}
        run: |
          if [ -n "$FORCE_ISSUE" ]; then
            echo "Manual dispatch with issue_number=$FORCE_ISSUE — bypassing queue check."
            echo "has_work=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label hive:ready \
            --json number \
            --jq 'length')
          echo "hive:ready queue size: $count"
          if [ "$count" -gt 0 ]; then
            echo "has_work=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            echo "Queue empty; worker job will be skipped."
            echo '### Hive Worker — queue empty, skipped' >> "$GITHUB_STEP_SUMMARY"
          fi

  worker:
    needs: preflight
    if: needs.preflight.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install host-side runner deps (BYO)
        # plugin-hive treats root package.json as opt-in BYO (see
        # feedback_byo_enhancements_no_root_deps). Install only what the
        # host-side sandcastle-worker-runner.js actually needs via
        # `npm install --no-save`. The codex CLI + everything else
        # (claude/codex auth surface) lives INSIDE the sandcastle image.
        run: npm install --no-save @ai-hero/sandcastle zod

      - name: Budget gate (pre-flight)
        # Reads today's spend from .pHive/metrics/events/stop-*.jsonl, sums
        # per-model token cost, and exits non-zero if daily limit is exceeded.
        # Manual dispatch is intentionally subject to the same gate — emergency
        # override = edit hive.config.yaml in a separate PR.
        run: node hive/lib/budget-gate.js

      - name: Build sandcastle image
        # v1: inline Dockerfile + build in-workflow to keep infra surface
        # zero. The host Dockerfile under `.pHive/spikes/sandcastle/` is
        # gitignored (maintainer-local spike), so we materialize it here.
        # If cold-build cost becomes material, swap for a pre-built image
        # in GHCR + a separate publish workflow.
        #
        # css-5: copy the repo into the build context as `plugin-source/`
        # so the Dockerfile can install plugin-hive into the agent user's
        # ~/.claude/plugins/ cache. Without this, the in-container Claude
        # CLI starts with an empty plugin set and `/hive:execute` (and
        # every plugin-hive skill) fails to resolve.
        run: |
          BUILD_DIR=$(mktemp -d)
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='.sandcastle' \
                ./ "$BUILD_DIR/plugin-source/"
          cat > "$BUILD_DIR/Dockerfile" <<'DOCKERFILE'
          FROM node:22-bookworm

          # Worker prompt runs `gh issue list / edit / create` inside the
          # container, so gh CLI is required. Install via GitHub's official
          # apt repo (gh isn't in stock debian repos).
          RUN apt-get update && apt-get install -y --no-install-recommends \
                git \
                curl \
                jq \
                ca-certificates \
              && curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
                  -o /usr/share/keyrings/githubcli-archive-keyring.gpg \
              && chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
              && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
                  > /etc/apt/sources.list.d/github-cli.list \
              && apt-get update \
              && apt-get install -y --no-install-recommends gh \
              && rm -rf /var/lib/apt/lists/*

          ARG AGENT_UID=1000
          ARG AGENT_GID=1000

          # Robust UID/GID alignment: if the requested GID is already used by
          # another group in the base image (e.g. macOS staff=20 collides with
          # debian dialout), delete that occupant first. Same for UID.
          RUN set -eux; \
              if getent group "$AGENT_GID" >/dev/null && [ "$(getent group "$AGENT_GID" | cut -d: -f1)" != "node" ]; then \
                  groupdel "$(getent group "$AGENT_GID" | cut -d: -f1)"; \
              fi; \
              if getent passwd "$AGENT_UID" >/dev/null && [ "$(getent passwd "$AGENT_UID" | cut -d: -f1)" != "node" ]; then \
                  userdel "$(getent passwd "$AGENT_UID" | cut -d: -f1)"; \
              fi; \
              groupmod -g "$AGENT_GID" node; \
              usermod -u "$AGENT_UID" -g "$AGENT_GID" -d /home/agent -m -l agent node

          RUN npm install -g @openai/codex
          RUN npm install -g @anthropic-ai/claude-code

          # css-5: install plugin-hive into the agent user's plugin cache so
          # `/hive:execute` (and every plugin-hive skill) is registered when
          # the in-container Claude CLI starts. The cache path mirrors what
          # `claude plugin install` writes on the host:
          #   ~/.claude/plugins/cache/<marketplace>/<plugin>/<version>/
          # We also write installed_plugins.json + known_marketplaces.json so
          # the CLI's plugin loader picks the source up at start-up.
          COPY plugin-source /opt/plugin-source
          RUN set -eux; \
              VERSION=$(jq -er '.version | strings | select(length > 0)' /opt/plugin-source/.claude-plugin/plugin.json); \
              CACHE_DIR="/home/agent/.claude/plugins/cache/plugin-hive/plugin-hive/${VERSION}"; \
              mkdir -p "$CACHE_DIR" /home/agent/.claude/plugins; \
              cp -a /opt/plugin-source/. "$CACHE_DIR/"; \
              printf '{"version":2,"plugins":{"plugin-hive@plugin-hive":[{"scope":"user","installPath":"%s","version":"%s","installedAt":"2026-01-01T00:00:00.000Z","lastUpdated":"2026-01-01T00:00:00.000Z"}]}}\n' "$CACHE_DIR" "$VERSION" > /home/agent/.claude/plugins/installed_plugins.json; \
              printf '{"version":1,"marketplaces":{"plugin-hive":{"trusted":true,"source":"local-baked","addedAt":"2026-01-01T00:00:00.000Z"}}}\n' > /home/agent/.claude/plugins/known_marketplaces.json; \
              chown -R "$AGENT_UID:$AGENT_GID" /home/agent/.claude; \
              rm -rf /opt/plugin-source

          USER ${AGENT_UID}:${AGENT_GID}

          WORKDIR /home/agent

          ENTRYPOINT ["sleep", "infinity"]
          DOCKERFILE
          # Build with AGENT_UID/AGENT_GID matching the runner user so the
          # in-container agent can read AND WRITE the bind-mounted worktree.
          # If the image bakes UID 1000 but the runner is 1001, the agent
          # cannot edit any files (which broke smoke #11 on a README ToC
          # story even though the agent correctly read the YAML).
          docker build \
            --build-arg AGENT_UID="$(id -u)" \
            --build-arg AGENT_GID="$(id -g)" \
            -t sandcastle:hive "$BUILD_DIR"

      - name: Smoke test — plugin cache + /hive:execute discoverable
        # css-5: post-build assertion that the baked plugin cache layout
        # is what the in-container Claude CLI's plugin loader expects.
        # If the @anthropic-ai/claude-code package changes its discovery
        # mechanism, this step fails fast at build time rather than
        # silently letting every worker run emit "skill not registered".
        run: |
          docker run --rm sandcastle:hive bash -c '
            set -eux
            # Plugin cache dir exists with the expected nesting depth
            CACHE_BASE="$HOME/.claude/plugins/cache/plugin-hive/plugin-hive"
            test -d "$CACHE_BASE"
            VERSION_DIR=$(ls "$CACHE_BASE")
            test -n "$VERSION_DIR"
            # SKILL.md for /hive:execute is reachable via the install path
            test -f "$CACHE_BASE/$VERSION_DIR/skills/execute/SKILL.md"
            # Registry files exist and are valid JSON
            jq -e . "$HOME/.claude/plugins/installed_plugins.json" >/dev/null
            jq -e . "$HOME/.claude/plugins/known_marketplaces.json" >/dev/null
            # Claude CLI itself starts cleanly (auth-independent --help path)
            claude --help >/dev/null
            echo "[smoke] plugin cache + claude CLI OK (version=$VERSION_DIR)"
          '

      - name: Materialize codex auth.json
        # Codex CLI ≥ 0.129 ignores bare OPENAI_API_KEY env and requires the
        # auth.json file mounted at /home/agent/.codex/auth.json inside the
        # sandcastle container. The sandcastle codex() provider auto-mounts
        # .sandcastle/codex-config/auth.json on the host into that location.
        # We write the secret's contents to that host path here.
        #
        # Secret shape: CODEX_AUTH_JSON contains the full auth.json file
        # contents (the maintainer's local ~/.codex/auth.json after
        # `codex login`, which includes OPENAI_API_KEY plus the OAuth
        # refresh tokens for subscription-backed access). Stored as a
        # plain (multiline) GitHub Actions secret.
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [ -z "$CODEX_AUTH_JSON" ]; then
            echo "::error::CODEX_AUTH_JSON secret is not configured on this repository."
            echo "::error::Run 'gh secret set CODEX_AUTH_JSON --repo ${GITHUB_REPOSITORY} < ~/.codex/auth.json'"
            exit 1
          fi
          mkdir -p .sandcastle/codex-config
          printf '%s' "$CODEX_AUTH_JSON" > .sandcastle/codex-config/auth.json
          # The container runs as agent user (UID 1000), but the GH Actions
          # runner is UID 1001. A 600-mode file written by 1001 is
          # unreadable to 1000. Set 644 so the in-container user can read.
          # Safe here — this runner is ephemeral and has no other users.
          # In a non-ephemeral environment, prefer `chown 1000:1000` over
          # widening perms.
          chmod 644 .sandcastle/codex-config/auth.json
          # Sanity check: must be JSON-parseable.
          if ! jq -e . .sandcastle/codex-config/auth.json >/dev/null; then
            echo "::error::CODEX_AUTH_JSON secret is not valid JSON."
            exit 1
          fi

      - name: Verify Claude OAuth token secret
        # The in-container Claude CLI authenticates via the
        # CLAUDE_CODE_OAUTH_TOKEN env var (subscription-backed OAuth, no
        # auth.json mount needed). Fail loudly here with a copy-pasteable
        # setup hint so operators don't get a confusing 401 deep inside
        # the worker run. Mirrors the codex auth verify pattern above.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is not configured on this repository."
            echo "::error::Run 'gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo ${GITHUB_REPOSITORY} < /path/to/token'"
            exit 1
          fi

      - name: Run worker
        id: worker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          node hive/lib/sandcastle-worker-runner.js "${ISSUE_NUMBER}" > result.json

      - name: Upload worker result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-result
          path: result.json

      - name: Upload sandcastle logs
        # Codex's full reasoning + tool-call transcript lives in
        # `.sandcastle/logs/agent-issue-<N>.log` on the runner host
        # (sandcastle writes this via its file-mode LoggingOption).
        # This dies with the runner if we don't upload it as an
        # artifact. Keep it for post-run debugging — agent quality
        # iteration depends on being able to read what codex
        # actually did.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandcastle-logs
          path: |
            .sandcastle/logs/
            .sandcastle/worktrees/
          if-no-files-found: ignore
          retention-days: 30

      - name: Summarize result
        if: always()
        run: |
          if [ -f result.json ]; then
            echo '### Hive Worker result' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat result.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Hive Worker — no result.json produced' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stuck-in-flight safety net
        # Final guard: if the worker crashed without producing a `shipped`
        # status, label the issue `hive:failed` so a human can pick it up.
        # Covers the rare case where the runner exited non-zero before the
        # worker could comment back. No-op when no issue_number input was
        # provided AND no failed-but-known issue can be inferred.
        if: always() && failure() && inputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set +e
          status=$(jq -r '.status // ""' result.json 2>/dev/null)
          if [ "$status" != "shipped" ]; then
            echo "Worker did not ship; labeling issue #${ISSUE_NUMBER} as hive:failed"
            gh issue edit "${ISSUE_NUMBER}" --add-label "hive:failed" || true
          fi
