name: Story status reconcile

# Runs on every PR merge to main or develop.
# Walks the merged commit(s) for story-id references, derives authoritative
# status via hive/lib/story-status.mjs, and patches any stale story YAMLs.
# Commits the patch as chore/status-reconcile-<date> and opens a PR so the
# change is visible and reversible.
#
# Substrate-agnostic: keyed on PR title regex for story-id, branch name
# (feat/<epic-id> or agent/issue-N), and closed issue hive:story: label.
# The hook is idempotent — a no-op when all YAML status fields are current.

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - develop

permissions:
  contents: write
  pull-requests: write

# Concurrency gate — collapse overlapping runs onto a single base ref.
# Multiple PRs can merge to develop within seconds (e.g. CI catch-up
# bursts); without this, every merge spawns its own job and every job
# opens its own dupe reconcile PR.
concurrency:
  group: story-status-reconcile-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run dry-run reconciliation
        id: dryrun
        run: |
          output=$(node hive/scripts/story-status-backfill.mjs 2>&1)
          echo "$output"
          if echo "$output" | grep -q "Nothing to reconcile"; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply reconciliation
        if: steps.dryrun.outputs.stale == 'true'
        run: node hive/scripts/story-status-backfill.mjs --apply

      - name: Create or update reconciliation PR
        if: steps.dryrun.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          MERGED_PR: ${{ github.event.pull_request.number }}
        run: |
          DATE=$(date +%Y-%m-%d)
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if there are actual changes
          if git diff --quiet .pHive/epics/; then
            echo "No YAML changes after apply — already current."
            exit 0
          fi

          # In-flight dedup gate. If an open reconcile PR already targets
          # this base ref, force-push the freshest reconciliation onto its
          # branch instead of opening yet another dupe. The result is one
          # rolling PR per base ref — concurrency + this gate together kill
          # the "4 dupe PRs in one day" pattern that triggered this fix.
          EXISTING_BRANCH=$(gh pr list \
            --state open \
            --base "$BASE_REF" \
            --search 'in:title "story status reconcile"' \
            --json number,headRefName,title \
            --jq '.[] | select(.title | test("^chore: story status reconcile")) | .headRefName' \
            | head -n 1)

          if [ -n "$EXISTING_BRANCH" ]; then
            echo "Found open reconcile PR on branch ${EXISTING_BRANCH}; refreshing it."
            BRANCH="$EXISTING_BRANCH"
            git checkout -B "$BRANCH"
            git add .pHive/epics/
            git commit -m "chore: refresh story status reconcile (${DATE}) [skip ci]"
            git push --force-with-lease origin "$BRANCH"
            echo "Refreshed existing reconcile PR; no new PR opened."
            exit 0
          fi

          BRANCH="chore/status-reconcile-${DATE}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git add .pHive/epics/
          git commit -m "chore: reconcile stale story status fields (${DATE}) [skip ci]"
          git push origin "$BRANCH"

          BODY=$(cat <<EOF
          Auto-generated by story-status-reconcile CI workflow after merging #${MERGED_PR}.

          Patches story YAML \`status:\` fields that lagged behind episode markers + git state.
          This PR is safe to merge directly — it only updates advisory metadata fields.

          Generated by \`hive/scripts/story-status-backfill.mjs --apply\`.
          EOF
          )
          gh pr create \
            --title "chore: story status reconcile ${DATE}" \
            --body "$BODY" \
            --base "$BASE_REF" \
            --head "$BRANCH"
