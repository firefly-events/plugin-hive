name: Multica reverse sync

# Polls Multica for cancelled issues and flips matching story YAMLs to deferred.
# Operator opt-in: uncomment the `schedule:` block below and ensure the
# MULTICA_SERVER_URL and MULTICA_TOKEN secrets are set in your repository.
#
# Manual trigger always available via workflow_dispatch.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '27 6 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  reverse-sync:
    # Secret-gate: skip silently when MULTICA_SERVER_URL is not configured
    # (via either repo secrets or repo variables). Prevents noisy failures on
    # forks or repos without Multica credentials.
    if: vars.MULTICA_SERVER_URL != '' || secrets.MULTICA_SERVER_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run reverse sync
        id: sync
        env:
          # Prefer repo variable; fall back to secret so gate and env stay in
          # sync regardless of which configuration mechanism the operator picked.
          MULTICA_SERVER_URL: ${{ vars.MULTICA_SERVER_URL != '' && vars.MULTICA_SERVER_URL || secrets.MULTICA_SERVER_URL }}
          MULTICA_TOKEN: ${{ secrets.MULTICA_TOKEN }}
        run: |
          output=$(node hive/scripts/multica-reverse-sync.mjs 2>&1)
          echo "$output"
          if echo "$output" | grep -qE ', [1-9][0-9]* YAMLs patched'; then
            echo "patched=true" >> "$GITHUB_OUTPUT"
          else
            echo "patched=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and open PR
        if: steps.sync.outputs.patched == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="chore/multica-reverse-sync-${DATE}-${GITHUB_RUN_ID}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet .pHive/epics/; then
            echo "No YAML changes — already current."
            exit 0
          fi

          git checkout -b "$BRANCH"
          git add .pHive/epics/
          git commit -m "chore: mark Multica-cancelled stories as deferred (${DATE}) [skip ci]"
          git push origin "$BRANCH"

          PR_BODY=$(cat <<'EOF'
          Auto-generated by multica-reverse-sync CI workflow.

          Patches story YAML `status:` fields to `deferred` where the matching Multica issue was cancelled.
          Safe to merge — updates advisory metadata only.

          Generated by `hive/scripts/multica-reverse-sync.mjs`.
          EOF
          )

          gh pr create \
            --title "chore: multica reverse sync ${DATE}" \
            --body "$PR_BODY" \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH"
