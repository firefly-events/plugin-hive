  findings:
    - id: dispatch-dead-runtime-branch
      severity: major
      surface: skills/hive/skills/execute-dispatch/SKILL.md step 1 pseudocode
      observation: |
        Resolved before any story dispatched. The else-branch on the per-epic
        override block routed every explicit non-auto runtime value to the
        auto heuristic, which only returns sessions / sequential / team /
        team-cmux — never cc-workflows or multica. HIVE_EXECUTION_RUNTIME=workflows
        resolved with source=env but mode_decision fell through to team-cmux.
      fix: |
        Added explicit-runtime branch above the per-epic-override path that
        maps resolved_runtime in {workflows, multica} to the corresponding
        mode_decision with mode_reason=execution-runtime-override-{source}.
        Unknown explicit runtime values fail-closed to the auto heuristic.
        Landed on feat/cc-workflows-first-party as commit 29bc5d3.
      status: fix-applied
    - id: workflow-tool-args-string-vs-object
      severity: minor
      surface: orchestrator-built Workflow scripts dispatched from execute-mode-cc-workflows
      observation: |
        First dispatch (wf_506227d1-a29) wrote to <worktree>/undefined and
        the agent fabricated a timestamp. Root cause: the Workflow tool's
        `args` global arrived as a JSON-encoded string instead of the parsed
        object, so `args.notes_path` evaluated to JavaScript undefined and
        the template literal rendered the word "undefined" as the filename.
        Documented in the Workflow tool description ("a stringified list
        reaches the script as one string") but easy to miss when building
        scripts from an orchestrator's string-typed parameters.
      fix: |
        Defensive parse shim added at the top of the per-story Workflow
        script: `const a = typeof args === 'string' ? JSON.parse(args) : args;`
        Re-fired wf_d2b00bfb-b38 succeeded with correct path resolution and
        timestamp echo. Recommend the execute-mode-cc-workflows skill spell
        out the defensive-parse contract in its Step 1.5 "Dispatch" bullets
        so future implementers do not rediscover this.
      status: workaround-applied
    - id: tracker-skipped-throwaway
      severity: info
      surface: cc-workflows-smoke run
      observation: |
        Multica adapter is configured (task_tracking.adapter=multica in root
        hive.config.yaml) but the workspace is not bootstrapped on this
        worktree. Step 1.1 createIssue + Step 5 updateStatus were skipped
        for this throwaway run on the grounds that substrate-under-test
        does not include tracker plumbing. Smoke epic disposition is
        keep-as-zeroth-party so no Multica issues should be created.
      fix: |
        None for this run. A real epic routed through cc-workflows mode
        will exercise the tracker path; reserve that test for a separately
        bootstrapped follow-up rather than mixing it with substrate
        validation.
      status: deliberate-skip
    - id: workflow-step-shape-deviation
      severity: info
      surface: execute-mode-cc-workflows skill Step 1.5 vs cc-workflows-smoke run
      observation: |
        Skill says "one phase() per workflow step, one agent() per (story, step)";
        classic workflow has 7 steps. For 3 stories the spec would build
        21 agent calls, including preflight (which would fail — no build
        command for the throwaway epic) and review/integrate (which would
        try to write git from inside agents, violating the no-git contract).
        For this substrate smoke we deliberately collapsed the workflow to
        a single "Implement" phase with one agent() per story.
      fix: |
        None. Documents that the skill's workflow-step expansion is a
        product question for execute-mode-cc-workflows v2: classic-as-is,
        or a substrate-mode-specific workflow that omits preflight/integrate
        because the orchestrator owns reconcile.
      status: substrate-question
