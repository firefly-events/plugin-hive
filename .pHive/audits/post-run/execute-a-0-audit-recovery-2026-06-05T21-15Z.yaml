substrate_findings:
  - id: cc-workflows-mode-skill-leaves-model-tier-to-orchestrator
    severity: medium
    summary: |
      cc-workflows mode skill does not auto-resolve per-persona model tier
      from hive.config.yaml model_tiers + model_overrides. Without explicit
      opts.model on every agent() call, every dispatched agent inherits the
      parent session model (Opus 4.7 here), violating the documented base
      tier (sonnet for researcher/developer/tester) and the runtime promotion
      contract (opus for reviewer via model_overrides).
    proposed_fix: |
      In execute-mode-cc-workflows/SKILL.md Step 1.5 (workflow_assembly),
      look up each persona's resolved tier (model_tiers + model_overrides
      with override winning) and emit opts.model on the assembled agent()
      call. Surface tier in field_sources for the post-run audit.
    discovered_by: a-0-audit-recovery first cc-workflows-mode dispatch
    runtime_workaround: orchestrator set opts.model per agent() manually

