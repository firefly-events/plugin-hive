substrate_findings:
  - id: codex-rescue-forwards-not-executes
    severity: major
    surface: plan-mode-cc-workflows/SKILL.md + execute-mode-cc-workflows/SKILL.md
    observation: |
      Initial substrate spec said "Codex-routed personas resolve to
      agentType: 'codex:codex-rescue'". The first researcher dispatch
      (wf_8dbaa3ec-f51) used that agentType and returned a status report
      describing what a separate background Codex CLI run was DOING,
      rather than the work product itself. The agent forwarded the task
      via `task --write` to a separate Codex process; the structured-output
      schema's "completed" terminal was therefore a lie — the actual
      research file had not landed when the Workflow tool returned.
      Mismatch with cc-workflows substrate contract: dispatch → IMMEDIATE
      file-list return → episode marker write → orchestrator reconcile.
    fix: |
      Commit 8c41671 — both cc-workflows mode skills now forbid Codex
      agentType. Every agent() call uses the default workflow subagent.
      Codex routing remains valid in the OTHER dispatch modes
      (planning-routing's codex-invoke path via cmux panes); cc-workflows
      mode is intentionally inline-Claude substrate.
    status: fix-applied + validated (re-dispatch wf_9eff97f8-59d via
      default subagent returned real 470-line findings file)
  - id: branch-cwd-mismatch
    severity: cleared
    observation: |
      First dispatch (wf_8dbaa3ec-f51) reported observed_branch=feat/cc-workflows-first-party
      but observed_cwd=hermes-guardrails worktree. Triggered substrate-finding
      concern. Re-dispatch via default subagent (wf_9eff97f8-59d) reported
      both fields correctly. Root cause: the codex-rescue forwarder ran the
      git query in its own scope (different worktree), not in the cwd the
      Workflow tool reported. Cleared by the codex-rescue-forwards-not-executes
      fix; not a separate substrate bug.
    status: cleared
  - id: cc-workflows-smoke-args-string-vs-object
    severity: minor
    surface: orchestrator-built Workflow scripts dispatched from any cc-workflows
      mode skill (carryover from cc-workflows-smoke audit)
    observation: |
      The Workflow tool's `args` global may arrive as a JSON-encoded string
      rather than a parsed object when invoked from a tool surface whose
      parameters are string-typed. The plan-mode dispatch scripts in this
      run carried the defensive parse shim
      `const a = typeof args === 'string' ? JSON.parse(args) : args;`
      from the start (per the contract added in commit 06637d4); both
      runs honored it and ran clean.
    status: contract-validated

substrate_verdict: |
  plan-mode-cc-workflows substrate produces real work products from
  default-subagent dispatch. Persona behavior injection via prompt body
  (rather than agentType routing) works. Branch + cwd attribution is
  reliable. The structured-output schema's "completed" terminal IS the
  work-product terminal when the agent runs inline (default subagent).
  Phase A → Phase B persona handoff works: technical-writer in Phase B
  read the researcher's Phase A output file and produced a design-discussion
  that cites the researcher's findings (verification.research_findings_read=true).

