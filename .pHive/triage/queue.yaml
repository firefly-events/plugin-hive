  - id: t-003
    state: prioritized
    kind: feature
    title: "Enforce language policy — gate new non-canonical runtime files outside bridge surfaces"
    description: |
      The Python-first charter (CLAUDE.md / language-strategy-adr Option B) has
      ZERO automated enforcement. It exists only as prose. Nothing blocks a new
      .mjs/.js/.ts under hive/lib/ outside the named bridge surfaces:
        - /plan has no language-policy check (research / design-discussion / grill)
        - /execute has no gate
        - no commit hook, no CI lint
      Result: CodeRabbit (external) is currently the only thing enforcing our own
      charter. It caught hive/lib/hermes-reconciler/*.mjs in PR #305 (L17), accepted
      as a one-off exception 2026-06-20.

      Blast radius already drifted (non-bridge JS/TS under hive/lib): external,
      handoff, meta-team, plan-phase-d, scenarios, test — hermes-reconciler is not
      the only one, just the one CodeRabbit flagged.

      Design pass should decide enforcement points + allowlist source of truth:
        (a) PreToolUse/commit hook flagging new .mjs/.js/.ts in hive/lib outside a
            machine-readable bridge allowlist (derive allowlist from charter table)
        (b) /plan design-discussion gate that flags planned non-canonical runtime
            files before stories are written
        (c) CI lint as backstop
      Scope-class: new protocol/gate. Likely a small epic.

      Source: PR #305 CodeRabbit L17 + diagnosis 2026-06-20.
