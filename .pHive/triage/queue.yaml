  - id: t-006
    state: prioritized
    kind: feature
    title: "Rebuild review.workflow.yaml as a converge-loop (review<->fix until gate-clean) on the t-005 primitive"
    description: |
      Once the bounded converge-loop primitive (t-005) exists, make the review flow
      USE it. Today hive/workflows/review.workflow.yaml is a single linear pass
      (reviewer -> reconcile -> gate) with only bounded Node.retry on the reviewer
      node — it reviews once, it does not drive fixes to closure.

      Target shape: `review -> (gate: clean? done : fix -> review)` bounded by
      max_iterations, where the reviewer's findings feed the fix node and the gate
      is the s3 schema/criteria validation. This makes the substrate FINALIZE its
      own work — the loop this session ran by hand becomes a declarative graph.

      Depends on t-005 (the primitive). Likely also wants the Multica Codex
      `reviewer` agent as the review node (cross-LLM verification — creators run
      claude, reviewer must be a different model; see feedback_codex_general_backend
      memory). Scope check at planning: does the same converge-loop also belong in
      /test (test->fix->retest) and the execute methodology graphs' gate-fail path?

      Source: project_dag_flows_multica_shipped — the finalize-to-clean process is
      the identified next step after the substrate ships.
