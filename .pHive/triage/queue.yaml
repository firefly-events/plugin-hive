  - id: t-005
    state: prioritized
    kind: feature
    title: "Add a bounded converge-loop primitive to the DAG graph model (review↔fix until gate-clean)"
    description: |
      The graph model (hive/lib/dag_executor/graph/model.py) locks out cycles
      entirely (model.py:34 — no LOOP primitive). The dag-flows-multica epic added
      only the DEGENERATE loop case: `Node.retry.max_attempts` (s10/C2), which
      re-runs the SAME node a fixed N times with the SAME inputs.

      That cannot express a finalize-to-clean process: review → fix → re-review,
      repeating an UNKNOWN number of rounds until a gate predicate passes, with the
      review's FINDINGS flowing into the fix node each round. The process is fixed
      (always review→fix), only the data (findings) and iteration count are
      data-dependent. That is a runbook with a guarded cycle — it belongs in the
      DAG, not a squad (a squad is for emergent, can't-pre-draw processes).

      Build: a bounded-loop / fixpoint construct in the graph model + walker —
      a back-edge `producer → (gate: clean? exit : corrector → producer)` with:
      - a gate/exit predicate evaluated each iteration (reuse the s3/C3
        validate_output gate semantics),
      - a `max_iterations` safety cap (hard stop, fail-loud like Node.retry
        exhaustion — no infinite loops),
      - findings/outputs from the gate+corrector flowing back into the producer's
        inputs on the next iteration.
      Generalizes Node.retry (same-node/fixed-N) to multi-node/data-dependent-exit.
      Must NOT reintroduce unbounded cycles into the topological walk — the cap +
      the typed loop construct keep termination provable.

      Source: dag-flows-multica PR #310 review-convergence was driven BY HAND this
      session (orchestrator looped Codex-review->fix->re-review) precisely because
      the DAG cannot express it yet. See project_dag_flows_multica_shipped memory.
