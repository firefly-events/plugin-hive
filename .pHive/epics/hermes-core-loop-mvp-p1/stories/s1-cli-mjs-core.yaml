description: |
  Create hive/lib/multica-story-dispatch/cli.mjs — a thin Node CLI entry point
  wrapping the existing multica-story-dispatch library exports. This is a
  net-new file; no CLI entry point exists today.

  Commands (all output JSON to stdout, structured error envelope to stderr):

  dispatch --issue <uuid> [--agent <name> | --squad <name>]
    Wraps resolveAgentUuid/resolveSquadUuid + ensureIssueBriefMatches +
    moveOutOfBacklogIfNeeded + dispatchStoryToAgent/Squad.
    Idempotent: if the issue is already assigned + in_progress, no-op (exit 0,
    result.status: "already_dispatched").

  status --issue <uuid>
    NEW non-blocking snapshot. Two GETs: /active-task + /task-runs for the
    issue. Returns {status, started_at, task_id} synchronously. Must NOT
    call pollTaskUntilTerminal (that blocks ≤30 min and cancels on timeout;
    unfit for a 60-second tick). Implements via a new readTaskSnapshot
    helper that wraps the two raw API calls.

  poll --issue <uuid> [--timeout-ms <ms>]
    Wraps pollTaskUntilTerminal for non-cron callers only. Default timeout:
    1800000 ms. NOT used by the reconciler tick.

  episode --epic <handle> --story <id> --issue <uuid>
    Wraps writeMulticaRunEpisode. Writes
    .pHive/episodes/<epicHandle>/<storyId>/multica-run.yaml marker.

  cancel --issue <uuid>
    NEW. Issues POST /tasks/{id}/cancel currently buried inside
    pollTaskUntilTerminal. Exposes it as a first-class command for the
    watchdog rescue path.

  Error contract: on any failure, emit {"code": "<CODE>", "message": "<msg>"}
  to stderr and exit non-zero. On success, emit the result JSON to stdout
  and exit 0.

acceptance_criteria:
  - "Given `node cli.mjs dispatch --issue <valid-uuid> --agent developer`, when the issue is in backlog/todo, then the issue is assigned to the named agent, moved to in_progress, stdout emits {\"status\":\"dispatched\",\"issue_id\":\"<uuid>\"}, and exit code is 0."
  - "Given `node cli.mjs dispatch --issue <uuid> --agent developer`, when the issue is already assigned and in_progress (idempotency), then no mutation occurs, stdout emits {\"status\":\"already_dispatched\",\"issue_id\":\"<uuid>\"}, and exit code is 0."
  - "Given `node cli.mjs status --issue <uuid>`, the command returns within 5 seconds (no blocking poll), stdout emits {\"status\":\"<state>\",\"started_at\":\"<ISO8601-or-null>\",\"task_id\":\"<uuid-or-null>\"}, and exit code is 0."
  - "Given `node cli.mjs status --issue <uuid>` for an issue with no active task, then stdout emits {\"status\":\"idle\",\"started_at\":null,\"task_id\":null} and exit code is 0."
  - "Given `node cli.mjs cancel --issue <uuid>` for an in-flight task, then POST /tasks/{task_id}/cancel is issued, stdout emits {\"cancelled\":true,\"task_id\":\"<uuid>\"}, and exit code is 0."
  - "Given `node cli.mjs cancel --issue <uuid>` for an issue with no active task, then exit code is 1, stderr emits {\"code\":\"NO_ACTIVE_TASK\",\"message\":\"...\"}."
  - "Given `node cli.mjs episode --epic my-epic --story s1 --issue <uuid>`, when the task has a terminal record, then writeMulticaRunEpisode is called, the .pHive/episodes/my-epic/s1/multica-run.yaml file is written, and exit code is 0."
  - "Given `node cli.mjs poll --issue <uuid> --timeout-ms 5000`, when the task does not terminate within 5 seconds, then exit code is 0 and stdout emits {\"status\":\"cancelled\"} (matching pollTaskUntilTerminal timeout behavior)."
  - "Given any command with a missing required flag (e.g. `node cli.mjs dispatch` without --issue), then stderr emits {\"code\":\"MISSING_ARG\",\"message\":\"--issue is required\"} and exit code is 1."
  - "Given any command with an invalid UUID, then stderr emits {\"code\":\"INVALID_ARG\",\"message\":\"...\"} and exit code is 1."

