design_decisions:
  - decision: status cmd uses two raw GETs, not pollTaskUntilTerminal
    rationale: >
      pollTaskUntilTerminal blocks up to maxWallClockMs (default 1,800,000 ms)
      and cancels the task on timeout. Calling it from a 60s cron tick would
      cause runaway cancellations. The non-blocking snapshot reads only the
      current state.
  - decision: cancel exposed as first-class command, not inside status
    rationale: >
      The watchdog needs to cancel independently of the status check. A separate
      command keeps the cancel intent explicit and auditable in tick logs.
  - decision: no external argument-parsing library
    rationale: Five simple subcommands with named flags; process.argv parsing
      keeps the dependency surface minimal in an existing lib directory.

risks:
  - severity: medium
    description: >
      Cancel verb unverified — researcher flagged that the exact API path for
      cancelling a Multica task is not confirmed. Implementation must verify
      the endpoint (POST /tasks/{id}/cancel or equivalent) against a live instance.
    mitigation: >
      Research step reads pollTaskUntilTerminal source to find the cancel POST.
      If the endpoint shape differs, update cancel cmd accordingly.
  - severity: medium
    description: >
      started_at availability — if /active-task does not return started_at,
      status cmd returns null for that field and the watchdog falls back to
      dispatched_at from hermes_reconciler: block.
    mitigation: >
      Research step reads active-task response shape. Document the fallback
      path in the status cmd JSDoc and in cycle-reconciler.md (S3).
