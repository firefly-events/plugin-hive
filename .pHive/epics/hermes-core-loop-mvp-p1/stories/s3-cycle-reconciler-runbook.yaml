id: s3-cycle-reconciler-runbook
epic: hermes-core-loop-mvp
title: "cycle-reconciler.md — single-step-per-tick state-machine runbook"
status: blocked
complexity: medium
methodology: classic
repo: plugin-hive
depends_on: [s1-cli-mjs-core, s2-hermes-reconciler-state]

description: |
  Author hive/references/cycle-reconciler.md — the deterministic phase
  state-machine runbook that the Hermes cron job inlines as its prompt.

  This document IS the Hermes agent's decision logic for each tick. It must
  be machine-readable, copy-pasteable into a cron job prompt, and auditable
  as a diff in the plugin-hive repo.

  The runbook must document:

  1. Per-story phase positions (state machine):
       pending
       → dispatched_impl
       → impl_terminal
       → dispatched_review
       → review_terminal
           ├─ verdict = passed  → advance (next story pending, or epic_finalize_pr)
           └─ verdict = needs_revision  → dispatched_impl  (loop back, attempt++)
       → epic_finalize_pr  (when all stories reached "done")
       → done

  2. Strict tick priority (execute the FIRST matching branch only per tick):
       ① Watchdog check — if in-flight task exists and
            (now − dispatched_at) > stuck_after_seconds:
            cancel (cli.mjs cancel), re-dispatch (cli.mjs dispatch),
            attempt++, reset dispatched_at. Exit tick.
       ② Harvest terminal — if in-flight task has reached terminal state
            (via cli.mjs status): write episode marker (cli.mjs episode),
            extract verdict from handoff_log[] in cycle-state,
            advance phase_position. Exit tick.
       ③ Dispatch next — find first story with phase_position = pending
            (or looped-back dispatched_impl after needs_revision): dispatch
            (cli.mjs dispatch), write dispatched_at + in_flight_story_id +
            in_flight_task_id + current_phase. Exit tick.
       ④ Finalize — if all stories phase_position = done: open epic PR
            (via gh pr create or Multica PR action). Set gate_state = finalized.
            Exit tick.
       ⑤ No-op — no actionable transition; exit tick (wakeAgent already ran).

  3. Watchdog contract:
       - dispatched_at source: hermes_reconciler.dispatched_at (written at
         dispatch, NOT from episode marker which is post-terminal).
       - Live status: cli.mjs status --issue <uuid> (non-blocking, ≤5s).
       - Rescue: cli.mjs cancel --issue <uuid>, then cli.mjs dispatch
         (idempotent guard: re-dispatch is a no-op if already in_progress).
       - Bound: max_attempts (config, default 3). On exceed: set
         phase_position = blocked, write escalation to cycle-state
         escalations[] (no human relay in MVP — durable flag only).

  4. Verdict dialect normalization:
       - Review phase emits needs_revision (underscore) at review:complete.
       - handoff_log[] verdict enum uses needs-revision (hyphen).
       - Loop-back trigger MUST normalize both: treat needs_revision and
         needs-revision as equivalent before comparing to "needs_revision".
       - This is a named, explicit rule — not an implicit assumption.

  5. gate_state preflight:
       - At tick start, read hermes_reconciler.gate_state.
       - If not "pre_approved": return {wakeAgent: false}. Do not proceed.

acceptance_criteria:
  - "Given the runbook is opened, then it contains a state diagram or equivalent table covering all 7 named phase positions (pending, dispatched_impl, impl_terminal, dispatched_review, review_terminal, epic_finalize_pr, done) with all valid transitions labeled."
  - "Given the runbook is opened, then it contains the 5-priority tick decision tree in order: (1) watchdog, (2) harvest terminal, (3) dispatch next, (4) finalize, (5) no-op — with explicit \"exit tick after this step\" markers on branches (1)–(4)."
  - "Given the runbook is used as a cron job prompt and the in-flight task's age (now − dispatched_at) exceeds stuck_after_seconds, then the tick issues `cli.mjs cancel --issue <uuid>` followed by `cli.mjs dispatch --issue <uuid> --agent <same-agent>`, increments attempt, and exits."
  - "Given the runbook is used as a cron job prompt and the in-flight task's cli.mjs status returns a terminal state (completed | failed | cancelled), then the tick calls `cli.mjs episode`, reads the verdict from handoff_log[], and updates phase_position before exiting."
  - "Given a review terminates with verdict = \"needs_revision\" (underscore), when the tick processes it, then the runbook normalizes it to the needs-revision canonical form before comparing, and the story loops back to dispatched_impl with attempt++."
  - "Given a review terminates with verdict = \"needs-revision\" (hyphen from handoff_log), when the tick processes it, then the same loop-back occurs as for the underscore form."
  - "Given hermes_reconciler.gate_state is null or any value other than \"pre_approved\", when the runbook is inlined in the cron prompt, then the first instruction returns {\"wakeAgent\": false} without executing any tick logic."
  - "Given all stories in the epic have phase_position = done, when tick priority (4) runs, then the runbook instructs opening the epic finalize PR and setting gate_state = finalized."
  - "Given a story has attempt >= max_attempts and the watchdog fires again, then the runbook instructs setting phase_position = blocked and writing an escalation record — it does NOT dispatch again."
  - "Given the runbook is opened by a developer unfamiliar with the codebase, then each cli.mjs command reference includes the exact flag syntax as it exists in S1."

steps:
  - id: implement
    description: >
      Write hive/references/cycle-reconciler.md. Structure: (1) preamble
      (what this file is, how it is used by the cron job), (2) gate_state
      preflight, (3) state diagram, (4) tick priority decision tree with
      explicit cli.mjs command references and exact flag syntax, (5) watchdog
      contract, (6) verdict normalization rules, (7) escalation / blocked
      story protocol, (8) epic_finalize_pr protocol.
      All cli.mjs commands must match S1's implemented surface exactly.
    agent: developer
  - id: review
    description: >
      Cross-check every cli.mjs command reference in the runbook against
      the S1 implementation. Verify the 5-priority decision tree covers all
      reachable states. Verify verdict normalization section explicitly names
      both dialect forms. Verify no nested claude --print /skill instructions
      appear (all logic is inline prose + cli.mjs calls).
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/hive/Code/plugin-hive
  tech_stack:
    runtime: n/a (Markdown document)
  key_files:
    - path: hive/lib/multica-story-dispatch/cli.mjs
      purpose: >
        S1 output — all cli.mjs command references in the runbook must match
        this file's actual flag surface.
    - path: hive/references/cycle-state-schema.md
      purpose: >
        Defines handoff_log[] verdict enum (needs-revision with hyphen) and
        hermes_reconciler: block (S2). Runbook references both.
    - path: hive/references/
      purpose: >
        Existing machine-readable reference docs pattern. cycle-reconciler.md
        follows the same format conventions as other references/*.md files.

files_to_modify:
  - file: hive/references/cycle-reconciler.md
    change: NEW — state-machine runbook for the Hermes cron tick

design_decisions:
  - decision: runbook is inlined by the cron prompt, NOT invoked as a skill
    rationale: >
      The skill approach requires Hermes to shell to `claude --print /skill`,
      spawning a nested Claude Code session with latency + session overhead +
      a second approval surface. The Hermes cron tick already runs a full
      agent turn; the runbook IS the prompt. This matches the hive/references/
      pattern for machine-readable docs.
  - decision: deterministic mutations live in cli.mjs (code), not in the runbook
    rationale: >
      The runbook documents WHAT to decide and WHEN; it tells the agent which
      cli.mjs command to call. The actual state transition logic (idempotency
      guards, atomic write) lives in cli.mjs and the S2 state helpers. This
      keeps the runbook as the decision narrative and the code as the enforcer.

risks:
  - severity: medium
    description: >
      Runbook and S1 cli.mjs command surface can drift if S1 changes flags
      after S3 is written.
    mitigation: >
      Review step explicitly cross-checks all command references. Future
      changes to cli.mjs flag surface must update cycle-reconciler.md in the
      same commit.
