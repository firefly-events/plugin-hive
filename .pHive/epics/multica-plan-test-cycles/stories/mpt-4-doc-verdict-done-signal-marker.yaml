description: S3b. A Multica plan/test task produces docs/verdicts, not a code-push SHA, so the execute
  path's SHA-in-final-comment completion contract does not apply. Extend episode-sync.mjs (multica-run.yaml
  marker) so a doc/verdict task reaches terminal on artifacts-committed + episode-terminal status. Document
