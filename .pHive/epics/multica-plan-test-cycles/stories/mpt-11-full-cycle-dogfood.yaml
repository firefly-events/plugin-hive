id: mpt-11-full-cycle-dogfood
epic: multica-plan-test-cycles
title: Dogfood the full plan->execute->test cycle through Multica (throwaway)
status: pending
complexity: medium
methodology: classic
depends_on:
- mpt-8-wire-plan-phase0
- mpt-10-wire-test-simulated-manual
description: 'S6. Dogfood the complete cycle on a THROWAWAY workstream (gate decision #5): plan a tiny
  throwaway feature via Multica (mpt-8), run /execute (already on Multica), then /test --simulated-manual
  via Multica (mpt-10) as the verification checkpoint that the build matched the plan. Validate single-shared-branch
  + serial-against-trunk (no orphan branches; fresh-checkout/rebase-push) and capture episodes for all
  three cycles.'
acceptance_criteria:
- Given a throwaway feature, when planned then executed then tested via Multica, then all three cycles
  dispatch through Multica and episodes are captured for each.
- Given the run, then the test verdict confirms the build matched the plan (verification-checkpoint role),
  and serial-against-trunk held (no orphan agent branches).
steps:
- id: research
  description: Explore the codebase for relevant patterns, files, and constraints.
  agent: researcher
- id: implement
  description: Implement the story per spec and research findings.
  agent: developer
  depends_on:
  - research
- id: scenario
  description: Author a simulated-manual test scenario YAML under .pHive/test-scenarios/ per hive/references/test-scenario-schema.md
    (reconciled shape from mpt-2). Set manual_verdict.scenario_ref to the scenario path.
  agent: tester
  depends_on:
  - implement
- id: test
  description: Verify acceptance criteria and run the simulated-manual scenario.
  agent: tester
  depends_on:
  - scenario
- id: review
  description: Review implementation and tests for correctness and convention compliance.
  agent: reviewer
  depends_on:
  - test
- id: integrate
  description: Commit and push to the feature branch (fresh-checkout/rebase-push per integration principle).
  agent: developer
  depends_on:
  - review
