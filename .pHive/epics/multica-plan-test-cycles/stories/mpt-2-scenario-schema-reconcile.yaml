id: mpt-2-scenario-schema-reconcile
epic: multica-plan-test-cycles
title: Reconcile the two divergent simulated-manual scenario schemas into one
status: pending
complexity: medium
methodology: classic
depends_on: []
description: S2 (parallel to S1; hard-gate half for the test path). test-scenario-schema.md declares invocation/pre_conditions/expectations/sandcastle_mode_override
  while the loader (hive/lib/scenarios/load.mjs loadScenario) + executor expect mode/steps[{action,expected}]/preconditions/postconditions.
  Pick ONE canonical shape, update the schema doc and loader to agree, migrate any existing scenario files,
  and add loader tests. No Multica dispatch may consume scenarios until this lands.
acceptance_criteria:
- Given the reconciled schema, when loadScenario parses any existing or new scenario, then it accepts
  exactly one canonical shape with no drift between doc and loader.
- Given existing scenario files, when migrated, then all load without error under the updated loader.
- Loader tests cover the canonical shape and reject the legacy shape.
