id: mpt-1-squad-cell-dispatch-spike
epic: multica-plan-test-cycles
title: 'Spike: how Multica runs a squad task (squad-as-cell vs leader-only)'
status: pending
complexity: medium
methodology: classic
depends_on: []
description: Bounded spike (S1, fork point). Assign a throwaway issue to planning-team-squad via `multica
  issue assign --to-id <squad-uuid>` and observe whether Multica distributes the task across the squad's
  member-agents (each running on its agents.yaml provider) or runs only the squad leader. Confirm planning-team-squad
  and verify-team-squad member roles are actually seeded in .pHive/multica/agents.yaml. Write a verdict
  that PICKS THE CARRIER (squad-as-unit vs per-persona fan-out) for the downstream plan-dispatch stories
  (mpt-5..mpt-9) and states the implication for the Codex-for-work / Claude-for-verify backend split.
acceptance_criteria:
- Given a throwaway issue assigned to planning-team-squad, when it runs, then the task-runs/messages show
  which member-agents executed and on which provider, recorded in a spike verdict doc under .pHive/epics/multica-plan-test-cycles/research/.
- Given the squad rosters, when checked against .pHive/multica/agents.yaml, then any missing member role
  (e.g. test-architect/test-scout/security-reviewer) is explicitly flagged.
- Given the observation, then the verdict names the carrier (squad-as-unit | per-persona fan-out) and
  the backend-split implication, unblocking mpt-5.
