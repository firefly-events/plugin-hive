description: 'S5. Build skills/hive/skills/test-mode-multica/SKILL.md, atomic and symmetric with execute-mode-multica:
  dispatch a --simulated-manual scenario to a Multica `tester`, poll to terminal, write the verdict to
  the canonical home (story-YAML manual_verdict, mpt-3) plus an episode marker (mpt-4). Add a thin test
  dispatch-mode resolve via env HIVE_TEST_MODE or test.mode: multica. HARD-GATED on mpt-2 (schema) + mpt-4
  (done-signal).'
acceptance_criteria:
- 'Given test.mode: multica and a reconciled scenario, when /test --simulated-manual runs, then test-mode-multica
  dispatches to a Multica tester and polls to terminal.'
- Given the run terminates, then the verdict lands in the story-YAML manual_verdict block (canonical home)
  and an episode marker is written.
