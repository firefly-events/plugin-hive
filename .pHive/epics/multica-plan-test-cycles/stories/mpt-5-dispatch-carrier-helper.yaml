id: mpt-5-dispatch-carrier-helper
epic: multica-plan-test-cycles
title: Add the dispatch carrier to multica-story-dispatch (squad or per-persona, per spike)
status: pending
complexity: medium
methodology: classic
depends_on:
- mpt-1-squad-cell-dispatch-spike
description: 'S4 lib (conditional on the mpt-1 spike verdict). If squad-as-unit: add dispatchStoryToSquad(serverUrl,
  token, workspaceId, issueUuid, squadUuid) using the squad-assign API. If per-persona fan-out: add a
  helper that dispatches one issue per persona to its agent, honoring agent_backends. Either way the helper
  must preserve the Codex-for-work / Claude-for-verify split and carry unit tests in the existing serialize-story-brief.test.mjs
  style.'
acceptance_criteria:
- Given the spike carrier, when the new helper dispatches, then work reaches the correct agent(s) and
  the per-persona Codex/Claude split is preserved.
- Given the helper, when tested, then unit tests cover the dispatch shape and the backend-split mapping.
