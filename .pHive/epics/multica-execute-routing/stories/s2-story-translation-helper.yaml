id: s2-story-translation-helper
epic: multica-execute-routing
title: "hive/lib/multica-story-dispatch: brief serialization + agent UUID resolution + dispatch PUT"
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  Build the pure-function helper module that translates between Hive
  story specs and Multica issue/agent operations. This module is what
  s3 (execute-mode-multica skill) calls to actually dispatch each story.

  Four exported functions (all async, ESM):

  1. `serializeStoryBrief(story) → markdown` — pure formatter; takes a
     parsed story YAML object, returns markdown for the Multica issue
     description. Sections: Goal (from story.description), Acceptance
     Criteria (from story.acceptance_criteria), Files (from
     story.files_to_modify), Code Examples (from story.code_examples with
     snippets), References (from story.references with relevant_excerpt).
     This is the "what the agent sees" payload.

  2. `resolveAgentUuidByName(serverUrl, token, workspaceId, agentName)
     → uuid | throws` — calls GET /api/agents?workspace_id=<UUID>, finds
     the agent with matching `name` field, returns its UUID. Throws
     structured `{code: "BOOTSTRAP_REQUIRED", message: "no agent
     '<name>' in workspace; run /hive:multica-init"}` if the agent is
     missing OR the list is empty. Caches per (serverUrl, workspaceId,
     token-fingerprint) — mirror the SHA-256 fingerprint pattern from
     hive/lib/multica-bootstrap/index.mjs's RUNTIME_CACHE.

  3. `ensureIssueBriefMatches(serverUrl, token, workspaceId, issueUuid,
     brief) → {was_updated: bool, current_brief: string}` — fetches
     issue via GET, compares description to brief, if mismatch calls PUT
     to update description. Idempotent: returns was_updated=false when
     already in sync.

  4. `dispatchStoryToAgent(serverUrl, token, workspaceId, issueUuid,
     agentUuid) → response` — calls PUT /api/issues/<UUID> with body
     {assignee_type: "agent", assignee_id: agentUuid}. Returns the full
     issue response (which includes the resulting assignee fields). This
     is what triggers Multica's internal EnqueueTaskForIssue, spawning
     the agent task.

  All functions reuse fetch + AbortSignal.timeout(30_000) pattern from
  hive/lib/multica-bootstrap/index.mjs:42-63. All functions strip tokens
  from error messages via a `sanitize()` helper (same approach as the
  bootstrap module's bootstrapError). No raw token storage in caches.

  Pre-dispatch precondition (called by s3 skill, NOT this helper): if
  the issue status is `backlog`, the dispatch must first move it out of
  backlog (research line 109 — backlog suppresses enqueue). This helper
  exposes a 5th utility:

  5. `moveOutOfBacklogIfNeeded(serverUrl, token, workspaceId, issueUuid)
     → was_moved: bool` — fetches issue status; if `backlog`, PUT to
     `todo`. Idempotent.

acceptance_criteria:
  - "Given a story object with description, acceptance_criteria (4 items), and files_to_modify (3 entries), when serializeStoryBrief is called, then the returned markdown contains sections for each input field and is non-empty."
  - "Given GET /api/agents returns 3 agents [{name:'developer', id:'uuid-1'}, ...], when resolveAgentUuidByName is called with name='developer', then it returns 'uuid-1'."
  - "Given GET /api/agents returns empty array, when resolveAgentUuidByName is called with any name, then it throws {code:'BOOTSTRAP_REQUIRED', message containing '/hive:multica-init'}."
  - "Given GET /api/agents returns [{name:'developer'}] only, when resolveAgentUuidByName is called with name='tester', then it throws {code:'BOOTSTRAP_REQUIRED', message naming both 'tester' and the available agents}."
  - "Given an issue with description matching the brief exactly, when ensureIssueBriefMatches runs, then was_updated is false and no PUT call is made."
  - "Given an issue with description differing from the brief, when ensureIssueBriefMatches runs, then PUT is called with body {description: brief} and was_updated is true."
  - "Given a valid issueUuid and agentUuid, when dispatchStoryToAgent runs, then PUT is called with body {assignee_type:'agent', assignee_id:agentUuid} and the response contains assignee_id equal to agentUuid."
  - "Given an issue with status:'backlog', when moveOutOfBacklogIfNeeded runs, then PUT is called with body {status:'todo'} and was_moved is true."
  - "Given an issue with status:'in_progress', when moveOutOfBacklogIfNeeded runs, then was_moved is false and no PUT call is made (only the initial GET)."
  - "Given fetch is interrupted past 30 seconds, when any of the 5 functions runs, then it throws a structured TRANSPORT error mentioning timeout — no PAT leakage in the message."

steps:
  - id: research
    description: Read hive/lib/multica-bootstrap/index.mjs to copy the patterns for HTTP fetch wrapper, AbortSignal.timeout handling, SHA-256 token fingerprint, sanitize()/bootstrapError() error redaction, and pure-function module shape. Also read hive/adapters/multica/index.ts for the toAbiStory pattern and existing PUT issue update wire shape.
    agent: researcher
  - id: implement
    description: Write hive/lib/multica-story-dispatch/index.mjs (~250 lines) exporting the 5 functions. Reuse fetch wrapper + timeout + redaction patterns from bootstrap. Pure-ish (one module-level cache for agent UUIDs, keyed by SHA-256 token fingerprint). Add hive/lib/multica-story-dispatch/README.md documenting the 5-function contract.
    agent: developer
    depends_on:
      - research
  - id: test
    description: Write tests/multica-story-dispatch.test.mjs covering all 10 AC cases via node:test. Mock Multica server via node:http.createServer (mirror the s1 adapter test pattern). Ephemeral port. Isolate agent UUID cache via per-test instance.
    agent: tester
    depends_on:
      - implement
  - id: review
    description: Verify token never enters cache keys raw (must be SHA-256 fingerprinted per the PR #201 fix #7 deviation). Verify error messages don't leak tokens. Verify all 5 functions are properly async + handle fetch failures. Confirm dispatchStoryToAgent uses PUT (NOT PATCH — PATCH returns 405 per s1 friction notes).
    agent: reviewer
    depends_on:
      - test
  - id: integrate
    description: Commit on feat/multica-execute-routing branch
    agent: developer
    depends_on:
      - review

