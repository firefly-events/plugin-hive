design_decisions:
  - decision: "Pure functions, no global mutable state except the agent UUID cache"
    rationale: "Easier to test, easier to compose from s3 skill. Cache is keyed by (server, workspace, token fingerprint) so multi-target scenarios stay isolated."
  - decision: "Fail-loud on missing agent rather than auto-bootstrap"
    rationale: "execution.mode: multica is explicit user intent. Silent fallback to /hive:multica-init invocation would hide config drift. Error message points the user at the fix."
  - decision: "ensureIssueBriefMatches as separate idempotent function"
    rationale: "Caller (s3 skill) can decide whether to re-write briefs on every run or skip when in sync. Splitting the concern keeps dispatchStoryToAgent focused on the assignment PUT."
  - decision: "moveOutOfBacklogIfNeeded exposed at this layer"
    rationale: "Backlog-status suppresses enqueue per research line 109. The check belongs in the dispatch layer, not in the skill prose."

