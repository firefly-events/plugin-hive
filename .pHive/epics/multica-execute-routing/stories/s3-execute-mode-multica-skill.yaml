design_decisions:
  - decision: "Whole-story-to-one-Multica-agent v1 contract (per design discussion D1)"
    rationale: "Multica agents already run an internal multi-step loop. Carving up into per-Hive-phase markers would require synthetic boundaries that don't exist in Multica's model. Whole-story is the natural unit; per-phase routing is v2."
  - decision: "Fail-loud on missing bootstrap (no auto-bootstrap, no silent fallback)"
    rationale: "execution.mode: multica is explicit user intent. Silent fallback to sequential masks config drift. Failing loud points the user at /hive:multica-init."
  - decision: "Parallel dispatch within a depth, serial across depths"
    rationale: "Mirrors sandcastle's depth-0 fan-out semantics. Multica's task queue handles concurrency within a depth; the depth barrier preserves the dependency graph invariant."
  - decision: "Sidecar injection deferred to v2 with log line"
    rationale: "v1 contract is whole-story-to-one-agent. Sidecar reviewers would require multi-agent coordination through Multica's issue/comment surface — a v2 design space."
  - decision: "Single episode marker per story (multica-run.yaml), not per Hive phase"
    rationale: "Per D1 above. Audit trail comes from the last-N messages captured into the episode artifact."

cross_cutting:
  - concern: documentation
    action: "Skill self-documents via SKILL.md; cross-link from README + GUIDE in s5"

metric:
  applies: true
  name: multica.dispatch_terminal_success_rate
  direction: up
  unit: ratio
  baseline: 0.0
  target: 0.95
  window: next-3-multica-execute-runs
  source:
    kind: events
    ref: "Episode markers at .pHive/episodes/multica-execute-routing/*/multica-run.yaml — count status:passed / total terminal markers"
  verify_at: integrate
  owner: reviewer
  notes: |
    First dogfood of /execute via Multica. After s5 smoke and the next
    several real /execute runs, success rate should be >=95%. Anything
    less means dispatch flakiness — investigate poll cadence, timeout
    settings, or Multica spike stability.

risks:
  - severity: high
    description: "Multica task can hang indefinitely if the agent gets stuck — no max wall-clock timeout in v0.3.4 task model"
    mitigation: "Skill imposes a configurable max wall-clock timeout per story (default 30 min via execution.multica.story_timeout_seconds). On timeout, calls cancellation endpoint and writes status=cancelled episode marker."
  - severity: medium
    description: "Multica spike API instability mid-run (daemon crash, network partition)"
    mitigation: "Poll loop handles fetch errors as transient; structured TRANSPORT error after max_retries; cancel + write failed marker"
  - severity: low
    description: "Episode marker location collides with prior sandcastle run on same story"
    mitigation: "Use multica-run.yaml suffix (not the generic *.yaml that sandcastle uses) to distinguish"

