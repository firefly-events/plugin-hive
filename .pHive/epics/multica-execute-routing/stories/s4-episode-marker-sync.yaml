    Episode markers are the user-facing audit trail. Drift between Hive
    marker and Multica reality = trust failure. 1.0 = no drift allowed.

risks:
  - severity: medium
    description: "Cancellation endpoint may fail if task already terminated between last poll and cancel call"
    mitigation: "Wrap cancel in try/catch; treat 404/409 as already-terminal; proceed to write final marker based on the polled terminal status"
  - severity: low
    description: "Messages stream pagination is seq-based; large messages arrays could exceed memory"
    mitigation: "Stream by seq using ?since=<seq> if endpoint supports (probe in research); fall back to full fetch + slice-tail"
  - severity: low
    description: "AgentTaskResponse.workspace_id is empty string in API responses (research line 307)"
    mitigation: "Episode marker uses the workspace_id from the caller's context (s3 skill knows it), not from the task response"

