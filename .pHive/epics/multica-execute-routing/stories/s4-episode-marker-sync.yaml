id: s4-episode-marker-sync
epic: multica-execute-routing
title: "Episode marker sync — pollTaskUntilTerminal + state transitions + last-N messages capture"
status: blocked
complexity: medium
methodology: classic
depends_on:
  - s3-execute-mode-multica-skill

description: |
  Build the polling + episode-marker-writing helper that s3 (the mode
  skill) calls per story. This is the bridge between Multica's task
  state model and Hive's episode marker schema.

  New file: hive/lib/multica-story-dispatch/episode-sync.mjs (placed
  alongside the s2 helper module). Two exported async functions:

  1. `pollTaskUntilTerminal(opts) → {final_status, runs, messages}` —
     polls Multica's task surface until terminal. Options:
     - serverUrl, token, workspaceId, issueUuid (target)
     - pollIntervalMs (default 5000)
     - maxWallClockMs (default 1_800_000 = 30 min; from
       hive_config.execution.multica.story_timeout_seconds * 1000)
     - onStateTransition (callback fn invoked when status changes)

     Loop: every pollIntervalMs, call
     `GET /api/issues/<UUID>/active-task?workspace_id=<UUID>`. If tasks
     array is empty, also call `GET /api/issues/<UUID>/task-runs` for
     history. Track current status; on change, invoke onStateTransition.
     Stop when status ∈ {completed, failed, cancelled} OR maxWallClockMs
     elapsed. On timeout, call cancellation endpoint
     (POST /api/issues/<UUID>/tasks/<task_id>/cancel) then return
     status=cancelled.

  2. `writeMulticaRunEpisode(opts) → episode_path` — writes the Hive
     episode marker at .pHive/episodes/<epic>/<story>/multica-run.yaml
     per hive/references/episode-schema.md. Single marker per story (v1
     contract — NOT per Hive workflow phase). Shape:

     ```yaml
     step: multica-run
     story: <story-id>
     epic: <epic-id>
     agent: <multica-agent-name>  # e.g. "developer" or "spike-claude"
     status: passed|failed|cancelled
     started_at: <ISO>
     completed_at: <ISO>
     artifacts:
       - .pHive/episodes/<epic>/<story>/multica-run.messages.jsonl
     multica:
       issue_id: <round-trip-key e.g. plugin-hive/PLU-42>
       issue_uuid: <UUID>
       task_id: <UUID>
       agent_id: <UUID>
       work_dir: <Multica-reported work_dir>
       attempts: <int>
     notes: <one line summary or error message>
     ```

     Also writes a sidecar file multica-run.messages.jsonl with the last
     N messages from `GET /api/tasks/<task_id>/messages` (default N=200,
     truncated from the end) for audit. JSONL one message per line.

  State transition mapping (Multica → Hive episode status):
  - Multica `queued`/`dispatched`/`running` → Hive (mid-flight, no
    terminal marker yet; status=in_progress when starting, no marker
    written until terminal)
  - Multica `completed` → Hive `passed`
  - Multica `failed` → Hive `failed`
  - Multica `cancelled` → Hive `cancelled`
  - Timeout (wall-clock exceeded with no Multica terminal) → Hive
    `cancelled` with notes='timeout after Xs'

  Polling is intentionally simple (HTTP poll, no SSE) per design
  discussion D4. SSE/WebSocket consumption is v2.

acceptance_criteria:
  - "Given pollTaskUntilTerminal is called and the mock server returns task status `running` for 2 calls then `completed`, when the poll loop runs with pollIntervalMs=10, then it makes 3 active-task GETs total and returns final_status=completed."
  - "Given pollTaskUntilTerminal is called and the mock returns `failed` with error='OOM', when the loop runs, then it returns final_status=failed and the runs array contains an entry with error='OOM'."
  - "Given pollTaskUntilTerminal is called with maxWallClockMs=50 and the mock returns `running` indefinitely, when 50ms elapses, then the cancellation endpoint is called for the active task and the function returns final_status=cancelled."
  - "Given onStateTransition callback is provided and the task transitions queued → running → completed, when the loop runs, then the callback is invoked exactly twice (queued→running and running→completed) with the new status."
  - "Given writeMulticaRunEpisode is called with status=passed and full task metadata, when it writes, then the resulting YAML file at .pHive/episodes/<epic>/<story>/multica-run.yaml is parseable, contains all the schema fields, and the messages.jsonl sidecar is non-empty when /api/tasks/<id>/messages returned messages."
  - "Given writeMulticaRunEpisode is called with messages > N=200, when the sidecar is written, then it contains exactly the last 200 messages (by seq) and the marker's notes contains 'truncated to 200 of <total>' indicator."
  - "Given pollTaskUntilTerminal is called and a fetch fails transiently, when the loop runs, then the failure is treated as transient (no exception thrown) and the next poll proceeds; after 3 consecutive transient failures, a TRANSPORT error IS thrown with the underlying cause."

steps:
  - id: research
    description: Read hive/references/episode-schema.md to lock the marker shape and required vs optional fields. Read hive/lib/multica-bootstrap/index.mjs for the fetch + timeout + sanitize patterns to reuse. Read s2 helper (hive/lib/multica-story-dispatch/index.mjs) to confirm fetch wrapper signature so episode-sync.mjs imports it instead of duplicating.
    agent: researcher
  - id: implement
    description: Write hive/lib/multica-story-dispatch/episode-sync.mjs (~200 lines) exporting pollTaskUntilTerminal + writeMulticaRunEpisode. Imports fetch wrapper from index.mjs. Pure functions where possible; episode write does fs.mkdirSync + fs.writeFileSync.
    agent: developer
    depends_on:
      - research
  - id: test
    description: Write tests/multica-episode-sync.test.mjs covering 7 AC cases. Mock Multica server (mirror s2 pattern). Use tmp dirs for episode writes. Verify YAML parse-roundtrip on written markers.
    agent: tester
    depends_on:
      - implement
  - id: review
    description: Verify state transition mapping matches design D1 (whole-story episode, single marker per story). Verify timeout path actually calls cancellation endpoint (not just abandons the task). Verify messages.jsonl truncation preserves the LAST N (not the first N — first N would lose the most recent context). Verify episode schema fields all present.
    agent: reviewer
    depends_on:
      - test
  - id: integrate
    description: Commit on feat/multica-execute-routing branch
    agent: developer
    depends_on:
      - review

