design_decisions:
  - decision: "Single episode marker per story (v1 contract per D1)"
    rationale: "Multica owns the full story; per-Hive-phase markers would be synthetic. The messages.jsonl sidecar provides audit detail."
  - decision: "Polling, not SSE/WebSocket (per D4)"
    rationale: "Spike v0.3.4 SSE stability unclear (research Q5). HTTP poll is the dumb-and-works baseline; SSE is v2."
  - decision: "Last-N messages truncation (default 200)"
    rationale: "Long-running Multica tasks can emit hundreds of messages. Last-N preserves recent context (where errors usually surface) without unbounded growth. Configurable via hive_config.execution.multica.messages_capture_max."
  - decision: "Transient fetch failures tolerated (3 consecutive before throwing)"
    rationale: "Spike daemon may have brief hiccups (restart, GC pause). Tight polling with low tolerance would generate false failures. 3-strike rule balances signal-vs-noise."
  - decision: "Timeout actively cancels the task (not just abandons polling)"
    rationale: "Leaving abandoned Multica tasks running consumes spike resources and could surprise on next poll. Explicit cancellation matches the user's intent (timeout = give up)."

