design_decisions:
  - decision: "Mirror sandcastle override pattern byte-for-byte (just s/sandcastle/multica/)"
    rationale: "Sandcastle's pattern is already proven, tested, and consumed by the runner. Diverging would introduce subtle bugs."
  - decision: "Multica is opt-in only — no default change"
    rationale: "Per epic scope: default stays sequential. Flipping the default belongs to a separate future epic, not here."
  - decision: "env wins over config (matches existing precedence)"
    rationale: "Standard Hive precedence (env > config > default) preserved across the multica branch."

