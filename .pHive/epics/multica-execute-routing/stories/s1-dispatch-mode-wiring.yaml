id: s1-dispatch-mode-wiring
epic: multica-execute-routing
title: Add multica to execute-dispatch mode_decision precedence
status: pending
complexity: low
methodology: classic
depends_on: []

description: |
  Add `multica` as a recognized value of the execute-dispatch sub-skill's
  `execution_mode` override surface. This is the entry point for the new
  dispatch mode — without this story, no amount of skill or helper code
  downstream gets reached.

  Mirrors the existing sandcastle override at
  skills/hive/skills/execute-dispatch/SKILL.md:64-69 byte-for-byte except
  for the literal string `multica`. Two trigger paths:

  1. `env.HIVE_EXECUTION_MODE` exactly equals `multica` (case-sensitive)
     → source `env`
  2. Root `hive.config.yaml execution.mode: multica` → source `config`

  Either triggers `mode_decision=multica` and
  `mode_reason=execution-mode-override-{env|config}`. Like the existing
  sandcastle override, this takes precedence over the entire
  sessions/team/sequential resolution chain in Step 1.

  Also extend Step 1.5 (parallel-dispatch gate) to include `multica` in
  the set of fan-out modes that pass through it. The new mode fans out
  one Multica agent assignment per depth-0 story, matching the parallel
  semantics of sandcastle.

  The mode enum currently documented at lines 14-18 must add `multica`
  alongside `sessions | team | team-cmux | sequential | sandcastle`.

acceptance_criteria:
  - "Given env HIVE_EXECUTION_MODE=multica (any other field unset), when the dispatch sub-skill resolves, then mode_decision is `multica` and mode_reason is `execution-mode-override-env`."
  - "Given root hive.config.yaml has execution.mode: multica (env unset), when the dispatch sub-skill resolves, then mode_decision is `multica` and mode_reason is `execution-mode-override-config`."
  - "Given HIVE_EXECUTION_MODE=multica AND execution.mode: sandcastle, when the dispatch sub-skill resolves, then mode_decision is `multica` (env wins per existing precedence rules)."
  - "Given execution.mode set to any string other than `multica` or `sandcastle` (e.g. `bogus`), when the dispatch sub-skill resolves, then the override is ignored and standard fallback resolution proceeds (matches existing sandcastle reserved-for-future behavior)."
  - "Given execution.mode: multica AND unblocked_stories[] has 3 depth-0 entries, when Step 1.5 parallel gate evaluates, then `multica` is recognized as a fan-out mode and the gate runs (does not silently bypass)."
  - "Given execution.mode unset (default), when the dispatch sub-skill resolves, then mode_decision is `sequential` (or whatever the existing default resolution returns) — multica branch must be opt-in only, never default."

steps:
  - id: research
    description: Read execute-dispatch.SKILL.md fully to confirm the sandcastle override pattern lines 64-69, the input/output contract lines 14-18, and the Step 1.5 parallel-gate inclusion at lines 99-127. Capture the exact verb/wording style for the new multica branch to match.
    agent: researcher
  - id: implement
    description: Edit execute-dispatch.SKILL.md to add the multica branch in the execution_mode resolution, extend the mode enum, and add multica to Step 1.5 parallel-gate's recognized modes. No new file. Single skill file edited.
    agent: developer
    depends_on:
      - research
  - id: test
    description: Write tests/hive-lib/execute-dispatch-multica.test.mjs covering the 6 AC cases. Use the existing execute-dispatch test pattern as template. Mock env + config inputs; assert mode_decision + mode_reason output values match expected.
    agent: tester
    depends_on:
      - implement
  - id: review
    description: Verify the sandcastle override branch is byte-identical for sandcastle inputs (regression-safe). Confirm Step 1 standard fallback chain still resolves as before when neither sandcastle nor multica override fires. Confirm the enum addition doesn't break any existing dispatch test.
    agent: reviewer
    depends_on:
      - test
  - id: integrate
    description: Commit on feat/multica-execute-routing branch
    agent: developer
    depends_on:
      - review

