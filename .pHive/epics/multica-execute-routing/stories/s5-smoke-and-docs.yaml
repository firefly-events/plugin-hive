design_decisions:
  - decision: "Smoke is gated on live spike, not a CI hard requirement"
    rationale: "CI runners don't have Multica running. The smoke is for local dogfood validation. Gating on /healthz means a clean skip in CI; a clean test run locally."
  - decision: "Version bump = minor (2.6.0 → 2.7.0), not major"
    rationale: "Additive opt-in dispatch mode. Default unchanged. No existing flow breaks. Semver minor is the honest call."
  - decision: "Smoke uses helper modules directly, not full /execute orchestration"
    rationale: "/execute pulls in workflow YAML loading, story spec parsing, episode markers, gate checks — too heavy for a smoke. The point is validating dispatch path works end-to-end, not exercising the full /execute skill."

cross_cutting:
  - concern: documentation
    action: "This story IS the documentation pass for the new mode"
  - concern: versioning
    action: "2.7.0 bump executed here. 4 touch points must match — plugin.json, marketplace.json (x2), README badge. CHANGELOG 2.7.0 entry lands."

metric:
  applies: true
  name: multica.first_smoke_pass_rate
  direction: up
  unit: ratio
  baseline: 0.0
  target: 1.0
  window: at-integrate
  source:
    kind: events
    ref: "tests/smoke/multica-execute-mode.test.mjs result on the first run against live spike post-merge"
  verify_at: integrate
  owner: reviewer
  notes: |
    The smoke test passing is the v1 contract validation. If it fails on
    the first dogfood, the whole epic ships broken regardless of unit
    test coverage. 1.0 = green on first try.

risks:
  - severity: medium
    description: "Live spike smoke could surface issues unit tests missed"
    mitigation: "Smoke is the explicit gate. If it fails, we iterate on s1-s4 before this story merges. Spike state (running daemon + bootstrapped agents) is a prerequisite."
  - severity: low
    description: "Doc keyword tests are brittle to wording changes"
    mitigation: "Test asserts on a small set of stable terms (multica, /hive:multica-init, etc.) — rewording prose around them is safe"

references:
