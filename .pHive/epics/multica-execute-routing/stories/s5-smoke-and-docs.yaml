id: s5-smoke-and-docs
epic: multica-execute-routing
title: "End-to-end smoke against live spike + README/GUIDE/CHANGELOG + version bump 2.7.0"
status: blocked
complexity: low
methodology: classic
depends_on:
  - s4-episode-marker-sync

description: |
  Capstone story for the multica-execute-routing follow-on. Three
  deliverables:

  1. **Smoke test against live spike.** New
     tests/smoke/multica-execute-mode.test.mjs that exercises the full
     dispatch path end-to-end against the running Multica daemon at
     http://127.0.0.1:8080. Gated on daemon availability — skips with a
     clear message if /healthz fails. Creates a tiny throwaway test
     epic + 1 story, sets HIVE_EXECUTION_MODE=multica, drives the
     dispatch via the helper modules (not via /execute orchestration —
     too heavy for a smoke), waits for terminal task state, asserts
     episode marker exists with status=passed.

     This is the FIRST dogfood of the new mode end-to-end. Expectation:
     it actually works against your local spike, validating the s1-s4
     chain.

  2. **Doc updates.** README.md "How execution works" subsection gets a
     paragraph on the multica mode (env var trigger + config var
     trigger + what bootstrap is required). GUIDE.md "Execution Model"
     section extends to cover the v1 contract (whole-story-to-one-
     Multica-agent, episode-per-story, fail-loud bootstrap, sidecars
     deferred to v2). Cross-link from skills/multica-init/SKILL.md to
     the new execute-mode-multica skill.

  3. **Version bump + CHANGELOG.** Plugin version 2.6.0 → 2.7.0 across:
     - .claude-plugin/plugin.json
     - .claude-plugin/marketplace.json (BOTH version fields — top-level
       AND inner plugins[0].version)
     - README.md badge (version-2.7.0-green)
     - CHANGELOG.md gets a 2.7.0 entry under Unreleased, with sections:
       Added (the new mode + skill + helpers), Changed (execute-dispatch
       gains multica branch), Notes (additive; default unchanged; not
       breaking).

  Version parity test (tests/multica-execute-mode-docs-version.test.mjs)
  asserts all 4 version surfaces match 2.7.0 AND the CHANGELOG 2.7.0
  entry mentions key terms (multica, execute-mode-multica,
  HIVE_EXECUTION_MODE, /hive:multica-init) AND README mentions the env
  var trigger AND GUIDE mentions whole-story contract.

acceptance_criteria:
  - "Given the live Multica daemon is reachable at http://127.0.0.1:8080 AND .pHive/multica/agents.yaml seeds are bootstrapped (developer agent present), when the smoke test runs, then a Multica issue is created, dispatched to the developer agent, the task reaches a terminal state within max wall-clock, and an episode marker is written with status=passed."
  - "Given the live Multica daemon is unreachable, when the smoke test runs, then it skips with a clear message naming /healthz and exit code 0 (skip, not fail)."
  - "Given .claude-plugin/plugin.json is read, when version is checked, then it reads exactly '2.7.0'."
  - "Given .claude-plugin/marketplace.json is read, when both version fields are checked, then both equal '2.7.0' (no drift between outer and inner)."
  - "Given README.md is read, when the version badge line is parsed, then it contains 'version-2.7.0-green'."
  - "Given CHANGELOG.md is read, when the 2.7.0 section is located, then it contains the substrings 'multica', 'execute-mode-multica', 'HIVE_EXECUTION_MODE', AND '/hive:multica-init'."
  - "Given README.md is read, when scanning for the multica mode docs, then it mentions both 'HIVE_EXECUTION_MODE=multica' AND 'execution.mode: multica' as trigger paths."
  - "Given GUIDE.md is read, when scanning the Execution Model section, then it mentions 'whole-story', 'fail-loud', and 'multica-run.yaml' (the episode marker)."

steps:
  - id: research
    description: Read current README.md, GUIDE.md (created in multica-substrate-adoption s5), CHANGELOG.md to find the touch points to extend. Confirm plugin.json + marketplace.json version-field locations from the s5 prior pattern. Identify the exact sub-section in README "How execution works" to extend.
    agent: researcher
  - id: implement
    description: Apply all 5 file edits + write 2 new test files. Mirror the multica-substrate-adoption s5 approach for version bump. Use Codex-style direct edits.
    agent: developer
    depends_on:
      - research
  - id: test
    description: Run tests/multica-execute-mode-docs-version.test.mjs (offline, fast). Optionally run tests/smoke/multica-execute-mode.test.mjs against the live spike if reachable — if not, ensure the skip path works. Also run mdlint + yamllint against changed docs.
    agent: tester
    depends_on:
      - implement
  - id: review
    description: Verify the version bump is consistent across all 4 surfaces. Verify README + GUIDE language matches the v1 contract (no over-promising per-phase episodes or sidecar reviewers). Verify CHANGELOG entry is honest about the additive/non-breaking nature.
    agent: reviewer
    depends_on:
      - test
  - id: integrate
    description: Commit on feat/multica-execute-routing branch
    agent: developer
    depends_on:
      - review

