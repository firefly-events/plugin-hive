name: multica-execute-routing
title: Wire /execute to dispatch through Multica agents (opt-in mode)
description: |
  Follow-on to multica-substrate-adoption (v2.6.0). Adds `multica` as an
  additional /execute dispatch mode alongside sandcastle/team/sequential.
  Default remains sequential. Triggered via `HIVE_EXECUTION_MODE=multica`
  env var or `execution.mode: multica` config — mirrors the existing
  sandcastle override pattern.

  /plan Phase D already files stories as Multica issues (s2 wiring
  shipped in 2.6.0). This work picks up from there: the new mode fetches
  or creates the issue, writes the story brief into the issue
  description, resolves the assigned agent by name from
  .pHive/multica/agents.yaml, dispatches via PUT /api/issues/{uuid} with
  assignee_type=agent, polls task state via /active-task and /task-runs,
  and writes one Hive episode marker per story when the task reaches a
  terminal state.

  v1 contract: whole-story-to-one-Multica-agent. The assigned developer
  agent runs the full classic workflow internally (research → implement
  → test → review → integrate) inside its own work_dir. Per-phase Hive
  episodes and sidecar reviewer routing are deferred to a v2 multi-agent
  contract.

target_codebase: /Users/don/Documents/plugin-hive
methodology: classic

git_flow:
  base_branch: develop
  branch_strategy: per-epic

stories:
  - id: s1-dispatch-mode-wiring
    title: Add multica to execute-dispatch mode_decision precedence
    complexity: low
    depends_on: []

  - id: s2-story-translation-helper
    title: "hive/lib/multica-story-dispatch: brief serialization + agent UUID resolution + dispatch PUT"
    complexity: medium
    depends_on: []

  - id: s3-execute-mode-multica-skill
    title: "skills/hive/skills/execute-mode-multica: per-story lifecycle (precondition → fetch → brief → dispatch → poll → cleanup)"
    complexity: medium
    depends_on:
      - s1-dispatch-mode-wiring
      - s2-story-translation-helper

  - id: s4-episode-marker-sync
    title: "Episode marker sync — pollTaskUntilTerminal + state transitions + last-N messages capture"
    complexity: medium
    depends_on:
      - s3-execute-mode-multica-skill

  - id: s5-smoke-and-docs
    title: "End-to-end smoke against live spike + README/GUIDE/CHANGELOG + version bump 2.7.0"
    complexity: low
    depends_on:
      - s4-episode-marker-sync
