id: m-07-retro-backfill
epic: metrics-as-planning-concern
title: Retro-backfill metric blocks for 3 shipped epics; run verdict pass
status: completed
complexity: medium
methodology: classic
depends_on: [m-05-metrics-check-skill]
wave: W3
action_id: M-07

description: |
  Proves the gate would have caught silent failures. Backfill `metric:` blocks
  onto stories in 3 shipped epics, then run /metrics-check against them and
  compare outcome to lived reality.

  Target epics (verified shipped on main):
    1. kg-augmented-meta-signal (release 1.1.4)
       Expected outcome: FAIL — 0 kg_signal findings emitted, 0 leverage events
    2. catalog-hygiene-and-borrows (Epic A, merged via PR #58)
       Expected outcome: PASS or INCONCLUSIVE — line-delta target is measurable
       from git
    3. external-model-integration (codex routing)
       Expected outcome: depends on whether routing events are emitted

  Backfill is done by reviewer/tpm reading each story's original intent and
  picking a metric that *should have been declared* at planning time. This is
  not retro-rationalization — pick metrics that would have been falsifiable
  at planning time, not after-the-fact justifications.

  Output: a retro report at .pHive/epics/metrics-as-planning-concern/docs/retro-verdict.md
  showing for each story: backfilled metric, verdict, real-world outcome, whether
  gate would have caught the miss.

acceptance_criteria:
  - "9+ stories across the 3 target epics gain backfilled metric: blocks"
  - "/metrics-check runs against backfilled YAMLs without error"
  - "retro-verdict.md documents per-story: backfilled metric, verdict, real outcome, gate-would-have-caught (Y/N)"
  - "At least 1 FAIL verdict surfaces from kg-augmented-meta-signal (canary case)"
  - "Report ends with: count of TRUE-POSITIVE (gate caught real failure) vs FALSE-NEGATIVE (gate passed real failure) — proves the gate's predictive value"

steps:
  - id: research
    description: |
      For each of the 3 epics: read all stories, read original goals, identify
      what number SHOULD have moved. Avoid retrospective bias — propose only
      metrics that were measurable at planning time.
    agent: researcher
  - id: implement
    description: |
      Edit each story YAML in the 3 target epics to add metric: block. Preserve
      original status:, do not rewrite story body. Add `metric.backfilled: true`
      so it's clear these were not declared at planning.
    agent: technical-writer
    depends_on: [research]
  - id: test
    description: |
      Run /metrics-check against backfilled YAMLs. Capture output.
    agent: tester
    depends_on: [implement]
  - id: review
    description: |
      Author retro-verdict.md. Compare verdict to lived reality. Compute
      true-positive / false-negative counts. State whether the gate would have
      changed shipping decisions.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit on feat/metrics-as-planning-concern.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: .pHive/epics/kg-augmented-meta-signal/stories/
      purpose: Canary epic — must FAIL
    - path: .pHive/epics/catalog-hygiene-and-borrows/stories/
      purpose: Line-delta epic — measurable via git
    - path: .pHive/epics/external-model-integration/stories/
      purpose: Routing-events epic — depends on instrumentation presence

design_decisions:
  - decision: "metric.backfilled: true flag distinguishes retro from native declarations"
    rationale: Future audits should know which metrics survived planning vs were retrofit
  - decision: 3 epics, not all shipped — bounded scope; prove the principle
    rationale: Auto mode + avoid sprawl per repo norms

risks:
  - severity: high
    description: Retro-rationalization — picking metrics we KNOW would pass/fail
    mitigation: research step requires metric to be measurable at planning time using carriers that existed at the time
  - severity: medium
    description: external-model-integration may have no instrumentation, making verdict INCONCLUSIVE everywhere
    mitigation: INCONCLUSIVE is a valid result; it proves the instrumentation gap, which is itself a backlog item

metric:
  applies: true
  name: retro.gate_predictive_value
  direction: up
  unit: ratio
  baseline: null
  target: 0.66
  window: "this story's review step"
  source:
    kind: manual
    ref: "retro-verdict.md true-positive / (true-positive + false-negative)"
  verify_at: "epic-close"
  owner: tpm
