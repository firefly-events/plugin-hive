id: m-01-add-metrics-concern
epic: metrics-as-planning-concern
title: Add `metrics` block to cross-cutting-concerns.yaml
status: completed
complexity: small
methodology: classic
depends_on: []
wave: W0
action_id: M-01

description: |
  Extend `.pHive/cross-cutting-concerns.yaml` with a third concern: `metrics`.
  Mirrors structure of existing `documentation` + `versioning` blocks:
  id, name, description, applies_when, planning_prompt, implementation_checklist.

  Concern requires every story to either:
    (a) declare a metric block (name, direction, baseline, target, window, source), OR
    (b) set metric.applies: false with one-line justification

  This is the substrate gate. M-02 wires the schema; M-03/M-04 wire planner
  prompts to read this concern.

acceptance_criteria:
  - "cross-cutting-concerns.yaml has a 3rd concern with id: metrics"
  - "applies_when clause distinguishes falsifiable stories from infra/docs-only stories"
  - "planning_prompt asks for: what number moves, by how much, in what window, measured how"
  - "implementation_checklist has 4-6 items covering: metric declared OR opt-out, instrumentation emits events, experiment envelope created if applicable, verify_at set"
  - "YAML parses; existing 2 concerns untouched"

steps:
  - id: research
    description: |
      Re-read existing 2 concerns in cross-cutting-concerns.yaml for tone/structure.
      Re-read metrics-event.schema.md + experiment-envelope.schema.md for the
      vocabulary the concern must align with (metric_type, dimensions, B0 query
      shapes, envelope lifecycle).
    agent: researcher
  - id: implement
    description: |
      Append `metrics` concern block to cross-cutting-concerns.yaml. Use existing
      block style. Cite metrics-event.schema.md + experiment-envelope.schema.md
      in the description.
    agent: developer
    depends_on: [research]
  - id: review
    description: |
      Verify concern text is non-overlapping with documentation/versioning,
      planning_prompt is answerable in 2-3 sentences, checklist is implementation-bounded.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit on feat/metrics-as-planning-concern.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: .pHive/cross-cutting-concerns.yaml
      purpose: Target — extend with 3rd concern
    - path: .pHive/metrics/metrics-event.schema.md
      purpose: Reference for metric vocabulary
    - path: .pHive/metrics/experiment-envelope.schema.md
      purpose: Reference for envelope lifecycle the concern must align with

design_decisions:
  - decision: "Opt-out via `metric.applies: false` + justification (not silent omission)"
    rationale: Forces conscious decision; un-falsifiable stories are visible

risks:
  - severity: low
    description: Concern text drifts from schema vocabulary
    mitigation: research step re-reads schemas first

metric:
  applies: false
  justification: "Process-substrate; M-07 retro backfill measures whether the gate works."
