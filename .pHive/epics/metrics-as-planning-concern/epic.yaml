name: metrics-as-planning-concern
title: Metrics as a Cross-Cutting Planning Concern
description: |
  Today the metrics carrier (events JSONL + experiment envelopes) is shipped,
  but planning does not gate on it. Stories ship without declaring what number
  should move, by how much, or how it will be measured. Result: shipped epics
  cannot be retro-evaluated. The KG-augmented-meta-signal epic (1.1.4) is the
  canary — code merged, bootstrap never ran, zero leverage events, no one
  noticed for ~2 weeks.

  This epic makes `metrics` the third cross-cutting concern (alongside
  `documentation` and `versioning`). Every story declares either a falsifiable
  metric (baseline, target, window, source) OR an explicit `applies: false`
  with one-line justification. Planning enforces the gate; post-merge audit
  closes the loop.

  Two axes:
    - TREND  — is the system getting better? (run-over-run reads)
    - CLAIM  — did shipped work perform as predicted? (baseline-vs-candidate
               reads against the story's experiment envelope)

  Wave ordering: W0 = schema + concern block (substrate). W1 = planner +
  workflow integration. W2 = post-merge audit + standup surfacing. W3 = retro
  backfill of last 3 shipped epics to prove the gate would have caught the
  KG-bootstrap miss.

target_codebase: /Users/don/Documents/plugin-hive
methodology: classic
scale: medium
branch: feat/metrics-as-planning-concern
parent_audit: null
milestone: post-2.0-planning-fitness

planning_artifacts:
  - ../../metrics/metrics-event.schema.md         # event row contract
  - ../../metrics/experiment-envelope.schema.md   # envelope lifecycle
  - ../../cross-cutting-concerns.yaml             # extend with metrics block

dependencies:
  blocks: []
  blocked_by: []

pr_strategy:
  one_branch: feat/metrics-as-planning-concern
  one_commit_per_story: true
  bundle_under_150_files: true

success_criteria:
  - "cross-cutting-concerns.yaml has a third concern: metrics, with applies_when + planning_prompt + implementation_checklist"
  - "Story YAML schema accepts a metric: block (or metric.applies: false + justification) — documented in hive/references/"
  - "/plan A-step prompts for metric declaration; un-falsifiable stories surface as warnings"
  - "/metrics-check skill exists; reads experiment envelopes whose verify_at has elapsed; emits verdict to envelope + standup"
  - "Retro backfill: kg-augmented-meta-signal + 2 other shipped epics have post-hoc metric blocks; verdict run shows kg epic would have failed gate at D+30"
