id: mir-7-meta-shotgun-workflow
epic: meta-improvement-reset
title: Build meta-shotgun workflow + integration test
status: blocked
complexity: medium
methodology: classic
tracker_id: plugin-hive/PLU-69
tracker_url: http://localhost:3000/plugin-hive/issues/69
depends_on: [mir-6-meta-shotgun-skill-scaffold]

description: |
  Workflow YAML carrying the meta-shotgun step sequence (consumed by mir-6
  skill). Reads pending tier=little-fix candidates → excludes recent-touch
  (30-day) → applies changes → validates → commits → pushes single PR with
  sections per dir → marks candidates done in queue.

  Per locked Q6 + grill H4: single PR, no in-skill grouping. Reviewer reads
  top-down through file-grouped sections within the PR.

  Idempotency (locked Q4): skip candidates where `git log --since=30days`
  shows the target file was touched. Prevents nightly+shotgun double-action.

acceptance_criteria:
  - "hive/workflows/meta-shotgun.workflow.yaml exists with named steps"
  - "Workflow filters tier=little-fix AND status=pending"
  - "Workflow excludes candidates whose target was touched in last 30 days (git log check)"
  - "Workflow opens single PR titled 'meta-shotgun YYYY-MM' with sections per dir"
  - "After successful PR push, candidates marked status=done in queue"
  - "Integration test: stub backlog with 3 little-fix candidates spanning 2 dirs → 1 PR with 2 sections"

steps:
  - id: research
    description: |
      Read meta-team-cycle.workflow.yaml for step composition patterns.
      Inspect existing helper modules under hive/lib/ for git-log, PR-create,
      backlog-mutation primitives reusable here.
    agent: researcher
  - id: implement
    description: |
      Create hive/workflows/meta-shotgun.workflow.yaml with steps:
      1. load_backlog: read queue-meta-meta-optimize.yaml, filter tier=little-fix AND status=pending
      2. exclude_recent_touch: for each candidate, `git log --since="30 days ago" -- <target>` ; drop if non-empty
      3. apply_changes: developer agent applies each candidate's described change in a worktree
      4. validate: run test suite + lint
      5. commit_per_dir: one commit per dir group, conventional message
      6. push_pr: open single PR titled `chore(meta-shotgun): YYYY-MM batch` with body sections per dir
      7. mark_done: update queue-meta-meta-optimize.yaml — candidates status=done

      Reuse existing PR-create helper from .github/workflows/ pattern or
      `hive/lib/github/pr-create.mjs` if it exists.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Integration test (`hive/workflows/__tests__/meta-shotgun.integration.test.mjs`):
      - Stub queue with 3 candidates: 2 in dir-A (e.g., hive/references/), 1 in dir-B (skills/...); all tier=little-fix, status=pending
      - Mock git log (no recent touch)
      - Mock gh pr create
      - Run workflow → assert 1 PR opened, body has 2 dir-section headers, all 3 candidates marked done
      - Edge: 1 candidate with recent touch → excluded; 2 candidates land in PR
    agent: tester
    depends_on: [implement]
  - id: review
    description: |
      Review for idempotency on partial failure (PR created but mark_done
      fails — does re-run cause duplicate PR?). Verify 30-day window is
      tunable via config (not hardcoded).
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit + push
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  tech_stack:
    - yaml
    - node
    - bash
  key_files:
    - path: hive/workflows/meta-team-cycle.workflow.yaml
      purpose: Pattern reference — similar workflow shape
    - path: hive/lib/meta-team/
      purpose: Helper modules dir; reuse what exists, add what doesn't

files_to_modify:
  - file: hive/workflows/meta-shotgun.workflow.yaml
    change: New file — workflow definition
  - file: hive/lib/meta-team/backlog-mutator.mjs
    change: Add or extend helper for marking candidates done
  - file: hive/workflows/__tests__/meta-shotgun.integration.test.mjs
    change: New integration test

code_examples:
  - title: Pattern — workflow YAML step block
    file: hive/workflows/meta-team-cycle.workflow.yaml
    snippet: |
      steps:
        - id: load_backlog
          source: hive/workflows/steps/meta-shotgun/load-backlog.md
          inputs:
            queue_path: .pHive/meta-team/queue-meta-meta-optimize.yaml
            filter:
              tier: little-fix
              status: pending
        - id: exclude_recent_touch
          source: hive/workflows/steps/meta-shotgun/exclude-recent-touch.md
          inputs:
            since: "30 days ago"
            candidates: { from_step: load_backlog }

design_decisions:
  - decision: 30-day touch window via git log, not file mtime
    rationale: git log survives worktree resets and reflects merged history; mtime is local + unreliable
  - decision: Mark-done is the LAST step (after PR push)
    rationale: If push fails, candidates stay pending → re-run picks them up. Mark-done before push would orphan candidates on push failure.

cross_cutting:
  - concern: documentation
    action: Add a top-level runbook reference in SKILL.md (mir-6) and meta-optimize-maintainer.md

risks:
  - severity: medium
    description: PR push succeeds but mark_done fails (network glitch) → next run reapplies + opens duplicate PR
    mitigation: "Idempotency check at load_backlog — also exclude candidates whose target has matching commit in last 24h on develop. Surface in PR body."
  - severity: low
    description: Validation step (lint/tests) fails partway → cleanup needed
    mitigation: Worktree-based; abort discards worktree, no side effects on main checkout

references:
  - path: hive/workflows/meta-team-cycle.workflow.yaml
    relevant_excerpt: |
      Existing workflow YAML pattern for meta-team-cycle. meta-shotgun follows
      same step-source-inputs shape.
  - path: .pHive/epics/meta-improvement-reset/docs/design-discussion.md
    relevant_excerpt: |
      §3.4 Workflow shape: filter → exclude recent-touch → apply → validate → commit → push → mark done.
      Single PR with sections per dir; no in-skill grouping.

metric:
  applies: true
  name: meta_shotgun.candidates_resolved_per_run
  direction: up
  unit: count
  baseline: 0
  target: 3-10 per run after first month of accumulation
  window: first 3 /meta-shotgun runs
  source:
    kind: manual
    ref: "PR body section count + queue status=done count after each /meta-shotgun run"
  verify_at: integrate
  owner: reviewer
