  name: step_03c.proposals_rejected_per_cycle
  direction: up
  unit: count
  baseline: 0 (current non-blocking)
  target: 0-2 per cycle steady state (thin metric work surfaced; not 0 = silent acceptance)
  window: next 5 meta-meta nightly cycles after merge
  source:
    kind: manual
    ref: "PR body 'Rejected by metric gate' section count per cycle"
  verify_at: 2026-06-30T00:00:00Z
  owner: reviewer
