id: mir-4-tier-field-backlog-schema
epic: meta-improvement-reset
title: Add tier field to queue-meta-meta-optimize backlog schema
status: pending
complexity: low
methodology: classic
depends_on: []

description: |
  Backlog candidates in `.pHive/meta-team/queue-meta-meta-optimize.yaml` need
  a `tier:` field to classify work by size/risk:
    - `little-fix`: <50 lines diff, no schema/skill behavior change (shotgun target)
    - `structural`: file/module-scope changes (default — nightly cycle target)
    - `strategic`: cross-cutting / multi-epic changes (manual planning)

  Default: `structural` when field absent (backward-compatible — existing
  candidates require no migration).

  This story adds the schema field + updates docs. Filter logic (nightly
  exclusion of little-fix) lands in mir-5. Consumer (`/meta-shotgun`) lands
  in mir-6.

acceptance_criteria:
  - "queue-meta-meta-optimize.yaml header comment documents tier enum + definition"
  - "tier: field is optional; missing field treated as `structural`"
  - "hive/references/meta-optimize-maintainer.md queue-management section references the field"
  - "Existing candidates (mmo-2026-04-21-001/002) unmodified — backward-compatible"

steps:
  - id: research
    description: |
      Read current queue-meta-meta-optimize.yaml header and existing candidate
      shape. Identify any validator script that parses the file (search
      `hive/scripts/` and `hive/lib/`).
    agent: researcher
  - id: implement
    description: |
      Update queue-meta-meta-optimize.yaml header comment to document new
      `tier:` field. Enum: little-fix | structural | strategic. Default
      structural. Append definition: "little-fix = <50 lines diff + no
      schema/skill behavior change". Existing candidates untouched.

      If a validator exists, extend it to accept the field; reject malformed
      enum values; default-fill `structural` when absent.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Unit test for validator (if extended):
      - Candidate with tier=little-fix → accepted
      - Candidate without tier field → accepted, normalized to structural
      - Candidate with tier=invalid_value → rejected with clear error
    agent: tester
    depends_on: [implement]
  - id: review
    description: |
      Confirm header comment is canonical reference; no schema-drift between
      header docs and validator behavior.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit + push
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  tech_stack:
    - yaml
    - markdown
    - node
  key_files:
    - path: .pHive/meta-team/queue-meta-meta-optimize.yaml
      purpose: Backlog file being extended
    - path: hive/references/meta-optimize-maintainer.md
      purpose: Queue-management reference doc to update

files_to_modify:
  - file: .pHive/meta-team/queue-meta-meta-optimize.yaml
    change: Update header comment with tier field documentation
  - file: hive/references/meta-optimize-maintainer.md
    change: Add tier field to queue-management section

code_examples:
  - title: Pattern — header comment + candidate with tier
    file: .pHive/meta-team/queue-meta-meta-optimize.yaml
    snippet: |
      # Expected fields per entry:
      # - candidate_id: stable unique identifier
      # - target: relative path being modified
      # - type: short category tag
      # - description: what + why
      # - safety_notes: scope of change + revert plan
      # - status: pending | in_progress | done
      # - tier: little-fix | structural | strategic (optional; default: structural)
      #   - little-fix: <50 lines diff, no schema/skill behavior change (shotgun target)
      #   - structural: file/module-scope changes (default — nightly cycle target)
      #   - strategic: cross-cutting / multi-epic (manual planning)

      candidates:
        - candidate_id: mmo-2026-04-21-001
          target: .pHive/meta-team/archive/2026-04-19/MANIFEST.md
          type: archive-provenance-note
          tier: little-fix    # new candidates can declare; existing default to structural
          status: pending

design_decisions:
  - decision: Default missing field to `structural`, not `little-fix`
    rationale: Conservative — preserves current nightly-cycle behavior for existing candidates; new fixes must opt INTO shotgun routing

cross_cutting:
  - concern: documentation
    action: Update meta-optimize-maintainer.md queue-management section

risks:
  - severity: low
    description: Validator extension (if one exists) silently rejects malformed tier values
    mitigation: Default-fill on absence; explicit error on invalid value; covered by tests

references:
  - path: .pHive/meta-team/queue-meta-meta-optimize.yaml
    relevant_excerpt: |
      # Maintainer backlog for /meta-meta-optimize (LOCAL-ONLY, not shipped).
      # Mode: human-edit only — do NOT auto-append from analysis.
      # Existing candidates: mmo-2026-04-21-001 (archive-provenance-note),
      # mmo-2026-04-21-002 (archive-provenance-note).

metric:
  applies: true
  name: backlog.candidates_with_tier_field
  direction: up
  unit: count
  baseline: 0
  target: ≥1 (the first candidate added with explicit tier:little-fix after merge)
  window: next 30 days
  source:
    kind: manual
    ref: "grep -c 'tier:' .pHive/meta-team/queue-meta-meta-optimize.yaml"
  verify_at: integrate
  owner: reviewer
