name: meta-improvement-reset
title: Meta-Improvement Reset — release-notes-weighted signals + metric gate + monthly shotgun
description: |
  Restructure how /meta-meta-optimize cycles select work. Three coupled reframes
  captured in conversation 2026-05-24 + locked at Phase B step 5 (2026-05-25):

    1. Release-notes-weighted signals — Claude Code releases + Anthropic blog
       feeds wired into step-02b; signal_weights knob in step-03 ranking
    2. Metric gate on enriched_proposals — step-03c default flips to blocking;
       config-knob escape hatch (advisory) preserves orchestrator latitude
    3. Monthly shotgun for little fixes — new /meta-shotgun maintainer-local
       skill consumes tier:little-fix backlog candidates; nightly cycles delegate

  Companion surface: meta-meta nightly PRs retarget main → develop.

  Scope: maintainer-side (meta-meta-optimize). Public meta-optimize swarm
  unchanged. KG signal repair out of scope (separate epic).

target_codebase: /Users/don/Documents/plugin-hive
methodology: classic

git_flow:
  base_branch: develop
  branch_strategy: per-epic

