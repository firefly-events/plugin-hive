name: release-lifecycle
title: Release Lifecycle — status discipline, /ship, version bumps, release posts
description: |
  Closes the back half of Hive's SDLC. A canonical status-lifecycle contract binds
  every command to explicit, owned transitions (fixing "finished but never marked"),
  with a rework edge for failed review. Version bump fires late in /execute (intent
  recorded at /plan), verified at ship. A new /ship capstone reconciles status at
  pre-flight, verifies the bump, runs the project's configured ship target, and emits
  release-comms artifacts (post + video script + post ideas). "Shipped" is project-
  defined, captured at kickoff.
target_codebase: /Users/don/Documents/plugin-hive
methodology: classic

git_flow:
  base_branch: develop
  branch_strategy: per-epic

version_bump: minor

stories:
  - id: rl-1-status-lifecycle-contract
    title: Canonical status-lifecycle contract reference
    complexity: medium
    depends_on: []
  - id: rl-2-kickoff-ship-target
    title: Kickoff captures the project's ship-target definition
    complexity: medium
    depends_on: [rl-1-status-lifecycle-contract]
  - id: rl-3-wire-status-transitions
    title: Wire explicit status transitions into workflow commands
    complexity: high
    depends_on: [rl-1-status-lifecycle-contract]
  - id: rl-4-version-bump-flow
    title: Version-bump intent at plan, executed late in /execute
    complexity: medium
    depends_on: [rl-3-wire-status-transitions]
  - id: rl-5-release-post-generator
    title: Release-post + video-script generator (Hive-first, generic-aware)
    complexity: medium
    depends_on: [rl-1-status-lifecycle-contract]
  - id: rl-6-ship-skill
    title: /ship capstone skill — reconcile, verify, ship, announce
    complexity: high
    depends_on:
      - rl-2-kickoff-ship-target
      - rl-3-wire-status-transitions
      - rl-4-version-bump-flow
      - rl-5-release-post-generator
