id: rl-1-status-lifecycle-contract
epic: release-lifecycle
title: Canonical status-lifecycle contract reference
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  Author the canonical status-lifecycle contract that every workflow command
  binds to. Today story `status:` is written ad-hoc by plan/execute/session-registry
  with no agreed state set, no transition ownership, and no rework edge — so work
  finishes but is never marked. This doc is the single source of truth the rest of
  the epic (rl-3 wiring, rl-6 ship gate) implements against.

  State set (ratified with maintainer):
    pending -> in_progress <-> in_review -> complete -> shipped   (+ blocked, orthogonal)

  The `in_review -> in_progress` REWORK EDGE is first-class: when review fails, the
  story bounces to in_progress, is reassigned to the right agent, and pickup is
  re-triggered. No separate "rework" state — just a consistent, owned transition.

  Transition ownership table (transition -> owning command):
    pending      -> in_progress : /execute (story dispatch)
    in_progress  -> in_review   : /review entry (or /test gate)
    in_review    -> complete    : /review pass
    in_review    -> in_progress : /review fail (rework: reassign + re-pickup)
    complete     -> shipped     : /ship ONLY
    * <-> blocked              : any command on dependency stall

  Crucial nuance (maintainer): review is often MANUAL with no automated hook, so
  `complete` must be reachable WITHOUT an automated /review run. The contract states
  that `complete` is set by an explicit transition that EITHER an automated /review
  pass OR /ship's pre-flight reconciliation (rl-6) performs. /status stays read-only.

acceptance_criteria:
  - "Given the new reference, when an agent reads it, then it finds the full
    state set, the transition-ownership table, and the rework edge defined
    unambiguously."
  - "Given complete is often reached via manual review, when the contract
    describes complete, then it explicitly allows /ship pre-flight
    reconciliation as a valid path to complete (not only an automated /review
    pass)."
  - "Given existing scattered status writers (plan, execute-mode-session,
    session-registry, team-execution), when the doc is done, then it lists each
    current writer and the transition it should own going forward (migration map
    for rl-3)."

steps:
  - id: research
    description: Inventory every current `status:` writer across skills/ and
      hive/references/ (plan, execute-mode-session, session-registry,
      team-execution, story-yaml-schema, cycle-state-schema). Capture current
      values used.
    agent: researcher
  - id: implement
    description: Write hive/references/status-lifecycle.md — state set,
      transition-ownership table, rework edge, manual-complete path, and the
      migration map for rl-3.
    agent: developer
    depends_on: [ research ]
  - id: review
    description: Verify the contract is internally consistent and that the migration
      map covers every writer found in research.
    agent: reviewer
    depends_on: [ implement ]
  - id: integrate
    description: Commit to feat/release-lifecycle.
    agent: developer
    depends_on: [ review ]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: hive/references/story-yaml-schema.md
      purpose: Defines the story `status:` field; contract must align with its allowed
        values (incl. `completed`).
    - path: hive/references/cycle-state-schema.md
      purpose: Phase records reference status; contract must not contradict
        cycle-state vocabulary.
    - path: skills/status/SKILL.md
      purpose: Read-only reporter — contract must keep it read-only (it consumes,
        never writes).

files_to_modify:
  - file: hive/references/status-lifecycle.md
    change: Create the canonical contract (new file).

cross_cutting:
  - concern: documentation
    action: "This story IS documentation; ensure it is linked from
      story-yaml-schema.md and the plan/execute/review skill Key-References
      sections by rl-3."

metric:
  applies: false
  justification: "Pure contract/reference document with no runtime surface; its
    effectiveness is measured downstream by rl-3 (wiring) and rl-6 (ship gate)
    consuming it, not by this story emitting a number."

risks:
  - severity: medium
    description: Contract states a transition no command currently owns, creating a
      spec/impl gap.
    mitigation: Migration map (AC3) ties every transition to a concrete rl-3 edit;
      rl-3 is gated on this map.
tracker_id: plugin-hive/PLU-232
