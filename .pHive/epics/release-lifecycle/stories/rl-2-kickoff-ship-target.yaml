id: rl-2-kickoff-ship-target
epic: release-lifecycle
title: Kickoff captures the project's ship-target definition
status: blocked
shipped_at: "2026-06-08T04:51:07Z"
release_id: "v2.10.0"
complexity: medium
methodology: classic
depends_on: [ rl-1 ]

parallel_allowed: true
parallel_rationale: bounded-slice

description: |
  "Shipped" means different things per project: App Store submission, Vercel deploy,
  GitHub release, npm publish, or a custom command. /ship (rl-6) cannot act without
  knowing which. Capture this at kickoff and persist it so /ship reads a concrete
  target instead of guessing.

  Add a kickoff question: "What does shipping mean for this project?" Persist the
  answer to .pHive/project-profile.yaml under a new `ship_target` block:

    ship_target:
      kind: app-store | vercel | github-release | npm | custom
      command: "<shell command>"   # required only when kind == custom
      notes: "<optional human note, e.g. which Vercel project / npm scope>"

  For Hive itself, kind resolves to `github-release` (the repo ships via gh releases).

acceptance_criteria:
  - "Given a fresh /hive:kickoff run, when the ship-target question is asked and
    answered, then .pHive/project-profile.yaml gains a valid ship_target block."
  - "Given kind == custom, when no command is provided, then kickoff re-prompts
    (custom requires a command string)."
  - "Given an existing project-profile.yaml without ship_target, when
    /hive:kickoff is re-run, then the block is added idempotently without
    clobbering other fields."
  - "Given the kickoff-protocol reference, when ship_target is added, then
    kickoff-protocol.md documents the new block and its enum."

steps:
  - id: research
    description: Read skills/kickoff/SKILL.md + hive/references/kickoff-protocol.md
      to find where project-profile fields are gathered and written.
    agent: researcher
  - id: implement
    description: Add the ship-target question + ship_target block write to kickoff;
      document the block in kickoff-protocol.md.
    agent: developer
    depends_on: [ research ]
  - id: test
    description: Verify idempotent add on existing profile + custom-requires-command
      re-prompt logic.
    agent: tester
    depends_on: [ implement ]
  - id: review
    description: Confirm enum + schema match what rl-6 /ship will consume.
    agent: reviewer
    depends_on: [ test ]
  - id: integrate
    description: Commit to feat/release-lifecycle.
    agent: developer
    depends_on: [ review ]

