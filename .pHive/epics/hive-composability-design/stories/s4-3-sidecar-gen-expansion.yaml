  - file: skills/hive/skills/vertical-plan/SKILL.md
    change: One-line sidecar invocation after write instruction
  - file: skills/hive/skills/structured-outline/SKILL.md
    change: One-line sidecar invocation after write instruction
  - file: hive/references/planning-format-contract.md
