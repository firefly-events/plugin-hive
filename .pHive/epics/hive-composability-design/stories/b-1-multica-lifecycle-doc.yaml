      2. hive/lib/multica-story-dispatch/ — per-story dispatch behavior.
      3. Confirm no teammate_lifecycle / respawn_per_task config keys exist (they do not).
      4. Identify the right user-facing doc to extend (README, docs/operations-guide, or
         docs/usage) — follow the existing docs structure.
    agent: researcher

  - id: implement
    description: |
      Add a concise "Agent lifecycle across stories" section to the chosen user-facing doc.
      Describe per-story fresh-agent dispatch under the Multica/sandcastle substrate, note
      the local/direct execution behavior, and record that the originally-planned
      respawn-per-task lifecycle is superseded by the substrate. Keep it factual — only
      describe what the shipped code does.
    agent: developer
    depends_on: [research]

  - id: review
    description: |
      Verify the doc matches the shipped execute path, names no non-existent config/flags,
      and clearly records the supersession decision. Convention/clarity check.
    agent: reviewer
    depends_on: [implement]

  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

