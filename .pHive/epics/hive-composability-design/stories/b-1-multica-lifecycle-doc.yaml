id: b-1-multica-lifecycle-doc
epic: hive-composability-design
title: Document per-story agent lifecycle under the Multica substrate
status: shipped
shipped_at: "2026-06-20T19:03:12Z"
release_id: "v2.12.0"
complexity: low
methodology: classic
depends_on: []

metric:
  applies: false
  justification: >
    Documentation-only story explaining how the Multica/sandcastle execution substrate
    provides per-story fresh-agent lifecycle natively; it adds no runtime surface that
    emits a measurable signal. Correctness is verified by the doc accurately describing
    the shipped execute path, not by a trend.

description: |
  The 2026-04 plan included Workstream B: a "respawn-per-task" teammate lifecycle for
  the /execute phase, plus a story-handoff summary schema and a session story-boundary
  hook. That work was designed against the in-session TeamCreate execution model, where
  a long-lived teammate persists across stories and must be deliberately respawned to
  reset context.

  Since then the execution substrate moved to Multica / sandcastle, where each story is
  dispatched to a fresh agent (or squad) per issue. Per-story-fresh-agent lifecycle is
  therefore NATIVE to the substrate — there is nothing to "respawn." Building a separate
  respawn-per-task lifecycle mode would duplicate what the substrate already guarantees.

  This story closes that gap explicitly rather than silently dropping it: document, in a
  user-facing doc, how agent lifecycle works under the current execution substrate and
  why a dedicated respawn-per-task mode is unnecessary. Cross-reference the original
  Workstream B intent so a future reader understands the decision.

acceptance_criteria:
  - "Given the operations/usage docs, when a user looks up how agents are spawned and reset across stories, then there is a clear section describing per-story fresh-agent lifecycle under the Multica/sandcastle substrate."
  - "Given that section, then it explicitly states that the original respawn-per-task lifecycle (Workstream B) is superseded by the substrate's native per-story dispatch, and why."
  - "Given the doc, then it does not claim a config key or flag that does not exist (no teammate_lifecycle / respawn_per_task — those were never shipped)."

