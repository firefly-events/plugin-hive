id: s6-3-respawn-docs-crossref
epic: hive-composability-design
title: Respawn skill docs cross-reference to story-handoff-schema
status: pending
complexity: low
methodology: classic
depends_on: [s6-2-hive-config-lifecycle-keys]

description: |
  Docs-only update to skills/hive/skills/respawn/SKILL.md:
  Add a cross-reference to hive/references/story-handoff-schema.md and clarify when
  each carrier fires (context-pressure respawn vs story-handoff).

  This prevents agents reading respawn/SKILL.md from being confused about two schemas
  in the same state/respawn-summaries/ directory with similar naming patterns.

acceptance_criteria:
  - "Given respawn/SKILL.md, then it contains a cross-reference to hive/references/story-handoff-schema.md"
  - "Given the cross-reference, then it explains when each schema fires: respawn/SKILL.md = context-pressure continuation; story-handoff-schema.md = cross-story lifecycle transition"
  - "Given the update, then no existing respawn content is removed or changed — additive only"

steps:
  - id: implement
    description: |
      Read skills/hive/skills/respawn/SKILL.md lines 70-120 to see schema section context.

      Near the top of the schema section (around line 74), add a note block:

      ---
      **Two schemas, same directory:** `state/respawn-summaries/` holds two types of files.
      - **Context-pressure schema (this file):** Used when an agent's context window is under pressure.
        Same agent, same story, different iteration. Filename: `{agent}-{story-id}-{N}.md`.
        Fields defined at lines 74-113 of this file.
      - **Story-handoff schema:** Used in `respawn_per_task` lifecycle mode to carry context
        from story N to story N+1 (different stories, different agents).
        Filename: `{agent}-handoff-{to-story-id}.md`.
        Fields defined in: `hive/references/story-handoff-schema.md`.
      ---

      Do not modify any other content in respawn/SKILL.md.
    agent: developer

  - id: review
    description: |
      Review:
      - Note is placed near schema section header (not buried at end of file)
      - Filename conventions are explicitly stated for both schemas
      - Cross-reference path is correct
      - No existing content removed or changed
    agent: reviewer
    depends_on: [implement]

  - id: integrate
    description: Commit respawn/SKILL.md cross-reference addition
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: skills/hive/skills/respawn/SKILL.md
      purpose: Lines 74-113 schema section — add cross-reference note near this location

files_to_modify:
  - file: skills/hive/skills/respawn/SKILL.md
    change: Add two-schema disambiguation note near line 74 (additive only)

cross_cutting:
  - concern: documentation
    action: "respawn/SKILL.md updated with schema disambiguation. This IS the doc change."

references:
  - path: hive/references/story-handoff-schema.md
  - path: state/epics/hive-composability-design/docs/structured-outline.md
    relevant_excerpt: |
      Slice 6, Change #4: respawn/SKILL.md docs update — cross-reference story-handoff-schema.md;
      clarify when each carrier fires.
