id: s3-3-agent-spawn-model-docs
epic: hive-composability-design
title: Agent-spawn model resolution docs + Haiku/Explorer guardrail
status: pending
complexity: low
methodology: classic
depends_on: [s3-2-hive-config-model-profile]

description: |
  Two changes to skills/hive/skills/agent-spawn/SKILL.md:

  1. Step 7.1 (or wherever model resolution happens) — document the resolution chain:
     frontmatter model: → model_overrides[profile][persona] → tier default.

  2. Step 3 (or pre-spawn check) — add Explorer/Haiku refusal check: if resolved model
     is any Haiku variant AND persona is explorer/researcher-type, error and stop.

  This is a docs-in-skill-file change only — agent-spawn is a skill doc (markdown),
  not executable code. The refusal is enforced by documentation instruction.

acceptance_criteria:
  - "Given agent-spawn/SKILL.md, then it documents the three-step resolution chain in model resolution section"
  - "Given agent-spawn/SKILL.md, then it contains a refusal rule: Haiku + explorer/researcher-type persona = error + stop"
  - "Given the refusal error message, then it is actionable: names the persona, names the model, tells user how to fix"
  - "Given the resolution chain, then frontmatter model: is documented as highest priority (overrides all)"

steps:
  - id: research
    description: |
      Read skills/hive/skills/agent-spawn/SKILL.md in full.
      Identify:
      1. Where model resolution is currently documented (step 7.1 or equivalent)
      2. Where pre-spawn checks live (step 3 or equivalent)
      3. What personas are currently enumerated as "explorer/researcher-type" in agent-spawn context
      Note exact line numbers for both insertion points.
    agent: researcher

  - id: implement
    description: |
      In skills/hive/skills/agent-spawn/SKILL.md:

      1. In the model resolution section (step 7.1 or nearest equivalent), add or expand:
         "Model Resolution Chain:
          1. Check agent frontmatter for model: field. If present, use it regardless of profile.
          2. Check hive.config.yaml model_overrides[model_profile][persona_name]. If entry exists, use it.
          3. Fall back to hive.config.yaml model_tiers tier default for this persona.
          Reference: hive/references/model-tiering-contract.md"

      2. In the pre-spawn checks section, add:
         "Explorer/Haiku Refusal:
          After resolving the model, check: if the resolved model contains 'haiku' (case-insensitive)
          AND the persona type is explorer, researcher, or any persona whose primary role is
          broad codebase exploration or context gathering:
          Error and stop: 'Model resolution for {persona_name} resolved to {model_id}.
          Explorer and research personas require minimum Sonnet for context-gathering quality.
          Update model_overrides or agent frontmatter to assign Sonnet or higher.'
          Reference: hive/references/model-tiering-contract.md"

      Do not change any other agent-spawn behavior. These are documentation additions only.
    agent: developer
    depends_on: [research]

  - id: review
    description: |
      Review:
      - Resolution chain is in the correct location (at or near model assignment step)
      - Haiku refusal is in the correct location (at or near pre-spawn validation step)
      - Error message is actionable (not just "error")
      - Cross-reference to model-tiering-contract.md is present in both additions
      - No other agent-spawn content changed
    agent: reviewer
    depends_on: [implement]

  - id: integrate
    description: Commit agent-spawn/SKILL.md model resolution + Haiku refusal additions
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: skills/hive/skills/agent-spawn/SKILL.md
      purpose: Primary file — add model resolution chain docs and Haiku refusal check
    - path: hive/references/model-tiering-contract.md
      purpose: Source of truth to cross-reference from agent-spawn

files_to_modify:
  - file: skills/hive/skills/agent-spawn/SKILL.md
    change: "Add model resolution chain documentation at step 7.1 equivalent; add Explorer/Haiku refusal rule at pre-spawn check step"

design_decisions:
  - decision: Refusal enforced by documentation (not hard validation code)
    rationale: User confirmed at D5 — documentation enforcement is sufficient; agent-spawn is a skill doc (markdown)
  - decision: Error message names persona and model and tells user how to fix
    rationale: Actionable errors reduce friction; agent should not silently proceed or degrade

cross_cutting:
  - concern: documentation
    action: "agent-spawn/SKILL.md updated. model-tiering-contract.md cross-referenced. No other docs impacted."

references:
  - path: hive/references/model-tiering-contract.md
  - path: state/epics/hive-composability-design/docs/structured-outline.md
    relevant_excerpt: |
      Slice 3, Change #3: agent-spawn/SKILL.md step 7.1 docs + step 3 check.
      Document resolution chain. Add Explorer/Haiku refusal.
