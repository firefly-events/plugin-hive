design_decisions:
  - decision: Markdown-embedded-HTML with .html sidecar is the canonical planning format
    rationale: Confirmed by user Q4; brand-guide.html provides the precedent; terminal degradation is acceptable
  - decision: Wireframe discovery protocol included in Slice 1
    rationale: Elicitation Q9 surfaced that omitting it causes per-story debates in D-expansion
  - decision: Mermaid is human-facing, not agent-comprehension improvement
    rationale: Elicitation Q2 surfaced that agents parse Mermaid prose same as ASCII; doc must not oversell

