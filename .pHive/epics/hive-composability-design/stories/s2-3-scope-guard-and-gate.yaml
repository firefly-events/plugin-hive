id: s2-3-scope-guard-and-gate
epic: hive-composability-design
title: Scope-class guard + TUI confirmation gate
status: pending
complexity: medium
methodology: classic
depends_on: [s2-2-lite-mode-routing]

description: |
  Implement scope-class guard and TUI confirmation gate as a single story (D4 decision:
  they are the same flow moment, not two separate checks).

  Scope-class guard: after produce-doc completes, read SCOPE_CLASS from the SCALE
  ASSESSMENT block in the just-produced design-discussion. If SCOPE_CLASS is
  'multi-epic' or 'prd' AND --lite was passed, refuse --lite continuation with a
  clear error. If SCOPE_CLASS hint is absent, allow --lite with a warning (fail open).

  TUI confirmation gate: after produce-doc (and guard check), prompt user to
  confirm or cancel before proceeding. If planning.confirm_gate_artifact: true in
  hive.config.yaml, also write state/epics/{epic-id}/docs/design-discussion-signoff.md.

  Elicitation Q8 rationale: the guard fires AFTER produce-doc (SCOPE_CLASS doesn't
  exist until produce-doc runs). The gate is the natural moment — user sees the design
  discussion, guard confirms scope class, gate fires. One flow moment, not two.

acceptance_criteria:
  - "Given /hive:plan --lite on a multi-epic or PRD scope, then refusal with message: '--lite is not available for multi-epic or PRD scope. Run /hive:plan without --lite.'"
  - "Given /hive:plan --lite with SCOPE_CLASS: single-epic, then proceeds without refusal"
  - "Given /hive:plan --lite with SCOPE_CLASS absent from design-discussion, then allows --lite with warning: 'SCOPE_CLASS hint not found; proceeding with --lite. Verify scope manually.'"
  - "Given /hive:plan --lite after produce-doc, then TUI prompt fires: 'Design discussion produced. Proceed with lite mode planning? [y/N]'"
  - "Given planning.confirm_gate_artifact: true, then state/epics/{epic-id}/docs/design-discussion-signoff.md written after user confirms"
  - "Given design-discussion-signoff.md, then it has required frontmatter: epic_id, date, gate, status: approved"

steps:
  - id: research
    description: |
      Read:
      1. skills/plan/SKILL.md Phase B section (~lines 108-135) — where design-discussion runs and
         where the gate would be inserted in the flow
      2. hive/hive.config.yaml lines 130-145 — planning.collaborative_review pattern to follow for
         the new planning.confirm_gate_artifact key
      3. state/epics/hive-composability-design/docs/design-discussion.md — find the SCALE ASSESSMENT
         block with SCOPE_CLASS hint (added by S1.2) to confirm exact format to parse
    agent: researcher

  - id: implement
    description: |
      In skills/plan/SKILL.md, within Phase B after the design-discussion produce-doc step:

      1. Scope-class guard prose (add as a new numbered step after produce-doc):
         "After produce-doc completes, if --lite was passed:
          a. Read SCOPE_CLASS from the SCALE ASSESSMENT block of the just-produced design-discussion.
          b. If SCOPE_CLASS is 'multi-epic' or 'prd': STOP. Output:
             'Error: --lite is not available for multi-epic or PRD scope.
              The design discussion has been produced. Review it, then run /hive:plan without --lite.'
          c. If SCOPE_CLASS is absent: output warning 'SCOPE_CLASS hint not found; proceeding with --lite.
             Verify scope manually.' and continue.
          d. If SCOPE_CLASS is 'single-epic': continue."

      2. TUI confirmation gate prose (add as next step, fires in --lite mode only):
         "If --lite mode is active and scope-class guard passed:
          Display: 'Design discussion produced. Proceed with lite mode planning? [y/N]'
          On N or no input: stop with message 'Planning cancelled.'
          On Y: if planning.confirm_gate_artifact is true in hive.config.yaml, write
          state/epics/{epic-id}/docs/design-discussion-signoff.md with:
            ---
            epic_id: {epic-id}
            date: {ISO8601}
            gate: design-discussion-review
            status: approved
            ---
          Then continue to story decomposition (Phase C)."

      NOTE: This story only modifies skills/plan/SKILL.md. No changes to design-discussion/SKILL.md.
      The SCOPE_CLASS is read from the OUTPUT of produce-doc, not from the skill itself.
    agent: developer
    depends_on: [research]

  - id: test
    description: |
      Trace through three scenarios:
      1. --lite + SCOPE_CLASS: multi-epic → refusal fires, correct message
      2. --lite + SCOPE_CLASS: single-epic → gate fires, user Y → proceeds
      3. --lite + no SCOPE_CLASS in output → warning + proceeds
      Verify sign-off artifact schema matches expected frontmatter.
    agent: tester
    depends_on: [implement]

  - id: review
    description: |
      Review:
      - Guard fails open (not closed) on absent hint — critical correctness check
      - Refusal message is actionable (tells user what to do)
      - Sign-off artifact frontmatter matches interface spec in structured-outline.md
      - Guard + gate are the same flow moment (not two separate pre-flight checks)
    agent: reviewer
    depends_on: [test]

  - id: integrate
    description: Commit skills/plan/SKILL.md scope-class guard + TUI gate additions
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: skills/plan/SKILL.md
      purpose: Phase B section — where guard and gate prose is added
    - path: hive/hive.config.yaml
      purpose: planning.collaborative_review pattern at lines 134-136 — follow this for confirm_gate_artifact
      relevant_excerpt: |
        planning:
          collaborative_review: true   # pattern to follow for new confirm_gate_artifact key
    - path: state/epics/hive-composability-design/docs/structured-outline.md
      purpose: Q8 elicitation (guard fires post-produce-doc) + sign-off artifact interface spec

files_to_modify:
  - file: skills/plan/SKILL.md
    change: Add scope-class guard + TUI confirmation gate prose steps in Phase B (--lite mode branch)

design_decisions:
  - decision: Guard and gate are one flow moment (merged per D4)
    rationale: Elicitation Q8 — SCOPE_CLASS doesn't exist until produce-doc runs; gate is the natural check point
  - decision: Guard fails open (allows --lite with warning) when SCOPE_CLASS absent
    rationale: Failing closed blocks all --lite invocations until S2.1 and S1.2 fully propagate; unacceptable
  - decision: Sign-off artifact is optional (controlled by confirm_gate_artifact config key)
    rationale: User Q2 — TUI is default; state-file sign-off is for hook/board integration, not all users

cross_cutting:
  - concern: documentation
    action: "skills/plan/SKILL.md updated with guard and gate instructions. No other docs impacted."

risks:
  - severity: medium
    description: SCOPE_CLASS parsing — the guard reads a structured hint from prose output; LLM output may not always emit it in exact format
    mitigation: Guard reads for 'SCOPE_CLASS: single-epic|multi-epic|prd' pattern; case-insensitive; fails open on any parse failure

references:
  - path: state/epics/hive-composability-design/docs/structured-outline.md
    relevant_excerpt: |
      Slice 2, Change #2: scope-class guard reads SCOPE_CLASS from SCALE ASSESSMENT; fails open on absent hint.
      Q8: "scope-class guard and confirmation gate should be the same moment in the flow."
      Interface: design-discussion-signoff.md frontmatter — epic_id, date, gate, status: approved.
  - path: state/epics/hive-composability-design/docs/user-feedback-design-discussion.md
    relevant_excerpt: |
      Q1: --lite MUST NOT apply when scope spans multiple epics or enters PRD territory.
      Q2: TUI default, state-file sign-off configurable (TUI-and-optionally-state).
