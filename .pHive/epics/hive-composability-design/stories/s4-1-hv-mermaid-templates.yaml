id: s4-1-hv-mermaid-templates
epic: hive-composability-design
title: Mermaid replaces ASCII in H/V skill templates
status: pending
complexity: medium
methodology: classic
depends_on: [s1-2-design-discussion-sidecar, s1b-1-doc-token-telemetry]

description: |
  Replace ASCII art layer-map and overlay diagrams in H/V skill templates with Mermaid
  graph blocks. Also adds doc-token-telemetry invocations to H/V skill writes (carrying
  through the telemetry from S1b.1 which only hooked design-discussion and structured-outline).

  - skills/hive/skills/horizontal-plan/SKILL.md lines 89-109: replace ASCII layer-map
    template with Mermaid graph TD template
  - skills/hive/skills/vertical-plan/SKILL.md lines 97-122: replace ASCII overlay
    diagram with Mermaid template

  IMPORTANT: Existing H/V planning docs (e.g., memory-autonomy-foundation/) stay as-is.
  No regeneration. Only skill templates change; future runs produce Mermaid output.

  Telemetry gate: before starting implementation, review state/telemetry/doc-tokens.jsonl
  data from S1b.1 runs. If data shows HTML-primary format has meaningful token cost
  advantage, that's informative but does NOT flip the format default in this story —
  format flip requires its own decision at S4.3.

acceptance_criteria:
  - "Given /hive:plan run after this change, then horizontal-plan.md output contains Mermaid graph TD block, not ASCII art"
  - "Given /hive:plan run after this change, then vertical-plan.md output contains Mermaid graph block, not ASCII art"
  - "Given grep 'graph TD' horizontal-plan.md, then it returns a match (Mermaid is fenced markdown — greppable)"
  - "Given existing ASCII H/V docs in state/epics/*/docs/, then they are unchanged"
  - "Given doc-token-telemetry, then H/V writes now append records to state/telemetry/doc-tokens.jsonl"

steps:
  - id: research
    description: |
      Read:
      1. skills/hive/skills/horizontal-plan/SKILL.md lines 89-109 — current ASCII template
      2. skills/hive/skills/vertical-plan/SKILL.md lines 97-122 — current ASCII template
      3. state/epics/hive-composability-design/docs/horizontal-plan.md — the Mermaid diagram
         already produced in this epic's planning (use as reference for what the template should output)
      4. state/telemetry/doc-tokens.jsonl — review any data from S1b runs; note format cost findings
      Identify exact line ranges for ASCII diagram blocks in each skill file.
    agent: researcher

  - id: implement
    description: |
      1. In horizontal-plan/SKILL.md, replace ASCII layer-map template block with:
         ```mermaid
         graph TD
           L1["{layer-name}"]
           L2["{layer-name}"]
           ...
           L1 --> L2
           ...
         ```
         Add prose: "Generate a graph TD Mermaid diagram mapping all architectural layers.
         Format: each layer as a node, edges show dependency direction.
         Reference: hive/references/planning-format-contract.md"

      2. In vertical-plan/SKILL.md, replace ASCII overlay template block with:
         ```mermaid
         graph TD
           S1["{slice-name} (Slice N)"]
           S2["{slice-name} (Slice N+1)"]
           ...
           S1 --> S2
           ...
         ```
         Same prose instruction referencing planning-format-contract.md.

      3. In both SKILL.md files, after the write-document instruction, add one-line telemetry:
         "After writing, invoke lib/doc-token-telemetry to record this write.
          Pass doc_type: 'horizontal-plan' (or 'vertical-plan'), format: 'markdown-embedded-html'."
         (This is the H/V telemetry hookup deferred from S1b.1)
    agent: developer
    depends_on: [research]

  - id: test
    description: |
      Verify:
      1. Run /hive:plan on a new small-medium epic — confirm H/V output has Mermaid blocks
      2. grep "graph TD" on the produced horizontal-plan.md — succeeds
      3. Open produced horizontal-plan.html (generated by sidecar gen from S1.2) — Mermaid renders
      4. Check state/telemetry/doc-tokens.jsonl — new records for horizontal-plan and vertical-plan writes
      5. Check existing state/epics/memory-autonomy-foundation/docs/horizontal-plan.md — unchanged
    agent: tester
    depends_on: [implement]

  - id: review
    description: |
      Review:
      - Mermaid template is self-documenting (an agent reading the template understands what to fill in)
      - planning-format-contract.md cross-reference present in both skills
      - Telemetry invocations are one-line additions (not structural changes)
      - No existing content removed beyond the ASCII template blocks being replaced
    agent: reviewer
    depends_on: [test]

  - id: integrate
    description: Commit horizontal-plan/SKILL.md + vertical-plan/SKILL.md Mermaid template replacements
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: skills/hive/skills/horizontal-plan/SKILL.md
      purpose: Lines 89-109 (verify in research) — ASCII layer-map template to replace
    - path: skills/hive/skills/vertical-plan/SKILL.md
      purpose: Lines 97-122 (verify in research) — ASCII overlay diagram to replace
    - path: state/epics/hive-composability-design/docs/horizontal-plan.md
      purpose: Reference — this epic's own Mermaid horizontal plan; use as template example
    - path: hive/references/planning-format-contract.md
      purpose: Format contract to cross-reference from H/V skills

files_to_modify:
  - file: skills/hive/skills/horizontal-plan/SKILL.md
    change: Replace ASCII template with Mermaid graph TD; add telemetry invocation
  - file: skills/hive/skills/vertical-plan/SKILL.md
    change: Replace ASCII template with Mermaid graph; add telemetry invocation

design_decisions:
  - decision: No regeneration of existing H/V docs
    rationale: Structured-outline explicitly defers migration; existing docs stay as-is; only future runs change
  - decision: Telemetry hookup for H/V lands in S4.1 (not S1b.1)
    rationale: S1b.1 deferred H/V edits to S4.1; these files are modified here anyway

cross_cutting:
  - concern: documentation
    action: "H/V skill templates updated with Mermaid and planning-format-contract.md cross-reference."

risks:
  - severity: medium
    description: Mermaid template may produce invalid graph syntax if agent fills in incorrectly
    mitigation: Template includes sample node and edge; agent follows pattern; Mermaid fenced blocks degrade to readable plain text if invalid

references:
  - path: state/epics/hive-composability-design/docs/structured-outline.md
    relevant_excerpt: |
      Slice 4, Changes #1-2: horizontal-plan/SKILL.md lines 89-109 and vertical-plan/SKILL.md lines 97-122.
      Mermaid graph TD template. planning-format-contract.md prose instruction.
