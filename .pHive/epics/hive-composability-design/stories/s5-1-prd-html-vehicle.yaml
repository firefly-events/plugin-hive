id: s5-1-prd-html-vehicle
epic: hive-composability-design
title: PRD HTML canonical output + inverse markdown sidecar
status: pending
complexity: medium
methodology: classic
depends_on: [s4-3-sidecar-gen-expansion]

metric:
  applies: false
  justification: >
    Adds PRD HTML canonical output with an inverse markdown sidecar. A structural
    output-format deliverable with no runtime trend metric.

description: |
  Implement PRD HTML canonical output (HTML-primary exception — the only doc type
  where HTML, not markdown, is the canonical artifact).

  PRECONDITION: Before authoring this story, verify PRD skill exists at a known path.
  Search: grep -r "prd" /Users/don/Documents/plugin-hive/skills/hive/skills/ -l
  If absent: this story scope expands to CREATE the PRD skill + implement HTML output.
  If present: this story implements HTML output changes to the existing skill.

  Deliverables:
  1. PRD skill — HTML-primary output with full <html> document, sectioned layout,
     inline Mermaid, <figure> elements.
  2. lib/html-sidecar-gen.* — add inverse direction: generateMarkdownSidecar(htmlPath)
     strips HTML scaffolding for grep-compatible markdown fallback.
  3. hive/references/planning-format-contract.md — PRD exception section: PRD is the
     only doc type where HTML is canonical; .md sidecar is inverse-direction.

acceptance_criteria:
  - "Given PRD skill produces output on a large-scope epic, then output is a full HTML document with sectioned layout"
  - "Given PRD HTML output, then it has inline Mermaid diagram blocks and <figure> elements"
  - "Given PRD .md sidecar, then grep on it works and it is readable in terminal"
  - "Given planning-format-contract.md PRD row, then it documents HTML as canonical (exception) and .md as inverse sidecar"
  - "Given lib/html-sidecar-gen.*, then generateMarkdownSidecar(htmlPath) produces a stripped .md file"

steps:
  - id: research
    description: |
      PRECONDITION CHECK:
      grep -r "prd" /Users/don/Documents/plugin-hive/skills/hive/skills/ -l --include="*.md"
      ls /Users/don/Documents/plugin-hive/skills/hive/skills/prd/ 2>/dev/null || echo "ABSENT"

      If PRD skill exists: read it in full; identify output section to modify.
      If PRD skill absent: note this — story scope expands to create + implement.

      Also read lib/html-sidecar-gen.* to understand current structure before adding inverse direction.
    agent: researcher

  - id: implement
    description: |
      IF PRD skill exists:
        Modify PRD skill output template:
        - Output is full HTML document (not markdown with embedded HTML)
        - Structure: <html><head><style>/* planning-doc minimal CSS */</style>
          <script src="mermaid CDN"></script></head>
          <body><h1>{title}</h1><nav>{toc}</nav><main>{sections}</main></body></html>
        - Sections: Goal, Background, Requirements, Architecture (with Mermaid), Design (with figures), Risks
        - After writing HTML, invoke generateMarkdownSidecar() for .md fallback

      IF PRD skill absent:
        Create skills/hive/skills/prd/SKILL.md with:
        - Purpose: produce a PRD document for large-scope / multi-epic requirements
        - Output: full HTML as above
        - Reference planning-format-contract.md

      THEN in lib/html-sidecar-gen.*:
        Add: async generateMarkdownSidecar(htmlPath: string): Promise<string>
        - Reads the HTML file
        - Strips <html><head><body> scaffolding
        - Removes <style> blocks, <script> blocks
        - Preserves content sections as markdown headers
        - Replaces <pre class="mermaid"> with ```mermaid fences
        - Passes <figure> elements through (they're valid in markdown-embedded-HTML)
        - Writes to same directory with .md extension
        - Non-blocking on failure (returns null, logs warning)

      IN hive/references/planning-format-contract.md:
        Add or update PRD row in doc-type table:
        - Format: HTML-primary (exception — inverse of all other doc types)
        - Sidecar: .md inverse-direction via generateMarkdownSidecar()
        - Terminal-degradation: use .md sidecar for grep/terminal use

      IN planning-format-contract.md, add PRD exception section explaining the inversion rationale.
    agent: developer
    depends_on: [research]

  - id: test
    description: |
      If PRD skill exists: run /hive:plan on a large-scope or PRD-class requirement.
      If PRD skill absent (created here): test with synthetic invocation.
      Verify:
      1. HTML output exists and renders in browser with sections, Mermaid, figures
      2. .md sidecar exists; cat it — readable; grep on it works
      3. Telemetry: new record in doc-tokens.jsonl with doc_type: 'prd', format: 'html-primary'
      4. planning-format-contract.md PRD row reflects html-primary canonical
    agent: tester
    depends_on: [implement]

  - id: review
    description: |
      Review:
      - generateMarkdownSidecar() strips HTML scaffolding without destroying content
      - PRD HTML structure is consistent with planning-format-contract.md spec
      - Exception rationale in format-contract.md is clear
      - Non-blocking failure handling in inverse sidecar generator
    agent: reviewer
    depends_on: [test]

  - id: integrate
    description: Commit PRD skill changes, generator inverse addition, format-contract.md PRD section
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: skills/hive/skills/
      purpose: Search for PRD skill here in research step — existence determines story scope
    - path: lib/html-sidecar-gen.js
      purpose: Add generateMarkdownSidecar() inverse direction
    - path: hive/references/planning-format-contract.md
      purpose: Add PRD exception section and update doc-type table PRD row

files_to_modify:
  - file: lib/html-sidecar-gen.js
    change: Add generateMarkdownSidecar(htmlPath) inverse-direction function
  - file: hive/references/planning-format-contract.md
    change: Add PRD exception section; update PRD row in doc-type table

design_decisions:
  - decision: PRD is the only HTML-primary doc type
    rationale: Design-discussion Q4 resolution — markdown-embedded-HTML confirmed as default; PRD is the exception per format-contract
  - decision: Inverse sidecar (.md from HTML) provides terminal/grep fallback for PRD
    rationale: Users need grep-compatible access to PRD content even when HTML is canonical

cross_cutting:
  - concern: documentation
    action: "planning-format-contract.md PRD section added. PRD skill updated or created."

risks:
  - severity: medium
    description: PRD skill may not exist — scope expands to create + implement
    mitigation: Research step checks existence first; implementer scope-adjusts accordingly; complexity budget sufficient

references:
  - path: state/epics/hive-composability-design/docs/structured-outline.md
    relevant_excerpt: |
      Slice 5: PRD skill HTML-primary output. generateMarkdownSidecar() for inverse direction.
      Precondition: verify PRD skill exists before authoring.
