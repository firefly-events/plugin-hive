id: s8-1-execute-story-boundary-hook
epic: hive-composability-design
title: Execute story-boundary hook + handoff writer (respawn-per-task)
status: pending
complexity: high
methodology: classic
depends_on: [s7-1-agent-spawn-step7b]

description: |
  Wire respawn-per-task lifecycle into skills/hive/skills/execute/SKILL.md.

  Story-boundary hook: after story N completes, check execution.teammate_lifecycle.
  If respawn_per_task: invoke handoff writer → spawn story N+1 agent with handoff_summary_path.
  If long_running (default planning): no change.

  Handoff writer: gather agent insights from state/insights/ and episode pointers from
  state/episodes/. Write state/respawn-summaries/{agent}-handoff-{to-story-id}.md per
  story-handoff-schema.md.

  STABILITY GATE: This story must NOT start until:
  1. memory-autonomy Phase 2 remaining stories are merged AND stable
  2. 2+ successful complex execution runs through the session execute path
  If the session execute path is unstable, this story does not start regardless of sprint.

  PRECONDITION: Read hive/references/session-system-prompt-spec.md BEFORE implementing.
  Elicitation Q7: must confirm story-boundary event is structurally defined in that spec.
  If story boundaries are implicit (agent prose), the hook implementation differs from
  explicit (YAML status update or spawn/shutdown event).

  NEW DEFAULT: execution.teammate_lifecycle: respawn_per_task. Explicit regression test
  required — no-config epics must behave as today.

acceptance_criteria:
  - "Given a 2+ story epic with execution.teammate_lifecycle: respawn_per_task, then after story N completes, handoff summary is written at state/respawn-summaries/{agent}-handoff-{N+1-story-id}.md"
  - "Given story N+1 spawned, then its preamble acknowledges handoff (reads from handoff_summary_path) before opening implementation files"
  - "Given execution.teammate_lifecycle: long_running, then no handoff written; agent persists across stories"
  - "Given an epic with no execution.teammate_lifecycle in hive.config.yaml (hypothetically absent), then behavior is respawn_per_task (the new default)"
  - "Given handoff summary written, then it conforms to story-handoff-schema.md (all required fields present)"

steps:
  - id: research
    description: |
      PRECONDITION: Read hive/references/session-system-prompt-spec.md in full.
      Identify: how is a story boundary defined? Is it:
        (a) Agent outputs a specific signal ("story complete", "story N done")
        (b) YAML status update (story YAML status set to completed)
        (c) Agent-spawn or agent-shutdown event
        (d) Other mechanism
      Document the answer — it determines the hook implementation approach.

      Also read skills/hive/skills/execute/SKILL.md in full to understand:
      - How stories are currently sequenced
      - Where story N completion is detected
      - Where story N+1 spawn currently happens
      - What state is available at story-boundary moment (insights, episodes)

      Verify: state/insights/ and state/episodes/ exist and have content from prior runs.
    agent: researcher

  - id: implement
    description: |
      In skills/hive/skills/execute/SKILL.md, at the story-boundary moment (identified in research):

      1. Story-boundary hook (add after story N completion detection):
         "After story N completes, check hive.config.yaml execution.teammate_lifecycle.
          If 'long_running': continue to story N+1 without handoff (existing behavior).
          If 'respawn_per_task' (default): invoke handoff writer before spawning story N+1."

      2. Handoff writer block (add as a new section in execute skill):
         "Handoff Writer (fires when execution.teammate_lifecycle: respawn_per_task):
          a. Read all insight files in state/insights/ produced during story N.
          b. Read all episode files in state/episodes/ produced during story N.
          c. Gather: from_story_id (story N id), to_story_id (story N+1 id), open questions,
             active blockers, intentional deferrals the agent noted during story N.
          d. Write state/respawn-summaries/{agent}-handoff-{to-story-id}.md per
             hive/references/story-handoff-schema.md (all required fields).
          e. Spawn story N+1 agent with handoff_summary_path set to the written file path."

      3. Spawn call update: when respawn_per_task is active, agent-spawn for story N+1
         must receive handoff_summary_path (not respawn_summary_path). These are mutually
         exclusive (per S7.1 hard error).

      4. No-config regression note (add as a comment near the lifecycle check):
         "Default: if execution.teammate_lifecycle key is absent from hive.config.yaml,
          treat as respawn_per_task (the configured default). Document this in release notes."
    agent: developer
    depends_on: [research]

  - id: test
    description: |
      Validation requires actual execution runs:
      1. Create a test epic with 2 stories, set execution.teammate_lifecycle: respawn_per_task
         in hive.config.yaml. Run /hive:execute.
         - Verify: handoff summary written after story 1 complete
         - Verify: story 2 preamble acknowledges handoff (contains "starting story {id} with context")
         - Verify: handoff summary conforms to story-handoff-schema.md
      2. Same epic with long_running:
         - Verify: no handoff written; agent continues to story 2 without respawn
      3. Regression: run /hive:execute on an existing epic (no new lifecycle config):
         - Verify: behavior is respawn_per_task (new default) — not a silent regression
    agent: tester
    depends_on: [implement]

  - id: review
    description: |
      Review:
      - Story-boundary definition matches what session-system-prompt-spec.md defines (from research)
      - Handoff writer gathers insights and episodes from the correct state/ paths
      - respawn_per_task and long_running paths are mutually exclusive and correct
      - No-config default is documented and regression-tested
      - handoff_summary_path and respawn_summary_path are never both set (per S7.1 hard error)
    agent: reviewer
    depends_on: [test]

  - id: integrate
    description: |
      Commit skills/hive/skills/execute/SKILL.md story-boundary hook + handoff writer.
      Tag commit with note about default-change: execution.teammate_lifecycle: respawn_per_task is now default.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: skills/hive/skills/execute/SKILL.md
      purpose: Primary file — add story-boundary hook and handoff writer
    - path: hive/references/session-system-prompt-spec.md
      purpose: MUST READ FIRST — defines story-boundary event structure; determines hook implementation approach
    - path: hive/references/story-handoff-schema.md
      purpose: Schema the handoff writer must produce
    - path: skills/hive/skills/agent-spawn/SKILL.md
      purpose: Step 7b handoff_summary_path parameter (added in S7.1) — used here to spawn story N+1
    - path: hive/hive.config.yaml
      purpose: execution.teammate_lifecycle key (added in S6.2) — controls hook behavior

files_to_modify:
  - file: skills/hive/skills/execute/SKILL.md
    change: "Add: story-boundary hook with lifecycle check; handoff writer block; spawn call update for handoff_summary_path"

design_decisions:
  - decision: execution.teammate_lifecycle: respawn_per_task is the NEW default
    rationale: Approved at structured-outline sign-off; token savings is intended default for all execution
  - decision: Handoff writer gathers from state/insights/ and state/episodes/ (not agent memory directly)
    rationale: These state paths are the canonical artifact store; handoff must reference files, not ephemeral context
  - decision: Stability gate — 2+ successful execution runs required before starting this story
    rationale: R8 risk — execute hook destabilizes recently-migrated session path; gate is a quality signal

cross_cutting:
  - concern: documentation
    action: "execute/SKILL.md updated with lifecycle hook. Release notes must document the default-change."

risks:
  - severity: high
    description: Execute hook destabilizes recently-migrated session execute path
    mitigation: Stability gate (2+ successful complex execution runs) enforced before this story starts
  - severity: medium
    description: Story-boundary event is implicit (agent prose) rather than explicit — hook may miss boundaries
    mitigation: Research step reads session-system-prompt-spec.md first; if implicit, hook uses a more robust detection strategy
  - severity: medium
    description: Default change (respawn_per_task) may surprise users who relied on implicit long_running
    mitigation: Regression test case 3 in test step; release notes document the change

references:
  - path: state/epics/hive-composability-design/docs/structured-outline.md
    relevant_excerpt: |
      Slice 8: execute story-boundary hook. Check execution.teammate_lifecycle after story N.
      Handoff writer: gather insights + episodes, write handoff summary, spawn N+1 with handoff_summary_path.
      Stability gate: 2+ successful execution runs before S8.1 starts.
      Q7: must read session-system-prompt-spec.md first — story-boundary definition is critical.
  - path: state/epics/hive-composability-design/docs/user-feedback-structured-outline.md
    relevant_excerpt: |
      execution.teammate_lifecycle: respawn_per_task is the new default — APPROVED.
