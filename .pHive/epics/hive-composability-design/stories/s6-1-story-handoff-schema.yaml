design_decisions:
  - decision: intentional_deferrals field added (D5 accepted)
    rationale: Elicitation Q6 — prevents story N+1 from re-litigating decisions story N explicitly deferred
  - decision: intentional_deferrals is optional
    rationale: Not all stories have explicit deferrals; making it required would burden every handoff
  - decision: Memory-bridging read contract is ordered and documented here
    rationale: Agent-spawn step 7b (S7.1) enforces this by documentation; schema is the authoritative source

