description: |
  Create hive/references/story-handoff-schema.md — the schema defining how context
  is passed from story N to story N+1 in respawn-per-task lifecycle mode.

  This is a pure docs story. The schema has 7 fields (6 from architect memo + 1 added
  from elicitation Q6: intentional_deferrals — accepted at D5).

  EXPLICIT SEPARATION: this schema is DISTINCT from the context-pressure respawn schema
  at skills/hive/skills/respawn/SKILL.md:74-113. Same directory (state/respawn-summaries/)
  but different filename convention and different purpose. The separation note must be
  prominent in this doc.

acceptance_criteria:
  - "Given the file, when read, then all 7 fields are present and defined"
  - "Given the file, then it contains an explicit separation note distinguishing this schema from context-pressure respawn at respawn/SKILL.md:74-113"
  - "Given intentional_deferrals field, then it is typed as optional [{path, rationale}] array"
  - "Given filename convention section, then it documents: {agent}-handoff-{to-story-id}.md (distinct from {agent}-{story-id}-{N}.md)"
  - "Given the file, then it cross-references skills/hive/skills/respawn/SKILL.md:74-113 for contrast"

steps:
  - id: implement
    description: |
      Create hive/references/story-handoff-schema.md:

      ## Story Handoff Schema

      **Purpose:** Carry context from story N to story N+1 when using
      `execution.teammate_lifecycle: respawn_per_task`. Written by the
      story-boundary handoff writer (see skills/hive/skills/execute/SKILL.md).

      **Separation note:** This schema is DISTINCT from the context-pressure respawn
      schema at `skills/hive/skills/respawn/SKILL.md:74-113`. That schema handles
      same-agent, same-step continuation under context pressure. This schema handles
      cross-story lifecycle transitions. Both write to `state/respawn-summaries/` but
      use different filename conventions (see below).

      ## Schema

      ```yaml
      from_story_id: string           # story that completed
      to_story_id: string             # story starting next
      insights_pointers:              # state/insights/ entries the new agent MUST read
        - path: string
      episode_pointers:               # state/episodes/ entries the new agent MUST read
        - path: string
      prior_story_observations: |     # freeform: codebase state, decisions made, patterns found
        string
      open_questions:                 # unresolved items for story N+1 to address
        - string
      active_blockers:                # anything failed, deferred, or blocked from story N
        - string
      intentional_deferrals:          # optional: files/changes story N explicitly chose NOT to make
        - path: string
          rationale: string
      ```

      ## Filename Convention

      Story handoff summaries use:
        `state/respawn-summaries/{agent}-handoff-{to-story-id}.md`

      Context-pressure respawn summaries use (existing, unchanged):
        `state/respawn-summaries/{agent}-{story-id}-{N}.md`

      No collision expected. If a file exists at the handoff pattern from a prior run,
      overwrite it (the new handoff supersedes the old).

      ## Memory-Bridging Read Contract

      When an agent receives a `handoff_summary_path`, it MUST read in this order
      before opening any implementation files:
      1. The handoff summary at handoff_summary_path
      2. All files listed in insights_pointers
      3. All files listed in episode_pointers
      This order is enforced by documentation (not code).
    agent: developer

  - id: review
    description: |
      Review:
      - All 7 fields present and typed
      - Separation note is prominent (not a footnote)
      - intentional_deferrals is optional (not required)
      - Filename conventions are explicit and distinct
      - Memory-bridging read contract is ordered and unambiguous
    agent: reviewer
    depends_on: [implement]

  - id: integrate
    description: Commit hive/references/story-handoff-schema.md
    agent: developer
    depends_on: [review]

