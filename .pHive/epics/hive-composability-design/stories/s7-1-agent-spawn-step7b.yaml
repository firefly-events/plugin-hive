id: s7-1-agent-spawn-step7b
epic: hive-composability-design
title: Agent-spawn step 7b two-parameter extension + story-handoff preamble
status: blocked
complexity: medium
methodology: classic
depends_on: [s6-3-respawn-docs-crossref]

description: |
  Extend skills/hive/skills/agent-spawn/SKILL.md step 7b to accept two optional
  parameters with distinct preamble logic:
  - respawn_summary_path: existing context-pressure preamble (unchanged behavior)
  - handoff_summary_path: new story-handoff preamble with memory-bridging instruction

  Hard error if both are set simultaneously.

  Memory-bridging read contract: when handoff_summary_path is set, the preamble
  must instruct the agent to read in order: handoff summary → insights_pointers →
  episode_pointers — BEFORE opening any implementation files.

  PRECONDITION: verify kg-write-path and kg-read-path merge status (from S6.0).
  If not merged: story-handoff preamble ships without KG bridging step 5e injection.
  If merged: add KG bridging step 5e to the preamble.

  NOTE: step 7b is at agent-spawn/SKILL.md lines 188-206 (verify in research).

acceptance_criteria:
  - "Given respawn_summary_path set only, then preamble is: 'You are continuing work from a previous instance of yourself (respawn iteration {N}).' — identical to today"
  - "Given handoff_summary_path set only, then preamble is: 'You are starting story {to_story_id} with context from story {from_story_id}. Read the handoff summary, then all insights_pointers and episode_pointers before opening any implementation files.'"
  - "Given both params set, then agent-spawn errors: 'Error: respawn_summary_path and handoff_summary_path cannot both be set. Use one or the other.'"
  - "Given neither param set, then agent behavior is identical to today (no preamble)"
  - "Given handoff_summary_path preamble, then memory-bridging read order is explicit: handoff → insights_pointers → episode_pointers → implementation files"

steps:
  - id: research
    description: |
      Read skills/hive/skills/agent-spawn/SKILL.md lines 185-215 (verify step 7b location).
      Understand current respawn_summary_path handling — exact preamble text currently used.
      Read state/epics/memory-autonomy-foundation/stories/ to confirm kg-write-path and
      kg-read-path YAML statuses (from S6.0 refresh) — determines whether KG bridging
      can be added to preamble.
      Read hive/references/story-handoff-schema.md for field names to reference in preamble.
    agent: researcher

  - id: implement
    description: |
      In skills/hive/skills/agent-spawn/SKILL.md, at step 7b (lines ~188-206):

      Replace/extend to:
      "Step 7b — Context injection (optional, one of two modes):

      Parameters: respawn_summary_path (string | undefined), handoff_summary_path (string | undefined)

      If BOTH are set: error and stop.
        Output: 'Error: respawn_summary_path and handoff_summary_path cannot both be set. Use one.'

      If respawn_summary_path set (existing context-pressure mode):
        Preamble: 'You are continuing work from a previous instance of yourself
        (respawn iteration {N}). Read {respawn_summary_path} before proceeding.'
        [existing behavior — do not change]

      If handoff_summary_path set (story-handoff mode):
        Preamble: 'You are starting story {to_story_id} with context from story {from_story_id}.
        Before opening any implementation files, read in this order:
        1. The handoff summary at {handoff_summary_path}
        2. Each file listed in insights_pointers
        3. Each file listed in episode_pointers
        This memory-bridging contract ensures continuity. See hive/references/story-handoff-schema.md.'
        [If kg-write-path and kg-read-path are merged: also add step 5e KG context injection instruction]

      If neither set: proceed without preamble (no change to existing no-params behavior)."

      Cross-reference hive/references/story-handoff-schema.md for field names.
    agent: developer
    depends_on: [research]

  - id: test
    description: |
      Test using three fixture invocations (trace through the logic — no live spawn needed):
      1. respawn_summary_path only: verify context-pressure preamble unchanged (compare to current text)
      2. handoff_summary_path only (synthetic path): verify story-handoff preamble with memory-bridging order
      3. Both set: verify error message matches spec
      4. Neither set: verify behavior identical to current no-params invocation
    agent: tester
    depends_on: [implement]

  - id: review
    description: |
      Review:
      - Both-set error is a hard stop (not a warning)
      - respawn_summary_path path is truly unchanged (compare word-for-word with current preamble)
      - Memory-bridging read ORDER is explicit in handoff preamble (1, 2, 3 numbered)
      - KG bridging note present if kg-write-path and kg-read-path are merged (or absent with note if not)
      - story-handoff-schema.md cross-reference present
    agent: reviewer
    depends_on: [test]

  - id: integrate
    description: Commit agent-spawn/SKILL.md step 7b extension
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: skills/hive/skills/agent-spawn/SKILL.md
      purpose: Step 7b at lines ~188-206 (verify) — extend to two-parameter logic
    - path: hive/references/story-handoff-schema.md
      purpose: Field names (to_story_id, from_story_id, insights_pointers, episode_pointers) for preamble template
      relevant_excerpt: |
        from_story_id, to_story_id, insights_pointers, episode_pointers,
        prior_story_observations, open_questions, active_blockers, intentional_deferrals
    - path: state/epics/memory-autonomy-foundation/stories/
      purpose: Check kg-write-path and kg-read-path YAML statuses to determine KG bridging scope

files_to_modify:
  - file: skills/hive/skills/agent-spawn/SKILL.md
    change: "Step 7b: add handoff_summary_path parameter with story-handoff preamble; add both-set hard error"

design_decisions:
  - decision: Both params simultaneously is a hard error (not a warning with fallback)
    rationale: Ambiguous injection intent should never silently proceed; hard error forces caller to be explicit
  - decision: Memory-bridging read contract is in the preamble (not enforced by code)
    rationale: Agent-spawn is a skill doc; instruction is the enforcement mechanism
  - decision: KG bridging (step 5e) is conditional on kg-write-path/kg-read-path merge status
    rationale: Elicitation Q12 (R12 risk) — ship two-param + preamble; KG bridging deferred if not merged

cross_cutting:
  - concern: documentation
    action: "agent-spawn/SKILL.md step 7b extended. story-handoff-schema.md cross-referenced."

risks:
  - severity: medium
    description: kg-write-path and kg-read-path not merged — KG bridging step deferred
    mitigation: Research step verifies status; if not merged, preamble ships without KG step 5e and note is added

references:
  - path: state/epics/hive-composability-design/docs/structured-outline.md
    relevant_excerpt: |
      Slice 7: step 7b accepts both optional params; different preamble per mode; both-set = hard error.
      Memory-bridging: read handoff → insights_pointers → episode_pointers before implementation files.
