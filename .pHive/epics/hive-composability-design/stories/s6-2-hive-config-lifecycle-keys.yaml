id: s6-2-hive-config-lifecycle-keys
epic: hive-composability-design
title: hive.config.yaml planning/execution teammate_lifecycle keys
status: blocked
complexity: low
methodology: classic
depends_on: [s6-1-story-handoff-schema]

description: |
  Add two new phase-keyed config keys to hive/hive.config.yaml:
  - planning.teammate_lifecycle: long_running
  - execution.teammate_lifecycle: respawn_per_task

  Following the planning.collaborative_review pattern at hive.config.yaml:134-136.

  IMPORTANT: execution.teammate_lifecycle defaults to respawn_per_task (not long_running).
  This is the new default approved at the structured-outline sign-off. The only user
  is currently using hive; backwards-compat with prior implicit long_running behavior
  is not a concern.

  No behavior change yet — execute/SKILL.md does not read this key until S8.1.
  This story is contracts and config only.

acceptance_criteria:
  - "Given hive.config.yaml, then it parses as valid YAML after this change"
  - "Given planning.teammate_lifecycle, then it is set to 'long_running'"
  - "Given execution.teammate_lifecycle, then it is set to 'respawn_per_task'"
  - "Given the keys, then they follow the planning.collaborative_review pattern (phase-keyed, not top-level)"
  - "Given this change, then no existing agent behavior changes (execute/SKILL.md does not yet read this key)"

steps:
  - id: implement
    description: |
      Read hive/hive.config.yaml lines 130-145 to see planning.collaborative_review pattern.

      Add in the planning section:
        planning:
          collaborative_review: true   # existing
          teammate_lifecycle: long_running   # new

      Add (or extend) execution section:
        execution:
          teammate_lifecycle: respawn_per_task   # new default

      Add a comment explaining the respawn_per_task default:
        # respawn_per_task: each story spawns a fresh agent, reducing context pressure
        # over multi-story epics. long_running: agents persist across stories (planning default).

      Do NOT change any other config keys.
    agent: developer

  - id: test
    description: |
      Verify:
      1. YAML parses: python3 -c "import sys,yaml; yaml.safe_load(open('hive/hive.config.yaml')); print('valid')"
      2. planning.teammate_lifecycle: long_running present
      3. execution.teammate_lifecycle: respawn_per_task present
      4. No other keys changed
    agent: tester
    depends_on: [implement]

  - id: review
    description: |
      Review:
      - Phase-keyed pattern matches planning.collaborative_review (not top-level keys)
      - Comment explains why respawn_per_task is the execution default
      - YAML is valid
    agent: reviewer
    depends_on: [test]

  - id: integrate
    description: Commit hive.config.yaml lifecycle key additions
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: hive/hive.config.yaml
      purpose: Primary file — add phase-keyed lifecycle keys following collaborative_review pattern
      relevant_excerpt: |
        # lines ~134-136 (verify exact location):
        planning:
          collaborative_review: true   # pattern to follow

files_to_modify:
  - file: hive/hive.config.yaml
    change: "Add planning.teammate_lifecycle: long_running and execution.teammate_lifecycle: respawn_per_task"

design_decisions:
  - decision: execution.teammate_lifecycle defaults to respawn_per_task
    rationale: Approved at structured-outline sign-off; only user is current user; token savings is intended default
  - decision: planning.teammate_lifecycle defaults to long_running
    rationale: Planning ceremonies are long sequential chains; long_running avoids handoff ceremony overhead during planning

cross_cutting:
  - concern: documentation
    action: "hive.config.yaml comments explain the new keys. No other docs needed — behavior documented in S8.1."

references:
  - path: state/epics/hive-composability-design/docs/user-feedback-structured-outline.md
    relevant_excerpt: |
      execution.teammate_lifecycle: respawn_per_task is the new default — APPROVED.
  - path: state/epics/hive-composability-design/docs/structured-outline.md
    relevant_excerpt: |
      Slice 6, Change #3: hive.config.yaml — add planning.teammate_lifecycle: long_running
      and execution.teammate_lifecycle: respawn_per_task following lines 134-136 pattern.
