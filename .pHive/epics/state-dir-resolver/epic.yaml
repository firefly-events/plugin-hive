name: state-dir-resolver
title: State Dir Resolver — cross-runtime state relocation
description: |
  Establish a shared state-dir resolver contract across shell, Node, and Python,
  then migrate bounded runtime clusters so configured `paths.state_dir` is honored
  without moving intentional `.pHive` policy locks. The epic keeps default `.pHive`
  behavior when unset, asserts Q2 env-override precedence, relocates DAG run-state
  while preserving fixed DAG opt-in config, adds suspend-aware run archival, and
  updates executable prose that agents directly follow.
target_codebase: /Users/don/Documents/plugin-hive
methodology: classic
version_bump: minor
git_flow:
  base_branch: develop
  branch_strategy: per-epic
stories:
  - id: sdr-1-resolver-contract-conformance-fixture
    title: Establish resolver contract and shared conformance fixture
    complexity: high
    depends_on: []
  - id: sdr-2-story-session-state-adoption
    title: Adopt state-dir resolver for story and session state
    complexity: medium
    depends_on: [sdr-1-resolver-contract-conformance-fixture]
  - id: sdr-3-metrics-adoption
    title: Adopt state-dir resolver for metrics readers and writers
    complexity: medium
