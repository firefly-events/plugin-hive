id: sdr-7-dag-executor-runstate-relocation
epic: state-dir-resolver
title: Relocate DAG executor run-state while fixed locks remain fixed
status: complete
complexity: medium-high
methodology: classic
depends_on: [sdr-1-resolver-contract-conformance-fixture]
tracker_id: "PLU-254"
tracker_uuid: "e140bc12-3294-499a-9c29-62efce272133"
tracker_url: "http://localhost:8080/issues/e140bc12-3294-499a-9c29-62efce272133"
parallel_allowed: true
parallel_rationale: bounded-slice
description: |
  Move only DAG executor transient run-state surfaces through the Python resolver:
  run-state storage, worktree isolation roots, nesting paths, and pause-state paths.
  Q1 is binding: `.pHive/hive.config.yaml` executor opt-in and
  `.pHive/runtime/executor-graduated-workflows.yaml` graduation registry remain fixed
  policy locks and must have negative coverage proving they did not move.
acceptance_criteria:
  - "Given a custom `paths.state_dir`, when DAG executor run-state is created, then runs land under `<state_dir>/runs/<run-id>`."
  - "Given a custom `paths.state_dir`, when DAG executor worktree isolation or nesting paths are created, then they land under the configured state dir."
  - "Given a relocated run is suspended and resumed, when `mark_suspended` and `unfreeze_for_resume` run, then the run remains durable and resumable under `<state_dir>/runs`."
  - "Given Q1 fixes DAG executor opt-in config, when executor initialization reads opt-in policy, then it still reads `.pHive/hive.config.yaml`."
  - "Given Q1 fixes the runtime graduation registry, when registry access is tested, then `.pHive/runtime/executor-graduated-workflows.yaml` remains the path."
  - "Given state-dir configuration is unset, when DAG run-state code runs, then default `.pHive` behavior remains unchanged."
metric:
  applies: false
  justification: "This story relocates DAG executor run-state paths while preserving fixed policy locks; success is proved by relocation and negative lock tests rather than by a metric."
steps:
  - id: research
    description: Inspect DAG executor run-state, worktree, nesting, pause, opt-in config, and registry tests to identify positive and negative coverage points.
    agent: researcher
  - id: implement
    description: Adopt the Python resolver for run-state surfaces only; do not relocate fixed Q1 config or registry paths.
    agent: developer
    depends_on: [research]
  - id: test
    description: Add relocated-run tests, suspend/resume round-trip tests, default `.pHive` tests, and negative fixed-lock tests.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Verify the Q1 split is honored and no fixed opt-in or registry path was mechanically rewritten.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit the DAG run-state relocation slice to `feat/state-dir-resolver`.
    agent: developer
    depends_on: [review]
