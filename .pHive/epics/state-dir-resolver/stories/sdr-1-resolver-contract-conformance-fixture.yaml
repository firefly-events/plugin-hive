description: |
  Establish the state-dir resolver contract. Per the accepted language-strategy ADR
  (Option B, Python-first + bridges — see references), **Python is the canonical
  resolver**; the shell (`hooks/common.sh`) and Node helpers are **compatibility shims**
  that must conform to the Python behavior, not co-equal implementations.

  Characterize the existing shell `_resolve_state_dir()` behavior (it is the current
  reference for hook surfaces), define the Python `resolve_state_dir` as the source of
  truth, and keep a Node `resolveStateDir` shim for JS bridge surfaces not yet migrated.
  One shared conformance fixture proves all three resolve byte-identically (the drift
  guard) for env override, config, default `.pHive`, relative paths, target project
  handling, and symlink canonicalization. This is the serial spine for the epic: later
  stories migrate consumers onto the resolved path, preferring the Python resolver and
  treating shell/Node as shims that will shrink as the Python-first migration proceeds.
acceptance_criteria:
  - "Given `HIVE_STATE_DIR` is set, when shell, Node, and Python resolve the state dir, then all three return the env override path even when `hive.config.yaml` also contains `paths.state_dir`."
  - "Given `HIVE_STATE_DIR` is unset and root `hive.config.yaml` contains `paths.state_dir`, when all three resolvers run, then they resolve the configured path rather than falling through to default `.pHive`."
  - "Given neither env nor config supplies a state dir, when all three resolvers run, then default `.pHive` remains unchanged."
  - "Given fixture rows cover absolute paths, `target_project: null`, already-canonical paths, symlinks, missing config, env-vs-config interaction, relative-under-target_project, and relative-under-cwd, when the conformance harnesses run, then every runtime matches the shared expected absolute path for every row."
  - "Given no consumer adoption belongs in this story, when the diff is reviewed, then downstream literal `.pHive` joins remain for later bounded slices."
  - "Given the language-strategy ADR (Option B), when the resolver contract is defined, then the Python `resolve_state_dir` is documented as the canonical source of truth and the shell/Node resolvers are labeled compatibility shims that conform to it (not co-equal implementations)."
metric:
  applies: false
  justification: "This story locks resolver correctness through conformance tests and does not introduce a product metric; success is whether shell, Node, and Python resolve identical paths under the shared fixture."
