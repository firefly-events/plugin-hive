id: sdr-10-executable-prose-conversion
epic: state-dir-resolver
title: Convert executable prose to HIVE_STATE_DIR paths
status: in_progress
complexity: low
methodology: classic
depends_on: [sdr-1-resolver-contract-conformance-fixture]
tracker_id: "PLU-248"
tracker_uuid: "781f0462-93b1-444b-8df0-e971a54ae747"
tracker_url: "http://localhost:8080/issues/781f0462-93b1-444b-8df0-e971a54ae747"
parallel_allowed: true
parallel_rationale: bounded-slice
description: |
  Convert only executable SKILL.md and workflow instructions that tell agents to
  read, write, mkdir, cp, tee, or redirect under `.pHive/...` so they use
  `${HIVE_STATE_DIR}/...`. Illustrative docs, examples, changelog references,
  product-name mentions, and non-executable prose remain literal per Q4.
acceptance_criteria:
  - "Given executable instructions in `skills/test/SKILL.md`, when they reference read/write/mkdir/cp/tee/redirection under `.pHive/...`, then they are converted to `${HIVE_STATE_DIR}/...`."
  - "Given executable instructions in `hive/workflows/steps/test-swarm/step-03-worker.md`, when they reference read/write/mkdir/cp/tee/redirection under `.pHive/...`, then they are converted to `${HIVE_STATE_DIR}/...`."
  - "Given the audit command `rg -nP '(mkdir|cp|cat|tee|cat\\s*>|>)\\s+\\.pHive' skills/ hive/workflows/`, when run after conversion, then no remaining hits are executable instructions that agents should follow."
  - "Given illustrative docs, examples, changelog entries, product-name references, or README mentions contain `.pHive`, when the diff is reviewed, then those literal references remain unchanged."
  - "Given state-dir configuration is unset, when converted instructions are followed with `${HIVE_STATE_DIR}` resolved to default `.pHive`, then default behavior remains unchanged."
metric:
  applies: false
  justification: "This story updates executable prose paths and is verified by an rg audit plus spot checks, not by a quantitative runtime metric."
steps:
  - id: implement
    description: Audit SKILL.md and workflow step files for executable `.pHive` operations and convert only Q4-scoped instructions to `${HIVE_STATE_DIR}`.
    agent: developer
  - id: test
    description: Run the rg audit and spot-check two or three converted instructions against a custom state dir.
    agent: tester
    depends_on: [implement]
  - id: review
    description: "Verify Q4 scope discipline: executable prose converted, illustrative prose left literal."
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit the executable prose conversion slice to `feat/state-dir-resolver`.
    agent: developer
    depends_on: [review]
context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: skills/test/SKILL.md
      purpose: Known executable skill prose requiring conversion.
    - path: hive/workflows/steps/test-swarm/step-03-worker.md
      purpose: Known executable workflow prose requiring conversion.
    - path: skills/execute/SKILL.md
      purpose: Existing `${HIVE_STATE_DIR}` convention model.
    - path: skills/ship/SKILL.md
      purpose: Existing `${HIVE_STATE_DIR}` convention model.
files_to_modify:
  - file: skills/test/SKILL.md
    change: Convert executable `.pHive/...` operations to `${HIVE_STATE_DIR}/...`.
  - file: hive/workflows/steps/test-swarm/step-03-worker.md
    change: Convert executable `.pHive/...` operations to `${HIVE_STATE_DIR}/...`.
  - file: skills/
    change: Convert any other Q4-scoped executable SKILL.md operations found by the audit.
  - file: hive/workflows/
    change: Convert any other Q4-scoped executable workflow operations found by the audit.
cross_cutting:
  - concern: state-dir-relocation
    action: "Update only executable agent instructions to use `${HIVE_STATE_DIR}` and preserve literal illustrative `.pHive` references."
references:
  - path: .pHive/epics/state-dir-resolver/docs/design-decisions.md
    relevant_excerpt: "Q4 converts only executable SKILL.md/workflow prose and leaves illustrative docs literal."
  - path: .pHive/epics/state-dir-resolver/docs/vertical-plan.md
    relevant_excerpt: "Step 10 uses `${HIVE_STATE_DIR}` for executable instructions and verifies with an rg audit."
