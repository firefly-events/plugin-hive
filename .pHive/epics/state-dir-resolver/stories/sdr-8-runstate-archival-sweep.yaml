id: sdr-8-runstate-archival-sweep
epic: state-dir-resolver
title: Add suspend-aware weekly run-state archival sweep
status: in_progress
complexity: medium
methodology: classic
depends_on: [sdr-7-dag-executor-runstate-relocation]
tracker_id: "PLU-255"
tracker_uuid: "899aa296-d806-43bd-9bd9-eeedd11d67e0"
tracker_url: "http://localhost:8080/issues/899aa296-d806-43bd-9bd9-eeedd11d67e0"
parallel_allowed: true
parallel_rationale: bounded-slice
description: |
  Add a DAG run-state archival subsystem that moves aged terminal runs from
  `<state_dir>/runs` into a temp/archive destination. Active and suspended runs are
  never archived regardless of age. The sweep must support manual dry-run invocation
  and an automated weekly trigger so project footprint self-bounds without breaking
  suspend/resume durability.
acceptance_criteria:
  - "Given terminal runs with statuses `completed`, `failed`, or `cancelled` older than the threshold, when the sweep runs, then those run directories move from `<state_dir>/runs` to the archive destination."
  - "Given active, suspended, or otherwise non-terminal runs of any age, when the sweep runs, then those runs remain under `<state_dir>/runs`."
  - "Given a terminal run is newer than the threshold, when the sweep runs, then it is not archived."
  - "Given `--dry-run` is used, when the CLI executes, then intended moves are reported without modifying the filesystem."
  - "Given the sweep has already archived eligible runs, when it runs again, then the second run is idempotent and produces no duplicate moves."
  - "Given the system is installed, when scheduling is inspected, then a weekly automated trigger exists in addition to the manual CLI."
  - "Given state-dir configuration is unset, when archival runs, then default `.pHive/runs` behavior remains unchanged."
metric:
  applies: false
  justification: "This story adds archival correctness behavior for run-state files; pass/fail guard, threshold, dry-run, and idempotency tests verify it instead of a metric series."
steps:
  - id: research
    description: Inspect DAG run-state status representation and repo conventions for Python CLIs and scheduled tasks.
    agent: researcher
  - id: implement
    description: Create the archival module, manual CLI, default threshold/destination handling, and weekly trigger wiring.
    agent: developer
    depends_on: [research]
  - id: test
    description: Add Python tests for terminal selection, active/suspended hard guards, threshold, dry-run, idempotency, default `.pHive`, and scheduled trigger simulation.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Verify suspended runs cannot be archived and the schedule plus manual CLI match the story contract.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit the archival sweep slice to `feat/state-dir-resolver`.
    agent: developer
    depends_on: [review]
