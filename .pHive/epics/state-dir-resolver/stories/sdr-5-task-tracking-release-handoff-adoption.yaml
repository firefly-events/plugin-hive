id: sdr-5-task-tracking-release-handoff-adoption
epic: state-dir-resolver
title: Adopt state-dir resolver for task tracking, release, and handoff
status: pending
complexity: medium
methodology: classic
depends_on: [sdr-1-resolver-contract-conformance-fixture]
parallel_allowed: true
parallel_rationale: bounded-slice
description: |
  Convert the partial-seam Node modules for task tracking, handoff dispatch, release
  posting, and GitHub issue adapter defaults to the shared resolver. Existing test
  injection seams stay intact, but defaults must now follow Q2: env override, root
  config, then default `.pHive`.
acceptance_criteria:
  - "Given module-specific injected `state_dir` or `_deps.stateDir`, when task tracking, handoff, or GitHub adapter code runs, then the explicit injection remains honored for tests."
  - "Given only `HIVE_STATE_DIR` is set, when all four modules resolve their default state dir, then they use the env path."
  - "Given only root config contains `paths.state_dir`, when all four modules resolve their default state dir, then they use the configured path and do not skip to `.pHive`."
  - "Given both env and config are present, when all four modules resolve their default state dir, then env override beats config per Q2."
  - "Given neither env nor config is present, when all four modules run, then default `.pHive` behavior remains unchanged."
metric:
  applies: false
  justification: "This story normalizes resolver precedence in partial-seam modules and is validated by four-permutation path tests, not by an operational metric."
steps:
  - id: research
    description: Inventory current tests and injection seams for task tracking, handoff, release post, and GitHub issue adapter.
    agent: researcher
  - id: implement
    description: Route default state-dir resolution through `resolveStateDir` while preserving explicit injection seams.
    agent: developer
    depends_on: [research]
  - id: test
    description: Add per-module tests for env-only, config-only, both, neither, and preserved explicit injection.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Verify Q2 precedence is asserted at every call site and no injection seam regressed.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit the task/release/handoff adoption slice to `feat/state-dir-resolver`.
    agent: developer
    depends_on: [review]
