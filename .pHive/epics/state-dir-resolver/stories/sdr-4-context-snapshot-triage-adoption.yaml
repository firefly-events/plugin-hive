description: |
  Relocate the context snapshot and triage skill surfaces so generated snapshots
  and triage queue output use configured `paths.state_dir`. This slice covers the
  runtime skill entry points only; broader executable prose conversion is deferred
  to sdr-10.
acceptance_criteria:
  - "Given a custom `paths.state_dir`, when context snapshot composition runs, then snapshot state is read and written under the configured state dir."
  - "Given a custom `paths.state_dir`, when the context-snapshot skill runner executes, then it passes the configured state dir rather than `join(REPO_ROOT, '.pHive')`."
  - "Given a custom `paths.state_dir`, when triage queue output is written, then it lands under `<state_dir>/triage`."
  - "Given state-dir configuration is unset, when snapshot and triage run, then default `.pHive` behavior remains unchanged."
  - "Given this is a bounded slice, when the diff is reviewed, then task-tracking, release, handoff, scenarios, DAG executor, archival, semantic guard, and prose conversion remain untouched."
