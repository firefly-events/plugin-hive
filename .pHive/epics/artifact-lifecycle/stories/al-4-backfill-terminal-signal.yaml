files_to_modify:
  - file: hive/lib/artifact_lifecycle/eligibility.py
    change: Implement `/ship` projection and merged-to-default plus age eligibility helpers.
  - file: hive/lib/artifact_lifecycle/planner.py
    change: Consume terminal eligibility helpers before action planning.
  - file: tests/artifact_lifecycle/test_terminal_eligibility.py
    change: Add shipped, merged legacy, unmerged, and advisory-status tests.

cross_cutting:
  - concern: safety
    action: Treat legacy branch evidence as eligibility only; archive action remains controlled by registry class policy.
  - concern: metrics
    action: Opt out with metric.applies=false because git/YAML fixture tests verify the behavior.

design_decisions:
  - decision: Add merged-to-default plus age as a legacy terminal signal.
    rationale: D3 requires this backfill because most existing epics never ran `/ship` and raw YAML status may be stale.

risks:
  - severity: medium
    description: Branch-merge detection can vary by repository default branch.
    mitigation: Resolve the default branch once through existing git-flow conventions and cover non-default branch names in tests.

