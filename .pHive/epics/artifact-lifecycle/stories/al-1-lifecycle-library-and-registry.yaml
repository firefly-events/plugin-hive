    change: Create package export surface.
  - file: hive/lib/artifact_lifecycle/registry.py
    change: Implement registry entry schema, enums, and validation.
  - file: hive/lib/artifact_lifecycle/cli.py
    change: Add argparse CLI placeholder with dry-run/class/apply flags.
