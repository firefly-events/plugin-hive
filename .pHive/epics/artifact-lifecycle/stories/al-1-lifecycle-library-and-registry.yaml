id: al-1-lifecycle-library-and-registry
epic: artifact-lifecycle
title: Create lifecycle library and per-class registry schema
status: pending
complexity: high
methodology: classic
depends_on: []
tracker_id: "PLU-267"
tracker_uuid: "cc2e3e55-8f4f-4fca-8133-278198aaa447"
tracker_url: "http://localhost:8080/issues/cc2e3e55-8f4f-4fca-8133-278198aaa447"

description: |
  Create the Python-first artifact lifecycle library skeleton under
  `hive/lib/artifact_lifecycle/` and define the registry schema used by every
  later story. The registry must encode the locked D1-D5 decisions: untracked
  artifacts are eligible for `evict`, tracked classes in this epic are
  report-only, archive actions use `evict|retire|report`, and age source is
  declared per class.

acceptance_criteria:
  - "Given the lifecycle package is imported, when registry entries are loaded, then each class validates `class_id`, `globs`, `classification`, `active_predicate`, `retention_threshold`, `archive_action`, `age_source`, and `hard_exclude` fields."
  - "Given a registry entry uses `archive_action`, when it is validated, then only `evict`, `retire`, and `report` are accepted and `retire` is rejected for executable sweep actions in this epic."
  - "Given an untracked class entry, when it is validated, then its `age_source` is `mtime` and its action can be `evict` or `report`."
  - "Given a tracked class entry, when it is validated, then its `age_source` is `git-last-commit` and its action is `report` unless a later gated epic enables `retire`."
  - "Given the package CLI module is invoked with `--help`, when dependencies are installed, then the command exits successfully and shows `--dry-run`, `--class`, and apply-mode options without performing a sweep."

metric:
  applies: false
  justification: "This infrastructure story establishes lifecycle registry correctness, and success is verified by schema and import tests rather than by a trend metric."

steps:
  - id: research
    description: Confirm the existing Python packaging/test conventions and the sdr-8 prototype expectations named in the design docs.
    agent: researcher
  - id: implement
    description: Create the Python package skeleton, registry data model, validation errors, and CLI placeholder without implementing sweep execution.
    agent: developer
    depends_on: [research]
  - id: test
    description: Run targeted registry validation and CLI help tests.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Verify the registry schema encodes D1-D5 and does not expose tracked removal behavior.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit the registry spine on feat/artifact-lifecycle.
    agent: developer
    depends_on: [review]

