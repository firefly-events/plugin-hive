cross_cutting:
  - concern: safety
    action: Encode D1-D5 as validation constraints before any sweep can execute.
  - concern: metrics
    action: Opt out with metric.applies=false because this is correctness substrate.

design_decisions:
  - decision: Python-first lifecycle library under `hive/lib/artifact_lifecycle/`.
    rationale: The locked design names Python-first per ADR Option B and centralizes cleanup behavior in one lifecycle package.
  - decision: Use explicit `evict`, `retire`, and `report` action verbs.
    rationale: D4 requires non-overlapping vocabulary so OS-temp eviction is not confused with durable tracked retirement.

risks:
  - severity: high
    description: A permissive registry can let later stories remove tracked classes despite D1/D2.
    mitigation: Validation rejects executable `retire` behavior in this epic and tests assert tracked classes are report-only.

references:
  - path: .pHive/epics/artifact-lifecycle/docs/design-decisions.md
    relevant_excerpt: "D1 limits this epic's spine to the untracked-runtime sweep; D4 defines `evict`, `retire`, and `report`; D5 fixes mtime for untracked artifacts and git last-commit date for tracked artifacts."
  - path: .pHive/epics/artifact-lifecycle/docs/design-discussion.md
    relevant_excerpt: "The proposed approach calls for a Python lifecycle library under `hive/lib/artifact_lifecycle/` with a per-class registry, planner, executor, and CLI/scheduler entrypoint."
