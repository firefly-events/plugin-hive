id: am-4-flow-runner-bridge
epic: actual-manual-tier
title: Port spike flow-runner into hive/lib/actual-manual (locate/verify/truth split)
status: pending
complexity: high
methodology: classic
depends_on: [am-1-bridge-surface-charter, am-2-flow-bindings-schema]

description: |
  Port the validated spike flow-runner (~/Code/spikes/actual-manual-cursor/arm-d-flow/flow-runner.mjs,
  commit 7b0ff06) into the hive bridge surface as the vision-cursor PARENT executor. It consumes a
  Hive scenario (action+expected) + the am-2 overlay, drives the flow, and emits a per-step report.
  Carry the locked design exactly:
    - LOCATE decoupled from "visible": grounding asks coords-only; trust the coords, click.
    - VERIFY is hybrid: vision verify + an authoritative truth-signal when the step declares one
      (cta_enabled=DOM, posted=network); truth authoritative, vision recorded alongside, divergence flagged.
    - Two-pass grounding: fullPage glance → scroll target to viewport center → precise viewport
      ground → real-mouse click; retry ≤3; DOM-snap OFF by default (SNAP_R=0).
    - Native primitives (fill/tapRole/goto/scroll/wait) delegated to Playwright; vision only for
      selectorless clicks + per-step verify.
  Grounding/verify parse + truth-signal evaluation logic should be Python where it cleanly can be
  (per charter); the Playwright/MLX I/O stays Node.

acceptance_criteria:
  - "Given the flayr-campaign-compose live-walk scenario + overlay, when the runner executes clean, then it drives all steps, vision locates + real-clicks the actual Post Now button, the network truth-signal fires, and flowPassed = true (3/3) — matching the spike."
  - "Given a render-invisible CTA (clipped or opacity:0), when the runner executes, then vision does not find the button, no hallucinated click, the action does not fire, and the flow fails = caught (the DOM-blind native click would have published)."
  - "Given a step with a truth-signal, the step pass is the truth-signal verdict (authoritative); the vision verify is still recorded; a divergence between them is surfaced in the report."
  - "DOM-snap is OFF by default; the click uses pure vision coords + real pointer (page.mouse.click), so z-index/overlays apply."
  - "The runner takes MLX endpoint + model + viewport from config/env; no hardcoded spike paths."

steps:
  - id: research
    description: Re-read the spike runner + RESULT.md Arm D; map spike paths/env to hive config + the am-2 overlay loader.
    agent: researcher
  - id: implement
    description: Port the runner into hive/lib/actual-manual/ with the locate/verify/truth split, two-pass grounding, native-primitive delegation, per-step report. Factor parseable logic to Python where clean.
    agent: developer
    depends_on: [research]
  - id: test
    description: Tests against the DOM-lies fixture — clean passes (posts), B2/B3 caught (no post); truth-signal authority + divergence reporting; snap-off click path. Mock/stub MLX where a live model isn't available in CI (flag the live-model gap).
    agent: tester
    depends_on: [implement]
  - id: review
    description: Verify the locked design is carried exactly (no DOM-snap default, locate≠visible, hybrid verify) and the bridge stays isolated.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

