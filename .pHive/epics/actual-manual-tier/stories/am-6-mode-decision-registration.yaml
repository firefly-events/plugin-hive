id: am-6-mode-decision-registration
epic: actual-manual-tier
title: Register mode_decision actual (env + config, env-over-config) in test-dispatch
status: pending
complexity: medium
methodology: classic
depends_on: [am-4-flow-runner-bridge]

description: |
  Register `actual` as a test mode_decision the same way multica/sandcastle registered theirs:
  resolved from HIVE_TEST_MODE=actual (env) or hive.config.yaml test.mode: actual (config), with
  env-over-config precedence. When resolved to actual, test-dispatch routes to the am-4 vision-cursor
  parent executor (which itself wraps the native Playwright runner). Mirror the existing
  test-mode-multica / test-mode-cc-workflows resolution pattern exactly. Additive — other modes
  untouched; default behavior when unset is unchanged.

acceptance_criteria:
  - "Given HIVE_TEST_MODE=actual, when test-dispatch resolves the mode, then mode_decision=actual with field_sources.test_mode=env, regardless of config."
  - "Given config test.mode: actual and no env, then mode_decision=actual with field_sources.test_mode=config."
  - "Given neither set, then the existing default resolution is byte-unchanged."
  - "Given mode_decision=actual, dispatch routes to the am-4 actual-manual executor; the resolution emits one structured INFO log mirroring the multica/cc-workflows pattern."

steps:
  - id: research
    description: Read how test-mode-multica / test-mode-cc-workflows register + how test-dispatch resolves mode (env-over-config) to mirror it.
    agent: researcher
  - id: implement
    description: Add `actual` to the mode resolver + dispatch routing to the am-4 executor; one structured INFO log.
    agent: developer
    depends_on: [research]
  - id: test
    description: Tests for env-over-config precedence (env, config, unset) and routing-to-executor on actual; default-unchanged regression.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm parity with the multica/cc-workflows resolution idiom and additive-only behavior.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

