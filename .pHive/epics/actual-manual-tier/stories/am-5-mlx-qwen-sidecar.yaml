    change: New Python lifecycle (start/ready/stop) for the MLX Qwen server.

design_decisions:
  - decision: Sidecar lifecycle is Python (canonical); avoids port 8080.
    rationale: Lifecycle is business logic → Python per charter. 8080 is Multica (multica-s); spike ran Qwen on 8089.

