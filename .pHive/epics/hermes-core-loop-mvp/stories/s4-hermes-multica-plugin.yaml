design_decisions:
  - decision: shell to cli.mjs, do not re-implement Multica REST in Python
    rationale: >
      cli.mjs (S1) is the proven, maintained Multica interface in plugin-hive.
      Re-implementing the same REST calls in Python creates a maintenance
      fork. The thin subprocess wrapper delegates all logic to the Node layer.
  - decision: CLI_MJS_PATH as env var, not hardcoded
    rationale: >
      plugin-hive may be checked out at different paths on different machines.
      A hardcoded path breaks portability. An env var (defaulting to
      ~/Code/plugin-hive/hive/lib/multica-story-dispatch/cli.mjs) is
      override-able per deployment.
  - decision: no multica_status_task tool (not in the five)
    rationale: >
      The reconciler tick calls cli.mjs status directly from the cron agent
      prompt (the runbook inlines the command). A separate Hermes tool for
      status is not needed for the core loop MVP.

risks:
  - severity: low
    description: >
      The hermes-agent repo may have a different Python version or
      dependency pinning that conflicts with a new dependency introduced
      by the plugin.
    mitigation: >
      Use only stdlib + existing hermes dependencies (subprocess, json,
      os). No new Python packages.
