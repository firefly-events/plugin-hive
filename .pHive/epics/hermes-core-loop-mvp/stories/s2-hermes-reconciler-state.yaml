design_decisions:
  - decision: "hermes_reconciler: block inside cycle-state.yaml, not a new file"
    rationale: >
      The brief's design principle is "cycle-state is the cross-tick memory."
      A second file adds a second read per tick and breaks the single-file
      invariant. The additive optional block pattern is already established
      (autonomous_cycle: was added in story s0-1).
  - decision: "autonomous_cycle: is NOT extended"
    rationale: >
      autonomous_cycle: fields are scenarios_run[], outcomes[], cycle_count —
      test-scenario replay tracking. Adding reconciler fields (phase_position,
      dispatched_at, attempt) would break its semantic contract and confuse
      any code that reads autonomous_cycle:.
  - decision: dispatched_at is the authoritative watchdog timestamp
    rationale: >
      writeMulticaRunEpisode is called AFTER task terminal, not at dispatch.
      The episode marker is not an in-flight state writer. The only reliable
      timestamp for "when did this task start" is the one the reconciler writes
      at dispatch time into hermes_reconciler.dispatched_at.

risks:
  - severity: low
    description: YAML library choice may differ from the rest of the codebase
    mitigation: Research step identifies the YAML library already in use
      (js-yaml or similar) and uses the same one.
