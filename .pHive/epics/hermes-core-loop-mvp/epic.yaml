    repo: plugin-hive
    complexity: medium
    depends_on: [s1-cli-mjs-core, s2-hermes-reconciler-state]

  - id: s4-hermes-multica-plugin
    title: "hermes-multica plugin — register_tool wrappers shelling to cli.mjs"
    repo: hermes-agent
    complexity: medium
    depends_on: [s1-cli-mjs-core]

