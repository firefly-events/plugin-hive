name: hermes-core-loop-mvp
title: Hermes Orchestrator — Core-Loop MVP
description: |
  Build the reconciler engine + watchdog for the Hermes-as-persistent-orchestrator
  core loop: implementation → review → (loop back on needs_revision) → epic-finalize PR.

  Architecture: a Hermes cron job ticks an idempotent reconciler once per minute.
  Each tick reads cycle-state + episode markers + one live Multica task status,
  executes exactly ONE actionable transition (watchdog rescue, harvest terminal,
  dispatch next story, or finalize epic PR), writes state, and exits. Crash recovery
  is automatic — cycle-state is a cache/accelerator; the source of truth is
  reconstructable from Multica task status + episode markers.

  MVP constraints (baked-in decisions):
  - Gate-less (pre-approved epic only): reconciler aborts tick (wakeAgent:false) if
    hermes_reconciler.gate_state is not "pre_approved". No HiveChat relay in MVP.
  - epic_finalize_pr is the terminal step; no user gate after the last story passes.
  - Reconciler state lives in a new additive hermes_reconciler: block inside the
    existing cycle-state.yaml (one file per tick), NOT in autonomous_cycle: (which
    is test-replay-shaped and semantically wrong for reconciler state).
  - Deterministic mutations live in cli.mjs (code); cycle-reconciler.md is the
    decision-narrative runbook the cron prompt inlines (no nested claude --print /skill).

  Epic spans two repositories:
  - plugin-hive: cli.mjs (S1), hermes_reconciler: schema (S2), cycle-reconciler.md (S3)
  - hermes-agent: hermes-multica plugin (S4), cron job + config (S5)

  Thinnest MVP proof = S1: dispatch + status working from the shell.

methodology: classic
status: planning
created_at: "2026-06-18"

repos:
  plugin-hive: https://github.com/firefly-events/plugin-hive.git
  hermes-agent: /Users/hive/Code/hermes-agent

open_items:
  - id: gate-cancel-verb
    description: >
      Confirm exact multica cancellation verb for watchdog rescue:
      `multica issue status <id> cancelled` vs a dedicated `task cancel`
      sub-command. Researcher flagged unverified. Affects S1 cancel cmd
      and S3 watchdog contract.
  - id: started-at-source
    description: >
      Confirm whether `multica task status <id>` or `multica task get <id>`
      exists to read live started_at each tick. If not, the S1 status cmd
      reconstructs it from /active-task + /task-runs (already designed as
      the fallback path, but verification unblocks the implementation choice).

stories:
  - id: s1-cli-mjs-core
    title: "cli.mjs — multica-story-dispatch thin CLI (dispatch / episode / status / cancel)"
    repo: plugin-hive
    complexity: medium
    depends_on: []

  - id: s2-hermes-reconciler-state
    title: "hermes_reconciler: additive block in cycle-state.yaml"
    repo: plugin-hive
    complexity: small
    depends_on: []

  - id: s3-cycle-reconciler-runbook
