name: per-epic-branch-pr-flow
title: Per-epic branching + base=develop — stack stories, one PR per epic
description: |
  Switch Hive's sandcastle event-dispatch from per-story branches (`agent/issue-<n>` → `main`)
  to per-epic stacking (`feat/<epic-id>` → configurable base, default `develop` if it exists
  else `main`). Stories commit on the shared epic branch; one PR per epic, draft until the
  final story flips `hive:shipped`. Aligns with established policy from memory feedback
  `feedback_git_flow_per_epic.md`.
target_codebase: /Users/don/Documents/plugin-hive-ui-f
methodology: classic

git_flow:
  base_branch: develop            # resolved at plan time — develop exists on origin
  branch_strategy: per-epic

source_issue: 175

stories:
  - id: pe-1-config-schema
    title: hive.config.yaml git_flow block + resolution helper
    complexity: low
    depends_on: []
  - id: pe-2-bridge-epic-branch
    title: Bridge template — branch name derived from hive:epic label
    complexity: low
    depends_on: [pe-1-config-schema]
  - id: pe-3-workflow-stack-pr
    title: Workflow template — concurrency per-epic + PR-stack-or-update
    complexity: medium
    depends_on: [pe-1-config-schema, pe-2-bridge-epic-branch]
  - id: pe-4-pr-ready-on-last
    title: Last-story-of-epic detection — promote draft PR to ready
    complexity: low
    depends_on: [pe-3-workflow-stack-pr]
  - id: pe-5-plan-emit-base
    title: /plan emits git_flow block on epic.yaml at planning time
    complexity: low
    depends_on: [pe-1-config-schema]
  - id: pe-6-docs
    title: README + runbook + CHANGELOG for per-epic flow + version bump
    complexity: low
    depends_on: [pe-2-bridge-epic-branch, pe-3-workflow-stack-pr, pe-4-pr-ready-on-last, pe-5-plan-emit-base]
