id: pe-4-pr-ready-on-last
epic: per-epic-branch-pr-flow
title: Last-story-of-epic detection — promote draft PR to ready
status: blocked
complexity: low
methodology: classic
depends_on: [pe-3-workflow-stack-pr]

description: |
  After pe-3, each epic produces a single draft PR. This story adds the last-story
  detection that promotes the draft to ready-for-review when the final story flips
  `hive:shipped`.

  Add a workflow step `Promote PR to ready if last story` that runs after the bridge
  has flipped the issue label to `hive:shipped`:

    1. Query total story count: `gh issue list --label "hive:epic:${EPIC_ID}" --label "hive:story:*" --state all -L 500 --json number -q '. | length'`
    2. Query shipped count: `gh issue list --label "hive:epic:${EPIC_ID}" --label "hive:shipped" --state closed -L 500 --json number -q '. | length'`
    3. If equal: `gh pr ready <pr-number-for-feat/${EPIC_ID}>` AND append a final body line
       `## All stories shipped ✅ — ready for review`.
    4. If not equal: emit one info log `Epic <id> not done: <shipped>/<total>; keeping draft.`

  Edge case: epic without a tracker issue (only story issues). The query still works because
  `hive:epic:*` is a label on the stories, not the epic-tracker issue. Add a comment in the
  workflow noting that the epic-tracker issue (if it exists) is excluded from the count via
  a `--label "hive:story:*"` filter.

acceptance_criteria:
  - "Given an epic has 3 stories and 2 are shipped + 1 open, when the workflow runs after a story flips to `hive:shipped`, then the PR stays draft and the info log names the count `2/3`."
  - "Given an epic has 3 stories and all 3 flipped to `hive:shipped`, when the workflow runs after the last story, then `gh pr ready` is called on the `feat/<epic-id>` PR and the PR's `isDraft` field returns `false`."
  - "Given an epic-tracker issue exists alongside the story issues, when the count query runs, then the epic-tracker issue is excluded (filtered out by `--label hive:story:*`)."
  - "Given the count query returns 0/0 (race — labels not yet propagated), when the workflow runs, then it logs the anomaly and does NOT promote (no false positive)."

steps:
  - id: research
    description: Read pe-3's final workflow shape. Confirm `gh pr ready` is idempotent (re-running on an already-ready PR is a no-op).
    agent: researcher
  - id: implement
    description: |
      1. Add `Promote PR to ready if last story` step to `hive-dispatch.yml.tpl` after the
         existing `Flip label to shipped` step.
      2. Inline the two `gh issue list` queries + the if/then logic.
      3. Regenerate `.example.yml`.
      4. Update SKILL.md "Process" with one line about the ready-promotion.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Add an asset-substitution test asserting the step block contains the two `gh issue list`
      invocations + the `gh pr ready` conditional. (Live behavior is verified post-merge
      when the next epic ships.)
    agent: tester
    depends_on: [implement]
  - id: review
    description: Verify the 0/0 anomaly path doesn't promote. Verify `hive:story:*` filter is correctly scoped.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: One commit on `feat/per-epic-branch-pr-flow`.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive-ui-f
  key_files:
    - path: skills/sandcastle-gh-init/assets/hive-dispatch.yml.tpl
      purpose: Adds the new step here after pe-3's edits.

files_to_modify:
  - file: skills/sandcastle-gh-init/assets/hive-dispatch.yml.tpl
    change: modify — add `Promote PR to ready if last story` step
  - file: skills/sandcastle-gh-init/assets/hive-dispatch.example.yml
    change: modify — mirror
  - file: skills/sandcastle-gh-init/SKILL.md
    change: modify — describe ready-promotion in Process

cross_cutting: []

metric:
  applies: true
  name: epic_pr_promotion_correctness
  direction: up
  unit: ratio
  baseline: 0.0
  target: 1.0
  window: next-3-epics
  source:
    kind: events
    ref: workflow-step-output-promote-pr-to-ready
  verify_at: integrate
  owner: reviewer
  justification: |
    Each epic's PR should be in `draft` for all-but-last story landings and flip to ready
    on the last. Direct check.

risks:
  - severity: low
    description: Race where the bridge has shipped the issue but the label change hasn't propagated to the count query yet.
    mitigation: |
      Add a 5-second `sleep` before the count query OR `gh api repos/.../issues?labels=...&since=...`
      with an explicit time filter. Defer choice to implement-step research.

references:
  - path: .pHive/epics/per-epic-branch-pr-flow/docs/design-discussion.md
    relevant_excerpt: |
      total=$(gh issue list --label "hive:epic:${EPIC_ID}" --state all --json number -q '. | length')
      shipped=$(gh issue list --label "hive:epic:${EPIC_ID}" --label "hive:shipped" --state closed --json number -q '. | length')
      if [ "$shipped" = "$total" ]; then gh pr ready "feat/${EPIC_ID}"; fi
