id: pe-1-config-schema
epic: per-epic-branch-pr-flow
title: hive.config.yaml git_flow block + resolution helper
status: pending
complexity: low
methodology: classic
depends_on: []

description: |
  Add a `git_flow` top-level block to the hive.config.yaml schema and a small JS resolution
  helper that downstream sandcastle workflow + bridge templates + /plan can call to get the
  resolved `base_branch` + `branch_strategy` for the current repo.

  This is the foundation story for the per-epic-branch-pr-flow epic — every subsequent
  story consumes the resolution helper.

  Schema:

    git_flow:
      default_pr_base: auto         # auto | <branch-name>; "auto" = develop if origin/develop exists, else main
      branch_strategy: per-epic     # per-epic | per-story (back-compat for in-flight epics)

  Helper at `hive/lib/git_flow.mjs` exports `resolveGitFlow({ cwd })` that:
    1. Reads root-first hive.config.yaml (repo) then hive/hive.config.yaml (plugin default)
    2. If `default_pr_base: auto`, runs `git -C <cwd> rev-parse --verify origin/develop` —
       on success returns `develop`, otherwise returns `main`.
    3. Returns `{ base_branch: string, branch_strategy: 'per-epic'|'per-story', source: 'root'|'plugin'|'default' }`.

  Both root and plugin config files must gain the new block with `default_pr_base: auto`
  and `branch_strategy: per-epic` so behavior is consistent regardless of where the
  consumer's overlay lives.

acceptance_criteria:
  - "Given `hive.config.yaml` is read, when the `git_flow` block is present with `default_pr_base: develop`, then `resolveGitFlow({cwd})` returns `{ base_branch: 'develop', branch_strategy: 'per-epic' }`."
  - "Given `default_pr_base: auto` is set and `origin/develop` exists, when `resolveGitFlow` runs, then it returns `base_branch: 'develop'`."
  - "Given `default_pr_base: auto` is set and `origin/develop` does NOT exist, when `resolveGitFlow` runs, then it returns `base_branch: 'main'`."
  - "Given the consumer's repo-local `hive.config.yaml` omits `git_flow`, when `resolveGitFlow` runs, then it falls back to the plugin's `hive/hive.config.yaml` defaults (`auto` + `per-epic`)."
  - "Given the helper is imported by another script via `import { resolveGitFlow } from 'hive/lib/git_flow.mjs'`, when called with no arguments, then it defaults `cwd` to `process.cwd()`."
  - "Given fixture tests under `tests/git-flow/resolve.test.mjs`, when run via `node --test`, then they cover the four resolution paths above and pass."

steps:
  - id: research
    description: |
      Read `hive/hive.config.yaml` + root `hive.config.yaml` to see how existing top-level
      blocks (`task_tracking`, `paths`, `planning`) are structured. Read
      `hive/references/skill-prelude.md` for the root-first config precedence contract.
    agent: researcher
  - id: implement
    description: |
      1. Add `git_flow:` block (with both fields documented in YAML comments) to
         `hive/hive.config.yaml` as the plugin default.
      2. Add a commented example block to root `hive.config.yaml` so consumers know
         the knob exists.
      3. Create `hive/lib/git_flow.mjs` implementing `resolveGitFlow({ cwd })`.
      4. The helper must use `child_process.execFileSync('git', ['rev-parse', ...], ...)`
         array-form — no shell interpolation.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Write fixture tests under `tests/git-flow/resolve.test.mjs` that exercise all four
      acceptance criteria paths using temp dirs and faked git binaries. Verify tests pass
      with `node --test`.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Verify implementation matches AC, no shell interpolation, helper is pure (no side effects beyond reads).
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: One commit on `feat/per-epic-branch-pr-flow`.
    agent: developer
    depends_on: [review]

