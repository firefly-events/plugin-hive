cross_cutting: []

metric:
  applies: false
  justification: "Pure schema + helper story; the observable surface lives in downstream stories pe-2..pe-6 that consume the resolution. Verifying this story by metric would require duplicating the consumer tests."

risks:
  - severity: low
    description: Consumer has `origin/develop` for unrelated reasons (e.g., GitFlow legacy) but wants `main` as base.
    mitigation: Consumer sets `default_pr_base: main` explicitly. `auto` is only the default when the field is absent.

references:
  - path: hive/references/skill-prelude.md
    relevant_excerpt: |
      Root-first config precedence: the consumer's repo-local `hive.config.yaml` takes
      precedence over the plugin's `hive/hive.config.yaml`. Skills must read both and
      merge with root-wins semantics.
  - path: .pHive/epics/per-epic-branch-pr-flow/docs/design-discussion.md
    relevant_excerpt: |
      Resolution helper at `hive/lib/git_flow.mjs`: reads root-first config, then probes
      `git rev-parse --verify origin/<base>` for `auto`. Returns `{ base_branch, branch_strategy }`.
