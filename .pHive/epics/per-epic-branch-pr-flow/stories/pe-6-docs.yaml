id: pe-6-docs
epic: per-epic-branch-pr-flow
title: README + runbook + CHANGELOG for per-epic flow + version bump
status: pending
complexity: low
methodology: classic
depends_on: [pe-2-bridge-epic-branch, pe-3-workflow-stack-pr, pe-4-pr-ready-on-last, pe-5-plan-emit-base]

description: |
  Final story of the epic. Surfaces the new per-epic flow to consumers in:

    1. `README.md` — extend the "Autonomous worker loop" / "Unattended mode" section
       (added in 2.3.0) with a new sub-bullet describing the per-epic branch + base-branch
       config. One paragraph. Link to runbook for detail.

    2. `hive/references/sandcastle-gh-dispatch.md` — insert a new "Branching model"
       section between sections 2 and 3 covering:
         - Default behavior (`feat/<epic-id>` against `develop` if upstream exists, else `main`).
         - Override knob (`git_flow.default_pr_base` in `hive.config.yaml`).
         - Back-compat path (`branch_strategy: per-story` for legacy epics).
         - Concurrency semantics (epic-scoped, not issue-scoped).
         - PR lifecycle (draft on first story → ready on last shipped).

    3. `CHANGELOG.md` — new dated `## [2.4.0] - <today>` section. Bullets:
         - New `git_flow` config block + `resolveGitFlow` helper (pe-1).
         - Bridge derives branch from `hive:epic:` label (pe-2).
         - Workflow uses per-epic concurrency + PR-stack-or-update (pe-3).
         - Draft PR promotes to ready on last story (pe-4).
         - `/plan` pins resolved git_flow on epic.yaml (pe-5).

    4. `.claude-plugin/plugin.json` + `.claude-plugin/marketplace.json` — bump
       `version` from `2.3.x` to `2.4.0` (minor — additive consumer-visible feature).

    5. `README.md` version badge updated to `2.4.0`.

  This is the LAST commit on the epic branch per the `versioning` cross-cutting concern.

acceptance_criteria:
  - "Given a maintainer reads README.md, when scanning the Autonomous worker / Unattended mode section, then they see the per-epic flow + `git_flow.default_pr_base` knob described in one paragraph with a link to the runbook."
  - "Given a maintainer reads hive/references/sandcastle-gh-dispatch.md, when the Branching model section is rendered, then it covers all five bullets in the description."
  - "Given CHANGELOG.md is rendered, when the new dated `[2.4.0]` section is read, then bullets name each of pe-1 through pe-5 with their consumer-visible behavior."
  - "Given plugin.json + marketplace.json + README badge, when read, then all four version surfaces are EQUAL to `2.4.0`."
  - "Given `git log --oneline main..HEAD`, when run on the epic branch, then this story's commit is the LAST commit (no subsequent commits)."

steps:
  - id: research
    description: |
      Read prior CHANGELOG entries for formatting conventions (recent ones from 2.3.x).
      Read the cross-cutting `versioning` concern's `implementation_checklist` line by line.
    agent: researcher
  - id: implement
    description: |
      Author the five deliverables exactly as described above.
    agent: developer
    depends_on: [research]
  - id: review
    description: |
      Verify implementation_checklist line by line:
        - plugin.json version bumped per semver
        - marketplace.json version matches plugin.json
        - README badge matches
        - CHANGELOG has new dated section with bullets
        - Bump commit is LAST on epic branch (block merge if not)
        - No breaking changes → no migration doc needed
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: |
      Commit. This commit MUST be the last on the epic branch per the versioning concern
      checklist.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive-ui-f
  key_files:
    - path: README.md
      purpose: Sandcastle / Unattended mode section gets a new sub-bullet.
    - path: hive/references/sandcastle-gh-dispatch.md
      purpose: Gains a new Branching model section.
    - path: CHANGELOG.md
      purpose: New 2.4.0 dated section.
    - path: .claude-plugin/plugin.json
      purpose: version bump 2.3.x → 2.4.0.
    - path: .claude-plugin/marketplace.json
      purpose: version mirror.
    - path: .pHive/cross-cutting-concerns.yaml
      purpose: canonical versioning concern checklist this story executes against.

files_to_modify:
  - file: README.md
    change: modify — Sandcastle section + version badge
  - file: hive/references/sandcastle-gh-dispatch.md
    change: modify — add Branching model section
  - file: CHANGELOG.md
    change: modify — new dated 2.4.0 section
  - file: .claude-plugin/plugin.json
    change: modify — version bump (minor)
  - file: .claude-plugin/marketplace.json
    change: modify — version mirror

cross_cutting:
  - concern: versioning
    action: |
      Apply the canonical implementation_checklist from .pHive/cross-cutting-concerns.yaml.
      Bump is MINOR (2.3.x → 2.4.0) per semver — new public config + workflow behavior
      = additive consumer-visible feature. Bump commit MUST be last on epic branch.

metric:
  applies: false
  justification: "Docs + version story; verification is the cross-cutting versioning concern's checklist (covered in step 'review'). No falsifiable runtime metric — README freshness is a process check, not a runtime signal."

risks:
  - severity: low
    description: Version bump collides with another in-flight epic also bumping minor.
    mitigation: Coordinate at integrate time — bump to next minor if conflict (2.4.0 → 2.5.0).

references:
  - path: .pHive/cross-cutting-concerns.yaml
    relevant_excerpt: |
      implementation_checklist:
        - ".claude-plugin/plugin.json version bumped per semver"
        - ".claude-plugin/marketplace.json version bumped to match plugin.json"
        - "README.md version badge updated to match plugin.json"
        - "CHANGELOG.md gains a new dated section for the new version with bullet entries for each consumer-visible change"
        - "Bump commit is the LAST commit on the epic branch"
