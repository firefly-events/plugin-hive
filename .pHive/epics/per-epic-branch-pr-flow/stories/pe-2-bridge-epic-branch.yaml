cross_cutting: []

metric:
  applies: true
  name: epic_branch_correctness_rate
  direction: up
  unit: ratio
  baseline: 0.0
  target: 1.0
  window: next-3-epics
  source:
    kind: events
    ref: bridge-stderr-on-sandcastle-run
  verify_at: integrate
  owner: reviewer
  justification: |
    Each /hive:execute run logs the resolved branchStrategy. Correctness = (runs that used
    feat/<epic-id> on per-epic-labeled issues) / (total per-epic runs). Should be 100% by
    the second epic ships under this flow.

risks:
  - severity: medium
    description: Sandcastle's checkout-or-create logic might force-push or rebase on existing branch.
    mitigation: |
      Verify by reading sandcastle docker.factory branch-handling code in pe-2 research step.
      If sandcastle force-pushes by default, pin to non-destructive mode via run options.

references:
  - path: .pHive/epics/per-epic-branch-pr-flow/docs/design-discussion.md
    relevant_excerpt: |
      const epicId = labels.find(l => l.startsWith('hive:epic:'))?.slice(11);
      const branchName = epicId ? `feat/${epicId}` : `agent/issue-${issueNumber}`;
