    change: modify — derive branch from hive:epic label + dynamic resolveGitFlow import
  - file: skills/sandcastle-gh-init/assets/sandcastle-hive-bridge.example.mts
    change: modify — mirror the .tpl
  - file: skills/sandcastle-gh-init/SKILL.md
    change: modify — describe new derivation in Process §2
  - file: tests/sandcastle-gh-init-assets.test.js
