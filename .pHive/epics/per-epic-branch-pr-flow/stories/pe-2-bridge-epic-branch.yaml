id: pe-2-bridge-epic-branch
epic: per-epic-branch-pr-flow
title: Bridge template — branch name derived from hive:epic label
status: blocked
complexity: low
methodology: classic
depends_on: [pe-1-config-schema]

description: |
  Today the sandcastle bridge hard-codes `branchStrategy: 'agent/issue-<n>'` in the
  `sandcastle.run()` call inside `skills/sandcastle-gh-init/assets/sandcastle-hive-bridge.mts.tpl`.
  This story changes the bridge template so the branch name is derived from the issue's
  `hive:epic:<epic-id>` label when the resolved `branch_strategy` is `per-epic`, falling
  back to the legacy `agent/issue-<n>` only when:
    a) `branch_strategy: per-story` is configured, OR
    b) the issue has no `hive:epic:*` label (un-epic'd one-off issues).

  The bridge reads `hive:epic:<id>` from the labels array already passed into the bridge
  context. Branch name becomes `feat/<epic-id>`. Sandcastle's own checkout-or-create logic
  handles the case where the branch already exists.

  Resolution helper from pe-1-config-schema is invoked via dynamic import inside the
  bridge template so the bridge stays self-contained:

    const { resolveGitFlow } = await import(path.resolve(repoRoot, 'hive/lib/git_flow.mjs'));
    const { branch_strategy } = await resolveGitFlow({ cwd: repoRoot });

acceptance_criteria:
  - "Given a `hive:ready` issue with label `hive:epic:per-epic-branch-pr-flow` and resolved `branch_strategy: per-epic`, when the bridge runs, then sandcastle is invoked with `branchStrategy: 'feat/per-epic-branch-pr-flow'`."
  - "Given a `hive:ready` issue WITHOUT any `hive:epic:*` label, when the bridge runs, then it falls back to `branchStrategy: 'agent/issue-<n>'` regardless of config."
  - "Given resolved `branch_strategy: per-story` (back-compat), when the bridge runs on an issue with `hive:epic:*` label, then it still uses `agent/issue-<n>` and emits a one-line warning that explains why."
  - "Given the example bridge (`sandcastle-hive-bridge.example.mts`) is regenerated to mirror the template, when read on disk, then it shows the new derivation logic with concrete labels."

steps:
  - id: research
    description: |
      Read the current bridge template + example fully. Inspect sandcastle 0.5.x's
      `branchStrategy` field type (`@ai-hero/sandcastle` package) to confirm it accepts
      arbitrary string templates.
    agent: researcher
  - id: implement
    description: |
      1. Edit `skills/sandcastle-gh-init/assets/sandcastle-hive-bridge.mts.tpl`:
         - Add `const epicId = labels.find(l => l.startsWith('hive:epic:'))?.slice(11);`
         - Import `resolveGitFlow` dynamically (path resolved from `repoRoot`).
         - Derive `branchName` from the truth table in the description.
         - Pass `branchName` to `sandcastle.run({ branchStrategy: branchName, ... })`.
      2. Regenerate the `.example.mts` mirror.
      3. Update the SKILL.md "Process" §2 to describe the new derivation (no schema changes — just clarification text).
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Extend `tests/sandcastle-gh-init-assets.test.js` with two cases:
        a) Template substitution yields the dynamic-import line + epicId derivation logic literally.
        b) The .example mirror matches the .tpl after substitution (existing parity test still passes).
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm no shell-injection risk in branch name (epicId is sanitized — `hive:epic:` label values are constrained by /plan).
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: One commit on `feat/per-epic-branch-pr-flow`.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive-ui-f
  key_files:
    - path: skills/sandcastle-gh-init/assets/sandcastle-hive-bridge.mts.tpl
