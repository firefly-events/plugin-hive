id: pe-5-plan-emit-base
epic: per-epic-branch-pr-flow
title: /plan emits git_flow block on epic.yaml at planning time
status: blocked
complexity: low
methodology: classic
depends_on: [pe-1-config-schema]

description: |
  `/plan` step 15 (epic-index write) currently produces an `epic.yaml` without any
  `git_flow` field. This story extends `/plan` to:

    1. Call `resolveGitFlow({ cwd })` from pe-1 once during Phase A (right after kickoff
       gate check passes).
    2. Persist the resolved values into `epic.yaml`:

         git_flow:
           base_branch: develop   # resolved value at plan time
           branch_strategy: per-epic

    3. Update `hive/references/story-yaml-schema.md` + epic-index schema doc to document
       the new field shape.
    4. The bridge (pe-2) and workflow (pe-3) prefer the in-`epic.yaml` value over the
       global config when both are present — pinning at plan time ensures all subsequent
       dispatch runs see the same value even if config drifts.

  This story does NOT change any /plan phase ordering. It just inserts a one-line read
  + a 3-line write into the epic-index emission.

acceptance_criteria:
  - "Given `/plan` runs to completion on a fresh requirement, when the new `epic.yaml` is read, then it contains a top-level `git_flow` block with both `base_branch` and `branch_strategy` set."
  - "Given the resolved `base_branch` is `develop` (origin/develop exists), when `/plan` emits the epic, then `epic.yaml.git_flow.base_branch` is the literal string `develop`."
  - "Given `hive/references/story-yaml-schema.md` is read, when the §epic-index section is rendered, then it includes the `git_flow` block in the canonical template."
  - "Given an existing epic that pre-dates this story is re-planned (epic.yaml already exists), when /plan overwrites the index, then it adds the `git_flow` block if absent (idempotent — does not duplicate)."

steps:
  - id: research
    description: |
      Read `skills/plan/SKILL.md` Phase A (kickoff) and step 15 (epic index write).
      Read `hive/references/story-yaml-schema.md`'s epic-index template.
    agent: researcher
  - id: implement
    description: |
      1. Add a one-line `resolveGitFlow` call in `skills/plan/SKILL.md` Phase A, after
         the kickoff gate but before research dispatch. Store the resolved object on the
         planning context.
      2. Update the epic.yaml template in Phase C step 15 to include the `git_flow` block,
         interpolating the resolved values.
      3. Update `hive/references/story-yaml-schema.md` to document the new field shape.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Add a fixture test under `tests/plan/epic-index-git-flow.test.mjs` (or extend an
      existing plan test) that runs the epic-index emission against a stubbed planning
      context and asserts the new block is present + matches the stubbed resolution.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm idempotency on re-plan.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: One commit on `feat/per-epic-branch-pr-flow`.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive-ui-f
  key_files:
    - path: skills/plan/SKILL.md
      purpose: Edit Phase A + step 15.
    - path: hive/references/story-yaml-schema.md
      purpose: Document the new epic.yaml field.
    - path: hive/lib/git_flow.mjs
      purpose: Resolution helper from pe-1.

files_to_modify:
  - file: skills/plan/SKILL.md
    change: modify — call resolveGitFlow in Phase A; emit git_flow block in step 15
  - file: hive/references/story-yaml-schema.md
    change: modify — document git_flow block on epic.yaml
  - file: tests/plan/epic-index-git-flow.test.mjs
    change: new file — fixture test

cross_cutting: []

metric:
  applies: false
  justification: "Pure planner-prompt edit + schema doc; correctness is verified by the fixture test alone. Downstream consumption is metric'd by pe-2 (epic_branch_correctness_rate) and pe-3 (prs_opened_per_epic)."

risks:
  - severity: low
    description: Existing epics without `git_flow` block silently fall through to global config.
    mitigation: That's the intended back-compat behavior. Documented in acceptance criterion #4.

references:
  - path: skills/plan/SKILL.md
    relevant_excerpt: |
      15. Write the epic index. Produce `.pHive/epics/{epic-id}/epic.yaml` as a lightweight
          index referencing the stories.
  - path: .pHive/epics/per-epic-branch-pr-flow/docs/design-discussion.md
    relevant_excerpt: |
      Sandcastle bridge reads epic.yaml when present (preferred over global config).
      Falls back to global config if epic was created before this story shipped.
