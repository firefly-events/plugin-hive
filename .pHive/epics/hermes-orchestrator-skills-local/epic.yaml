name: hermes-orchestrator-skills-local
title: Hermes Orchestrator Skills — local plugin-hive subset
description: |
  Local-execution subset of hermes-orchestrator-skills. The 8 plugin-hive-side
  stories (canonical runbook sources + contract). Excludes h-01 (hermes recon)
  and h-10 (Studio native-format port) per "skip local hermes" — those run on Studio.
  Canonical epic remains hermes-orchestrator-skills (source of truth).
target_codebase: /Users/don/Documents/plugin-hive
methodology: classic
version_bump: none
git_flow:
  base_branch: develop
  branch_strategy: per-epic
stories:
  - {id: h-02-multica-mcp-surface, title: Confirm or expose the multica_* MCP tool surface over cli.mjs, complexity: medium, depends_on: []}
  - {id: h-03-gate-state-latch, title: Harden the gate_state pre_approved latch + epic-of-record pointer, complexity: medium, depends_on: []}
  - {id: h-06-slack-notify-await, title: Slack notify-and-await human-gate transport, complexity: high, depends_on: []}
  - {id: h-04-monitor-epic-skill, title: Author the monitor-epic orchestrator skill, complexity: medium, depends_on: [h-02-multica-mcp-surface]}
  - {id: h-05-reconcile-tick-skill, title: Formalize reconcile-tick from the cycle-reconciler runbook, complexity: high, depends_on: [h-02-multica-mcp-surface, h-03-gate-state-latch]}
  - {id: h-07-kickoff-exec-skill, title: Author the kickoff-exec skill, complexity: medium, depends_on: [h-05-reconcile-tick-skill, h-06-slack-notify-await]}
  - {id: h-08-kickoff-plan-skill, title: Author the kickoff-plan skill, complexity: medium, depends_on: [h-06-slack-notify-await]}
  - {id: h-09-watch-cron-skill, title: Author the watch-cron skill, complexity: low, depends_on: [h-06-slack-notify-await]}
