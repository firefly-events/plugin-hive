id: h-05-reconcile-tick-skill
epic: hermes-orchestrator-skills-local
title: Formalize reconcile-tick from the cycle-reconciler runbook
status: pending
complexity: high
methodology: classic
side: plugin-hive
depends_on: [h-02-multica-mcp-surface, h-03-gate-state-latch]

description: |
  The advance core — already ~80% built as cycle-reconciler.md. Formalize it as the
  canonical reconcile-tick skill source: one tick reads state, picks an action by
  phase position (pending -> dispatch impl; impl_terminal -> dispatch review;
  review_terminal -> evaluate verdict; etc.), then persists via write-state.

  Three lessons baked in (from memory + the runbook):
  - Watchdog: dispatched_at drives stuck-detection; never write placeholder
    timestamps — omit if no clock (Hermes has no shell clock; uses cron Run Time).
  - Verify, don't trust: agents over-claim "pushed"; reconcile checks ff-merge,
    not the agent's word.
  - Human gate at review_terminal: do NOT auto-advance to done or auto-loop a
    revision. Call a pluggable surface-verdict hook (stubbed here; h-06 provides
    the Slack impl) and HALT, setting gate_state to awaiting per h-03.

  Refuses to advance unless gate_state == pre_approved (h-03).

acceptance_criteria:
  - "Given gate_state != pre_approved, when a tick runs, then it advances nothing and reports not-approved."
  - "Given phase pending + pre_approved, when a tick runs, then it dispatches impl, writes dispatched_at from the real Run Time (or omits it), and persists via write-state."
  - "Given impl_terminal, when a tick runs, then it dispatches review."
  - "Given review_terminal, when a tick runs, then it calls the surface-verdict hook and HALTS (no auto-done, no auto-revision); gate_state moves to awaiting."
  - "Given an agent that claims pushed, when reconciling, then the tick verifies via ff-merge and does not mark done on the claim alone."
  - "Given a stuck in-flight task past the watchdog, when a tick runs, then rescue/reassign logic fires per the runbook."
  - "Given any state change, when persisted, then it uses write-state only (no direct YAML)."

steps:
  - id: research
    description: Read cycle-reconciler.md end-to-end + state.mjs; identify the verdict branch and watchdog logic to formalize.
    agent: researcher
  - id: implement
    description: Write hive/references/orchestrator-skills/reconcile-tick.md as the canonical tick skill, with a named surface-verdict hook seam for h-06.
    agent: developer
    depends_on: [research]
  - id: test
    description: Tests for each phase transition, the not-approved refusal, the review_terminal halt, the ff-merge verify, and the watchdog rescue.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm no auto-advance past review_terminal; watchdog timestamp rule honored; write-state-only.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit on feat/hermes-orchestrator-skills.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: hive/references/cycle-reconciler.md
      purpose: The source runbook — 7-position machine, state fields, watchdog, write-state contract.
    - path: hive/lib/multica-story-dispatch/cli.mjs
      purpose: dispatch/poll/episode/comment/write-state/reconcile subcommands.

risks:
  - severity: high
    description: Auto-advancing past review_terminal would silently remove the human review gate — the core north-star violation.
    mitigation: The halt is asserted by test; the verdict hook is a hard stop, not a notification-and-continue.
  - severity: medium
    description: Placeholder dispatched_at silently breaks rescue.
    mitigation: Honor "omit if no clock" verbatim; test rejects placeholder writes.

references:
  - path: hive/references/cycle-reconciler.md
    relevant_excerpt: |
      "A dispatch is not durable until you have called multica_write_state."
      dispatched_at is the watchdog's stuck-detection timer; a midnight/stub
      value silently breaks rescue.
