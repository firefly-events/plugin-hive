description: |
  The health watch. watch-cron monitors the RemoteTrigger routines (meta nightly,
  autonomous standup loop) and multica daemon status, surfacing failures/stalls via
  the h-06 Slack surface. Read-only + alerting only — it does not restart or mutate.

  Carries the memory-known caveats: meta nightly is a RemoteTrigger routine (not a
  repo workflow) and must read open PRs + target develop; the Studio daemon needs a
  GUI Aqua session to read Keychain, so "daemon down" may mean "session lost" not
  "crashed" — surface that distinction.

acceptance_criteria:
  - "Given the routines + daemon, when watch-cron runs, then it reports each routine's last-run status + daemon health."
  - "Given a failed/stalled routine or a down daemon, when detected, then it alerts via the Slack surface (no auto-restart)."
  - "Given a daemon that is down, when reported, then the alert distinguishes 'session/Keychain lost' from 'process crashed' where determinable."
  - "Given healthy state, when run, then it is quiet (no noise alerts)."

