id: h-08-kickoff-plan-skill
epic: hermes-orchestrator-skills-local
title: Author the kickoff-plan skill (start /plan, route gates to human)
status: pending
complexity: medium
methodology: classic
side: plugin-hive
depends_on: [h-06-slack-notify-await]

description: |
  The planning trigger. kickoff-plan starts /plan in multica mode for a fresh
  requirement. Hermes' role is to START it and route the human to the gates — it does
  NOT answer design questions, does NOT sign off, and never auto-advances a planning
  gate (Multica/Workflow completion is artifact-readiness, never approval; existing
  /plan invariant). Output is a planned epic, still gate_state null until a human
  approves it (which then enables kickoff-exec).

  Hermes never mints stories directly — kickoff-plan is the ONLY way it puts new work
  into being, and every planning gate stays human-owned (surfaced via the h-06
  Slack notify-await surface).

acceptance_criteria:
  - "Given a requirement, when kickoff-plan runs, then it starts /plan in multica mode and surfaces each planning gate (design review, H/V, outline sign-off, confirm) to the human via Slack notify-await."
  - "Given a planning gate, when reached, then Hermes pauses and never auto-advances on Multica/Workflow completion alone."
  - "Given /plan completes, when the epic is produced, then gate_state remains null (not pre_approved) until a separate human approval action."
  - "Given Hermes, when running normally, then there is NO path by which it creates a story or epic without going through this gated /plan flow (or /triage --hand-off)."

steps:
  - id: research
    description: Map /plan multica-mode gate points to the Slack notify-await surface; confirm no auto-advance seam exists.
    agent: researcher
  - id: implement
    description: Write hive/references/orchestrator-skills/kickoff-plan.md — start /plan, route gates to human, leave gate_state null on completion.
    agent: developer
    depends_on: [research]
  - id: test
    description: Tests for gate-surfacing, no-auto-advance, and gate_state-stays-null-post-plan.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm planning gates stay human-owned; no story-minting side channel.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit on feat/hermes-orchestrator-skills.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: skills/plan/SKILL.md
      purpose: The /plan flow + its gate-ownership invariant (gates always local to orchestrator; completion != sign-off).

risks:
  - severity: high
    description: Auto-advancing a planning gate would let Hermes plan + approve work unsupervised.
    mitigation: Gate-ownership invariant preserved; Slack notify-await surfaces each gate; tested.

references:
  - path: skills/plan/SKILL.md
    relevant_excerpt: |
      Gate ownership invariant: Multica-dispatched planning may produce artifacts
      but never advances user review/sign-off gates.
