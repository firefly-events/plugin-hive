id: hg-1-destructive-command-catalog
epic: hermes-guardrails-mvp
title: Destructive-command catalog YAML + loader library
complexity: low
methodology: classic
depends_on: []

parallel_allowed: true
parallel_rationale: bounded-slice

description: |
  Ship the single source of truth that an LLM-agent on-call surface (Hermes,
  Claude Code session, OpenCode) reads to decide which Hive commands require
  human confirmation before invocation. The catalog covers every /hive:*
  skill currently shipped; adding a new skill in the future = one YAML
  entry, no policy drift across agent adapters.

  Two artifacts:
    - hive/references/destructive-commands.yaml — data
    - hive/lib/destructive-commands.mjs — loader library

  The loader exposes a small synchronous API the agent backend can import
  or call out to via shell/Node. The YAML is a flat array; no nesting,
  no inheritance, no aliases — adapter consumers should not need to
  resolve indirection to know whether `/hive:execute` requires confirmation.

acceptance_criteria:
  - "Given hive/references/destructive-commands.yaml is shipped, when an LLM-agent on-call surface reads it, then every shipped /hive:* skill appears exactly once with {name, destructive, confirm_required, summary} fields populated."
  - "Given hive/lib/destructive-commands.mjs is shipped, when a consumer calls `getCommand('hive:execute')`, then it returns the matching catalog entry; when a consumer calls `getCommand('hive:does-not-exist')`, then it returns null without throwing."
  - "Given the loader is shipped, when a consumer calls `listDestructive()`, then it returns the subset where `destructive: true` (auto-fire safety check)."
  - "Given the loader is shipped, when a consumer calls `isDestructive('hive:status')`, then it returns false; when called with `isDestructive('hive:execute')`, then it returns true."
  - "Given the YAML is malformed (invalid YAML, missing required fields), when the loader is imported, then it throws a structured `CatalogLoadError` naming the bad entry — fail-loud at load time so adapter consumers fail-fast."
  - "Given a unit test suite ships at hive/lib/destructive-commands.test.mjs, when the test runner executes it, then all assertions pass (loader returns expected entries for known fixtures, throws on malformed YAML, listReadOnly/listDestructive partition correctly)."

steps:
  - id: research
    description: |
      Inventory every shipped /hive:* skill by scanning skills/hive/skills/
      and skills/. List each with read-only-vs-mutating classification.
      Confirm the loader pattern fits with existing hive/lib/ conventions
      (synchronous import-on-load, YAML via js-yaml, error class shape).
    agent: researcher
  - id: implement
    description: |
      Write hive/references/destructive-commands.yaml with one entry per
      shipped /hive:* skill (researcher's inventory). Write
      hive/lib/destructive-commands.mjs implementing
      {getCommand, isDestructive, listDestructive, listReadOnly} and
      CatalogLoadError. Eager-load + validate on import; cache the
      parsed structure for the process lifetime.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Write hive/lib/destructive-commands.test.mjs covering all six AC
      bullet points. Use node:test or the existing convention in
      sibling test files. Verify it passes via `node --test`.
    agent: tester
    depends_on: [implement]
  - id: review
    description: |
      Audit the YAML for completeness against the current skills/ tree
      (no missing commands, no fabricated ones). Audit the loader for
      defensive parsing, structured error shape, and synchronous-load
      semantics. Audit tests for AC coverage.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: |
      Stage + commit both artifacts + test file as one orchestrator-attributed
      commit on feat/hermes-guardrails-mvp. Do not push if the executor is
      cc-workflows mode — orchestrator owns reconcile.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  tech_stack:
    runtime: Node.js (ESM)
    test_runner: node --test (built-in)
    yaml_parser: js-yaml (already in repo)
  key_files:
    - path: skills/hive/skills/
      purpose: Source of truth for which /hive:* skills exist; the catalog must list every one
    - path: hive/lib/
      purpose: Pattern reference for synchronous-load library shape

files_to_modify:
  - file: hive/references/destructive-commands.yaml
    change: Create catalog data
  - file: hive/lib/destructive-commands.mjs
    change: Create loader library
  - file: hive/lib/destructive-commands.test.mjs
    change: Create unit tests

code_examples:
  - title: Eager-load + cache pattern (sibling library)
    file: hive/lib/task-tracking-dispatch/index.ts
    snippet: |
      // The loader pattern in this sibling: parse config once at construction,
      // cache the resolved adapter for the instance lifetime, raise structured
      // errors on malformed input. destructive-commands.mjs should mirror
      // this shape but in JS (.mjs) and as a module-singleton (not class).

design_decisions:
  - decision: YAML over JSON for the catalog
    rationale: Comments + multi-line summaries are common in catalog entries
  - decision: Synchronous load + cache for life of process
    rationale: Catalog is small (~15 entries), bounded; sync load eliminates an async surface from every consumer

cross_cutting: []

metric:
  applies: false
  justification: |
    Substrate-data story (catalog YAML + thin loader); the observable
    surface is downstream — whether the LLM-agent on-call surface honors
    the catalog when routing chat to Hive commands. That metric is owned
    by the Hermes-side follow-up planning, not by this Hive-side ship.

risks:
  - severity: low
    description: Catalog drifts when a new /hive:* skill ships without a catalog entry
    mitigation: Add a CI lint (deferred — separate story or follow-up) that diffs catalog entries vs `skills/hive/skills/*/SKILL.md` glob

references:
  - path: skills/hive/skills/
    relevant_excerpt: |
      Source of truth for the skill set the catalog must cover. Each
      subdirectory's SKILL.md frontmatter `name:` field maps to a catalog
      entry's `name:` field.
