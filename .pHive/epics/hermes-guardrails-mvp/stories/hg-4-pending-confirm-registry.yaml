code_examples:
  - title: Atomic write-then-rename pattern (sibling)
    file: hive/lib/multica-issue-closer.mjs
    snippet: |
      // Read the sibling closer's commit-state write semantics. For
      // pending-confirm, mirror the write-to-tmp + fs.renameSync pattern
      // to keep individual YAML files atomic across crash points.

design_decisions:
  - decision: One YAML file per pending entry (not a single registry file)
    rationale: Atomic register/resolve/expire per entry; no whole-file rewrites; readers can list lazily via fs.readdir
  - decision: Default expires_at is 5 minutes if caller omits
    rationale: Long-running confirmation is a UX failure on the agent surface; 5 min is a sane upper bound for human-attended confirms (per design discussion open question 2)
  - decision: register returns the resolved id (not just side-effects on disk)
    rationale: Caller needs the id to seed the thread reaction watcher

cross_cutting: []

metric:
  applies: false
  justification: |
    Substrate-state story; metric for confirm-flow latency and
    cancel-rate lives on the chat side, owned by the Hermes follow-up
    planning that consumes this surface.

risks:
  - severity: medium
    description: Two concurrent resolve() for the same id (e.g. user reacts ✅ and Hermes also resolves via timeout)
    mitigation: resolve() reads, validates status==pending, then writes; if the read shows non-pending, throw PendingAlreadyResolvedError without writing
  - severity: low
    description: Registry dir grows without bound (resolved entries pile up)
    mitigation: list({status: 'resolved', older_than: <ts>}) + cleanup is a deferred housekeeping skill — not blocking this MVP

references:
  - path: hive/references/episode-schema.md
    relevant_excerpt: |
      File-on-disk YAML schema documentation pattern. Use the same
      heading structure and example block in the pending-confirm
      schema section of the library docstring.
