id: hg-2-run-status-event-stream
epic: hermes-guardrails-mvp
title: Run-status JSONL event stream + episode-marker shim
complexity: medium
methodology: classic
depends_on: []

parallel_allowed: true
parallel_rationale: bounded-slice

description: |
  When a workflow runs, expose its progress as appendable JSONL the LLM-agent
  on-call surface can tail (tail -f semantics) to edit its Slack/Discord
  message as the run progresses. One per-run file at
  ${HIVE_STATE_DIR}/triggers/runs/<run-id>.jsonl with one event per terminal
  phase boundary (run_started, story_dispatched, story_completed,
  run_completed). The shim mirrors every episode-marker write into a single
  per-run JSONL stream so consumers don't have to scan many per-story
  marker dirs.

  Two artifacts:
    - hive/lib/run-status-stream.mjs — emitter library (appendEvent,
      tailEvents, closeRun)
    - hive/lib/run-status-stream.test.mjs — unit tests

  No changes to existing episode-marker writes — the shim sits ALONGSIDE,
  not in front. Existing /execute substrate writes continue unchanged;
  this story adds a parallel emit surface for chat consumers.

acceptance_criteria:
  - "Given hive/lib/run-status-stream.mjs is shipped, when a consumer calls `appendEvent({run_id, event_type, story_id, payload})`, then one line of valid JSON is appended to ${HIVE_STATE_DIR}/triggers/runs/<run-id>.jsonl with idempotency key `<run_id>:<story_id>:<event_type>`."
  - "Given duplicate appendEvent calls (same idempotency key), when the second call fires, then no second line is written and the function returns the existing event timestamp — appends are idempotent on the documented key shape."
  - "Given a consumer calls `tailEvents({run_id})`, when it iterates, then it yields every line in the per-run JSONL in insertion order, parsing each as JSON; malformed lines are skipped with a warning, not thrown."
  - "Given a consumer calls `closeRun({run_id, verdict})`, when it returns, then a final `run_completed` event is appended with the verdict and the file is marked terminal (subsequent appendEvent calls for that run_id throw `RunAlreadyClosedError`)."
  - "Given the unit test suite at hive/lib/run-status-stream.test.mjs is run, when the runner executes it, then all assertions pass (append idempotency, tail ordering, malformed-line tolerance, close-run terminal semantics)."

steps:
  - id: research
    description: |
      Read hive/references/episode-schema.md and the existing episode-marker
      write call sites in skills/hive/skills/execute-mode-*. Confirm the
      event vocabulary (story_dispatched, story_completed, etc.) maps to
      the substrate's existing terminal-state names. Decide whether the
      shim composes with the existing emit sites or sits standalone — the
      design discussion specifies standalone, but verify there's no
      contradicting existing emit pattern.
    agent: researcher
  - id: implement
    description: |
      Write hive/lib/run-status-stream.mjs with {appendEvent, tailEvents,
      closeRun, RunAlreadyClosedError}. Use Node fs.appendFileSync for
      synchronous appends (one line of JSON.stringify per event +
      newline). Use a per-run sidecar `<run-id>.closed.marker` to track
      terminal state. Idempotency key check reads the existing file once
      and scans for the key before appending; tolerate large files via
      streaming if needed.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Write hive/lib/run-status-stream.test.mjs covering all five AC
      bullet points. Use a tmp dir as ${HIVE_STATE_DIR} fixture; clean up
      after each test. Verify tail-events yields in insertion order even
      when multiple appendEvent calls interleave on the same run_id.
    agent: tester
    depends_on: [implement]
  - id: review
    description: |
      Audit append idempotency for race condition holes (two appendEvent
      calls with the same key at the same time). Audit tail's malformed-
      line tolerance for log-poisoning vectors. Confirm closeRun's
      terminal-state marker survives crashes (file-on-disk, not in-memory).
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: |
      Stage + commit both artifacts as one orchestrator-attributed commit
      on feat/hermes-guardrails-mvp.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  tech_stack:
    runtime: Node.js (ESM)
    test_runner: node --test
  key_files:
    - path: hive/references/episode-schema.md
      purpose: Source of event vocabulary (story_dispatched, story_completed, etc.)
    - path: skills/hive/skills/execute-mode-multica/SKILL.md
      purpose: Existing episode-marker write call site — reference for emit-point semantics
    - path: skills/hive/skills/execute-mode-cc-workflows/SKILL.md
      purpose: New substrate that will emit events at the same phase boundaries

files_to_modify:
  - file: hive/lib/run-status-stream.mjs
    change: Create emitter library
  - file: hive/lib/run-status-stream.test.mjs
    change: Create unit tests

code_examples:
  - title: Sibling JSONL write pattern (existing)
    file: hive/lib/scope_drift.py
    snippet: |
      # Python sibling that emits JSONL events to a metrics dir; the
      # write semantics are the same (one line of JSON per event,
      # atomic-on-append via the OS's append guarantees). This story's
      # JS implementation should mirror those semantics in fs.appendFileSync.

design_decisions:
  - decision: Per-run file at .pHive/triggers/runs/<run-id>.jsonl
    rationale: One file per run = easy tail for the chat consumer; no scanning many marker dirs
  - decision: Idempotency key <run_id>:<story_id>:<event_type>
    rationale: Episode-marker re-emits during retries should not duplicate run-status events; the key reflects the smallest semantic unit
  - decision: RunAlreadyClosedError on post-close appends
    rationale: Fail-loud is better than silent log corruption; orchestrator bugs that write past close should surface

cross_cutting: []

metric:
  applies: false
  justification: |
    Substrate-emit story; the observable surface is the chat-side latency
    from event-emit to user-visible message edit, which is downstream of
    Hive in the Hermes adapter layer. Metric belongs to the Hermes follow-up.

risks:
  - severity: medium
    description: appendEvent race between two concurrent /execute calls for the same run_id
    mitigation: Document that run_id is globally unique (UUID/timestamp slug) per /execute invocation; no two executes share a run_id
  - severity: low
    description: tail consumer reads a partial line written mid-append
    mitigation: appendEvent writes complete `JSON.stringify(event) + '\n'` in one fs.appendFileSync call; POSIX append is atomic for writes under PIPE_BUF (~4KB) which our events comfortably fit

references:
  - path: hive/references/episode-schema.md
    relevant_excerpt: |
      Existing schema for per-story episode markers. This story does NOT
      change the marker format — it adds a parallel per-run JSONL stream
      that mirrors marker writes into a tail-friendly shape for chat
      consumers.
