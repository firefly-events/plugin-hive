id: se-2-design-top-level
epic: skill-ergo-may2026
title: New top-level /design skill for UI/wireframe design ceremony
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  Add new top-level skill `skills/design/SKILL.md` with `name: design`.
  Scope clarified by user answer #4: this is for **UI design work**
  (wireframes, screen layouts, component design) — NOT design-discussion
  authoring.

  Composes existing pieces: brand-system context, wireframe-protocol,
  ui-designer agent persona, design-review handoff. Callable outside
  /plan for ad-hoc UI exploration, mid-execution redesign, polish passes.

  Inputs: a brief describing the UI work needed (screen, component, flow,
  marketing surface). Outputs: wireframe artifacts under
  .pHive/design/<topic>/ + a design-review handoff record.

acceptance_criteria:
  - "Given a brief like 'design the event detail screen', when /design runs, then it produces wireframes at .pHive/design/<topic>/ and emits a design-review handoff record."
  - "Given /design is invoked outside /plan or /execute, when it runs, then it does not require prior planning context (works standalone)."
  - "Given /design is invoked from inside /plan Phase B, when the existing UI-detection path fires, then /plan delegates to /design via Skill (atomic external call, not inline prose)."
  - "Given the produced wireframes, when /design-review is invoked next, then it consumes the handoff record cleanly."

steps:
  - id: research
    description: Inventory existing UI ceremony pieces (wireframe-protocol, ui-designer agent, brand-system context, design-review skill)
    agent: researcher
  - id: implement
    description: Write skills/design/SKILL.md composing the existing pieces; update /plan Phase B to delegate via Skill call
    agent: technical-writer
    depends_on: [research]
  - id: test
    description: tests/design-skill-flow.test.js — exercise standalone invocation + /plan-delegated invocation
    agent: tester
    depends_on: [implement]
  - id: review
    description: Verify atomic boundary — /plan calls /design via Skill, not inline prose
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: hive/references/wireframe-protocol.md
      purpose: Wireframe touchpoints and approval protocol; /design wraps these
    - path: hive/agents/ui-designer.md
      purpose: Persona /design dispatches to
    - path: skills/design-review/SKILL.md
      purpose: Downstream handoff target
    - path: skills/brand-system/SKILL.md
      purpose: Brand context the wireframes consume
    - path: skills/plan/SKILL.md
      purpose: Phase B UI-detection delegates to /design

files_to_modify:
  - file: skills/design/SKILL.md
    change: NEW — top-level UI design ceremony
  - file: skills/plan/SKILL.md
    change: Phase B step 11 (UI detection) delegates to /design via Skill (atomic external call)
  - file: tests/design-skill-flow.test.js
    change: NEW — standalone + delegated flows

design_decisions:
  - decision: /design scope is UI design work (per user clarification), NOT design-discussion authoring
    rationale: User answer #4 explicit; avoids confusion with /plan's internal design-discussion phase
  - decision: Atomic external call from /plan, not inline prose
    rationale: Same pattern as planning-routing, grill — keeps /plan delegating, not duplicating

cross_cutting:
  - concern: documentation
    action: README — add /design to skill catalog; update wireframe-protocol.md to note /design as canonical entry point
  - concern: versioning
    action: Consumer-visible new skill — bump minor version per semver

metric:
  applies: true
  name: design_skill_standalone_invocation_rate
  direction: up
  unit: count_per_month
  baseline: 0
  target: 3
  window: 2026-07
  source:
    kind: manual
    ref: "Count /design invocations outside /plan context in maintainer's usage logs"
  verify_at: 2026-07-31T00:00:00Z
  owner: orchestrator
  notes: |
    Validates the "callable outside /plan" goal. If standalone usage stays at 0, the promotion didn't deliver real ergonomic value and we revisit scope.

risks:
  - severity: medium
    description: Trigger collision with design-review / design-system skills
    mitigation: se-3 (disambiguation) gates execution completion of this story
  - severity: low
    description: /plan delegation drifts to inline-prose copy of /design
    rationale: Atomic boundary noted explicitly in review step
