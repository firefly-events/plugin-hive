id: se-4-signal-mining
external_id: 145
tracker_id: "firefly-events/plugin-hive#145"
tracker_url: https://github.com/firefly-events/plugin-hive/issues/145
epic: skill-ergo-may2026
title: Skill-candidate signal mining — extract recurring patterns
status: pending
complexity: medium
methodology: classic
depends_on: [ed-1-maturity-helper]

description: |
  New module `hive/lib/skill_candidate_mine.py` reads four signal sources and
  emits a normalized list of pattern observations (not yet ranked — that's
  se-5):

  - `.pHive/metrics/events/*.jsonl` — recurring event/phase sequences
  - `.pHive/kg.sqlite` — recurring decision shapes (subject/predicate patterns)
  - `git log` (last 200 commits) — recurring commit subject/body patterns
  - `.pHive/cycle-state/*.yaml` — recurring escalation/decision shapes across epics

  Each pattern observation: {pattern_signature, occurrence_count,
  recent_examples[<= 3], source_kind, first_seen, last_seen}.

  Maturity gate: skips with one-line log if project_maturity ∈
  {greenfield, early} per ed-1 helper.

acceptance_criteria:
  - "Given an established project with 50+ metric events and 30+ commits, when mine() runs, then it returns ≥ 5 pattern observations with non-empty fields."
  - "Given a greenfield project, when mine() runs, then it logs 'skip: greenfield maturity' and returns []."
  - "Given a malformed event row, when mine() runs, then it skips the row with a warning, no crash."
  - "Given the same project state and a repeat run, when mine() runs twice, then results are deterministic (same signatures, same counts)."

steps:
  - id: research
    description: Sample data — read 10 recent stop-*.jsonl + 50 recent commits + kg.sqlite top 100 triples to characterize pattern shapes
    agent: researcher
  - id: implement
    description: Write skill_candidate_mine.py; add 4 source readers; emit observation list
    agent: developer
    depends_on: [research]
  - id: test
    description: tests/skill-candidate-mining.test.js — fixture-based; covers 4 AC + determinism
    agent: tester
    depends_on: [implement]
  - id: review
    description: Verify maturity-gate path + determinism path; review pattern signature shape for stability
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: hive/lib/project_maturity.py
      purpose: From ed-1 — gate the mining
    - path: hive/lib/metrics/core.py
      purpose: Event row shape — informs JSONL reader
    - path: .pHive/cycle-state
      purpose: Per-epic state files; pattern source
    - path: .pHive/kg.sqlite
      purpose: KG triples; pattern source

files_to_modify:
  - file: hive/lib/skill_candidate_mine.py
    change: NEW — signal-mining module with 4 source readers
  - file: tests/skill-candidate-mining.test.js
    change: NEW — fixture coverage

design_decisions:
  - decision: Module is observation-only — ranking and handoff live in se-5
    rationale: Separates concerns; se-4 is testable in isolation; se-5 can be re-run on cached observations
  - decision: Last 200 commits, not full git history
    rationale: Performance bound; recent patterns matter more for skill candidates
  - decision: Deterministic output required
    rationale: Lets se-5 rank against a stable observation set

cross_cutting:
  - concern: documentation
    action: Add hive/references/skill-candidate-mining.md describing the signal sources and pattern signature shape

metric:
  applies: true
  name: skill_candidate_mining_signal_count
  direction: up
  unit: count
  baseline: 0
  target: 5
  window: integrate
  source:
    kind: manual
    ref: "Run mine() against plugin-hive itself; count returned observations"
  verify_at: integrate
  owner: tester
  notes: |
    Sanity check — if mining returns 0 observations against plugin-hive (a substrate with 6 months of activity), the readers are broken. Target 5+ confirms the readers function.

risks:
  - severity: medium
    description: Pattern signatures are unstable across runs (e.g., timestamp-leaking into signature)
    mitigation: Determinism is an AC; review step verifies; tests cover the deterministic path
  - severity: low
    description: KG sqlite may be absent on some projects
    mitigation: Reader silent-on-absence — skip with log, no crash
