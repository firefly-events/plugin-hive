id: ed-1-maturity-helper
epic: exec-discipline-may2026
title: Project-maturity helper + project-profile field
status: pending
complexity: low
methodology: classic
depends_on: []

description: |
  Add a single source of truth for project maturity classification. New helper
  module `hive/lib/project_maturity.py` reads `project_maturity` from
  `.pHive/project-profile.yaml` and returns one of {greenfield, early,
  established, mature}. Defaults to `early` when profile is placeholder
  (matches today's gate_mode: warning posture).

  Downstream consumers: drift-score (ed-3), candidate-detect (se-4), and a
  future #80 retry. Single helper avoids replicating the classification
  inline in every consumer.

acceptance_criteria:
  - "Given a project-profile.yaml with project_maturity: established, when resolve_maturity() is called, then it returns 'established'."
  - "Given a placeholder project-profile.yaml (placeholder: true), when resolve_maturity() is called, then it returns 'early' with no error."
  - "Given a missing project-profile.yaml, when resolve_maturity() is called, then it returns 'early' with a logged warning (no crash)."
  - "Given an invalid project_maturity value, when resolve_maturity() is called, then it raises ValueError naming the allowed set."

steps:
  - id: research
    description: Confirm project-profile.yaml schema location and existing fields
    agent: researcher
  - id: implement
    description: Write hive/lib/project_maturity.py with resolve_maturity() + classification helper
    agent: developer
    depends_on: [research]
  - id: test
