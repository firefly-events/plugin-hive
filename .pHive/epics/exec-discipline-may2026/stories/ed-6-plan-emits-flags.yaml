id: ed-6-plan-emits-flags
external_id: 140
tracker_id: "firefly-events/plugin-hive#140"
tracker_url: https://github.com/firefly-events/plugin-hive/issues/140
epic: exec-discipline-may2026
title: /plan Phase C emits parallel flags per story
status: blocked
complexity: medium
methodology: classic
depends_on: [ed-5-story-schema-parallel]

description: |
  Update /plan Phase C step 13 (story write) to emit parallel_allowed +
  parallel_rationale per story when the planner intends parallel
  dispatch. Default is omit (serial). When emitting parallel for
  read-only stories (research, audit, validation), use
  `parallel_rationale: read-only`. When emitting for variation
  generation (UI A/B, approach alternates), use `variation`. When
  emitting for genuinely-independent slices, use `bounded-slice` and
  emit declared `files_to_modify` touch-sets that ed-7 can lint as
  disjoint.

acceptance_criteria:
  - "Given /plan generates 5 stories where 3 are independent slices, when stories are written, then those 3 carry parallel_allowed: true + parallel_rationale: bounded-slice + non-empty files_to_modify."
  - "Given /plan generates a research story, when written, then it carries parallel_allowed: true + parallel_rationale: read-only."
  - "Given /plan generates a default serial story, when written, then neither field appears (omit = serial)."
  - "Given confirmation output (Phase C step 18), when rendered, then the dependency graph annotates parallel-eligible stories with their rationale."

steps:
  - id: research
    description: Inventory current /plan Phase C step 13 logic; identify where to inject flag emission
    agent: researcher
  - id: implement
    description: Update skills/plan/SKILL.md step 13 narrative + add a worked example showing each rationale
    agent: technical-writer
    depends_on: [research]
  - id: review
    description: Verify the new emission rules don't break existing story-write contracts
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: skills/plan/SKILL.md
      purpose: Phase C step 13 is the story-write step that gains the new emit logic

files_to_modify:
  - file: skills/plan/SKILL.md
    change: Update step 13 with parallel flag emission rules + worked example
  - file: hive/references/agent-ready-checklist.md
    change: "Add check that parallel_allowed: true stories carry valid rationale"

design_decisions:
  - decision: bounded-slice requires non-empty files_to_modify
    rationale: ed-7's lint can only check disjointness if there's a touch-set declared

cross_cutting:
  - concern: documentation
    action: Update agent-ready-checklist.md to include parallel-rationale check (item 10 or merge into existing item)

metric:
  applies: true
  name: parallel_rationale_emission_rate
  direction: up
  unit: ratio
  baseline: 0.0
  target: 1.0
  window: next-3-plan-runs
  source:
    kind: manual
    ref: "Inspect produced stories under .pHive/epics/<id>/stories/ for parallel_allowed/parallel_rationale fields"
  verify_at: review
  owner: reviewer
  notes: |
    Coverage = (stories with parallel_allowed: true that also carry valid parallel_rationale) / (stories with parallel_allowed: true). Target 1.0 means no parallel story slips the gate without rationale.

risks:
  - severity: low
    description: Planner forgets to emit for some story types
    mitigation: ed-7 (execute gate) refuses dispatch; loop is closed
