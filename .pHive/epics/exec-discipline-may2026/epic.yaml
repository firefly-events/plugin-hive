name: exec-discipline-may2026
title: Execution discipline — drift score + strict parallel gate
description: |
  Substrate improvements that quantify and enforce execution discipline:
  scope-drift metric at every phase boundary (#131) and default-serial
  parallel-dispatch contract with bounded-slice gate (#132). Closes #80
  conceptually via a shared maturity-helper consumed by both this epic
  and the future #80 retry.
target_codebase: /Users/don/Documents/plugin-hive
methodology: classic
methodology_rationale: |
  Auto-detect would resolve tdd (tests/*.test.* present). Overridden to
  classic because most stories edit skill prompts + schema docs where
  test-first doesn't apply uniformly. Helper-code stories (drift, maturity)
  still ship with tests in the classic 'test' step.

source_issues:
  - "131"
  - "132"
  - "80 — superseded conceptually (maturity-helper)"

