code_examples:
  - title: Token-budget gate sketch
    file: hive/lib/budget-gate.js
    snippet: |
      const RATES_PER_MTOK = {
        'claude-opus-4-7':   { in: 15.0, out: 75.0 },
        'claude-sonnet-4-6': { in:  3.0, out: 15.0 },
        'claude-haiku-4-5':  { in:  1.0, out:  5.0 },
      };
      function rowCost(row) {
        const r = RATES_PER_MTOK[row.model] || RATES_PER_MTOK['claude-opus-4-7'];
        return (row.input_tokens * r.in + row.output_tokens * r.out) / 1_000_000;
      }

design_decisions:
  - decision: Build sandcastle image in-workflow rather than pulling from a registry
    rationale: v1 keeps infra surface zero; if cold-build cost becomes material, registry caching is a follow-on
  - decision: Use $GITHUB_STEP_SUMMARY for run visibility instead of slack/email
    rationale: native GH surface; no new integrations; humans can subscribe to workflow runs
  - decision: Manual dispatch goes through the same budget gate
    rationale: budget protection should not have a bypass; emergency override = manually edit the config in a separate PR
  - decision: Inline rate-card constant in budget-gate.js
    rationale: rates change rarely; one file to update; alternative (config file) adds substrate without v1 value

cross_cutting:
  - concern: documentation
    action: |
      Update README to mention the autonomous worker loop. Add new
      hive/references/sandcastle-ops-loop.md (or extend
      sandcastle-adoption-guide.md section 3) describing the end-to-end
      flow: /plan → issues → cron → worker → PR → review.
  - concern: versioning
    action: |
      THIS story owns the bump commit per cross-cutting rule
      (last commit on epic branch). Minor bump: 1.4.0 → 1.5.0.
      CHANGELOG entry covers all three stories' consumer-visible adds.
  - concern: metrics
    applies: true
    metric:
      name: autonomous_stories_closed
      direction: up
      baseline: 0
      target: 3
      window: "14d post-merge"
      source:
        kind: events
        carrier: gh_issue_close_events
      verify_at: epic-close + 14d
      justification: >
        This story ships the closed loop; observable outcome is the count of
        hive:story-labeled issues closed via PR opened by the autonomous worker
        in the 14 days after merge. Three is the floor for "the loop ran end-to-end
        more than once" — not an aspirational throughput target. Tune up after
        first observation window if signal is sound.

risks:
  - severity: medium
    description: GH Actions runners can't build sandcastle image (Docker version, network restrictions)
    mitigation: Spike on a feature branch BEFORE story closes; if blocked, fall back to pre-built image in GHCR with a separate publish workflow
  - severity: medium
    description: Budget rate-card drifts vs. actual API pricing
    mitigation: Inline constants with a comment; documented as a known-stale source; budget is approximate by design
  - severity: low
    description: 15-min cron too aggressive; quota burns; or too slow; loop feels dead
    mitigation: Configurable via workflow_dispatch; first-week observation tunes cadence
  - severity: medium
    description: A worker failure mode that doesn't comment back leaves an issue stuck in hive:in-flight
    mitigation: "Workflow's `if: always()` step labels the issue hive:failed if worker exited non-zero without status='shipped'"

references:
