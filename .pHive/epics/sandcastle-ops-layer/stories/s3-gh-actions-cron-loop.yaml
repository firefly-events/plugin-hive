id: s3-gh-actions-cron-loop
epic: sandcastle-ops-layer
title: GH Actions cron workflow + token-budget gate
status: blocked
complexity: medium
methodology: classic
depends_on: [s2-sandcastle-worker-prompt]

description: |
  Close the loop. A GitHub Actions workflow on a 15-minute cron invokes the
  sandcastle worker (S2) which picks up labeled issues (S1) and ships them
  autonomously. A pre-flight token-budget gate reads today's spend from the
  existing .pHive/metrics/events/ stream and aborts the run if over budget.

  This is the third and final piece — once it ships, the autonomous loop is
  closed end-to-end: /plan publishes issues, cron triggers worker, worker
  picks issue, opens PR, comments back. No custom dispatcher, no daemon, no
  branch-lease logic — sandcastle and GH Actions own all the heavy lifting.

  OPT-IN CONTRACT (hard constraint): The workflow ships in plugin-hive's own
  .github/workflows/ for maintainer use ONLY. It does NOT auto-deploy to
  consumer repos via the Claude Code plugin distribution (plugins distribute
  via .claude-plugin/, not via .github/). Consumers who want autonomous
  execution copy the workflow into their own repo, configure secrets, and
  wire their sandcastle adoption. The README + sandcastle-ops-loop.md doc
  must be explicit that this workflow is REFERENCE not DEFAULT.

acceptance_criteria:
  - "Given the workflow file is committed, when 15 minutes elapse, then the cron schedule fires a hive-worker job"
  - "Given the workflow is triggered (cron or workflow_dispatch), when budget gate runs, then it sums today's input+output tokens × per-model cost from .pHive/metrics/events/stop-*.jsonl and exits non-zero if over hive.config.yaml.token_budget_limits.daily"
  - "Given the budget gate passes, when the worker runs, then sandcastle is invoked with the S2 prompt and a 45-minute job timeout"
  - "Given the worker returns Output.object successfully, when the workflow concludes, then the structured result is uploaded as a job artifact and surfaced in the workflow run summary"
  - "Given two cron firings overlap, when the second triggers, then the concurrency group hive-worker queues it (cancel-in-progress: false) so they run serially"
  - "Given the workflow is dispatched manually with an issue_number input, when it runs, then the worker scopes pickup to that issue only"

steps:
  - id: research
    description: |
      Read .pHive/metrics/metrics-event.schema.md to confirm stop-event row
      shape (input_tokens, output_tokens, model). Read hive.config.yaml's
      token_budget_limits block. Survey existing .github/workflows/ for
      permissions block and action versions in use.
    agent: researcher

  - id: implement
    description: |
      Three artifacts:

      1. `.github/workflows/hive-worker.yml`:
         name: Hive Worker
         on:
           schedule: [{ cron: '*/15 * * * *' }]   # every 15 min
           workflow_dispatch:
             inputs:
               issue_number: { type: string, required: false, description: 'Pin to one issue' }
         permissions:
           issues: write
           pull-requests: write
           contents: write
         concurrency:
           group: hive-worker
           cancel-in-progress: false
         jobs:
           worker:
             runs-on: ubuntu-latest
             timeout-minutes: 45
             steps:
               - uses: actions/checkout@v4
                 with: { ref: dev/hive-2.0, fetch-depth: 0 }
               - uses: actions/setup-node@v4
                 with: { node-version: '20' }
               - run: npm ci
               - name: Budget gate
                 run: node hive/lib/budget-gate.js
               - name: Build sandcastle image
                 run: docker build -t sandcastle:hive-worker .pHive/spikes/sandcastle/
               - name: Run worker
                 id: worker
                 env: { GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
                 run: node hive/lib/sandcastle-worker-runner.js ${{ inputs.issue_number }} > result.json
               - uses: actions/upload-artifact@v4
                 with: { name: worker-result, path: result.json }
               - name: Summarize
                 if: always()
                 run: cat result.json >> $GITHUB_STEP_SUMMARY

      2. `hive/lib/budget-gate.js`:
         Read all .pHive/metrics/events/stop-*.jsonl created since UTC midnight.
         For each row: input_tokens + output_tokens, multiply by per-model
         cost from a small inline rate-card constant (claude-opus-4-7,
         claude-sonnet-4-6, claude-haiku-4-5). Sum to daily_spend_usd.
         Read hive.config.yaml.token_budget_limits.daily (number, dollars).
         If sum >= limit, console.error + process.exit(1) with remaining
         budget message. Else exit 0.
         CLI entry-point; importable as { computeDailySpend, gate }.

      3. `tests/budget-gate.test.js`:
         Cases:
           - empty events dir → spend=0, gate passes
           - mixed-model events → correct weighted sum
           - over-limit → exit 1 + error message
           - malformed JSONL row → skipped with warn, run continues
           - rate-card missing model → falls back to opus rate (conservative) and warns
    agent: developer
    depends_on: [research]

  - id: test
    description: |
      Run tests/budget-gate.test.js locally. Smoke-test the workflow via
      `act` (or push a temporary branch + workflow_dispatch and observe one
      run). Verify: concurrency serializes, permissions sufficient, artifact
      upload works, step summary contains worker JSON, manual dispatch with
      issue_number scopes correctly.
    agent: tester
    depends_on: [implement]

  - id: review
    description: |
      Verify: workflow permissions are minimum-required and explicit; cron
      offset chosen sensibly (15-min default); no secrets logged; budget
      gate failure surface clear; sandcastle image build cached or
      reasonable build time; manual-dispatch path doesn't bypass budget gate.
      Final cross-cutting checklist: docs updated, version bumped (this is the
      epic-close commit), CHANGELOG entry written.
    agent: reviewer
    depends_on: [test]

  - id: integrate
    description: |
      LAST commit on dev/hive-2.0 epic branch. Bump version (minor) per
      cross-cutting.versioning. Files in this commit: workflow + budget-gate
      + test + version bump in .claude-plugin/plugin.json,
      .claude-plugin/marketplace.json + README badge + CHANGELOG entry under
      a new dated section listing all three stories' consumer-visible adds.
      Commit message:
        "feat(sandcastle-ops): GH Actions cron + budget gate (closes ops loop)
         + bump 1.4.0 → 1.5.0"
      Open PR against dev/hive-2.0. Tag the epic for promotion to main per
      stacked-PR convention.
    agent: developer
    depends_on: [review]

