id: s1-github-issues-adapter
epic: sandcastle-ops-layer
title: GitHub Issues adapter + /plan post-step
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  Build a GitHub Issues adapter that publishes hive stories as labeled issues
  so an autonomous worker can pick them up. Extend the existing
  external_task_tracking config slot (currently Linear-shaped) to support a
  `github` adapter. Wire a /plan post-step that calls the adapter at the end
  of Phase C, after epic.yaml and story YAMLs are written.

  OPT-IN CONTRACT (hard constraint): The /plan post-step calls the adapter
  ONLY when external_task_tracking.adapter == "github". When the adapter is
  unset, "none", or any other value, /plan writes story YAMLs to disk as
  today and exits — no GH calls, no issue creation, no warning, no error.
  This story does not change default /plan behavior. Sandcastle adoption is
  the trigger for opting in; consumers who do not run sandcastle never
  encounter issue publishing.

  This is the OUTBOUND half of the ops loop — stories leave planning and
  become discoverable work items in GitHub. The INBOUND pickup (S2) and
  scheduling (S3) build on this.

  Labels namespace (locked):
    - hive:ready                — published, unblocked, available for pickup
    - hive:in-flight            — claimed by a worker
    - hive:failed               — worker failed; needs human review
    - hive:epic:<epic-id>       — epic membership
    - hive:story:<story-id>     — story identity (for round-trip)
    - hive:blocked-by:<story-id> — open dependency; remove on parent close

  Issue body format:
    - Story title as H2
    - Story description verbatim
    - Acceptance criteria as checklist
    - Steps as ordered list
    - Files / patterns from story YAML
    - Links: epic.yaml, story YAML path, design-discussion path
    - Footer: "Source story YAML re-read at runtime by worker; this body is a snapshot."

acceptance_criteria:
  - "Given a config with external_task_tracking.adapter=github and a planned epic, when /plan finishes Phase C, then one GitHub issue is created per story with the locked label namespace"
  - "Given a story already has external_id set in its YAML, when the adapter runs, then no duplicate issue is created (idempotent re-run)"
  - "Given a story has depends_on: [other-story], when the adapter publishes it, then it receives a hive:blocked-by:<other-story-id> label"
  - "Given a parent issue closes, when the dependency sweep runs (per-tick or webhook), then dependent issues lose their hive:blocked-by:<parent> label and gain hive:ready if no other blockers remain"
  - "Given external_task_tracking.adapter is unset or 'none', when /plan runs, then no issues are created and no error is raised"
  - "Given gh CLI fails (auth/network/quota), when the adapter runs, then a clear error surface fires and no partial state is left in YAML files"

steps:
  - id: research
    description: |
      Read existing Linear adapter shape from hive.config.yaml.external_task_tracking
      and any hive/lib/external/ files. Map the schema. Identify the /plan
      post-step hook point in skills/plan/SKILL.md (after epic.yaml write, after
      checklist).
    agent: researcher

  - id: implement
    description: |
      Create hive/lib/external/github-issues-adapter.js (CJS). Public surface:
        publishStoriesToIssues({ epicId, storyIds, config, dryRun? }) -> Promise<{ created: [{id, issue#}], skipped: [{id, reason}] }>
        sweepBlockedByLabels({ epicId, config }) -> Promise<{ unblocked: [issue#] }>
      Use child_process.execFile('gh', [...]) — no SDK dependency. Write
      external_id back into the story YAML by load → mutate → write (preserve
      YAML formatting via js-yaml's noRefs + lineWidth=120).
      Extend hive.config.yaml external_task_tracking schema to accept
      adapter: github with github_owner, github_repo (and label_prefix override
      defaulting to 'hive').
      Add a "Phase C post-step — publish issues" block to skills/plan/SKILL.md
      that calls publishStoriesToIssues when adapter is configured and prints
      one-line confirmation per created issue.
    agent: developer
    depends_on: [research]

  - id: test
    description: |
      Write integration-style tests at tests/hive-lib/github-issues-adapter.test.js
      using a mocked gh CLI shim (child_process spy). Cover:
        - happy path: 3 stories → 3 issues, labels correct, dependencies wired
        - idempotent re-run (external_id present → skip)
        - dry-run (no gh calls, returns planned actions)
        - gh failure mid-batch (one issue created, second fails → first's YAML write committed, error surface fires for second)
        - sweep: parent issue close → child label removed
    agent: tester
    depends_on: [implement]

  - id: review
    description: |
      Verify: no plaintext token leakage in error surface; no half-written YAML;
      idempotency truly idempotent; label namespace matches spec exactly;
      docs updated; cross-cutting (versioning + docs) checklist satisfied.
    agent: reviewer
    depends_on: [test]

  - id: integrate
    description: |
      Commit on dev/hive-2.0 epic branch with conventional message
      "feat(sandcastle-ops): GitHub Issues adapter + /plan publish step".
      One commit for the whole story per hive convention.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  tech_stack:
    languages: [javascript-cjs]
    cli: [gh, jq, git]
  key_files:
    - path: hive.config.yaml
      purpose: external_task_tracking config slot to extend
    - path: skills/plan/SKILL.md
      purpose: insertion point for the Phase C post-step
    - path: hive/lib/sandcastle-provider.js
      purpose: shape reference for hive/lib/ module convention

files_to_modify:
  - file: hive/lib/external/github-issues-adapter.js
    change: NEW — adapter implementation
  - file: hive.config.yaml
    change: extend external_task_tracking schema with github adapter fields
  - file: hive/hive.config.yaml
    change: document the new adapter shape in shipped baseline (no functional default change)
  - file: skills/plan/SKILL.md
    change: add Phase C post-step that invokes the adapter when configured
  - file: tests/hive-lib/github-issues-adapter.test.js
    change: NEW — adapter tests

code_examples:
  - title: Sandcastle prompt template demonstrating the gh-issue-list pickup pattern (the consumer this adapter feeds)
    file: .sandcastle/prompt.md
    snippet: |
      <!-- Use !`command` to pull in dynamic context. Commands run inside the sandbox. -->
      <!-- Example: !`gh issue list --state open --label Sandcastle --json number,title,body,labels,comments` -->

design_decisions:
  - decision: Use gh CLI via child_process rather than @octokit SDK
    rationale: gh is already a hard dep across hive; matches existing convention; one fewer node_modules entry
  - decision: Idempotency via external_id field in story YAML (not via a separate state file)
    rationale: Story YAML is already the SoT for the story; adding state elsewhere risks drift
  - decision: Sweep-on-tick over webhook for v1 unblocking
    rationale: GH Actions cron from S3 runs anyway; sweep at tick cost is trivial; webhook adds infra surface

cross_cutting:
  - concern: documentation
    action: |
      Update hive/references/external-task-tracking.md (create if absent) with
      the github adapter schema, label conventions, and round-trip semantics.
      Update README's config reference table if it lists external_task_tracking.
  - concern: versioning
    action: |
      No version bump in THIS story — versioning bump is owned by S3's integrate
      step (last commit on epic branch, per cross-cutting-concerns.yaml rule).
      Flag at epic-close that THIS story contributes a consumer-visible config
      key addition justifying a minor bump.
  - concern: metrics
    applies: false
    justification: >
      Substrate story — no observable outcome until the loop closes (S3 lands).
      Issue creation is verified by tests, not by post-merge metrics.

risks:
  - severity: medium
    description: gh CLI auth scope insufficient (missing issues:write)
    mitigation: Adapter performs a `gh auth status --show-token` precheck; fails loud with a remediation message
  - severity: low
    description: YAML write race if another tool edits story files concurrently
    mitigation: file-lock via O_EXCL temp + atomic rename; documented as a single-writer assumption

references:
  - path: .pHive/research-drafts/2026-05-15-sandcastle-ops-layer-plan.md
    relevant_excerpt: |
      ### S1 — Story-to-Issue Adapter (outbound)
      hive/lib/external/github-issues-adapter.js
      Labels: hive:ready, hive:epic:<id>, hive:story:<id>, plus dependency labels
      Writes external_id: <issue#> back into story YAML
      Closing an issue is the signal that a downstream blocked-story becomes ready
  - path: .pHive/epics/sandcastle-ops-layer/docs/design-discussion.md
    relevant_excerpt: |
      Locked defaults: GitHub-only v1; serial concurrency; human-on-first-fail.
      Issue body = pointer not source-of-truth; worker re-reads YAML at runtime.
