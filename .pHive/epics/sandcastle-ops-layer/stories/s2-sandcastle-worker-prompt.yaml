      // result.object is typed and validated

design_decisions:
  - decision: Worker re-reads story YAML at runtime (`!`cat .pHive/...``), does not trust issue body
    rationale: Issue body is a snapshot at create time; YAML can update post-publish; runtime re-read avoids drift
  - decision: Failure path always emits COMPLETE
    rationale: If the agent throws without emitting completion signal, sandcastle iterates to maxIterations burning quota; explicit COMPLETE on failure bounds spend
  - decision: No retry inside the worker
    rationale: Human-on-first-fail policy locked in design discussion; retry logic adds state without clear value
  - decision: branchStrategy="branch" not "merge-to-head"
    rationale: One PR per story; merge happens via PR review path, not sandcastle auto-merge

cross_cutting:
  - concern: documentation
    action: |
      Add hive/references/sandcastle-worker-contract.md documenting prompt
      structure, Zod schema, runner CLI, and the labels namespace. Cross-link
      from sandcastle-adoption-guide.md.
  - concern: versioning
    action: |
      Contributes to the minor bump owned by S3's integrate step. Worker
      prompt and runner ARE consumer-visible (shipped in repo).
  - concern: metrics
    applies: false
    justification: >
      Substrate — no observable outcome until S3 wires the cron. Worker
      correctness verified by unit + runner tests.

risks:
  - severity: medium
    description: Prompt instruction is ambiguous and agent picks a blocked or in-flight issue
    mitigation: Filter step explicit and ordered first; prompt review by reviewer step
  - severity: low
    description: Sandcastle Output.object validation fails silently leaving caller without a result
    mitigation: Spike confirmed schema mismatch throws on the caller side; test covers
  - severity: medium
    description: maxIterations=5 too restrictive for complex stories
    mitigation: Tune via flag; failures fall to human-on-first-fail anyway; 5 is a starting point

