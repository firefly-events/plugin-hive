description: 'Insert a net-new Phase A above existing step 3 of `skills/design/SKILL.md`

  (current single ui-designer dispatch at lines 55-64). Phase A is a

  STRUCTURAL insert — `/design` today has no persona-assembly phase to

  extend. Add Phase 0 to invoke `design-dispatch` and resolve substrate

  before persona phase. Default invocation preserves legacy behavior

  (single ui-designer dispatch). `--include-constraints` flag routes

  through specialist-triggers to add accessibility-specialist +

  animations-specialist as a constraint pass, then dispatches ui-designer

  ONCE with constraints baked into the prompt. AC explicitly splits into

  THREE NAMED SUBSECTIONS to prevent three-in-one verification drift

  (hv-collab-review architect lock).

  '
acceptance_criteria:
- AC Subsection 1 — Phase A structural insert. Given `skills/design/SKILL.md` is updated, when a reader scans the file, then a net-new Phase A block exists above existing step 3 (lines 55-64) AND Phase A AC cites `hive/workflows/design-review.workflow.yaml:8-81` as the orchestration template to mirror (the 4-step assembly+serial-dispatch shape — accessibility → animations → ui-designer critique → ui-designer synthesis). The structural insert prevents re-invention by anchoring on design-review.workflow.yaml.
- AC Subsection 1 — Phase 0 wiring. Given `skills/design/SKILL.md` is updated, when /design is invoked, then Phase 0 invokes `design-dispatch` and resolves substrate BEFORE the persona phase.
- AC Subsection 2 — Pattern B toggle semantics — default OFF. Given `/design` is invoked with NO `--include-constraints` flag, when the dispatcher runs, then it dispatches `ui-designer` ONCE only — no accessibility-specialist invocation, no animations-specialist invocation (legacy behavior preserved).
- AC Subsection 2 — Pattern B toggle semantics — toggle ON. Given `/design --include-constraints` is invoked, when the dispatcher runs, then it routes through specialist-triggers to serially dispatch (a) accessibility-specialist producing accessibility constraint notes, (b) animations-specialist producing animation constraint notes, (c) ui-designer dispatched ONCE with constraints baked into the prompt.
- AC Subsection 3 — 3-persona handoff payload. Given `--include-constraints` is on, when Phase A completes, then the constraint notes produced by accessibility-specialist + animations-specialist are bundled with the ui-designer outputs (PNG + .f0) as the wireframe handoff payload (the bundled payload contract is owned by d-5).
- AC Subsection 3 — handoff bundling. Given the bundle is assembled, when downstream consumers (design-review, manual review) receive it, then the payload includes the constraint doc field when toggle was on, or omits it (empty/absent) when toggle was off — PNG + .f0 always ship.
- Test independence. Given the three AC subsections are verified, when one subsection fails, then it does NOT block the other two from independently passing review (no cross-subsection test coupling).
- DO. Single story with 3 AC subsections per hv-collab-review architect lock. Cite design-review.workflow.yaml:8-81 inside the AC text, not just in design_decisions.
- DO NOT. Do not split into two stories ("phase-a-structural-insert" + "persona-pipeline-wiring") — Decision Point 5 affirms single story; splitting creates an artificial seam.
