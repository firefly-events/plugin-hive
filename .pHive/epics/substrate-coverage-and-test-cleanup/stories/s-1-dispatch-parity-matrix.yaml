id: s-1-dispatch-parity-matrix
epic: substrate-coverage-and-test-cleanup
title: Author hive/references/dispatch-parity.md — canonical 6×3 substrate matrix
status: complete
complexity: low
methodology: classic
depends_on:
- s-2-mode-resolver
- s-3-no-codex-lint
- s-4-cc-workflows-preconditions
- t-3-test-mode-cc-workflows
- d-4-design-mode-cc-workflows
- dr-3-design-review-mode-cc-workflows
- r-3-review-mode-cc-workflows
parallel_allowed: true
parallel_rationale: read-only
description: 'Author `hive/references/dispatch-parity.md` — the canonical 6×3 matrix

  `{plan, execute, test, design, design-review, review} × {default, multica, cc-workflows}`

  marking ship state per cell. Pure read-only summary work: reads paths from L2 (dispatch

  routers), L3 (multica mode atoms), and L4 (cc-workflows mode atoms) artifacts shipped

  in Slices 1-5. Adds a footer row for future substrate slots (e.g., sandcastle, GH Actions

  legacy) so the matrix is forward-extensible without re-authoring. Slice 6 is the

  governance close for the epic — runs LAST; the verification is "every cited path resolves."

  '
acceptance_criteria:
- Given `hive/references/dispatch-parity.md` is authored, when a reader opens the doc, then it presents a 6-row × 3-column Markdown table with rows {plan, execute, test, design, design-review, review} and columns {default, multica, cc-workflows} plus a trailing footer row for future substrate slots.
- Given each cell, when populated, then it carries either (a) a relative path to the active mode-atom skill (e.g., `skills/hive/skills/plan-mode-cc-workflows/SKILL.md`), (b) the marker `inline` for default-path dispatch through the orchestrator skill itself, or (c) `N/A — reasoning` when the cell has no shipped substrate.
- Given the file manifest claims a path is shipped, when CI runs the `hive/scripts/verify-dispatch-parity.mjs` checker, then every cited path under `skills/hive/skills/*-mode-*/SKILL.md` resolves on disk and `git ls-files` confirms it is tracked.
- Given the doc has a "Future substrate" footer row, when a reader scans the future row, then it lists the placeholder columns (e.g., `sandcastle`, `gh-actions-legacy`) with `not-shipped` markers — explicitly documenting the matrix as forward-extensible.
- Given the doc header, when a reader scans it, then the doc cites itself as "produced by Slice 6 of substrate-coverage-and-test-cleanup; canonical reference for what's wired across substrates."
- DO. Run AFTER Slices 1-5 land. Cite each mode-atom skill by relative path. Add the `verify-dispatch-parity.mjs` checker so future PRs that move/remove cited paths fail CI.
- DO NOT. Do not author new substrate atoms in Slice 6 — pure summary. Do not embed line ranges (paths only — line ranges drift). Do not assume Slice 6 must run before the dispatch-parity.md doc is referenced by other docs.
metric:
  applies: true
  name: substrate_coverage.dispatch_parity_matrix_paths_resolve_pct
  direction: up
  unit: ratio
  baseline: null
  target: 1.0
  window: story integrate step
  source:
    kind: manual
    ref: node hive/scripts/verify-dispatch-parity.mjs
  verify_at: story integrate step
  owner: reviewer
cross_cutting:
- concern: documentation
  action: Doc IS the canonical reference; cross-link from README and skills/hive/skills/planning-routing/SKILL.md per architect ESCALATION mirror-anchor pattern.
- concern: versioning
  action: 'Doc carries a `## Last verified: <ISO date>` block updated whenever the matrix is touched; CI checker date-stamps on green.'
design_decisions:
- decision: Slice 6 is a single story (s-1) and runs LAST
  rationale: Pure summary work — no upstream authoring lives in Slice 6. TPM collab-review confirmed realistic 1-story sizing. Cell entries are paths from Slices 1-5; mechanical reading from artifacts in place.
- decision: Footer row for future substrate slots
  rationale: Forward-extensibility without re-authoring. New substrates (sandcastle, etc.) land in the footer as `not-shipped` placeholders; mainline rows stay stable.
- decision: CI checker script `hive/scripts/verify-dispatch-parity.mjs`
  rationale: Architect ESCALATION (carry-forward) — without an automated path-resolve check, the matrix drifts the moment a mode-atom skill is renamed or moved. Checker fails CI on drift.
risks:
- severity: low
  description: A future substrate atom move/rename silently breaks the matrix
  mitigation: verify-dispatch-parity.mjs runs in CI; any move/rename must also touch dispatch-parity.md or CI fails
- severity: low
  description: Matrix becomes stale if the doc is forgotten when a new mode atom ships
  mitigation: 'Doc carries a `## Last verified: <ISO date>` block; PR checklist for any new `*-mode-*` skill requires touching dispatch-parity.md'
steps:
- id: research
  description: Inventory all shipped mode atoms under `skills/hive/skills/*-mode-*/SKILL.md` + dispatch routers under `skills/hive/skills/*-dispatch/SKILL.md` shipped by Slices 1-5. Confirm relative paths.
  agent: researcher
- id: implement
  description: Author `hive/references/dispatch-parity.md` with the 6×3 matrix + future-substrate footer row. Author `hive/scripts/verify-dispatch-parity.mjs` checker. Add CI hook (npm script or workflow step).
  agent: developer
  depends_on:
  - research
- id: test
  description: Run `node hive/scripts/verify-dispatch-parity.mjs` — expect 0 missing paths. Run linter — expect no broken cross-references.
  agent: tester
  depends_on:
  - implement
- id: review
  description: Review matrix completeness + checker correctness + doc cross-link from README and planning-routing/SKILL.md.
  agent: reviewer
  depends_on:
  - test
- id: integrate
  description: Commit and push to feature branch as the FINAL commit of the epic.
  agent: developer
  depends_on:
  - review
