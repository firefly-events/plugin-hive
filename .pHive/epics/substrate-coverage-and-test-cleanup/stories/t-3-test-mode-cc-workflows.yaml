description: 'Create `skills/hive/skills/test-mode-cc-workflows/SKILL.md`

  (~330-360 lines, mirrors `plan-mode-cc-workflows`). Dispatch granularity

  is per-scenario, mirroring `test-mode-multica` (architect-resolved Q3 —

  scenarios are the natural episode-marker unit). Imports

  `cc-workflows-preconditions.mjs` at Step 0. Also create

  `skills/hive/skills/test-dispatch/SKILL.md` (~200-250 lines, router

  consuming `mode-resolver.mjs`). Step 0: invoke shared resolver; Step 1:

  dispatch to chosen mode atom; Step 2: return `{mode_decision, sources}`

  so callers can audit provenance. Dispatch router structurally mirrors

  `skills/hive/skills/execute-dispatch/SKILL.md` (architect ESCALATION

  anchor — prevents re-invention).

  '
acceptance_criteria:
- Given `skills/hive/skills/test-mode-cc-workflows/SKILL.md` is created, when the atom executes, then Step 0 invokes `assertWorktreeIsolation()` from `hive/lib/cc-workflows-preconditions.mjs` AND no `agentType:` literal appears in the file AND no `codex:codex-rescue` skill reference appears.
- Given the atom dispatch granularity, when /test runs through cc-workflows substrate, then dispatch is per-scenario (mirroring test-mode-multica), not per-persona.
- Given the atom's full 6-step structure, when a reader scans it, then it carries Step 0 (precondition gate + helper import), Step 1 (per-scenario serial dispatch via default workflow subagent — NO Codex routing), Step 2 (poll-to-terminal), Step 3 (episode marker write to `${HIVE_STATE_DIR}/episodes/{epic_handle}/{unit_id}/cc-workflows-run.yaml`), Step 4 (sidecar no-op), Step 5 (aggregate return).
- Given `skills/hive/skills/test-dispatch/SKILL.md` is created, when the router executes, then Step 0 invokes `resolveMode('HIVE_TEST_MODE', ctx)` from `hive/lib/mode-resolver.mjs` AND returns `{mode_decision, sources}` so callers can audit provenance.
- Given the router structurally mirrors `skills/hive/skills/execute-dispatch/SKILL.md`, when a reader compares Step 0/1/2 shapes, then they are structurally identical to execute-dispatch.
- Given the s-3 no-codex lint runs against `test-mode-cc-workflows`, when `npm test` executes, then all four lint checks PASS.
- Given the vitest resolution test runs, when `test-mode-cc-workflows` is dispatched with environment, root config, shipped baseline, skill override, and default values, then the resolver returns the expected `mode_decision` for each tier.
- DO. Mirror `plan-mode-cc-workflows/SKILL.md` shape for the atom; mirror `execute-dispatch/SKILL.md` shape for the router.
- DO NOT. Do not include any Codex routing (direct `agentType:` literal, `codex:codex-rescue` reference, or `agent_backends` config keys) in either skill file.
