description: 'Create `skills/hive/skills/design-mode-multica/SKILL.md` (~400-450 lines,

  mirrors `execute-mode-multica`). Per-persona dispatch within a team-cell;

  serial within team-cell; episode markers per persona at

  `${HIVE_STATE_DIR}/episodes/{epic_handle}/{unit_id}/multica-run.yaml`.

  Multica issue creation surface defaults to one issue per persona

  (mirrors execute-mode-multica precedent; Q10 explicitly resolved

