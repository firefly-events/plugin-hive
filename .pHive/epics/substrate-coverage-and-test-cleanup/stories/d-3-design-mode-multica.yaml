acceptance_criteria:
- Given `skills/hive/skills/design-mode-multica/SKILL.md` is created, when /design runs through multica substrate with Phase A toggle ON, then dispatch is per-persona (accessibility-specialist, animations-specialist, ui-designer) inside a single team-cell.
- Given the atom executes, when episodes are written, then episode markers are emitted per persona at `${HIVE_STATE_DIR}/episodes/{epic_handle}/{unit_id}/multica-run.yaml`.
- Given the atom structurally mirrors `execute-mode-multica`, when a reader compares dispatch shape, then per-persona dispatch + serial-within-team-cell + per-persona episode markers match.
- Given Multica issue creation runs, when Phase A toggle is ON, then one Multica issue is created per persona (3 issues total for accessibility + animations + ui-designer); when toggle is OFF, then one issue is created for ui-designer only.
- Given the vitest resolution test runs at `skills/hive/skills/design-mode-multica/test/resolver.test.mjs`, when the atom is dispatched, then it returns the expected mode_decision and persona dispatch sequence.
- DO. Mirror execute-mode-multica's per-persona dispatch + episode marker shape.
- DO NOT. Collapse to a single issue surface — default to one issue per persona per design-discussion §6 Q10 resolution.
