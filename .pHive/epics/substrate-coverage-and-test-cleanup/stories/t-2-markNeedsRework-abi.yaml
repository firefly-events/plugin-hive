cross_cutting:
  - concern: documentation
    action: "ABI is the doc — markNeedsRework signature lives in `task-tracking-dispatch/index.ts`; test-sentinel.md prose mentions the new bounce-back; CHANGELOG entry at epic close lists the new ABI method."
  - concern: versioning
    action: "New ABI method is consumer-visible — flag for epic-close version bump (minor — additive feature) in CHANGELOG via s-1 dispatch-parity story."

design_decisions:
  - decision: NEW method `markNeedsRework({id, reason})` on TaskTrackingDispatch ABI
    rationale: User-locked at design-discussion §6 Q2 — architect option (c). Domain verb cleanly sidesteps GitHub `supported_states = [open, closed]` limitation. Not extending updateStatus; not renaming updateStory.
  - decision: Return shape `Promise<{id, status, labels[]}>`
    rationale: Outline-collab-review-record architect ESCALATION — t-2 contract test in step 1 has nothing to assert without explicit return type. Captures terminal-state + label as the symmetric external observable across adapters.
  - decision: TDD methodology — contract test lands FIRST, two implementations second
    rationale: TPM ESCALATION — non-symmetric backing state machines (Multica 5-state vs GitHub 2-state) cannot be silently bridged. The contract test forces the symmetry that the adapters must individually deliver.
  - decision: Multica state = `in_review`
    rationale: User-locked at design-discussion §6 Q7 — canonical Multica state for needs-rework (mid-state with label).
  - decision: step-06-triage emit only on `story-issue` classification
    rationale: Transient + human-blocker classifications preserve existing semantics (no emit); design-discussion §3 Slice A.
  - decision: test-sentinel persona file is prose-only
    rationale: CONTEXT.md step-vs-persona discipline; grill C2 resolved. The executable contract lives in `step-06-triage.md`, not the persona.

risks:
  - severity: high
    description: Adapter contract test passes but downstream notification cascade differs enough across substrates that operators see drift
    mitigation: E2 elicitation accepted intentional adapter-specific notifications; the symmetric observable is terminal-state + label; manual smoke on both substrates at story close
  - severity: medium
    description: Contract test lands but is under-specified — names implementation details rather than observables
    mitigation: TDD ordering enforces contract-first; AC names return shape `Promise<{id, status, labels[]}>` explicitly; architect review verifies observables only
  - severity: medium
    description: step-06-triage emit fires on non-story-issue classification (transient or human-blocker)
    mitigation: AC explicitly forbids emit on transient/human-blocker; vitest covers the discrimination
