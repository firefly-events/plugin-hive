parallel_rationale: bounded-slice
description: |
  Add a NEW method `markNeedsRework({id, reason})` to the
  TaskTrackingDispatch ABI. NOT an extension of `updateStatus`. NOT a
  rename of Multica's `updateStory`. Return shape is
  `Promise<{id, status, labels[]}>`. The contract test lands FIRST per
  TDD methodology (the only TDD-methodology story in the epic per TPM
  ESCALATION); two adapter implementations land second; step-06-triage
  emit lands third; test-sentinel persona prose update lands fourth.
  Multica adapter: `updateStory({status:'in_review'})` + add
  `hive:needs-rework` label. GitHub adapter: reopen issue + add
  `hive:needs-rework` label. Capability advertised via
  `capability('supports_needs_rework')`.

acceptance_criteria:
  - Phase 1 — Adapter contract test FIRST. Given `hive/lib/task-tracking-dispatch/test/markNeedsRework.contract.test.mjs` is authored, when the contract test runs against both adapters BEFORE implementation, then it FAILS (no `markNeedsRework` method exists yet).
  - Phase 1 — Return shape contract. Given the contract test asserts the return shape, when `markNeedsRework({id, reason})` is invoked, then the returned Promise resolves to `{id, status, labels[]}` where `labels[]` includes `'hive:needs-rework'`.
  - Phase 2 — Multica adapter. Given `hive/adapters/multica/index.ts` is updated, when `markNeedsRework({id, reason})` is invoked, then the adapter calls `updateStory({id, status:'in_review'})` followed by adding the `hive:needs-rework` label AND returns `{id, status:'in_review', labels:[...prior, 'hive:needs-rework']}`.
  - Phase 2 — GitHub adapter. Given `hive/adapters/github/index.ts` is updated, when `markNeedsRework({id, reason})` is invoked, then the adapter calls reopen (state -> open) followed by adding the `hive:needs-rework` label AND returns `{id, status:'open', labels:[...prior, 'hive:needs-rework']}`.
  - Phase 2 — Dispatch surface. Given `hive/lib/task-tracking-dispatch/index.ts` is updated, when callers invoke `markNeedsRework`, then the call routes via `invoke('markNeedsRework', {id, reason})` AND `capability('supports_needs_rework')` is advertised so callers can defensive-opt-in.
  - Phase 2 — Adapter contract test PASS. Given Phase 2 implementations land, when the contract test re-runs, then both Multica and GitHub adapter cases PASS.
  - Phase 3 — step-06-triage emit. Given `hive/workflows/steps/test-swarm/step-06-triage.md` is updated, when triage classifies a failure as `story-issue` (the classification at line 16), then it emits `markNeedsRework({id, reason})` via TaskTrackingDispatch; transient and human-blocker classifications DO NOT emit.
  - Phase 3 — Summary block extension. Given step-06-triage's summary block (lines 111-114) is extended, when the step writes its summary, then it includes `needs_rework_emitted: true|false`.
  - Phase 4 — Persona prose. Given `hive/agents/test-sentinel.md` is updated, when a reader scans the persona, then it describes the bounce-back behavior AS prose only — NO executable change in the persona file (CONTEXT.md step-vs-persona discipline; the contract is in the step file).
  - DO. Land contract test FIRST (TDD), then both adapters, then step-06-triage emit, then persona prose — IN THAT ORDER inside this story's commits.
  - DO NOT. Do not extend `updateStatus` to accept `needs-rework`. Do not rename Multica's `updateStory`. Do not branch on adapter in test-sentinel — trust the dispatch surface.

