id: d-2-design-dispatch-router
epic: substrate-coverage-and-test-cleanup
title: Create design-dispatch router consuming mode-resolver.mjs and returning {mode_decision, sources}
status: complete
complexity: medium
methodology: classic
depends_on:
- s-2-mode-resolver
- s-4-cc-workflows-preconditions
- s-3-no-codex-lint
parallel_allowed: true
parallel_rationale: bounded-slice
description: 'Create `skills/hive/skills/design-dispatch/SKILL.md` (~200-250 lines).

  Step 0: invoke shared resolver `hive/lib/mode-resolver.mjs` with

  `HIVE_DESIGN_MODE` to resolve `mode_decision`. Step 1: dispatch to the

  chosen mode atom (`design-mode-multica` or `design-mode-cc-workflows`).

  Step 2: return `{mode_decision, sources}` to callers so they can audit

  provenance. Router structurally mirrors `skills/hive/skills/execute-dispatch/SKILL.md`

  (architect ESCALATION anchor — prevents re-invention across the 4

  substrate routers in this epic).

  '
acceptance_criteria:
- Given `skills/hive/skills/design-dispatch/SKILL.md` is created, when it executes Step 0, then it invokes `resolveMode('HIVE_DESIGN_MODE', ctx)` from `hive/lib/mode-resolver.mjs`.
- Given Step 1 runs, when `mode_decision` is `multica`, then design-dispatch routes to `design-mode-multica`; when `mode_decision` is `cc-workflows`, then it routes to `design-mode-cc-workflows`.
- Given Step 2 runs, when the router returns to the caller, then it emits `{mode_decision, sources}` (sources carries field-source telemetry from mode-resolver).
- Given the router structurally mirrors `skills/hive/skills/execute-dispatch/SKILL.md`, when a reader compares Step 0/1/2 shapes, then they are structurally identical to execute-dispatch.
- Given the vitest resolution test runs at `skills/hive/skills/design-dispatch/test/resolver.test.mjs`, when 5-tier permutations are exercised, then mode_decision and sources are emitted correctly for each tier.
- DO. Mirror `execute-dispatch/SKILL.md` Step 0/1/2 structure verbatim.
- DO NOT. Re-implement the 5-tier resolver inline — consume `mode-resolver.mjs`.
