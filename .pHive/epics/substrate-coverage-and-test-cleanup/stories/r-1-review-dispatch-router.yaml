description: |
  Create `skills/hive/skills/review-dispatch/SKILL.md` consuming
  `hive/lib/mode-resolver.mjs` with `HIVE_REVIEW_MODE`. Add Phase 0
  invocation of the router to `skills/review/SKILL.md`. Preserve solo
  reviewer pattern (lines 39-49) — no panel-mode expansion in this epic
  (Decision Point 2: DEFER panel mode). Preserve the `scope_drift` emit
  call (from `hive/lib/scope_drift.py`) when wrapping reviewer dispatch.
  Router structurally mirrors `skills/hive/skills/execute-dispatch/SKILL.md`.

acceptance_criteria:
  - Given `skills/hive/skills/review-dispatch/SKILL.md` is created, when it executes Step 0, then it invokes `resolveMode('HIVE_REVIEW_MODE', ctx)` from `hive/lib/mode-resolver.mjs`.
  - Given Step 1 runs, when `mode_decision` is `multica`, then it routes to `review-mode-multica`; when `cc-workflows`, then it routes to `review-mode-cc-workflows`.
  - Given Step 2 runs, when the router returns to the caller, then it emits `{mode_decision, sources}`.
  - Given `skills/review/SKILL.md` is updated, when /review is invoked, then Phase 0 invokes `review-dispatch` BEFORE the existing solo reviewer dispatch.
  - Given the solo reviewer pattern (lines 39-49) is preserved, when /review runs, then it dispatches a single reviewer (no panel-mode).
  - Given the `scope_drift` emit call (from `hive/lib/scope_drift.py`) is preserved, when /review wraps the reviewer dispatch, then the `scope_drift` emit fires identically to pre-epic behavior.
  - Given the router structurally mirrors `skills/hive/skills/execute-dispatch/SKILL.md`, when a reader compares Step 0/1/2 shapes, then they are structurally identical.
  - Given the vitest resolution test runs at `skills/hive/skills/review-dispatch/test/resolver.test.mjs`, when 5-tier permutations are exercised, then mode_decision emits correctly AND the scope_drift emit is preserved through router wrapping (asserted by spy).
  - DO. Mirror execute-dispatch structure verbatim. Preserve scope_drift emit and solo reviewer pattern.
  - DO NOT. Add panel-mode dispatch — Decision Point 2 DEFERS panel mode to a future epic.

