description: 'Define the wireframe handoff payload that flows from /design to

  downstream consumers (design-review, manual review, future Hermes).

  Payload shape LOCKED by user (Q9 resolution): PNG + `.f0` + bundled

  constraint doc. Posture is "at-minimum these fields" (extensible-minimum)

  per TPM ESCALATION in outline-collab-review-record — d-5 is free to add

  fields if downstream consumer surfaces a need during manual exercise.

  When d-1 toggle ON, constraint doc field carries the accessibility +

  animations notes; when toggle OFF, constraint doc field is empty/absent

  but PNG + .f0 always ship.

  '
acceptance_criteria:
- Given d-1 Phase A toggle is ON, when /design completes, then the handoff payload contains AT MINIMUM these three fields — `wireframe.png` (PNG render), `wireframe.f0` (Frame0 source), `constraints.md` (bundled accessibility + animations notes).
- Given d-1 Phase A toggle is OFF, when /design completes, then the handoff payload contains AT MINIMUM `wireframe.png` + `wireframe.f0` (PNG + .f0 always ship); constraint doc field is empty or absent.
- Posture — extensible-minimum. Given a downstream consumer surfaces a need for an additional field (e.g., scenario-mapping notes, version metadata, originating ticket ID), when d-5 is implemented or extended post-ship, then the payload schema is free to add fields without breaking existing consumers (add-only).
- Given the handoff payload is consumed by /design-review (Slice 4), when manual exercise runs, then design-review receives the payload AND can locate `wireframe.png`, `wireframe.f0`, and (when toggle on) `constraints.md` by their documented field names.
- Given the payload contract is documented, when a reader looks at `hive/references/wireframe-protocol.md` (existing 50-line doc), then it includes a payload-contract section naming the three minimum fields AND the extensible-minimum posture.
- DO. Document the payload AS "at-minimum these fields" (extensible-minimum), not as a frozen contract.
- DO NOT. Treat the three fields as the maximum payload — additional fields are reversible follow-ups, not breaking changes.
