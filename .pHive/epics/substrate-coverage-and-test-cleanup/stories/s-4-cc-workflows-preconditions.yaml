cross_cutting:
- concern: documentation
  action: Inline doc-block at top of cc-workflows-preconditions.mjs naming the worktree-isolation invariant; downstream cc-workflows atom stories cite the helper by path.
design_decisions:
- decision: Single shared helper, not per-skill duplication
  rationale: DRY — single invariant, single maintenance site (architect ESCALATION + grill H1/C1). Aligns with `feedback_codex_parallel_race` worktree-isolation discipline.
- decision: Back-fit both existing cc-workflows atoms in this same story
  rationale: Slice 1 commit order LOCKED — s-3 lint asserts every cc-workflows atom imports the helper. Reverse order causes s-3 lint to fail on missing imports.
- decision: Throw synchronously at Step 0, not lazy/deferred
  rationale: Failure must surface BEFORE any state mutation; the operator sees a clear "must run on isolated worktree" message immediately.
risks:
- severity: medium
  description: Back-fit modifies behavior of plan/execute mode-cc-workflows for callers that legitimately invoke them from the main checkout
  mitigation: cc-workflows substrate is documented as requiring worktree isolation (design-discussion Constraint 7); any caller invoking from main checkout was already incorrect per `feedback_codex_parallel_race`. Failure surface at Step 0 is the desired correction.
- severity: low
  description: Worktree-path regex matches false-positives for nested directories
  mitigation: Regex anchored to `.claude/worktrees/<name>/` segment specifically; unit test covers nested vs main-checkout discrimination
