description: 'Create `hive/lib/cc-workflows-preconditions.mjs` exporting

  `assertWorktreeIsolation()`. The helper asserts that

  `*-mode-cc-workflows` runs are on a dedicated worktree under

  `.claude/worktrees/<name>/`, not the main checkout. Throws synchronously

  on main-checkout cwd; passes on isolated worktree. Back-fit both existing

  cc-workflows atoms (`plan-mode-cc-workflows`, `execute-mode-cc-workflows`)

  to import the helper at Step 0 — same-slice modification, mandatory so

  s-3''s helper-import lint asserts green on the existing tree. This is

  Slice 1 commit #2 (LOCKED order s-2 → s-4 → s-3).

  '
acceptance_criteria:
- Given `hive/lib/cc-workflows-preconditions.mjs` exports `assertWorktreeIsolation()`, when the helper is invoked from a cwd matching `.claude/worktrees/<name>/`, then it returns without throwing.
- Given `assertWorktreeIsolation()` is invoked from the main repo checkout (not a worktree subdir), when the helper runs, then it throws a clear `Error` with a message identifying the worktree-isolation invariant and pointing the operator at the dedicated worktree pattern.
- Given `plan-mode-cc-workflows/SKILL.md` Step 0 is updated, when the skill executes, then it imports and calls `assertWorktreeIsolation()` from `hive/lib/cc-workflows-preconditions.mjs`.
- Given `execute-mode-cc-workflows/SKILL.md` Step 0 is updated, when the skill executes, then it imports and calls `assertWorktreeIsolation()` from `hive/lib/cc-workflows-preconditions.mjs`.
- Given the unit test suite at `hive/lib/test/cc-workflows-preconditions.test.mjs` runs, when `npm test` executes, then it asserts (a) the helper throws on main-checkout cwd, (b) the helper passes on a simulated `.claude/worktrees/<name>/` cwd.
- DO. Back-fit BOTH existing cc-workflows atoms in this same story so the s-3 helper-import lint asserts green from commit-time.
- DO NOT. Do not add the helper import to any net-new cc-workflows atom in this story — those atoms ship in Slices 2-5.
