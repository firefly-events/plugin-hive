parallel_allowed: true
parallel_rationale: bounded-slice
description: 'Convert `/test` to a swarm-only pipeline. Hard-rip the `--simulated-manual`

  exclusive flag from `skills/test/SKILL.md` and rip the inline

  `HIVE_TEST_MODE` resolver (delegate substrate selection to test-dispatch).

  Add a new step file at `hive/workflows/steps/test-swarm/step-04b-scenario-replay.md`

  that consumes existing `loadScenario` from `hive/lib/scenarios/load.mjs`

  and sits between step-03-worker and step-04-inspector. Update the

  pipeline table in `skills/test/SKILL.md`. Retire the simulated-manual

  implementation_checklist in `.pHive/cross-cutting-concerns.yaml` and

  replace with a `scenario-replay-folded` historical note. Verify the

  `loadScenario` schema covers the post-worker pre-inspector state shape

  BEFORE freezing AC (H3 verification gate).

  '
acceptance_criteria:
- Given `loadScenario` schema verification runs as the first sub-step, when the schema is inspected against the post-worker pre-inspector state shape, then either (a) the schema covers the shape and AC freezes, or (b) the story splits to "add step file + extend loader" before proceeding.
- Given `skills/test/SKILL.md` is updated, when `/test --simulated-manual` is invoked, then the dispatcher returns an "unknown flag" error (hard-rip confirmed).
- Given `skills/test/SKILL.md` is updated, when `/test` is invoked, then Phase 0 invokes `test-dispatch` (router from t-3) and the inline `HIVE_TEST_MODE` resolver (lines 37-51) is removed.
- Given `hive/workflows/steps/test-swarm/step-04b-scenario-replay.md` is created, when the swarm pipeline executes, then step-04b runs after step-03-worker and before step-04-inspector AND it consumes `loadScenario` from `hive/lib/scenarios/load.mjs`.
- Given `.pHive/cross-cutting-concerns.yaml` is updated, when the file is read, then lines 99-126 (simulated-manual concern) are retired and replaced with a `scenario-replay-folded` historical note pointing at step-04b.
- Given the pipeline table in `skills/test/SKILL.md` (lines 109-119) is updated, when a reader scans the table, then it reflects swarm-only flow with step-04b included.
- Given the existing vitest suite runs, when `npm test` executes, then a new spec at `hive/workflows/steps/test-swarm/test/step-04b-scenario-replay.test.mjs` covers `loadScenario` invocation from the step file.
- DO. Run the H3 verification first; split the story if the schema gap is real. Update cross-cutting-concerns.yaml in the same commit as the flag rip (lockstep per L6 cross-layer dep).
- DO NOT. Do not delete `hive/workflows/steps/test/simulated-manual.md` in this story (deletion is a follow-up cleanup, non-blocking per outline §"Part 4 DELETE").
