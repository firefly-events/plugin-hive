cross_cutting:
- concern: documentation
  action: Inline doc-block at top of lint script naming the four checks AND their limits (transitive helper imports beyond depth 1 unchecked). This documented limit is itself a planning-team decision per Decision Point 3.
design_decisions:
- decision: Lint scope widened to 4 checks (AST + 2 greps + helper-import)
  rationale: Architect ESCALATION + grill U1 — single grep on `agentType:` misses indirect Codex routings via skill-invoke (`codex:codex-rescue`) or config-key (`agent_backends`).
- decision: Limit acknowledged — transitive helper imports beyond depth 1 unchecked
  rationale: Decision Point 3 — accepted documented limit. Code-review discipline covers depth 2+. The lint is a guardrail, not a proof.
- decision: Wire into `npm test`, not a standalone CI lane
  rationale: Lint enforcement piggybacks on the existing test suite; one entry-point for contributors.
