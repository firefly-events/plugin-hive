id: s-3-no-codex-lint
epic: substrate-coverage-and-test-cleanup
title: Multi-surface no-codex lint with AST + grep checks + helper-import assertion + npm test wiring
status: shipped
shipped_at: "2026-06-11T06:05:06Z"
release_id: "v2.11.0"
complexity: medium
methodology: classic
depends_on:
- s-4-cc-workflows-preconditions
description: 'Create `hive/scripts/lint-cc-workflows-no-codex.mjs` with four checks:

  (1) AST-level scan for `agentType:` literal in

  `skills/hive/skills/*-mode-cc-workflows/SKILL.md` files;

  (2) grep for `codex:codex-rescue` skill references inside those paths;

  (3) grep for `agent_backends` config keys inside those paths;

  (4) helper-import lint asserting every `*-mode-cc-workflows/SKILL.md`

  imports `hive/lib/cc-workflows-preconditions.mjs` at Step 0.

  Wire the lint into `npm test` via `package.json`. This is Slice 1

  commit #3 (LOCKED order s-2 → s-4 → s-3). The lint MUST be green

  against the existing 2 cc-workflows atoms (back-fitted by s-4).

  '
acceptance_criteria:
- Given `hive/scripts/lint-cc-workflows-no-codex.mjs` is executed, when it scans `skills/hive/skills/*-mode-cc-workflows/SKILL.md`, then it (a) AST-parses each file and reports any `agentType:` literal, (b) greps for `codex:codex-rescue` skill references inside those paths and reports matches, (c) greps for `agent_backends` config keys inside those paths and reports matches, (d) asserts every file imports `hive/lib/cc-workflows-preconditions.mjs` at Step 0.
- Given the existing 2 cc-workflows atoms (plan-mode-cc-workflows, execute-mode-cc-workflows) are back-fitted per s-4, when the lint runs, then all four checks PASS (exit code 0).
- Given a synthetic test fixture with an `agentType:` literal is introduced under a temp test path, when the lint runs against the fixture, then it exits non-zero with a per-file message naming the offending line.
- Given the lint is wired into `npm test` via `package.json` (e.g., a `lint:cc-workflows` script invoked by the test script), when `npm test` runs, then the lint executes as part of the test suite.
- Given a future cc-workflows atom omits the cc-workflows-preconditions import, when the lint runs, then the helper-import check fails non-zero with a clear pointer at the missing import.
- DO. Document the four checks AND their limits (specifically — transitive helper imports beyond depth 1 are NOT checked) in a comment block at the top of the lint script.
- DO NOT. Do not lint outside `skills/hive/skills/*-mode-cc-workflows/SKILL.md` paths; the lint is scoped to cc-workflows atoms only.
