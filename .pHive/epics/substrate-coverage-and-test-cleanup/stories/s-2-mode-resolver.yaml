id: s-2-mode-resolver
epic: substrate-coverage-and-test-cleanup
title: Extract 5-tier mode-resolver helper into hive/lib/mode-resolver.mjs
status: pending
complexity: medium
methodology: classic
depends_on:
- a-0-audit-recovery
description: 'Extract the canonical 5-tier resolver currently inlined at

  `skills/hive/skills/execute-dispatch/SKILL.md:46-101` into a shared module

  `hive/lib/mode-resolver.mjs` whose signature returns `{decision, sources}`.

  The `sources` field preserves the field-source telemetry that

  execute-dispatch emits today (architect ESCALATION — without it callers

  lose per-tier provenance). Refactor execute-dispatch Step 0 to consume the

  helper. Snapshot tests against pre-refactor outputs are mandatory because

  the refactor is behavior-preserving. This is Slice 1 commit #1 (LOCKED

  order s-2 → s-4 → s-3).

  '
acceptance_criteria:
- 'Given `hive/lib/mode-resolver.mjs` is imported, when the resolver is invoked, then it accepts a resolver-name string (one of `HIVE_PLAN_MODE`, `HIVE_EXECUTE_MODE`, `HIVE_TEST_MODE`, `HIVE_DESIGN_MODE`, `HIVE_DESIGN_REVIEW_MODE`, `HIVE_REVIEW_MODE`) plus a context object and returns `{decision: string, sources: {env?: string, root_config?: string, shipped_baseline?: string, skill_override?: string, default?: string}}`.'
- Given the 5-tier precedence (env > root config > shipped baseline > skill override > default), when a value is set at multiple tiers, then the helper picks the highest-precedence tier and records the resolving tier in `sources`.
- Given all 5 tiers are empty, when the helper is invoked, then it returns a default `decision` and `sources.default` records the default-source tag.
- Given execute-dispatch Step 0 is refactored to consume the helper, when execute-dispatch resolves a `mode_decision`, then the emitted `{mode_decision, sources}` payload is byte-equivalent to the pre-refactor output for a representative input set captured as snapshots at `hive/lib/test/mode-resolver-execute-dispatch.snapshot.json`.
- Given the unit test suite at `hive/lib/test/mode-resolver.test.mjs` runs, when `npm test` executes, then all 5-tier precedence cases pass AND the `sources` map records the resolving tier for each case.
- DO. Preserve the exact `{decision, sources}` shape callers depend on. Snapshot every pre-refactor execute-dispatch output before refactor begins.
- DO NOT. Do not change resolver semantics (no new tiers, no priority reorder, no default change) — this is a pure extract+rename.
