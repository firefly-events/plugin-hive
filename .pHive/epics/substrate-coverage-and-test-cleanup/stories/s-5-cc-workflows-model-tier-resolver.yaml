id: s-5-cc-workflows-model-tier-resolver
epic: substrate-coverage-and-test-cleanup
title: Auto-resolve per-persona model tier in cc-workflows mode dispatch + helper extraction
status: complete
complexity: medium
methodology: classic
depends_on:
- a-0-audit-recovery
description: |
  Add `hive/lib/cc-workflows-model-tier.mjs` helper that resolves a persona
  name to a model tier (`sonnet`/`opus`/`haiku`) by reading `model_tiers`
  (base assignment) and `model_overrides` (runtime promotion — override
  wins) from `hive.config.yaml`. Wire the helper into every cc-workflows
  mode skill's `workflow_assembly` step (currently
  `execute-mode-cc-workflows` and `plan-mode-cc-workflows`; future
  `d-4`/`dr-3`/`r-3`/`t-3` mode skills authored in this epic must import
  it) so every `agent()` call emits explicit `opts.model` resolved from
  config — not from orchestrator guess or parent session inheritance.

  Surface the resolved tier in `field_sources` of the terminal
  `cc-workflows-run.yaml` episode marker for post-run audit.

  Discovered by `a-0-audit-recovery` — the first cc-workflows-mode dispatch
  in production. Without explicit `opts.model` per `agent()` call, every
  dispatched agent inherits the parent session model (Opus 4.7) — violating
  the documented sonnet base tier for creators and the runtime promotion
  contract (opus for reviewer via `model_overrides`). Recorded in audit at
  `.pHive/audits/post-run/execute-a-0-audit-recovery-2026-06-05T21-15Z.yaml`
  under `substrate_findings`.

  This story sits in Slice 1 alongside `s-2-mode-resolver` (peer; both
  depend on `a-0`). Downstream mode-skill stories `d-4`, `dr-3`, `r-3`,
  `t-3` add `s-5` to their `depends_on` so the helper exists when they
  emit `agent()` call sites.
acceptance_criteria:
- 'Given `hive/lib/cc-workflows-model-tier.mjs` exists, when `resolveModelTier(persona, ctx)` is invoked with `ctx.config` carrying `model_tiers` and `model_overrides`, then it returns `{tier: "sonnet"|"opus"|"haiku", source: "model_overrides"|"model_tiers"|"default"}` where the precedence is `model_overrides` > `model_tiers` > default.'
- Given a persona has both a `model_tiers` base assignment AND a `model_overrides` entry, when the helper is invoked, then it returns the `model_overrides` value and records `source: "model_overrides"`.
- Given a persona has only a `model_tiers` assignment, when the helper is invoked, then it returns the base tier and records `source: "model_tiers"`.
- Given a persona is not present in either `model_tiers` or `model_overrides`, when the helper is invoked, then it returns `{tier: "sonnet", source: "default"}` AND emits a one-line WARN naming the unmapped persona.
- Given `skills/hive/skills/execute-mode-cc-workflows/SKILL.md` Step 1.5 (`workflow_assembly`), when the assembled Workflow script emits one `agent()` call per `(story, step)` pair, then every `agent()` call carries an explicit `opts.model` value sourced from `cc-workflows-model-tier` resolver — no `agent()` call may omit `opts.model`.
- Given `skills/hive/skills/plan-mode-cc-workflows/SKILL.md` (already shipped), when its `workflow_assembly` emits `agent()` calls, then every call carries `opts.model` from the helper (back-fit).
- Given the future cc-workflows mode skills `d-4`, `dr-3`, `r-3`, `t-3` are authored in this epic, when they emit `agent()` calls, then they import and call the helper. The substrate-fitness lint introduced by `s-3-no-codex-lint` MUST be extended to check that every `agent()` call in any `*-mode-cc-workflows/SKILL.md` carries an `opts.model` resolved via the helper.
- Given a cc-workflows-mode dispatch completes, when the terminal `cc-workflows-run.yaml` episode marker is written, then it records under `field_sources.agent_models` a map of `phase -> {persona, tier, source}` for every dispatched agent.
- Given unit tests at `hive/lib/test/cc-workflows-model-tier.test.mjs` run under `npm test`, when the test command executes, then all four precedence cases pass (override-wins, base-tier-only, default+WARN, both-present) AND a snapshot test confirms the resolver output is byte-stable for a representative input fixture.
- DO. Match the `{tier, source}` shape conventions of the existing `hive/lib/mode-resolver.mjs` `{decision, sources}` pattern so downstream audit tooling can consume both helpers uniformly.
- DO NOT. Do not read persona frontmatter `model:` from agent files — frontmatter is documentation, not runtime config (per `feedback_frontmatter_base_tier_not_override`). The helper MUST resolve from `hive.config.yaml` only.
- DO NOT. Do not fall back to the parent session model on unmapped personas — the explicit default+WARN is what surfaces config gaps in the audit record.
