design_decisions:
- decision: Helper returns `{tier, source}` not just tier
  rationale: matches existing `mode-resolver.mjs` `{decision, sources}` shape; field_sources audit needs the source attribution
- decision: Default unmapped personas to sonnet with WARN, not to parent session model
  rationale: 14 of 17 personas in model_tiers are sonnet; explicit default + WARN surfaces config gaps in audit instead of silently inheriting opus
- decision: Read only from hive.config.yaml — never from persona frontmatter
  rationale: per feedback_frontmatter_base_tier_not_override — frontmatter is base-tier documentation, config is runtime promotion; reading both would create dual sources of truth
