  description: Mode-skill workflow_assembly steps differ in shape; a mechanical apply may miss an emit site
  mitigation: research step explicitly maps every emit site before implement; substrate-fitness lint (s-3) catches any skipped site at lint time
- severity: low
  description: model_overrides could specify a tier string not in {opus, sonnet, haiku}
  mitigation: helper returns the configured string with source=model_overrides; downstream Workflow tool validates the tier; helper does not silently rewrite the value
