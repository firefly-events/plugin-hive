code_examples:
- language: javascript
  description: Helper signature
  snippet: |
    // hive/lib/cc-workflows-model-tier.mjs
    export function resolveModelTier(persona, ctx) {
      const overrides = ctx.config?.model_overrides ?? {};
      if (overrides[persona]) return { tier: overrides[persona], source: 'model_overrides' };
      const tiers = ctx.config?.model_tiers ?? {};
      for (const [tier, personas] of Object.entries(tiers)) {
        if (Array.isArray(personas) && personas.includes(persona)) {
          return { tier, source: 'model_tiers' };
        }
      }
      console.warn(`[cc-workflows-model-tier] persona "${persona}" unmapped — defaulting to sonnet`);
      return { tier: 'sonnet', source: 'default' };
    }
    export default resolveModelTier;
- language: javascript
  description: Emit-site pattern in workflow_assembly
  snippet: |
    import { resolveModelTier } from 'hive/lib/cc-workflows-model-tier.mjs';
    const { tier, source } = resolveModelTier(persona, { config: hive_config });
    // assembled agent() call:
    `const r = await agent(prompt, { schema, phase, label, model: '${tier}' });`
