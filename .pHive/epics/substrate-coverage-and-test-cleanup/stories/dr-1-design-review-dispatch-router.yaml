acceptance_criteria:
- Given `skills/hive/skills/design-review-dispatch/SKILL.md` is created, when it executes Step 0, then it invokes `resolveMode('HIVE_DESIGN_REVIEW_MODE', ctx)` from `hive/lib/mode-resolver.mjs`.
- Given Step 1 runs, when `mode_decision` is `multica`, then it routes to `design-review-mode-multica`; when `mode_decision` is `cc-workflows`, then it routes to `design-review-mode-cc-workflows`.
- Given Step 2 runs, when the router returns to the caller, then it emits `{mode_decision, sources}`.
- Given `skills/design-review/SKILL.md` is updated, when /design-review is invoked, then Phase 0 invokes `design-review-dispatch` BEFORE the existing 3-persona pipeline.
- Given `--skip` and `--artifact-target` flags are passed, when the dispatcher routes through the chosen mode atom, then both flags continue to work end-to-end (no semantic change).
- Given the router structurally mirrors `skills/hive/skills/execute-dispatch/SKILL.md`, when a reader compares Step 0/1/2 shapes, then they are structurally identical.
- Given the vitest resolution test runs, when 5-tier permutations are exercised, then mode_decision and sources emit correctly.
- DO. Mirror execute-dispatch structure verbatim. Preserve `--skip` + `--artifact-target` semantics.
- DO NOT. Change the 3-persona pipeline contract — substrate parity slice with NO semantic change.
