name: task-tracking-adapter-abi
title: Task-Tracking Adapter ABI (Epic C)
description: |
  Third in-flight epic from hive-composability-audit recommendation (2026-05-08).
  Defines an executable Application Binary Interface (ABI) for task_tracking.adapter,
  replacing today's prose-runbook adapters (Linear, GitHub) with pluggable code modules.

  Promoted from deferred follow-on (was Epic E in original audit) to in-flight per
  user course-correction 2026-05-08:
    - Backlog-and-run direction (set up backlog, let agents run) requires executable
      tracker calls, not "read this prose runbook"
    - ABI is foundational substrate, not optional
    - ABI is hierarchy-agnostic — adapters declare flat or hierarchical capability;
      ABI accommodates both (atoshell flat IDs, Linear hierarchical, GitHub mixed)

  First story is FORM-FACTOR SELECTION — TS interface vs MCP server vs CLI contract.
  Subsequent stories implement the ABI and migrate Linear + GitHub from prose-runbooks
  as ABI validators.

  This epic is one of three required for 2.0 (with catalog-hygiene-and-borrows
  and structural-refactor-and-gate-lift). Parallel-able with both — no upstream gates.

target_codebase: /Users/don/Documents/plugin-hive
methodology: classic
scale: medium
branch: feat/task-tracking-adapter-abi
parent_audit: hive-composability-audit
milestone: hive-2.0

planning_artifacts:
  - ../hive-composability-audit/docs/recommendation.md       # Section 3 (post-review) + Section 7 Epic C
  - ../hive-composability-audit/spikes/atoshell/findings.md  # data-model context: hierarchy-agnostic justification

dependencies:
  blocks:
    - atoshell-reconsider                  # Epic E post-2.0; only if user reopens
  blocked_by: []                           # parallel to Epic A and Epic B

stories:
  - id: c-1-form-factor-selection
    title: Select ABI form factor — TS interface vs MCP server vs CLI contract
    complexity: medium
    depends_on: []
    description_summary: |
      Evaluate three form factors against:
        - Pluggability (how easy to add a new adapter)
        - Cross-process boundary (do adapters run in-process or out-of-process)
        - Hive-side invocation cost (function call vs MCP RPC vs subprocess)
        - User-facing complexity (does user write TS, JSON, or shell)
        - Hierarchy-agnostic carry (how each form factor expresses flat-vs-hierarchical capability)
      Output: decision doc + ABI sketch in chosen form factor.

  - id: c-2-abi-specification
    title: Author ABI specification — methods, types, hierarchy-agnostic capability declaration
    complexity: high
    depends_on: [c-1-form-factor-selection]
    description_summary: |
      Specify required methods (createStory, updateStatus, listOpen, getStory, etc.),
      type signatures, error model, and capability declaration mechanism for
      hierarchical-vs-flat trackers. ABI must accommodate Linear (hierarchical via
      parent issue), GitHub (mixed — issues flat, projects hierarchical), and any
      future flat tracker (atoshell-if-revisited).

  - id: c-3-github-adapter-as-abi-validator
    title: Implement GitHub adapter against new ABI as first validator
    complexity: high
    depends_on: [c-2-abi-specification]
    description_summary: |
      Migrate existing GitHub prose-runbook to executable adapter implementing the
      ABI. Validates ABI against real (mixed-hierarchy) tracker. Capture friction
      points and revise ABI if needed.

  - id: c-4-linear-adapter-as-abi-validator
    title: Implement Linear adapter against new ABI as second validator
    complexity: high
    depends_on: [c-2-abi-specification]
    description_summary: |
      Migrate existing Linear prose-runbook to executable adapter. Validates ABI
      against hierarchical tracker. Together with GitHub, confirms ABI accommodates
      both flat and hierarchical models without per-tracker hacks.

  - id: c-5-hive-config-adapter-registration
    title: Wire hive.config.yaml adapter registration + Hive-side dispatch
    complexity: medium
    depends_on: [c-3-github-adapter-as-abi-validator, c-4-linear-adapter-as-abi-validator]
    description_summary: |
      Add hive.config.yaml task_tracking section (adapter: github | linear | custom-path).
      Implement Hive-side dispatch that resolves the configured adapter and routes ABI
      calls. Default behavior on no-config follows paths.gate_mode (warning vs hard).

  - id: c-6-migration-guide-and-prose-runbook-deprecation
    title: Document migration from prose-runbook to executable adapter; deprecate prose paths
    complexity: small
    depends_on: [c-5-hive-config-adapter-registration]
    description_summary: |
      Migration guide for users with custom prose-runbook adapters. Mark prose paths
      as deprecated with one-release deprecation window. Update kickoff + plan + execute
      to use ABI dispatch instead of prose-runbook references.

acceptance_criteria:
  - "Form-factor decision documented with rationale; one form factor (TS / MCP / CLI) selected"
  - "ABI specification published with required methods, type signatures, error model, capability declaration"
  - "GitHub adapter implemented against ABI; passes integration tests against real GitHub repo"
  - "Linear adapter implemented against ABI; passes integration tests against real Linear workspace"
  - "ABI proven hierarchy-agnostic — both adapters work without per-tracker special-casing"
  - "hive.config.yaml task_tracking section documented; adapter dispatch works for both adapters"
  - "Migration guide published; prose-runbook references in kickoff/plan/execute updated to ABI dispatch"
  - "Atoshell evaluable as candidate adapter under ABI (Epic E unblocked if user reopens)"

out_of_scope:
  - "Atoshell adoption — atoshell-the-tool stays SKIP per Section 3 vendor-fork burden + API correction; Epic E only if user reopens"
  - "Sandbox substrate (sandcastle follow-on) — Epic D post-2.0"
  - "Custom adapters for other trackers (Jira, Asana, etc.) — community contribution path"

risks:
  - severity: high
    description: Form-factor selection wrong — TS chosen but MCP would have been right (or vice versa); rework cost is high
    mitigation: Form-factor story (c-1) has explicit evaluation rubric; ABI prototype against 2 form factors before final commit if uncertainty remains
  - severity: medium
    description: ABI design fails to accommodate hierarchical + flat trackers cleanly; per-tracker hacks creep in
    mitigation: Two adapter validators (GitHub mixed, Linear hierarchical) chosen specifically to surface this; ABI revised after validator implementation if friction detected
  - severity: medium
    description: Linear / GitHub adapter migration breaks user workflows mid-flight
    mitigation: Prose-runbook paths deprecated with one-release window; Hive falls back to prose-runbook if ABI dispatch fails (transitional)
