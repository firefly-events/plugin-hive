      Section 3 — c-2 specifies required methods, type signatures, error model,
      and capability declaration mechanism for hierarchical-vs-flat trackers.
      ABI must accommodate Linear (hierarchical via parent issue), GitHub
      (mixed — issues flat, projects hierarchical), and any future flat
      tracker (atoshell-if-revisited).
