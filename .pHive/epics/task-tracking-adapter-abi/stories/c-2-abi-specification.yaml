design_decisions:
  - decision: 'Capability declaration is a separate concern from method signatures'
    rationale: 'Hive-side dispatch checks capabilities BEFORE invoking; conflating them forces every method call to do capability inspection, which adds latency and obscures the contract.'
  - decision: 'Error model uses tagged union for recoverable vs terminal, not exceptions-everywhere'
    rationale: 'Recoverable errors (rate-limit, transient) are routine and should not crash callers; terminal errors (auth-failed, schema-mismatch) are programmer or config problems. Mixing them as exceptions loses that distinction.'
  - decision: 'ABI is semver-versioned independently of Hive version'
    rationale: 'Adapters and Hive evolve at different cadences. Pinning the ABI to Hive version forces simultaneous releases. Separate versioning lets adapters declare ABI 1.x and run against any compatible Hive.'

cross_cutting:
  - concern: observability
    action: 'Spec documents that adapter invocations are wrapped by Hive-side dispatch (introduced in c-5) which captures telemetry. The ABI itself does not mandate logging.'

risks:
  - severity: high
    description: 'Spec inconsistency — method requires a capability not declared, or capability declared but never read'
    mitigation: 'Self-consistency grep check in test step (AC §7); reviewer stress-tests with hypothetical custom adapter author scenario'
  - severity: medium
    description: 'Error model fails to cover a real-world failure category — surfaces during c-3/c-4 implementation'
    mitigation: 'c-3/c-4 are explicitly chartered to flag friction and revise ABI; c-2 publication is not frozen — minor revisions allowed during validator implementation'
  - severity: medium
    description: 'Capability declaration too rigid — atoshell-future or new tracker cannot express its shape cleanly'
    mitigation: 'Open enum for hierarchy field (flat | hierarchical | mixed | other); capability object allows arbitrary extension keys with adapter-declared semantics'

