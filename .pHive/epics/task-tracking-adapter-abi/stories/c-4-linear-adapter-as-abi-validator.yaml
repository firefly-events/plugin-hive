id: c-4-linear-adapter-as-abi-validator
epic: task-tracking-adapter-abi
title: Implement Linear adapter against new ABI as second validator
status: in_progress
complexity: high
methodology: classic
depends_on: [c-2-abi-specification]
wave: W3
action_id: C-4

description: |
  Migrate the existing Linear prose-runbook adapter to an executable adapter
  implementing the ABI from c-2. Parallel sibling to c-3 (GitHub) — both
  depend on c-2 only, can land in either order.

  Linear's hierarchy is HIERARCHICAL: teams contain projects, projects
  contain issues, issues can have parent-issue links. This shape stress-
  tests the ABI's parent-link semantics and team/project capability fields,
  complementary to GitHub's mixed shape.

  Validator charter (same as c-3) — this story is allowed to:
    1. Flag ABI gaps and request c-2 revisions (one revision cycle max,
       coordinated with c-3 if c-3 already requested a revision)
    2. Document Linear-specific friction in friction-notes.md
    3. Defer non-essential Linear features (cycles, triage, custom views)
       to a future enhancement story

  Output:
    - hive/adapters/linear/index.<ext> (extension per c-1 form factor)
    - hive/adapters/linear/README.md (adapter author notes + Linear caveats)
    - hive/adapters/linear/test/*.test.<ext>
    - hive/adapters/linear/friction-notes.md

  Together with c-3, this story proves the ABI is hierarchy-agnostic: a
  hierarchical adapter (Linear) and a mixed adapter (GitHub) both implement
  the same ABI without Hive-side per-tracker hacks.

acceptance_criteria:
  - 'hive/adapters/linear/index.<ext> exists and implements all 6 ABI methods'
  - 'Adapter declares capabilities as `hierarchy: hierarchical` with team + project metadata in capability object'
  - 'Integration tests cover every ABI method with happy path + at least one error path (rate limit OR auth failure OR not-found)'
  - 'Tests pass against a real Linear workspace (LINEAR_TEST_TEAM + LINEAR_API_KEY env) OR a documented mock server fixture'
  - 'No Linear-specific code leaks into Hive core — all Linear-specifics live in hive/adapters/linear/'
  - 'Adapter README documents auth (LINEAR_API_KEY OR linearis OAuth) and the hierarchical mapping (team / project / parent-issue)'
  - 'friction-notes.md exists (may be empty)'
  - 'Combined with c-3, demonstrates ABI is genuinely hierarchy-agnostic — same Hive-side dispatch invokes both without branching on tracker type'

steps:
  - id: research
    description: |
      1. Read hive/references/task-tracking-adapter-abi.md (c-2 spec).
      2. Read existing Linear prose-runbook at hive/references/task-tracking-adapter-linear.md if present.
      3. Query context7 for Linear GraphQL SDK docs covering: issueCreate, issueUpdate, issues (filtered list), issue (by id), commentCreate, parent-issue field.
      4. Decide auth mechanism: LINEAR_API_KEY env OR linearis OAuth (per memory feedback). Document tradeoff.
      5. Decide test strategy: real workspace vs mock GraphQL. Real workspace preferred; mock fallback for CI.
      6. Map Linear concepts to ABI capabilities: team = capability metadata, project = capability metadata, parent-issue = parent_id field on stories.
      7. Coordinate with c-3 status — if c-3 in progress and surfacing ABI gaps, pause this story until c-3 either lands or its requested ABI revisions ship in c-2.
    agent: researcher

  - id: implement
    description: |
      1. Scaffold hive/adapters/linear/ in the c-1 form factor.
      2. Implement capability declaration — `hierarchy: hierarchical`, supportsLabels: true, supportsAssignees: true, supportsParent: true, plus Linear-specific `team_id` + `project_id` in extensions.
      3. Implement all 6 ABI methods. Map ABI → Linear GraphQL:
         - createStory → mutation issueCreate
         - updateStatus → mutation issueUpdate (state)
         - listOpen → query issues (filter: state.type IN [unstarted, started])
         - getStory → query issue(id)
         - addComment → mutation commentCreate
         - linkStories → mutation issueUpdate (parentId)
      4. Implement error mapping — auth-failed (401) → terminal; complexity-limit/rate-limit → recoverable; entity-not-found → terminal.
      5. Write hive/adapters/linear/README.md.
      6. Write hive/adapters/linear/friction-notes.md.
    agent: developer
    depends_on: [research]

  - id: test
    description: |
      1. Run integration tests against real test workspace (env: LINEAR_TEST_TEAM, LINEAR_API_KEY); skip if env unset and document the skip in friction-notes.md.
      2. Verify all 6 methods invoked.
      3. Force at least one error path: invalid key → terminal auth-failed; oversized query → complexity-limit recoverable.
      4. Verify capability declaration parses against c-2 schema.
      5. Verify no Linear-specific code outside hive/adapters/linear/.
      6. yamllint on this story file.
    agent: tester
    depends_on: [implement]

  - id: review
    description: |
      Opus 4.7 reviewer cross-LLM gate:
      1. Verify hierarchy-agnostic carry — Hive-side code calling listOpen does not know about Linear teams/projects; it consumes capability metadata generically.
      2. Verify error mapping covers Linear-specific cases (GraphQL complexity limit, soft-delete, archived states).
      3. Verify parent-issue linking works correctly (linkStories with hierarchical adapter).
      4. Compare friction-notes.md against c-3's friction-notes.md — any common gap was already addressed in c-2 revision, or is documented as known limitation.
      5. Stress-test: can the adapter pattern handle Linear's "cycle" concept if added in a future story (or is it inherently un-modelable in this ABI)?
    agent: reviewer
    depends_on: [test]

  - id: integrate
    description: 'Commit on feat/task-tracking-adapter-abi; commit message format `feat(adapter-abi): Linear adapter as ABI validator (story c-4-linear-adapter-as-abi-validator, W3)`.'
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  tech_stack:
    languages: [typescript, json, yaml, markdown, graphql]
    frameworks: [hive-adapters, linear-sdk, linearis]
  key_files:
    - path: hive/references/task-tracking-adapter-abi.md
      purpose: 'Input — canonical ABI spec from c-2'
    - path: hive/adapters/linear/index.<ext>
      purpose: 'NEW — adapter source; primary deliverable'
    - path: hive/adapters/linear/test/
      purpose: 'NEW — integration tests against ABI methods'
    - path: hive/adapters/linear/friction-notes.md
      purpose: 'NEW — friction log; complements c-3 friction-notes for hierarchy-agnostic verification'
    - path: hive/references/task-tracking-adapter.md
      purpose: 'Current prose contract'

design_decisions:
  - decision: 'team_id and project_id live in capability extensions, not as required parameters on every method'
    rationale: 'Linear requires team_id for createStory but other trackers do not. Putting team_id in capability extensions lets the adapter capture it once at init time; methods stay generic. GitHub-equivalent is owner/repo, also captured at init.'
  - decision: 'Parent-issue linking via linkStories method, not as createStory parameter'
    rationale: 'Some trackers do not support parent links; conflating createStory + parent assignment forces every adapter to handle the optional parent_id parameter. linkStories as a separate capability-gated method keeps createStory simple.'
  - decision: 'c-3 + c-4 explicitly parallel even though c-4 could wait for c-3 friction-notes'
    rationale: 'Sequential cost is high (c-4 cannot start until c-3 review lands). Coordination during c-4 research step is cheaper. Risk of duplicated ABI revision work managed by research step coordination.'

cross_cutting:
  - concern: observability
    action: 'Hive-side dispatch (c-5) wraps adapter calls; adapter itself emits no telemetry. friction-notes is per-story log.'
  - concern: backward-compatibility
    action: 'Linear prose-runbook stays present during c-4; deprecation in c-6.'

risks:
  - severity: high
    description: 'Hierarchical-only mapping forces fake hierarchy in Hive code that does not need it (e.g., when targeting flat trackers via the same ABI)'
    mitigation: 'Linear adapter capability declaration carries hierarchy metadata; consumers branch on capability, not adapter type. c-3 mixed-hierarchy validation catches any leak.'
  - severity: medium
    description: 'Linear API complexity-limit causes test flakes in CI'
    mitigation: 'Recoverable error handling with backoff documented; tests use small batch sizes; complexity-limit timing recorded in friction-notes'
  - severity: medium
    description: 'linearis OAuth flow not yet automated for CI'
    mitigation: 'LINEAR_API_KEY fallback documented; linearis OAuth used for interactive dev; CI uses API key from secrets'
  - severity: low
    description: 'Linear SDK version drift'
    mitigation: 'Adapter pins SDK in own package.json'

references:
  - path: hive/references/task-tracking-adapter-abi.md
    relevant_excerpt: |
      hierarchy: hierarchical — adapter declares that stories form a parent-child
      tree; linkStories method establishes parent relationships; listOpen
      results may include parent_id field; Hive-side dispatch reads capability
      to decide whether to surface hierarchy in epic/story views.
  - path: .pHive/epics/hive-composability-audit/docs/recommendation.md
    relevant_excerpt: |
      Section 3 — c-4 Linear adapter validates ABI against hierarchical tracker.
      Together with GitHub (c-3, mixed), confirms ABI accommodates both flat
      and hierarchical models without per-tracker hacks.
