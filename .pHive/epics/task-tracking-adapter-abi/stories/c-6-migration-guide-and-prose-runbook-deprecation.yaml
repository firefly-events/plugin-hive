design_decisions:
  - decision: 'One-release deprecation window, removal at release N+1'
    rationale: 'Two-release window is conservative but slow; same-release removal breaks users mid-cycle. One-release is the balance — users see deprecation warning in release N, removal lands in release N+1.'
  - decision: 'Migration guide does not advise on signed/sandboxed custom adapters'
    rationale: 'Custom adapter security is c-5 design decision (run with full Hive permissions). Migration guide reflects current state; future enhancement story owns sandbox/signing.'
  - decision: 'prose_runbook_fallback telemetry is informational in v1, not threshold-driven'
    rationale: 'a-36 audit thresholds are about gate_mode flip decision; prose-runbook removal is a separate decision with a different timeline. Lumping them together would conflate two release decisions.'

cross_cutting:
  - concern: observability
    action: 'Prose-runbook-fallback event introduced; documented in gate-lift-telemetry.md; aggregated by gate-mode-audit.mjs for data-driven removal date.'
  - concern: backward-compatibility
    action: 'Deprecation is announced, not enforced; one-release window protects users; removal is data-driven via telemetry.'

risks:
  - severity: low
    description: 'Migration guide misses a custom-adapter use case; user with edge-case prose-runbook gets stuck'
    mitigation: 'Migration guide explicitly invites issue reports; one-release deprecation window provides time to address gaps before removal'
  - severity: low
    description: 'Removal target slips because no one tracks the date'
    mitigation: 'Telemetry-driven removal — prose-runbook-fallback event count over the deprecation window informs whether to remove on schedule or extend'

