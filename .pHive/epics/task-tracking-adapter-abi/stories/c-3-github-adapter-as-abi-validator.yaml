design_decisions:
  - decision: 'GitHub hierarchy declared as mixed, not flat or hierarchical'
    rationale: 'GitHub issues are flat siblings within a repo, but Projects v2 + sub-issues introduce hierarchy. Declaring flat loses the hierarchy carry; declaring hierarchical forces fake parent IDs for plain issues. Mixed lets capability consumers reason about both.'
  - decision: 'Auth via gh CLI preferred over raw GITHUB_TOKEN'
    rationale: 'gh CLI reuses user auth, handles token refresh, and is already a dependency of many Hive workflows. Raw token is fallback for CI environments without gh installed.'
  - decision: 'friction-notes.md is a mandatory deliverable even when empty'
    rationale: 'Forcing the file to exist creates a habit — every validator surfaces friction or explicitly documents that none was found. Empty file is also a signal.'

cross_cutting:
  - concern: observability
    action: 'Hive-side dispatch (c-5) wraps adapter calls with telemetry; adapter itself emits no telemetry. Friction-notes is a per-story log, not runtime telemetry.'
  - concern: backward-compatibility
    action: 'GitHub prose-runbook stays present during c-3; deprecation happens in c-6 after both validators land.'

risks:
  - severity: high
    description: 'Mixed-hierarchy mapping surfaces ABI gap that requires non-trivial c-2 revision; ripples to c-4 (Linear adapter) parallel work'
    mitigation: 'c-3/c-4 are explicitly chartered to flag ABI gaps; one revision cycle allowed; if revision is non-trivial, c-4 pauses and waits for revised spec'
  - severity: medium
    description: 'Real-repo integration tests require GitHub repo provisioning; CI environments may lack credentials'
    mitigation: 'Mock server fallback documented in friction-notes.md; tests skip with explanation rather than fail when GITHUB_TEST_REPO unset'
  - severity: low
    description: 'Octokit version drift causes adapter to break on Hive upgrade'
    mitigation: 'Adapter pins octokit version in its own package.json; Hive does not transitively own this dependency'

references:
  - path: hive/references/task-tracking-adapter-abi.md
    relevant_excerpt: |
      Capability declaration mechanism: adapter exports a capabilities()
      method returning a capability object. Required keys: hierarchy
      (flat | hierarchical | mixed | other), supportsLabels, supportsAssignees,
      supportsParent. Optional keys: adapter-specific extensions.
  - path: .pHive/epics/hive-composability-audit/docs/recommendation.md
    relevant_excerpt: |
      Section 3 — c-3 GitHub adapter validates ABI against mixed-hierarchy
      tracker (issues flat, Projects v2 hierarchical). Captures friction points
      and revises ABI if needed. Together with c-4 Linear adapter, confirms ABI
      accommodates both flat and hierarchical models without per-tracker hacks.
