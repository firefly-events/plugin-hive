id: c-1-form-factor-selection
epic: task-tracking-adapter-abi
title: Select ABI form factor — TS interface vs MCP server vs CLI contract
status: pending
complexity: medium
methodology: classic
depends_on: []
wave: W1
action_id: C-1

description: |
  First story of Epic C (task-tracking-adapter-abi). Selects the executable
  form factor for the task_tracking.adapter ABI before specification work
  begins in c-2.

  Three candidates evaluated:
    1. TS interface — Node-side module loaded in-process; adapter implements
       an exported interface; Hive imports and invokes function calls.
    2. MCP server — Out-of-process JSON-RPC server; Hive invokes ABI methods
       as MCP tool calls; adapter runs as a child process or installed MCP.
    3. CLI contract — Subprocess invocation with JSON-over-stdio; adapter is
       a binary or script; Hive spawns and communicates via structured I/O.

  Five evaluation axes (verbatim from epic.yaml — every form factor scored
  against all five, no axis dropped):
    - Pluggability — how easy to add a new adapter
    - Cross-process boundary — in-process vs out-of-process tradeoffs
    - Hive-side invocation cost — function call vs MCP RPC vs subprocess spawn
    - User-facing complexity — does the user write TS, JSON, or shell
    - Hierarchy-agnostic carry — how each form factor expresses
      flat-vs-hierarchical capability declaration

  Output is twofold:
    1. Decision doc at .pHive/epics/task-tracking-adapter-abi/docs/form-factor-decision.md
       capturing the rubric, scores, rationale, and chosen form factor.
    2. ABI sketch at hive/references/task-tracking-adapter-abi-sketch.md in
       the chosen form factor; this sketch is the input to c-2 specification.

  The form-factor decision gates all downstream work. c-2 specifies methods
  + types ON the chosen form factor; c-3 + c-4 implement validator adapters
  IN the chosen form factor; c-5 wires Hive-side dispatch FOR the chosen
  form factor.

acceptance_criteria:
  - 'Decision doc at .pHive/epics/task-tracking-adapter-abi/docs/form-factor-decision.md exists with all 5 evaluation axes scored against all 3 candidates'
  - 'One form factor selected with explicit rationale citing the 5-axis scores'
  - 'ABI sketch at hive/references/task-tracking-adapter-abi-sketch.md exists in the chosen form factor with at least one method stub (createStory) and one capability declaration stub'
  - 'Sketch demonstrates hierarchy-agnostic carry — capability declaration handles flat (atoshell), hierarchical (Linear), and mixed (GitHub) without per-tracker special-casing'
  - 'Rework-cost risk addressed: if any axis tied within 1 point of the winner, sketch is written for BOTH tied candidates before final commit (per epic risk mitigation §1)'
  - 'Decision doc references real benchmark numbers for invocation cost (function call ~100ns, MCP RPC ~ms, subprocess spawn ~10ms) — not hand-waves'
  - 'User-facing complexity axis surfaces example adapter for each form factor (10-20 line stub) so the user can see what custom adapter authors write'

steps:
  - id: research
    description: |
      1. Read .pHive/spikes/atoshell/atoshell-adapter-runbook.md to lock the prose-runbook shape being replaced.
      2. Read hive/references/task-tracking-adapter.md for current adapter contract.
      3. Query context7 for MCP server docs (Anthropic MCP spec) — confirm tool-call shape + cost.
      4. Capture cross-process cost benchmarks: in-process function call vs MCP RPC vs subprocess+JSON (use Node fs.spawn timing as proxy if no direct benchmark available).
      5. Sketch capability-declaration mechanisms for each form factor (TS: typed enum + record; MCP: JSON schema; CLI: stdout descriptor).
    agent: researcher

  - id: implement
    description: |
      1. Write .pHive/epics/task-tracking-adapter-abi/docs/form-factor-decision.md (~300 lines) covering:
         - One section per axis (5 axes)
         - Per-axis 3-candidate scoring table with rationale
         - Aggregate score + decision
         - Tied-axis handling per AC §5
      2. Write hive/references/task-tracking-adapter-abi-sketch.md in the chosen form factor:
         - Method stub for createStory (story title, body, labels, parent_id-optional)
         - Capability declaration stub showing flat vs hierarchical vs mixed
         - Example custom-adapter author stub (10-20 lines) per AC §7
      3. Update epic.yaml `planning_artifacts:` to list the new decision doc + sketch.
    agent: developer
    depends_on: [research]

  - id: test
    description: |
      1. Markdown lint the two new files (`markdownlint`).
      2. Verify all 5 axes covered with `grep -c '^## .* Axis' form-factor-decision.md` ≥ 5.
      3. Verify chosen form factor stub compiles/parses (TS → `tsc --noEmit`; MCP → JSON schema valid via ajv; CLI → shellcheck on stub).
      4. Verify capability declaration handles all 3 hierarchy types (grep for `flat`, `hierarchical`, `mixed` in sketch).
      5. yamllint -c .yamllint.yml on this story file.
    agent: tester
    depends_on: [implement]

  - id: review
    description: |
      Opus 4.7 reviewer (per hive.config.yaml model_overrides) cross-LLM gate:
      1. Verify rubric coverage — every axis has 3 candidate scores with rationale.
      2. Verify decision is justified by the rubric scores, not gut feel.
      3. Verify sketch is concrete enough to feed c-2 specification (not just hand-waves).
      4. Verify hierarchy-agnostic carry actually works for all 3 cases per AC §4.
      5. Flag any axis where the rationale leans on assumption rather than evidence.
    agent: reviewer
    depends_on: [test]

  - id: integrate
    description: 'Commit on feat/task-tracking-adapter-abi; commit message format `feat(adapter-abi): form-factor decision + ABI sketch (story c-1-form-factor-selection, W1)`.'
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  tech_stack:
    languages: [markdown, typescript, json, yaml]
    frameworks: [hive-orchestrator, hive-references, mcp]
  key_files:
    - path: .pHive/spikes/atoshell/atoshell-adapter-runbook.md
      purpose: 'Source — the prose-runbook prototype being replaced; informs the user-facing complexity axis'
    - path: hive/references/task-tracking-adapter.md
      purpose: 'Current adapter contract — baseline for what the ABI must preserve or improve'
    - path: .pHive/epics/hive-composability-audit/docs/recommendation.md
      purpose: 'Section 3 — adapter direction rationale; ABI promotion justification'
    - path: hive/references/task-tracking-adapter-abi-sketch.md
      purpose: 'NEW — output of this story; input to c-2-abi-specification'
    - path: .pHive/epics/task-tracking-adapter-abi/docs/form-factor-decision.md
      purpose: 'NEW — output of this story; gates the entire epic'

design_decisions:
  - decision: 'Form-factor selection precedes ABI specification (c-2)'
    rationale: 'ABI method shape depends on form factor — TS exports a typed interface, MCP exposes a JSON schema, CLI documents a stdio contract. Specifying ABI before picking form factor risks rewriting the spec.'
  - decision: 'Tied-axis handling forces prototype-then-decide on close calls'
    rationale: 'High risk from epic.yaml §1 — wrong form-factor choice has high rework cost. Prototype-both-then-decide on ties caps the worst-case rework to a single-axis prototype rather than full implementation.'
  - decision: 'Decision doc captures rubric scores, not just the winner'
    rationale: 'Future revisits (atoshell-reconsider, new tracker types) need to see why each axis scored as it did so they can re-evaluate without rerunning the whole rubric.'

cross_cutting:
  - concern: observability
    action: 'Decision doc + sketch are the only deliverables; no runtime telemetry. Audit trail lives in the doc itself + git history.'

risks:
  - severity: high
    description: 'Form-factor decision wrong (TS chosen but MCP would have been right, or vice versa); rework cost is high since c-2/c-3/c-4 all build on this'
    mitigation: 'Tied-axis prototyping per AC §5 caps the rework to a single prototype rather than full ABI rewrite; explicit evaluation rubric forces evidence-based choice over gut feel'
  - severity: medium
    description: 'Hierarchy-agnostic carry only validated against TWO trackers (Linear + GitHub) — atoshell + future trackers may surface gaps the rubric missed'
    mitigation: 'Capability declaration stub uses an open enum (flat | hierarchical | mixed | other) — future trackers can extend without ABI revision; c-2 hardens this'

references:
  - path: .pHive/epics/hive-composability-audit/docs/recommendation.md
    relevant_excerpt: |
      Section 3 — task_tracking.adapter direction:
      ABI is foundational substrate, not optional. Adapters declare flat or
      hierarchical capability; ABI accommodates both without per-tracker
      special-casing. Form-factor selection (TS vs MCP vs CLI) is the gating
      decision before specification work begins.
  - path: .pHive/spikes/atoshell/atoshell-adapter-runbook.md
    relevant_excerpt: |
      Status: Spike prototype. Built to match shape of
      hive/references/task-tracking-adapter.md. Atoshell is a flat-file local
      ticket store. There is no remote board, no parent-child hierarchy. This
      runbook is structurally simpler than the Linear adapter — that simplicity
      is itself the central trade-off.
  - path: hive/references/task-tracking-adapter.md
    relevant_excerpt: |
      Current contract (prose-runbook): adapter declares status flow, label
      vocabulary, and command shapes. Hive references the runbook prose during
      kickoff/plan/execute hooks. ABI replaces prose references with executable
      method calls while preserving the declarative shape.
