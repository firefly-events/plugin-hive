design_decisions:
  - decision: 'Skills cite dispatch as a thin pass-through, not as a wrapper layer'
    rationale: 'Wrapping dispatch in skill-side helper functions would obscure the call site and duplicate error handling. Direct dispatch.invoke() at the citation point keeps the surface visible.'
  - decision: 'Prose-runbook citations stay in the skill files until c-6 deprecation'
    rationale: 'Some users have not migrated their custom prose-runbooks. Keeping the prose pointer present (now marked as fallback path) protects them during the deprecation window c-6 owns.'
  - decision: 'Fallback telemetry shares the .pHive/metrics/events/ directory with sibling events'
    rationale: 'Epic B a-36 audit script (gate-mode-audit.mjs) reads all *.jsonl events in that dir. Reusing the directory lets the audit generalize over event types without code changes; new event kinds surface in the details output for free.'

cross_cutting:
  - concern: observability
    action: 'Prose-runbook-fallback event count over the deprecation window informs c-6 removal timing; data-driven, not calendar-driven.'
  - concern: backward-compatibility
    action: 'Prose-runbook citations remain in skill files as deprecation pointers; hard mode preserves byte-equivalent block behavior; users on gate_mode: hard see no change.'

risks:
  - severity: medium
    description: 'Skill citation swap regresses prose-runbook behavior for users who have not migrated'
    mitigation: 'Prose-runbook citations remain as deprecation pointers; fallback telemetry surfaces actual usage; c-6 deprecation timing is data-driven.'
  - severity: medium
    description: 'Smoke test requires GitHub test repo provisioning; CI may lack credentials'
    mitigation: 'Smoke test skips with documented reason when env unset; mock server fallback path documented in adapter README from c-3.'
  - severity: low
    description: 'Per-skill warning text drifts from a-33/a-35 conventions over time'
    mitigation: 'Reviewer checklist (step 4) explicitly verifies warning shape against the Epic B convention.'

