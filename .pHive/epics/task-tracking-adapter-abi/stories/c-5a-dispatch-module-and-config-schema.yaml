id: c-5a-dispatch-module-and-config-schema
epic: task-tracking-adapter-abi
title: Hive-side dispatch module + hive.config.yaml task_tracking schema
status: in_progress
complexity: medium
methodology: classic
depends_on: [c-3-github-adapter-as-abi-validator, c-4-linear-adapter-as-abi-validator]
wave: W4
action_id: C-5a

description: |
  First half of the original c-5 (split per quality review — single-session
  scope concern with 6+ files modified).

  This story creates the dispatch module + config schema. Sibling c-5b
  handles the skill-citation swaps and prose-runbook-fallback telemetry.

  Config shape added to schema:
    task_tracking:
      adapter: github | linear | <path-to-custom-adapter>
      # adapter-specific config passed verbatim to adapter.init()
      github:
        owner: ...
        repo: ...
      linear:
        team_id: ...

  Dispatch module behavior:
    1. load(config) — resolves adapter name or path; imports module; calls
       init(config); caches handle.
    2. invoke(method, args) — calls adapter[method](args); maps errors to
       recoverable vs terminal per ABI.
    3. capability(field) — returns capability metadata from the handle.
    4. no-adapter handler — emits warning + telemetry when paths.gate_mode
       warning AND no adapter configured.

  Hard mode (paths.gate_mode: hard) preserves byte-equivalent behavior:
  tracker hooks hard-block when no adapter loaded.

  Sibling c-5b updates skills/kickoff/SKILL.md, skills/plan/SKILL.md,
  skills/execute/SKILL.md to call this dispatch instead of citing prose-
  runbooks.

acceptance_criteria:
  - 'hive/hive.config.yaml schema documents task_tracking.adapter field with valid values'
  - 'Root hive.config.yaml example block shows task_tracking with adapter: github | linear comments'
  - 'Dispatch module at hive/lib/task-tracking-dispatch/index.<ext> implements load + init + invoke + capability'
  - 'Dispatch caches adapter handle per session — no reload per invoke call'
  - 'Custom adapter loaded from filesystem path — `adapter: /path/to/my-adapter` resolves and validates ABI shape'
  - 'paths.gate_mode integration: warning mode emits no-adapter warning + proceeds; hard mode blocks'
  - 'No-adapter telemetry event written to .pHive/metrics/events/task-tracking-no-adapter-<ISO>.jsonl when warning mode fires'
  - 'Dispatch unit tests cover all 4 entry points (load happy/error, invoke happy/error, capability, no-adapter warning)'

steps:
  - id: research
    description: |
      1. Read hive/references/task-tracking-adapter-abi.md (c-2 spec) + the two adapters (hive/adapters/github/, hive/adapters/linear/) shipped by c-3 + c-4.
      2. Read hive/hive.config.yaml + root hive.config.yaml — identify task_tracking section if it exists, sketch the schema delta.
      3. Read Epic B story a-33 commit for paths.gate_mode semantics; confirm warning-vs-hard branch shape.
      4. Identify session-cache lifetime — per-process (long-lived Hive session) vs per-skill-invocation. Prefer per-process.
      5. Sketch dispatch module signatures (load, invoke, capability, telemetry hook).
    agent: researcher

  - id: implement
    description: |
      1. Update hive/hive.config.yaml schema with task_tracking block (adapter: null default + adapter-name sub-blocks).
      2. Update root hive.config.yaml with example block showing supported values + comments pointing at the ABI spec.
      3. Write hive/lib/task-tracking-dispatch/index.<ext>:
         - load(config): adapter name lookup (github | linear) or path resolution; module import; init(config) call; handle cache.
         - invoke(method, args): adapter method call; error mapping per ABI error model.
         - capability(field): cached read from handle.capabilities() output.
         - no-adapter handler: warning emit + JSONL write to .pHive/metrics/events/task-tracking-no-adapter-<ISO>.jsonl when gate_mode warning + adapter null.
      4. Write hive/lib/task-tracking-dispatch/README.md documenting public surface + cache lifetime.
    agent: developer
    depends_on: [research]

  - id: test
    description: |
      1. Unit-test load: load(github) → handle exposes all 6 ABI methods; load(nonexistent) → terminal error with clear message; load(/path/to/local/adapter) → handle when adapter is valid; load(/path/to/broken/adapter) → terminal error.
      2. Unit-test invoke: invoke(createStory, {...}) returns ABI-shaped result; invoke during rate-limit → recoverable Result; invoke during auth-fail → terminal Result.
      3. Unit-test capability: capability(hierarchy) returns the value from adapter.capabilities() result, cached.
      4. Unit-test no-adapter: dispatch.load(null) under gate_mode warning → warning logged, JSONL event written; under gate_mode hard → terminal error.
      5. Verify session cache: two consecutive invoke() calls share the same handle (no second init).
      6. yamllint on this story file.
    agent: tester
    depends_on: [implement]

  - id: review
    description: |
      Opus 4.7 reviewer cross-LLM gate:
      1. Verify dispatch is genuinely hierarchy-agnostic — no `if adapter === "github"` branching in dispatch.
      2. Verify session cache scoping — different state_dir + different adapter config hash produce different handles.
      3. Verify telemetry event shape matches sibling events from Epic B (gate-lift-*.jsonl, epic-create-on-fly-*.jsonl).
      4. Verify custom adapter path validation rejects ABI-broken modules with a clear error.
      5. Stress-test: dispatch survives adapter throwing unexpected exception (wraps in terminal error, does not crash Hive).
    agent: reviewer
    depends_on: [test]

  - id: integrate
    description: 'Commit on feat/task-tracking-adapter-abi; commit message format `feat(adapter-abi): dispatch module + config schema (story c-5a-dispatch-module-and-config-schema, W4)`.'
    agent: developer
    depends_on: [review]

