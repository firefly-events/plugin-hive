design_decisions:
  - decision: 'Built-in adapter names (github, linear) shortcut filesystem paths'
    rationale: 'Most users use Linear or GitHub. Forcing them to write `adapter: /path/to/hive/adapters/github/` is friction. Built-in name lookup with custom-path fallback covers both ergonomics and extensibility.'
  - decision: 'Session-cached adapter handle, not per-invocation reload'
    rationale: 'Adapter init may do auth handshake. Per-invocation reload adds latency and API calls. Session cache is single-process; concurrency concerns minimal.'
  - decision: 'No-adapter warning telemetry mirrors a-33/a-35 JSONL shape, not a new event family'
    rationale: 'Epic B story a-36 audit script (gate-mode-audit.mjs) aggregates JSONL events from .pHive/metrics/events/. Reusing the shape lets the audit generalize over new event types without code changes.'

cross_cutting:
  - concern: observability
    action: 'Dispatch wraps every adapter call with telemetry (method, duration, recoverable/terminal verdict) — captured for /meta-optimize cycle aggregation.'
  - concern: backward-compatibility
    action: 'c-5a does not touch any skill citation. Skills still reference prose-runbooks until c-5b lands. Dispatch is unused until c-5b wires it in.'

risks:
  - severity: medium
    description: 'Custom adapter loading from arbitrary filesystem path opens code-injection risk'
    mitigation: 'Document that custom adapters run with full Hive permissions; recommend code review before pointing config at unfamiliar paths; future story owns signed adapters or sandbox loading.'
  - severity: low
    description: 'Session cache leaks adapter handle across project boundaries'
    mitigation: 'Cache key includes resolved state_dir + adapter config hash; different projects produce different handles.'
  - severity: low
    description: 'ABI version mismatch silently accepted'
    mitigation: 'load() reads adapter.abiVersion (c-2 spec field) and rejects incompatible majors at load time with a terminal error.'

references:
  - path: hive/references/task-tracking-adapter-abi.md
    relevant_excerpt: |
      Dispatch contract: Hive-side dispatch calls adapter.init(config) once
      per session; subsequent invoke(method, args) calls reuse the cached
      handle. Capability queries are read from the handle's capabilities()
      method result, cached at init time. abiVersion field on the adapter
      module declares which ABI major it implements.
  - path: .pHive/epics/structural-refactor-and-gate-lift/stories/a-33-plan-gate-lift-and-gate-mode-knob.yaml
    relevant_excerpt: |
      paths.gate_mode: warning|hard introduced by Epic B story a-33.
      Warning mode emits warning + proceeds with sane defaults.
      Hard mode preserves byte-equivalent original block behavior.
      No-adapter handling follows this same pattern.
