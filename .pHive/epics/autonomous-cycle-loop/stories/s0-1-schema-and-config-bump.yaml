id: s0-1-schema-and-config-bump
epic: autonomous-cycle-loop
title: "S0.1 — schema + config bump (foundation)"
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  Land the additive schema + config foundation that slices A/B/C/D will build
  on. No behavior changes — every new field defaults preserve today's flow.

acceptance_criteria:
  - "hive.config.yaml (shipped baseline) gains standup.interactive_default,
     planning.publish_in_sandcastle, planning.sandcastle_mode_auto_artifact,
     execution.terminal_handoff_default, test.simulated_manual.* with documented
     defaults that preserve current behavior."
  - "hive/references/story-yaml-schema.md documents terminal_handoff:,
     visibility:, manual_verdict: with shape + examples."
  - "hive/references/cycle-state-schema.md documents handoff_log:[] and
     routing_decisions:[] with shape + examples."
  - "hive/references/sandcastle-mode.md exists; describes HIVE_SANDCASTLE_MODE=1
     env-var contract and 'every prompt becomes artifact-write + log line' rule."
  - "hive/references/test-scenario-schema.md exists; documents the scenario YAML
     shape (id, title, story, preconditions[], steps[]{action, expected, actor?},
     postconditions[], mode: spec-walk|implementation-walk)."
  - "Markdown lint passes; no skill or workflow YAML reads any new field yet."

steps:
  - id: research
    description: Confirm the four config knobs land in both the shipped baseline (hive/hive.config.yaml) and the consumer override layer (hive.config.yaml) per the root-first precedence rule.
    agent: researcher
  - id: implement
    description: Append config blocks; write the two new reference docs; add new sections to story-yaml-schema.md and cycle-state-schema.md.
    agent: developer
    depends_on: [research]
  - id: test
    description: Verify markdown lint passes for new docs; verify no skill reads the new fields yet (grep for field names returns hits only in schema docs + config).
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm additive-only — diff hive/hive.config.yaml and hive.config.yaml; no removed or renamed keys.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit + push to feat/autonomous-cycle-loop.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: hive/hive.config.yaml
      purpose: Shipped baseline — new knobs documented with commentary
    - path: hive.config.yaml
      purpose: Consumer/maintainer override layer — new knobs picked up at runtime
    - path: hive/references/story-yaml-schema.md
      purpose: Schema doc — three new top-level fields added
    - path: hive/references/cycle-state-schema.md
      purpose: Schema doc — handoff_log + routing_decisions blocks added

cross_cutting:
  - concern: documentation
    action: New reference docs added; schema docs updated.
  - concern: versioning
    action: No consumer-visible behavior change yet; defer version bump to the slice stories that ship behavior.

metric:
  applies: false
  justification: |
    Schema-only story. The three follow-on slices (A, B, C, D) consume these
    fields and carry the falsifiable behavior metrics. S0 is the substrate
    that makes those metrics measurable; it has no observable surface itself.
