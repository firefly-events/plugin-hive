id: d-1-handoff-dispatch-and-execute-wire
epic: autonomous-cycle-loop
title: "D.1 — handoff dispatch helper + /execute post-integrate step"
status: pending
complexity: medium
methodology: classic
depends_on: [s0-1-schema-and-config-bump]

description: |
  Build the dispatch helper and wire /execute to read terminal_handoff.next
  after each story's integrate step. Targets: test, review, both, none.
  Default none preserves today's behavior.

acceptance_criteria:
  - "hive/lib/handoff/dispatch.mjs exports dispatchHandoff({story_id, target, branch, pr_number?}) returning {ok, verdict, evidence_ref, duration_ms} or {ok: false, reason}."
  - "target: 'test' invokes /test --story <story-id> (or scenario path if simulated-manual concern is on the story)."
  - "target: 'review' invokes /review #<pr_number> when a PR exists, else /review <branch>."
  - "target: 'both' runs test first, then review with verdict from test available to review."
  - "target: 'none' is a no-op."
  - "skills/execute/SKILL.md adds a post-integrate step in the per-story loop reading story.terminal_handoff.next (or epic.execution.terminal_handoff_default)."
  - "Handoff writes a row to cycle-state handoff_log[] regardless of verdict."
  - "Failed integrate (no episode marker) skips the handoff and logs why."

steps:
  - id: research
    description: Identify how skills are invoked as child processes today; pick a consistent invocation surface (Skill tool vs shell vs in-process); document the choice.
    agent: researcher
  - id: implement
    description: Write dispatch helper; wire /execute post-integrate step; add the handoff_log[] writeback in cycle-state.
    agent: developer
    depends_on: [research]
  - id: test
    description: Fixture story with terminal_handoff.next: test triggers /test invocation; same with review; with both runs test then review; with none nothing fires; integrate-failure skips handoff.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm helper respects the orchestrator coordination contract (it dispatches the named skill, not inlines its work); confirm handoff_log[] shape matches S0 schema.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit + push.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive-ui-f
  key_files:
    - path: hive/lib/handoff/dispatch.mjs
      purpose: New dispatch helper
    - path: skills/execute/SKILL.md
      purpose: Post-integrate step added here
    - path: hive/references/cycle-state-schema.md
      purpose: handoff_log[] shape (S0)

cross_cutting:
  - concern: documentation
    action: Update execute skill markdown's "Process" section to document the new step; reference cycle-state-schema for handoff_log[] shape.

metric:
  applies: true
  name: execute.handoff_fires_per_terminal_handoff_story
  direction: up
  unit: ratio
  baseline: 0.0
  target: 0.95
  window: first 10 stories with terminal_handoff.next != none after D.1 ships
  source:
    kind: sql
    ref: "SELECT count(*) FROM cycle_state WHERE handoff_log IS NOT NULL AND jsonb_array_length(handoff_log) > 0"
  verify_at: 2026-07-01T00:00:00Z
  owner: tester
