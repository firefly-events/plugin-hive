    action: sandcastle-gh-init SKILL.md outputs table gains the new feat/plan-<epic-id> branch + `[plan] <epic-id>` PR rows.
  - concern: versioning
    action: Minor bump — first consumer-visible new dispatch mode lands with B.3.

