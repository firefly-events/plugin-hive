id: c-2-test-simulated-manual-mode
epic: autonomous-cycle-loop
title: "C.2 — /test --simulated-manual + /plan concern wiring"
status: pending
complexity: medium
methodology: classic
depends_on: [c-1-scenario-schema-and-loader]

description: |
  Wire /test --simulated-manual <story-id|scenario-file> to the executor step.
  Add the simulated-manual cross-cutting concern definition to
  .pHive/cross-cutting-concerns.yaml. Teach /plan step 14 to inject an
  optional `scenario` step into a story's workflow YAML when the concern
  applies, positioned per the resolved methodology.

acceptance_criteria:
  - "skills/test/SKILL.md documents --simulated-manual <story-id|scenario-file> argument parsing."
  - "When the arg is a story-id, /test resolves the scenario path from the story's manual_verdict.scenario_ref or fails with a clear error."
  - "When the arg is a path, /test loads + validates that scenario directly."
  - ".pHive/cross-cutting-concerns.yaml gains a `simulated-manual` concern with applies_when (UI flow / external integration / perceptual outcome), planning_prompt, implementation_checklist."
  - "/plan step 14 injects a `scenario` step into the story's workflow YAML when the concern applies: after `behavior-spec` in BDD; after `implement` in classic; after `test-spec` in TDD."
  - "Verdict (pass | fail | inconclusive) is written to the story YAML's manual_verdict block per S0 schema."

steps:
  - id: research
    description: Confirm /test argument parsing layout and the existing cross-cutting-concerns loop in /plan step 14.
    agent: researcher
  - id: implement
    description: Add the flag and dispatch in /test SKILL.md; add the concern in .pHive/cross-cutting-concerns.yaml; add the scenario-step injection in /plan SKILL.md step 14.
    agent: developer
    depends_on: [research]
  - id: test
    description: Run /plan on a fixture story carrying the concern — verify the scenario step is injected in the right position per methodology. Run /test --simulated-manual on a fixture scenario in spec-walk mode — verify per-step narration + verdict writeback.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm scenario injection respects the existing step-id contract and depends_on edges; confirm verdict writeback follows the manual_verdict shape from S0.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit + push.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive-ui-f
  key_files:
    - path: skills/test/SKILL.md
      purpose: Skill markdown — argument parsing + dispatch
    - path: skills/plan/SKILL.md
      purpose: Step 14 — concern loop; injection logic added here
    - path: .pHive/cross-cutting-concerns.yaml
      purpose: New concern definition lives here
    - path: hive/workflows/steps/test/simulated-manual.md
      purpose: Executor step (C.1)

cross_cutting:
  - concern: documentation
    action: Update cross-cutting-concerns.md reference to mention the new concern.

metric:
  applies: true
  name: simulated_manual.verdicts_per_eligible_story
  direction: up
  unit: ratio
  baseline: 0.0
  target: 0.7
  window: stories planned with the simulated-manual concern over first 4 cycles
  source:
    kind: sql
    ref: "SELECT count(*) FROM story_yaml WHERE manual_verdict.outcome IS NOT NULL"
  verify_at: 2026-07-15T00:00:00Z
  owner: tester
