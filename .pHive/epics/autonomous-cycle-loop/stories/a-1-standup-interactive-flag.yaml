id: a-1-standup-interactive-flag
epic: autonomous-cycle-loop
title: "A.1 — /standup --interactive flag + Phase 1.5 hook"
status: in_progress
complexity: medium
methodology: classic
depends_on: [s0-1-schema-and-config-bump]

description: |
  Add `--interactive` flag to /standup and an opt-in Phase 1.5 (Interactive
  Routing) entry point between Phase 1 (standup report) and Phase 2 (planning
  short-list). When the flag or config knob is set, the workflow loads the new
  routing step. When unset, behavior is byte-equivalent to today.

acceptance_criteria:
  - "skills/standup/SKILL.md documents --interactive flag and reads standup.interactive_default from hive.config.yaml (consumer override layer wins)."
  - "hive/workflows/daily-ceremony.workflow.yaml gains an optional phase entry 'interactive-routing' between standup and planning, gated on the flag/config."
  - "Without --interactive and with default config, /standup runs Phase 1, Phase 2, Phase 3 with no Phase 1.5 step (byte-equivalent diff against pre-change runs on a fixture project)."
  - "With --interactive, /standup runs the Phase 1.5 step (step file existence verified; full behavior implemented in A.2)."

steps:
  - id: research
    description: Confirm the daily-ceremony workflow YAML structure and how /standup loads it; identify the right insertion point.
    agent: researcher
  - id: implement
    description: Add flag parsing + config plumb to skill markdown; add the optional phase entry to the workflow YAML.
    agent: developer
    depends_on: [research]
  - id: test
    description: Run /standup without --interactive on a fixture project, confirm no Phase 1.5; run with --interactive, confirm Phase 1.5 is entered (even if its step is a stub at this point).
    agent: tester
    depends_on: [implement]
  - id: review
    description: Verify config knob defaults to false; verify no other skill is affected.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit + push.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive-ui-f
  key_files:
    - path: skills/standup/SKILL.md
      purpose: Skill entry point; argument parsing + config read
    - path: hive/workflows/daily-ceremony.workflow.yaml
      purpose: Workflow definition; the new phase entry lives here
    - path: hive/workflows/steps/daily-ceremony/
      purpose: Step files dir; new file added in A.2

cross_cutting:
  - concern: documentation
    action: Update skill markdown to describe the flag; add a short note in the workflow YAML comment header.

metric:
  applies: true
  name: standup.interactive_phase_entered_per_invocation
  direction: up
  unit: ratio
  baseline: 0.0
  target: 1.0
  window: when --interactive flag passed
  source:
    kind: events
    ref: .pHive/metrics/events/standup-*.jsonl
  verify_at: a-2-standup-routing-step-and-heuristic
  owner: tester
