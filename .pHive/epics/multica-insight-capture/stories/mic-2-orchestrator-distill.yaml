id: mic-2-orchestrator-distill
epic: multica-insight-capture
title: Orchestrator distills Multica insights into memory
status: shipped
shipped_at: "2026-06-08T04:51:07Z"
release_id: "v2.10.0"
complexity: high
methodology: classic
depends_on: [ mic-1-agent-self-capture-brief ]

description: |
  After each Multica story's episode marker is written, the ORCHESTRATOR distills
  insights into durable memory as an inline step — not a sub-agent, not a low-cost
  model. This is surface 2 of the t-001 fix and the trustworthy half: turning raw
  self-capture + transcript into curated, forward-looking memory.

  Why the orchestrator (maintainer decision): distillation requires reasoning
  forward and backward — what did we just do, why, and how could it impact future
  work — using the orchestrator's full context across the epic. A cheap/haiku
  sub-agent cannot hold that cross-story context or do the impact reasoning. This is
  exactly the "orchestrator self-captures at phase boundaries" rule
  (feedback_execution_protocol), applied to the Multica per-story terminal boundary.

  Inputs the orchestrator reads:
    - the agent's self-captured .hive/insights/<story-id>.md (mic-1; may be absent)
    - the messages sidecar multica-run.messages.jsonl
    - the story git diff (what actually changed)
    - cross-story context already in the orchestrator's working state (prior stories
      this epic, design discussion, cycle state)

  Outputs (maintainer decision):
    - PRIMARY: team-memories/<epic-id>/<story-id>.md (epic-local, travels w/ repo)
    - PROMOTE: durable cross-epic feedback → Hive memory (~/.claude/.../memory/)
      as a feedback/project note, following the existing memory frontmatter +
      MEMORY.md pointer convention.

  A helper (episode-sync.mjs or a sibling distill module) provides the read-inputs +
  write-team-memory + promote plumbing; the orchestrator provides the judgment and
  the forward/backward impact reasoning. Gated on signal: when inputs yield nothing
  worth keeping, write nothing (no noise).

acceptance_criteria:
  - "Given a completed Multica story with episode marker, when the orchestrator
    runs the distill step, then a team-memories/<epic-id>/<story-id>.md note is
    written capturing distilled, forward-looking insights (or skipped when
    nothing is distillable)."
  - "Given a durable cross-epic learning, when the orchestrator promotes it,
    then a Hive memory file + MEMORY.md pointer are written per the existing
    convention."
  - "Given the agent self-capture file is absent (mic-1 ignored), when the
    distill step runs, then it still distills from transcript + diff +
    orchestrator context alone."
  - "Given the distill step, when it runs, then it is an inline orchestrator
    step — NOT a dispatched sub-agent and NOT a reduced-capability model."
  - "Given a story that yielded nothing distillable, when the step runs, then no
    team-memory and no Hive memory file are written (signal-gated, no noise)."

steps:
  - id: research
    description: Read episode-sync.mjs (writeMulticaRunEpisode, messages capture),
      insight-capture.md, pre-shutdown-protocol.md, and the Hive memory
      frontmatter+MEMORY.md convention.
    agent: researcher
  - id: implement
    description: Add the distill helper (read insights+transcript+diff, write
      team-memory, promote to Hive memory) invoked as an inline orchestrator
      step after writeMulticaRunEpisode; signal-gate the writes. No sub-agent
      dispatch, no model downgrade.
    agent: developer
    depends_on: [ research ]
  - id: test
    description: Cover team-memory write, promotion path, transcript-only fallback,
      inline-orchestrator invocation (no sub-agent), and the no-noise skip.
    agent: tester
    depends_on: [ implement ]
  - id: review
    description: Confirm the step is inline-orchestrator (not a sub-agent / not
      downgraded), promotion follows memory convention, and signal-gate prevents
      noise.
    agent: reviewer
    depends_on: [ test ]
  - id: integrate
    description: Commit and push to feat/multica-insight-capture.
    agent: developer
    depends_on: [ review ]

