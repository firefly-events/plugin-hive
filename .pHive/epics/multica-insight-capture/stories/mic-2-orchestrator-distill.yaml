risks:
  - severity: medium
    description: Distill writes noisy/low-value memories.
    mitigation: Signal-gated (skip when nothing distillable); mirror
      insight-capture.md quality bar; bounded one note per story.
  - severity: low
    description: Large transcripts inflate orchestrator context.
    mitigation: messages_capture_max bounds transcript size; the agent self-capture
      (mic-1) gives a pre-distilled input the orchestrator can lead with.
