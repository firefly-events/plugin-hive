id: mic-1-agent-self-capture-brief
epic: multica-insight-capture
title: Agent self-records insights via story-brief injection
status: pending
complexity: medium
methodology: classic
depends_on: []
parallel_allowed: true
parallel_rationale: bounded-slice

description: |
  Give the dispatched Multica agent a structured slot to record its own insights
  before finishing. `serializeStoryBrief` (hive/lib/multica-story-dispatch/index.mjs)
  gains an insight-capture section instructing the agent to write distilled insights
  to a contract-defined path inside its task work_dir before completing.

  Path contract (relative to the agent's repo checkout work_dir):
    .hive/insights/<story-id>.md

  The section mirrors the spirit of hive/references/insight-capture.md: surprises,
  gotchas, decisions-and-why, things the next agent should know — NOT a task recap.
  This is surface 1 (agent self-capture); the mic-2 orchestrator distill consolidates it.

  Best-effort: a foreign agent may ignore the instruction. mic-2 works transcript-only
  when the file is absent, so this story is enrichment, not a hard dependency.

acceptance_criteria:
  - "Given a story dispatched to a Multica agent, when serializeStoryBrief
    renders the brief, then it includes an insight-capture section naming the
    path .hive/insights/<story-id>.md and the quality bar
    (surprises/gotchas/decisions, not a recap)."
  - "Given the brief, when the agent provider is codex (native), then the
    section is still present (capture is provider-independent, unlike the
    codex-rescue dance)."
  - "Given an existing brief without the section, when re-rendered, then the
    section is added idempotently (ensureIssueBriefMatches sees the new
    canonical form)."

steps:
  - id: research
    description: Read serializeStoryBrief + resolveCodexInstruction in index.mjs and
      insight-capture.md to match tone/quality bar.
    agent: researcher
  - id: implement
    description: Add the insight-capture section to serializeStoryBrief with the
      path contract; keep it provider-independent.
    agent: developer
    depends_on: [ research ]
  - id: test
    description: Cover section presence (codex + claude providers), path string, and
      idempotent re-render.
    agent: tester
    depends_on: [ implement ]
  - id: review
    description: Confirm the section's path contract matches what the mic-2
      orchestrator distill reads.
    agent: reviewer
    depends_on: [ test ]
  - id: integrate
    description: Commit and push to feat/multica-insight-capture.
    agent: developer
    depends_on: [ review ]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: hive/lib/multica-story-dispatch/index.mjs
      purpose: serializeStoryBrief — the brief renderer to extend.
    - path: hive/references/insight-capture.md
      purpose: Quality bar to mirror for the agent's self-capture.

files_to_modify:
  - file: hive/lib/multica-story-dispatch/index.mjs
    change: Add insight-capture section to serializeStoryBrief.

cross_cutting:
  - concern: documentation
    action: "Document the .hive/insights/<story-id>.md path contract inline + in
      mic-3 wiring."
  - concern: versioning
    action: "Changes Multica dispatch brief output — note in changelog at epic close."

metric:
  applies: true
  name: multica.story_self_capture_rate
  direction: up
  unit: ratio
  baseline: "0 (no capture slot exists today)"
  target: "0.70"
  window: next-2-multica-epics
  source:
    kind: manual
    ref: "Fraction of completed Multica stories with a non-empty
      .hive/insights/<id>.md, audited across next 2 multica-mode epics"
  verify_at: "2026-07-31T00:00:00Z"
  owner: reviewer

risks:
  - severity: low
    description: Agent ignores the instruction (foreign runtime).
    mitigation: mic-2 orchestrator distill works transcript-only; this is
      enrichment, not required.
tracker_id: plugin-hive/PLU-239
tracker_url: http://localhost:3000/plugin-hive/issues/239
