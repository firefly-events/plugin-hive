description: |
  Make the capture (mic-1) + orchestrator distill (mic-2) a first-class part of the
  Multica execution lifecycle, and document the variant so future readers know
  Multica mode now participates in insight capture.

  Wiring:
    - execute-mode-multica/SKILL.md: add a Step (after Step 3 "Episode marker per
      terminal") for the orchestrator distill invocation; update the Outputs list to
      include the team-memory note; add a Constraint-summary row "Insight capture |
      mic-1 brief + mic-2 orchestrator distill".
    - pre-shutdown-protocol.md: add a note that Multica mode realizes the protocol
      via agent self-capture (mic-1) + post-terminal orchestrator distill (mic-2) rather
      than the in-process Claude-Code pre-shutdown path.

  This story closes the loop flagged in feedback_multica_skips_insight_capture.

acceptance_criteria:
  - "Given execute-mode-multica/SKILL.md, when read, then it documents the
