  - "Given the SKILL constraint-summary table, when read, then it includes an
    insight-capture row referencing mic-1 + mic-2."
  - "Given pre-shutdown-protocol.md, when read, then it notes the Multica
    variant (agent self-capture + orchestrator distill) as a valid realization
    of the protocol."

