        name: orchestrator
        model: opus
        ---
        # routing table (lines 171-175) — three-tier table, no fable row currently
    - file: hive/agents/architect.md
      purpose: "Frontmatter model: sonnet (line 4). Must be updated to fable."
      relevant_excerpt: |
        # frontmatter (lines 1-4):
        ---
        name: architect
        model: sonnet
        ---
    - file: hive.config.yaml
      purpose: "Root maintainer override layer. Contains evidence of the 2026-06-12 Fable revert at lines 179-186. Read this to understand WHY the trial was reverted before re-designating."
      relevant_excerpt: |
        # lines 179-186 (approximate):
        # model_overrides (reverted from fable 2026-06-12):
        #   architect: opus
        #   tpm: opus
        #   tester: opus
        #   peer-validator: opus
    - file: hive/references/configuration.md
      purpose: "Sessions model docs (lines 95-109). Add Fable 5 context/output limits here with the 'advertised' qualifier."
      relevant_excerpt: |
        # lines 95-109 — sessions config section
        # sessions.model inherits from model_tiers when unset.
        # No Fable 5 context/output limit guidance currently.
    - file: hive/references/agent-config-schema.md
      purpose: "Model tier table (lines 54-59) plus precedence note (lines 188-211). The fable row must be added to the tier table."

risks:
  - severity: high
    description: "Repeating the June 2026 Fable revert. The revert reason is undocumented in hive.config.yaml. Re-designating without understanding why it was reverted risks the same failure."
    mitigation: "Research step must surface the revert reason. If undocumented, note that explicitly in the commit and leave a comment in hive.config.yaml for future context."
  - severity: high
    description: "Fable 5 model ID or capability limits may differ from what the user provided. 1M context and 128K output are cited from user context only."
    mitigation: "Implement step must write limits as 'advertised / as published 2026-06' and note they should be re-verified at implementation time. Do NOT write as absolute fact."
  - severity: medium
    description: "configuration.md hot-file: this story and Stories C and D all edit configuration.md. Story D depends_on this story, ensuring serial execution. Story C must also run after this story."
    mitigation: "dependency graph (A->B->C, A->B->D) ensures serial execution of configuration.md edits. The implementer must confirm no concurrent editing before starting."

cross_cutting:
  - concern: documentation
    applies: true
    notes: "Edits orchestrator.md, architect.md, configuration.md, agent-config-schema.md — all consumer-facing references. Tier table coherence is the primary check."
  - concern: versioning
    applies: true
    notes: "Adding fable to shipped hive/hive.config.yaml baseline is an additive consumer-visible change. Semver minor. Versioning story owns the actual bump commit."
  - concern: metrics
    applies: false

metric:
  applies: false
  justification: "Pure documentation story — designates preferred top-tier model in reference tables and frontmatter with no measurable runtime outcome."
