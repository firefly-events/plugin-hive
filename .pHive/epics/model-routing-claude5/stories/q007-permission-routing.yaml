    applies: true
    notes: "Both permission-patterns.md and hooks-conventions.md are consumer-facing governance references. The new section establishes a new doc category (agent model-routing permissions)."
  - concern: versioning
    applies: false
    notes: "Pure documentation addition to reference docs — no new config keys or behavior changes. No semver bump triggered by this story alone."
  - concern: metrics
