risks:
  - severity: medium
    description: "Agent(model:...) permission syntax may not exist in Claude Code. The existing permission-patterns.md only shows Tool(param:value) with verified tool names."
    mitigation: "Research step must verify this syntax before implementation. If unverified, all examples must be labeled 'unverified syntax — validate before enforcing' rather than presented as confirmed working examples."
  - severity: medium
    description: "Naming specific enterprise/government restricted model IDs in public docs could be sensitive or expose Anthropic's internal model naming conventions."
    mitigation: "Use glob patterns only (Agent(model:*-gov)). Research step resolves Q5. Do not name specific real restricted model IDs."

cross_cutting:
