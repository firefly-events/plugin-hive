risks:
  - severity: high
    description: "Q1 replace-vs-add decision: blanket claude-sonnet-4-6 replacement re-tiers 26 agents silently. Research must produce a concrete recommendation before implementation starts."
    mitigation: "Resolve Q1 in the research step. Document the decision in the commit message. If replacing, scan for all 26 agents to confirm none have a specialty reason to stay on 4-6."
  - severity: medium
    description: ".pHive/multica/agents.yaml drift: agents.yaml has no enforced link to hive.config.yaml. The Fable trial left this file in an inconsistent state (comment says Fable, value says Opus)."
    mitigation: "Update agents.yaml in the same commit as hive.config.yaml. Grep both files after update to confirm parity."

cross_cutting:
  - concern: documentation
    applies: true
    notes: "All five surfaces edited by this story are consumer-facing documentation. Every doc section that references old model IDs must be updated."
  - concern: versioning
    applies: true
    notes: "Adding claude-sonnet-5 to the shipped hive/hive.config.yaml baseline is an additive consumer-visible change. Semver bump: minor. Versioning story owns the actual bump commit."
  - concern: metrics
    applies: false

metric:
