      purpose: "Contains the authoritative model tier table (lines 54-59) mapping alias to concrete ID. This is the schema source of truth that all other references should match."
      relevant_excerpt: |
        # lines 54-59 (approximate):
        | `opus`   | `claude-opus-4-8`          | Complex reasoning, planning tasks  |
        | `sonnet` | `claude-sonnet-4-6`        | Balanced capability and cost       |
