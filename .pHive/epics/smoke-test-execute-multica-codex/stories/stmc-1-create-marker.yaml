id: stmc-1-create-marker
epic: smoke-test-execute-multica-codex
title: Create smoke-marker.txt with a known timestamp
status: in_progress
complexity: low
methodology: classic
depends_on: []

description: |
  Create a file at .pHive/smoke/smoke-marker.txt containing the line
  "smoke-test:created:<ISO 8601 timestamp>". The file must be a new file
  with exactly that single line plus a trailing newline.

acceptance_criteria:
  - "File .pHive/smoke/smoke-marker.txt exists"
  - "File contains exactly one line"
  - "Line starts with 'smoke-test:created:'"
  - "Line ends with a valid ISO 8601 UTC timestamp"

steps:
  - id: implement
    description: |
      Create .pHive/smoke/ directory if absent. Write
      .pHive/smoke/smoke-marker.txt with the single line described above
      using the current UTC timestamp.
    agent: developer

context:
  files_to_modify:
    - file: .pHive/smoke/smoke-marker.txt
      change: create new file with single timestamped line
