name: smoke-test-execute-multica-codex
title: Smoke test for /execute → Multica → /codex:rescue pipeline
description: |
  Two-story dummy epic to exercise the end-to-end /execute pipeline through
  Multica with Codex routing (wmc-1 + wmc-2 + wmc-3 + wmc-4). Minimal scope:
  create a marker file (s1), append a line to it (s2). The work itself is
  trivial — the value is in observability: confirming the dispatch reaches a
  bootstrapped agent, the brief carries the /codex:rescue instruction, the
  episode marker writes, and the scope_drift event fires.

target_codebase: /Users/don/Documents/plugin-hive
methodology: classic

git_flow:
  base_branch: develop
  branch_strategy: per-epic

stories:
  - id: stmc-1-create-marker
    title: Create smoke-marker.txt with a known timestamp
    complexity: low
    depends_on: []
  - id: stmc-2-append-line
    title: Append a known line to smoke-marker.txt
    complexity: low
    depends_on: [stmc-1-create-marker]
