    title: "Establish prompt-reference convention on brand-system + design-system"
    complexity: medium
    depends_on: []
    tier: 1

  - id: f-02-prompt-convention-polish-visual-qa
    title: "Apply prompt-reference convention to polish-audit + visual-qa"
    complexity: medium
