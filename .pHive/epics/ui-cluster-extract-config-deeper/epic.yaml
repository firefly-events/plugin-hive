name: ui-cluster-extract-config-deeper
title: "Epic F — UI Cluster Extract-Config (Deeper, D2 Full Closure)"
description: >
  Extract inline ui-designer prompt blocks from the four direct UI cluster SKILLs
  (brand-system, design-system, polish-audit, visual-qa) and from the two workflow-
  mediated ui-designer steps in design-review.workflow.yaml. Prompts move to flat
  files under hive/references/ui-prompts/ following the W6 a-08/a-09 reference-file
  convention. Behavior-preserving refactor; closes D2 dissent fully.
target_codebase: /Users/don/Documents/plugin-hive
methodology: classic
branch_base: dev/hive-2.0
ship_placement: "Parallel sibling to Epic D (sandcastle-adoption-followon) on dev/hive-2.0 — no coupling either direction. Merge order is whichever PR is ready first. Per design-discussion.md:102,128: zero Epic D coupling. Per recommendation.md:395: conditional/follow-on post-2.0."

key_decisions:
  - id: S3-task-loading-contract
    decision: "Choice A — extend skills/design-review/SKILL.md to read workflow step_file: field and load referenced prompt content. No task_file: schema/runtime extension."
    rationale: >
      step_file: is already a supported workflow-schema field (hive/references/workflow-schema.md:18,35,39) and is read by the DAG loader (hive/lib/dag_executor/graph/loader.py:75,76). Choice B would require new schema + runtime work outside Epic F scope. Choice C would leave D2 partially closed.
    locked_at: "2026-05-12"
  - id: path-prefix
    decision: "Use skills/<skill-name>/SKILL.md throughout — drop skills/hive/skills/ prefix from all planning artifacts."
    rationale: "Architect §2 confirmed actual file location; skills/hive/skills/brand-system/SKILL.md does not exist. W6 a-08/a-09 precedent uses skills/<name>/SKILL.md."
  - id: branch-placement
    decision: "Parallel sibling on dev/hive-2.0, NOT stacked on feat/sandcastle-adoption-followon."
    rationale: "Docs confirm zero Epic D coupling (design-discussion.md:102,128). Stacking on D was incidental — F and D touch unrelated surfaces (F = UI prompt extraction; D = Sandcastle substrate). Re-pointing F to dev/hive-2.0 preserves independence; either PR can merge first."
    locked_at: "2026-05-12"

stories:
