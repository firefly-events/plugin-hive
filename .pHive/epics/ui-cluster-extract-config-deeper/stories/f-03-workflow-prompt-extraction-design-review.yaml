code_examples:
  - title: "workflow-schema step_file precedence rule"
    file: hive/references/workflow-schema.md
    snippet: |
      # Precedence: step_file > task. If both are present, the step file is
      # authoritative. The orchestrator loads the step_file content and passes
      # it to the agent as the primary procedure — the `task` field becomes
      # a fallback summary.
  - title: "DAG loader already reads step_file (no loader changes needed)"
    file: hive/lib/dag_executor/graph/loader.py
    snippet: |
      # line 75-76:
      task = raw.get("task")
      step_file = raw.get("step_file")
  - title: "Workflow yaml shape after extraction"
    file: hive/workflows/design-review.workflow.yaml
    snippet: |
      # design-critique step BEFORE:
      - id: design-critique
        agent: ui-designer
        task: >
          Review the provided UI artifacts ...   # ~30 lines
      # AFTER (Choice A):
      - id: design-critique
        agent: ui-designer
        step_file: hive/references/ui-prompts/design-review-design-critique.md

design_decisions:
  - decision: "S3 contract = Choice A — step_file + extend skills/design-review/SKILL.md to load step_file content"
    rationale: "step_file: is already a supported workflow-schema field. DAG loader already reads it. Choice B (new task_file schema) would require runtime + schema extension outside Epic F scope. Choice C (defer S3) would leave D2 partially closed. User locked this decision 2026-05-12."
  - decision: "Specialist steps (accessibility-critique, animations-critique) stay inline `task:`"
    rationale: "Only ui-designer steps are in scope for Epic F (D2 dissent). The SKILL change handles both forms, so accessibility-specialist and animations-specialist invocations continue unchanged."
  - decision: "Path prefix skills/design-review/SKILL.md (not skills/hive/skills/...)"
    rationale: "Architect §2 confirmed actual file location. W6 a-08/a-09 precedent uses skills/<name>/SKILL.md."

cross_cutting:
  - concern: documentation
    action: "Update hive/references/workflow-schema.md if any example uses inline `task: >` for design-review specifically. Update skills/design-review/SKILL.md inline documentation block describing how it executes workflow steps (mention step_file: loading). Confirm hive/agents/ui-designer.md still accurate."

risks:
  - severity: high
    description: "SKILL extension breaks specialist steps — if implementation switches unconditionally to step_file:, the two specialist steps (accessibility-critique, animations-critique) lose their inline task: content."
    mitigation: "Explicit precedence rule: step_file > task IF step_file present, ELSE use task. Test step exercises both forms end-to-end. Reviewer step verifies specialist steps unchanged."
  - severity: medium
    description: "Byte-equivalent extraction drifts (workflow yaml multiline `task: >` block has implicit folding rules that markdown file lacks)."
    mitigation: "Capture the rendered task body pre-extraction (run a one-shot dry-run to print resolved task text). Diff against new prompt file content. YAML folding chomping rules apply only to inline scalars — extraction lifts them out completely; verify no leading-whitespace artifacts."
  - severity: medium
    description: "step_file: path resolution differs between SKILL and DAG loader (relative vs absolute, ${CLAUDE_PLUGIN_ROOT} interpolation)."
    mitigation: "Architect §2 noted: use plain repo-relative paths (hive/references/ui-prompts/...), no ${CLAUDE_PLUGIN_ROOT} prefix, unless a future runtime contract requires it. Test step runs both /design-review invocations end-to-end to catch path errors."
  - severity: low
    description: "S4 verification gates over-match — generic `step_file:` grep would catch any unrelated workflow using step_file."
    mitigation: "S4 grep gates are scoped to hive/workflows/design-review.workflow.yaml only, and look for `hive/references/ui-prompts/design-review-` specifically (2-match expectation)."

