    change: "Replace inline `task: >` body of design-critique step (line 54) with `step_file: hive/references/ui-prompts/design-review-design-critique.md`. Same for synthesis step (line 86). Leave accessibility-critique and animations-critique steps untouched."
  - file: skills/design-review/SKILL.md
    change: "Extend step-execution loop (~line 95) to read workflow step's step_file field when present and load the referenced file as the agent's primary procedure. Precedence: step_file > task. Backward compatible — steps with only `task:` execute unchanged."
