    relevant_excerpt: |
      Slice S1: Convention Establishment on W6-precedent Pair (Tier 1)
      Goal: Prove hive/references/ui-prompts/ end-to-end on brand-system and
      design-system, the two direct SKILLs that already have W6 config/spec
      extraction precedent.
  - path: .pHive/epics/ui-cluster-extract-config-deeper/docs/architect-review-b2.md
    relevant_excerpt: |
      §2 SKILL path prefix convention: use skills/<skill-name>/SKILL.md, not
      skills/hive/skills/<skill-name>/SKILL.md. W6 a-08 path precedent is
      skills/brand-system/SKILL.md.
  - path: .pHive/epics/ui-cluster-extract-config-deeper/docs/user-decisions-b1.md
    relevant_excerpt: |
      Q1 = one prompt file per skill. Q2 = hive/references/ui-prompts/<skill-name>.md.
      Q8 = preserve byte-equivalent text on extraction; no format normalization.
