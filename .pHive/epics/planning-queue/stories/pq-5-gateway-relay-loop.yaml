design_decisions:
  - decision: Gateway-owned relay, explicit leader re-dispatch
    rationale: "Locked G1 (no plugin routine API) + fork default (don't assume Multica auto-wake on answer comment)."
  - decision: 4-tuple correlation (issue id, GATE comment id, Slack channel, thread_ts)
    rationale: "Single-key correlation cross-wires simultaneous gates; the 4-tuple makes answer routing deterministic."

cross_cutting:
  - concern: error-handling
    action: "Transient Slack/Multica failures during a tick are logged + retried next tick; the gate is never dropped."
  - concern: idempotency
    action: "An already-answered gate is not re-relayed; re-dispatch fires once per answered gate."

metric:
  applies: false
  justification: "First-build of the relay loop — its production value (maintainer round-trip latency on a blocked gate) needs live Slack traffic to measure and has no baseline; this story's correctness is the no-cross-wire + answer-routing + retry behavior verified by the fake-relay gateway tests."

risks:
  - severity: high
    description: Relay crosses Multica + gateway + Slack send/reply + correlation + explicit re-dispatch — many failure surfaces.
    mitigation: Thin gateway integration reusing the kanban watcher; 4-tuple correlation; fake-relay tests for two-gate + failure paths; retry-next-tick.

