id: pq-5-gateway-relay-loop
epic: planning-queue
title: Hermes gateway relay loop — blocked/GATE → Slack → answer-back → re-dispatch
status: pending
complexity: high
methodology: classic
depends_on: [pq-4-hermes-multica-plugin-tools]

description: |
  Slice 5 (highest risk). The gateway-owned relay that closes the human-gate loop:
  poll Multica for blocked/GATE issues (via the pq-4 tool / Python client), relay the
  question to Slack using the existing gateway Slack adapter, ingest the maintainer's
  threaded reply, post a canonical `GATE ANSWER:` comment back to the Multica issue, and
  explicitly re-dispatch the blocked leader (locked fork default — do not assume auto-wake).
  Correlation is stored (Multica issue id + GATE comment id ↔ Slack channel + thread_ts)
  so simultaneous gates never cross-wire.

  Working state: end-to-end async human-gate over Slack — a leader's GATE question reaches
  the maintainer in Slack and their answer resumes the right leader.

acceptance_criteria:
  - "Given a blocked+GATE issue, when the relay polls, then it posts the question to Slack via the existing adapter send(chat_id, content, ...) and records correlation (issue id, GATE comment id, Slack channel, thread_ts)."
  - "Given a maintainer threaded reply, when ingested, then the relay matches it to the correct issue via stored correlation and ignores unmatched replies."
  - "Given a matched answer, when processed, then it posts a `GATE ANSWER:` comment to the Multica issue AND explicitly re-dispatches the blocked leader (no reliance on auto-wake)."
  - "Given two simultaneous gates, when both are answered, then each answer routes to its own issue/leader (no cross-wire) — verified by a fake-relay two-gate test."
  - "Given a transient Slack or Multica failure during a tick, when it occurs, then the relay logs and retries next tick without losing the gate."
  - "Given the relay, when registered, then it lives in the gateway (multica_gate_relay.py + run.py hook), reusing the existing kanban watcher pattern — NOT a plugin routine."

steps:
  - id: research
    description: Confirm gateway watcher/poll pattern (run.py kanban notifier ~L4495-5400), slack.py send + inbound thread-reply ingest + thread context fetch, and where correlation state can persist.
    agent: researcher
  - id: implement
    description: Build /Users/don/Code/hermes-agent/gateway/multica_gate_relay.py (poll, Slack relay, answer ingest, GATE ANSWER post, leader re-dispatch, correlation store) + hook into gateway/run.py lifecycle; minimal slack.py adapter touch only if inbound metadata needs it.
    agent: developer
    depends_on: [research]
  - id: test
    description: Gateway relay tests — poll→Slack, answer match/ignore-unmatched, GATE ANSWER post + re-dispatch, two-simultaneous-gate no-cross-wire, transient-failure retry.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review correlation completeness (4-tuple), explicit re-dispatch, failure retry, and that polling is gateway-owned.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit + push (Hermes repo).
    agent: developer
    depends_on: [review]

