id: pq-4-hermes-multica-plugin-tools
epic: planning-queue
title: hermes-multica plugin — Multica tool surface in Hermes
status: pending
complexity: medium
methodology: classic
depends_on: [pq-3-gate-elevation-contract]

description: |
  Slice 4. Build the `hermes-multica` Hermes plugin: a directory plugin
  (`plugin.yaml` + `__init__.py register(ctx)`) exposing Multica tools via
  `PluginContext.register_tool` (spotify-style pattern). Tools: multica_post_comment,
  multica_update_issue, multica_resolve_label, multica_add_label, multica_list_blocked_gates.
  Tools only — NO polling/routine here (no generic plugin routine API exists; the poll
  loop lives in the gateway in pq-5, locked G1).

  Working state: Hermes can drive Multica (comment/label/list-blocked) through registered tools.

acceptance_criteria:
  - "Given the plugin directory, when Hermes loads plugins, then hermes-multica registers via register(ctx) and its tools appear in the tool registry."
  - "Given multica_list_blocked_gates, when called, then it returns issues that are status=blocked AND carry blocked-for-human AND have an unresolved @orchestrator GATE: comment (client-side filtered, scan-capped)."
  - "Given multica_resolve_label/add_label, when called for a missing label, then it resolves-or-creates then attaches (reuses the pq-3 contract semantics)."
  - "Given the plugin manifest, when inspected, then it declares requires_env for the Multica token and does NOT claim any routine/poll capability."
  - "Given a tool error (auth/timeout), when raised, then it surfaces a structured error, not a crash."

steps:
  - id: research
    description: Confirm Hermes plugin shape — plugins.py register_tool signature, plugin.yaml manifest fields, spotify/teams_pipeline examples; confirm requires_env handling.
    agent: researcher
  - id: implement
    description: Build /Users/don/Code/hermes-agent/plugins/multica/{plugin.yaml,__init__.py,tools.py} with the 5 tools; tool handlers call the Multica REST/CLI surface (mirror the Python multica_client posture).
    agent: developer
    depends_on: [research]
  - id: test
    description: Hermes plugin tests near existing plugin tests — registration, list_blocked_gates filtering, label resolve-or-create, error surfacing.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review that the plugin claims tools only (no routine), manifest requires_env, and filter logic matches the pq-3 gate contract.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit + push (Hermes repo at ~/Code/hermes-agent).
    agent: developer
    depends_on: [review]

