files_to_modify:
  - file: hive/lib/planning_queue/gates.py
    change: NEW — gate comment formatter + answer formatter + leader elevate helper
  - file: hive/lib/planning_queue/multica_client.py
    change: extend — comment post, status update, resolve_or_create_label, add_label
  - file: hive/lib/config.py
    change: extend — blocked-for-human label default available

design_decisions:
  - decision: Require BOTH blocked-for-human label and @orchestrator GATE: comment
    rationale: "Locked fork default — label is the relay signal, comment carries the question; label-only loses payload, comment-only is noisy."
  - decision: resolve_or_create_label before attach
    rationale: "Multica labels are ID-based; the label list returned empty, so create-if-missing is required."

cross_cutting:
  - concern: idempotency
    action: "resolve_or_create_label must not double-create under concurrent elevations (lookup, create-if-absent, cache id)."

metric:
  applies: false
  justification: "Contract/substrate slice — it defines the machine-detectable gate shape (label + comment prefix) consumed by pq-5; its correctness is the exact-format and label-idempotency assertions in test_gates, not a runtime trend."

risks:
  - severity: medium
    description: Gate detectability depends on exact comment prefix + blocked status + ID-based label attach all succeeding.
    mitigation: Single elevate helper enforces all three atomically; tests assert the exact contract the relay polls.

