id: pq-3-gate-elevation-contract
epic: planning-queue
title: Gate-elevation contract (leader side) — GATE comment + blocked-for-human label
status: pending
complexity: medium
methodology: classic
depends_on: [pq-2-watermark-feeder]

description: |
  Slice 3. The leader-side gate-elevation contract: when a planning/execution leader
  hits an open question it can't resolve, it posts an `@orchestrator GATE: <question>`
  comment, sets the issue `blocked`, and attaches the `blocked-for-human` label. Both
  signals required (locked fork default): label = relay's operational signal, comment =
  the question payload. Multica labels are ID-based, so label attach needs resolve-or-create.

  Working state: a blocked planning issue is machine-detectable by (label AND GATE comment)
  — the input the relay (pq-5) will poll for.

acceptance_criteria:
  - "Given a leader needs maintainer input, when it elevates, then it posts a comment formatted exactly `@orchestrator GATE: <question>`, sets status=blocked, and attaches blocked-for-human."
  - "Given the blocked-for-human label does not exist, when attaching, then resolve_or_create_label creates it first, then attaches (ID-based)."
  - "Given a label-create race, when two elevations attach concurrently, then the label is not double-created (idempotent resolve-or-create)."
  - "Given an answer formatter, when a maintainer answer is supplied, then it renders the canonical `GATE ANSWER:` block with source attribution."
  - "Given an elevated issue, when scanned, then (blocked-for-human label present AND latest unresolved @orchestrator GATE: comment) uniquely identifies it as a live gate."

steps:
  - id: research
    description: Confirm multica label create/attach is ID-based; confirm comment + status-set CLI/API shapes.
    agent: researcher
  - id: implement
    description: Build hive/lib/planning_queue/gates.py (gate comment formatter, GATE ANSWER formatter, leader elevate helper) + extend multica_client.py with comment post, status update, resolve_or_create_label, add_label.
    agent: developer
    depends_on: [research]
  - id: test
    description: tests/planning_queue/test_gates.py — comment format, label resolve-or-create idempotency, both-signal detectability, answer formatter.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review label-race idempotency + exact comment-prefix contract (relay depends on it).
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit + push.
    agent: developer
    depends_on: [review]

