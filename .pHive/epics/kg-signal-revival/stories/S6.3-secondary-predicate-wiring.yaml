id: S6.3-secondary-predicate-wiring
epic: kg-signal-revival
title: Conditional wiring of secondary predicates (UX-driven subset)
status: pending
complexity: medium
methodology: classic
depends_on: [S6.1-hive-why-slash-command]
wave: S6

description: |
  Conditional story. After S6.1 ships /hive:why, evaluate which secondary predicates
  its surface design demands. Wire ONLY those (UX-driven subset per DP #6).

  Five secondary predicates available:
  - phase_started — workflow phase entry
  - phase_complete — workflow phase exit (success)
  - assigned_to — task/story owner set
  - blocked_by — hard dependency edge
  - depends_on — soft dependency edge

  Each predicate has candidate emit seams (per design-discussion v3 §2). Wire ONLY
  the ones /hive:why actually surfaces. If /hive:why's surface design ignores all 5,
  this story closes with zero net code change + a deferral note for follow-on epic.

  Anti-pattern guard: do NOT wire predicates "just in case." Wire iff there's a
  current consumer (/hive:why surface) that names them.

acceptance_criteria:
  - "Story execution begins with an audit: for each of 5 secondary predicates, does /hive:why surface it?"
  - "Audit output written to .pHive/epics/kg-signal-revival/docs/secondary-predicate-audit.md"
  - "For predicates with surface consumer: emit-site wiring lands (per design-discussion v3 §2 table)"
  - "For predicates without consumer: deferral note in audit doc; no code change"
  - "If audit yields zero predicates needing wiring, story closes with audit doc as sole deliverable"

steps:
  - id: research
    description: Re-read S6.1 implementation. For each secondary predicate, determine whether /hive:why surfaces it (i.e., does its merge/render logic reference it explicitly).
    agent: researcher
  - id: implement
    description: |
      Write secondary-predicate-audit.md.
      For each predicate flagged as "wire": insert emitKgEvent() at the design-
      discussion v3 §2 emit seam.
      For each "defer": document reason.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Per wired predicate: integration test triggers the emit + verifies triple lands.
      Audit doc covers all 5 predicates with explicit wire-or-defer.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm anti-pattern guard (no predicate wired without a /hive:why consumer). Confirm audit doc covers all 5 predicates.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: skills/hive/skills/why/SKILL.md
      purpose: Determines which predicates are consumers
    - path: .pHive/epics/kg-signal-revival/docs/design-discussion.md
      purpose: §2 has the per-predicate emit-seam table

cross_cutting:
  - concern: documentation
    action: "secondary-predicate-audit.md is the audit deliverable. If predicates wired, update kg-emit.md with new examples."
  - concern: versioning
    action: "Patch bump if any code change; no bump if pure-doc deferral."
  - concern: metrics
    applies: true

metric:
  applies: true
  name: kg_signal.secondary_predicate_wired_count
  direction: up
  baseline: 0
  target: null  # Open — depends on S6.1 surface design audit
  window: "S6.3 integrate close"
  source:
    kind: manual
    ref: "secondary-predicate-audit.md final tally"
  verify_at: "S6.3 integrate close"
