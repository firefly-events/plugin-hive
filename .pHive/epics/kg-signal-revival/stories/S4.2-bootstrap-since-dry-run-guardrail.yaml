cross_cutting:
  - concern: documentation
    action: "Add to README: 'Bootstrap historical KG triples from registered projects' section. CHANGELOG entry for new flags."
  - concern: versioning
    action: "Patch bump."
  - concern: metrics
    applies: false
    justification: "Tooling enhancement; enables S4.3-S4.5 backfill; doesn't move metric directly."

metric:
