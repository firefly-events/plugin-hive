id: S4.2-bootstrap-since-dry-run-guardrail
epic: kg-signal-revival
title: kg-bootstrap-from-projects.js --since flag + large-import guardrail
status: pending
complexity: medium
methodology: classic
depends_on: [S4.1-register-project-skill]
wave: S4

description: |
  Extend scripts/kg-bootstrap-from-projects.js with three new safety mechanisms:

  (1) --since YYYY-MM-DD flag (default: 2026-04-28 = predicate-canon-date per DP #5).
      Filters cycle-state entries by valid_from. Decisions older than --since are
      skipped (prevents R4 pollution from pre-canon entries).

  (2) Confirm --dry-run is DEFAULT mode + emits a diff-preview showing projected
      triple count per project + sample triples. --apply required for actual writes.

  (3) Large-import guardrail (per TPM supplement, reinforces R4): dry-run output
      reports projected triple count BEFORE --apply. If projected count > 10,000
      triples, --apply REFUSES unless --yes-large-import flag is also passed OR
      interactive y/N confirmation succeeds. Prevents flood from all-history
      backfill across 3 source projects + 14+ epic namespaces.

acceptance_criteria:
  - "--since YYYY-MM-DD parsed correctly; invalid format errors clearly"
  - "Default --since = 2026-04-28 when not specified"
  - "--dry-run is default; output shows 'WOULD INSERT N triples (M skipped pre---since)'"
  - "--apply requires either explicit count<10k OR --yes-large-import OR interactive confirmation"
  - "Existing dedupe-by-name + dedupe-by-canonical-path behavior preserved"
  - "Backfill output namespaced as {project_name}/{epic_id} (existing pattern)"
  - "Tests: invalid --since date errors; --apply without --yes-large-import on >10k projected refuses"

steps:
  - id: research
    description: Re-read kg-bootstrap-from-projects.js current state. Identify where to inject --since filter + --yes-large-import gate.
    agent: researcher
  - id: implement
    description: |
      Add --since parsing + filter in walk-cycle-state loop.
      Confirm --dry-run default (it already is — verify diff-preview emits projected count).
      Add --yes-large-import flag + interactive prompt fallback at >10k threshold.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Unit: --since parser; --yes-large-import gate logic.
      Integration: run against tests/fixtures with synthetic large/small project sets.
      Negative: invalid --since date errors; --apply on >10k without --yes-large-import errors.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm 10k threshold is reasonable; flag if it should be config-driven.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: scripts/kg-bootstrap-from-projects.js
      purpose: Target file
    - path: scripts/kg-import-cycle-state.js
