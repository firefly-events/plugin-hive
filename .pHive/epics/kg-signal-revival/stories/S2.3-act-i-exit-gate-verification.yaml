id: S2.3-act-i-exit-gate-verification
epic: kg-signal-revival
title: Automated Act I exit gate (closes S7 outcome metric loop)
status: pending
complexity: low
methodology: classic
depends_on: [S2.2-superseded-emit-sites]
wave: S2

description: |
  Add post-cycle verification automation. After every /meta-optimize cycle, run:

    SELECT COUNT(*) FROM triples
     WHERE predicate IN ('phase_failed', 'phase_blocked', 'superseded');

  Emit a log line: [kg-signal-revival] act-i-exit-gate: count=N

  When N first crosses 0 → > 0, closes the S7-kg-signal-production-emission outcome
  metric on the prior epic (kg-augmented-meta-signal). No code changes to S7 itself —
  this story IS S7's loop-closure.

  TPM note: this could collapse into S2.2. Keeping separate for traceability per DP #4 default.

acceptance_criteria:
  - "Script or hook exists that runs the SELECT post-cycle"
  - "Log line emitted with current count"
  - "On first non-zero count, also emit: [kg-signal-revival] act-i-exit-gate: PASSED (closes S7 outcome metric)"
  - "Verification script idempotent (safe to re-run)"
  - "Production verification: cycle on plugin-hive after S1/S2 merge → log shows count > 0"

steps:
  - id: research
    description: Identify post-cycle hook insertion point in /meta-optimize SKILL or a session-end hook.
    agent: researcher
  - id: implement
    description: Add hook OR small script at hive/scripts/act-i-exit-gate-check.sh; wire into post-cycle.
    agent: developer
    depends_on: [research]
  - id: test
    description: Run cycle with at least one priority-predicate emit; verify log line appears and PASSED marker fires once.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm hook doesn't double-fire; confirm idempotency.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit. Closes S7 outcome metric loop on first PASSED log.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: .pHive/epics/kg-augmented-meta-signal/stories/S7-kg-signal-production-emission.yaml
      purpose: Prior epic's outcome metric story — this story closes its loop
    - path: skills/hive/skills/meta-optimize/SKILL.md
      purpose: Post-cycle hook insertion point

cross_cutting:
  - concern: documentation
    action: "Reference this verification in hive/references/meta-optimize-contract.md."
  - concern: metrics
    applies: true

metric:
  applies: true
  name: s7_outcome_metric.priority_predicate_count
  direction: up
  baseline: 0
  target: 1
  window: "first cycle post-S2.2-merge"
  source:
    kind: sql
    ref: "SELECT COUNT(*) FROM triples WHERE predicate IN ('phase_failed','phase_blocked','superseded'); -- db: ~/.claude/hive/kg.sqlite"
  verify_at: "first post-S2.2 cycle"
  closes_loop_on: "kg-augmented-meta-signal/S7-kg-signal-production-emission"
