id: S2.1-phase-blocked-emit-sites
epic: kg-signal-revival
title: Emit phase_blocked at 3 seams (walker upstream-skip, TPM escalation, waiting-on-user)
status: pending
complexity: medium
methodology: classic
depends_on: [S1.2-phase-failed-walker-emit]
wave: S2

description: |
  Fan out phase_blocked emission to 3 seams:
  (1) hive/lib/dag-executor/walker.js upstream-skip path — when a step is skipped
      because its predecessor failed.
  (2) hive/agents/tpm.md escalation-raise — when TPM raises a pre-exec escalation,
      write phase_blocked for the topic-area stories in escalations[].stories[].
  (3) Orchestrator waiting-on-user gate — when user input is pending (e.g., plan
      sign-off, decision-point response), emit phase_blocked.

  Mechanical replication of S1.2 pattern. Same emitKgEvent() helper.

acceptance_criteria:
  - "walker.js upstream-skip path calls emitKgEvent with phase_blocked"
  - "TPM escalation-raise site emits phase_blocked for each story in escalations[].stories[]"
  - "Orchestrator waiting-on-user gate emits phase_blocked with object='waiting-user-input-<gate-name>'"
  - "Integration test: forced upstream skip → phase_blocked triple in kg.sqlite"
  - "write-rate counter delta between S1.2-baseline and S2.1 stays within 3-5× (sanity)"

steps:
  - id: research
    description: Locate the 3 emit seams. For each, confirm storyId + epicId + agentName in scope.
    agent: researcher
  - id: implement
    description: Insert emitKgEvent() calls at all 3 sites. Define block-reason slug taxonomy (upstream-skip, escalation-raised, awaiting-user-input).
    agent: developer
    depends_on: [research]
  - id: test
    description: Unit + integration tests for each seam. Verify R1 sanity via write-rate counter.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm seams chosen correctly (no double-emit; no missed waiting-on-user paths).
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: hive/lib/dag-executor/walker.js
      purpose: upstream-skip seam
    - path: hive/agents/tpm.md
      purpose: TPM escalation-raise seam (likely via skill, not persona directly)
    - path: skills/hive/skills/plan/SKILL.md
      purpose: Waiting-on-user gate sites (Phase B presentation, Phase B2 gate, etc.)

cross_cutting:
  - concern: documentation
    action: "kg-emit.md adds phase_blocked example."
  - concern: versioning
    action: "Patch bump (new emission paths)."
  - concern: metrics
    applies: true

metric:
  applies: true
  name: kg_signal.phase_blocked_per_blocked_cycle
  direction: up
  baseline: 0
  target: 1
  window: "first cycle with blocked step or escalation post-merge"
  source:
    kind: sql
    ref: "SELECT COUNT(*) FROM triples WHERE predicate='phase_blocked' AND valid_from >= <merge_time>"
  verify_at: "7d post-merge"

risks:
  - severity: low
    description: R1 fanout amplification — 3 seams × phase-default could push write volume up.
    mitigation: S1.1 write-rate counter detects; off-switch available.
