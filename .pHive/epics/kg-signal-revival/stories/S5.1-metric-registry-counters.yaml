id: S5.1-metric-registry-counters
epic: kg-signal-revival
title: KG signal counters + hit-rate gauge in metric_registry
status: pending
complexity: medium
methodology: classic
depends_on: [S2.2-superseded-emit-sites, S4.3-shindig-onboarding-backfill]
wave: S5

description: |
  Extend skills/hive/skills/meta-optimize/metric_registry.py with the KG-signal
  observability surface. Counter names per B0.2 contract:

  - kg_writes_total{predicate} — already added in S1.1. Re-register if not idempotent.
  - kg_signal_findings_total{cycle_id} — incremented at step-02c output (each emitted finding).
  - kg_signal_proposals_total{cycle_id} — incremented at step-03 merge when a kg-finding
    enters the proposal pool. THIS IS THE HIT-RATE JOIN SITE per DP #1.
  - hit_rate_5cycle gauge — computed at cycle close: count of last 5 cycles where
    kg_signal_proposals_total > 0, divided by 5.

acceptance_criteria:
  - "All 4 counters/gauges registered in metric_registry.py"
  - "Counter increments wired at step-02c output (kg_signal_findings_total)"
  - "Counter increments wired at step-03 merge (kg_signal_proposals_total)"
  - "hit_rate_5cycle gauge computed at cycle close; correct across 6+ cycles fixture"
  - "Counter names match B0.2 contract exactly"

steps:
  - id: research
    description: Re-read metric_registry.py registration pattern. Locate step-02c emission site + step-03 merge site for counter increment placement.
    agent: researcher
  - id: implement
    description: |
      Register 4 metrics. Insert increment calls at step-02c + step-03.
      Add cycle-close hook for hit_rate_5cycle computation.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Fixture: simulate 6 cycles with varying kg_signal_proposals_total values; verify hit_rate_5cycle correct.
      Integration: real /meta-optimize cycle increments counters end-to-end.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm counter discipline (all via metric_registry.register, no inline orphan counters). Confirm hit_rate computation handles edge cases (< 5 cycles).
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: skills/hive/skills/meta-optimize/metric_registry.py
      purpose: Counter registration target
    - path: hive/workflows/steps/meta-team-cycle/step-02c-kg-signal.md
      purpose: kg_signal_findings_total increment site
    - path: hive/workflows/steps/meta-team-cycle/step-03-proposal.md
      purpose: kg_signal_proposals_total increment site (HIT-RATE JOIN SITE)

cross_cutting:
  - concern: documentation
    action: "Update meta-optimize-contract.md with new counter list."
  - concern: versioning
    action: "Patch bump."
  - concern: metrics
    applies: true

metric:
  applies: true
  name: kg_signal.hit_rate_5cycle
  direction: up
  baseline: 0
  target: 0.2  # 1 cycle in 5 = "any non-zero hit" per user §10.4 lowered threshold
  window: "first 5 cycles post-S5.1-merge"
  source:
    kind: events
    ref: "hit_rate_5cycle gauge via metric_registry"
  verify_at: "5 cycles post-S5.1-merge"
  closes_loop_on: "design-discussion §1 north-star 1 (planning signal)"

risks:
  - severity: minor
    description: R6 telemetry surface drift (orphan counters).
    mitigation: All counters via metric_registry.register(); CI grep check for `kg_signal_*` counter names against registry.
