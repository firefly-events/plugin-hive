id: S1.1-emit-foundation-knob-counter
epic: kg-signal-revival
title: emitKgEvent() helper + emit_lifecycle_at scalar knob + write-rate counter
status: blocked
complexity: medium
methodology: classic
depends_on: [B0.1-consumer-contracts, B0.2-persist-ref-telemetry-contract]
wave: S1

description: |
  Ship the emit foundation. Three structural artifacts in one story:
  (1) `emit_lifecycle_at` config knob in both hive.config.yaml + hive/hive.config.yaml.
      Scalar values {phase, story, step, off}. Default: phase. The "off" value is the
      production kill-switch for R1 over-emission.
  (2) `emitKgEvent({subject, predicate, object, sourceEpic, sourceAgent})` helper in
      hive/lib/kg-emit.js (new) OR extension of hive/lib/session-end.js.
      Short-circuits if knob = "off". Calls existing kg_write(). Degrades silently
      if kg.sqlite unavailable.
  (3) Write-rate counter — every call to emitKgEvent() increments
      kg_writes_total{predicate} via metric_registry. Ships EARLY in S1 (not S5)
      per TPM tightening — without it we can't detect R1 manifesting before S5.

acceptance_criteria:
  - "hive.config.yaml + hive/hive.config.yaml both have emit_lifecycle_at: phase (default)"
  - "Config reader accepts {phase, story, step, off}; rejects others with clear error"
  - "emitKgEvent() helper exported from hive/lib/kg-emit.js (or session-end.js)"
  - "Setting emit_lifecycle_at: off causes emitKgEvent() to no-op (no kg_write, no counter increment)"
  - "kg_writes_total{predicate} counter registered in metric_registry.py"
  - "Unit tests: knob respected (4 values); counter increments; no-op on unknown kg.sqlite"
  - "Helper signature matches B0.1 consumer-contract expectations"

steps:
  - id: research
    description: Inspect existing kg_write() signature in session-end.js + metric_registry.py counter registration pattern.
    agent: researcher
  - id: implement
    description: |
      1. Add emit_lifecycle_at to both config files.
      2. Write emitKgEvent() in hive/lib/kg-emit.js.
      3. Register kg_writes_total counter.
      4. Unit tests under hive/tests/lib/kg-emit.test.js.
    agent: developer
    depends_on: [research]
  - id: test
    description: Run unit tests; verify counter increments via metric_registry inspection.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Validate API contract against B0.1; confirm "off" kill-switch works end-to-end; flag any leaks of the knob default into shipped baseline (must stay neutral).
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit to feature branch.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: hive/lib/session-end.js
      purpose: Existing kg_write() caller pattern; emitKgEvent may extend
    - path: hive.config.yaml
      purpose: Root config — emit_lifecycle_at goes here (maintainer-local; not shipped)
    - path: hive/hive.config.yaml
      purpose: Shipped baseline — knob default also lives here for consumers
    - path: skills/hive/skills/meta-optimize/metric_registry.py
      purpose: Counter registration target

code_examples:
  - title: kg_write() caller pattern from session-end.js
    file: hive/lib/session-end.js
    snippet: |
      if (triples.length > 0) {
        try {
          await kgWrite(triples, epicId, agentName);
        } catch (err) {
          kgError = err;
          console.error(`[session-end] kg_write() failed: ${err.message}`);
        }
