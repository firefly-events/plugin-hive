cross_cutting:
  - concern: documentation
    action: "Add emit_lifecycle_at to config reference doc + helper API to hive/references/kg-emit.md (new). CHANGELOG entry for new helper."
  - concern: versioning
    action: "Plugin behavior changes: new helper + config knob. Bump patch version on integrate."
  - concern: metrics
    applies: true
    name: kg_signal.write_rate_per_cycle
    direction: up
    baseline: 0
    target: 1
    window: "first cycle post-merge"
    source:
