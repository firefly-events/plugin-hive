id: S3.2-wrapper-port-and-collection-bootstrap
epic: kg-signal-revival
title: chromadb-wrapper reads dynamic port + bootstraps decisions collection
status: blocked
complexity: low
methodology: classic
depends_on: [S3.1-sidecar-lifecycle-scripts]
wave: S3

description: |
  Update hive/lib/chromadb-wrapper.js to:
  (1) Read port from ~/.claude/hive/chromadb.port instead of hardcoded 8000.
      Fall back to 8000 if file absent (back-compat for ad-hoc sidecar setups).
  (2) On first invocation per session, ensure the "decisions" collection exists
      via idempotent getOrCreate. Schema per B0.2:
      - id: decision-key (string)
      - document: decision summary text
      - metadata: {predicate, source_epic, source_agent, valid_from}

acceptance_criteria:
  - "Wrapper reads ~/.claude/hive/chromadb.port at module load"
  - "Falls back to DEFAULT_PORT=8000 if file absent"
  - "First isAvailable() check ensures decisions collection exists"
  - "Sample document write + similarity query roundtrips correctly"
  - "Wrapper still degrades gracefully when sidecar unreachable (returns []/false/null)"

steps:
  - id: research
    description: Re-read existing chromadb-wrapper.js to confirm read entry-point + add port-lookup function shape.
    agent: researcher
  - id: implement
    description: |
      Add readDynamicPort() function. Cache port read at module load.
      Add ensureDecisionsCollection() called from isAvailable() first-check.
      Use ChromaDB getOrCreate API.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Unit: port read from file when present; falls back to 8000 when absent.
      Integration: fresh sidecar → wrapper.isAvailable() returns true; sample
      index() + query() round-trips.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Validate back-compat preserved; confirm collection bootstrap doesn't error on second invocation (idempotent).
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit.
    agent: developer
    depends_on: [review]

