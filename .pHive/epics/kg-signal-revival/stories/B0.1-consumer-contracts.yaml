id: B0.1-consumer-contracts
epic: kg-signal-revival
title: Predicate consumer contracts document
status: pending
complexity: low
methodology: classic
depends_on: []
wave: B0

description: |
  Author the per-predicate consumer-contract document. For each of the 9 predicates
  (decided, superseded, assigned_to, blocked_by, depends_on, phase_started,
  phase_complete, phase_failed, phase_blocked), name the consumer that needs it OR
  explicitly defer with a one-line reason.

  This is the docs-only B0 sliver. Gates S1/S2 emit-site schema work. Without it,
  emission may write predicates no consumer reads (anti-b0-sliver-pattern), forcing
  re-emission later.

  3 priority predicates (phase_failed, phase_blocked, superseded) MUST have step-02c
  named as their consumer. 5 secondary predicates may defer to S6.3 conditional on
  /hive:why surface design.

acceptance_criteria:
  - "Doc exists at .pHive/epics/kg-signal-revival/docs/consumer-contracts.md"
  - "All 9 predicates listed with consumer OR deferral reason"
  - "phase_failed, phase_blocked, superseded explicitly mapped to step-02c"
  - "Reviewer can validate S1+S2 predicate semantics against this doc before emit lands"

steps:
  - id: research
    description: Re-read knowledge-graph-schema.md predicate vocabulary section + step-02c-kg-signal.md to confirm consumer query shape per predicate.
    agent: researcher
  - id: implement
    description: Write consumer-contracts.md with table (predicate | consumer | source-of-truth | example query).
    agent: developer
    depends_on: [research]
  - id: test
    description: Smoke-check doc covers all 9 predicates; cross-reference each priority predicate's consumer query against step-02c §3 query syntax.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Verify doc completeness; flag deferrals that lack reason.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit doc to feature branch.
    agent: developer
    depends_on: [review]

