id: S3.1-sidecar-lifecycle-scripts
epic: kg-signal-revival
title: ChromaDB sidecar lifecycle scripts + SessionStart hook
status: blocked
complexity: medium
methodology: classic
depends_on: [B0.2-persist-ref-telemetry-contract]
wave: S3

description: |
  Stand up the ChromaDB sidecar via three lifecycle scripts and a SessionStart hook.
  Per user §10.1 decision: (A) sidecar auto-start (NOT in-process sqlite-vec).

  Scripts:
  - hive/scripts/chromadb-start.sh — launch sidecar on ephemeral port; write
    ~/.claude/hive/chromadb.{port,pid,lock}. Single-instance via lockfile.
  - hive/scripts/chromadb-stop.sh — SIGTERM the pid; clean state files.
  - hive/scripts/chromadb-status.sh — report running state.

  SessionStart hook: invoke chromadb-start.sh; skip if isAvailable() returns true.
  Warn (not error) if start fails.

acceptance_criteria:
  - "chromadb-start.sh launches sidecar; writes port/pid/lock files; single-instance via lockfile (second invocation fast-paths)"
  - "chromadb-stop.sh terminates sidecar cleanly; removes state files"
  - "chromadb-status.sh reports running|stopped|stale-lockfile"
  - "SessionStart hook entry added; runs chromadb-start.sh; skips if already running"
  - "Failed start emits warning to user, not hard error (degraded mode)"
  - "Port file readable by wrapper; pid file used by stop script"

steps:
  - id: research
    description: Check chromadb CLI invocation (pip install chromadb provides 'chroma run'). Identify SessionStart hook config location (hive settings).
    agent: researcher
  - id: implement
    description: |
      Write 3 scripts. Add SessionStart hook entry. State files in ~/.claude/hive/.
      Lockfile via flock; ephemeral port via netstat/lsof or chromadb-supplied --port 0.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Functional: fresh session starts sidecar; second session sees running.
      Negative: corrupted lockfile cleared; missing chromadb binary warns but doesn't crash.
      Integration: chromadb-status correctly reports across all three states.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Validate lifecycle scripts handle crash-recovery; confirm no port conflicts; security check on lockfile permissions.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: hive/lib/chromadb-wrapper.js
      purpose: Consumer that will read port from chromadb.port file
    - path: hive/scripts/
