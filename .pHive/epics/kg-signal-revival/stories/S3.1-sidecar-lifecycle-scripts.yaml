    action: "New hive/references/chromadb-ops.md doc covers script invocation + troubleshooting. README mentions chromadb dependency."
  - concern: versioning
    action: "Minor version bump (new external dependency: chromadb Python pkg)."
  - concern: metrics
    applies: true

metric:
  applies: true
  name: chromadb.sidecar_availability_per_session
  direction: up
  baseline: 0
  target: 1
  window: "next 5 sessions post-merge"
  source:
    kind: events
    ref: "isAvailable() probe count in session logs; PASS = ≥4 of 5 sessions show sidecar reachable"
  verify_at: "5 sessions post-merge"

risks:
  - severity: medium
    description: R2 — sidecar lifecycle (port collisions, crash, race).
    mitigation: Ephemeral port; lockfile single-instance; isAvailable() fast-path; negative tests.
