id: S6.1-hive-why-slash-command
epic: kg-signal-revival
title: /hive:why retrospection UX slash command
status: pending
complexity: medium
methodology: classic
depends_on: [S2.2-superseded-emit-sites, S3.2-wrapper-port-and-collection-bootstrap]
wave: S6

description: |
  Primary delivery surface for the audit-trail north-star. New skill at
  skills/hive/skills/why/SKILL.md.

  Input modes (per DP #9):
  (a) --strict --predicate X --entity Y — structured query. Phase A only. Highest precision.
  (b) free-form topic string — fuzzy + semantic. Phase A + Phase B fallback.

  Implementation phases:
  - Phase A: predicate+entity match via MemoryStore.query_decisions({entity, predicate, as_of: now}).
  - Phase B (only if ChromaDB available per S3): semantic similarity over "decisions" collection.
  - Phase C: merge + dedupe + render with provenance: "{subject} {predicate} {object} (valid_from: ..., source_epic: ..., source_agent: ...)"

  Per DP #9 doc-surface priority: --strict structured input is PRIMARY documented usage.
  Free-form via semantic similarity is documented as the broader fallback.

acceptance_criteria:
  - "Skill at skills/hive/skills/why/SKILL.md exists"
  - "--strict --predicate X --entity Y returns ≥1 triple for any in-window decision"
  - "Free-form topic returns merged Phase A + Phase B results when ChromaDB available"
  - "Skill degrades to SQLite-only mode when ChromaDB unavailable (still returns Phase A results)"
  - "Output renders: subject + predicate + object + provenance for each result"
  - "Skill docstring emphasizes --strict as primary usage; free-form as fallback"

steps:
  - id: research
    description: Inspect MemoryStore.query_decisions() signature. Re-read chromadb-wrapper.query() signature. Identify skill scaffold pattern.
    agent: researcher
  - id: implement
    description: |
      Write skill body with 3-phase implementation. Use --strict flag detection.
      Render provenance line per result. Add docstring + example invocations.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Functional: --strict --predicate decided --entity kg-signal-revival returns at
      least the epic-design decision (or other decided triple).
      Free-form: topic "knowledge graph" returns merged results.
      Degraded: with chromadb down, free-form still returns Phase A SQLite results.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Validate query precision (--strict shouldn't fuzzy-match); validate semantic fallback doesn't blow up on cold ChromaDB; confirm provenance formatting.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: hive/references/memory-store-interface.md
      purpose: query_decisions() canon
    - path: hive/lib/chromadb-wrapper.js
      purpose: Phase B query path
    - path: hive/references/knowledge-graph-schema.md
      purpose: Triple shape + provenance fields

cross_cutting:
  - concern: documentation
    action: "Skill SKILL.md is user-facing doc. README mentions /hive:why under usage. CHANGELOG entry."
  - concern: versioning
    action: "Minor bump (new user-visible skill)."
  - concern: metrics
    applies: true

metric:
  applies: true
  name: kg_signal.hive_why_query_success_rate
  direction: up
  baseline: 0
  target: 1
  window: "5 ad-hoc queries post-merge"
  source:
    kind: manual
    ref: "Run 5 /hive:why queries spanning recent decisions; ≥4 return ≥1 result"
  verify_at: "5 queries post-merge"
  closes_loop_on: "design-discussion §1 north-star 2 (audit trail)"
