name: execute-flow-followons-converge-loop
title: "Execute-flow follow-ons + bounded converge-loop — harden DAG executor x Multica substrate"
description: >
  Direct follow-on to PR #316 (feat/dag-execute-node-outputs). Hardens the Hive DAG-executor
  x Multica execution substrate so gaps surfaced by dogfooding plan->execute->review on a
  throwaway tic-tac-toe consumer project don't bite a real consumer. Six independently-shippable,
  dependency-sequenced stories: (1) mirror gate-review into tdd/bdd so needs_revision can't
  silently ship; (2) make implement output visible to review before integrate; (3) extend
  Multica #13 output channel across all test-swarm steps; (4) verify + fix terminal-issue
  re-dispatch; (5) seed dag-outputs gitignore into consumer repos; (6) bounded converge-loop
  primitive (review->fix->re-review until gate-clean or max iterations). All stories are
  Python executor work with no UI. Architectural invariant: DAG executor owns flow/gates/routing;
  Multica provides only agent execution.
target_codebase: plugin-hive
