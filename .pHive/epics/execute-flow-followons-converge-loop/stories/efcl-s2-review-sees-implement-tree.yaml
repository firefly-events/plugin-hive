design_decisions:
- decision: Prefer per-node reconcile over per-node push from inside the implement agent
  rationale: "Reconcile already exists (reconcile.py), already guards unsafe epic_dir (7ab05505), and keeps 'Multica only executes' intact. Pushing from inside the implement agent leaks flow control into the agent. Per design discussion §3 Story 2."
- decision: Re-entrancy spike gates the mechanism choice
  rationale: "Per [grill H1]: current reconcile runs pre-gate only; we cannot assume it is re-entrant mid-flow for free. Spike runs first in research; fallback to per-node push if reconcile is not cheaply re-entrant."
- decision: Integration test asserts presence not absence-of-error
  rationale: "Per design discussion §7: silent {} from harvest (agent.py:512) makes absence-of-error look like success. The test must assert the sentinel file is readable."
cross_cutting:
- concern: documentation
  action: "Update any reference doc describing the execute flow or reconcile handler to note that reconcile now fires per implement node, not only pre-gate."
- concern: metrics
  action: "applies: false — this is a correctness fix. Review passing code it could never read is a posture flaw, not a throughput metric. No quantitative outcome to declare beyond the integration test assertion."
risks:
- severity: medium
  description: "Two implement nodes in the same parallel dispatch group trigger concurrent reconciles that interleave, corrupting the review checkout."
  mitigation: "Re-entrancy spike (research step) explicitly checks for shared-lock contention. If found, fallback to per-node push eliminates the race. Per [grill V1] in design discussion."
- severity: medium
  description: "Per-node reconcile materializes a half-written implement tree into review's checkout if implement terminates before fully committing."
  mitigation: "Reconcile already rejects unsafe epic_dir (7ab05505). Per-node invocation fires only after the implement handler signals completion, not mid-commit."
