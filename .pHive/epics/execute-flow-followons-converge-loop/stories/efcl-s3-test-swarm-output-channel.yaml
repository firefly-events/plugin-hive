id: efcl-s3-test-swarm-output-channel
epic: execute-flow-followons-converge-loop
title: Add Multica output channel (#13) to all test-swarm step files
status: pending
complexity: low
methodology: classic
needs_backend: true
depends_on: []
parallel_allowed: true
parallel_rationale: bounded-slice
description: >
  The Multica #13 output channel (.pHive/dag-outputs/outputs.yaml, written by agent,
  harvested by executor via _harvest_node_outputs at agent.py:512) is the only path for
  non-file semantic values that when: predicates and downstream input edges consume.
  step-04b-scenario-replay is the only test-swarm step that carries this block today.
  The remaining ~8 step files (step-00-rebuild through step-08-promote, excluding step-04b)
  lack the block, so a Multica-bound /test cannot harvest most step outputs. This story
  enumerates every step file in hive/workflows/steps/test-swarm/, copies step-04b's
  outputs.yaml block as the template, and adds the #13 block plus declared node outputs
  to each step. Steps that legitimately have no semantic output (e.g., step-00-rebuild)
  get the block present-but-empty so harvest is consistently defined. Mechanical breadth
  work; verified by a dry-run harvest asserting each declared key is present.
acceptance_criteria:
- "Given all step files in hive/workflows/steps/test-swarm/ after this story commits, when enumerated, then every file contains a .pHive/dag-outputs/outputs.yaml emission block"
- "Given each step's declared node outputs, when the executor runs _harvest_node_outputs, then each declared key is present in the harvested dict (not silently returning {})"
- "Given step-00-rebuild (or any step with no semantic output), when reviewed, then it carries the block present-but-empty rather than omitting it"
- "Given step-04b-scenario-replay, when reviewed, then its existing block is unchanged (not overwritten)"
- "Given a dry-run harvest test per step, when run, then each step asserts declared output key presence (not just absence of error)"
steps:
- id: implement
  description: >
    Enumerate all files in hive/workflows/steps/test-swarm/. For each file except
    step-04b-scenario-replay (which already has the block): read the file, identify what
    semantic outputs the step actually produces, add the .pHive/dag-outputs/outputs.yaml
    emission block using step-04b as the template, and declare node outputs matched to what
    that step produces. Steps with no semantic output (e.g. step-00-rebuild) get the block
    present-but-empty. Record which steps got empty vs populated blocks for the test step.
  agent: backend-developer
- id: test
  description: >
    Write a dry-run harvest test that loads each modified step file, mocks the
    _harvest_node_outputs path (agent.py:512), and asserts each declared output key is
    present in the harvest result. For steps with an empty block, assert the harvest yields
    {} without error (confirming present-but-empty is handled gracefully). Assert step-04b
    is unmodified (checksum or content-compare against pre-story state).
  agent: tester
  depends_on:
  - implement
- id: review
  description: >
    Review each modified step file: confirm the outputs.yaml block matches step-04b's
    template structure, declared outputs match what the step actually produces (not invented),
    and step-04b is untouched. Review the dry-run harvest test for the silent-{} failure
    mode: it must assert key presence, not just no-error. Confirm step count matches the
    enumerated set from implement.
  agent: reviewer
  depends_on:
  - test
- id: integrate
  description: >
    Commit "[efcl-s3] feat(test-swarm): add #13 output channel block to all step files
    (~8 steps); dry-run harvest test per step" on feat/dag-execute-node-outputs.
  agent: developer
  depends_on:
  - review
context:
