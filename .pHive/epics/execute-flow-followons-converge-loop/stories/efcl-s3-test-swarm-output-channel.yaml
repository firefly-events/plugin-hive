design_decisions:
- decision: Use step-04b as the block template for all other steps
  rationale: "step-04b is the only step with verified working #13 output channel wiring. Copying it as the template ensures structural consistency."
- decision: Empty block for steps with no semantic output
  rationale: "Consistent presence means harvest always knows where to look. Silent absence (block missing) is the failure mode that makes harvest yield {} and look like success per design discussion §4."
cross_cutting:
- concern: documentation
  action: "Step files ARE the documentation for test-swarm agents. No additional GUIDE.md or README changes needed — the step files themselves are the deliverable."
- concern: metrics
  action: "applies: false — output channel coverage breadth is a correctness concern (harvest either finds a key or silently gets {}). No throughput or latency outcome to declare."
risks:
- severity: low
  description: "A step's declared outputs don't match what the agent actually writes to outputs.yaml, so harvest yields {} and the gap looks like success."
  mitigation: "Dry-run harvest test asserts key presence (not no-error). Research in implement step reads each step file to understand what it actually produces before declaring outputs."
- severity: low
  description: step-04b is accidentally overwritten rather than left unchanged.
  mitigation: Review step explicitly checks step-04b content is unmodified; test asserts checksum or content-compare.
