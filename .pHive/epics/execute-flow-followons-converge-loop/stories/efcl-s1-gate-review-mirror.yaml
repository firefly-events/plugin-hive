id: efcl-s1-gate-review-mirror
epic: execute-flow-followons-converge-loop
title: Mirror gate-review node into tdd and bdd methodology workflows
status: pending
complexity: low
methodology: classic
needs_backend: true
depends_on: []
description: >
  PR #316 added a gate-review node to development.classic.workflow.yaml that blocks
  integrate when review_verdict == needs_revision. The tdd and bdd methodology workflows
  have no such gate: integrate depends on review directly, so needs_revision flows
  straight into integrate. This story copies the gate-review node verbatim into
  development.tdd.workflow.yaml and development.bdd.workflow.yaml (same predicate string,
  same bounded retry block) and rewrites integrate.depends_on to include gate-review
  in both graphs. The enforcement test (test_gate_review_enforce.py) is parametrized
  over all three methodology graphs rather than copy-pasted, so a future fourth
  methodology is one list entry. No executor code changes — only graph YAML and one
  test generalization.
acceptance_criteria:
- "Given development.tdd.workflow.yaml after this story commits, when reviewed, then it contains a gate-review node with predicate 'review_verdict must not equal needs_revision' and integrate.depends_on includes gate-review"
- "Given development.bdd.workflow.yaml after this story commits, when reviewed, then it contains a gate-review node with predicate 'review_verdict must not equal needs_revision' and integrate.depends_on includes gate-review"
- "Given the gate-review node in tdd and bdd, when review_verdict is needs_revision, then the gate fails and integrate does not run"
- "Given test_gate_review_enforce.py after this story commits, when run, then it is parametrized over classic + tdd + bdd graphs and all three pass the enforcement assertion"
- "Given the bounded-retry assertion from the classic test, when mirrored, then tdd and bdd gate-review nodes also assert max_attempts == 1"
- "Given no executor code changes, when this story integrates, then hive/lib/dag_executor/ Python files are unmodified"
steps:
- id: research
  description: >
    Read development.classic.workflow.yaml at the gate-review node (line ~596) and integrate
    node (line ~622) to extract the exact predicate, retry block, and depends_on wiring.
    Read development.tdd.workflow.yaml (lines 203, 237) and development.bdd.workflow.yaml
    (lines 163, 196) to confirm the current gap: no interposed gate, integrate depends on
    review directly. Read test_gate_review_enforce.py to understand the current test shape
    before parametrizing. Verify tdd already uses a gate node (implementation must not be empty,
    line ~153) as proof the gate shape is known-good in tdd.
  agent: researcher
- id: implement
  description: >
    Copy the gate-review node verbatim from development.classic.workflow.yaml into both
    development.tdd.workflow.yaml and development.bdd.workflow.yaml: predicate string
    "review_verdict must not equal needs_revision", retry block with max_attempts: 1,
    on: gate_failed, retry_node: review. Rewrite integrate.depends_on in both graphs to
    include gate-review. Parametrize test_gate_review_enforce.py over [classic, tdd, bdd]
    so a single test matrix covers all three. Mirror the bounded-retry assertion
    (test_classic_gate_has_bounded_retry) to also cover tdd and bdd.
  agent: backend-developer
  depends_on:
  - research
- id: test
  description: >
    Run hive/lib/dag_executor/routing/tests/test_gate_review_enforce.py. Assert all three
    methodology parametrize cases pass: gate blocks integrate on needs_revision, gate allows
    integrate on approved, and max_attempts == 1 for each. Run the graph loader/validator
    against all three methodology YAMLs to confirm no structural regressions.
  agent: tester
  depends_on:
  - implement
- id: review
  description: >
    Review the gate-review node copy in tdd and bdd for exact predicate fidelity (must match
    classic byte-for-byte: "review_verdict must not equal needs_revision"). Review integrate
    depends_on wiring in both graphs. Review the parametrized test for completeness (three
    cases, bounded-retry assertion present). Confirm no executor Python files are modified.
  agent: reviewer
  depends_on:
  - test
- id: integrate
  description: >
    Commit "[efcl-s1] feat(workflows): mirror gate-review node into tdd and bdd, parametrize
    enforcement test over 3 methodologies" on feat/dag-execute-node-outputs.
  agent: developer
  depends_on:
  - review
context:
  codebase: /Users/hive/multica_workspaces/7ba0ade0-21cd-4e54-98a0-72a242ddf9e9/2a6865ff/workdir/plugin-hive
  key_files:
  - path: hive/workflows/development.classic.workflow.yaml
    purpose: "Source of the gate-review node (line ~596) and integrate.depends_on (line ~622) to copy verbatim"
  - path: hive/workflows/development.tdd.workflow.yaml
    purpose: "Target: add gate-review node; rewrite integrate.depends_on to include it"
  - path: hive/workflows/development.bdd.workflow.yaml
    purpose: "Target: add gate-review node; rewrite integrate.depends_on to include it"
  - path: hive/lib/dag_executor/routing/tests/test_gate_review_enforce.py
    purpose: "Test to parametrize over classic + tdd + bdd; add bounded-retry assertion for all three"
files_to_modify:
- file: hive/workflows/development.tdd.workflow.yaml
  change: "ADD gate-review node (predicate: review_verdict must not equal needs_revision, max_attempts: 1, retry_node: review); REWRITE integrate.depends_on to include gate-review"
- file: hive/workflows/development.bdd.workflow.yaml
  change: "ADD gate-review node (same as classic); REWRITE integrate.depends_on to include gate-review"
- file: hive/lib/dag_executor/routing/tests/test_gate_review_enforce.py
  change: "PARAMETRIZE over [classic, tdd, bdd]; MIRROR bounded-retry assertion to cover all three"
design_decisions:
- decision: Copy predicate string verbatim from classic
  rationale: Predicate parser was hardened in #316 (8d441edc) to fail loud on missing/empty values — the mirror inherits a parser that already fails closed. No new predicate logic needed.
- decision: Parametrize test rather than copy-paste per-graph tests
  rationale: "Prevents drift: a later predicate change that updates one test and forgets two is the stated medium-risk in the design discussion. Parametrize is the mitigation."
- decision: max_attempts 1 on gate-review in both graphs
  rationale: "Matches classic: gate fails loud immediately, no wasted re-dispatch. The converge-loop (s6) is what makes retry_node real when bounded iteration is actually wanted."
cross_cutting:
- concern: documentation
  action: "No GUIDE.md or README changes needed — gate-review is internal workflow wiring, not a consumer-facing config key or skill. If development.tdd.workflow.yaml or development.bdd.workflow.yaml are referenced in any reference doc describing the tdd/bdd methodology flow, update that doc to note the gate-review node."
- concern: metrics
  action: "applies: false — this is a correctness fix (plugging a silent-ship path), not a throughput or latency change. No measurable outcome to declare beyond pass/fail of the new gate tests."
risks:
- severity: medium
  description: >
    Gate-review node copied with a subtle difference (e.g., different predicate whitespace or missing retry field) leaves the gap partially open while tests pass on a lenient matcher.
  mitigation: "Research step reads classic gate-review byte-for-byte before editing. Review step asserts predicate fidelity explicitly."
- severity: low
  description: Parametrized test matrix adds a new tdd or bdd case that was already covered differently, creating a duplicate assertion.
  mitigation: Research step reads the existing test file before parametrizing to avoid redundancy.
references:
- path: hive/workflows/development.classic.workflow.yaml
  relevant_excerpt: "gate-review node at line ~596: node_type gate, predicate 'review_verdict must not equal needs_revision', retry max_attempts 1, on gate_failed, retry_node review. integrate.depends_on includes gate-review at line ~622."
- path: .pHive/epics/execute-flow-followons-converge-loop/docs/design-discussion.md
  relevant_excerpt: "Story 1: copy classic gate-review node verbatim into tdd and bdd; parametrize test_gate_review_enforce.py over all three. No executor code changes."
