design_decisions:
- decision: "converge: node attribute, not a new NodeType"
  rationale: "Preserves model.py:17 No LOOP invariant (enum stays at 4 members). A new LOOP NodeType would force changes to enum, graph validator, loader, and every exhaustiveness check that switches on NodeType. Per [grill U1] resolved in design discussion §3 Story 6."
- decision: Distinct converge field, not overloading retry field
  rationale: "retry means transient-failure re-dispatch (same node). converge means deliberate fix->re-review iteration (different target node). Overloading retry with a second meaning makes precedence ambiguous and breaks existing retry tests. Per [grill U1]."
- decision: Converge takes precedence over retry on the same node; transient-retry counter resets per iteration
  rationale: "A converge iteration that also hits a transient agent failure should continue iterating (not abort the converge loop on a transient). Resetting the transient counter per iteration prevents a single noisy run from consuming all transient retries across converge iterations."
- decision: Halt loud on max_iterations (ConvergeExhaustedError with gate id, count, last verdict)
  rationale: "Silent termination would look like a gate pass. Loud failure (named error with context) lets the operator diagnose whether the fix agent actually ran or the gate predicate is stuck."
- decision: GATE-only validator restriction on converge block
  rationale: "Converge is a loop exit condition; only GATE nodes have a predicate to exit on. Accepting converge on AGENT/SCRIPT/PAUSE would produce a loop with no exit condition."
cross_cutting:
- concern: documentation
  action: "Update hive/references/ reference docs for the DAG graph schema to document the converge: block, its fields (retry_node, max_iterations, exit_when), GATE-only restriction, and the halt-loud termination behavior. If there is a methodology authoring guide, add a worked example of a converge loop (gate-review -> fix -> re-review)."
- concern: versioning
  action: "Minor bump: converge: is a new additive graph schema feature. Existing graphs without converge: are unaffected (field is Optional). Consumer-visible in the sense that authors of workflow YAML can now use this field."
- concern: metrics
  action: "applies: true — the converge-loop introduces a countable iteration metric. Declare: iteration_count per gate-with-converge (emitted on each node_retry event with iteration_index); max_iterations_reached rate (ConvergeExhaustedError count / total converge gates). Window: per-epic run. Measurement: node_retry event stream filtered to converge events."
risks:
- severity: high
  description: "Convergence is infinite if max_iterations is not enforced strictly (off-by-one, unsigned overflow on iteration count)."
  mitigation: "Walker increments iteration_index before comparing to max_iterations (pre-increment, so max_iterations==3 allows iterations 0, 1, 2 then halts). Test: halt-loud-at-max-iterations asserts exactly 3 dispatch events before error."
- severity: high
  description: "retry and converge on the same node interact unexpectedly — converge outer loop and retry inner loop fight for control."
  mitigation: "Explicit precedence rule (converge wins; transient-retry counter resets per iteration) is documented and tested. Design discussion §4 flags this as the residual Q1 risk — maintainer call on precedence needed before schema work (open question 1)."
- severity: medium
  description: "Resume-mid-loop restarts at iteration 0 instead of the persisted iteration_index, causing the converge loop to re-run already-completed iterations."
  mitigation: "Walker reads iteration_index from the last node_retry telemetry event on startup. Resume test (resume-mid-loop) asserts the walker does not re-dispatch the retry_node for iterations already completed."
