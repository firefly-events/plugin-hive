id: efcl-s6-bounded-converge-loop
epic: execute-flow-followons-converge-loop
title: Bounded converge-loop primitive — review to fix to re-review until gate-clean or max iterations
status: pending
complexity: high
methodology: classic
needs_backend: true
depends_on:
- efcl-s1-gate-review-mirror
- efcl-s2-review-sees-implement-tree
description: >
  Today needs_revision halts the run. The mature behavior: review -> fix -> re-review,
  bounded, until gate-clean or max iterations, then halt loud. This story implements a
  converge-loop primitive in the graph schema and DAG-executor walker. The design resolved:
  add a distinct converge: block to the Node schema ({retry_node, max_iterations, exit_when})
  rather than a new NodeType (preserves the model.py:17 No LOOP invariant; enum stays at
  four members) or an overloaded retry field (retry means transient-failure re-dispatch;
  converge means deliberate fix->re-review iteration). The walker change is the
  load-bearing sub-story: _dispatch_with_retry today re-dispatches only the same node
  (walker.py:405); honoring a converge target means re-dispatching an upstream node
  (the fix/review pair) and re-walking its dependents until the gate is clean or
  max_iterations is hit, then halting loud. Termination and resume telemetry piggyback
  on the existing node_retry event (walker.py:425), extended with an iteration index.
  Ships as one independently-shippable story; schema/walker/termination/telemetry/test
  split is internal sequencing only.
acceptance_criteria:
- "Given a gate node with a converge: block ({retry_node: fix, max_iterations: 3}), when the gate fails, then the walker re-dispatches the retry_node (fix) and re-walks its dependents (review, gate) for up to 3 iterations"
- "Given the converge loop iterating, when the gate passes before max_iterations, then the walker exits the loop and continues with integrate"
- "Given the converge loop reaching max_iterations without gate-clean, then the walker halts loud (raises a terminal error naming the gate, the iteration count, and the last verdict)"
- "Given a node with both retry: and converge: blocks, when a converge iteration also hits a transient agent failure, then converge takes precedence and the transient-retry counter is reset per iteration"
- "Given a converge loop mid-iteration at resume time, when the run resumes, then the walker restores the iteration index from telemetry and continues from the correct iteration"
- "Given model.py NodeType enum after this story commits, when reviewed, then it still contains exactly {AGENT, SCRIPT, GATE, PAUSE} — no LOOP member added"
- "Given the converge: block on any node type, when the graph validator runs, then it accepts converge on GATE nodes and rejects it on AGENT/SCRIPT/PAUSE nodes"
- "Given the three test cases (converge-clean-on-iteration-2, halt-loud-at-max, resume-mid-loop), when the test suite runs, then all three pass"
steps:
- id: research
  description: >
    Read graph/model.py:17 to confirm the NodeType enum (AGENT, SCRIPT, GATE, PAUSE;
    No LOOP comment). Read walker.py _dispatch_with_retry (line ~405) and the
    node_retry event emission (line ~425) to understand the existing retry plumbing and
    how to extend it with an iteration index. Read graph/validator.py and graph/loader.py
    to understand where schema validation and converge: block parsing must land. Confirm
    that retry field on a node currently means transient-failure re-dispatch (same node),
    NOT converge semantics. Identify whether the gate-review node's retry block (classic
    graph, max_attempts: 1, retry_node: review) is wired or declarative today — the
    design discussion says declarative (walker does not honor retry_node). Confirm this
    by reading walker.py for any retry_node handling.
  agent: researcher
- id: implement
  description: >
    1. Schema (model.py): add converge: Optional[ConvergeBlock] = None to the Node model.
       ConvergeBlock fields: retry_node (str), max_iterations (int), exit_when (optional
       predicate string; defaults to gate-clean if absent).
    2. Validator/loader (validator.py, loader.py): accept converge: on GATE nodes only;
       reject on AGENT/SCRIPT/PAUSE with a clear error message.
    3. Walker (walker.py, _dispatch_with_retry): when a GATE node fails and has a
       converge: block, enter the converge loop — re-dispatch retry_node, re-walk its
       dependents up to max_iterations. On gate-clean: exit loop, continue downstream.
       On max_iterations exhausted: halt loud (raise ConvergeExhaustedError naming gate,
       iteration count, last verdict). Define precedence for retry + converge on same node:
       converge takes precedence; transient-retry counter resets per iteration.
    4. Telemetry: extend node_retry event (walker.py:425) with iteration_index field for
       converge events. Resume: on run restart, walker reads the last iteration_index from
       telemetry and continues from there.
    5. Test cases: converge-clean-on-iteration-2 (gate fails iter 1, passes iter 2);
       halt-loud-at-max-iterations (gate fails all 3 iterations, ConvergeExhaustedError
       is raised with correct context); resume-mid-loop (walker resumes at iteration 2
       from persisted telemetry, not iteration 1).
  agent: backend-developer
  depends_on:
  - research
- id: test
  description: >
    Run all three converge test cases: converge-clean-on-iteration-2, halt-loud-at-max-
    iterations, resume-mid-loop. Assert ConvergeExhaustedError message names gate node id,
    iteration count, and last verdict. Assert NodeType enum still has exactly four members.
    Assert graph validator rejects converge: on AGENT node with a useful error. Run the
    full dag_executor test suite for regressions in walker, model, validator, loader, and
    existing retry (transient-failure) behavior.
  agent: tester
  depends_on:
  - implement
- id: review
  description: >
    Review the schema change (ConvergeBlock, Node.converge field) for naming consistency
    with existing Node fields. Review the walker converge loop for termination guarantee:
    confirm max_iterations is enforced as a hard ceiling (no off-by-one). Review the
    retry+converge precedence rule: confirm it is documented inline and the transient-retry
    counter reset per iteration is tested. Review the telemetry extension: confirm
    iteration_index is emitted on every converge event (not just on exhaustion). Review
    the validator: GATE-only restriction must be enforced at load time, not at run time.
  agent: reviewer
  depends_on:
  - test
- id: integrate
  description: >
    Commit "[efcl-s6] feat(executor): bounded converge-loop primitive — converge: schema
    block, walker loop with max_iterations, halt-loud, resume telemetry; GATE-only validator"
    on feat/dag-execute-node-outputs.
  agent: developer
  depends_on:
  - review
