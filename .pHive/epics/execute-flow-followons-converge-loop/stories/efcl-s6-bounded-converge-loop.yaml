  change: "ADD ConvergeBlock dataclass ({retry_node, max_iterations, exit_when}); ADD converge: Optional[ConvergeBlock] = None to Node; confirm NodeType enum unchanged (still 4 members)"
- file: hive/lib/dag_executor/graph/validator.py
