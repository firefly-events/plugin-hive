id: s2-provider-wrap
epic: sandcastle-adoption-followon
title: Wrap Sandcastle providers with Hive defaults and version preflight
status: pending
complexity: high
methodology: classic
depends_on: [s1-auth-setup-skill, s1-redaction-wrapper, s1-gitignore-template]
tier: 2
slice: S2
description: |
  Add the Sandcastle provider wrapper that centralizes Hive defaults:
  Podman by default, Docker opt-in, `userns: false`, named
  `branchStrategy: { type: "branch" }`, `createWorktree()` usage, redacted
  logger wiring, and `@ai-hero/sandcastle >=0.5.10` dependency/runtime
  preflight. No `/execute` routing is added in this story.

acceptance_criteria:
  - "Given package metadata is updated, when dependencies are inspected, then @ai-hero/sandcastle is pinned with a constrained range `>=0.5.10 <0.6.0` (0.x upper-bound required because minor bumps are breaking)"
  - "Given an older installed @ai-hero/sandcastle is resolved, when the wrapper preflight runs, then it fails before provider construction with a version-specific message"
  - "Given the wrapper is invoked with default options, when a provider is created, then it uses Podman with userns: false and mounted .sandcastle/codex-config"
  - "Given a story id is supplied, when createWorktree() is called, then branchStrategy uses type branch with that story id as the named branch"
  - "Given Sandcastle creates the worktree object, when execution finishes, then wt.close() is called by Sandcastle mode ownership and legacy .claude/worktrees cleanup is not touched"
  - "Given fake key output occurs during provider creation, when logs are captured, then values are redacted by hive/lib/sandcastle-log-redaction.js"

steps:
  - id: context-discovery
    name: discovery
    description: Read Sandcastle spike harness, `hive/lib/` JS patterns, package setup reality, and worktree ownership references.
  - id: build-change
    name: build
    description: Add the provider wrapper, version preflight, dependency pin, and harness-style tests without modifying `/execute` routing.
  - id: verify-result
    name: verify
    description: Run wrapper tests covering default provider options, branchStrategy, redaction wiring, and preflight failure.
  - id: audit-notes
    name: audit
    description: Capture security, performance, and dependency escalation evidence including cold-start baseline notes.
  - id: commit-ready
    name: commit
    description: Commit only provider-wrapper code, tests, and dependency metadata.

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: hive/lib/sandcastle-provider.js
      purpose: New provider wrapper module to centralize Hive defaults.
    - path: hive/lib/sandcastle-log-redaction.js
      purpose: S1 redaction wrapper consumed before provider construction.
    - path: .pHive/spikes/sandcastle/package.json
      purpose: Spike dependency evidence for `@ai-hero/sandcastle` 0.5.10.
    - path: hive/references/sandboxing-patterns.md
      purpose: Legacy `.claude/worktrees/{story-id}` ownership boundary.

files_to_modify:
  - file: package.json
    change: Add `@ai-hero/sandcastle` with a constrained semver range `>=0.5.10 <0.6.0` (per security:plan-audit major finding — 0.x bumps are breaking; tighter `~0.5.10` is also acceptable).
  - file: hive/lib/sandcastle-provider.js
    change: New wrapper for provider defaults, version preflight, branchStrategy, worktree ownership, and redacted logger injection.
  - file: tests/sandcastle-provider.test.js
    change: New tests for defaults, preflight, branch naming, cleanup ownership, and redaction.

code_examples:
  - title: Provider defaults from spike
    file: .pHive/spikes/sandcastle/harness.ts
    snippet: |
      const podmanSandbox = podman({
        imageName: "sandcastle:spike",
        userns: false,
        mounts: [
          {
            hostPath: path.join(__dirname, ".sandcastle/codex-config"),
            sandboxPath: "/home/agent/.codex",
          },
        ],
      });

design_decisions:
  - decision: Pin and preflight `@ai-hero/sandcastle >=0.5.10`.
    rationale: Architect review identified version drift as the missing 0.x dependency contract for S2 and S3.
  - decision: Sandcastle owns `wt.close()` only for worktrees it creates.
    rationale: Architect re-validation split ownership from legacy `.claude/worktrees/{story-id}` cleanup.
  - decision: Keep hooks minimal but allow S2 hook wiring through the wrapper.
    rationale: "`host.onWorktreeReady` lives inside provider construction and should not become a standalone config surface."

cross_cutting:
  - concern: security:plan-audit
    action: Major pre-exec audit applies because provider construction consumes auth mounts and redacted logging.
  - concern: security:impl-audit
    action: Moderate append audit verifies secret handling and logger wrapping at the integration point.
  - concern: performance:audit
    action: Minor post-exec audit captures cold-start baseline for future warm-pool decisions.
  - concern: dependency:version-gate
    action: Minor pre-exec gate requires package pin plus runtime preflight before Sandcastle mode can run.

risks:
  - severity: high
    description: Version drift in a 0.x dependency changes provider or worktree semantics.
    mitigation: Add both package lower bound and runtime preflight before provider construction.
  - severity: high
    description: Double cleanup removes a legacy worktree owned by another path.
    mitigation: "Implement the architect rule exactly: call `wt.close()` only for Sandcastle-created worktrees."
  - severity: medium
    description: Wrapper expands into user-facing routing before validation.
    mitigation: Do not touch `skills/execute/SKILL.md` or `execute-dispatch` in S2.

references:
  - path: .pHive/epics/sandcastle-adoption-followon/docs/architect-review-b2.md
    relevant_excerpt: |
      Sandcastle is a 0.x package, and the plan does not currently
      require a dependency/runtime contract check.
      The spike and current npm metadata both resolve to `@ai-hero/sandcastle@0.5.10`.
      S2/S3 should fail fast below that version.
  - path: .pHive/epics/sandcastle-adoption-followon/docs/architect-review-b2.md
    relevant_excerpt: |
      Do not call `wt.close()` for a legacy `.claude/worktrees/{story-id}`
      worktree handed in by another owner; do call `wt.close()` for the
      Sandcastle-created worktree before returning from the Sandcastle execution path.
