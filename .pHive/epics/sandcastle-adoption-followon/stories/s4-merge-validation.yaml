id: s4-merge-validation
epic: sandcastle-adoption-followon
title: Live-quota merge validation for Sandcastle branch strategy
status: pending
complexity: high
methodology: classic
depends_on: [s3-execution-mode-skill, s3-dispatch-routing]
tier: 2
slice: S4
description: |
  Run the validation the spike could not complete: two parallel named-branch
  Sandcastle Codex runs under live quota reaching merge behavior through the
  routed mode. Same-slice fix-forward is permitted only for small defects
  discovered by this validation on S1-S3 surfaces: auth setup, redaction,
  gitignore, provider wrapper, minimal hooks, execution-mode skill, or dispatch
  routing. New feature work is out of scope.

acceptance_criteria:
  - "Given live OpenAI quota is available, when two Sandcastle runs execute in parallel with branchStrategy type branch, then both reach the merge behavior or produce a documented blocking failure"
  - "Given validation completes, when the result artifact is read, then it includes command, environment, branch names, timing baseline, log-redaction check, and cleanup result"
  - "Given a small defect is discovered, when fixed in this story, then the fix touches only S1-S3 surfaces and is directly traceable to the validation failure"
  - "Given a defect requires new feature scope, when triaged, then it is recorded as a follow-on and not implemented in S4"
  - "Given worktrees are cleaned up, when inspected, then Sandcastle-created worktrees use wt.close() and legacy .claude/worktrees ownership is untouched"

steps:
  - id: context-discovery
    name: discovery
    description: Read S1-S3 shipped behavior, spike harness limits, and architect fix-forward boundary before running validation.
  - id: build-change
    name: build
    description: Prepare the live validation harness or command notes using existing Sandcastle mode and named branch strategy.
  - id: verify-result
    name: verify
    description: Run the live-quota validation and capture results, logs, timing, branch state, and cleanup evidence.
  - id: audit-notes
    name: audit
    description: Apply performance audit notes and classify any discovered defects against the bounded fix-forward rule.
  - id: commit-ready
    name: commit
    description: Commit the validation artifact and any permitted small S1-S3 fix-forward patch.

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: .pHive/spikes/sandcastle/harness.ts
      purpose: Starting point for two parallel named-branch Sandcastle runs.
    - path: hive/lib/sandcastle-provider.js
      purpose: Provider wrapper under live validation.
    - path: skills/hive/skills/execute-mode-sandcastle/SKILL.md
      purpose: Routed execution mode under validation.
    - path: .pHive/epics/sandcastle-adoption-followon/docs/merge-validation-results.md
      purpose: New validation artifact and result table.

files_to_modify:
  - file: .pHive/epics/sandcastle-adoption-followon/docs/merge-validation-results.md
    change: New validation result table with commands, branches, timing, cleanup, and findings.
  - file: hive/lib/sandcastle-provider.js
    change: Only if a small validation-discovered S1-S3 defect requires fix-forward.
  - file: skills/hive/skills/execute-dispatch/SKILL.md
    change: Only if a small validation-discovered S1-S3 routing defect requires fix-forward.

code_examples:
  - title: Parallel run shape from spike
    file: .pHive/spikes/sandcastle/harness.ts
    snippet: |
      console.log("[harness] starting 2 parallel runs (Promise.all)...");
      const t0 = Date.now();

      type RunOutcome = {
        name: string;
        ok: boolean;
      };

design_decisions:
  - decision: S4 is validation plus bounded fix-forward only.
    rationale: Architect approval allows same-slice fixes only for validation-discovered defects on S1-S3 surfaces.
  - decision: Capture performance as baseline, not as a warm-pool commitment.
    rationale: S7 uses this evidence to park future `createSandbox()` optimization without implementing it.

cross_cutting:
  - concern: performance:audit
    action: Minor post-exec audit captures cold-start and parallel-run timing as future warm-pool evidence.

risks:
  - severity: high
    description: Live quota is unavailable, preventing the validation from reaching merge behavior.
    mitigation: Record quota failure explicitly with command output and keep the story blocked rather than substituting a fake pass.
  - severity: high
    description: Fix-forward grows into new feature implementation.
    mitigation: Enforce the S1-S3-only boundary and queue anything larger as a follow-on story.

references:
  - path: .pHive/epics/sandcastle-adoption-followon/docs/architect-review-b2.md
    relevant_excerpt: |
      Same-slice fix-forward is acceptable only for defects directly exposed
      by the validation run and bounded to S1-S3 surfaces.
      This keeps S4 as validation of shipped behavior, not new architecture.
  - path: .pHive/epics/sandcastle-adoption-followon/docs/tpm-sequencing-memo-b2.md
    relevant_excerpt: |
      Run the end-to-end validation the spike couldn't.
      Two parallel stories on named branches both reach merge,
      no race, no double-worktree-ownership bug.
      The output is a documented validation run and result table.
