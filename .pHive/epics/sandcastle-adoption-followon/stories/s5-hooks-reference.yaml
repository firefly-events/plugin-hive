id: s5-hooks-reference
epic: sandcastle-adoption-followon
title: Minimal Sandcastle hooks reference
status: pending
complexity: low
methodology: classic
depends_on: [s4-merge-validation]
tier: 3
slice: S5
description: |
  Write a short hooks reference that documents only the shipped
  `host.onWorktreeReady` lifecycle hook and its copyToWorktree use. It must
  lead with the layer distinction: Sandcastle hooks are container/worktree
  lifecycle hooks, not Hive PreToolUse or PostToolUse replacements.

acceptance_criteria:
  - "Given hive/references/sandcastle-hooks-minimal.md is read, then it documents only host.onWorktreeReady as wired in V1"
  - "Given deferred hook points are mentioned, when read, then host.onSandboxReady and sandbox.onSandboxReady are marked deferred and unavailable"
  - "Given readers look for Hive tool-hook behavior, when the reference is read, then it clearly says Sandcastle hooks are not Hive PreToolUse or PostToolUse"
  - "Given the adoption guide links to hooks, when checked, then it points to this focused reference"

steps:
  - id: context-discovery
    name: discovery
    description: Read S2 hook implementation and S3 mode prose before writing the reference.
  - id: build-change
    name: build
    description: Add `hive/references/sandcastle-hooks-minimal.md` with shipped hook, deferrals, and layer boundary.
  - id: verify-result
    name: verify
    description: Run markdown link checks and verify no unshipped hook is documented as available.
  - id: audit-notes
    name: audit
    description: Cross-check the reference against user decisions and the adoption guide hook note.
  - id: commit-ready
    name: commit
    description: Commit the hooks reference and any guide link update.

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: hive/references/sandcastle-hooks-minimal.md
      purpose: New focused hooks reference.
    - path: hive/lib/sandcastle-provider.js
      purpose: Shipped hook implementation to document.
    - path: hive/references/sandcastle-adoption-guide.md
      purpose: Guide should link to this reference without duplicating it.

files_to_modify:
  - file: hive/references/sandcastle-hooks-minimal.md
    change: New minimal lifecycle hooks reference.
  - file: hive/references/sandcastle-adoption-guide.md
    change: Link to the hooks reference and keep the guide's hook note concise.

code_examples:
  - title: Hooks reference shape
    file: hive/references/sandcastle-hooks-minimal.md
    snippet: |
      ## V1 Hook Surface

      Wired: `host.onWorktreeReady`.
      Purpose: copy persona files, memory paths, and config snapshot.

      Not wired in V1:
      - `host.onSandboxReady`
      - `sandbox.onSandboxReady`

design_decisions:
  - decision: Keep hooks reference separate from the adoption guide.
    rationale: Hook terminology is easy to misread and deserves a compact focused reference.
  - decision: Do not document deferred hooks as available.
    rationale: User decisions explicitly reject speculative hook templates in V1.

cross_cutting:
  - concern: documentation
    action: "Preserve exact layer language: Sandcastle lifecycle hooks are not Hive PreToolUse or PostToolUse."

risks:
  - severity: medium
    description: Reference accidentally encourages users to configure deferred hooks.
    mitigation: List deferred hooks only under an unavailable/deferred heading.
  - severity: low
    description: Adoption guide and hooks reference drift.
    mitigation: Keep the guide short and link to the reference as the canonical hook document.

references:
  - path: .pHive/epics/sandcastle-adoption-followon/docs/tpm-sequencing-memo-b2.md
    relevant_excerpt: |
      Hooks reference doc covers ONLY the wired hook plus framing.
      It does NOT speculatively document the deferred hook points.
      Sandcastle hooks are lifecycle-only and additive.
  - path: .pHive/epics/sandcastle-adoption-followon/docs/horizontal-plan.md
    relevant_excerpt: |
      Readers mistake Sandcastle hooks for Hive PreToolUse/PostToolUse hooks.
      Keep the scope to `host.onWorktreeReady` and document the lifecycle-only framing.
      The hooks reference leads with the container-lifecycle distinction.
