id: s5-adoption-guide
epic: sandcastle-adoption-followon
title: Sandcastle adoption guide for setup, provider defaults, branch strategy, and redaction
status: pending
complexity: medium
methodology: classic
depends_on: [s4-merge-validation]
tier: 3
slice: S5
description: |
  Write the user-facing adoption guide after S1-S4 have shipped and live
  validation evidence exists. The guide covers `/hive:sandbox-setup`,
  `auth.json` mount semantics, Podman default and Docker opt-in, `userns:
  false`, branch strategy, redaction, `.sandcastle/` ignore coverage, and the
  fact that Sandcastle hooks are not Hive PreToolUse hooks.

acceptance_criteria:
  - "Given hive/references/sandcastle-adoption-guide.md is read, then it documents setup, auth mount path, provider defaults, branch strategy, and redaction behavior"
  - "Given the guide mentions hooks, when read, then it states Sandcastle hooks are lifecycle hooks and not Hive PreToolUse"
  - "Given S4 validation results exist, when the guide discusses merge behavior, then it references actual validation evidence rather than design intent"
  - "Given sidecar bundles are mentioned, when read, then the guide says Sandcastle V1 neither consumes nor produces sidecar bundles"
  - "Given .sandcastle/ is discussed, when read, then the guide names root .gitignore as the current canonical ignore surface"

steps:
  - id: context-discovery
    name: discovery
    description: Read S1-S4 artifacts and validation results before writing the adoption guide.
  - id: build-change
    name: build
    description: Add `hive/references/sandcastle-adoption-guide.md` with setup, provider, branch, redaction, and sidecar-neutral sections.
  - id: verify-result
    name: verify
    description: Run markdown link checks and compare every command/path against shipped S1-S4 behavior.
  - id: audit-notes
    name: audit
    description: Confirm the guide does not document unshipped hook surfaces or Claude-code lane support.
  - id: commit-ready
    name: commit
    description: Commit the adoption guide only.

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: hive/references/sandcastle-adoption-guide.md
      purpose: New adoption guide.
    - path: hive/references/sandcastle-setup-checklist.md
      purpose: Setup checklist content consumed by the guide.
    - path: .pHive/epics/sandcastle-adoption-followon/docs/merge-validation-results.md
      purpose: S4 validation evidence to cite.

files_to_modify:
  - file: hive/references/sandcastle-adoption-guide.md
    change: New durable reference for adopting Sandcastle execution mode.

code_examples:
  - title: Guide command block target
    file: hive/references/sandcastle-adoption-guide.md
    snippet: |
      HIVE_EXECUTION_MODE=sandcastle /hive:execute <epic-id>

      execution:
        mode: sandcastle

      Sandcastle V1 uses Codex-path auth only.
      Run `/hive:sandbox-setup` before selecting this mode.

design_decisions:
  - decision: Split adoption guide from hooks reference.
    rationale: The guide covers setup/provider/redaction/branch strategy; the hooks reference stays focused and reviewable.
  - decision: Document sidecar-neutral V1 once.
    rationale: User decisions require Sandcastle V1 to neither consume nor produce sidecar bundles.

cross_cutting:
  - concern: documentation
    action: Review guide content against S1-S4 implementation and validation artifacts to avoid intent drift.

risks:
  - severity: medium
    description: Guide documents aspirational behavior before validation proves it.
    mitigation: Depend on S4 and cite `merge-validation-results.md` for merge behavior.
  - severity: medium
    description: Readers confuse Sandcastle hooks with Hive tool hooks.
    mitigation: Include a short "what these hooks are not" section and link the minimal hooks reference.

references:
  - path: .pHive/epics/sandcastle-adoption-followon/docs/vertical-plan.md
    relevant_excerpt: |
      Users can read how to adopt Sandcastle mode, configure Podman/Docker,
      understand `auth.json`, branch strategy, logger redaction,
      `.sandcastle/` ignore coverage, and the minimal lifecycle hook contract.
  - path: .pHive/epics/sandcastle-adoption-followon/docs/user-decisions-b1.md
    relevant_excerpt: |
      Sandcastle execution mode does NOT consume or produce sidecar bundles in V1.
      Neutral — neither dependency nor blocker.
      No grounded consumer use case yet.
