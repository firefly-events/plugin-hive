id: s3-dispatch-routing
epic: sandcastle-adoption-followon
title: Route sandcastle as the fifth execute mode with field-source attribution
status: pending
complexity: high
methodology: classic
depends_on: [s2-provider-wrap, s2-hooks-minimal]
tier: 2
slice: S3
description: |
  Extend `/execute` dispatch so `sandcastle` is the fifth `mode_decision`
  value. Add `field_sources.execution_mode` with env/config/default
  attribution, support `HIVE_EXECUTION_MODE=sandcastle` and
  `execution.mode: sandcastle`, and patch the hidden caller switch in
  `skills/execute/SKILL.md` around the existing Step 5 dispatch point.

acceptance_criteria:
  - "Given HIVE_EXECUTION_MODE=sandcastle, when execute-dispatch resolves mode, then it returns mode_decision=sandcastle and field_sources.execution_mode=env"
  - "Given root config has execution.mode: sandcastle and env is unset, when dispatch resolves mode, then field_sources.execution_mode=config"
  - "Given neither env nor config selects sandcastle, when existing sessions/team/team-cmux/sequential cases run, then their behavior remains unchanged"
  - "Given skills/execute/SKILL.md Step 5 switch is inspected, when this story lands, then it contains a sandcastle case invoking execute-mode-sandcastle"
  - "Given telemetry is emitted, when execution mode is resolved, then the telemetry line includes execution_mode={source}"

steps:
  - id: context-discovery
    name: discovery
    description: Read `execute-dispatch` mode resolution, `skills/execute` Step 5, and existing field-source telemetry conventions.
  - id: build-change
    name: build
    description: Update dispatch enum, execution_mode source tracking, warnings, telemetry, and the caller switch case.
  - id: verify-result
    name: verify
    description: Run dispatch tests for env/config/default attribution and regression tests for existing modes.
  - id: audit-notes
    name: audit
    description: Note sidecar-neutral forward-compat and dependency preflight handoff to the mode skill.
  - id: commit-ready
    name: commit
    description: Commit dispatch skill, caller switch, and tests together.

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: skills/hive/skills/execute-dispatch/SKILL.md
      purpose: Mode enum, field_sources contract, warnings, and telemetry.
    - path: skills/execute/SKILL.md
      purpose: Hidden caller switch that must route the new mode.
    - path: skills/hive/skills/execute-mode-sandcastle/SKILL.md
      purpose: New mode target invoked by the switch.

files_to_modify:
  - file: skills/hive/skills/execute-dispatch/SKILL.md
    change: Add `sandcastle` to `mode_decision` and add `field_sources.execution_mode`.
  - file: skills/execute/SKILL.md
    change: Add the Sandcastle case to the Step 5 switch near line 143.
  - file: tests/execute-dispatch-sandcastle.test.*
    change: Add env/config/default attribution and no-regression cases.

code_examples:
  - title: Existing dispatch output contract before extension
    file: skills/hive/skills/execute-dispatch/SKILL.md
    snippet: |
      **Outputs:** `mode_decision` enum
      `sessions | team | team-cmux | sequential`;
      `mode_reason` as a one-line string;
      `runner_path` enum `hive-dag | orchestrator-narrated`;
      `field_sources` map covering `sessions_enabled`,
      `parallel_teams`, `terminal_mux`, and `executor`.

design_decisions:
  - decision: "`sandcastle` is the fifth `mode_decision` value."
    rationale: User decisions lock this spelling and defer provider-neutral naming until a second sandbox provider exists.
  - decision: Add `field_sources.execution_mode` rather than overloading existing fields.
    rationale: It preserves attribution and becomes the forward-compatible seam for later sidecar field additions.

cross_cutting:
  - concern: observability
    action: Track env/config/default source for `execution_mode` in warnings and telemetry.

risks:
  - severity: high
    description: The hidden caller switch in `skills/execute/SKILL.md` is missed, so dispatch returns sandcastle but execution never invokes the mode.
    mitigation: Make the Step 5 switch update an explicit acceptance criterion and test target.
  - severity: medium
    description: Existing mode precedence changes for non-Sandcastle users.
    mitigation: Add regression coverage for sessions, team-cmux, team, and sequential decisions.

references:
  - path: .pHive/epics/sandcastle-adoption-followon/docs/architect-review-b2.md
    relevant_excerpt: |
      `skills/hive/skills/execute-dispatch/SKILL.md:16` currently says
      `mode_decision enum sessions | team | team-cmux | sequential`.
      `skills/execute/SKILL.md:143` currently switches only existing modes.
  - path: .pHive/epics/sandcastle-adoption-followon/docs/user-decisions-b1.md
    relevant_excerpt: |
      Answer: `sandcastle`.
      Lock: `execute-dispatch.mode_decision` gains 5th value `sandcastle`.
      Provider-neutral renaming revisited only when a second sandbox provider lands.
