id: s7-warm-pool-placeholder
epic: sandcastle-adoption-followon
title: Warm-pool placeholder for future createSandbox optimization
status: blocked
complexity: low
methodology: classic
depends_on: [s2-provider-wrap]
tier: 3
slice: S7
description: |
  Add a doc-only architecture note that parks Sandcastle `createSandbox()` as a
  future long-lived warm-pool optimization. The note references S2 wrapper
  baseline expectations and S4 validation evidence if available, but it makes
  no runtime code change and invents no unmeasured latency threshold.

acceptance_criteria:
  - "Given hive/references/sandcastle-warm-pool-placeholder.md is read, then it states createSandbox() is deferred future work"
  - "Given the provider wrapper is inspected, when this story lands, then no warm-pool runtime behavior has been added"
  - "Given performance baseline evidence exists, when the note cites it, then it preserves measured facts without inventing a threshold"
  - "Given a future optimization story is planned, when reading the note, then the trigger conditions and non-goals are clear"

steps:
  - id: build-change
    name: build
    description: Add a short doc-only warm-pool architecture note.
  - id: verify-result
    name: verify
    description: Run markdown link checks and verify no provider-wrapper code changes are included.
  - id: audit-notes
    name: audit
    description: Confirm the note references performance data as context only, not as a commitment.
  - id: commit-ready
    name: commit
    description: Commit only the placeholder reference document.

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: hive/references/sandcastle-warm-pool-placeholder.md
      purpose: New doc-only placeholder for future warm-pool work.
    - path: hive/lib/sandcastle-provider.js
      purpose: Must remain unchanged by this doc-only story except references if unavoidable.
    - path: .pHive/epics/sandcastle-adoption-followon/docs/merge-validation-results.md
      purpose: Optional performance evidence to cite when available.

files_to_modify:
  - file: hive/references/sandcastle-warm-pool-placeholder.md
    change: New short architecture note for future `createSandbox()` warm-pool optimization.

code_examples:
  - title: Placeholder note skeleton
    file: hive/references/sandcastle-warm-pool-placeholder.md
    snippet: |
      # Sandcastle warm-pool placeholder

      V1 creates a fresh sandbox per run.
      Deferred option: long-lived `createSandbox()` warm pool.
      Trigger: measured cold-start cost becomes material.
      Non-goal: no V1 provider-wrapper runtime change.

design_decisions:
  - decision: Keep warm-pool work doc-only in this epic.
    rationale: The TPM plan parks the optimization until measured cold-start data justifies implementation.
  - decision: Depend on `s2-provider-wrap`.
    rationale: The note needs the wrapper surface to exist but does not require routing changes.

cross_cutting:
  - concern: performance:audit
    action: Use S2/S4 baseline evidence as context for future warm-pool planning only.

risks:
  - severity: medium
    description: Placeholder becomes runtime warm-pool implementation by accident.
    mitigation: Acceptance requires no provider-wrapper behavior change.
  - severity: low
    description: Note invents a latency threshold without measured evidence.
    mitigation: State trigger categories and cite only actual baseline data.

references:
  - path: .pHive/epics/sandcastle-adoption-followon/docs/vertical-plan.md
    relevant_excerpt: |
      Preserve the `createSandbox()` long-lived warm-pool option as a parked
      optimization, using S2/S4 performance data as the future trigger context.
      It makes no code change.
  - path: .pHive/epics/sandcastle-adoption-followon/docs/tpm-sequencing-memo-b2.md
    relevant_excerpt: |
      This is intentionally NOT a code story.
      A short architecture note lives next to provider docs explaining
      when/why a future story would adopt the warm-pool primitive.
