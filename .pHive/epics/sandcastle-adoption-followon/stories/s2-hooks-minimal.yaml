id: s2-hooks-minimal
epic: sandcastle-adoption-followon
title: Wire only host.onWorktreeReady for copyToWorktree preparation
status: pending
complexity: medium
methodology: classic
depends_on: [s1-auth-setup-skill, s1-redaction-wrapper, s1-gitignore-template]
tier: 2
slice: S2
description: |
  Wire the single V1 Sandcastle lifecycle hook, `host.onWorktreeReady`, to
  copy persona files, memory directory paths, and an in-worktree config
  snapshot before sandbox creation. Sandcastle hooks are not Hive PreToolUse
  hooks; they run at the container/worktree lifecycle layer and no other hook
  points are shipped here.

acceptance_criteria:
  - "Given the provider wrapper creates a worktree, when host.onWorktreeReady fires, then copyToWorktree places a marker/config fixture in the worktree"
  - "Given host.onSandboxReady and sandbox.onSandboxReady are available upstream, when this story lands, then neither hook is wired"
  - "Given docs or comments mention hooks, when read, then they state Sandcastle hooks are lifecycle hooks and not Hive PreToolUse or PostToolUse"
  - "Given a hook command fails non-zero in a fixture, when the wrapper runs, then setup fails fast before agent execution"

steps:
  - id: context-discovery
    name: discovery
    description: Read the hook contract in the research brief and the provider wrapper from S2.
  - id: build-change
    name: build
    description: Add only `host.onWorktreeReady` wiring inside `hive/lib/sandcastle-provider.js` using a single command list.
  - id: verify-result
    name: verify
    description: Run provider-wrapper tests proving the marker copy occurs and deferred hook points are absent.
  - id: audit-notes
    name: audit
    description: Record the layer distinction so reviewers do not equate Sandcastle lifecycle hooks with Hive tool hooks.
  - id: commit-ready
    name: commit
    description: Commit only hook wiring and tests inside the provider wrapper surface.

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: hive/lib/sandcastle-provider.js
      purpose: Provider wrapper where the one Sandcastle lifecycle hook is declared.
    - path: skills/hive/skills/execute-mode-sandcastle/SKILL.md
      purpose: Later S3 prose must explain the same hook boundary.
    - path: .pHive/epics/sandcastle-adoption-followon/docs/user-decisions-b1.md
      purpose: Locks minimal `host.onWorktreeReady` only for V1.

files_to_modify:
  - file: hive/lib/sandcastle-provider.js
    change: Add `host.onWorktreeReady` hook configuration for copyToWorktree inputs only.
  - file: tests/sandcastle-provider-hooks.test.js
    change: New tests for marker copy and absence of deferred hook points.

code_examples:
  - title: Minimal hook contract
    file: .pHive/epics/sandcastle-adoption-followon/docs/research-brief.md
    snippet: |
      hooks: {
        host:    { onWorktreeReady?: HookCmd[]; onSandboxReady?: HookCmd[] },
        sandbox: { onSandboxReady?: HookCmd[] }
      }

      HostHookCmd    = { command: string; timeoutMs?: number }
      SandboxHookCmd = { command: string; sudo?: boolean; timeoutMs?: number }

design_decisions:
  - decision: Wire only `host.onWorktreeReady` in V1.
    rationale: User decisions explicitly defer `host.onSandboxReady` and `sandbox.onSandboxReady` until a real consumer story exists.
  - decision: Treat Sandcastle hooks as lifecycle hooks, not Hive PreToolUse.
    rationale: The hook layer prepares worktrees and containers; it does not replace Hive's per-tool hook system.

cross_cutting:
  - concern: documentation
    action: Carry the "Sandcastle hooks are not Hive PreToolUse" note into S3 mode prose and S5 docs.

risks:
  - severity: medium
    description: Hook work expands into a speculative YAML template surface.
    mitigation: Keep all hook configuration inside the provider wrapper and test that deferred hooks are absent.
  - severity: medium
    description: Implementers use `sudo` or `cwd` in host hooks despite the Sandcastle contract.
    mitigation: Keep host hook commands minimal and validate against the documented `HostHookCmd` shape.

references:
  - path: .pHive/epics/sandcastle-adoption-followon/docs/user-decisions-b1.md
    relevant_excerpt: |
      Wired in V1: exactly one hook point — `host.onWorktreeReady`.
      Used to invoke `copyToWorktree` for: persona files, memory directory paths,
      in-worktree config snapshot.
  - path: .pHive/epics/sandcastle-adoption-followon/docs/horizontal-plan.md
    relevant_excerpt: |
      The hooks layer is intentionally minimal for V1.
      It wires exactly one Sandcastle lifecycle hook, `host.onWorktreeReady`,
      to invoke `copyToWorktree`.
