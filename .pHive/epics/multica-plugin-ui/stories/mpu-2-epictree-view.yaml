complexity: medium
methodology: classic
depends_on: [mpu-1-proof-gate-mount-store-schema]

description: |
  Complete the Slice-1 proof on the frontend: a minimal EpicTree view rendering inside
  Multica's dashboard shell, served as a workspace package added to `transpilePackages`,
  reading through the authenticated /api/plugins/hive/* boundary proven by mpu-1. This is
  the first of the SEPARATE top-level sidebar entries (sign-off decision: per-view nav, not
  a single Hive parent). Establishes the frontend package + route/nav anchor pattern reused
  by mpu-3..7.

  Working state: an authenticated user clicks the "Epics" sidebar entry and sees a minimal
  EpicTree rendered natively inside Multica, data fetched from Hive's own store.

acceptance_criteria:
  - "Given an authenticated user, when they open the EpicTree route, then it renders inside the Multica dashboard shell using the @multica/hive workspace package added to apps/web/next.config.ts transpilePackages (~L27)."
  - "Given the route, when registered, then it is workspace-scoped under /{workspaceSlug}/hive/epics with ONE additive top-level sidebar entry 'Epics' (per the separate-entries sign-off decision)."
  - "Given the EpicTree client, when it loads data, then it calls /api/plugins/hive/* through the same authenticated boundary proven by mpu-1 — no separate Hive auth/session/WebSocket implementation."
  - "Given the package exports, when typechecked, then @multica/hive exports are explicit and stable (covered by tsc --noEmit)."

steps:
  - id: research
    description: Confirm the route-group + sidebar nav source in apps/web (app/[workspaceSlug], the sidebar config array) and the transpilePackages + workspace-package wiring.
    agent: researcher
  - id: implement
    description: Create the @multica/hive workspace package (packages/hive) + add to transpilePackages; EpicTree.tsx + page adapter under app/[workspaceSlug]/hive/epics; one top-level sidebar entry; path builder.
    agent: developer
    depends_on: [research]
  - id: test
    description: Component render test for EpicTree; manual authenticated browser check it renders in the dashboard shell; workspace-scoped React Query key includes workspace id.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Verify auth/WS inherited not reimplemented, sidebar entry is additive, package exports stable.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: One story-commit to feat/multica-plugin-ui.
    agent: developer
    depends_on: [review]

