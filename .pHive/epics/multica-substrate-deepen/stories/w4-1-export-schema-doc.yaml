description: |
  Author the skills-export schema reference at
  hive/references/multica-skills-export-schema.md.

  Schema covers:
  - schema_version
  - exports list — each entry: skill_ref (path to SKILL.md in plugin-hive),
    multica_name (canonical name in Multica skill table), substrate_deps
    (array of reference doc paths bundled with the skill), visibility
    (private | workspace; per W0.3 finding)
  - validation rules (skill_ref must exist; substrate_deps must exist)
  - resolution rules (skill_ref + substrate_deps resolve at reconcile time
    relative to repo root)

  Schema accommodates Mode D-a (read-only export): authoritative source
  stays at skill_ref; exported copies materialized into Multica are
  drift-checked by W4.4 CI guard.

