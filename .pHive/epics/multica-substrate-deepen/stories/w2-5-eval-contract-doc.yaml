description: |
  Author the squad-evaluation contract documenting:

  - When squad-leader evaluation fires: at /execute integrate step,
    specifically after `git push` succeeds AND the PR opens AND the Multica
    issue status moves to 'in_review'. NOT at merge time.
  - Authority model: substrate signal, NOT authority surface. Hive consumes
    the evaluation as one input among many. User retains merge authority.
  - Data shape: { leader: <persona-name>, evaluation: <free text>, timestamp,
    issue_id } as returned by adapter getSquadActivity (per W2.4).
  - Read path: /execute calls adapter.getSquadActivity at integrate-step
    completion. Result stored in episode marker for downstream visibility.
  - Posture rationale per CONTEXT.md North Star: composable substrate,
    user-directed — squad evaluation does NOT gate merge.
acceptance_criteria:
  - Doc exists at hive/references/squad-evaluation-contract.md
  - Doc explicitly states 'substrate signal, not authority surface'
  - 'Doc specifies firing moment: post `git push`, post-PR-open, pre-merge'
  - Doc specifies data shape matching W2.4 adapter return
  - Doc rejects the alternative authority-gate-on-merge interpretation explicitly
  - Architect + peer-validator both review for posture compliance
