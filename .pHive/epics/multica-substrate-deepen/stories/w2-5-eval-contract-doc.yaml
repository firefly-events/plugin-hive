description: "Author the squad-evaluation contract documenting how Hive consumes a\n\
  squad-leader evaluation as a SUBSTRATE SIGNAL (not an authority surface).\n\n\
  Contract content:\n\
  - Authority model: substrate signal, NOT authority surface. Hive consumes the\n\
    evaluation as one input among many. User retains merge authority. The\n\
    evaluation does NOT gate merge.\n\
  - Firing / read moment: at /execute integrate-step completion — after dispatch\n\
    reaches terminal (completed) AND `git push` succeeds AND the PR opens. Read,\n\
    NOT at merge time.\n\
  - Read path: /execute (execute-mode-multica) calls the dispatch helper\n\
    readSquadEvaluation(issueId) (W2.6), which calls adapter.getSquadActivity\n\
    (W2.4), which reads GET /api/issues/{id}/timeline filtered to\n\
    action=='squad_leader_evaluated'.\n\
  - Data shape (corrected vs original PLU-105): the squad eval is an activity_log\n\
    entry, NOT a free-text 'evaluation'. Shape:\n\
      { actor_type, actor_id, outcome, reason, created_at }\n\
    where outcome is the fixed enum action | no_action | failed and reason is an\n\
    optional short string. Document the enum explicitly.\n\
  - Storage: the read result is stored in the episode marker under an optional\n\
    squad_evaluation field for downstream visibility (W2.7).\n\
  - Best-effort: a null result or a read error must NOT fail /execute.\n\
  - Posture rationale per CONTEXT.md North Star: composable substrate,\n\
    user-directed — squad evaluation does NOT gate merge.\n\
  - Explicitly reject the alternative authority-gate-on-merge interpretation.\n"
acceptance_criteria:
- Doc exists at hive/references/squad-evaluation-contract.md
- Doc explicitly states 'substrate signal, not authority surface'
- Doc specifies the read moment — post dispatch-terminal, post `git push`, post-PR-open, pre-merge
- Doc specifies the corrected data shape { actor_type, actor_id, outcome, reason, created_at } with outcome enum action|no_action|failed
- Doc states the read is best-effort (null/error does not fail /execute)
- Doc rejects the authority-gate-on-merge interpretation explicitly
- Doc notes the WRITE/status-flip side is owned by the squad-leader-status-flip epic, not this contract
- Architect + peer-validator both review for posture compliance
