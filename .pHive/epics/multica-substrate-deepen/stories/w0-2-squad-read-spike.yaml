description: "Phase 0 feasibility spike. Determine whether the squad-leader evaluation\ndata written via `multica squad activity` is readable via the Multica REST\nsurface \u2014 required for the adapter ABI 1.1.0 bump in W2.4 and the squad\nevaluation contract in W2.5.\n\nTwo possibilities:\n1. Squad-activity rows exposed via extended GET /api/issues/{id} (preferred \u2014\n   no new endpoint needed).\n2. Squad-activity exposed via separate /api/squads/{id}/activity or similar.\n\nIf neither: spike returns blocking-negative. Phase B downgrades to\nroster-namespace only.\n"
