- Finding cites endpoint path + HTTP method + JSON shape for each read path
- 'If blocking-negative: explicit statement that W2.4/W2.6/W2.7 are blocked AND W2.1-W2.3 reduce to roster-namespace only'
- No changes to plugin-hive production files
