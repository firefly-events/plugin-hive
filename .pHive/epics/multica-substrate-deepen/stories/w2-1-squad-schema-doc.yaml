description: |
  Author the squad schema reference at hive/references/multica-squads-schema.md
  modeled on multica-agents-schema.md (same shape, same drift contract).

  Schema covers:
  - schema_version (semantic)
  - squads list — each squad has: name, leader (persona reference by name),
    members (array of persona names), description, visibility
  - validation rules (leader must be in members; members must exist in agents.yaml)
  - resolution rules (leader/member names resolve to agents in
    .pHive/multica/agents.yaml)

