id: w2-2-squads-yaml
epic: multica-substrate-deepen
title: "Author .pHive/multica/squads.yaml with three squads"
status: pending
complexity: low
methodology: classic
depends_on: [w2-1-squad-schema-doc]

description: |
  Author .pHive/multica/squads.yaml conforming to W2.1's schema. Three squads:

  - planning-team-squad: leader=tpm; members=researcher, architect,
    technical-writer, tpm
  - dev-team-squad: leader=reviewer; members=developer, backend-developer,
    frontend-developer, reviewer
  - verify-team-squad: leader=peer-validator; members=tester, test-architect,
    test-scout, peer-validator, security-reviewer

  All member names must reference personas present in .pHive/multica/agents.yaml
  (post-W1.2 expansion).

acceptance_criteria:
  - "File exists at .pHive/multica/squads.yaml"
  - "Conforms to W2.1 schema (passes whatever validation W2.3 emits)"
  - "All three squads present with correct leader + members"
  - "Every member name resolves to an entry in .pHive/multica/agents.yaml"

steps:
  - id: implement
    description: Write squads.yaml
    agent: developer
  - id: review
    description: Reviewer validates against W2.1 schema + agents.yaml resolution
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit on feat/multica-substrate-deepen
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: .pHive/multica/agents.yaml
      purpose: Source of valid persona names for squad members
    - path: hive/references/multica-squads-schema.md
      purpose: Schema to conform to

cross_cutting:
  - concern: documentation
    action: "Reference squads.yaml from GUIDE.md Multica section"

risks:
  - severity: low
    description: Member name typo breaks reconcile
    mitigation: Reviewer cross-checks against agents.yaml

metric:
  applies: true
  name: multica.squads_defined
  direction: up
  unit: count
  baseline: 0
  target: 3
  window: post-story-integrate
  source:
    kind: manual
    ref: "yq '.squads | length' .pHive/multica/squads.yaml"
  verify_at: integrate
  owner: reviewer
