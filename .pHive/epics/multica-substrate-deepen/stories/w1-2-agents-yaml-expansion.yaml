id: w1-2-agents-yaml-expansion
epic: multica-substrate-deepen
title: Expand .pHive/multica/agents.yaml to dispatchable persona subset with codex routing
status: pending
complexity: medium
methodology: classic
depends_on:
  - w1-1-persona-dispatchability-doc
  - w0-1-codex-spike
description: |
  Expand .pHive/multica/agents.yaml from 3 personas (developer/tester/reviewer)
  to the dispatchable subset (~20 personas per W1.1).

  Apply 2026-05-01 codex-routing policy gated on W0.1 result:
  - If W0.1 verdict = supported: creators (developer, backend-developer,
    frontend-developer, researcher, architect, technical-writer) get
    `provider: codex` (or whatever the actual codex-runtime registration
    shape is per W0.1 finding).
  - If W0.1 verdict = not_supported: all creators stay `provider: claude`;
    codexInstruction rescue dance remains via W1.4 conditional.
  - If W0.1 verdict = supported_with_caveats: user checkpoint before
    proceeding; document caveats inline.

  Verifiers (reviewer, peer-validator, tester, tpm) get
  `provider: claude` + `model: claude-opus-4-7`.

  Remaining specialists default to `provider: claude` + `model: claude-sonnet-4-6`.
acceptance_criteria:
  - agents.yaml lists exactly the dispatchable subset from W1.1 (no orchestrator, no team-lead, no pair-programmer)
  - Creator personas route to codex provider IFF W0.1 = supported, else claude
  - Verifier personas route to claude-opus-4-7
  - All entries have persona_ref pointing to hive/agents/<name>.md
  - Schema version stays 1 (matches hive/references/multica-agents-schema.md)
  - Multica bootstrap (multica-init) succeeds against new agents.yaml in spike workspace
  - After bootstrap, `multica agent list --output json` returns all dispatchable personas
steps:
  - id: research
    description: Read W0.1 finding + W1.1 classification + multica-agents-schema reference
    agent: researcher
  - id: implement
    description: Edit agents.yaml; add all dispatchable personas with correct routing
    agent: developer
    depends_on:
      - research
  - id: test
    description: Run /hive:multica-init against spike; verify all personas exist
    agent: tester
    depends_on:
      - implement
  - id: review
    description: Reviewer checks routing policy compliance + schema validity
    agent: reviewer
    depends_on:
      - test
  - id: integrate
    description: Commit on feat/multica-substrate-deepen
    agent: developer
    depends_on:
      - review
context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: .pHive/multica/agents.yaml
      purpose: File to expand
    - path: hive/references/multica-agents-schema.md
      purpose: Schema contract
    - path: hive/agents/
      purpose: Persona ref targets
code_examples:
  - title: Current agents.yaml structure
    file: .pHive/multica/agents.yaml
    snippet: |
      schema_version: 1
      agents:
        - name: developer
          provider: claude
          model: claude-sonnet-4-6
          max_concurrent_tasks: 1
          persona_ref: hive/agents/developer.md
          custom_env: {}
          custom_args: []
          mcp_config: null
          skills: []
          visibility: workspace
cross_cutting:
  - concern: documentation
    action: Update GUIDE.md Multica section to reference new persona inventory
  - concern: versioning
    action: Conditional — maintainer-only file; no version bump unless multica-init is consumer-invoked
risks:
  - severity: medium
    description: Provider value rejected by Multica runtime
    mitigation: W0.1 spike pre-empts this; if discovered post-W0.1, downgrade to claude per fallback rule
metric:
  applies: true
  name: multica.dispatchable_personas_bootstrapped
  direction: up
  unit: count
  baseline: 3
  target: 18
  window: post-story-integrate
  source:
    kind: manual
    ref: multica agent list --output json | jq length
  verify_at: integrate
  owner: tester
tracker_id: plugin-hive/PLU-98
