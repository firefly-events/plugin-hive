id: w1-2-agents-yaml-expansion
epic: multica-substrate-deepen
title: Expand .pHive/multica/agents.yaml to dispatchable persona subset with codex routing
status: pending
complexity: medium
methodology: classic
depends_on:
- w1-1-persona-dispatchability-doc
- w0-1-codex-spike
description: "Expand .pHive/multica/agents.yaml from 3 personas (developer/tester/reviewer)\nto the dispatchable subset (~20 personas per W1.1).\n\nApply 2026-05-01 codex-routing policy gated on W0.1 result:\n- If W0.1 verdict = supported: creators (developer, backend-developer,\n  frontend-developer, researcher, architect, technical-writer) get\n  `provider: codex` (or whatever the actual codex-runtime registration\n  shape is per W0.1 finding).\n- If W0.1 verdict = not_supported: all creators stay `provider: claude`;\n  codexInstruction rescue dance remains via W1.4 conditional.\n- If W0.1 verdict = supported_with_caveats: user checkpoint before\n  proceeding; document caveats inline.\n\nVerifiers (reviewer, peer-validator, tester, tpm) get\n`provider: claude` + `model: claude-opus-4-7`.\n\nRemaining specialists default to `provider: claude` + `model: claude-sonnet-4-6`.\n"
acceptance_criteria:
- agents.yaml lists exactly the dispatchable subset from W1.1 (no orchestrator, no team-lead, no pair-programmer)
- Creator personas route to codex provider IFF W0.1 = supported, else claude
- Verifier personas route to claude-opus-4-7
- All entries have persona_ref pointing to hive/agents/<name>.md
- Schema version stays 1 (matches hive/references/multica-agents-schema.md)
- Multica bootstrap (multica-init) succeeds against new agents.yaml in spike workspace
- After bootstrap, `multica agent list --output json` returns all dispatchable personas
steps:
- id: research
  description: Read W0.1 finding + W1.1 classification + multica-agents-schema reference
  agent: researcher
- id: implement
  description: Edit agents.yaml; add all dispatchable personas with correct routing
  agent: developer
  depends_on:
  - research
- id: test
  description: Run /hive:multica-init against spike; verify all personas exist
  agent: tester
  depends_on:
  - implement
- id: review
  description: Reviewer checks routing policy compliance + schema validity
  agent: reviewer
  depends_on:
  - test
- id: integrate
  description: Commit on feat/multica-substrate-deepen
  agent: developer
  depends_on:
  - review
