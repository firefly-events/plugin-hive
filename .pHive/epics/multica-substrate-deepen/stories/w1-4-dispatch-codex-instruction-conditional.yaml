id: w1-4-dispatch-codex-instruction-conditional
epic: multica-substrate-deepen
title: Make serializeStoryBrief codexInstruction conditional on per-persona provider
status: pending
complexity: medium
methodology: classic
depends_on:
- w0-1-codex-spike
- w1-2-agents-yaml-expansion
description: "Today's serializeStoryBrief takes a `codexInstruction: bool` and conditionally\nembeds a \"## Use /codex:rescue\" section. Decision is made by\nexecute-mode-multica based on hive_config.agent_backends.developer === 'codex'.\n\nAfter W1.2, the dispatching persona is no longer always `developer` \u2014 and\nfor each persona, the provider may be codex (native) or claude (rescue-via-\n/codex:rescue). The codexInstruction flag must become conditional on the\n*dispatching persona's effective provider in agents.yaml*, not on a global\ndeveloper-only flag.\n\nBehavior:\n- If W0.1 verdict = supported AND persona.provider = codex: omit the\n  /codex:rescue section entirely. Rescue dance dies.\n- If persona.provider = claude AND hive_config.agent_backends.<persona> =\n  codex: keep current behavior (embed /codex:rescue section).\n- Else: omit /codex:rescue section.\n"
acceptance_criteria:
- serializeStoryBrief reads dispatchingPersona name + looks up effective provider from agents.yaml
- 'If effective provider = codex: brief omits the ''## Use /codex:rescue'' section'
- 'If effective provider = claude AND agent_backends.<persona> = codex: brief embeds ''## Use /codex:rescue'' section (backward-compat)'
- Existing 3-persona behavior unchanged when agents.yaml is at W1.2 default state
- Tests cover all four combinations (codex+codex, codex+claude, claude+codex, claude+claude)
steps:
- id: research
  description: Read serializeStoryBrief; map control flow + flag origin
  agent: researcher
- id: implement
  description: Refactor codexInstruction decision to per-persona provider lookup
  agent: backend-developer
  depends_on:
  - research
- id: test
  description: 4-combo test matrix; assert brief content shape per combo
  agent: tester
  depends_on:
  - implement
- id: review
  description: Reviewer validates backward-compat + correctness
  agent: reviewer
  depends_on:
  - test
- id: integrate
  description: Commit on feat/multica-substrate-deepen
  agent: developer
  depends_on:
  - review
