id: w4-3-bootstrap-reconcile-skills
epic: multica-substrate-deepen
title: Add reconcileSkills to multica-bootstrap (Mode D-a one-way export)
status: pending
complexity: high
methodology: classic
depends_on:
  - w4-2-skills-export-yaml
description: |
  Add reconcileSkills to hive/lib/multica-bootstrap/ following the same
  list+diff+batched-upsert pattern as the other reconcilers.

  For each entry in .pHive/multica/skills-export.yaml:
  1. Read skill_ref content (SKILL.md from filesystem).
  2. Bundle substrate_deps content into a single payload.
  3. Compute content hash.
  4. Check `multica skill list --output json` for existing skill by
     multica_name.
  5. If missing: create skill in Multica with bundled content + visibility
     per W0.3 finding.
  6. If present and content-hash differs: update skill.
  7. If present and content-hash matches: no-op.

  Idempotent on re-run. Skills removed from yaml are NOT deleted from Multica
  (safety; logged as warning).

  Bundling protocol per W4.1 schema: substrate_deps materialized alongside
  SKILL.md in the Multica skill_file table.
acceptance_criteria:
  - reconcileSkills exported from multica-bootstrap module
  - 'Cold path: empty workspace + 1-entry yaml → 1 skill created with bundled substrate'
  - 'Warm idempotent path: re-run with no source changes → no upserts fire'
  - 'Drift path: SKILL.md content edited → update fires (verified by content hash)'
  - 'Substrate-dep change: prelude.md edited → update fires'
  - 'Removed entry: orphan in Multica, logged warning, not deleted'
  - Tests cover all 5 paths
  - multica-init invokes reconcileSkills after the other three reconcilers
  - Visibility flag applied per W0.3 spike finding
steps:
  - id: research
    description: Read multica skill CLI surface + W4.1 schema + W0.3 visibility finding
    agent: researcher
  - id: implement
    description: Add reconcileSkills + bundling logic + wire into multica-init
    agent: backend-developer
    depends_on:
      - research
  - id: test
    description: 5-path test coverage
    agent: tester
    depends_on:
      - implement
  - id: review
    description: Reviewer validates idempotence + safety + visibility correctness
    agent: reviewer
    depends_on:
      - test
  - id: integrate
    description: Commit on feat/multica-substrate-deepen
    agent: developer
    depends_on:
      - review
context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: hive/lib/multica-bootstrap/
      purpose: Module to extend
    - path: skills/metrics-check/SKILL.md
      purpose: Pilot skill source
    - path: hive/references/skill-prelude.md
      purpose: Common substrate dep
cross_cutting:
  - concern: documentation
    action: Update bootstrap README; document bundling protocol; update GUIDE.md Multica section
risks:
  - severity: high
    description: Bundling protocol leaks unintended files (substrate_dep glob too wide)
    mitigation: Explicit substrate_deps list in yaml; no globbing; reconcile fails if any listed path missing
  - severity: medium
    description: Content-hash mismatch fires every run (false positive)
    mitigation: Normalize content before hash (trim trailing whitespace, normalize line endings)
metric:
  applies: true
  name: multica.skills_exported_with_substrate
  direction: up
  unit: count
  baseline: 0
  target: 1
  window: post-story-integrate
  source:
    kind: manual
    ref: multica skill list --output json | jq length AND multica skill files <id> shows substrate
  verify_at: test
  owner: tester
tracker_id: plugin-hive/PLU-114
