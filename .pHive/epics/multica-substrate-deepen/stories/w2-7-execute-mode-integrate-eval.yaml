id: w2-7-execute-mode-integrate-eval
epic: multica-substrate-deepen
title: Wire squad-evaluation read into execute-mode-multica integrate step
status: pending
complexity: medium
methodology: classic
depends_on:
  - w2-5-eval-contract-doc
  - w2-6-dispatch-record-squad-eval
description: |
  Extend skills/hive/skills/execute-mode-multica/SKILL.md Step 3 (Episode
  marker per terminal) so that, conditional on squad presence in
  .pHive/multica/squads.yaml:

  1. After dispatch reaches terminal status (completed) AND `git push`
     succeeded AND PR opened, call dispatch.recordSquadEvaluation(issueId).
  2. Include the returned evaluation in the episode marker under a new
     `squad_evaluation` field.
  3. Do NOT block /execute completion if the evaluation is null or the
     read errors. Log warning and continue.

  If .pHive/multica/squads.yaml is absent (Phase B not adopted by the
  consumer project), this step is a no-op.
acceptance_criteria:
  - execute-mode-multica Step 3 references recordSquadEvaluation invocation
  - Episode marker schema extended with optional squad_evaluation field
  - Squad eval call is best-effort — null result and errors do not fail /execute
  - Conditional on .pHive/multica/squads.yaml presence (consumer without squads adopted = no-op)
  - 'Smoke test: full /execute pass on a story dispatched to dev-team-squad shows squad_evaluation in episode marker'
steps:
  - id: research
    description: Read execute-mode-multica Step 3 + episode-schema reference
    agent: researcher
  - id: implement
    description: Update SKILL.md prose; update episode-sync.mjs schema; update step-integrate file
    agent: technical-writer
    depends_on:
      - research
  - id: test
    description: Smoke test via dispatch of trivial story to dev-team-squad
    agent: tester
    depends_on:
      - implement
  - id: review
    description: Architect + reviewer validate contract compliance + best-effort semantics
    agent: reviewer
    depends_on:
      - test
  - id: integrate
    description: Commit on feat/multica-substrate-deepen
    agent: developer
    depends_on:
      - review
context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
