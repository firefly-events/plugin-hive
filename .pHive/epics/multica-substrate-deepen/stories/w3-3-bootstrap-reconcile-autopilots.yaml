id: w3-3-bootstrap-reconcile-autopilots
epic: multica-substrate-deepen
title: Add reconcileAutopilots to multica-bootstrap
status: pending
complexity: medium
methodology: classic
depends_on:
- w3-2-autopilots-yaml
description: 'Add reconcileAutopilots to hive/lib/multica-bootstrap/ following the same

  list+diff+batched-upsert pattern as reconcileAgents and reconcileSquads.


  Reads .pHive/multica/autopilots.yaml; calls `multica autopilot list`;

  diffs; batched upserts via `multica autopilot create/update` and

  `multica autopilot trigger-add/delete/update`.


  Captures the server-generated webhook URL on create and writes it back

  into the yaml as a `webhook_url:` field (consumer wires this URL into

  the source repo''s GitHub Actions or equivalent).


  Idempotent on re-run. Autopilots removed from yaml are NOT deleted

  (safety; logged as warning).

  '
acceptance_criteria:
- reconcileAutopilots exported from multica-bootstrap module
- "Cold path: empty workspace + 2-autopilot yaml \u2192 2 autopilots created + webhook URLs captured"
- "Warm path: 1 autopilot exists \u2192 diff applies only delta"
- "Drift: agent changed \u2192 update without recreating autopilot"
- "Removed autopilot in yaml \u2192 orphan, logged warning, not deleted"
- Tests cover all 4 scenarios
- multica-init invokes reconcileAutopilots after reconcileAgents AND reconcileSquads
- Captured webhook URLs written back to autopilots.yaml
