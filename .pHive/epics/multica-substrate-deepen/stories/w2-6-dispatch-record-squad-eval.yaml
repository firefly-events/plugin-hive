id: w2-6-dispatch-record-squad-eval
epic: multica-substrate-deepen
title: Add recordSquadEvaluation helper to multica-story-dispatch
status: pending
complexity: medium
methodology: classic
depends_on:
  - w2-4-adapter-abi-1-1
description: |
  Add recordSquadEvaluation(issueId, options) helper to
  hive/lib/multica-story-dispatch/ that:

  1. Calls adapter.updateIssueStatus(issueId, 'in_review')
  2. Calls adapter.getSquadActivity(issueId) to fetch any existing evaluation
  3. Returns the evaluation object (or null) for inclusion in the episode marker

  Used by W2.7's execute integrate-step extension.

  Helper handles the same error-mapping conventions as serializeStoryBrief
  (TRANSPORT, AUTH_FAILURE wraps).
acceptance_criteria:
  - recordSquadEvaluation exported from hive/lib/multica-story-dispatch/index.mjs
  - Function calls updateIssueStatus then getSquadActivity in order
  - 'Returns { status_transitioned: bool, evaluation: <obj|null> } shape'
  - 'Tests cover: happy path, getSquadActivity 404 (no eval), updateIssueStatus auth fail'
  - Auth failure surfaces with /hive:multica-init hint per existing convention
