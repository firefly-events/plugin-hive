id: w3-4-autopilot-deprecation-doc
epic: multica-substrate-deepen
title: "Document autopilot deprecation list (what local schedules migrate)"
status: pending
complexity: low
methodology: classic
depends_on: []
parallel_allowed: true
parallel_rationale: variation

description: |
  Author .pHive/epics/multica-substrate-deepen/docs/autopilot-deprecation.md
  documenting:

  - For each Multica autopilot (metrics-check-post-merge, visual-qa-post-merge),
    which existing local-scheduling mechanism it replaces.
  - When the migration takes effect (per project; consumer opt-in).
  - What happens to projects not using Multica (local scheduling continues
    unchanged).
  - Per-project flag / config to disable local scheduling when the autopilot
    is active (avoids dual-firing).

  Doc is consumed at adoption time by maintainers of consumer projects; not
  by hive runtime.

acceptance_criteria:
  - "Doc exists at the specified path"
  - "Each autopilot maps to its local-scheduling equivalent (or 'no prior local equivalent')"
  - "Per-project flag/config name documented for disable-local-when-autopilot-active"
  - "Consumers without Multica explicitly noted as unaffected"

steps:
  - id: research
    description: Identify any existing local scheduling for metrics-check + visual-qa post-merge
    agent: researcher
  - id: implement
    description: Write deprecation doc
    agent: technical-writer
    depends_on: [research]
  - id: review
    description: Reviewer checks completeness
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit on feat/multica-substrate-deepen
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: skills/metrics-check/SKILL.md
      purpose: Current metrics-check skill (and any cron wiring it documents)
    - path: skills/visual-qa/SKILL.md
      purpose: Current visual-qa skill

cross_cutting:
  - concern: documentation
    action: "This story IS documentation; cross-reference from GUIDE.md"

risks:
  - severity: low
    description: Dual-firing (local + autopilot) duplicates work
    mitigation: Per-project flag documented; opt-in adoption model

metric:
  applies: false
  justification: "Adoption-guidance doc; behavior change is downstream by consumers, not measurable in this story."
