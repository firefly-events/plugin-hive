id: w1-3-bootstrap-n-persona-reconcile
epic: multica-substrate-deepen
title: Refactor reconcileAgents for N-persona batch operation
status: pending
complexity: medium
methodology: classic
depends_on:
- w1-2-agents-yaml-expansion
description: "Today's reconcileAgents in hive/lib/multica-bootstrap/ is optimized for the\n3-persona bootstrap path. With W1.2 expanding to ~20 personas, the\nper-persona round-trip (list / check / create / patch) becomes expensive\nand stateful drift becomes harder to debug.\n\nRefactor to: single `multica agent list --output json` call at start,\nin-memory diff against agents.yaml, batched upserts via `multica agent\ncreate` / `multica agent update` per delta. Idempotent on re-run.\n\nTests cover: cold bootstrap (empty workspace), warm bootstrap (some\npersonas exist), drift (persona's persona_ref or model changed),\ncleanup (persona removed from agents.yaml \u2014 left intact in Multica for\nsafety; documented).\n"
acceptance_criteria:
- reconcileAgents performs single list + diff + batched upsert, not N round-trips
- Cold bootstrap from empty workspace creates all agents.yaml entries
- Warm bootstrap with partial overlap creates only missing personas
- Persona with changed model or persona_ref triggers update, not delete+create
- Personas removed from agents.yaml are NOT deleted from Multica (safety; logged as warning)
- All four scenarios covered by tests under hive/lib/multica-bootstrap/test/
- Tests pass against in-memory Multica fixture (no live spike server needed for CI)
steps:
