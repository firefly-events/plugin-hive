id: w4-2-skills-export-yaml
epic: multica-substrate-deepen
title: Author .pHive/multica/skills-export.yaml with /metrics-check pilot
status: pending
complexity: low
methodology: classic
depends_on:
  - w4-1-export-schema-doc
description: |
  Author .pHive/multica/skills-export.yaml as the pilot manifest.

  One entry: /metrics-check (single-persona, low-dependency — cleanest pilot
  candidate per design discussion §3 risk R3 mitigation).

  Entry includes:
  - skill_ref: skills/metrics-check/SKILL.md
  - multica_name: metrics-check
  - substrate_deps: ARRAY of paths to reference docs the skill depends on
    (hive/references/skill-prelude.md at minimum; specific deps determined
    by inspecting metrics-check SKILL.md)
  - visibility: private (or default per W0.3 finding)
acceptance_criteria:
  - File exists at .pHive/multica/skills-export.yaml
  - Conforms to W4.1 schema
  - Pilot entry references existing files (skill_ref + all substrate_deps)
  - substrate_deps list verified by reading metrics-check SKILL.md for references
  - Visibility matches W0.3 finding's recommendation
steps:
  - id: research
    description: Read metrics-check SKILL.md; identify all substrate dependencies
    agent: researcher
  - id: implement
    description: Write skills-export.yaml with pilot entry
    agent: developer
    depends_on:
      - research
  - id: review
    description: Reviewer validates schema + file existence
    agent: reviewer
    depends_on:
      - implement
  - id: integrate
    description: Commit on feat/multica-substrate-deepen
    agent: developer
    depends_on:
      - review
context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
