name: multica-substrate-deepen
title: "Multica Substrate-Deepen \u2014 expand integration from ~15% to substrate-first"
description: 'Move plugin-hive from Multica-as-issue-tracker to Multica-as-substrate.

  Eliminate the inner-session /codex:rescue indirection by routing creator

  personas to codex-backed Multica agents (gated on Phase 0 spike).

  Adopt squads as Hive teams (leader delegates by @mention to roster),

  autopilots (conservative: metrics-check + visual-qa only), and Mode D-a

  read-only skills export. Substrate-signal read-back deferred until

  upstream Multica adds GET squad-evaluations endpoint.

  '
target_codebase: /Users/don/Documents/plugin-hive
methodology: classic
git_flow:
  base_branch: develop
  branch_strategy: per-epic
