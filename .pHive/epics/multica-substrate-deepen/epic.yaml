name: multica-substrate-deepen
title: Multica Substrate-Deepen — expand integration from ~15% to substrate-first
description: |
  Move plugin-hive from Multica-as-issue-tracker to Multica-as-substrate.
  Eliminate the inner-session /codex:rescue indirection by routing creator
  personas to codex-backed Multica agents (gated on Phase 0 spike).
  Adopt squads (governance namespace + substrate-signal evaluation at PR-open),
  autopilots (conservative: metrics-check + visual-qa only), and Mode D-a
  read-only skills export.

target_codebase: /Users/don/Documents/plugin-hive
methodology: classic

git_flow:
  base_branch: develop
  branch_strategy: per-epic

stories:
  # Wave 0 — Spikes (parallel, read-only)
  - id: w0-1-codex-spike
    title: "Spike: confirm Multica agent runtime supports codex provider"
    complexity: medium
    depends_on: []
  - id: w0-2-squad-read-spike
    title: "Spike: confirm Multica squad-activity read path exists in REST surface"
    complexity: medium
    depends_on: []
  - id: w0-3-skill-import-spike
    title: "Spike: confirm Multica skill import supports private visibility mechanism"
    complexity: low
    depends_on: []

  # Wave 1 — Persona port
  - id: w1-1-persona-dispatchability-doc
    title: "Classify all 25 plugin-hive personas by Multica dispatchability"
    complexity: low
    depends_on: [w0-1-codex-spike]
  - id: w1-2-agents-yaml-expansion
    title: "Expand .pHive/multica/agents.yaml to dispatchable persona subset with codex routing"
    complexity: medium
    depends_on: [w1-1-persona-dispatchability-doc, w0-1-codex-spike]
  - id: w1-3-bootstrap-n-persona-reconcile
    title: "Refactor reconcileAgents for N-persona batch operation"
    complexity: medium
    depends_on: [w1-2-agents-yaml-expansion]
  - id: w1-4-dispatch-codex-instruction-conditional
    title: "Make serializeStoryBrief codexInstruction conditional on per-persona provider"
    complexity: medium
    depends_on: [w0-1-codex-spike, w1-2-agents-yaml-expansion]

  # Wave 2 — Squads
  - id: w2-1-squad-schema-doc
    title: "Author hive/references/multica-squads-schema.md"
    complexity: low
    depends_on: [w0-2-squad-read-spike]
  - id: w2-2-squads-yaml
    title: "Author .pHive/multica/squads.yaml with three squads"
    complexity: low
    depends_on: [w2-1-squad-schema-doc]
  - id: w2-3-bootstrap-reconcile-squads
    title: "Add reconcileSquads to multica-bootstrap"
    complexity: medium
    depends_on: [w2-2-squads-yaml]
  - id: w2-4-adapter-abi-1-1
    title: "Adapter ABI 1.1.0 — add getSquadActivity + updateIssueStatus"
    complexity: high
    depends_on: [w0-2-squad-read-spike]
  - id: w2-5-eval-contract-doc
    title: "Author hive/references/squad-evaluation-contract.md (substrate-signal contract)"
    complexity: low
    depends_on: [w0-2-squad-read-spike]
  - id: w2-6-dispatch-record-squad-eval
    title: "Add recordSquadEvaluation helper to multica-story-dispatch"
    complexity: medium
    depends_on: [w2-4-adapter-abi-1-1]
  - id: w2-7-execute-mode-integrate-eval
    title: "Wire squad-evaluation read into execute-mode-multica integrate step"
    complexity: medium
    depends_on: [w2-5-eval-contract-doc, w2-6-dispatch-record-squad-eval]

  # Wave 3 — Autopilots
  - id: w3-1-autopilot-schema-doc
    title: "Author hive/references/multica-autopilots-schema.md"
    complexity: low
    depends_on: []
  - id: w3-2-autopilots-yaml
    title: "Author .pHive/multica/autopilots.yaml with metrics-check + visual-qa autopilots"
    complexity: low
    depends_on: [w3-1-autopilot-schema-doc]
  - id: w3-3-bootstrap-reconcile-autopilots
    title: "Add reconcileAutopilots to multica-bootstrap"
    complexity: medium
    depends_on: [w3-2-autopilots-yaml]
  - id: w3-4-autopilot-deprecation-doc
    title: "Document autopilot deprecation list (what local schedules migrate)"
    complexity: low
    depends_on: []

  # Wave 4 — Skills export (Mode D-a)
  - id: w4-1-export-schema-doc
    title: "Author hive/references/multica-skills-export-schema.md"
    complexity: low
    depends_on: [w0-3-skill-import-spike]
  - id: w4-2-skills-export-yaml
    title: "Author .pHive/multica/skills-export.yaml with /metrics-check pilot"
    complexity: low
    depends_on: [w4-1-export-schema-doc]
  - id: w4-3-bootstrap-reconcile-skills
    title: "Add reconcileSkills to multica-bootstrap (Mode D-a one-way export)"
    complexity: high
    depends_on: [w4-2-skills-export-yaml]
  - id: w4-4-ci-drift-guard
    title: "CI drift guard — fail build on in-repo vs Multica skill divergence"
    complexity: medium
    depends_on: [w4-1-export-schema-doc]
  - id: w4-5-pilot-roundtrip-validation
    title: "Pilot round-trip validation — export /metrics-check, verify in spike workspace"
    complexity: low
    depends_on: [w4-3-bootstrap-reconcile-skills]
