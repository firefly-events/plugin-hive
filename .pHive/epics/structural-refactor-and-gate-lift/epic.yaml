acceptance_criteria:
  - "skills/plan split into routing + escalation atoms; line-count delta ≥-300 lines net"
  - "skills/execute split into dispatch + mode atoms; mode-dispatch reusable outside execute"
  - "skills/agent-spawn split into persona + memory + dispatch atoms"
  - "brand-system + design-system inline schemas extracted to hive/references/"
  - "ui-audit collapsed into design-review with --artifact-target flag; ui-audit skill removed"
  - "paths.gate_mode: warning|hard config knob exists; default warning for 2.0; hard preserves original behavior"
  - "/plan runs on fresh repo with sane defaults under gate_mode: warning; warns on missing config"
  - "/execute runs without pre-existing epic under gate_mode: warning; ad-hoc epic scaffolded"
  - "Methodology auto-detect signals documented (tests → tdd; gherkin → bdd; else → classic); --methodology= flag overrides"
  - "Backend auto-resolve order: env > hive.config.yaml > prompt; warns on no-config"
  - "Post-run audit emits warning if defaults produced nonsensical state; telemetry captured for gate_mode default-flip decision"

