    description: Lifting /plan + /execute hard-gates produces silent miscoordination at scale (wrong methodology, wrong backend, ad-hoc epic state)
    mitigation: paths.gate_mode default warning for 2.0; A-36 post-run audit captures telemetry; flip default to hard if signal shows up
  - severity: medium
    description: Splitting /plan during in-flight Phase A2 grill wiring causes merge churn
    mitigation: Blocked-by Epic A W4 — Grill must land first per dependency chain
  - severity: medium
    description: Methodology auto-detect produces wrong default on edge cases (e.g., tdd repos with no tests yet)
    mitigation: --methodology= flag override always works; warning is loud; telemetry captures miss rate
