name: structural-refactor-and-gate-lift
title: Structural Refactor + Gate Lift (Epic B)
description: |
  Second in-flight epic from hive-composability-audit recommendation (2026-05-08).
  Splits big skills into composable atoms, collapses ui-audit into design-review,
  extracts inlined config from brand-system + design-system, AND folds in D4
  Position A (lift /plan + /execute hard-gates to warnings via paths.gate_mode knob).

  D4 Position A fold-in is per user course-correction 2026-05-08:
    - North Star reframes from "director's chair" to "composable substrate, user-directed"
    - A composable substrate that hard-blocks on its own initialization ritual is anti-substrate
    - Lift /plan + /execute hard-gates to warnings + sane defaults
    - Mitigation: paths.gate_mode: warning|hard config knob, default warning for 2.0,
      telemetry-validate over one release cycle, flip default to hard if miscoordination at scale

  Gate-lift work (A-32–A-36) and structural splits (A-04, A-05, A-14) all touch the
  same files (skills/plan, skills/execute, skills/agent-spawn). Folding gate-lift into
  this epic is cheaper than separate epic — files already open for restructure.

  This epic is one of three required for 2.0 (with catalog-hygiene-and-borrows
  and task-tracking-adapter-abi).

target_codebase: /Users/don/Documents/plugin-hive
