      Step 0.1: Build team composition.
      Step 0.2: Build routing decisions.
      Step 0.3: Spawn the team across two paths.
      Step 0.4: Mixed-team prompt template.
      Step 0.5: Runtime fallback.
  - path: skills/grill/SKILL.md
    relevant_excerpt: |
