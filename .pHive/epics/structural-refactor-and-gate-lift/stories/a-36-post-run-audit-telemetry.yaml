design_decisions:
  - decision: Consolidated warning per run, not per field
    rationale: Multiple per-field warnings produce noise; one summary listing all defaulted fields is actionable.
  - decision: Aggregation is async (separate script) not inline in /plan or /execute
    rationale: Per-run cost stays low; aggregation runs nightly (via meta-team or cron) or on-demand.
  - decision: Recommendation is advisory, not enforced
    rationale: gate_mode default flip is a major-version decision; telemetry justifies it but a human approves.

cross_cutting:
  - concern: observability
    action: "Telemetry is the substrate; per-run audit is consumer; aggregation is decision-input. All three layers documented."
  - concern: backward-compatibility
    action: "No behavior changes for runs that don't trigger auto-resolve or gate-lift — audit is silent."

risks:
  - severity: medium
    description: Nonsensical-default heuristics may false-positive (e.g., legitimate sparse run flagged).
    mitigation: Heuristics are conservative; test step explicitly verifies no false-positives on legitimate runs; warning is informational, not blocking.
  - severity: medium
    description: Aggregation thresholds are initial guesses; may need tuning.
    mitigation: Threshold values documented + parameterized in script; future telemetry tuning is a small adjustment.
  - severity: low
    description: Stop-hook + metrics infrastructure may not capture all telemetry events.
    mitigation: Test step verifies event flow end-to-end; fix any capture gaps as found.

