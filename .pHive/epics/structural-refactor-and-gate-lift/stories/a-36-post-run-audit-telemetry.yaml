id: a-36-post-run-audit-telemetry
epic: structural-refactor-and-gate-lift
title: Post-run audit check warns on nonsensical default state; telemetry feeds gate_mode flip decision
status: blocked
complexity: medium
methodology: classic
depends_on: [a-33-plan-gate-lift-and-gate-mode-knob, a-35-execute-epic-create-on-fly-and-gate-lift]
wave: W6
action_id: A-36

description: |
  Stories a-32 / a-33 / a-34 / a-35 each emit telemetry events when
  auto-resolve or gate-lift fires:
    - methodology_resolution {source, value}
    - gate_lift_fired {source, decision}
    - backend_resolution {field, source, value}
    - epic_create_on_fly {epic_id, source}

  This story closes the loop. Two pieces:

  1. Post-run audit check (synchronous): after /plan or /execute completes,
     scan the run for nonsensical defaults and emit a CONSOLIDATED warning.
     Examples of nonsensical defaults:
       - methodology=tdd auto-detected but no tests actually written by the run
       - epic_create_on_fly fired AND no story spec was produced
       - all 4 backend fields defaulted (signals user hasn't configured anything)
       - gate_lift_fired AND output is structurally empty

  2. Telemetry aggregation (async/cumulative): events written to
     .pHive/metrics/events/ are read by /meta-optimize or a new
     /gate-mode-audit skill that aggregates across runs and recommends
     whether paths.gate_mode default should flip from warning → hard.

  Aggregation thresholds (initial guesses, tunable via telemetry):
    - >20% of runs see gate_lift fire AND produce nonsensical output → recommend flip to hard
    - >50% of runs default ALL backend fields → recommend ship config template
    - <5% of runs see gate_lift fire → consider keeping warning safely

  Depends on a-33 + a-35 because they emit the gate_lift telemetry this
  story consumes.

acceptance_criteria:
  - "Post-run audit step added to /plan and /execute final phases"
  - "Audit scans the run for nonsensical defaults (criteria listed in description) and emits a CONSOLIDATED warning summarizing all defaulted fields"
  - "Audit warning includes per-field source + override path (run /kickoff, set hive.config.yaml field X)"
  - "Telemetry events from a-32/a-33/a-34/a-35 flow into .pHive/metrics/events/ (existing infrastructure)"
  - "Aggregation reader: a small script (hive/scripts/gate-mode-audit.mjs) or extension to /meta-optimize that reads events + outputs recommendation"
  - "Aggregation recommendation written to .pHive/meta-team/gate-mode-recommendation.md when thresholds cross"
  - "No false positives: legitimate runs (user has config) don't trigger audit warnings"
  - "Telemetry shape documented at hive/references/gate-lift-telemetry.md"

steps:
  - id: research
    description: |
      1. Read existing telemetry infrastructure: .pHive/metrics/events/ format + stop hook + any existing readers.
      2. Read sibling stories a-32/a-33/a-34/a-35 to confirm event shapes they emit.
      3. Read /meta-optimize skill if relevant — could be the reader.
      4. Define nonsensical-default heuristics precisely (avoid false positives).
      5. Define aggregation thresholds (initial guesses).
    agent: researcher

  - id: implement
    description: |
      Post-run audit:
        - Add a final step to skills/plan/SKILL.md and skills/execute/SKILL.md:
          "Run post-run audit: scan telemetry events from this run; emit
          consolidated warning if any nonsensical defaults detected; record
          audit result to .pHive/audits/post-run/{run-id}.yaml."

      Telemetry aggregation:
        - Create hive/scripts/gate-mode-audit.mjs:
          - Read .pHive/metrics/events/*.jsonl
          - Aggregate gate_lift_fired + backend_resolution + epic_create_on_fly + methodology_resolution
          - Apply thresholds; emit recommendation if crossed
          - Write recommendation to .pHive/meta-team/gate-mode-recommendation.md
        - Wire into /meta-optimize as an additional proposal source (optional; can be standalone).

      Documentation:
        - Create hive/references/gate-lift-telemetry.md documenting event shapes + thresholds.
    agent: developer
    depends_on: [research]

  - id: test
    description: |
      1. Run /plan on fresh repo (defaults fire) → verify post-run audit emits warning.
      2. Run /plan on populated repo (no defaults fire) → verify no audit warning.
      3. Run /execute with ad-hoc epic → verify audit catches "nonsensical: ad-hoc epic + no story spec produced" if applicable.
      4. Run gate-mode-audit.mjs against a fixture event log → verify recommendation logic.
      5. Verify telemetry shape matches documented schema.
    agent: tester
    depends_on: [implement]

  - id: review
    description: |
      1. Verify nonsensical-default heuristics don't false-positive on legitimate sparse runs.
      2. Verify audit consolidates per-field warnings into one message.
      3. Verify aggregation thresholds are reasonable (not too sensitive, not too lax).
      4. Verify telemetry documentation is complete.
    agent: reviewer
    depends_on: [test]

  - id: integrate
    description: 'Commit on feat/structural-refactor-and-gate-lift; commit message format `feat(gate-lift): post-run audit + telemetry aggregation (story a-36-post-run-audit-telemetry, W6)`.'
    agent: developer
    depends_on: [review]

