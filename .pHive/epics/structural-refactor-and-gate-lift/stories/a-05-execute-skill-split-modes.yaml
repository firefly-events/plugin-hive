id: a-05-execute-skill-split-modes
epic: structural-refactor-and-gate-lift
title: Split /execute three execution modes into composable atoms
status: completed
complexity: high
methodology: classic
depends_on: [a-05-execute-skill-split-dispatch]
wave: W6
action_id: A-05

description: |
  skills/execute/SKILL.md contains three execution-mode bodies that
  together make up the bulk of the skill:
    - Step 6: Agent team execution (TeamCreate path) — cites references/team-execution.md
    - Step 6b: Agent team execution (cmux path) — ~14 lines inline + cites references/team-execution.md
    - Step 6c: Session-based execution — ~26 lines inline with 6 sub-steps (6c-1 through 6c-6)
    - Step 7: Sequential execution — cites references/sequential-execution.md

  Steps 6 and 7 are already mostly extracted (cite references). Step 6b
  (cmux variant) and step 6c (sessions) are still inline-heavy in
  skills/execute/SKILL.md and need extraction.

  Extract into composable atom skills:
    - skills/hive/skills/execute-mode-team-cmux/SKILL.md (covers step 6b)
    - skills/hive/skills/execute-mode-session/SKILL.md (covers step 6c-1 through 6c-6)
    OR consolidate into a single skills/hive/skills/execute-modes/SKILL.md
    with sub-sections for each mode (decide in research).

  Depends on a-05-execute-skill-split-dispatch landing first because:
    1. The dispatch decision drives which mode atom is invoked
    2. Form-decision for dispatch (atomic skill vs reference) binds this story

acceptance_criteria:
  - "step 6b cmux-variant body extracted from skills/execute/SKILL.md"
  - "step 6c session-execution body (6c-1 through 6c-6) extracted from skills/execute/SKILL.md"
  - "skills/execute/SKILL.md step 6, 6b, 6c, 7 each reduced to ≤8 lines — single invocation per mode"
  - "Net line delta across skills/execute/SKILL.md + extracted artifacts is ≥-50 lines (target ~-75)"
  - "Mode atoms are independently invokable: an external orchestrator can call team-cmux or session mode without /execute as a wrapper"
  - "Sidecar injection (appends[] map) is preserved in each mode atom — review-phase sidecar reviewers still attach per step 2b's partition"
  - "Per-story commits on hive-{story-id} feature branches preserved in all modes"
  - "Session resilience monitoring preserved: sse_last_event_at + stuck_timeout_ms + max_retries"
  - "cmux pane lifecycle preserved: poll loop, surface.health, surface close on completion"
  - "/execute continues to pass end-to-end on all 4 mode paths (sequential, team-default, team-cmux, session)"

steps:
  - id: research
    description: |
      1. Read skills/execute/SKILL.md lines 132-200 (step 6 through step 7a) in full.
      2. Read hive/references/team-execution.md and hive/references/sequential-execution.md to understand what is already extracted vs what is still inline.
      3. Read sibling a-05-execute-skill-split-dispatch to confirm form decision.
      4. Read skills/hive/skills/respawn/SKILL.md and skills/hive/skills/session-registry/SKILL.md to map adjacent invocations the mode atoms must coordinate with.
      5. Decide: separate skills per mode OR single execute-modes skill with sub-sections.
      6. Sketch invocation signature for each mode atom — inputs (story spec, workflow definition, sidecar map, session/team config), outputs (episode markers written, mode-specific status).
    agent: researcher

  - id: implement
    description: |
      Path A — separate skills per mode (preferred):
        - Create skills/hive/skills/execute-mode-team-cmux/SKILL.md with cmux poll loop, surface.health, completion detection, respawn coordination.
        - Create skills/hive/skills/execute-mode-session/SKILL.md with 6 sub-steps (6c-1 through 6c-6), session registry coordination, sidecar injection at review phase, resilience monitoring.
        - Replace skills/execute/SKILL.md step 6b + step 6c with ≤8-line invocations each.
        - Step 6 + step 7 already cite references — extend them to ≤8-line cite-only blocks for consistency.

      Path B — single execute-modes skill:
        - Less preferred; mode atoms can grow independently if separate.

      Either path:
        - Sidecar injection (review-phase append of specialist agents) preserved per mode.
        - Per-story commit pattern preserved (hive-{story-id} branch + commit on review pass).
        - Session resilience contract preserved (replaces respawn for session-path stories).
        - cmux surface lifecycle preserved (close-surface on completion).
    agent: developer
    depends_on: [research]

  - id: test
    description: |
      1. Line-count check: wc -l skills/execute/SKILL.md before/after.
      2. Run /execute on test epic in team mode (default) → verify TeamCreate path still works.
      3. Run /execute with execution.terminal_mux=cmux → verify cmux poll loop fires, [STORY-COMPLETE:{id}] detected, surface closed on completion.
      4. Run /execute with sessions.enabled=true → verify 6 sub-steps fire in order, session record created+updated in index.yaml, sse_last_event_at advances.
      5. Run /execute with one escalation in appends[] → verify sidecar reviewer attached at review phase in every mode.
      6. Run /execute --sequential → verify sequential path still works (references/sequential-execution.md citation intact).
    agent: tester
    depends_on: [implement]

  - id: review
    description: |
      1. Confirm each mode atom is independently invokable (no hidden /execute dependency).
      2. Verify sidecar-injection contract is identical across modes.
      3. Verify form consistency with sibling a-05-execute-skill-split-dispatch.
      4. Spot-check session-resilience timeout and retry counts match pre-extraction values.
    agent: reviewer
    depends_on: [test]

  - id: integrate
    description: Commit on feat/structural-refactor-and-gate-lift; commit message format `feat(structural): split /execute modes into composable atoms (story a-05-execute-skill-split-modes, W6)`.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  tech_stack:
    languages: [markdown, javascript]
    frameworks: [hive-orchestrator, claude-code-cmux, claude-agent-sdk-sessions]
  key_files:
    - path: skills/execute/SKILL.md
      purpose: Source — step 6 (132-133), 6b (134-148), 6c (150-175), 7 (177-178) extracted
    - path: hive/references/team-execution.md
      purpose: Already-extracted TeamCreate prompt template + sidecar injection + respawn — mode atoms cite this
    - path: hive/references/sequential-execution.md
      purpose: Already-extracted sequential workflow — mode atoms cite this for step 7
    - path: hive/scripts/session-invoke.mjs
      purpose: Session invocation entry point — session-mode atom calls this
    - path: skills/hive/skills/session-registry/SKILL.md
      purpose: Bootstrap step 6c-1 invokes — preserved as adjacent
    - path: skills/hive/skills/execute-mode-team-cmux/SKILL.md
