design_decisions:
  - decision: Separate skills per mode, not single execute-modes skill
    rationale: Modes evolve independently — sessions in active development, cmux variant stable. Separate skills allow per-mode revision without churn on others.
  - decision: Step 6 (TeamCreate default) and step 7 (sequential) keep their citation pattern
    rationale: Already extracted to references; further atomization adds churn. Goal is line-count reduction in /execute, not architectural purity across all modes.

cross_cutting:
  - concern: backward-compatibility
    action: "All four execution paths must remain runnable. Sidecar injection contract identical across modes. Per-story commit pattern unchanged."
  - concern: observability
    action: "Preserve mode-specific log messages: [STORY-COMPLETE:{id}] markers for cmux, sse_last_event_at advances for sessions, episode markers for sequential."

risks:
  - severity: high
    description: Session-mode atom is complex (6 sub-steps + registry coordination + resilience); extraction risks subtle drift in sse polling or retry semantics.
    mitigation: Test step exercises session path with active SSE; review step compares retry counts byte-for-byte; resilience reference (hive/references/session-resilience.md) preserved as-is.
  - severity: medium
    description: cmux poll loop has implicit assumptions (10-second poll, [STORY-COMPLETE:{id}] marker format); extracted atom must preserve these.
    mitigation: Implement step lists each assumption explicitly; test step verifies completion detection.
  - severity: medium
    description: Mode atoms may accidentally cross-reference /execute state (e.g., escalation partition), defeating reusability.
    mitigation: Invocation signature explicit — sidecar map passed in, not read from /execute. AC #5 enforces standalone invokability.

