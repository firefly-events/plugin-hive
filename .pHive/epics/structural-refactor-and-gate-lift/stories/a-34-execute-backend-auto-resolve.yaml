  key_files:
    - path: skills/execute/SKILL.md
      purpose: Source — step 5 (mode-selection) extends to backend auto-resolve
    - path: skills/hive/skills/execute-dispatch/SKILL.md
      purpose: If a-05 landed — destination for auto-resolve logic
    - path: hive/hive.config.yaml
      purpose: Schema — execution block fields documented
    - path: hive.config.yaml
      purpose: Root config example — auto-resolve documented

design_decisions:
  - decision: Env wins over config
    rationale: Convention across most tooling; env is ergonomic for one-off overrides without editing config.
  - decision: Executor fail-closed preserved
    rationale: Maintainer-only execution choices per Q4 lock; auto-resolve must not flip to hive-dag.
  - decision: One warning per /execute invocation (not per field) when defaults fire
    rationale: Multiple per-field warnings produce noise; aggregate warning lists all defaulted fields in one message.

cross_cutting:
  - concern: backward-compatibility
    action: "Explicit env/config wins; no auto-resolve surprises for users with existing config."
  - concern: observability
    action: "backend_resolution telemetry feeds a-36 audit; per-field source attribution shows which fields are running on defaults."

risks:
  - severity: medium
    description: Polyglot config (env says X, config says Y) is normal; users may be confused which won.
    mitigation: Warning + telemetry both surface per-field source attribution.
  - severity: medium
    description: Default flip later (e.g., terminal_mux default tmux → cmux) would surprise consumers.
    mitigation: Treat as MAJOR version bump; A-36 telemetry justifies any flip with data.

