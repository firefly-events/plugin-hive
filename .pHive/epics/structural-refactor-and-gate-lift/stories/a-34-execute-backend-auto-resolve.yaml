id: a-34-execute-backend-auto-resolve
epic: structural-refactor-and-gate-lift
title: /execute backend auto-resolve (env > hive.config.yaml > prompt)
status: completed
complexity: medium
methodology: classic
depends_on: [a-05-execute-skill-split-dispatch]
wave: W6
action_id: A-34

description: |
  Today /execute reads execution-related config (parallel_teams,
  execution.terminal_mux, sessions.enabled, executor flag) from
  hive.config.yaml or env vars. Per D4 Position A fold-in, /execute
  should auto-resolve backend with a clear precedence and warn loudly
  on no-config.

  Precedence order:
    1. Environment variables (CLAUDE_CODE_*, HIVE_*) → highest priority
    2. hive.config.yaml fields (root first, shipped baseline fallthrough)
    3. Sane defaults + warning

  Sane defaults under no-config:
    - parallel_teams: true (better default than sequential when N>1)
    - execution.terminal_mux: tmux (broadest compat)
    - sessions.enabled: false
    - executor: orchestrator (fail-closed per Q4 lock)

  Loud warning when defaults fire: "Backend auto-resolved: parallel_teams=true,
  terminal_mux=tmux. Configure in hive.config.yaml execution: block to override."

  Reuses the dispatch atom from a-05-execute-skill-split-dispatch (which
  this story depends on). The auto-resolve logic is part of dispatch.

acceptance_criteria:
  - "Backend resolution precedence: env vars > hive.config.yaml > sane defaults"
  - "Sane defaults applied when neither env nor config sets a value"
  - "Loud warning emitted when defaults fire; warning enumerates each defaulted field + override path"
  - "Telemetry event emitted: backend_resolution with per-field source (env|config|default)"
  - "Fail-closed for executor: defaults to orchestrator path; hive-dag requires explicit consumer .pHive/hive.config.yaml flag (preserved from a-05 split)"
  - "skills/execute/SKILL.md or sibling dispatch atom updated to emit warnings and call resolution"
  - "/execute runs on fresh repo with no execution config → produces working epic execution with warning trail"
  - "Explicit config paths (env, hive.config.yaml) take precedence — no surprise overrides"

steps:
  - id: research
    description: |
      1. Read skills/execute/SKILL.md current step 5 (mode-selection) in full.
      2. If a-05-execute-skill-split-dispatch landed, read skills/hive/skills/execute-dispatch/SKILL.md.
      3. Enumerate every backend-related field /execute reads (parallel_teams, terminal_mux, sessions.enabled, executor, model_overrides if relevant).
      4. Document precedence for each field; identify which are env-readable vs config-only.
      5. Sketch resolution + warning emission.
    agent: researcher

  - id: implement
    description: |
      - Update the dispatch atom (or step 5 if a-05 didn't land yet) to:
        - For each field: check env, then config, then default.
        - Track source per field.
        - Emit warning when default fires for any field.
        - Emit telemetry event.
      - Preserve fail-closed for executor (orchestrator path on any miss).
      - Preserve session precedence (HIVE_SESSIONS_ENABLED > sessions.enabled).
    agent: developer
    depends_on: [research]

  - id: test
    description: |
      1. Run /execute with no env + no config → verify sane defaults + warning + telemetry.
      2. Run /execute with HIVE_SESSIONS_ENABLED=true + no config → verify sessions wins.
      3. Run /execute with parallel_teams=false in config + no env → verify config wins.
      4. Run /execute with env + config + defaults all conflicting → verify env wins.
      5. Verify executor stays fail-closed (no env or config can flip it to hive-dag without consumer .pHive/hive.config.yaml flag + registry).
      6. Verify telemetry source attribution per field.
    agent: tester
    depends_on: [implement]

  - id: review
    description: |
      1. Verify per-field precedence is strict.
      2. Verify warning is loud and actionable.
      3. Verify executor fail-closed semantics preserved.
      4. Verify telemetry feeds a-36 audit downstream.
    agent: reviewer
    depends_on: [test]

  - id: integrate
    description: 'Commit on feat/structural-refactor-and-gate-lift; commit message format `feat(gate-lift): /execute backend auto-resolve (story a-34-execute-backend-auto-resolve, W6)`.'
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  tech_stack:
    languages: [markdown, yaml]
