id: a-09-design-system-extract-config
epic: structural-refactor-and-gate-lift
title: Move design-system W3C token spec inline to references
status: pending
complexity: low
methodology: classic
depends_on: []
wave: W6
action_id: A-09

description: |
  skills/design-system/SKILL.md (132 lines) inlines the W3C Design Token
  spec inside the ui-designer task prompt — schema for converting
  .pHive/brand/brand-system.yaml into W3C-format JSON tokens plus a
  visual HTML preview.

  Same shape as a-08 (sibling story): config data embedded in a
  procedural skill. Extract the W3C token spec to hive/references/
  design-token-spec.md (or .yaml). Replace inline block with citation.

  Independent of a-08 — they affect different skills, can land in any order.

acceptance_criteria:
  - "hive/references/design-token-spec.{md|yaml} exists with the W3C token spec"
  - "skills/design-system/SKILL.md inline W3C spec block replaced with citation"
  - "Net line delta on skills/design-system/SKILL.md is ≥-50 lines"
  - "ui-designer task still produces W3C-format JSON tokens conforming to the same spec"
  - "Visual HTML preview of tokens unchanged"

steps:
  - id: research
    description: Read skills/design-system/SKILL.md in full; identify W3C spec block boundaries; sketch reference file.
    agent: researcher

  - id: implement
    description: |
      - Create hive/references/design-token-spec.{md|yaml} with the W3C token spec verbatim.
      - Replace the inline block in skills/design-system/SKILL.md with citation.
      - Preserve invocation flow and gate-check (depends on brand-system.yaml existing).
    agent: developer
    depends_on: [research]

  - id: test
    description: |
      1. Run /design-system on a test project with .pHive/brand/brand-system.yaml present; verify W3C JSON tokens produced.
      2. Verify HTML preview of tokens unchanged.
      3. wc -l skills/design-system/SKILL.md before/after.
    agent: tester
    depends_on: [implement]

  - id: review
    description: Verify spec byte-equivalence; verify gate-check still works.
    agent: reviewer
    depends_on: [test]

  - id: integrate
    description: 'Commit on feat/structural-refactor-and-gate-lift; commit message format `feat(structural): extract design-system W3C spec to references (story a-09-design-system-extract-config, W6)`.'
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  tech_stack:
    languages: [markdown, yaml, json]
    frameworks: [hive-orchestrator, w3c-design-tokens]
  key_files:
    - path: skills/design-system/SKILL.md
      purpose: Source — inline W3C token spec extracted
    - path: hive/references/design-token-spec.{md|yaml}
      purpose: NEW — destination W3C token spec
    - path: skills/brand-system/SKILL.md
      purpose: Upstream producer of brand-system.yaml — design-system gate-checks for it; unchanged

design_decisions:
  - decision: Independent of a-08 (parallel-safe)
    rationale: Different skill, different schema; no shared file edits.

risks:
  - severity: low
    description: Spec format (markdown vs YAML) needs to match downstream JSON token consumer.
    mitigation: Research step verifies format; implement step matches.

references:
  - path: .pHive/epics/hive-composability-audit/docs/recommendation.md
    relevant_excerpt: |
      A-09: Move design-system W3C token spec inline to references.
      Sibling shape to A-08. Same reference pattern, different skill.
  - path: skills/design-system/SKILL.md
    relevant_excerpt: |
