      single biggest reusable block — any spawn pathway needs Prior Knowledge
      injection. Backend dispatch decoupling enables /plan Phase 0 routing
      (a-04) to invoke the same dispatch logic.
  - path: skills/hive/skills/agent-spawn/SKILL.md
    relevant_excerpt: |
      Section 5 (lines 67-132): Load agent memories (wiki-first retrieval)
        5a: L3 availability check
        5b: Wiki-based retrieval (L1)
        5c-L3: ChromaDB query + agent isolation + override/pitfall pinning
        5c: L0/L1 fallback (memory dir scan + relevance + 5-cap)
        5d: Staleness + override surfacing
        5e: KG Decision Context (L2)
      Section 7.0: Resolve backend (explicit override > agent_backends > default)
  - path: .pHive/epics/structural-refactor-and-gate-lift/stories/a-04-plan-skill-split-routing.yaml
