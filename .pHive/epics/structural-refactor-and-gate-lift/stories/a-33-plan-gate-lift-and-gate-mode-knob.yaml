id: a-33-plan-gate-lift-and-gate-mode-knob
epic: structural-refactor-and-gate-lift
title: Lift /plan hard-gate to warning under paths.gate_mode default warning
status: pending
complexity: medium
methodology: classic
depends_on: [a-04-plan-skill-split-routing, a-32-plan-methodology-auto-detect]
wave: W6
action_id: A-33

description: |
  Today /plan kickoff gate hard-blocks if .pHive/project-profile.yaml is
  missing or has empty tech_stack. Per D4 Position A (2026-05-08), this
  is anti-composable-substrate behavior — a fresh repo can't run /plan
  without first running /kickoff.

  Pattern precedent: Epic A W1 (commit 08b472d) lifted kickoff-gate to
  warning on 5 read-only skills (status, review, test, standup, ...).
  This story extends that pattern to /plan, gated by a new config knob.

  Add paths.gate_mode: warning|hard config knob (default warning for 2.0).
  When warning:
    - /plan still emits the gate message but proceeds with sane defaults
    - Sane defaults: methodology=auto-detect (a-32), epic_id from $ARGUMENTS or generated, project-profile filled with placeholder + warn
  When hard: original behavior preserved.

  This story is the /plan side of gate-lift. /execute side is a-35.

acceptance_criteria:
  - "paths.gate_mode: warning|hard added to hive.config.yaml schema with default warning"
  - "skills/plan/SKILL.md kickoff gate honors gate_mode: warning → warn + proceed; hard → block"
  - "Warning message clearly states: missing project-profile.yaml, sane defaults applied, override paths"
  - "Sane defaults under warning mode: methodology=auto-detect via a-32; project-profile placeholder generated and saved if absent"
  - "Hard mode preserves original behavior byte-equivalent"
  - "Telemetry event emitted when gate_mode=warning fires (feeds a-36 audit)"
  - "Pattern aligned with Epic A W1 warning-lift on read-only skills (kickoff-gate semantics consistent across skills)"
  - "/plan runs on a fresh repo (no .pHive/project-profile.yaml) under default config → produces a working epic without manual kickoff"

steps:
  - id: research
    description: |
      1. Read commit 08b472d (Epic A W1) to see the precedent warning-lift pattern.
      2. Read hive/references/skill-prelude.md to see the canonical kickoff-gate logic (since A-25 extracted it).
      3. Read skills/plan/SKILL.md kickoff gate section.
      4. Sketch paths.gate_mode schema + default precedence.
      5. Decide: gate_mode lives in skill-prelude.md (affects all skills citing it) OR per-skill override (only /plan + /execute). Default: per-skill override for now; full lift across all skills is a later story.
    agent: researcher

  - id: implement
    description: |
      - Add paths.gate_mode field to hive/hive.config.yaml schema + root hive.config.yaml example (default warning).
      - Update skills/plan/SKILL.md kickoff gate to read gate_mode and branch:
        - warning: emit message, generate placeholder project-profile.yaml if absent, proceed with auto-detected methodology
        - hard: original block behavior
      - Sane defaults under warning:
        - project-profile.yaml: write placeholder with tech_stack: [] + warn that profile is incomplete
        - methodology: invoke a-32 auto-detect
      - Add telemetry hook emitting gate_lift_fired event with source + decision.
      - Update hive/references/skill-prelude.md to reference gate_mode IF research chose that path.
    agent: developer
    depends_on: [research]

  - id: test
    description: |
      1. Run /plan on fresh repo with no .pHive/ at all under default config → verify warning emitted, placeholder profile written, planning proceeds.
      2. Run /plan with explicit paths.gate_mode: hard → verify original block behavior.
      3. Run /plan with paths.gate_mode: hard on populated profile → verify normal flow.
      4. Verify placeholder project-profile.yaml is structurally valid (tech_stack key exists, even if empty).
      5. Verify telemetry event emits gate_lift_fired with source=warning + decision=proceed.
      6. Run /plan on fresh repo + verify a-32 methodology auto-detect cooperates correctly.
    agent: tester
    depends_on: [implement]

  - id: review
    description: |
      1. Confirm paths.gate_mode default is warning for 2.0.
      2. Verify the warning message is loud and self-explanatory.
      3. Verify hard mode is byte-equivalent to current behavior.
      4. Verify alignment with Epic A W1 warning-lift pattern.
    agent: reviewer
    depends_on: [test]

  - id: integrate
    description: 'Commit on feat/structural-refactor-and-gate-lift; commit message format `feat(gate-lift): /plan kickoff-gate lift + gate_mode knob (story a-33-plan-gate-lift-and-gate-mode-knob, W6)`.'
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  tech_stack:
    languages: [markdown, yaml]
    frameworks: [hive-orchestrator]
  key_files:
    - path: skills/plan/SKILL.md
      purpose: Source — kickoff gate updated to honor gate_mode
    - path: hive/references/skill-prelude.md
      purpose: Canonical kickoff-gate logic (since A-25 extracted); may also need gate_mode awareness
    - path: hive/hive.config.yaml
      purpose: Schema — add paths.gate_mode default warning
    - path: hive.config.yaml
      purpose: Root config — example with gate_mode documented

design_decisions:
  - decision: Default warning for 2.0 release; telemetry-watch over one cycle; flip to hard if miscoordination shows up
    rationale: Per recommendation §2.6 risk mitigation — empirical-data-driven default flip.
  - decision: Per-skill override for now (just /plan + /execute via a-35)
    rationale: Full lift across all read-only skills was W1 in Epic A. /plan + /execute are the procedural skills, treated separately because they have more state to invent under warning mode.
  - decision: Sane-default project-profile placeholder written to disk
    rationale: Future invocations see the placeholder + know to fill it; vs ephemeral in-memory placeholder that re-warns every run.

cross_cutting:
  - concern: backward-compatibility
    action: "Hard mode preserves original behavior for users who set gate_mode: hard."
  - concern: observability
    action: "gate_lift_fired telemetry event feeds a-36 audit; aggregate rate flips default if too high."

risks:
  - severity: high
    description: Lifting /plan gate could mask genuine config errors (e.g., user invoked /plan in wrong directory).
    mitigation: 'Warning is loud; A-36 audit catches nonsensical defaults; paths.gate_mode: hard available for cautious users.'
  - severity: medium
    description: Placeholder project-profile.yaml could be mistaken for real config and not filled in.
    mitigation: 'Placeholder includes prominent warning + tech_stack: [] (obvious empty); kickoff skill upgrades placeholder to full profile.'
  - severity: medium
    description: gate_mode default flip later (warning → hard) would surprise consumers.
    mitigation: Treat as MAJOR version bump if flipping; A-36 telemetry justifies the flip with data.

references:
  - path: .pHive/epics/hive-composability-audit/docs/recommendation.md
    relevant_excerpt: |
      §2.6 D4 Position A fold-in: lift /plan + /execute hard-gates to
      warnings via paths.gate_mode knob. Default warning for 2.0,
      telemetry-validate over one release cycle, flip to hard if
      miscoordination at scale.
  - path: skills/plan/SKILL.md
    relevant_excerpt: |
      Kickoff Gate (currently): hard-blocks if .pHive/project-profile.yaml
      is missing or has empty tech_stack. Displays a message + stops.
  - path: hive/references/skill-prelude.md
    relevant_excerpt: |
      Canonical kickoff-gate logic extracted by A-25. Affects all 12 skills
      that cite the prelude. Gate_mode awareness here would lift gates
      across all skills; per-skill override is the conservative path for 2.0.
