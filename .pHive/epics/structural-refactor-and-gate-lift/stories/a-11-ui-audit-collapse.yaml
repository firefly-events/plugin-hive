id: a-11-ui-audit-collapse
epic: structural-refactor-and-gate-lift
title: Collapse ui-audit into design-review with --artifact-target flag
status: pending
complexity: medium
methodology: classic
depends_on: []
wave: W6
action_id: A-11

description: |
  skills/ui-audit/SKILL.md (185 lines) and skills/design-review/SKILL.md
  (136 lines) overlap substantially:
    - Both load accessibility-specialist + animations-specialist personas
    - Both run multi-step audit/review with the ui-designer synthesizing
    - Both produce a structured verdict + write a record

  Difference is artifact target:
    - ui-audit: targets implementation artifacts (running code, screens, components)
    - design-review: targets design artifacts (briefs, wireframes, brand system)

  Recommendation §2 D2 partial resolution: collapse ui-audit into
  design-review with an `--artifact-target {design|implementation}` flag.
  One skill, two artifact modes, shared specialist loadout.

  Outcome:
    - skills/ui-audit/SKILL.md DELETED
    - skills/design-review/SKILL.md grows to ~180 lines with new flag + branching for artifact-target
    - References to ui-audit elsewhere (plugin.json marketplace entry, README, hive/GUIDE.md) updated

  Note: brand-system + design-system + polish-audit + visual-qa stay as
  separate skills for now. Full UI-cluster consolidation is Epic F
  (post-2.0).

acceptance_criteria:
  - "skills/ui-audit/SKILL.md removed"
  - "skills/design-review/SKILL.md accepts --artifact-target {design|implementation} flag (default: design)"
  - "When --artifact-target=implementation, design-review runs the audit-mode workflow (gate on .pHive/project-profile.yaml, target implementation)"
  - "When --artifact-target=design, design-review runs current behavior (gate on design briefs OR brand system, target design artifacts)"
  - "All existing ui-audit invocations (in docs, in plugin.json marketplace, in tests) are migrated to design-review --artifact-target implementation"
  - "Specialist loadout preserved: accessibility-specialist + animations-specialist + ui-designer synthesizer in both modes"
  - "Verdict format unified across both modes"
  - "Record write path: .pHive/audits/{ui-audit|design-review}/latest.yaml — naming retained per artifact-target"
  - "Net delta: -185 lines (ui-audit deleted) + ~+45 lines (design-review grown) = ≥-140 lines net"

steps:
  - id: research
    description: |
      1. Read skills/ui-audit/SKILL.md and skills/design-review/SKILL.md in full side-by-side.
      2. Identify the overlapping logic (specialist loadout, multi-step audit flow, verdict format) and the divergent logic (gate check, artifact discovery, record path).
      3. Grep for all references to ui-audit: plugin.json, README.md, hive/GUIDE.md, hive/workflows/*.yaml, docs/, .pHive/.
      4. Sketch the merged skill: shared body + flag-branched gates and discovery.
    agent: researcher

  - id: implement
    description: |
      - Grow skills/design-review/SKILL.md:
        - Add --artifact-target {design|implementation} flag parsing (default: design).
        - Add flag-branched gate check (project-profile.yaml for implementation; design briefs OR brand system for design).
        - Add flag-branched artifact discovery + write path.
        - Keep specialist loadout + multi-step audit flow shared.
        - Keep verdict format shared.
      - Delete skills/ui-audit/SKILL.md.
      - Update plugin.json marketplace entries to remove ui-audit OR redirect to design-review --artifact-target implementation.
      - Update README + hive/GUIDE.md references.
      - Update any /hive:ui-audit alias to expand to /hive:design-review --artifact-target implementation.
    agent: developer
    depends_on: [research]

  - id: test
    description: |
      1. Run /design-review --artifact-target=implementation on a test project; verify implementation-audit behavior (specialists run on running artifacts, record at .pHive/audits/ui-audit/latest.yaml).
      2. Run /design-review --artifact-target=design (or default); verify existing design-review behavior unchanged.
      3. Run /design-review --artifact-target=design with no design briefs AND no brand system; verify gate-check fails appropriately.
      4. Verify all references to ui-audit in repo are migrated (grep -r ui-audit; expect only legacy notes or migration breadcrumbs).
    agent: tester
    depends_on: [implement]

  - id: review
    description: |
      1. Verify both artifact-target modes produce equivalent specialist outputs.
      2. Verify verdict format unification.
      3. Verify no orphaned ui-audit references remain.
      4. Spot-check the verdict structure of both modes — should differ only by artifact-target metadata, not by structure.
    agent: reviewer
    depends_on: [test]

  - id: integrate
    description: Commit on feat/structural-refactor-and-gate-lift; commit message format `feat(structural): collapse ui-audit into design-review (story a-11-ui-audit-collapse, W6)`.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  tech_stack:
    languages: [markdown, yaml, json]
    frameworks: [hive-orchestrator, claude-code-plugin-system]
  key_files:
    - path: skills/ui-audit/SKILL.md
      purpose: DELETED — logic merged into design-review
    - path: skills/design-review/SKILL.md
      purpose: Destination — grows to accept --artifact-target flag
    - path: plugin.json
      purpose: Marketplace entry — remove ui-audit or alias to design-review
    - path: hive/agents/accessibility-specialist.md
      purpose: Specialist persona — shared by both modes
    - path: hive/agents/animations-specialist.md
      purpose: Specialist persona — shared by both modes
    - path: hive/agents/ui-designer.md
      purpose: Synthesizer — shared by both modes

design_decisions:
  - decision: Single skill with mode flag, not two skills citing a shared reference
    rationale: ui-audit and design-review have ~75% overlapping body. Citation-only refactor would leave duplicate bodies. Collapse is more aggressive deletion.
  - decision: Keep separate record paths (.pHive/audits/ui-audit/ vs .pHive/audits/design-review/)
    rationale: Record paths are operator-visible historical state; renaming would break dashboards/notebooks already pointing at the paths. Mode-driven path selection inside the collapsed skill.
  - decision: Polish-audit, visual-qa, brand-system, design-system stay separate
    rationale: Full UI cluster consolidation is Epic F post-2.0; this story only collapses the closest pair.

cross_cutting:
  - concern: backward-compatibility
    action: "Any caller still using /hive:ui-audit must continue to work — alias to /hive:design-review --artifact-target implementation."
  - concern: documentation
    action: "Update README + GUIDE.md + plugin.json to reflect the collapse; preserve a migration breadcrumb in CHANGELOG."

risks:
  - severity: medium
    description: ui-audit record consumers (e.g., other workflows) may key off the skill name or record path; collapsing breaks them.
    mitigation: Preserve record path under .pHive/audits/ui-audit/ when --artifact-target=implementation; preserve /hive:ui-audit alias.
  - severity: low
    description: Gate-check unification could regress one mode's gate.
    mitigation: Flag-branched gates (project-profile for implementation, design briefs OR brand for design) — explicit branch, no merge.

