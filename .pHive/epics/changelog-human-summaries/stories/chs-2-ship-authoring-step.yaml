id: chs-2-ship-authoring-step
epic: changelog-human-summaries
title: /ship authors the prose changelog entry (draft → operator review → write)
status: blocked
complexity: medium
methodology: classic
depends_on: [chs-1-changelog-entry-format-ref]
tracker_id: plugin-hive/PLU-337
tracker_url: http://localhost:3000/plugin-hive/issues/337

description: |
  Add a changelog-authoring step to `skills/ship/SKILL.md`. User decision
  (2026-06-12 design gate): the authoring callsite is /ship — not /execute
  step 7e, whose template line has never appeared in committed CHANGELOG
  history (researcher-verified ghost).

  Placement: after /ship's story reconcile (the shipped-story set is known)
  and BEFORE the existing version-bump verification step (which reads the
  `## [Unreleased]` entry — the entry must exist by then).

  Step behavior:
  1. Build the draft entry from the reconciled shipped-story set per
     `hive/references/changelog-entry-format.md` (cite the doc; do NOT inline
     format rules): tagline + prose bullets via the source chain
     `outcome ?? first sentence of description ?? title + acceptance_criteria`,
     PR refs as suffixes, degraded-source bullets marked per the doc.
  2. Present the draft to the operator for approve/edit. THIS REVIEW IS THE
     QUALITY GATE (user decision: folded into authoring — no separate check
     step). The operator may edit freely; degraded-source markers are stripped
     on approval.
  3. Write the approved entry under `## [Unreleased]` in CHANGELOG.md
     (append-only convention: never touch prior released entries).
  4. If `## [Unreleased]` already contains a hand-written prose entry for the
     epic, present it alongside the draft and let the operator keep/merge —
     do not blindly overwrite manual work.

  Also reconcile surrounding prose:
  - Adjust the existing version verification step's wording so it accounts for
    the entry being authored in-flow by the new step (verification no longer
    assumes the entry pre-exists /ship).
  - Verify the step does not contradict skills/execute/SKILL.md step 7e: 7e
    keeps version accounting only; /ship owns prose. Add a one-line
    cross-reference in 7e only if its current wording claims prose ownership.
  - Confirm the reconciled shipped-story data consumed by step 1 is the same
    set release_post.mjs receives later in /ship (constraint from design §5:
    shippedStories data source must be verified reachable at this callsite).

acceptance_criteria:
  - "Given /ship runs against a ship set, when the authoring step fires, then a draft Unreleased entry (tagline + prose bullets, PR refs as suffixes, degraded markers) is presented to the operator before the version verification step runs"
  - "Given the operator approves or edits the draft, when the step completes, then the approved entry exists under ## [Unreleased] in CHANGELOG.md and degraded-source markers are stripped"
  - "Given a hand-written Unreleased entry already exists for the epic, when the step fires, then the operator chooses keep/merge — the manual entry is never silently overwritten"
  - "Given the new step, then all format rules are cited from hive/references/changelog-entry-format.md with zero inline duplication, and the version verification step's wording accounts for in-flow authoring"
  - "Given skills/execute/SKILL.md step 7e, then its prose does not contradict /ship prose ownership (version accounting stays in 7e)"

steps:
  - id: research
    description: Map /ship's step sequence around reconcile and version verification; confirm where the reconciled shipped-story set is available; check step 7e wording for prose-ownership claims
    agent: researcher
  - id: implement
    description: Write the authoring step into skills/ship/SKILL.md at the placement the research confirmed; adjust verification wording; reconcile 7e if needed
    agent: developer
    depends_on: [research]
  - id: test
    description: Walk a dry-run /ship trace against a sample epic — verify step ordering, draft shape vs format doc, operator-review gate presence, append-only safety
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review for single-source compliance (no inlined format rules), gate-fold correctness (operator review is the only quality gate), and no contradiction with execute 7e
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  tech_stack:
    type: Claude Code plugin (markdown skill prose)
  key_files:
    - path: skills/ship/SKILL.md
      purpose: The file gaining the authoring step; existing step 3 verification (~L141-145) must be re-worded for in-flow authoring
    - path: hive/references/changelog-entry-format.md
      purpose: Mandatory single-source format spec created by chs-1 — the step cites it
    - path: hive/lib/release_post.mjs
      purpose: Receives the same shipped-story set later in /ship; the authoring step's data input must be verified identical
    - path: skills/execute/SKILL.md
      purpose: Step 7e (L342-384) keeps version accounting; check for prose-ownership contradictions

files_to_modify:
  - file: skills/ship/SKILL.md
    change: add authoring step; re-word version verification step
  - file: skills/execute/SKILL.md
    change: only if step 7e wording claims prose ownership — one-line cross-reference fix

code_examples:
  - title: Existing /ship verification the new step must precede (skills/ship/SKILL.md)
    file: skills/ship/SKILL.md
    snippet: |
      4. Verify `CHANGELOG.md` contains an `## [Unreleased]` entry for the epic that
      names the planned bump level.

      If the version sources are lockstep and the changelog contains the epic bump
      entry, report the verified version and continue.

design_decisions:
  - decision: Authoring callsite is /ship, not /execute step 7e
    rationale: "User decision at design gate (2026-06-12); 7e template line never appeared in committed CHANGELOG history (confirmed ghost) — all good entries were authored at release time, which is /ship's moment"
  - decision: Operator review of the draft IS the quality gate (no separate check step)
    rationale: "User decision: fold gate into authoring; a standalone advisory check would be redundant with inline review"
  - decision: Never block, never hallucinate — degradation chain with visible markers
    rationale: "outcome: fields absent in all sampled story YAMLs (researcher-verified); thin-data bullets must be visible to the operator, not invented"

cross_cutting:
  - concern: documentation
    action: "Operations-guide + README description of the new /ship flow is chs-3 (hard dependency); this story links the format doc from skills/ship/SKILL.md"
  - concern: versioning
    action: "Epic ships with version_bump: none (user decision — no release planned); the new authoring step itself adds the epic's Unreleased entry when the NEXT release ships. Dogfood: this epic's own Unreleased entry should follow the new format"

metric:
  applies: true
  name: changelog.prose_compliant_release_entries
  direction: up
  unit: releases
  baseline: 0
  target: 1
  window: first versioned release shipped after epic close
  source:
    kind: manual
    ref: "Operator inspects the new release's CHANGELOG.md entry against hive/references/changelog-entry-format.md quality criteria (tagline present; prose sentence per major change; no PR-number-only bullets)"
  verify_at: first-versioned-ship-after-epic-close
  owner: reviewer

risks:
  - severity: medium
    description: Agent-drafted prose may be bland or inaccurate even with the source chain
    mitigation: Operator approve/edit gate before write; degraded-source markers show which bullets came from thin data
  - severity: low
    description: Reconciled story set at the authoring step differs from what release_post.mjs sees
    mitigation: Research step verifies the data source before implement; constraint carried from design §5

references:
  - path: .pHive/epics/changelog-human-summaries/docs/reviews/tpm-review.md
    relevant_excerpt: |
      Position on H1: adopt the release_post.mjs fallback chain as the spec; never
      block, never hallucinate. outcome absent is the CURRENT NORMAL case. Mark the
      entry as degraded-source so the operator review knows which bullets were
      synthesized from thin data.
  - path: .pHive/epics/changelog-human-summaries/docs/reviews/researcher-review.md
    relevant_excerpt: |
      The string "release finalization" has never appeared in any committed
      CHANGELOG.md entry in the repository's full history. Step 7e's template line
      is a confirmed ghost. All CHANGELOG entries are manually authored.
