name: changelog-human-summaries
title: Human-readable changelog entries
description: >
  CHANGELOG.md entries must tell a human reader what changed and why — not
  reference PR numbers as content. /ship gains an authoring step (draft from
  shipped stories → operator approve/edit → write under Unreleased), governed
  by a mandatory single-source format reference; user docs updated; the 2.11.0
  entry rewritten as the in-file exemplar (one-time append-only exception,
  user-authorized 2026-06-12).
target_codebase: /Users/don/Documents/plugin-hive
methodology: classic
version_bump: none

git_flow:
  base_branch: develop
  branch_strategy: per-epic

stories:
  - id: chs-1-changelog-entry-format-ref
    title: Create changelog-entry-format reference doc (mandatory single source)
    complexity: low
    depends_on: []
  - id: chs-2-ship-authoring-step
    title: /ship authors the prose changelog entry (draft → operator review → write)
    complexity: medium
    depends_on: [chs-1-changelog-entry-format-ref]
  - id: chs-3-release-flow-docs
    title: Document the new changelog flow in operations-guide and README
    complexity: low
    depends_on: [chs-2-ship-authoring-step]
  - id: chs-4-rewrite-2-11-0-exemplar
    title: Rewrite the 2.11.0 entry as the in-file format exemplar
    complexity: low
    depends_on: [chs-1-changelog-entry-format-ref]
