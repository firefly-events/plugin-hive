name: sandcastle-gh-issue-dispatch
tracker_id: "156"
tracker_url: "https://github.com/firefly-events/plugin-hive/issues/156"
title: Event-driven Hive dispatch from GitHub `hive:ready` label
description: |
  Replace cron-based GitHub-issue polling with event-driven dispatch.
  When a maintainer labels an issue `hive:ready` (existing canonical
  label), a GitHub Actions workflow fires immediately, runs `/hive:execute`
  inside a Sandcastle container, commits to `agent/issue-<n>`, opens a PR,
  and transitions the label through the existing state machine
  (`ready` → `in-flight` → `shipped` | `failed`). Workflow YAML owns
  label transitions (atomic with the GH job lifecycle).

  Ships as a Hive scaffold skill (`/hive:sandcastle-gh-init`) that drops
  `.github/workflows/hive-dispatch.yml` + `.github/scripts/sandcastle-hive-bridge.mts`
  into consumer repos. `.sandcastle/` stays sandcastle's domain — managed
  files live under `.github/` and `.hive-dispatch/`.

  **Plan and execute remain separate** — the human plans via `/hive:plan`
  locally, reviews, then labels `hive:ready` to trigger autonomous
  execution. No auto-flow plan→execute.

  **Sandcastle init is a prerequisite, NOT wrapped.** The user runs
  `npx sandcastle init` themselves first to choose provider/template/backlog.
  Skill fails fast if `.sandcastle/Dockerfile` is absent.

  **Inner Hive runs in `team` mode** (not `sandcastle`) — outer sandcastle
  is the isolation boundary, no nested containers, no DinD.

  End state: a user who has already run `npx sandcastle init` and labels
  an issue `hive:ready` gets a PR + `hive:shipped` label within ~30
  minutes (target).
target_codebase: /Users/don/Documents/plugin-hive-ui-f
