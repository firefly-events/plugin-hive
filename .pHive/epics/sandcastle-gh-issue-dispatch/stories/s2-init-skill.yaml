id: s2-init-skill
epic: sandcastle-gh-issue-dispatch
tracker_id: "158"
tracker_url: "https://github.com/firefly-events/plugin-hive/issues/158"
title: Build the /hive:sandcastle-gh-init scaffolding skill
status: pending
complexity: low
methodology: classic
depends_on: [s1-workflow-template]

description: |
  Author a new public Hive skill that layers GH-event-trigger glue on top
  of an already-initialized Sandcastle setup. Sandcastle init is OUT OF
  SCOPE — users run `npx sandcastle init` themselves first to choose
  provider (Docker/Podman/Vercel), template, and backlog manager.

  This skill does exactly four things:

    1. Prereq-checks `.sandcastle/Dockerfile` exists (proxy for
       "sandcastle init has run"). Fails fast with remediation message
       if absent. Zero files written before this check passes.
    2. Renders `assets/hive-dispatch.yml.tpl` (from s1-workflow-template)
       into `.github/workflows/hive-dispatch.yml` with chosen args
       substituted (runner, secret mode).
    3. Renders `assets/sandcastle-hive-bridge.mts.tpl` into
       `.github/scripts/sandcastle-hive-bridge.mts`.
    4. Writes `.hive-dispatch/manifest.yaml` recording: sandcastle
       version pin (read from consumer's package.json), scaffold
       timestamp, chosen args, list of managed files for idempotent
       re-runs.

  The skill DOES NOT create the trigger label — `hive:ready` /
  `hive:in-flight` / `hive:shipped` / `hive:failed` are existing
  canonical labels on firefly-events/plugin-hive. The skill verifies
  their presence and emits a warning + remediation if any are missing
  (consumer can create them via `gh label create` themselves).

  Skill lives at `skills/hive/skills/sandcastle-gh-init/SKILL.md` and
  is invocable as `/hive:sandcastle-gh-init [--runner ubuntu-latest|self-hosted]
  [--secret-mode anthropic|openai]`. No `--label` arg, no `--template`
  arg — both choices belong upstream (label = Hive convention,
  template = sandcastle init).

acceptance_criteria:
  - "Given a repo with NO `.sandcastle/Dockerfile` present, when `/hive:sandcastle-gh-init` runs, then it exits non-zero with remediation message naming `npx sandcastle init` as the missing prereq and writes ZERO files."
  - "Given a repo with `.sandcastle/Dockerfile` present, when `/hive:sandcastle-gh-init` runs with defaults, then `.github/workflows/hive-dispatch.yml`, `.github/scripts/sandcastle-hive-bridge.mts`, and `.hive-dispatch/manifest.yaml` all exist after the run."
  - "Given a repo where `.hive-dispatch/manifest.yaml` already exists from a prior run, when the skill re-runs with the same args, then only files listed in `manifest.managed_files` are rewritten; user-owned files (anything in `.sandcastle/`, anything outside `manifest.managed_files`) are never touched."
  - "Given the skill runs with `--secret-mode openai`, when the workflow file is written, then the env block in `.github/workflows/hive-dispatch.yml` references `OPENAI_API_KEY` not `ANTHROPIC_API_KEY`."
  - "Given the repo is missing any of the four canonical labels (`hive:ready`, `hive:in-flight`, `hive:shipped`, `hive:failed`), when the skill runs, then it warns (does NOT block) and prints `gh label create` commands the user can copy-paste to remediate."
  - "Given the user lacks `gh` CLI or is not authenticated, when the skill runs, then it fails fast with a clear error before any writes."
  - "Given the skill writes files, when files are written, then a single git commit is created on the current branch with message `chore(hive): wire github-issue dispatch via sandcastle` listing every created file."

steps:
  - id: research
    description: |
      Inventory existing public skills (skills/kickoff, skills/hive/skills/register-project)
      for: (a) skill YAML frontmatter conventions, (b) arg-parsing patterns
      Hive uses for slash-command args, (c) error-handling/exit conventions.
      Verify the canonical label names from `gh label list` on
      firefly-events/plugin-hive (already confirmed `hive:ready`,
      `hive:in-flight`, `hive:shipped`, `hive:failed` exist).
    agent: researcher
  - id: implement
    description: |
      Build skill at `skills/hive/skills/sandcastle-gh-init/SKILL.md`
      with six-section structure: Purpose, Prereqs, Args, Process,
      Outputs, Failure modes. Process section drives a Node helper at
      `skills/hive/skills/sandcastle-gh-init/scaffold.mjs` that:

      - **Prereq check FIRST**: stat `.sandcastle/Dockerfile`. If absent,
        print remediation message and exit 2. Remediation text:
        `"Sandcastle is not initialized in this repo. Run 'npx sandcastle init',
        choose your provider/template/backlog, then re-run /hive:sandcastle-gh-init."`
      - Check `gh auth status`; fail with clear message if unauthenticated.
      - Verify the four canonical labels exist via `gh label list --json name`;
        warn (non-blocking) and print remediation `gh label create` commands
        for any missing.
      - Parse args (`--runner`, `--secret-mode`).
      - Stat `.hive-dispatch/manifest.yaml`. If present, treat as re-run:
        read `managed_files`, rewrite only those paths.
      - Read `assets/hive-dispatch.yml.tpl` (from s1), substitute
        placeholders, write to `.github/workflows/hive-dispatch.yml`.
      - Read `assets/sandcastle-hive-bridge.mts.tpl` (from s1), substitute
        placeholders, write to `.github/scripts/sandcastle-hive-bridge.mts`.
      - Read sandcastle version from consumer's
        `node_modules/@ai-hero/sandcastle/package.json` (fallback paths
        per risk: `npm ls --json --depth=0`).
      - Write `.hive-dispatch/manifest.yaml`.
      - `git add` the three files; commit with
        `git commit -m "chore(hive): wire github-issue dispatch via sandcastle"`.

      Use Node stdlib + `gh` CLI only. No new npm deps.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Fixture tests under `tests/sandcastle-gh-init/`:
      (a) missing-prereq → exit 2 + remediation message + ZERO files written
      (b) prereq-met fresh case → all 3 artifacts created + single commit
      (c) re-run idempotency → user-owned files (e.g., a custom .github/scripts/other.mjs)
          untouched; only `managed_files` rewritten
      (d) `--secret-mode openai` → workflow env block contains `OPENAI_API_KEY`
      (e) missing `gh` auth → fail fast before any writes
      (f) missing one canonical label → warn + remediation printed, files
          still written, exit 0
      (g) sandcastle pin extraction → manifest `sandcastle_pin` matches
          version from `node_modules/@ai-hero/sandcastle/package.json`

      Use tmp directories per fixture. Run via `bun test tests/sandcastle-gh-init/`.
    agent: tester
    depends_on: [implement]
  - id: review
    description: |
      Review: (a) idempotency logic — no double-writes; (b) no shell
      injection via unescaped args (`child_process.execFile` array-form
      for all `gh` + `git` invocations); (c) error messages name the
      missing prereq explicitly, not just "failed"; (d) commit message
      uses Conventional Commits; (e) skill frontmatter follows existing
      public-skill conventions; (f) missing-label path is a warning, not
      a hard block (consumers may add labels later).
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit to the epic branch.
    agent: developer
    depends_on: [review]

