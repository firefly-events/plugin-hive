design_decisions:
  - decision: Sandcastle init is a PREREQUISITE, not embedded
    rationale: Choosing provider/template/backlog is the user's decision and exposes the upstream sandcastle UX. Hive owns GH-trigger glue, sandcastle owns its own scaffold. Failing fast keeps the boundary clean.
  - decision: Managed files live in `.github/`, NOT `.sandcastle/`
    rationale: Cleaner ownership. `.sandcastle/` stays sandcastle's domain forever; consumer can re-run `sandcastle init` without colliding with Hive's files. `.github/scripts/` is the conventional location for workflow-helper scripts anyway.
  - decision: Manifest at `.hive-dispatch/manifest.yaml`, not under `.sandcastle/` or `.hive/`
    rationale: Distinct top-level directory signals Hive-managed event-dispatch state. Avoids polluting either `.sandcastle/` (sandcastle's domain) or anything that might collide with future Hive state directories.
  - decision: No label creation by the skill
    rationale: Labels are the existing canonical convention (already on the repo). Creating them would risk overwriting maintainer-tuned colors/descriptions. Warn-only path lets consumers manage label lifecycle.
  - decision: Hardcoded `hive:ready` trigger label
    rationale: Same as s1 — the existing convention has a full state machine. No override flag.
  - decision: Two-file skill split (SKILL.md prose + scaffold.mjs logic)
    rationale: Matches `register-project` pattern. Markdown is the human-readable contract; .mjs is the imperative scaffolder.

cross_cutting:
  - concern: documentation
    action: "No README/runbook updates in this story — s3-docs-version-bump owns external docs. This story produces SKILL.md (the contract) but does not modify hive/references/ or top-level README."

metric:
  applies: false
  justification: "Scaffolding skill — success is one-shot file generation matching a snapshot test, not a continuous metric. Adoption-rate metrics (consumer repos with `.hive-dispatch/manifest.yaml` committed) live outside this repo and cannot be observed without telemetry the skill does not emit."

risks:
  - severity: medium
    description: Shell injection via unescaped args
    mitigation: All `gh` / `git` invocations use `child_process.execFile` array form. No `exec` with string interpolation. Tested in `review` step.
  - severity: medium
    description: User runs skill without prereq → confusing partial state
    mitigation: Prereq check is the FIRST operation; zero writes before stat passes. Remediation message names the exact command to run first.
  - severity: low
    description: Sandcastle version pin read from package.json may miss with pnpm/yarn workspace hoisting
    mitigation: Fallback path: try `npm ls @ai-hero/sandcastle --json --depth=0`. Final fallback: record `"unknown"` with a warning.
  - severity: low
    description: Re-run on a partially-scaffolded repo (no manifest but workflow file already exists from earlier hand-edit) silently overwrites user changes
    mitigation: When manifest is absent BUT any managed-file path already exists, refuse without `--force-recover` flag and print which file conflicts.

