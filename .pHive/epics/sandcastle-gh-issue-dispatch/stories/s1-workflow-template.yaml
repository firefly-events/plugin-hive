description: |
  Create the workflow template + bridge script that the upcoming
  `/hive:sandcastle-gh-init` skill will scaffold into consumer repos.
  Two files ship from this story as skill assets:

    1. `.github/workflows/hive-dispatch.yml` — event-driven trigger.
       Fires on `issues:[labeled]` filtered to `hive:ready`. Handles
       the existing label state machine (`hive:ready` → `hive:in-flight`
       → `hive:shipped` | `hive:failed`).

    2. `.github/scripts/sandcastle-hive-bridge.mts` — programmatic
       invocation of `@ai-hero/sandcastle`'s `run()` API. Builds a
       prompt that delegates to `/hive:execute` against the labeled
       issue. Sets `HIVE_EXECUTION_MODE=team` inside the sandcastle
       prompt context to prevent inner-sandcastle recursion (single
       isolation layer).

  No changes to `.sandcastle/main.mts` — that file stays sandcastle's
  domain. Hive ownership lives entirely under `.github/`.

  Trigger label `hive:ready` is the existing canonical convention
  (already deployed on firefly-events/plugin-hive labels). NOT
  created by this story or by s2 — labels already exist.

acceptance_criteria:
  - "Given an issue labeled `hive:ready` (and no other `hive:*` labels), when the workflow fires, then within 1 GitHub event-delivery tick (<60s typical) the workflow's first step swaps the label to `hive:in-flight`."
  - "Given the workflow's bridge step succeeds and commits exist on `agent/issue-<n>`, when the success step runs, then a PR is opened against the repo's default branch, the label transitions `hive:in-flight` → `hive:shipped`, and a comment links the PR on the source issue."
  - "Given the bridge step fails for any reason (Docker not available, ANTHROPIC_API_KEY missing, agent crash, timeout), when the failure step runs, then the label transitions `hive:in-flight` → `hive:failed` and a comment links the workflow run log."
  - "Given two `hive:ready` labels are applied to the same issue concurrently, when the second event arrives during the first run, then `concurrency.group` de-dupes to a single active job (no double-claim, no double-PR)."
  - "Given the workflow YAML is parsed by `actionlint`, when validation runs, then exit code is 0 (no syntax/schema errors)."
  - "Given the bridge script is type-checked with `tsc --noEmit`, when validation runs, then exit code is 0."
  - "Given the workflow + bridge files are checked against committed snapshots, when the snapshot test runs, then both files match byte-for-byte (regenerable via `--update`)."

steps:
  - id: research
    description: |
      Read upstream sandcastle README and `hive/lib/sandcastle-provider.js`
      to confirm the programmatic `sandcastle.run({...})` API surface
      (agent, sandbox, branchStrategy, prompt, maxIterations,
      idleTimeoutSeconds, signal). Confirm `ubuntu-latest` runner ships
      Docker preinstalled. Read `skills/hive/skills/execute-mode-sandcastle/SKILL.md`
      to confirm `HIVE_EXECUTION_MODE` env var semantics (override
      project-default mode). Verify `hive:ready`/`in-flight`/`shipped`/`failed`
      labels exist on firefly-events/plugin-hive (already confirmed via
      `gh label list` in design discussion).
    agent: researcher
  - id: implement
    description: |
      Author two skill assets at
      `skills/hive/skills/sandcastle-gh-init/assets/`:

      1. `hive-dispatch.yml.tpl` — workflow template with placeholders
         `{{RUNNER}}`, `{{SECRET_KEY}}` (`ANTHROPIC_API_KEY` default;
         `OPENAI_API_KEY` when `--secret-mode openai`). NO label
         placeholder — `hive:ready` is hardcoded since it's the canonical
         convention. Step structure:

         - claim:       swap `hive:ready` → `hive:in-flight`
         - setup-node + `npm ci`
         - bridge step (runs the .mts file) with success/failure split
         - success step: swap to `hive:shipped`, open PR, comment
         - failure step (`if: failure()`): swap to `hive:failed`, comment

      2. `sandcastle-hive-bridge.mts.tpl` — TypeScript that imports
         `run, claudeCode` from `@ai-hero/sandcastle` plus a sandbox
         factory, builds a prompt of the form `"Run /hive:execute on
         issue #${ISSUE_NUMBER}. Read the issue body via
         \`gh issue view ${ISSUE_NUMBER}\`. Commit to branch ${branch}."`
         and invokes `run({ agent, sandbox, branchStrategy, prompt, ... })`.
         Sets `HIVE_EXECUTION_MODE=team` in the env passed to the agent.

      Also commit a rendered example pair at
      `assets/hive-dispatch.example.yml` + `assets/sandcastle-hive-bridge.example.mts`
      that show default substitutions for snapshot testing.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      - Add `actionlint` validation to the rendered example workflow.
      - Add `tsc --noEmit` validation to the rendered example bridge.
      - Add a snapshot test that re-renders both templates with default
        args and diff-checks against the example files.
      - Author a synthetic event payload
        `.github/workflow-tests/hive-ready-labeled.json` and run via
        `act` if available, else manual-verify by labeling a smoke-test
        issue on the maintainer's repo.
      - Verify all 7 acceptance criteria against the rendered examples.
    agent: tester
    depends_on: [implement]
  - id: review
    description: |
      Review for:
      (a) no hardcoded secrets in either file
      (b) `permissions:` block is minimal (`contents: write`, `issues: write`,
          `pull-requests: write` only)
      (c) `if:` guard on `hive:ready` label name
      (d) `concurrency.group` is per-issue not per-workflow
      (e) `timeout-minutes` set on the job
      (f) Failure step uses `if: failure()` so the label transitions
          even when the bridge crashes
      (g) Bridge script handles missing `ANTHROPIC_API_KEY` with a
          clear error, not a silent failure
      (h) Bridge sets `HIVE_EXECUTION_MODE=team` (no nested sandcastle)
      (i) Use of `child_process.execFile`-style array args anywhere the
          bridge shells out (no shell injection via issue body)
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit to the epic branch.
    agent: developer
    depends_on: [review]

