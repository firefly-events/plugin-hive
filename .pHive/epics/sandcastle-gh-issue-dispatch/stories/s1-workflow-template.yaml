metric:
  applies: true
  name: hive.dispatch.label_to_pr_latency_seconds
  direction: down
  unit: seconds
  baseline: null
  target: 1800
  window: 30d-post-dogfood
  source:
    kind: manual
    ref: "Plugin-hive maintainer labels a smoke-test issue `hive:ready` and times to PR-open (label `hive:shipped` fires when PR opens). One sample per dogfood run; aggregate over 5 runs."
  verify_at: epic-close
  owner: tester
  justification: "Dispatch latency is the only direct success signal — if `hive:ready` does not lead to PR + `hive:shipped` within a bounded window, the trigger or the bridge is broken. Manual carrier is sufficient because sample count is bounded (≤5 across the dogfood period)."

risks:
  - severity: high
    description: Workflow runs without label filter — every `labeled` event fires it
    mitigation: Triple-guard — `on: issues:[labeled]` only (not `[opened,...]`), step-level `if: github.event.label.name == 'hive:ready'`, AND per-issue `concurrency.group`. Smoke test: label with a different `hive:*` label and verify no run.
  - severity: high
    description: Bridge crash leaves label stuck at `hive:in-flight`
    mitigation: Failure step uses `if: failure()` — fires even when the bridge step exits non-zero. Tested explicitly by intentionally failing the bridge (missing key, kill signal).
  - severity: high
    description: Public-repo abuse — anyone with triage perm can fire agent runs
    mitigation: Runbook (s3) documents that label permission must be locked to maintainers via repo settings. Future hardening (out of scope): `if: github.event.sender.permission == 'admin' || 'write'`.
  - severity: medium
    description: Inner Hive ignores `HIVE_EXECUTION_MODE=team` and spawns nested sandcastles
    mitigation: Bridge step sets the env var BEFORE invoking sandcastle.run(); the inner Hive (Claude Code in container) inherits it. Test in s1 by reading agent stdout for "execution mode" log line. If inner Hive doesn't honor the override, add explicit prompt-level instruction.
  - severity: medium
    description: Concurrent labels on same issue race-condition the state machine
    mitigation: `concurrency.group: hive-issue-${{ github.event.issue.number }}` queues second invocation behind first; `cancel-in-progress: false` preserves the in-flight run.

references:
  - path: .pHive/epics/sandcastle-gh-issue-dispatch/docs/design-discussion.md
    relevant_excerpt: |
      ### Label state machine (existing — keep as-is)
      `hive:ready` → trigger
      `hive:in-flight` → set by workflow on claim
      `hive:shipped` → set by workflow on success + PR open
      `hive:failed` → set by workflow on failure
      Workflow YAML owns transitions (not the inner Hive agent) — atomic with
      the job lifecycle, survives bridge crashes via `if: failure()`.
  - path: .pHive/epics/sandcastle-gh-issue-dispatch/docs/research-brief.md
    relevant_excerpt: |
      ### GitHub Actions `on: issues` filter pattern
      `if: github.event.label.name == 'hive:ready'` is the canonical
      step-level guard. Native event filtering does not support label-name
      matching, so the step `if:` is the chokepoint.
