code_examples:
  - title: Existing Hive execute-mode-sandcastle env-var contract
    file: skills/hive/skills/execute-mode-sandcastle/SKILL.md
    snippet: |
      # HIVE_EXECUTION_MODE override
      # Setting `HIVE_EXECUTION_MODE=team` at the sandcastle-prompt scope
      # overrides any project-level `execution.mode: sandcastle` default.
      # Prevents inner Hive from spawning more sandcastles (single isolation
      # layer — outer sandcastle is the boundary).

  - title: Sandcastle run() API shape used by the bridge
    file: skills/hive/skills/sandcastle-gh-init/assets/sandcastle-hive-bridge.mts.tpl
    snippet: |
      // Bridge prompt delegates to /hive:execute. Inside the sandbox,
      // Claude Code with Hive plugin loaded picks up the slash command.
      // Bridge does NOT itself invoke /hive:plan — planning is human-loop.
      await run({
        agent: claudeCode("claude-opus-4-7"),
        sandbox: docker(),
        branchStrategy: { type: "branch", branch: `agent/issue-${issueNumber}` },
        prompt: `Run /hive:execute on issue #${issueNumber}. Read issue body via gh issue view. Commit to branch agent/issue-${issueNumber}.`,
        maxIterations: 5,
        idleTimeoutSeconds: 600,
      });

design_decisions:
  - decision: Two files, not one — workflow YAML + .mts bridge
    rationale: YAML is GH-native, bridge is sandcastle-native. Splitting keeps each file legible in its own domain. YAML stays minimal (no inline JS-via-shell); .mts gets typecheck coverage.
  - decision: Bridge lives in `.github/scripts/`, NOT `.sandcastle/`
    rationale: `.sandcastle/` is sandcastle init's domain. Hive-owned files going there would collide and confuse ownership. `.github/scripts/` is workflow-adjacent and clearly Hive-managed.
  - decision: Hardcode `hive:ready` (no `--label` arg)
    rationale: `hive:ready` is the existing canonical convention with a full state machine (`in-flight`/`shipped`/`failed`). Allowing label override would fragment the convention and break the state machine. If consumers need a different label, that's a fork of the skill, not a config flag.
  - decision: Workflow YAML handles label state transitions, not the bridge
    rationale: Atomic with the GH job lifecycle. If the bridge crashes mid-run, the `if: failure()` step still fires and transitions `hive:in-flight` → `hive:failed`. Having the bridge handle this would lose the failure case when the bridge process itself dies.
  - decision: `HIVE_EXECUTION_MODE=team` (no nested sandcastle)
    rationale: Outer sandcastle is already the isolation boundary. Nesting requires DinD or sibling-container access — high complexity, low return. `team` mode runs parallel agents as subprocesses within the same container.
  - decision: PR creation `|| true` and conditional on remote branch existing
    rationale: Hive may complete /execute with zero commits (no actionable work, idle timeout). Pre-checking remote branch + soft-failing PR creation lets the label transition + comment still fire cleanly.

