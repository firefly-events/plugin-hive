    file: .pHive/cross-cutting-concerns.yaml
    snippet: |
      implementation_checklist:
        - ".claude-plugin/plugin.json version bumped per semver"
        - ".claude-plugin/marketplace.json version bumped to match plugin.json"
        - "README.md version badge updated to match plugin.json"
        - "CHANGELOG.md gains a new dated section for the new version ..."
        - "Bump commit is the LAST commit on the epic branch"
        - "If breaking change: migration notes added to CHANGELOG ..."

design_decisions:
  - decision: Minor (X.Y+1.0) bump, not patch
    rationale: New public skill = additive consumer-visible feature. Patch is reserved for bug fixes / doc-only. This is more than that.
  - decision: Single runbook in `hive/references/`, not split per topic
    rationale: One-stop reference for maintainers. Three numbered procedures fit comfortably in one file (~150 lines).
  - decision: No migration doc
    rationale: No breaking changes. Existing sandcastle execution paths (internal `/hive:execute-mode-sandcastle`) untouched.

cross_cutting:
  - concern: documentation
    action: "This story IS the docs story. Updates: README.md (Sandcastle section + version badge), hive/references/sandcastle-gh-dispatch.md (new runbook), CHANGELOG.md (new dated section). Skill SKILL.md was authored in s2; this story references it but does not modify it."
  - concern: versioning
    action: "Bump plugin.json + marketplace.json version (minor: X.Y+1.0). Update README badge. Add CHANGELOG dated section. THIS commit is the last on the epic branch."

metric:
  applies: false
  justification: "Doc + version-bump story — no observable runtime behavior change. The new skill's metric is tracked in s1-workflow-template (label-to-PR latency); this story only documents and versions that work, so it has no independent number to move."

risks:
  - severity: medium
    description: Version drift between plugin.json and marketplace.json
    mitigation: Test step asserts equality; review step re-checks. Add to test script for future-proofing.
  - severity: low
    description: README badge URL format changes upstream (shields.io)
    mitigation: Reuse existing badge URL pattern; only change the version segment.
  - severity: low
    description: CHANGELOG date format inconsistency
    mitigation: Match the most recent entry's format exactly; do not invent new conventions here.

