  - decision: "Keep `disciplined` in the hero tagline"
    rationale: "User decision Q3 locks KEEP because audit §5.5 keeps discipline and composability co-equal."
  - decision: "Do not edit CHANGELOG.md"
    rationale: "Historical 2.0.0 references are intentional evidence of the reframe decision path."

