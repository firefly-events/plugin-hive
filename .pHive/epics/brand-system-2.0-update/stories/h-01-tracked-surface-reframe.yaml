id: h-01-tracked-surface-reframe
epic: brand-system-2.0-update
title: "Reframe README.md hero tagline to composable-substrate framing"
status: pending
complexity: low
methodology: classic
depends_on: []
tier: 1

description: |
  Replace README.md:9 hero tagline, currently `A director's chair for the
  agentic SDLC — disciplined swarms, kickoff to ship.`, with the locked Q1
  wording:

  `Composable substrate for the agentic SDLC — user-directed, disciplined, kickoff to ship.`

  Spot-check the `## North Star` section around README.md:345 for coherence.
  Research says that section is already reframe-aligned, so do not rewrite it
  unless a direct contradiction surfaces during reviewer pass. Do not edit
  CHANGELOG.md; its 2.0.0 entry is intentional history.

acceptance_criteria:
  - "Given README.md:9 is the public hero tagline, when H-01 completes, then it reads exactly: `> **Composable substrate for the agentic SDLC — user-directed, disciplined, kickoff to ship.**`"
  - "Given README.md `## North Star` is already reframe-aligned, when the reviewer spot-checks it, then its body remains unchanged."
  - "Given old public hero framing must be removed, when running `grep -n \"director's chair\" README.md`, then the command returns zero matches."
  - "Given CHANGELOG.md records historical 2.0.0 context, when H-01 completes, then CHANGELOG.md has no edits."

steps:
  - id: research
    description: |
      Read README.md around line 9 and the `## North Star` section around
      line 345. Confirm README.md:9 still carries the old hero tagline and
      confirm the North Star body remains aligned with the composable-substrate
      reframe. Re-read the locked Q1 wording in
      .pHive/epics/brand-system-2.0-update/docs/user-decisions-b1.md before
      implementation.
    agent: researcher

  - id: implement
    description: |
      1. Replace only README.md:9 with:
         `> **Composable substrate for the agentic SDLC — user-directed, disciplined, kickoff to ship.**`
      2. Preserve the README.md `## North Star` body unchanged unless research
         found a direct contradiction requiring reviewer triage.
      3. Do not edit CHANGELOG.md or any brand-source artifacts in this story.
    agent: developer
    depends_on: [research]

  - id: test
    description: |
      Run acceptance grep gates:
        grep -n "director's chair" README.md
        rg "Composable substrate for the agentic SDLC — user-directed, disciplined, kickoff to ship." README.md
        git diff -- README.md CHANGELOG.md
      The old-framing grep returns zero matches; locked-tagline grep returns
      exactly one match at README.md:9; the diff shows only the README.md hero
      line changed and no CHANGELOG.md edits.
    agent: tester
    depends_on: [implement]

  - id: review
    description: |
      Verify the README.md:9 replacement matches locked Q1 wording exactly,
      including punctuation and the em dash. Verify the `## North Star` body
      is unchanged and still coherent with the reframe. Confirm CHANGELOG.md
      remains untouched because its director references are intentional
      historical record.
    agent: reviewer
    depends_on: [test]

  - id: integrate
    description: "Commit and push to feature branch (one commit per story per project memory feedback_git_flow_per_epic)."
    agent: developer
    depends_on: [review]

