id: s4-synthesis-recommendation
epic: hive-composability-audit
title: Joint TPM+architect structural recommendation — single gate-keeping doc
status: blocked
complexity: high
methodology: classic
depends_on: [s1-spike-sandcastle, s2-spike-atoshell, s3-spike-skills-lens]

description: |
  Synthesize all 3 spike outputs into a single structural recommendation document
  at .pHive/epics/hive-composability-audit/docs/recommendation.md. This is the
  gate-keeping artifact — no further CWC 2026 A-group work / skill catalog reshape /
  task_tracking adoption proceeds until this doc is signed off by user.

  Joint authorship: TPM owns delivery sequencing + risk; architect owns structural
  decisions + cross-tool synergy. Disagreement protocol per R5 — disagreements
  surface explicitly, not papered over. Mattpocock author bias dissent per R6 —
  cite counter-precedent (Archon NO-GO, internal feedback memos).

  Recommendation must end with concrete next-epic story IDs + dependencies (R7
  shelfware mitigation). Otherwise no sign-off.

  Output: ONE document. No execution stories spawned by this epic (Q7).

acceptance_criteria:
  - "recommendation.md exists at .pHive/epics/hive-composability-audit/docs/recommendation.md"
  - "Five required sections: (1) CWC 2026 A-group resume strategy, (2) skill catalog reshape plan, (3) task_tracking.adapter direction, (4) cross-tool synergy decisions (sandcastle-atoshell stack), (5) North-Star alignment statement"
  - "Section 1 produces ONE of: ADOPT-SANDCASTLE / PROCEED-AS-DESIGNED / HYBRID-WITH-CRITERIA — with concrete delta against CWC 2026 stories S4-S10"
  - "Section 2 produces numbered action list per skill (split / collapse / extract config / leave alone) — covering all 30+ skills audited in s3"
  - "Section 3 produces ONE of: ADOPT-ATOSHELL / VENDOR-ATOSHELL / WAIT-FOR-MATURITY / SKIP / ADOPT-OTHER — with adapter interface decision"
  - "Section 4 addresses sandcastle-atoshell synergy — fully-local stack ADOPT / PARTIAL / SKIP with North-Star alignment justification"
  - "Section 5 explicit statement on Hive's process-owning posture — RETAIN / REFINE / SHIFT — with cited counter-precedent per R6"
  - "Document ends with 'Next epics' section — concrete epic IDs + scope summary + dependency chain (R7 shelfware mitigation)"
  - "Disagreement protocol followed — TPM-architect disagreements surface explicitly, not papered over (R5)"

steps:
  - id: synthesis-prep
    description: |
      Read all 3 spike findings docs:
        - .pHive/spikes/sandcastle/findings.md
        - .pHive/spikes/atoshell/findings.md
        - .pHive/spikes/skills-lens/{catalog-matrix,borrows-scope,sidecar-edits,posture-check}.md
      Cross-reference all 7 risks from design-discussion. Identify which risks
      are realized in spike outputs vs mitigated.
    agent: tpm

  - id: tpm-draft
    description: |
      TPM drafts sections 1, 3, 4 — substrate strategy (CWC 2026 sequencing impact),
      tracker adapter direction (delivery feasibility), cross-tool synergy
      (delivery dependencies between sandcastle + atoshell adoption).
    agent: tpm
    depends_on: [synthesis-prep]

  - id: architect-draft
    description: |
      Architect drafts sections 2, 5 — skill catalog reshape (structural
      decisions per skill), North-Star posture statement (process-owning vs
      composable; cite counter-precedent per R6).
    agent: architect
    depends_on: [synthesis-prep]

  - id: joint-merge
    description: |
      TPM + architect merge their drafts. Disagreement protocol:
        - Document each disagreement in 'Open disagreements' subsection
        - For each: TPM position / architect position / orchestrator-tiebreak-or-user-decision marker
      No papering over. Reviewer enforces this in next step.
    agent: tpm
    depends_on: [tpm-draft, architect-draft]

  - id: next-epics
    description: |
      Joint section: list concrete next-epic IDs + scope summary + dependency
      chain. Required regardless of recommendation outcome — shelfware mitigation
      (R7). If recommendation = "do nothing", that's still an epic ID with
      "no-op + close audit" scope.
    agent: tpm
    depends_on: [joint-merge]

  - id: review
    description: |
      Reviewer (Opus 4.7) verifies:
        - All 5 sections present + populated
        - Section 1/3 produce one of allowed values (no waffling)
        - Section 5 has cited counter-precedent (R6)
        - Disagreement protocol followed (R5)
        - Next epics section non-empty (R7)
        - No sandcastle author-bias optimism (R6)
    agent: reviewer
    depends_on: [next-epics]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: .pHive/spikes/sandcastle/findings.md
      purpose: Substrate spike output (input to section 1)
    - path: .pHive/spikes/atoshell/findings.md
      purpose: Tracker spike output (input to section 3)
    - path: .pHive/spikes/skills-lens/
      purpose: Skills audit outputs (input to sections 2 + 5)
    - path: .pHive/epics/hive-composability-audit/docs/design-discussion.md
      purpose: Risk registry (R1-R7) for cross-check during synthesis

design_decisions:
  - decision: Joint TPM + architect authorship with explicit disagreement protocol
    rationale: User pick (Q3); R5 mitigation requires surfacing disagreements not papering over them
  - decision: Recommendation doc ONLY — no execution stories from this epic
    rationale: User pick (Q7); follow-on epics handle execution if recommended
  - decision: Next-epics section is acceptance criterion (not optional)
    rationale: R7 shelfware mitigation — recommendation without concrete next steps becomes shelf-ware
  - decision: Section 5 (North-Star posture) requires cited counter-precedent
    rationale: R6 mitigation — both sandcastle + skills are same-author; without dissent the doc reads as endorsement

cross_cutting:
  - concern: documentation
    action: "recommendation.md IS the documentation deliverable. No high-level docs (README, GUIDE.md, hive/references) update from this epic — those happen in follow-on epics if recommendations accepted."

risks:
  - severity: high
    description: Synthesis becomes shelfware (R7)
    mitigation: Next-epics section is acceptance criterion; reviewer blocks sign-off if empty
  - severity: high
    description: Author bias in recommendation (R6)
    mitigation: Section 5 requires cited counter-precedent; reviewer (Opus, separate model) enforces
  - severity: medium
    description: TPM-architect disagreement papered over (R5)
    mitigation: Open disagreements subsection required; orchestrator/user tiebreak documented per disagreement
  - severity: medium
    description: HYBRID call without scoped story-list (R1)
    mitigation: Section 1 HYBRID requires concrete primitive-by-primitive replacement decisions; reviewer enforces

references:
  - path: .pHive/epics/hive-composability-audit/docs/design-discussion.md
    relevant_excerpt: |
      Recommendation document is the gate-keeping artifact — no further A-group /
      skill-catalog / tracker work proceeds until this document is signed off by
      user.
      R7: Recommendation never gets implemented — audit becomes shelf-ware.
      Mitigation: Recommendation document MUST end with concrete next-epic story
      IDs + dependencies; user sign-off blocks until this section is non-empty.
