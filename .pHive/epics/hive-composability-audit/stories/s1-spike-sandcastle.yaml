id: s1-spike-sandcastle
epic: hive-composability-audit
title: Sandcastle feasibility spike — substrate evaluation
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  Bounded ~half-day spike evaluating @ai-hero/sandcastle (mattpocock) as a candidate
  substrate adapter for Hive parallel-pane orchestration, session capture/resume,
  and structured output. Output: GO / NO-GO / HYBRID call against CWC 2026 Group A
  scope, with concrete delta against existing A-group story specs (S4-S10).

  This is feasibility evaluation, NOT adoption. No code lands in main hive paths
  during this spike. All artifacts isolated to `.pHive/spikes/sandcastle/`.

acceptance_criteria:
  - "Sandcastle 0.x installed via npm and ran successfully via Podman SandboxProvider"
  - "Parallel agent run test executed: 2+ Claude Code agents in parallel sandboxes, results merged via branch strategy"
  - "Session capture verified: Claude Code session JSONL captured to host, claude --resume works against captured session"
  - "Output.object() Zod structured-output test executed against rubric-format-style schema"
  - "Hooks model documented: how sandcastle host vs sandbox hooks compare to Hive PreToolUse/PostToolUse"
  - "Findings doc at .pHive/spikes/sandcastle/findings.md produces single GO/NO-GO/HYBRID call with delta against CWC 2026 A-group stories S4-S10"
  - "If HYBRID: explicit decision criteria — which Hive primitives sandcastle replaces, which Hive keeps (per R1 mitigation)"

steps:
  - id: research
    description: |
      Read sandcastle README + ADRs + key source paths. Inventory primitives:
      run() / interactive() / SandboxProvider / AgentProvider / branch strategies /
      hooks / Output.object() / completionSignal / session capture. Map each to
      corresponding Hive concept (TeamCreate, agent-spawn, cmux, hooks, rubric).
    agent: researcher

  - id: implement
    description: |
      Set up Podman + npm install @ai-hero/sandcastle. Write minimal spike harness
      at .pHive/spikes/sandcastle/harness.ts:
        - 2 parallel claudeCode agents in Podman sandboxes
        - Branch strategy: branch (per-agent worktree) merged-to-head
        - Capture sessions, verify resume via claude --resume
        - Output.object() with Zod schema mirroring rubric-format spec shape
      Run harness, capture stdout/stderr to .pHive/spikes/sandcastle/run.log.
    agent: developer
    depends_on: [research]

  - id: test
    description: |
      Verify each acceptance criterion against harness output. Document any
      acceptance criteria that fail. If sandcastle blocks on installation,
      authentication, or sandbox setup → escalate, do not workaround.
    agent: tester
    depends_on: [implement]

  - id: findings
    description: |
      Write .pHive/spikes/sandcastle/findings.md with required sections:
        1. Primitives inventory (sandcastle ↔ Hive concept mapping)
        2. Acceptance criteria results (pass/fail/partial per criterion)
        3. Substrate fit analysis (parallel runs / session resume / structured output / hooks)
        4. CWC 2026 A-group delta — story-by-story (S4-S10) impact if adopted
        5. GO / NO-GO / HYBRID call with explicit reasoning
        6. If HYBRID: per-primitive replacement decision criteria
      Cross-LLM verification: reviewer (Opus) verifies findings against harness output.
    agent: technical-writer
    depends_on: [test]

  - id: review
    description: |
      Reviewer (Opus 4.7) verifies findings doc against harness logs + spike
      artifacts. Confirms no overstated claims, no hidden hybridization,
      no author-bias toward sandcastle (per R6).
    agent: reviewer
    depends_on: [findings]

context:
  codebase: /Users/don/Documents/plugin-hive
  tech_stack:
    sandbox: Podman
    runtime: Node.js (sandcastle is TS lib)
    target_agent: Claude Code CLI
  key_files:
    - path: .pHive/epics/cwc-2026-integration/docs/structured-outline.md
      purpose: A-group substrate scope to compare against
    - path: .pHive/epics/cwc-2026-integration/stories/s5-a2-messages-session-loop.yaml
      purpose: Primary A-group story being evaluated for sandcastle replacement
    - path: hive/references/state-boundary.md
      purpose: Existing Hive substrate boundary doc for cross-reference

design_decisions:
  - decision: Use Podman over Docker for sandbox provider
    rationale: User pick (Q4); also avoids Docker Desktop license overhead on Mac
  - decision: All spike artifacts isolated to .pHive/spikes/sandcastle/
    rationale: Spike is feasibility-only — no code lands in main paths until recommendation signed off
  - decision: HYBRID call requires upfront criteria
    rationale: R1 mitigation — prevents inconclusive "partial fit" recommendation that's harder to scope than pure paths

cross_cutting:
  - concern: documentation
    action: "Findings doc IS the artifact; no high-level docs change during spike. Recommendation doc (s4) may trigger doc updates in follow-on epics."

risks:
  - severity: high
    description: Sandcastle install / Podman setup blocks day-1
    mitigation: Half-day budget; if blocked > 2hrs, escalate to user — do not workaround
  - severity: medium
    description: Spike author bias (sandcastle is from popular author, momentum to over-fit)
    mitigation: Reviewer (Opus, separate model) verifies findings against raw harness output; explicit dissent section in findings

references:
  - path: .pHive/research-drafts/2026-05-08-sandcastle-atoshell-positioning.md
    relevant_excerpt: |
      sandcastle wraps Claude Code CLI. CWC 2026's A-group writes a Messages API
      caller-side loop (cuts CLI out entirely). These are different bets:
        - Hive A-group bet: caller-owned session loop = local-default + Sessions-API-cloud opt-in
        - Sandcastle bet: keep the Claude Code CLI, sandbox it, run many in parallel
      They are NOT drop-in replacements for each other.
  - path: .pHive/epics/hive-composability-audit/docs/design-discussion.md
    relevant_excerpt: |
      R1: Sandcastle "hybrid" call harder to scope than pure paths — needs upfront HYBRID criteria
      R6: Mattpocock author bias — synthesis must include dissent
