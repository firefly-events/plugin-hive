  # W3 — Triage skill (Borrow 3)
  - id: a-27-triage-skill-md
    title: Write skills/triage/SKILL.md with 5-state machine
    complexity: medium
    wave: W3
    depends_on: [a-25-skill-prelude-extraction]
    action_id: A-27

  - id: a-27-triage-queue-yaml
    title: Define .pHive/triage/queue.yaml schema and warning-only gate
    complexity: small
    wave: W3
    depends_on: [a-27-triage-skill-md]
    action_id: A-27

  - id: a-27-triage-plan-handoff
    title: Wire /plan --from-triage handoff path
    complexity: small
    wave: W3
    depends_on: [a-27-triage-skill-md, a-27-triage-queue-yaml]
    action_id: A-27

  - id: a-27-triage-standup-handoff
    title: Wire standup Phase 1 → triage handoff
    complexity: small
    wave: W3
