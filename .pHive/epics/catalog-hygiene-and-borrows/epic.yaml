  # W5 — Sidecar bundle (1 bundled-PR; addresses 3 prompt-tuning fixes)
  - id: w5-sidecar-bundle
    title: Sidecar prompt-tuning bundle (story-state, audit-first completion, token budget)
    complexity: medium
    wave: W5
    depends_on: []                          # parallel to W2/W3/W4; ships when convenient
    action_ids: [A-29, A-30, A-31]
    pr_type: bundled

acceptance_criteria:
  - "skill-prelude.md exists at hive/references/skill-prelude.md; 12 top-level skills cite it; net code delta ≥-500 lines"
  - "5 read-only-shaped skills (status, review, test, standup, ui-audit) emit warning instead of hard-blocking on missing .pHive/"
  - "5 doc-templates moved to hive/references/document-templates/; greenfield-discovery procedure stays in analyst.md"
  - ".pHive/CONTEXT.md exists with starter content; cited from skill-prelude.md and bootstrapped by kickoff"
  - "skills/triage/SKILL.md exists with 5-state machine; .pHive/triage/queue.yaml schema documented; /plan and standup handoff paths wired"
  - "skills/grill/SKILL.md exists as atomic skill (NOT inline /plan section); /plan Phase A2 calls it; researcher emits inconsistency_risk_signals; design-discussion consumes grill-record"
  - "Sidecar bundle ships as one PR addressing story-state, audit-first completion, and token-budget fixes"

out_of_scope:
  - "Structural splits of plan/execute/agent-spawn — Epic B"
  - "Gate-lift on /plan and /execute (D4 Position A) — Epic B"
  - "Adapter ABI work — Epic C"
  - "Brand-system update reflecting reframe — Epic H (post-2.0)"
  - "Memory-stack optionalization — Epic G (post-2.0)"

risks:
  - severity: medium
    description: W4 Grill wiring forces churn against in-flight Phase A2 changes if Epic B starts before this lands
    mitigation: Hard sequencing — Epic B blocked on this epic's W4 PR
  - severity: low
    description: Doc-template reclassify breaks references in existing docs/agents
    mitigation: Grep for skill names before move; redirect references to new path
