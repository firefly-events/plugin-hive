name: catalog-hygiene-and-borrows
title: Catalog Hygiene + Atomic Borrows (Epic A)
description: |
  First in-flight epic from hive-composability-audit recommendation (2026-05-08).
  Walks back kickoff-gate paternalism, extracts duplicated boilerplate, reclassifies
  document-templates out of skills/, and adopts 3 atomic borrows from mattpocock
  posture (CONTEXT.md, Triage, Grill).

  Net catalog delta is reduction (~528-line preamble extraction + 5 doc-template
  reclassifications) plus 3 additive borrows in posture-coherent shape:
    - Borrow 2 (W2): .pHive/CONTEXT.md — single-file domain glossary, substrate for Borrow 1
    - Borrow 3 (W3): skills/triage/ — brownfield bug+feature intake, 5-state queue
    - Borrow 1 (W4): skills/grill/ — adversarial-alignment as atomic skill called from /plan A2

  Wave ordering encodes dependency chain (W0 substrate → W2 CONTEXT.md → W4 Grill).
  W3 Triage is parallel to W2. W5 sidecar bundle is independent, low priority.

  This epic is one of three required for 2.0 (with structural-refactor-and-gate-lift
  and task-tracking-adapter-abi).

target_codebase: /Users/don/Documents/plugin-hive
methodology: classic
scale: medium
branch: feat/catalog-hygiene-and-borrows
parent_audit: hive-composability-audit
milestone: hive-2.0

planning_artifacts:
  - ../hive-composability-audit/docs/recommendation.md  # canonical source — Section 2 + 7 Epic A
  - ../hive-composability-audit/spikes/skills-lens/catalog-matrix.md
  - ../hive-composability-audit/spikes/skills-lens/borrows-scope.md
  - ../hive-composability-audit/spikes/skills-lens/sidecar-edits.md
  - ../hive-composability-audit/spikes/skills-lens/posture-check.md

dependencies:
  blocks:
    - structural-refactor-and-gate-lift   # W4 Grill must land before W6 plan-split
  blocked_by: []                           # no upstream gates

pr_strategy:
  description: |
    ≥4 PRs to stay <150 files per feedback_pr_file_count_limit:
      PR1: W0 boilerplate extract + W1 warning lift + reclassifies (combined)
      PR2: W2 CONTEXT.md (3 stories bundled)
      PR3: W3 Triage skill (4 stories bundled)
      PR4: W4 Grill atomic skill + plan A2 wiring
      PR5: W5 sidecar bundle (1 bundled-PR)

stories:
  # W0 — boilerplate extraction (substrate)
  - id: a-25-skill-prelude-extraction
    title: Extract skill-prelude.md and replace boilerplate in 12 top-level skills
    complexity: medium
    wave: W0
    depends_on: []
    action_id: A-25

  # W1 — warning lift + doc-template reclassify
  - id: w1-warning-lift
    title: Lift kickoff-gate to warning on status, review, test, standup, ui-audit
    complexity: small
    wave: W1
    depends_on: [a-25-skill-prelude-extraction]
    action_ids: [A-03, A-06, A-07]

  - id: w1-doc-template-reclassify
    title: Reclassify design-discussion / horizontal-plan / vertical-plan / structured-outline / greenfield-discovery as document-templates
    complexity: medium
    wave: W1
    depends_on: [a-25-skill-prelude-extraction]
    action_ids: [A-20, A-21, A-22, A-23, A-24]

  # W2 — CONTEXT.md (Borrow 2)
  - id: a-26-context-md-schema-and-starter
    title: Define .pHive/CONTEXT.md schema and produce starter content
    complexity: small
    wave: W2
    depends_on: [a-25-skill-prelude-extraction]
    action_id: A-26

  - id: a-26-context-md-kickoff-bootstrap
    title: Wire CONTEXT.md bootstrap into kickoff skill
    complexity: small
    wave: W2
    depends_on: [a-26-context-md-schema-and-starter]
    action_id: A-26

  - id: a-26-context-md-skill-prelude-citation
    title: Cite CONTEXT.md from skill-prelude.md
    complexity: small
