id: w5-sidecar-bundle
epic: catalog-hygiene-and-borrows
title: Ship bundled sidecar prompt-tuning fixes for story-state, audit-first completion, and token budgets
status: pending
complexity: medium
methodology: classic
depends_on: []
wave: W5
action_ids: [A-29, A-30, A-31]

description: |
  W5 is a single bundled PR carrying three retained sidecar edits. Recommendation
  preserves both the content and approximate blast radius of each: structured
  story state (5 files / ~55 lines), audit-first completion (3 files / ~28
  lines), and token budget over iteration count (4–8 files / ~30 lines,
  peelable if review wants a split).

  Edit 1 (A-29) deprecates free-write status: and derives story state from
  status_transitions:. Edit 2 (A-30) makes completion verdicts audit-first via
  explicit acceptance-criteria walk plus citation re-read. Edit 3 (A-31) adds
  max_tokens_per_step|fix_loop|story advisory caps with fail-open behavior when
  token data is missing.

  Scope boundary:
  - DO keep the PR bundled by default.
  - DO constrain each edit to the retained file sets from recommendation artifacts.
  - DO allow Edit 3 to peel off only if review explicitly requests a split.
  - DO NOT fold in unrelated prompt or workflow tuning.

acceptance_criteria:
  - "Edit 1 scope is limited to the retained 5-file set: hive/references/episode-schema.md, hive/agents/developer.md, hive/agents/tester.md, hive/agents/reviewer.md, skills/execute/SKILL.md"
  - "Edit 2 scope is limited to the retained 3-file set: hive/agents/tester.md, hive/agents/reviewer.md, hive/agents/peer-validator.md"
  - "Edit 3 scope is limited to the retained 4–8 file family: hive/hive.config.yaml, methodology workflows, hive/references/methodology-routing.md, skills/execute/SKILL.md"
  - "`rg -n 'status_transitions|max_tokens_per_step|audit-first|citation re-read|fail-open' .pHive/epics/catalog-hygiene-and-borrows/stories/w5-sidecar-bundle.yaml` returns all retained edit markers"
  - "Story states that Edit 3 is peelable while the default delivery shape remains one bundled PR"

steps:
  - id: research
    description: |
      Read the retained sidecar rows in recommendation artifacts. Confirm the
      three edit goals, approximate file counts, approximate line counts, and
      peelable status of Edit 3.
    agent: researcher
  - id: implement
    description: |
      Write a bundled-PR planning spec that enumerates Edit 1, Edit 2, and
      Edit 3 separately with exact retained file targets, line-count estimates,
      and behavioral intent.
    agent: technical-writer
    depends_on: [research]
  - id: test
    description: |
      Verify the spec names all three edit IDs, preserves the bundled default,
      and includes the exact retained identifiers status_transitions,
      max_tokens_per_step, fix_loop, story, and fail-open semantics.
    agent: tester
    depends_on: [implement]
  - id: review
    description: |
      Verify no extra prompt tuning is smuggled in. Confirm Edit 3 is the only
      peelable portion and all three edits remain traceable.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit on feat/catalog-hygiene-and-borrows; PR cites A-29/A-30/A-31 bundled sidecar story.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: hive/agents/tester.md
      purpose: Edit 1 and Edit 2 target
    - path: hive/agents/reviewer.md
      purpose: Edit 1 and Edit 2 target
    - path: hive/agents/peer-validator.md
      purpose: Edit 2 target for audit-first completion gating
    - path: hive/references/episode-schema.md
      purpose: Edit 1 target for structured story-state guidance
    - path: skills/execute/SKILL.md
      purpose: Edit 1 and Edit 3 target
    - path: hive/hive.config.yaml
      purpose: Edit 3 target for circuit_breakers advisory caps
    - path: hive/references/methodology-routing.md
      purpose: Edit 3 target for routing-level token-budget guidance

design_decisions:
  - decision: Keep all three sidecar edits in one bundled PR by default
    rationale: W5 is explicitly planned as one bundled-PR story across A-29, A-30, and A-31
  - decision: Use token budgets rather than iteration-count caps
    rationale: Retained Edit 3 framing explicitly prefers max_tokens_per_step|fix_loop|story advisory caps

risks:
  - severity: medium
    description: Bundled scope grows beyond the retained sidecar edits
    mitigation: Acceptance criteria pin each edit to an exact retained file set and named identifiers
  - severity: low
    description: Edit 3 hard-fails when token data is absent
    mitigation: Spec requires fail-open semantics on missing token data

references:
  - path: .pHive/epics/hive-composability-audit/docs/recommendation.md
    relevant_excerpt: |
      A-29 deprecates free-write status:, derives from status_transitions:.
      A-30 is audit-first completion. A-31 adds token-budget advisory caps and fail-open behavior.
  - path: .pHive/epics/hive-composability-audit/docs/recommendation-architect-sections.md
    relevant_excerpt: |
      Edit 1 file set: episode-schema, developer, tester, reviewer, execute.
      Edit 2 file set: tester, reviewer, peer-validator. Edit 3 file family
      includes hive.config, methodology workflows, routing, execute.
