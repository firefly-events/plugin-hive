id: a-28-grill-skill-md
epic: catalog-hygiene-and-borrows
title: Write atomic skills/grill/SKILL.md and grill-record template
status: blocked
complexity: medium
methodology: classic
depends_on: [a-26-context-md-schema-and-starter]
wave: W4
action_id: A-28

description: |
  Borrow 1 lands as a new top-level atomic skill at skills/grill/SKILL.md, not
  as an inline /plan Phase A2 section. Recommendation makes that reframed shape
  binding: the grill skill is called by /plan from outside, resolves the
  posture-vulnerability flag, and produces a grill-record artifact using the
  template at hive/references/grill-record-template.md.

  This story authors the grill skill contract and the grill-record template only.
  It does not wire /plan Phase A2, researcher output, or design-discussion
  consumption; those land in the follow-on wiring story.

  Scope boundary:
  - DO author skills/grill/SKILL.md as a top-level atomic skill.
  - DO create hive/references/grill-record-template.md and define its output role.
  - DO align the skill with CONTEXT.md substrate availability from A-26.
  - DO NOT inline grill into skills/plan/SKILL.md in this story.

acceptance_criteria:
  - "`test -f skills/grill/SKILL.md` succeeds"
  - "`test -f hive/references/grill-record-template.md` succeeds"
  - "`rg -n 'atomic skill|NOT inline|grill-record|CONTEXT.md' skills/grill/SKILL.md` returns the required shape markers"
  - "Grill skill text states it is called by /plan Phase A2 from outside rather than embedded directly into /plan"
  - "Template and skill both describe grill-record as the produced artifact consumed downstream"

metric:
  applies: true
  backfilled: true
  name: catalog_hygiene.grill_skill_exists
  direction: up
  unit: bool
  baseline: 0
  target: 1
  window: "story-integrate"
  source:
    kind: manual
    ref: "test -f skills/grill/SKILL.md"
  verify_at: "story-integrate"
  owner: developer

steps:
  - id: research
    description: |
      Read the retained A-28 recommendation rows and confirm the binding shape:
      top-level atomic skill, not inline /plan section, produces grill-record,
      depends on CONTEXT.md substrate first.
    agent: researcher
  - id: implement
    description: |
      Write skills/grill/SKILL.md and hive/references/grill-record-template.md.
      Define the adversarial-alignment purpose, the expected grill-record output,
      and how the skill uses CONTEXT.md as substrate without taking over plan.
    agent: technical-writer
    depends_on: [research]
  - id: test
    description: |
      Verify both files exist and grep for atomic-skill wording, grill-record
      production, and CONTEXT.md substrate references.
    agent: tester
    depends_on: [implement]
  - id: review
    description: |
      Verify the authored shape matches the recommendation reframe. Confirm there
      is no inline Phase A2 block in the grill skill story and no premature
      researcher/design-discussion wiring.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit on feat/catalog-hygiene-and-borrows; PR cites A-28 grill-skill story.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: skills/grill/SKILL.md
      purpose: NEW — top-level atomic adversarial-alignment skill
    - path: hive/references/grill-record-template.md
      purpose: NEW — grill-record output template produced by the skill
    - path: .pHive/CONTEXT.md
      purpose: Substrate loaded before W4 per A-26 borrow ordering
    - path: skills/plan/SKILL.md
      purpose: Downstream caller in the next story; referenced here only to preserve the outside-call boundary

design_decisions:
  - decision: Atomic top-level skill, not inline Phase A2 prose
    rationale: Recommendation says the posture-check §5.1 reframed shape is binding
  - decision: Produce a grill-record artifact via dedicated template
    rationale: The follow-on wiring story depends on a stable artifact contract
  - decision: Sequence after CONTEXT.md substrate
    rationale: Wave ordering is W2 CONTEXT.md before W4 Grill

risks:
  - severity: medium
    description: Grill gets written as a /plan subsection despite the reframe
    mitigation: Acceptance criteria require explicit outside-call wording and atomic-skill markers
  - severity: low
    description: Grill-record template drifts into design-discussion format
    mitigation: "Keep the template purpose narrow — adversarial review output consumed later"

references:
