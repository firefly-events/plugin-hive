id: a-27-triage-plan-handoff
epic: catalog-hygiene-and-borrows
title: Wire /plan --from-triage to read one queue item and decompose it
status: blocked
complexity: low
methodology: classic
depends_on: [a-27-triage-skill-md, a-27-triage-queue-yaml]
wave: W3
action_id: A-27

description: |
  Borrow 3 hands one selected intake item from triage into /plan. Recommendation
  retains the exact integration surface: /plan --from-triage. This story wires
  that flag into skills/plan/SKILL.md so plan can read .pHive/triage/queue.yaml,
  select one triage item, and decompose it into a normal planning flow.

  This is hand-off wiring only. It should not redefine the triage state machine
  or queue schema, and it should not absorb standup responsibilities. It also
  should not turn triage into an inline plan phase; triage remains a separate
  top-level skill.

  Scope boundary:
  - DO add /plan --from-triage behavior to skills/plan/SKILL.md.
  - DO describe queue-read, single-item selection, and decomposition hand-off.
  - DO NOT add a second triage procedure inside /plan.
  - DO NOT touch standup flow in this story.

acceptance_criteria:
  - "`rg -n -- '--from-triage' skills/plan/SKILL.md` returns at least one match after implementation"
  - "`rg -n '.pHive/triage/queue.yaml|read triage queue|decompose one item' skills/plan/SKILL.md` returns all required hand-off references"
  - "Plan skill text makes clear that only one queue item is decomposed per invocation"
  - "Plan skill text treats triage as an upstream source, not an inline replacement for normal plan phases"
  - "Story scope excludes standup and optional adapter write-back"

metric:
  applies: true
  backfilled: true
  name: catalog_hygiene.plan_from_triage_flag_present
  direction: up
  unit: count
  baseline: 0
  target: 1
  window: "story-integrate"
  source:
    kind: manual
    ref: "grep -c -- '--from-triage' skills/plan/SKILL.md (expect >=1)"
  verify_at: "story-integrate"
  owner: developer

steps:
  - id: research
    description: |
      Read the retained A-27 rows and the triage skill + queue stories. Confirm
      the exact hand-off surface: /plan --from-triage reads the triage queue and
      decomposes one item.
    agent: researcher
  - id: implement
    description: |
      Edit skills/plan/SKILL.md to document the --from-triage entry point, queue
      read behavior, item selection rule, and return to normal plan decomposition
      after the hand-off.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Verify the plan skill mentions --from-triage, .pHive/triage/queue.yaml,
      and one-item decomposition. Confirm no standup behavior was added here.
    agent: tester
    depends_on: [implement]
  - id: review
    description: |
      Verify the wiring preserves atomic boundaries: triage owns intake,
      queue.yaml owns persistence, plan owns decomposition.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit on feat/catalog-hygiene-and-borrows; PR cites A-27 plan hand-off story.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: skills/plan/SKILL.md
      purpose: Target for /plan --from-triage flag documentation
    - path: skills/triage/SKILL.md
      purpose: Upstream hand-off contract
    - path: .pHive/triage/queue.yaml
      purpose: Queue input consumed by the --from-triage path
    - path: .pHive/epics/catalog-hygiene-and-borrows/epic.yaml
      purpose: Retains the one-line story contract for this hand-off path

design_decisions:
  - decision: One queue item per /plan --from-triage invocation
    rationale: User brief explicitly says plan reads triage queue and decomposes one item
  - decision: Keep the integration at flag level, not by embedding triage into Phase 0
    rationale: Recommendation frames triage as a separate top-level skill with a hand-off into plan
  - decision: Depend on prior triage skill + queue stories
    rationale: The hand-off contract is only stable after skill semantics and persistence shape are defined

risks:
  - severity: medium
    description: Plan text starts duplicating triage intake instructions
    mitigation: Review checks that plan only documents the entry flag and decomposition hand-off
  - severity: low
    description: Ambiguity about which queue item to plan
    mitigation: Spec forces explicit single-item selection language in the edited plan skill

references:
  - path: .pHive/epics/hive-composability-audit/docs/recommendation.md
    relevant_excerpt: |
      Borrow 3 hand-offs include /plan --from-triage. The triage queue is
      part of the same action and plan integration is a separate story.
  - path: .pHive/epics/catalog-hygiene-and-borrows/epic.yaml
    relevant_excerpt: |
      a-27-triage-plan-handoff — Wire /plan --from-triage handoff path.
      Depends on triage skill authoring and queue schema stories.
