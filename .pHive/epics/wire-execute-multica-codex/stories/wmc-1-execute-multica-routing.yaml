id: wmc-1-execute-multica-routing
epic: wire-execute-multica-codex
title: Add multica routing case to /execute SKILL.md step 5/6 (BLOCKER)
status: pending
complexity: low
methodology: classic
depends_on: []
tracker_id: plugin-hive/PLU-73
tracker_url: http://localhost:3000/plugin-hive/issues/73

description: |
  /execute step 5 dispatch enum lists sessions/team-cmux/team/sequential/sandcastle
  but is missing the `multica` case. execute-dispatch already returns
  mode_decision=multica when execution.mode=multica is configured (root
  hive.config.yaml currently sets it). With no routing case, mode_decision=multica
  falls through unhandled and the skill cannot fire — which is why the
  meta-improvement-reset epic on 2026-05-25 bypassed the entire /execute
  machinery via inline orchestrator HTTP+git scripting.

  Fix: append `multica` to step 5's dispatch enum and add a step 6e block
  analogous to 6d (sandcastle) that invokes the existing execute-mode-multica
  skill with standard inputs.

acceptance_criteria:
  - "skills/hive/skills/execute/SKILL.md step 5 dispatch enum includes 'multica -> step 6e'"
  - "skills/hive/skills/execute/SKILL.md adds step 6e block invoking execute-mode-multica skill"
  - "step 6e passes inputs: workflow_path, unblocked_stories[], appends_map, epic_handle, hive_config"
  - "step 6e block parity-matches step 6d (sandcastle) in shape and conventions"
  - "When mode_decision=multica is returned by execute-dispatch, /execute routes to step 6e (not fall-through)"

steps:
  - id: research
    description: |
      Read skills/hive/skills/execute/SKILL.md step 5 and 6c/6b/6/7/6d to confirm
      the dispatch pattern. Read skills/hive/skills/execute-mode-multica/SKILL.md
      Invocation contract to confirm input shape. Read execute-dispatch/SKILL.md
      Step 0 + Step 1 + Invocation contract to confirm mode_decision=multica is
      already a documented return.
    agent: researcher
  - id: implement
    description: |
      Edit /execute SKILL.md step 5 to add 'multica -> step 6e' to the dispatch
      enum. Add step 6e block. Use step 6d as the structural template — same
      conventions for input passing, same Skill invocation pattern.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Manual verification: trace through /execute SKILL.md text with a
      hypothetical execute-dispatch return of mode_decision=multica and confirm
      the routing case is taken. No automated test (markdown-only change).
    agent: tester
    depends_on: [implement]
  - id: review
    description: |
      Review the routing-case addition for parity with sibling 6c/6b/6d blocks.
      Confirm no other /execute step references are broken. Spot-check that
      step 7b (TaskTrackingDispatch) is still reachable from the new routing
      path.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: |
      Commit on feat/wire-execute-multica-codex with subject
      'fix(execute): add multica routing case to step 5/6 (BLOCKER)'.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  tech_stack:
    runtime: markdown skill text (no code change)
  key_files:
    - path: skills/hive/skills/execute/SKILL.md
      purpose: The /execute skill text — step 5 routes mode_decision to step 6/6b/6c/6d (and now 6e). Sole edit site for this story.
    - path: skills/hive/skills/execute-mode-multica/SKILL.md
      purpose: Target of the new 6e routing case. Already exists; this story only wires the entry.
    - path: skills/hive/skills/execute-dispatch/SKILL.md
      purpose: Returns mode_decision=multica; confirms upstream is ready.

files_to_modify:
  - file: skills/hive/skills/execute/SKILL.md
    change: append 'multica -> step 6e' to step 5 enum; add step 6e block invoking execute-mode-multica

code_examples:
  - title: Existing step 6d (sandcastle) — the structural template to follow
    file: skills/hive/skills/execute/SKILL.md
    snippet: |
      6d. **Sandcastle execution** (used when `HIVE_EXECUTION_MODE=sandcastle` or root config `execution.mode: sandcastle`). Routes each story into an isolated sandcastle container via the Codex auth-mounted provider.
         Invoke `skills/hive/skills/execute-mode-sandcastle/SKILL.md` with:
         - `workflow_path`: the workflow loaded in step 3
         - `unblocked_stories[]`: the depth-0 ready stories from the topological sort
         - `appends_map`: the review-phase sidecar map from step 2b
         - `epic_handle`: the current epic identifier
         - `hive_config`: parsed root `hive.config.yaml` (for `execution.sandcastle.*` options)

design_decisions:
  - decision: Use step 6e label (alphabetic-after-semantic) for consistency with 6b/6c/6d
    rationale: |
      /execute already mixes step 6 (team) with step 6b/6c/6d (variant routes).
      Adding 6e for multica preserves the existing naming convention without
      a broader refactor. A dispatch-table refactor was considered (grill V1)
      but rejected as out-of-scope for this story.

cross_cutting:
  - concern: documentation
    action: |
      Update no separate doc — the routing pattern is entirely captured in
      the skill text itself. README/GUIDE.md do not document step-level
      /execute behavior.

risks:
  - severity: low
    description: Step numbering could conflict with a future routing case
    mitigation: Document the convention in the step 6e block itself (one comment line)

references:
  - path: skills/hive/skills/execute-dispatch/SKILL.md
    relevant_excerpt: |
      mode_decision enum sessions | team | team-cmux | sequential | sandcastle | multica
      execution_mode: multica override
      When source is env or config: immediately set mode_decision=multica and mode_reason=execution-mode-override-{source}.

metric:
  applies: false
  justification: "Single-line skill-text routing addition — process substrate that unblocks /execute from firing at all under multica mode. The metric for the unblocking lives at the epic level (wmc-5 smoke test resolves pass/fail for the whole pipeline)."
