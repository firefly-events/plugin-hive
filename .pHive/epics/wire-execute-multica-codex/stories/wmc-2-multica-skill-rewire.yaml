design_decisions:
  - decision: Serial dispatch is the Phase 1 contract, not a fallback
    rationale: |
      Multica's single Claude-runtime developer agent serializes work internally;
      parallel dispatch from the orchestrator just creates push contention on
      feat/<epic>. Serial dispatch is observably correct and preserves
      feedback_git_flow_per_epic. Phase 2 (multiple agent variants) can
      re-evaluate.
  - decision: Use writeMulticaRunEpisode (canonical) instead of hand-rolled YAML
    rationale: |
      The helper already exists at episode-sync.mjs:229. Skipping it for
      hand-roll was the bypass pattern (feedback_must_use_execute_skill).
      Consistency wins; future schema changes to the marker only need one update site.

cross_cutting:
  - concern: documentation
    action: |
      No README/GUIDE.md change — execute-mode-multica is a sub-skill not
      surfaced in user-facing docs. Skill text is self-documenting.

risks:
  - severity: medium
    description: Inline serial-dispatch annotation could be misread as "all Multica dispatch must be serial forever"
    mitigation: Annotation explicitly scopes to Phase 1 and notes Phase 2 may revisit
  - severity: low
    description: episode-sync.mjs API may evolve and skill text drifts
    mitigation: skill cites the file path + line numbers for grep-discoverability

references:
  - path: hive/lib/multica-story-dispatch/episode-sync.mjs
    relevant_excerpt: |
      export async function pollTaskUntilTerminal(opts) — drives state polling
      with onStateTransition callback, configurable maxWallClockMs + pollIntervalMs.
      export async function writeMulticaRunEpisode(opts) — writes
      .pHive/episodes/{epic}/{story}/multica-run.yaml + messages sidecar JSONL.
  - path: skills/hive/skills/execute-mode-sandcastle/SKILL.md
    relevant_excerpt: |
      Use as parity reference — sandcastle skill text describes its own dispatch
      loop end-to-end without unfinished stubs. execute-mode-multica should
      match that posture after this story.

