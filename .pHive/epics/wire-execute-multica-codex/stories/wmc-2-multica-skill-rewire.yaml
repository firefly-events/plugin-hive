id: wmc-2-multica-skill-rewire
epic: wire-execute-multica-codex
title: Refit execute-mode-multica skill to dispatch serially + call episode-sync helpers
status: in_progress
complexity: medium
methodology: classic
depends_on: [wmc-1-execute-multica-routing]
tracker_id: plugin-hive/PLU-74
tracker_url: http://localhost:3000/plugin-hive/issues/74

description: |
  execute-mode-multica/SKILL.md currently has three problems blocking real use:

  1. Step 2 still carries an "s4 not yet implemented" stub at lines 167-170,
     even though episode-sync.mjs shipped exporting pollTaskUntilTerminal (line 123)
     and writeMulticaRunEpisode (line 229).
  2. Step 1's per-story dispatch description doesn't explicitly serialize.
     With execution.parallel_teams=true (current config), the orchestrator can
     read this as "fan out within DAG depth" — which caused the meta-improvement-reset
     push race on 2026-05-25 when three depth-0 stories all dispatched concurrently
     to a single developer agent that then pushed to feat/<epic> concurrently.
  3. Step 3 prose hand-rolls episode YAML instead of calling writeMulticaRunEpisode.

  Phase 1 routing (locked: existing Claude-runtime agent + brief injection) requires
  serial dispatch — Multica's single developer agent serializes internally anyway,
  and parallel dispatch creates contention without throughput gain. Per
  feedback_git_flow_per_epic, one-branch-per-epic + one-commit-per-story is the
  convention; serial dispatch preserves it.

acceptance_criteria:
  - "execute-mode-multica SKILL.md Step 1 explicitly states serial dispatch: 'dispatch one story at a time; await terminal status before next dispatch within the same DAG depth'"
  - "execute-mode-multica SKILL.md Step 2 replaces the s4 stub (lines 167-170) with the real pollTaskUntilTerminal call shape per episode-sync.mjs API"
  - "execute-mode-multica SKILL.md Step 3 replaces hand-rolled YAML with a writeMulticaRunEpisode call per episode-sync.mjs API"
  - "Sidecar v1 DEFERRED stays as-is (lines 22, 206, 209, 310) — not in scope"
  - "Skill text no longer says 'not yet implemented' anywhere"

steps:
  - id: research
    description: |
      Re-read execute-mode-multica SKILL.md end-to-end. Read episode-sync.mjs
      to confirm pollTaskUntilTerminal + writeMulticaRunEpisode export shapes
      and full parameter lists. Read /execute step 6e (from wmc-1) to confirm
      how this skill is invoked.
    agent: researcher
  - id: implement
    description: |
      Edit execute-mode-multica SKILL.md:
      - Step 1: add a sentence near the dispatch loop stating serial-per-story dispatch as the Phase 1 contract.
      - Step 2: replace the s4 stub block with the real call shape (already documented as an example block on lines ~150-165 — promote it from "expected" to "actual").
      - Step 3: replace the YAML-write prose with a writeMulticaRunEpisode call documenting all parameters per the episode-sync API.
      - Add an inline note (1 line) that Phase 2 parallel dispatch is a future option, not Phase 1.
      Preserve sidecar v1 DEFERRED notes unchanged.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      No automated test (markdown skill text). Manual verification:
      grep for "not yet implemented" in the file — should return zero.
      grep for "serial" — should appear in Step 1. grep for "writeMulticaRunEpisode"
      — should appear in Step 3.
    agent: tester
    depends_on: [implement]
  - id: review
    description: |
      Review the rewritten skill text for: (a) skill-prelude compliance,
      (b) Invocation contract still matches the inputs /execute step 6e passes,
      (c) parallel-call-sites.md annotation (this is a sequential per-story
      site under Phase 1, not a parallel one), (d) no regression on the
      DEFERRED sidecar contract.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: |
      Commit on feat/wire-execute-multica-codex with subject
      'fix(execute-mode-multica): wire pollTaskUntilTerminal + writeMulticaRunEpisode + serial dispatch'.
    agent: developer
    depends_on: [review]

