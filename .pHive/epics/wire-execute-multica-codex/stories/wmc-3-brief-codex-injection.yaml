code_examples:
  - title: Existing serializeStoryBrief signature
    file: hive/lib/multica-story-dispatch/index.mjs
    snippet: |
      // line 140
      export function serializeStoryBrief(story) {
        const sections = [];
        if (story?.description) {
          sections.push(`## Goal\n${cleanText(story.description)}`);
        }
        if (hasItems(story?.acceptance_criteria)) {
          sections.push(`## Acceptance Criteria\n${story.acceptance_criteria.map(formatBullet).join('\n')}`);
        }
        // ... existing sections ...
        sections.push(`---\n_Generated by hive multica-story-dispatch — story ${story?.id ?? ''} in epic ${story?.epic ?? ''}_`);
        return `${sections.join('\n\n')}\n`;
      }

design_decisions:
  - decision: Use named-options object (not positional second arg)
    rationale: |
      Future-proofs the signature — additional options (sidecar handling,
      compression flags, etc.) can land without re-shuffling positional args.
      Avoids the grill-H4 risk of callers passing the wrong positional.
  - decision: Inject section between Goal and Acceptance Criteria
    rationale: |
      Placement matters for inner Claude Code's read order. Goal sets context,
      then the injection tells the agent how to satisfy it (via /codex:rescue),
      then acceptance criteria provide the success contract. Putting the
      injection at the end (after References) would be read too late.
  - decision: Injection text references /codex:rescue verbatim, not generic "use codex"
    rationale: |
      The inner Claude Code needs the exact skill name to invoke. Generic
      phrasing risks the agent inventing a workaround (e.g., calling the
      codex CLI directly) instead of using the plugin skill machinery.

cross_cutting:
  - concern: documentation
    action: |
      Add a short note to hive/references/multica-story-dispatch.md (if exists)
      or inline JSDoc on serializeStoryBrief documenting the new options
