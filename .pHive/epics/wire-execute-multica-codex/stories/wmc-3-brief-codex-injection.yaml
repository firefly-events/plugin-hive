id: wmc-3-brief-codex-injection
epic: wire-execute-multica-codex
title: Inject /codex:rescue instruction into brief when agent_backends[role]=codex
status: pending
complexity: medium
methodology: classic
depends_on: [wmc-2-multica-skill-rewire]
tracker_id: plugin-hive/PLU-75
tracker_url: http://localhost:3000/plugin-hive/issues/75

description: |
  Phase 1 Codex routing (locked alignment 2026-05-25): Multica's existing
  Claude-runtime developer agent runs the work, and the brief instructs it
  to invoke /codex:rescue (provided by the codex plugin loaded inside the
  Claude Code wrapper) for implementation work. No new Multica agent
  bootstrapping; the routing decision is brief-level.

  Today serializeStoryBrief (hive/lib/multica-story-dispatch/index.mjs:140)
  emits Goal / Acceptance Criteria / Files to Touch / Code Examples /
  References sections — but no signal to the inner Claude Code that this
  story is Codex-routed. The inner session has no way to know to use
  /codex:rescue, so it falls back to writing code itself (Claude-only path),
  defeating the agent_backends config entirely.

  Add a conditional injection: when caller passes codexInstruction:true
  (and execute-mode-multica passes true when agent_backends[role]=codex),
  serializeStoryBrief emits an additional "## Use /codex:rescue" section
  after Goal that tells the inner session to delegate implementation work
  to the codex plugin's /codex:rescue skill.

acceptance_criteria:
  - "serializeStoryBrief accepts an optional named-options argument {codexInstruction: boolean}"
  - "Default behavior unchanged when codexInstruction is omitted or false (no brief diff)"
  - "When codexInstruction:true, brief includes a '## Use /codex:rescue' section after Goal with instruction to invoke /codex:rescue for implementation work"
  - "execute-mode-multica Step 1 reads hive_config.agent_backends[role] and passes codexInstruction:true when value is 'codex'"
  - "Unit test in hive/lib/multica-story-dispatch/__tests__/ covers both injection-on and injection-off paths"
  - "All existing callers of serializeStoryBrief continue to work without modification (backward-compatible)"

steps:
  - id: research
    description: |
      Read serializeStoryBrief implementation (index.mjs:140-168). Identify
      all caller sites via grep: `grep -rn serializeStoryBrief hive/ skills/`.
      Read codex-invoke SKILL.md to understand /codex:rescue invocation shape
      so the injection text is accurate.
    agent: researcher
  - id: implement
    description: |
      Extend serializeStoryBrief signature from `(story)` to `(story, options = {})`.
      Read `codexInstruction` from options with default false. When true, insert
      a new section between Goal and Acceptance Criteria:
        '## Use /codex:rescue\nThis story is routed through the Codex backend.
        For implementation work, invoke the /codex:rescue skill with the story
        spec from this brief rather than writing code directly. Return changes
        for the orchestrator to commit.'
      Update execute-mode-multica Step 1 callsite to read
      hive_config.agent_backends[role] and pass codexInstruction:true when
      value is 'codex'.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Write unit tests in hive/lib/multica-story-dispatch/__tests__/serialize-story-brief.test.mjs
      (node:test): (a) default behavior emits no codex section; (b) codexInstruction:true
      emits the section in the correct position; (c) section text mentions
      /codex:rescue verbatim; (d) all other brief sections present unchanged
      in both paths.
    agent: tester
    depends_on: [implement]
  - id: review
    description: |
      Review serializeStoryBrief change for: (a) signature backward-compat
      (named-options, default false); (b) injection text accuracy against
      codex-invoke SKILL.md; (c) all caller sites (existing tests pass
      unchanged); (d) brief section ordering preserved.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: |
      Commit on feat/wire-execute-multica-codex with subject
      'feat(brief): inject /codex:rescue instruction when agent_backends[role]=codex'.
    agent: developer
    depends_on: [review]

