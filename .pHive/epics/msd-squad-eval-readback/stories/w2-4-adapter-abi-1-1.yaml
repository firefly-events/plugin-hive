id: w2-4-adapter-abi-1-1
epic: msd-squad-eval-readback
title: Adapter ABI 1.1.0 — add getSquadActivity (timeline read)
status: complete
complexity: medium
methodology: classic
depends_on: []
description: "Bump the Multica adapter ABI from 1.0.0 -> 1.1.0 and add ONE new\n\
  read method: getSquadActivity(id).\n\n\
  W0.2 read-path finding (settled empirically 2026-06-14, the never-run spike):\n\
  squad-leader evaluations are NOT exposed on a dedicated squad endpoint and\n\
  are NOT on the issue GET response. They land in the unified activity_log and\n\
  are read back via the issue timeline:\n\n\
  - READ:  GET /api/issues/{id}/timeline  (handler ListTimeline,\n\
    router.go:396). Returns { entries: [...], next_cursor, ... }. Each entry\n\
    has type ('activity'|'comment'). Squad evals are activity entries with\n\
    action == 'squad_leader_evaluated', actor_type/actor_id, created_at, and a\n\
    details JSON blob carrying { outcome, reason }.\n\
  - The WRITE side (POST /api/issues/{id}/squad-evaluated, what\n\
    `multica squad activity <id> <outcome>` calls) is OUT OF SCOPE here — read\n\
    only. The status-flip/write path belongs to the squad-leader-status-flip\n\
    epic (sls-1..3 / PLU-313-315).\n\n\
  getSquadActivity(id) resolves the issue UUID (existing resolveIssueUuid),\n\
  GETs the timeline, filters to action=='squad_leader_evaluated', and returns\n\
  the MOST RECENT match as:\n\
    { actor_type, actor_id, outcome: 'action'|'no_action'|'failed',\n\
      reason: <string|null>, created_at }\n\
  or null when no eval activity exists.\n\n\
  NOTE: outcome is a fixed enum (action|no_action|failed), NOT free text.\n\
  The original PLU-104 spec assumed { leader, evaluation:<free text>, timestamp }\n\
  and a dedicated squad endpoint — both wrong; corrected here.\n\n\
  NOTE: updateIssueStatus is deliberately NOT added (read-side-only decision\n\
  2026-06-14). The adapter already transitions to 'in_review' via\n\
  updateStory({status:'in_review'}) inside markNeedsRework (index.ts:389) if a\n\
  write is ever needed.\n\n\
  capabilities() bumps to abi_version '1.1.0' and adds\n\
  supports_squad_activity: true.\n"
acceptance_criteria:
- Adapter exports getSquadActivity (read-only; no updateIssueStatus)
- getSquadActivity GETs /api/issues/{id}/timeline and filters action=='squad_leader_evaluated'
- Returns { actor_type, actor_id, outcome, reason, created_at } for the most-recent eval, or null
- outcome is validated against the enum action|no_action|failed
- Method uses existing resolveIssueUuid + multicaFetch + AdapterError/error-mapping conventions
- "capabilities() returns abi_version: '1.1.0' and supports_squad_activity: true"
- Tests cover happy path, no-eval (empty timeline -> null), and auth failure
- friction-notes.md updated with the ABI 1.1.0 delta + any friction found
- Adapter README documents getSquadActivity + the timeline read path
