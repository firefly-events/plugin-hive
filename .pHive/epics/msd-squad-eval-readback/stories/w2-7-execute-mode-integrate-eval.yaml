id: w2-7-execute-mode-integrate-eval
epic: msd-squad-eval-readback
title: Wire squad-evaluation read into execute-mode-multica episode marker
status: pending
complexity: medium
methodology: classic
depends_on:
- w2-5-eval-contract-doc
- w2-6-dispatch-read-squad-eval
description: "Extend skills/hive/skills/execute-mode-multica/SKILL.md Step 3 (Episode\n\
  marker per terminal) so that, conditional on squad presence in\n\
  .pHive/multica/squads.yaml:\n\n\
  1. After dispatch reaches terminal status (completed) AND `git push` succeeded\n\
     AND the PR opened, call dispatch.readSquadEvaluation(issueId) (W2.6).\n\
  2. Pass the returned evaluation into writeMulticaRunEpisode as a new optional\n\
     opts field; the marker gains an optional squad_evaluation block carrying\n\
     { actor_type, actor_id, outcome, reason, created_at } (or omitted/null).\n\
  3. Best-effort: a null result OR a read error must NOT block /execute\n\
     completion. Log a warning and continue.\n\n\
  If .pHive/multica/squads.yaml is absent (consumer project has not adopted the\n\
  squad layer), this step is a no-op — no read attempted, no marker field added.\n\n\
  Touches: SKILL.md Step 3 prose (the writeMulticaRunEpisode call site ~line 113\n\
  and Step 3 at ~line 304); episode-sync.mjs writeMulticaRunEpisode (line ~291)\n\
  to accept + serialize the optional squad_evaluation block.\n\n\
  This is the READ-side consumer only. The status-flip / squad-evaluated WRITE\n\
  is owned by the squad-leader-status-flip epic and is out of scope.\n"
acceptance_criteria:
- execute-mode-multica Step 3 references readSquadEvaluation invocation, conditional on .pHive/multica/squads.yaml presence
- writeMulticaRunEpisode accepts an optional squad_evaluation opt and serializes it into the marker when present
- Episode marker schema extended with an optional squad_evaluation block { actor_type, actor_id, outcome, reason, created_at }
- Squad eval read is best-effort — null result AND read errors do not fail /execute (warning logged, flow continues)
- Absent .pHive/multica/squads.yaml => full no-op (no read, no marker field)
- Smoke test — full /execute pass on a story dispatched to a squad shows squad_evaluation in the episode marker; a non-squad story omits it
