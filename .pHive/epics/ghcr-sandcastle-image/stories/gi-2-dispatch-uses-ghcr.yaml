risks:
  - severity: medium
    description: First dispatch run after merge happens before gi-1's first GHCR push completes — image not yet in registry.
    mitigation: |
      Fallback path covers it (local build). Document in gi-3 runbook that consumers
      should manually trigger build-sandcastle-image.yml once after enabling the flow.
  - severity: low
    description: Image `:latest` tag updates concurrently with a dispatch run that's about to pull, causing inconsistent layer fetches.
    mitigation: |
      Use `:sha-<short-sha>` tag for production runs in a later epic. For now the
      `:latest` race window is ~seconds and the fallback covers any malformed pull.

