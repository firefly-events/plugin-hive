id: gi-2-dispatch-uses-ghcr
epic: ghcr-sandcastle-image
title: Hive dispatch — pull from GHCR with local-build fallback
status: pending
complexity: medium
methodology: classic
depends_on: [gi-1-build-publish-workflow]

description: |
  Replace the missing build step in `Hive dispatch` with a GHCR pull, then retag to
  `sandcastle:hive` so the existing bridge contract is preserved.

  Edit three files (template + mirror + in-repo workflow):
    - `skills/sandcastle-gh-init/assets/hive-dispatch.yml.tpl`
    - `skills/sandcastle-gh-init/assets/hive-dispatch.example.yml`
    - `.github/workflows/hive-dispatch.yml`

  New step (replaces the missing `Build sandcastle image`):

    - name: Pull sandcastle image (with local-build fallback)
      env:
        IMAGE_REF: ghcr.io/firefly-events/sandcastle:latest
      run: |
        if docker pull "${IMAGE_REF}"; then
          docker tag "${IMAGE_REF}" sandcastle:hive
        else
          echo "::warning::Pull from ${IMAGE_REF} failed — building locally as fallback."
          docker build --build-arg AGENT_UID="$(id -u)" --build-arg AGENT_GID="$(id -g)" \
            -t sandcastle:hive .sandcastle
        fi

  Consumer override: workflow input `image_ref` (default
  `ghcr.io/firefly-events/sandcastle:latest`). Consumers that fork plugin-hive can set
  their own image ref via the input.

  The retag to `sandcastle:hive` is intentional — it preserves the existing bridge
  contract (bridge.mts.tpl does not need to change). Future cleanup can switch the bridge
  to read the image-ref directly.

  Login to GHCR is required only for private images. `ghcr.io/firefly-events/sandcastle`
  starts public (`gh api /orgs/firefly-events/packages/container/sandcastle --method PATCH
  --field visibility=public`), so no `docker login` step is needed at pull-time. If
  the maintainer later flips the image private, gi-2 needs a follow-up adding a
  `docker login ghcr.io -u USERNAME --password-stdin <<< $GITHUB_TOKEN` step.

acceptance_criteria:
  - "Given `Hive dispatch` runs on an issue labeled `hive:ready`, when the `Pull sandcastle image` step executes, then `docker pull ghcr.io/firefly-events/sandcastle:latest` succeeds and `docker images sandcastle:hive` lists the retagged image."
  - "Given the GHCR pull fails (network outage, image deleted), when the step runs, then the workflow falls back to a local `docker build` from `.sandcastle/` and continues."
  - "Given the workflow has a `workflow_dispatch` input `image_ref`, when a maintainer triggers a manual run with `image_ref=ghcr.io/<fork-org>/sandcastle:latest`, then the workflow pulls from the override and retags to `sandcastle:hive`."
  - "Given the in-repo `.github/workflows/hive-dispatch.yml` is updated alongside the template, when the file is parsed by `yamllint`, then it passes."
  - "Given the bridge runs after the pull step, when it invokes `sandcastle.run({ ... })`, then it uses the retagged `sandcastle:hive` image (no contract change in the bridge template)."
  - "Given a measurement of the new `Pull sandcastle image` step duration vs the cron worker's `Build sandcastle image` step duration, when both run on warm GHA runners, then the pull is at least 5x faster."

steps:
  - id: research
    description: |
      Read the current `hive-dispatch.yml.tpl` end-to-end. Identify the exact insertion
      point for the new step (between the existing Setup Node and Resolve base branch
      steps). Confirm the bridge template still expects `sandcastle:hive` literal.
    agent: researcher
  - id: implement
    description: |
      1. Add `workflow_dispatch.inputs.image_ref` to the workflow header (default
         `ghcr.io/firefly-events/sandcastle:latest`).
      2. Insert the `Pull sandcastle image` step after Setup Node.
      3. Regenerate `.example.yml` mirror.
      4. Apply the same edits to the in-repo `.github/workflows/hive-dispatch.yml`.
      5. SKILL.md: update Process + Outputs to describe the GHCR flow + override.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      `yamllint` clean on all three .yml files. Extend `tests/sandcastle-gh-init-assets.test.js`
      with assertions:
        - The `Pull sandcastle image` step exists in the .tpl.
        - The fallback `docker build` is gated by a non-zero exit from `docker pull`.
        - The retag-to-`sandcastle:hive` line is present so the bridge contract holds.
    agent: tester
    depends_on: [implement]
  - id: review
    description: |
      Verify no shell-injection in the `IMAGE_REF` substitution (env var, array-form
      docker invocations). Verify fallback path only fires on pull failure, not on
      smoke-step failure (those are different signals).
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: One commit on `feat/ghcr-sandcastle-image`.
    agent: developer
    depends_on: [review]

