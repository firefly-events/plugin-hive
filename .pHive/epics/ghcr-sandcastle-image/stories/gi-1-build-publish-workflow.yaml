id: gi-1-build-publish-workflow
epic: ghcr-sandcastle-image
title: New build-sandcastle-image.yml workflow — build + push to GHCR
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  Add `.github/workflows/build-sandcastle-image.yml`. Builds the sandcastle container
  image from `.sandcastle/Containerfile` and pushes to GHCR at
  `ghcr.io/firefly-events/sandcastle` with both `:latest` and `:sha-<short-sha>` tags.

  Triggers:
    - `push` to `main` with `paths: ['.sandcastle/**']`
    - `workflow_dispatch` (manual override)
    - `schedule: '17 4 * * 0'` (weekly Sunday 04:17 UTC — catches base-image CVE fixes)

  Permissions:
    contents: read
    packages: write    # required for GHCR push via GITHUB_TOKEN

  Build args from cron Hive Worker's local-build step that should be preserved:
    - AGENT_UID="$(id -u)"
    - AGENT_GID="$(id -g)"

  After push, run a tiny smoke step inside the new image:
    docker run --rm ghcr.io/firefly-events/sandcastle:latest \
      bash -c 'which claude && which codex && claude --version'

  Smoke failure means push is reverted? No — push has already happened and is
  immutable. Instead, the workflow exits non-zero so the run is marked failed
  and a maintainer is notified; the `:sha-<short-sha>` tag still serves as a
  rollback target (`:latest` can be re-pointed manually via gh CLI).

acceptance_criteria:
  - "Given a push to main that modifies `.sandcastle/Containerfile`, when the workflow fires, then GHCR contains a new `ghcr.io/firefly-events/sandcastle:latest` AND a `ghcr.io/firefly-events/sandcastle:sha-<short-sha>` image."
  - "Given `gh api /orgs/firefly-events/packages/container/sandcastle/versions` is queried after a successful run, when the response is read, then it lists both the `:latest` tag and the `:sha-<short-sha>` tag for the run's commit."
  - "Given the workflow runs the smoke step inside the published image, when `which claude && which codex && claude --version` runs, then exit code is 0."
  - "Given a manual `workflow_dispatch` is invoked, when the run completes, then the same two tags are pushed (idempotent on identical Containerfile content)."
  - "Given the weekly schedule fires, when the workflow runs against an unchanged Containerfile, then `:latest` is still re-pushed (refreshes base-image layers for CVE fixes)."

steps:
  - id: research
    description: |
      Read `.github/workflows/hive-worker.yml` build section + `.sandcastle/Containerfile`.
      Confirm the build args used (UID/GID), the package install lines, and any host-
      side files the build expects to be present (sparse-checkout decisions).
    agent: researcher
  - id: implement
    description: |
      1. Create `.github/workflows/build-sandcastle-image.yml` with the three triggers,
         permissions block, and build/push/smoke steps described above.
      2. Use `docker/login-action@v3` against `ghcr.io` with `GITHUB_TOKEN`.
      3. Use `docker/build-push-action@v5` OR plain `docker build` + `docker push`;
         prefer the action because it supports BuildKit cache via GHA cache.
      4. The smoke step runs the new image and asserts CLI presence + version.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      `yamllint .github/workflows/build-sandcastle-image.yml` clean.
      Workflow runs end-to-end on first push (live verification — no fixture test).
    agent: tester
    depends_on: [implement]
  - id: review
    description: |
      Verify permissions block is minimal (packages: write only). Confirm `:sha-<short-sha>`
      tag uses `${{ github.sha }}` truncated to 7 chars. Confirm smoke step exit code
      gates the workflow.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: One commit on `feat/ghcr-sandcastle-image`.
    agent: developer
    depends_on: [review]

