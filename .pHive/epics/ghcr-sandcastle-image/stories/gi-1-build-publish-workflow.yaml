risks:
  - severity: medium
    description: |
      GHCR auth fails on first push (`packages: write` permission missing).
    mitigation: |
      Include the permissions block verbatim in the workflow file. Document in
      gi-3's runbook subsection.
  - severity: low
    description: docker/build-push-action@v5 silently breaks if the runner can't reach GHCR.
    mitigation: |
      Smoke step catches it — if the image isn't pullable, the smoke step fails fast.

