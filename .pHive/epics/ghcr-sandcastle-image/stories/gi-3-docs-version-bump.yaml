id: gi-3-docs-version-bump
epic: ghcr-sandcastle-image
title: README + runbook + CHANGELOG + bump 2.5.0
status: pending
complexity: low
methodology: classic
depends_on: [gi-2-dispatch-uses-ghcr]

description: |
  Final story of the epic. LAST commit on the branch per the versioning cross-cutting
  concern. Five deliverables:

  1. `README.md` — extend the "Unattended mode" section with a sentence about the GHCR
     image flow. Link to runbook.

  2. `hive/references/sandcastle-gh-dispatch.md` — insert a new "Image distribution"
     subsection between §3 Branching model and §4 Auth. Cover:
       - Default behavior (pull from `ghcr.io/firefly-events/sandcastle:latest`).
       - Override knob (workflow_dispatch input `image_ref`).
       - Fallback (local build if pull fails).
       - First-time setup: trigger `build-sandcastle-image.yml` manually after enabling.
       - When the image rebuilds (push to `.sandcastle/**` + weekly cron).
       - Image visibility: public by default; making it private adds a `docker login`
         step (not covered here, but linked).

  3. `CHANGELOG.md` — new dated `## [2.5.0] - 2026-05-19` section. Bullets:
       - New `build-sandcastle-image.yml` workflow pushes to GHCR.
       - `Hive dispatch` pulls from GHCR (~3-5 min saved per run).
       - Local-build fallback preserved.
       - Consumer override via `workflow_dispatch` input.

  4. `.claude-plugin/plugin.json` + `.claude-plugin/marketplace.json` — bump
     `version` from `2.4.2` to `2.5.0`. MINOR bump per semver — substantial
     architectural change consumer-visible.

  5. `README.md` version badge updated to `2.5.0`.

acceptance_criteria:
  - "Given a maintainer reads README.md, when scanning the Unattended mode section, then they see the GHCR image flow described in one sentence with a link to the runbook."
  - "Given a maintainer reads hive/references/sandcastle-gh-dispatch.md, when the new Image distribution section is read, then it covers all six bullets in the description."
  - "Given CHANGELOG.md is rendered, when the new dated `[2.5.0]` section is read, then it names the new workflow, the pull change, the fallback, and the override knob."
  - "Given plugin.json + marketplace.json + README badge, when all four version surfaces are read, then they are EQUAL to `2.5.0`."
  - "Given `git log --oneline main..HEAD`, when run on the epic branch, then this story's commit is the LAST commit (no subsequent commits)."

steps:
  - id: research
    description: |
      Read prior CHANGELOG sections from 2.4.x for formatting conventions. Read the
      versioning cross-cutting concern's implementation_checklist.
    agent: researcher
  - id: implement
    description: Author all five deliverables.
    agent: developer
    depends_on: [research]
  - id: review
    description: |
      Walk the versioning concern's implementation_checklist line-by-line:
        - plugin.json version bumped per semver
        - marketplace.json version matches plugin.json
        - README badge matches
        - CHANGELOG has new dated section with bullets
        - Bump commit is LAST on epic branch
        - No breaking changes → no migration doc needed
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: |
      Commit. MUST be the last commit on the epic branch per the versioning concern.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive-ui-f
  key_files:
    - path: README.md
      purpose: Unattended mode section gets one new sentence + badge bump.
    - path: hive/references/sandcastle-gh-dispatch.md
      purpose: Gains the Image distribution subsection.
    - path: CHANGELOG.md
      purpose: New 2.5.0 dated section.
    - path: .pHive/cross-cutting-concerns.yaml
      purpose: canonical versioning concern checklist this story executes against.

files_to_modify:
  - file: README.md
    change: modify — Unattended mode + version badge
  - file: hive/references/sandcastle-gh-dispatch.md
    change: modify — add Image distribution section
  - file: CHANGELOG.md
    change: modify — new 2.5.0 dated section
  - file: .claude-plugin/plugin.json
    change: modify — version 2.4.2 → 2.5.0
  - file: .claude-plugin/marketplace.json
    change: modify — version mirror

cross_cutting:
  - concern: versioning
    action: |
      Apply the canonical implementation_checklist. MINOR bump (2.4.2 → 2.5.0) per
      semver — substantial architectural change (image distribution model) consumer-
      visible. Bump commit MUST be last on epic branch.

metric:
  applies: false
  justification: "Docs + version story; verified by the cross-cutting versioning checklist. No falsifiable runtime metric — README freshness is process not runtime."

risks:
  - severity: low
    description: Version bump collides with another in-flight epic.
    mitigation: Bump to next minor (2.5.0 → 2.6.0) if conflict.

references:
  - path: .pHive/cross-cutting-concerns.yaml
    relevant_excerpt: |
      implementation_checklist:
        - ".claude-plugin/plugin.json version bumped per semver"
        - ".claude-plugin/marketplace.json version bumped to match plugin.json"
        - "README.md version badge updated to match plugin.json"
        - "CHANGELOG.md gains a new dated section for the new version with bullet entries for each consumer-visible change"
        - "Bump commit is the LAST commit on the epic branch"
