description: "Run CC `/workflows` end-to-end against one real hive epic (\u22645 stories;\nsynthetic only if no real epic fits the bound per gate_3_decisions.D6) with\nat least one Codex-routed creator\
  \ persona in the team (architect+TPM\nrequirement \u2014 without this the spike-pass is hollow). Produce\n`spike-findings.md` with explicit PASS/FAIL verdicts for criteria (a)-(d).\n\nSpike-pass criteria\
  \ (architect-tightened):\n  (a) integration-branch contract honored \u2014 /workflows either accepts\n      injected shell-snippet prompts OR is structurally compatible via\n      CC-native worktree primitives\
  \ respecting shared-branch\n      single-commit-per-story discipline\n  (b) Codex creators return file lists AND the adapter commits serially\n      against integration branch (UNIFIED architect Q3+Q4\
  \ mechanism \u2014\n      eliminates parallel-Codex race + sandbox commit-block in one move)\n  (c) completion signal + failure modes are recoverable\n  (d) plugin-shipped skill auto-load verified for\
  \ plugin-hive under\n      CLI-interactive 2.1.157 \u2014 auto-load works for marketplace-installed\n      plugins OR a documented workaround exists\n\nPer gate_3_decisions.D2 COMPROMISE: spike-findings\
  \ template forces\nper-story evidence breakdown for criteria (a) and (b) only. Criteria (c)\nand (d) use per-criterion summary (no per-story breakdown).\n\nNo production code lands this slice \u2014 only\
  \ the spike-findings artifact +\ncycle-state spike_outcome block. Maintainer-gated at end; Slices 2-6 carry\n`blockedBy: cwfp-s1-1-phase0-capability-spike`.\n"
acceptance_criteria:
