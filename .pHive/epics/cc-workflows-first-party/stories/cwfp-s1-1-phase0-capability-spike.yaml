id: cwfp-s1-1-phase0-capability-spike
epic: cc-workflows-first-party
title: Phase 0 — /workflows capability spike with maintainer gate
status: pending
complexity: high
methodology: classic
depends_on: []

description: |
  Run CC `/workflows` end-to-end against one real hive epic (≤5 stories;
  synthetic only if no real epic fits the bound per gate_3_decisions.D6) with
  at least one Codex-routed creator persona in the team (architect+TPM
  requirement — without this the spike-pass is hollow). Produce
  `spike-findings.md` with explicit PASS/FAIL verdicts for criteria (a)-(d).

  Spike-pass criteria (architect-tightened):
    (a) integration-branch contract honored — /workflows either accepts
        injected shell-snippet prompts OR is structurally compatible via
        CC-native worktree primitives respecting shared-branch
        single-commit-per-story discipline
    (b) Codex creators return file lists AND the adapter commits serially
        against integration branch (UNIFIED architect Q3+Q4 mechanism —
        eliminates parallel-Codex race + sandbox commit-block in one move)
    (c) completion signal + failure modes are recoverable
    (d) plugin-shipped skill auto-load verified for plugin-hive under
        CLI-interactive 2.1.157 — auto-load works for marketplace-installed
        plugins OR a documented workaround exists

  Per gate_3_decisions.D2 COMPROMISE: spike-findings template forces
  per-story evidence breakdown for criteria (a) and (b) only. Criteria (c)
  and (d) use per-criterion summary (no per-story breakdown).

  No production code lands this slice — only the spike-findings artifact +
  cycle-state spike_outcome block. Maintainer-gated at end; Slices 2-6 carry
  `blockedBy: cwfp-s1-1-phase0-capability-spike`.

acceptance_criteria:
  - "Given /workflows exists locally at CC 2.1.154+, when the spike runs against one ≤5-story epic with ≥1 Codex-routed creator, then spike-findings.md exists at .pHive/epics/cc-workflows-first-party/docs/spike-findings.md with explicit PASS/FAIL verdicts for criteria (a)-(d)"
  - "Given the maintainer-confirmed D2 COMPROMISE, when criteria (a) and (b) are recorded, then each carries a per-story evidence breakdown (1 row per story in the test epic); criteria (c) and (d) carry per-criterion summary only"
  - "Given the spike completes, when the team-lead writes the cycle-state, then .pHive/cycle-state/cc-workflows-first-party.yaml gains a spike_outcome block mirroring the verdicts + Plan B branch selections (Q2 path + Layer-5 auto-load PASS/FAIL)"
  - "Given the spike-findings doc is complete, when the maintainer reviews, then the gate signature is recorded in cycle-state; Slices 2-6 unblock"
  - "Given the spike's test epic, when the team is composed, then ≥1 Codex-routed creator persona is present (per architect+TPM unified C1/C2 mitigation)"

steps:
  - id: research
    description: |
      Identify the test epic. Prefer a real existing tiny epic (≤5 stories)
      per gate_3_decisions.D6; if none fits the bound, scaffold a synthetic
      one. Confirm CC 2.1.154+ locally. Determine persona team composition
      including at least one Codex-routed creator (researcher,
      developer/backend-developer/frontend-developer, technical-writer, or
      architect per hive.config.yaml agent_backends map).
    agent: researcher
  - id: implement
    description: |
      (a) Author spike-findings.md template at
      .pHive/epics/cc-workflows-first-party/docs/spike-findings.md with the
      D2-compromise structure: per-story evidence rows under criteria (a)+(b);
      per-criterion summary under (c)+(d).
      (b) Run /workflows against the test epic; capture observed behavior for
      each criterion as evidence cites.
      (c) Fill verdicts in the doc.
      (d) Update .pHive/cycle-state/cc-workflows-first-party.yaml with a
      spike_outcome block + Plan B branch selections.
    agent: developer
    depends_on: [research]
  - id: review
    description: |
      Reviewer cross-checks: each verdict has evidence; per-story breakdown
      present for (a)+(b); Codex-routed creator confirmed in team; cycle-state
      spike_outcome block is well-formed and gate_decisions preserved.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: |
      Commit on feat/cc-workflows-first-party with message
      "[cwfp-s1-1] feat(cc-workflows): Phase 0 capability spike verdicts (a)-(d) + cycle-state spike_outcome".
      Then surface the gate to the maintainer; sign only on maintainer review.
    agent: developer
    depends_on: [review]

