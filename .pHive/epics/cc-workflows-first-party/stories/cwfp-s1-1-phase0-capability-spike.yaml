files_to_modify:
  - file: .pHive/epics/cc-workflows-first-party/docs/spike-findings.md
    change: CREATE the artifact with per-criterion verdicts; per-story evidence rows for (a)+(b); per-criterion summary for (c)+(d)
  - file: .pHive/cycle-state/cc-workflows-first-party.yaml
    change: APPEND spike_outcome block mirroring verdicts + Plan B branch selections; preserve gate_decisions + gate_3_decisions + escalations blocks

design_decisions:
  - decision: D2 compromise forces per-story evidence for (a) and (b) only
    rationale: Architect+TPM unified C1/C2 mitigation requires per-story granularity on integration-branch + serial-commit behavior; (c) and (d) are binary/runtime-level outcomes that don't decompose per-story
  - decision: Codex-routed creator is a structural test requirement, not a stretch goal
    rationale: feedback_codex_parallel_race + feedback_codex_sandbox_commit_block are the load-bearing constraints the spike must validate
  - decision: Prefer real existing tiny epic; synthetic acceptable
    rationale: gate_3_decisions.D6 — evidence quality is higher with a real epic but synthetic is acceptable if no ≤5-story fit exists

cross_cutting:
  - concern: documentation
    action: spike-findings.md IS this story's deliverable; reference from epic README during Phase 6 (Slice 6)
  - concern: simulated-manual
    action: The /workflows invocation is itself a manual run with structured verdict capture; spike-findings.md serves as the verdict carrier (no separate test-scenario YAML needed — the spike-findings doc IS the simulated-manual replay record)

risks:
  - severity: high
    description: Spike "passes" with caveats not surfaced as verdict downgrades (hollow PASS)
    mitigation: D2 forced per-story evidence template for (a)+(b); reviewer cross-checks per-story rows; maintainer-gated review
  - severity: high
    description: Spike reveals criterion (b) FAIL — Codex creators cannot return file lists under /workflows fan-out
    mitigation: Plan B path documented in cycle-state spike_outcome; potential pivot to rescope-memo Option C per Q7 fallback (Slices 2-5 reshape)
  - severity: medium
    description: No existing tiny epic fits the ≤5-story bound, forcing synthetic spike substrate
    mitigation: gate_3_decisions.D6 explicitly permits synthetic; evidence quality penalty is acknowledged + accepted
  - severity: low
    description: CC 2.1.157 .claude/skills/ auto-load (criterion d) cannot be tested separately from the spike's other criteria
    mitigation: Criterion (d) verdict acceptable as standalone runtime check (fresh CC session with plugin-hive installed; observe skill availability)

