  \ with explicit PASS/FAIL verdicts for criteria (a)-(d)"
- Given the maintainer-confirmed D2 COMPROMISE, when criteria (a) and (b) are recorded, then each carries a per-story evidence breakdown (1 row per story in the test epic); criteria (c) and (d) carry per-criterion
  summary only
- Given the spike completes, when the team-lead writes the cycle-state, then .pHive/cycle-state/cc-workflows-first-party.yaml gains a spike_outcome block mirroring the verdicts + Plan B branch selections
  (Q2 path + Layer-5 auto-load PASS/FAIL)
- Given the spike-findings doc is complete, when the maintainer reviews, then the gate signature is recorded in cycle-state; Slices 2-6 unblock
- "Given the spike's test epic, when the team is composed, then \u22651 Codex-routed creator persona is present (per architect+TPM unified C1/C2 mitigation)"
