id: cwfp-s5-1-cycle-state-msd
epic: cc-workflows-first-party
title: Write per-epic-override cycle-state for multica-substrate-deepen
status: pending
complexity: low
methodology: classic
depends_on:
  - cwfp-s2-2-dispatch-enum-and-field-sources
  - cwfp-s4-1-disposition-pass-msd

description: |
  Create or modify .pHive/cycle-state/multica-substrate-deepen.yaml with an
  execution_runtime block whose adapter selection reflects the cwfp-s4-1
  audit's verdicts. For most msd stories (shipped on Multica + remaining-
  pending stories that depend on Multica primitives), adapter = multica.

  This file is READ by cwfp-s2-2's execute-dispatch resolver — when
  execution.runtime resolves to 'auto', the resolver loads this file and
  forces mode_decision to 'multica' (per-epic-override rule).

  Schema (per cwfp-s2-2 design + structured outline Part 2 Phase 5):
    execution_runtime:
      adapter: 'multica'
      rationale: <one-line — keeps msd shipped + pending stories on the substrate they were authored for>
      decided_by: 'cc-workflows-first-party/cwfp-s5-1-cycle-state-msd'
      decided_at: <ISO timestamp>

acceptance_criteria:
  - "Given .pHive/cycle-state/multica-substrate-deepen.yaml, when read, then it has an execution_runtime block with adapter: 'multica' + rationale + decided_by + decided_at"
  - "Given cwfp-s2-2's resolver is live, when execution.runtime: auto + this file present, then mode_decision is forced to 'multica' AND field_sources.execution_runtime.epic_override records this file path"
  - "Given cwfp-s4-1 audit verdicts, when this story commits, then the adapter selection matches the audit's recommendation"
  - "Given the file may already exist (e.g. carries other blocks like phase_records or escalations), when this story modifies, then existing blocks are preserved"

steps:
  - id: implement
    description: |
      Create or modify .pHive/cycle-state/multica-substrate-deepen.yaml with
      the execution_runtime block. Preserve any existing blocks. Cite
      cwfp-s4-1's disposition-pass-msd.md as the rationale source.
    agent: developer
  - id: test
    description: |
      Unit assertion: Given the file present + execution.runtime: auto for
      an msd story dispatch, cwfp-s2-2's resolver emits mode_decision:
      'multica' with epic_override path set. Sanity-check against
      cwfp-s2-5's MVP E2E test harness.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Reviewer checks adapter selection matches audit; existing cycle-state blocks preserved if any
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: 'Commit "[cwfp-s5-1] feat(cycle-state): execution_runtime: multica for multica-substrate-deepen per disposition audit"'
    agent: developer
    depends_on: [review]

