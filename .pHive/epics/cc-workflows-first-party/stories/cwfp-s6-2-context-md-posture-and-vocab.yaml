id: cwfp-s6-2-context-md-posture-and-vocab
epic: cc-workflows-first-party
title: CONTEXT.md Composability posture (i) + hive-workflow vs CC /workflows vocab
status: pending
complexity: medium
methodology: classic
depends_on:
  - cwfp-s2-5-mvp-e2e-validation
  - cwfp-s3-1-persona-dispatchability-under-cc-workflows
  - cwfp-s5-1-cycle-state-msd
  - cwfp-s5-2-cycle-state-mpt

description: |
  Two CONTEXT.md updates:

  (1) "Composability" posture statement durable placement per Q9
      maintainer-confirmed (i) reframe:
        OLD: "Composability — the 2.0 north star. Substrate that the user
              directs vs a director-chair workflow that hard-blocks."
        NEW (sketch — exact wording at implementation):
              "Composability — Hive composes ON Claude Code. CC workflows
              is the first-party substrate; Hive provides the composition
              layer (personas, skills, plan/execute discipline) on top.
              Multica is second-party for codex co-mingling, webhooks, and
              durable queue. User directs through execution.runtime
              selection and per-epic disposition."

  (2) Vocab section: new subsection (or expanded existing) disambiguating
      hive-workflow vs CC /workflows (resolves grill V1). Distinction:
        - hive-workflow — YAML at hive/workflows/*.workflow.yaml defining
          ordered steps with persona / step-file / methodology dependencies
          (existing primitive)
        - CC /workflows — Claude Code native slash command (2.1.154 GA)
          for dynamic background multi-agent fan-out

  Plus: Phase 6 vocab grep on TOUCHED files (this epic's deliverables) for
  consistency; flag (don't fix) drift on UNTOUCHED files per
  gate_3_decisions.D3.

acceptance_criteria:
  - "Given CONTEXT.md after this story commits, when the Composability posture statement is read, then it expresses Q9 (i) reframe — Hive composes ON Claude Code as the first-party substrate"
  - "Given CONTEXT.md, when the vocab section is read, then it disambiguates hive-workflow (YAML at hive/workflows/*.workflow.yaml) from CC /workflows (CC native slash command, 2.1.154 GA)"
  - "Given the vocab grep on TOUCHED files (this epic's commits), when run, then no contradictory usage of hive-workflow vs CC /workflows is found within them"
  - "Given the vocab grep on UNTOUCHED files, when run, then drift findings are flagged in a follow-on `chore/vocab-disambiguation` epic note (NOT fixed in this story per D3 + design-discussion §10)"
  - "Given downstream consumers (skill authors, agent file authors), when they read CONTEXT.md after this story commits, then the new posture + vocab is the durable canonical reference"

steps:
  - id: research
    description: |
      Read CONTEXT.md fully. Read the existing "Composability" entry +
      vocab section structure. Read this epic's TOUCHED files list (from
      Phase 1-5 commits) to scope the grep target.
    agent: researcher
  - id: implement
    description: |
      Rewrite "Composability" posture per Q9 (i). Add or expand vocab
      section to disambiguate hive-workflow vs CC /workflows. Run grep on
      TOUCHED files to confirm internal consistency. Run grep on UNTOUCHED
      files; capture drift findings in a separate note (NOT fixing).
    agent: technical-writer
    depends_on: [research]
  - id: test
    description: |
      Doc-test: CONTEXT.md vocab section's hive-workflow vs CC /workflows
      distinction is consistent with usage in cwfp-s6-1 README rewrite +
      cwfp-s2-3 SKILL.md.
      Drift note: if grep on UNTOUCHED files reveals contradictory usage,
      capture in a follow-on chore epic candidate note at
      .pHive/epics/cc-workflows-first-party/docs/vocab-drift-untouched.md
      (this is a discovery deliverable; the fix is out of scope per D3).
    agent: tester
    depends_on: [implement]
  - id: review
    description: |
      Maintainer review on Q9 (i) posture wording. Reviewer cross-checks
      vocab section against README hero (cwfp-s6-1) for consistency.
      Architect-optional: confirm posture statement is "durable" — i.e.,
      placed where future skill/agent authors will encounter it.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: 'Commit "[cwfp-s6-2] docs(context): Composability posture (i) + vocab disambiguation (hive-workflow vs CC /workflows)"'
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: CONTEXT.md
      purpose: Composability posture + vocab section targets
    - path: README.md
      purpose: Cross-check posture wording with cwfp-s6-1 hero
    - path: skills/hive/skills/execute-mode-cc-workflows/SKILL.md
      purpose: Cross-check vocab usage with cwfp-s2-3 SKILL

files_to_modify:
  - file: CONTEXT.md
    change: REWRITE Composability posture statement per Q9 (i); ADD/EXPAND vocab section disambiguating hive-workflow vs CC /workflows

design_decisions:
  - decision: Vocab grep on untouched files flags-don't-fixes
    rationale: gate_3_decisions.D3 — keeps epic scope bounded; follow-on chore epic does the broader vocab fix if drift is substantial
  - decision: Composability posture placement is "durable"
    rationale: Q9 maintainer-confirmed; future skill/agent authors must encounter the new posture; CONTEXT.md is the canonical reference all downstream authoring reads

cross_cutting:
  - concern: documentation
    action: CONTEXT.md IS the durable canonical reference; this story IS the doc change

risks:
  - severity: low
    description: Vocab drift in untouched files reveals substantial inconsistency, making "flag don't fix" feel inadequate
    mitigation: Follow-on chore/vocab-disambiguation epic is the explicit pressure-release; surfaces in the vocab-drift-untouched.md note for maintainer visibility
  - severity: low
    description: Posture wording in CONTEXT.md drifts from README hero (cwfp-s6-1)
    mitigation: Reviewer cross-checks both files; both stories ship in the same slice (V Slice 6)

references:
  - path: .pHive/cycle-state/cc-workflows-first-party.yaml
    relevant_excerpt: |
      gate_decisions.open_questions.Q9: agree (i) "Hive composes ON Claude Code" durable in CONTEXT.md before Phase C.
      gate_3_decisions.D3: A — ship Phase 6 vocab-grep as designed (flag don't fix); follow-on chore/vocab-disambiguation if grep flags drift.
  - path: .pHive/epics/cc-workflows-first-party/docs/grill-record.md
    relevant_excerpt: |
      V1 — "workflow" is overloaded with two distinct meanings without disambiguation. Draft uses /workflows (CC native — the GA feature); CONTEXT.md "Workflow" entry establishes hive's existing meaning. Question for planner: How does the draft disambiguate hive-workflow (YAML, persona-step-methodology) from CC-/workflows (native slash command, dynamic background fan-out)?
  - path: .pHive/epics/cc-workflows-first-party/docs/design-discussion.md
    relevant_excerpt: |
      §1 Vocabulary disambiguation — Two distinct things share the word "workflow." hive-workflow vs CC /workflows.

metric:
  applies: false
  justification: Durable posture + vocab placement; outcome is consumer/author cognitive clarity, not a measurable runtime metric.
