description: "Two CONTEXT.md updates:\n\n(1) \"Composability\" posture statement durable placement per Q9\n    maintainer-confirmed (i) reframe:\n      OLD: \"Composability \u2014 the 2.0 north star. Substrate\
  \ that the user\n            directs vs a director-chair workflow that hard-blocks.\"\n      NEW (sketch \u2014 exact wording at implementation):\n            \"Composability \u2014 Hive composes ON Claude\
  \ Code. CC workflows\n            is the first-party substrate; Hive provides the composition\n            layer (personas, skills, plan/execute discipline) on top.\n            Multica is second-party\
  \ for codex co-mingling, webhooks, and\n            durable queue. User directs through execution.runtime\n            selection and per-epic disposition.\"\n\n(2) Vocab section: new subsection (or expanded\
  \ existing) disambiguating\n    hive-workflow vs CC /workflows (resolves grill V1). Distinction:\n      - hive-workflow \u2014 YAML at hive/workflows/*.workflow.yaml defining\n        ordered steps with\
  \ persona / step-file / methodology dependencies\n        (existing primitive)\n      - CC /workflows \u2014 Claude Code native slash command (2.1.154 GA)\n        for dynamic background multi-agent fan-out\n\
  \nPlus: Phase 6 vocab grep on TOUCHED files (this epic's deliverables) for\nconsistency; flag (don't fix) drift on UNTOUCHED files per\ngate_3_decisions.D3.\n"
acceptance_criteria:
- "Given CONTEXT.md after this story commits, when the Composability posture statement is read, then it expresses Q9 (i) reframe \u2014 Hive composes ON Claude Code as the first-party substrate"
- Given CONTEXT.md, when the vocab section is read, then it disambiguates hive-workflow (YAML at hive/workflows/*.workflow.yaml) from CC /workflows (CC native slash command, 2.1.154 GA)
- Given the vocab grep on TOUCHED files (this epic's commits), when run, then no contradictory usage of hive-workflow vs CC /workflows is found within them
- "Given the vocab grep on UNTOUCHED files, when run, then drift findings are flagged in a follow-on `chore/vocab-disambiguation` epic note (NOT fixed in this story per D3 + design-discussion \xA710)"
- Given downstream consumers (skill authors, agent file authors), when they read CONTEXT.md after this story commits, then the new posture + vocab is the durable canonical reference
