    description: Phase 0 (a) FAIL — /workflows rejects free-form shell-snippet prompt injection
    mitigation: workflow_assembly substep gates its internal logic on Phase 0 (a) verdict; Plan B b (per-unit PR) or c (worktree-per-story isolation + serialized merge) — chosen at this story's research step based on cycle-state spike_outcome block
  - severity: medium
    description: Serial-commit gate handles multi-step stories incorrectly (squashes instead of preserving fix sequence)
    mitigation: Step 3 accepts ≥1 commit per story per maintainer gate 3 clarification; test step's integration test exercises a multi-commit story explicitly
  - severity: medium
    description: Copy-with-attribution from multica-story-dispatch drifts as the source evolves
    mitigation: D1 follow-on chore epic does the shared-helper extraction; until then, attribution + drift watch is the discipline
  - severity: low
    description: Episode marker path collision if epic+story names collide
    mitigation: Path includes both {epic} and {story} segments; existing mode-skills use this convention without collision

