code_examples:
  - title: Integration-branch shell-snippet contract (mirror of multica-story-dispatch:192-262)
    file: hive/lib/multica-story-dispatch/index.mjs
    snippet: |
      # Pattern this skill's Step 3 mirrors (paraphrased — full source in cited lines):
      git fetch origin <integration-branch>
      git checkout <integration-branch>
      git reset --hard origin/<integration-branch>
      git apply <agent-file-list>
      git add -A
      git commit -m "[<story-id>] <type>(<scope>): <description>"
      # Rebase-and-push with 3-retry
      for i in 1 2 3; do git pull --rebase origin <integration-branch> && git push origin <integration-branch> && break; done

design_decisions:
  - decision: Copy-with-attribution from multica-story-dispatch:192-262 (no shared helper this epic)
    rationale: gate_3_decisions.D1 — keeps Phase 2 PR file count lean; follow-on chore/integration-branch-contract-shared epic does the refactor
  - decision: Step 3 accepts ≥1 commit per story (variable-length sequence)
    rationale: gate 3 elicitation clarification per maintainer + architect's Failure 2 resolution — in-story fix sequences shouldn't be artificially squashed
  - decision: workflow_assembly is the substep gated by Phase 0 (a) verdict
    rationale: Outer seam invariant — execute-dispatch's contract with this skill is stable; only internal logic shifts based on (a) verdict
  - decision: Step 5 re-uses task-tracking-dispatch ABI unchanged
    rationale: ABI is already vendor-neutral; no fork needed (research brief §3 + structured outline Layer 7)

