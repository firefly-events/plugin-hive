description: |
  Create skills/hive/skills/execute-mode-cc-workflows/SKILL.md mirroring the
  shape of skills/hive/skills/execute-mode-multica/SKILL.md. Steps:
    - Step 0: precondition gate — verify CC runtime >= 2.1.154; verify
      execution.runtime resolves to cc-workflows (or env override
      HIVE_EXECUTION_RUNTIME=workflows); reject otherwise with field_sources
      cite
    - Step 1: workflow_assembly substep — prompt construction, persona-to-
      step mapping (per feedback_use_roster_agents — references persona
      files, no improvised inline personas), /workflows invocation,
      completion-signal wiring. Internal logic gated by Phase 0 (a) verdict;
      OUTER SEAM INVARIANT — Phase 0 (a) failure changes only what
      workflow_assembly emits, not how execute-dispatch calls into this skill
    - Step 2: /workflows dispatch — invoke via CC native primitives; capture
      run handle
    - Step 3: SERIAL-COMMIT GATE (architect Q3+Q4 unified mechanism) —
      receive file lists from agents; adapter applies serially against
      integration branch; fast-forward enforced; rebase-and-push 3-retry
      (mirrors hive/lib/multica-story-dispatch/index.mjs:192-262). Step 3
      accepts ≥1 commit per story; in-story fix sequences add more commits;
      integration branch advances fast-forward regardless (gate 3
      elicitation clarification per maintainer)
    - Step 4: episode marker write — ${HIVE_STATE_DIR}/episodes/{epic}/{story}/cc-workflows-run.yaml
    - Step 5: summary return — surface completion, scope-drift signal,
      episode path; invokes task-tracking-dispatch ABI for status updates
      (unchanged ABI, no fork)
    - "Replaces respawn skill for its stories" (mirrors session-mode pattern)
    - Honors single-isolation-layer rule

  Per gate_3_decisions.D1: this story's Step 3 uses COPY-WITH-ATTRIBUTION
  from hive/lib/multica-story-dispatch/index.mjs:192-262; no shared helper
  extraction this epic (follow-on chore/integration-branch-contract-shared).

acceptance_criteria:
  - "Given the new SKILL.md exists at skills/hive/skills/execute-mode-cc-workflows/SKILL.md, when execute-dispatch routes mode_decision: cc-workflows, then Steps 0-5 execute in order and produce a summary return"
  - "Given Step 3 receives file lists from /workflows agents, when applied, then ≥1 commit per story lands on the integration branch with fast-forward enforced + rebase-and-push 3-retry; in-story fix sequences land as additional commits"
  - "Given no agent makes direct .git writes under /workflows fan-out, when Step 3 commits serially, then feedback_codex_sandbox_commit_block + feedback_codex_parallel_race are honored"
  - "Given the episode marker contract, when a story completes, then ${HIVE_STATE_DIR}/episodes/{epic}/{story}/cc-workflows-run.yaml exists with the run record"
  - "Given Step 5 summary return, when status update is required, then it invokes hive/lib/task-tracking-dispatch ABI unchanged (vendor-neutral re-use)"
  - "Given the single-isolation-layer rule, when /workflows runs a dispatched agent, then that agent cannot recursively invoke /workflows"
  - "Given the D1 copy-with-attribution decision, when Step 3 logic ships, then the shell-snippet contract cites hive/lib/multica-story-dispatch/index.mjs:192-262 as source"

steps:
  - id: research
    description: |
      Read execute-mode-multica/SKILL.md fully; read execute-mode-session/SKILL.md
      for "replaces respawn skill" pattern; read multica-story-dispatch/index.mjs:192-262
      for the shell-snippet contract to mirror. Capture episode-marker contract
      from existing mode skills.
    agent: researcher
  - id: implement
    description: |
      Author SKILL.md with frontmatter, Step 0-5 invocation contract, episode marker
      contract, summary return contract. Step 3 includes copy-with-attribution from
      multica-story-dispatch + variable-length-commit-sequence-per-story invariant.
      workflow_assembly substep documents that its internal logic is gated by
      Phase 0 (a) verdict (Q2 (a) shell-snippet injection if PASS; Plan B b/c
      if FAIL).
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Doc-test: SKILL.md frontmatter + sections + invocation contract intact.
      Integration test: end-to-end run of a tiny epic with HIVE_EXECUTION_RUNTIME=workflows;
      verify ≥1 commit per story lands on integration branch with fast-forward;
      verify episode marker exists at expected path; verify Step 5 invokes
      task-tracking-dispatch unchanged.
    agent: tester
    depends_on: [implement]
  - id: review
    description: |
      Architect review on Step 3 serial-commit gate (load-bearing mechanism);
      reviewer cross-checks no recursive /workflows spawn; cross-checks
      copy-with-attribution discipline (D1) honored.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: 'Commit "[cwfp-s2-3] feat(execute-mode-cc-workflows): NEW skill with workflow_assembly + serial-commit gate"'
    agent: developer
    depends_on: [review]

