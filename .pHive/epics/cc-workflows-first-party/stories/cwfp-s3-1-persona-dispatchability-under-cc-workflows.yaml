description: "Produce .pHive/epics/cc-workflows-first-party/docs/persona-dispatchability-under-cc-workflows.md\nwith per-persona verdicts sourced from first-hand evidence in Phase 0\nspike (cwfp-s1-1) +\
  \ MVP E2E run (cwfp-s2-5).\n\nPer-persona verdict:\n  - DISPATCHABLE: persona remains a standalone agent invoked by /workflows\n  - COLLAPSED: persona's coordination work is fully expressed in workflow\n\
  \    YAML/spec (ELIMINATION per feedback_no_team_lead_intermediary \u2014 NOT\n    relocation; this is a load-bearing invariant)\n  - REFRAMED: persona's role changes shape (e.g. pair-programmer may\n\
  \    become a /workflows step pattern rather than a standalone agent)\n\nInvariants:\n  - feedback_no_team_lead_intermediary preserved \u2014 no team-lead-shaped\n    intermediary reintroduced; if /workflows\
  \ cannot fully express a\n    persona's coordination, persona remains DISPATCHABLE\n  - feedback_use_roster_agents preserved \u2014 any persona reused in workflow\n    YAML references the persona file\
  \ at hive/agents/, not improvised\n    inline\n\nUNVERIFIED-defer policy: any persona without first-hand evidence is\nmarked UNVERIFIED + deferred; do NOT speculate (writer scope discipline).\n\nCompares\
  \ to existing .pHive/epics/multica-substrate-deepen/docs/persona-dispatchability.md:15-65\n(22 dispatchable / 3 harness-only on Multica substrate).\n"
acceptance_criteria:
- Given the persona-dispatchability-under-cc-workflows.md doc, when reviewed, then each of the 25 personas in hive/agents/ has a verdict OR an explicit UNVERIFIED-defer note
- Given a COLLAPSED verdict, when justified, then it cites first-hand evidence from cwfp-s1-1 or cwfp-s2-5 + confirms ELIMINATION (not relocation) per feedback_no_team_lead_intermediary
- "Given a persona referenced in a /workflows YAML/spec example, when shown, then the persona file at hive/agents/ is cited (per feedback_use_roster_agents \u2014 no improvised inline personas)"
- "Given the existing persona-dispatchability.md 22/3 cut on Multica substrate, when this doc is read, then the comparison surface explicitly notes which personas changed verdict (Multica \u2192 CC /workflows\
  \ substrate)"
- "Given an UNVERIFIED persona, when the doc lists it, then a defer reason is recorded \u2014 no speculation"
