id: cwfp-s2-5-mvp-e2e-validation
epic: cc-workflows-first-party
title: MVP end-to-end validation — real hive epic via /workflows with serial-commit gate
status: pending
complexity: medium
methodology: classic
depends_on:
  - cwfp-s1-1-phase0-capability-spike
  - cwfp-s2-1-execute-step-6f
  - cwfp-s2-2-dispatch-enum-and-field-sources
  - cwfp-s2-3-execute-mode-cc-workflows-skill
  - cwfp-s2-4-config-schema-execution-runtime

description: |
  Run a real hive epic end-to-end through the new first-party path:
    HIVE_EXECUTION_RUNTIME=workflows /hive:execute <test-epic>
  Validate:
    - mode_decision resolves to 'cc-workflows' (cwfp-s2-2 resolver + cwfp-s2-4 config knob)
    - execute step 6f routes correctly (cwfp-s2-1)
    - execute-mode-cc-workflows skill (cwfp-s2-3) Steps 0-5 fire in order
    - serial-commit gate produces ≥1 commit per story on integration branch
      with fast-forward enforced; in-story fix sequences land as additional
      commits
    - episode marker exists per story at expected path
    - Step 5 summary return invokes task-tracking-dispatch ABI unchanged
    - field_sources.execution_runtime records the precedence-chain source
    - per-epic-override is NOT triggered (cycle-state file absent or value
      not 'auto' — Phase 5 has not yet shipped the override files)
    - one Codex-routed creator persona runs cleanly (returns file list, no
      .git writes — feedback_codex_sandbox_commit_block + feedback_codex_parallel_race honored)

  This story is the structured-outline Part 2 Phase 2 manual validation
  point AND the answer to "MVP path proves itself end-to-end opt-in". It
  closes V Slice 2.

acceptance_criteria:
  - "Given the test epic + HIVE_EXECUTION_RUNTIME=workflows, when /hive:execute runs, then mode_decision resolves to 'cc-workflows' with field_sources.execution_runtime source = env"
  - "Given the run completes, when integration branch is inspected, then ≥1 commit per story landed with fast-forward; commit format honored ([{story-id}] <type>(<scope>): <description>)"
  - "Given the test epic includes at least one Codex-routed creator persona, when /workflows fans out, then the Codex agent returns a file list AND the adapter (cwfp-s2-3 Step 3) commits serially against integration branch — no .git writes from the agent observed"
  - "Given episode markers per story, when the run completes, then ${HIVE_STATE_DIR}/episodes/{test-epic}/{story}/cc-workflows-run.yaml exists for every story"
  - "Given Step 5 summary return, when status update is required, then task-tracking-dispatch ABI is invoked unchanged (matches vendor-neutral re-use contract)"
  - "Given the run, when a follow-on fix is applied within the same story, then the integration branch gains an additional commit (variable-length commit-sequence-per-story per maintainer gate 3 clarification)"
  - "Given no cycle-state file exists for the test epic, when resolver fires with execution.runtime: auto (a separate verification run without env override), then graceful fall-through happens — no hard error"

steps:
  - id: research
    description: |
      Select a real hive epic suitable for the MVP run (small, ≤5 stories,
      includes ≥1 Codex-routed creator — overlap with Phase 0 spike test
      epic acceptable). Verify cycle-state file for the test epic is absent
      (graceful fall-through verification) OR present with value other than
      'auto' (overlay verification).
    agent: researcher
  - id: implement
    description: |
      Run /hive:execute against the test epic with HIVE_EXECUTION_RUNTIME=workflows.
      Capture observed integration-branch state + episode markers + field_sources
      values. Re-run a second variant with execution.runtime: auto + cycle-state
      file present to verify per-epic-override behavior end-to-end.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Verify each acceptance criterion with first-hand evidence; document
      observations in a validation log under
      .pHive/epics/cc-workflows-first-party/docs/mvp-validation.md.
      Multi-commit-per-story verification: apply a deliberate fix within
      one story and verify the integration branch gains an additional
      commit.
    agent: tester
    depends_on: [implement]
  - id: review
    description: |
      Architect review on serial-commit gate behavior + variable-length
      commit-sequence handling; reviewer cross-checks no Codex .git writes
      observed; reviewer confirms episode marker contract honored.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: 'Commit "[cwfp-s2-5] test(cc-workflows): MVP E2E validation against real hive epic"'
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: skills/hive/skills/execute-dispatch/SKILL.md
      purpose: cwfp-s2-2 resolver under test
    - path: skills/hive/skills/execute-mode-cc-workflows/SKILL.md
      purpose: cwfp-s2-3 adapter under test
    - path: hive.config.yaml
      purpose: cwfp-s2-4 config knob under test
    - path: hive/lib/task-tracking-dispatch/index.ts
      purpose: Step 5 invokes this ABI; verify no break in vendor-neutral re-use

files_to_modify:
  - file: .pHive/epics/cc-workflows-first-party/docs/mvp-validation.md
    change: CREATE validation log capturing per-acceptance-criterion evidence

design_decisions:
  - decision: Validation log is a separate doc, not embedded in cycle-state
    rationale: cycle-state carries gate_decisions + escalations + phase_records; per-story validation evidence is verbose and belongs in /docs/ alongside spike-findings.md
  - decision: Multi-commit-per-story is explicitly exercised
    rationale: Gate 3 elicitation Failure 2 + maintainer clarification — variable-length commit sequence per story is the invariant; test must show it works

cross_cutting:
  - concern: documentation
    action: mvp-validation.md is the deliverable; CONTEXT.md vocab section (cwfp-s6-2) cites this as evidence of shipped behavior
  - concern: simulated-manual
    action: This story IS a simulated-manual replay (run /hive:execute end-to-end against a real epic; capture verdict); the validation log serves as the verdict carrier in lieu of a separate test-scenario YAML

risks:
  - severity: high
    description: MVP run reveals a regression in mode_decision resolution or serial-commit gate behavior
    mitigation: cwfp-s2-1 + s2-2 + s2-3 + s2-4 each carry their own automated tests; integration test here catches cross-component regression early; fix-and-recommit cycle before final integrate
  - severity: medium
    description: Codex-routed creator persona drifts vs Phase 0 spike behavior (e.g. occasional .git write attempt)
    mitigation: Architect review specifically checks for Codex .git writes; observed write triggers immediate failure mode + rollback consideration (per Risk Registry §5 risk 3)
  - severity: low
    description: Test epic finished mid-MVP-run; rerun produces different stories
    mitigation: Pin to specific test epic commit; document in mvp-validation.md what was actually run

references:
  - path: .pHive/epics/cc-workflows-first-party/docs/structured-outline.md
    relevant_excerpt: |
      Part 2 Phase 2 Validation — Manual: run an existing tiny epic end-to-end with HIVE_EXECUTION_RUNTIME=workflows; observe one-commit-per-story on integration branch.
  - path: .pHive/cycle-state/cc-workflows-first-party.yaml
    relevant_excerpt: |
      gate_3_decisions.elicitation.failure_2_clarification: Commit invariant refined — at least one commit per story, and any subsequent fixes before that story is finalized are additional commits.

metric:
  applies: true
  name: cc_workflows_mvp_e2e_pass_rate
  direction: up
  unit: percent
  baseline: 0
  target: 100
  window: phase-2-mvp-close
  source:
    kind: manual
    ref: .pHive/epics/cc-workflows-first-party/docs/mvp-validation.md
  verify_at: integrate step of cwfp-s2-5-mvp-e2e-validation
  owner: cc-workflows-first-party
