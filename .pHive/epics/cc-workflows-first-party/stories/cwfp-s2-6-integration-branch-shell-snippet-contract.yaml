id: cwfp-s2-6-integration-branch-shell-snippet-contract
epic: cc-workflows-first-party
title: Q2 (a) shell-snippet integration-branch contract injection (Phase-0-conditional)
status: pending
complexity: medium
methodology: classic
depends_on:
  - cwfp-s1-1-phase0-capability-spike
  - cwfp-s2-3-execute-mode-cc-workflows-skill
parallel_allowed: true
parallel_rationale: bounded-slice

description: |
  Implement the Q2 (a) shell-snippet contract injection inside the
  workflow_assembly substep of cwfp-s2-3's SKILL.md, conditional on Phase 0
  criterion (a) PASS (per gate_decisions.Q2 + cwfp-s1-1 spike_outcome
  block).

  Behavior:
    - If Phase 0 (a) PASS: workflow_assembly injects fetch / checkout /
      reset / commit-with-story-id-format / rebase-and-push-3-retry shell
      snippets into agent prompts (mirrors multica-story-dispatch:192-262
      contract); agents include the snippets in their working context;
      Step 3 serial-commit gate is the harness's authoritative committer
      while the snippet contract documents the integration-branch invariant
      to agents.
    - If Phase 0 (a) FAIL: this story IS NOT IMPLEMENTED — instead, the
      maintainer is consulted at this story's research step to choose Plan
      B (b) per-unit-PR or (c) worktree-per-story-isolation + serialized
      merge. The chosen Plan B path is implemented in this story's body
      (renamed if structurally different).

  This story is structurally PARALLEL to cwfp-s2-3 but logically sits inside
  Step 1 of that skill; separate story for review-granularity.

acceptance_criteria:
  - "Given Phase 0 (a) PASS verdict in cycle-state spike_outcome, when this story implements, then workflow_assembly substep injects the shell-snippet contract into agent prompts mirroring multica-story-dispatch:192-262"
  - "Given Phase 0 (a) FAIL verdict, when research step fires, then the maintainer is consulted on Plan B (b) vs (c) before implementation begins; the choice is recorded in cycle-state"
  - "Given the chosen path (a / b / c), when this story commits, then the integration-branch invariant (single-branch / ≥1-commit-per-story / fast-forward) is preserved"
  - "Given the shell-snippet contract injection, when cwfp-s2-3 Step 3 serial-commit gate runs, then the adapter remains the authoritative committer (agents do NOT write to .git directly even when they have shell-snippet context)"

steps:
  - id: research
    description: |
      Read cwfp-s1-1 spike_outcome block in cycle-state; determine Phase 0
      (a) verdict; if PASS, proceed to implement. If FAIL, escalate to
      team-lead for maintainer consultation on Plan B (b vs c); record
      chosen path in cycle-state before continuing.
    agent: researcher
  - id: implement
    description: |
      Path (a) — Add shell-snippet injection logic to workflow_assembly
      substep of skills/hive/skills/execute-mode-cc-workflows/SKILL.md
      (defined in cwfp-s2-3). Snippets: fetch + checkout + reset +
      commit-with-story-id + rebase-and-push 3-retry. Mirror
      multica-story-dispatch/index.mjs:192-262 via copy-with-attribution
      (D1).
      Path (b) or (c) — implement chosen Plan B; rename story title if
      needed; ensure integration-branch invariant preserved.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Doc-test: shell-snippet contract present in workflow_assembly substep
      (path a) or chosen Plan B mechanism present (path b/c).
      Integration test: re-run cwfp-s2-5's MVP E2E run with this story's
      injection live; verify ≥1 commit per story still lands on integration
      branch; verify no agent .git writes observed (adapter remains
      authoritative committer).
    agent: tester
    depends_on: [implement]
  - id: review
    description: |
      Architect review on chosen path's integration-branch invariant
      preservation; reviewer cross-checks copy-with-attribution discipline
      (D1) honored if path (a).
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: |
      Commit "[cwfp-s2-6] feat(cc-workflows): Q2 (a) shell-snippet
      integration-branch contract" (or rename per chosen Plan B).
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: skills/hive/skills/execute-mode-cc-workflows/SKILL.md
      purpose: workflow_assembly substep gets the shell-snippet injection logic added inside Step 1
    - path: hive/lib/multica-story-dispatch/index.mjs
      purpose: Lines 192-262 are the canonical shell-snippet contract this story mirrors
    - path: .pHive/cycle-state/cc-workflows-first-party.yaml
      purpose: spike_outcome block carries Phase 0 (a) verdict; research step reads it

files_to_modify:
  - file: skills/hive/skills/execute-mode-cc-workflows/SKILL.md
    change: ADD shell-snippet injection logic to workflow_assembly substep (path a) OR ADD chosen Plan B mechanism (path b/c)

design_decisions:
  - decision: Story is structurally separate from cwfp-s2-3 despite living inside the same SKILL.md
    rationale: Review-granularity — the shell-snippet contract is the load-bearing Q2 mechanism; separate story makes its review surface distinct from the broader Step 0-5 skill scaffold
  - decision: Story is Phase-0-conditional in shape, not just content
    rationale: gate_decisions.Q2 maintainer-confirmed (a) conditional; if (a) FAIL, the story implements Plan B and may be renamed; this story's identity is "implement Q2 resolution" not "implement (a)"

cross_cutting:
  - concern: documentation
    action: workflow_assembly substep is doc; this story's deliverable is part of the cwfp-s2-3 SKILL.md
  - concern: simulated-manual
    action: Test step re-runs cwfp-s2-5's MVP E2E run to verify; same simulated-manual replay carrier (mvp-validation.md)

risks:
  - severity: high
    description: Phase 0 (a) FAIL forces Plan B selection mid-Phase-2 implementation, disrupting slice scope
    mitigation: Research step gates on cycle-state spike_outcome read; team-lead consultation produces a recorded decision before implementation; slice scope absorbs the path change because cwfp-s2-3's outer seam is invariant
  - severity: medium
    description: 'Plan B (b) per-unit-PR bends git_flow.branch_strategy: per-epic'
    mitigation: If chosen, cycle-state gate_decisions entry + memory feedback_git_flow_per_epic update flags the deviation; epic-level review surfaces it
  - severity: low
    description: Path (a) shell-snippet injection produces agent prompts that exceed model context budget
    mitigation: Mirror multica-story-dispatch:192-262 fidelity — those snippets are bounded and have shipped Multica dispatch for the epic to-date; same bounded size

references:
  - path: .pHive/epics/cc-workflows-first-party/docs/design-discussion.md
    relevant_excerpt: |
      §3 Phase 2 — Serial-commit gate mechanism (architect-v2 UNIFIED MOVE). Q2 (a) shell-snippet contract injection holds IFF Phase 0 (a) confirms /workflows honors free-form prompts; ELSE fallback is worktree-per-story isolation (CC-native primitive) + serialized merge.
  - path: .pHive/cycle-state/cc-workflows-first-party.yaml
    relevant_excerpt: |
      gate_decisions.open_questions.Q2: agree (a) shell-snippet integration-branch IF /workflows honors it.

metric:
  applies: false
  justification: Mechanism-level story conditional on Phase 0 verdict; the metric-bearing surface is cwfp-s2-5's MVP E2E run which exercises the chosen path; this story implements the path but its success metric reduces to "MVP E2E pass" (already metric-bearing via cwfp-s2-5).
