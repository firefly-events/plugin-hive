design_decisions:
- decision: Posture (i) "Hive composes ON Claude Code"
  rationale: Q9 maintainer-confirmed at gate 1; durable placement in CONTEXT.md cwfp-s6-2; README hero reflects same posture
- decision: Demote, don't deprecate Multica references
  rationale: "User framing at gate 1 explicit \u2014 \"Don't deprecate Multica. Demote it from default to opt-in\""
- decision: Phase 6 placement is intentional (lands AFTER Phases 1-5)
  rationale: "gate_3_decisions.D3 + design-discussion \xA710 \u2014 README is output of design, not anchor; language reflects shipped behavior"
cross_cutting:
- concern: documentation
  action: README IS canonical North Star; this story IS the doc change. cwfp-s6-2 carries the CONTEXT.md companion
- concern: versioning
  action: README.md version badge bump is handled by the LAST commit on the epic branch per cross-cutting concern 'versioning' (TPM-owned); this story rewrites content, NOT the version badge
risks:
