description: "Rewrite README.md hero (lines 1-20) + Quick Start step 1 per Q9 (i)\nmaintainer-confirmed reframe \"Hive composes ON Claude Code\".\n\nHero (sketch \u2014 exact wording at implementation):\n\
  \  \"Hive composes ON Claude Code: first-party CC workflows for in-session\n  execution; second-party Multica for codex co-mingling, headless\n  webhooks, and durable cross-session issue queue.\"\n\n\
  Quick Start step 1:\n  OLD: /hive:multica-init as \"Bootstrap Multica as the execution substrate\"\n  NEW: CC-workflows-first onboarding (verify CC 2.1.154+; opt-in via\n       execution.runtime: workflows\
  \ or default 'auto')\n  Multica step demoted to step 2 (or later): \"Optional: bootstrap\n  Multica for codex co-mingling / headless webhooks / durable queue\"\n\nPreserve all Multica references (don't\
  \ deprecate \u2014 demote).\n\nThis is the canonical North Star edit per memory feedback_check_readme_first.\nLands AFTER Phases 1-5 ship so language reflects shipped behavior, not\naspiration (defended\
  \ in design-discussion \xA710 vs grill C3).\n"
acceptance_criteria:
- "Given README.md after this story commits, when the hero is read, then it expresses Q9 (i) reframe \u2014 'Hive composes ON Claude Code' or equivalent \u2014 and references first-party CC workflows +\
  \ second-party Multica with the three Multica moats"
- Given Quick Start step 1, when read, then it leads with a CC-workflows-first onboarding step (verify CC 2.1.154+; opt-in via execution.runtime), NOT /hive:multica-init
- Given the prior Multica references in README.md, when this story commits, then no reference is removed; Multica content is demoted (later steps / optional positioning)
- Given any code samples in README.md (commands, paths), when validated, then they resolve in the current worktree state
- Given a fresh consumer reading the rewritten README, when they follow Quick Start step 1, then they can bootstrap CC-workflows-first execution successfully
steps:
- id: research
  description: 'Read README.md fully (current 1-20 hero + Quick Start steps). Read

    cwfp-s5-5''s project memory notes for the current operational state.

    Read CONTEXT.md for the existing "Composability" posture statement

    (to be paralleled in cwfp-s6-2).

    '
  agent: researcher
- id: implement
  description: 'Rewrite hero (lines 1-20) per Q9 (i). Rewrite Quick Start step 1.

    Demote /hive:multica-init step (move to step 2+ with "Optional"

    framing). Preserve all other content.

    '
  agent: technical-writer
  depends_on:
  - research
- id: test
  description: 'Doc-test: cite each path/command in README.md and verify it resolves

    in the worktree state (Read each cited path; verify each cited

    command exists in skills/).

    Fresh-consumer test: a reviewer unfamiliar with the new framing

    follows Quick Start step 1; confirms they can bootstrap CC-workflows-

    first execution without confusion.

    '
  agent: tester
  depends_on:
  - implement
- id: review
  description: 'Maintainer review on positioning correctness (Q9 (i) reframe captured).

    Reviewer confirms no Multica references removed (demoted only).

    Architect-optional: cross-check hero against CONTEXT.md posture

    statement (cwfp-s6-2 lands in parallel).

    '
  agent: reviewer
  depends_on:
  - test
- id: integrate
  description: 'Commit "[cwfp-s6-1] docs(readme): rewrite hero + Quick Start for first-party CC workflows per Q9 (i)"'
  agent: developer
  depends_on:
  - review
