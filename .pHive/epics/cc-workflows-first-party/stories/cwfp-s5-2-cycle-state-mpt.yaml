design_decisions:
  - decision: Adapter is 'multica' (not 'cc-workflows')
    rationale: Q3 maintainer-confirmed at gate 1 — keep-as-second-party for first release; routes /plan + /test --simulated-manual through Multica
  - decision: Explicit execution.runtime choice (workflows or multica) overrides this per-epic block
    rationale: Q4 invariant — explicit always wins; per-epic-override is only for the 'auto' heuristic case

cross_cutting:
  - concern: documentation
    action: Cycle-state file IS the data; downstream consumers (cwfp-s2-2 resolver, /plan + /test entry points) read it
  - concern: simulated-manual
    action: This story's execution_runtime block IS the routing mechanism that keeps /test --simulated-manual on Multica per Q3; verify in test step via cwfp-s2-2 resolver assertion

risks:
  - severity: medium
    description: Mid-epic flip — maintainer reconsiders Q3 and chooses supersede for mpt
    mitigation: Flag-don't-act per V plan §6 moldability cross-epic-ripples; revisit Q3 with maintainer before changing this file
  - severity: low
    description: File doesn't exist yet
    mitigation: Story creates if absent

references:
  - path: .pHive/cycle-state/cc-workflows-first-party.yaml
    relevant_excerpt: |
      gate_decisions.open_questions.Q3: agree keep-as-second-party first release.
      gate_decisions.open_questions.Q4: agree auto + per-epic disposition overrides heuristic.
  - path: .pHive/epics/cc-workflows-first-party/docs/structured-outline.md
