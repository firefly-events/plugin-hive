id: cwfp-s5-2-cycle-state-mpt
epic: cc-workflows-first-party
title: Write per-epic-override cycle-state for multica-plan-test-cycles
status: pending
complexity: low
methodology: classic
depends_on:
  - cwfp-s2-2-dispatch-enum-and-field-sources
  - cwfp-s4-2-disposition-pass-mpt

description: |
  Create or modify .pHive/cycle-state/multica-plan-test-cycles.yaml with an
  execution_runtime block: adapter: 'multica' (Q3 maintainer-confirmed
  keep-as-second-party for first release). This routes /plan + /test
  --simulated-manual through Multica via the per-epic-override mechanism
  (cwfp-s2-2 resolver).

  Critical invariant — Q4 + Q3 + per-epic-override unified rule: even when
  execution.runtime: auto is the shipped baseline, this override forces the
  resolver to emit mode_decision: 'multica' for this epic. `auto` MUST NOT
  silently route mpt /plan + /test routes away from Multica until this
  cycle-state file lands.

  Schema:
    execution_runtime:
      adapter: 'multica'
      rationale: |
        Q3 keep-as-second-party for first release; mpt routed /plan +
        /test --simulated-manual through Multica via PR #234 (merged
        2026-05-28). Revisit after first-party PR-flow + persona surface
        settle.
      decided_by: 'cc-workflows-first-party/cwfp-s5-2-cycle-state-mpt'
      decided_at: <ISO timestamp>

acceptance_criteria:
  - "Given .pHive/cycle-state/multica-plan-test-cycles.yaml, when read, then it has an execution_runtime block with adapter: 'multica' + Q3 rationale + decided_by + decided_at"
  - "Given cwfp-s2-2's resolver is live + this file present, when execution.runtime: auto for an mpt story dispatch, then mode_decision is forced to 'multica' + field_sources.execution_runtime.epic_override records this file path"
  - "Given execution.runtime is explicit 'workflows', when an mpt dispatch fires, then per-epic-override does NOT override; explicit choice wins (preserves Q4 invariant — explicit choice always wins)"
  - "Given the file may already exist (e.g. carries other blocks), when this story modifies, then existing blocks are preserved"

steps:
  - id: implement
    description: |
      Create or modify .pHive/cycle-state/multica-plan-test-cycles.yaml with
      the execution_runtime block. Preserve any existing blocks. Cite
      cwfp-s4-2's disposition-pass-mpt.md as the rationale source and Q3
      maintainer-confirmed gate-1 decision.
    agent: developer
  - id: test
    description: |
      Unit assertion 1: Given the file present + execution.runtime: auto
      for an mpt story dispatch, cwfp-s2-2's resolver emits mode_decision:
      'multica' with epic_override path set.
      Unit assertion 2: Given execution.runtime: workflows explicit, the
      override does NOT trigger (explicit wins).
    agent: tester
    depends_on: [implement]
  - id: review
    description: Reviewer checks Q3 rationale cited; existing blocks preserved; explicit-wins invariant tested
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: 'Commit "[cwfp-s5-2] feat(cycle-state): execution_runtime: multica for multica-plan-test-cycles per Q3 keep-as-second-party"'
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: .pHive/cycle-state/multica-plan-test-cycles.yaml
      purpose: Target file
    - path: .pHive/epics/cc-workflows-first-party/docs/disposition-pass-mpt.md
