name: marketing-team
title: Marketing team — conditional, consumer-gated marketing/ad personas
description: |
  Add a multi-persona marketing/advertising team to Hive (strategist + copywriter
  + ad-creative), selectable for consumer-facing projects when marketing/campaign
  work is detected, gated OFF for hive's own work (mirrors ui-designer). Includes
  a /marketing-campaign entry skill (analogous to /design), a shared visual-asset
  render skill (Frame0 + image-gen) adaptable by multiple agents, and user docs. Personas are
  authored against verified, current Claude Code + Codex agent-config specs
  (full config, dual-dispatch safe) per .pHive/epics/marketing-team/docs/agent-config-grounding.md.
target_codebase: /Users/don/.claude/worktrees/hive-composability-design
methodology: classic
version_bump: none

git_flow:
  base_branch: develop
  branch_strategy: per-epic

stories:
  - id: b1-marketing-strategist-persona
    title: Author the marketing-strategist persona (team lead)
    complexity: medium
    depends_on: []
  - id: b2-marketing-copywriter-persona
    title: Author the marketing-copywriter persona
    complexity: medium
    depends_on: []
  - id: b3-ad-creative-persona
    title: Author the ad-creative persona
    complexity: medium
    depends_on: []
  - id: b4-wire-marketing-team-into-planning
    title: Wire the marketing team into planning selection + specialist-triggers (consumer-gated)
    complexity: medium
    depends_on: [b1-marketing-strategist-persona, b2-marketing-copywriter-persona, b3-ad-creative-persona]
  - id: b5-marketing-campaign-skill
    title: /marketing-campaign entry skill — strategist → copy → creative, user-reviewed
    complexity: medium
    depends_on: [b1-marketing-strategist-persona, b2-marketing-copywriter-persona, b3-ad-creative-persona, b7-shared-visual-asset-skill]
  - id: b7-shared-visual-asset-skill
    title: Shared visual-asset skill (Frame0 + image-gen) adaptable by multiple agents
    complexity: medium
    depends_on: []
  - id: b6-marketing-team-docs
    title: User docs for the marketing team + /marketing-campaign
    complexity: low
    depends_on: [b1-marketing-strategist-persona, b2-marketing-copywriter-persona, b3-ad-creative-persona, b4-wire-marketing-team-into-planning, b5-marketing-campaign-skill, b7-shared-visual-asset-skill]
