id: b7-shared-visual-asset-skill
epic: marketing-team
title: Shared visual-asset skill (Frame0 + image-gen) adaptable by multiple agents
status: pending
tracker_id: plugin-hive/PLU-377

complexity: medium
methodology: classic
depends_on: []

parallel_allowed: true
parallel_rationale: bounded-slice

description: |
  Maintainer decision #3: extract visual rendering into ONE shared skill that
  multiple agents can adapt, instead of baking Frame0 / image-generation into a
  single persona. Today the capability is split — ui-designer uses the Frame0 CLI
  for wireframes, and logo-exploration uses the openai-image MCP for generated
  imagery. This story unifies them behind a single agent-facing skill so
  ad-creative, ui-designer, and logo-exploration all call the same surface.

  Skill: skills/hive/skills/visual-asset/SKILL.md — an agent-facing sub-skill
  (referenced in personas' `skills:` frontmatter), NOT a top-level user command.
  It takes a structured visual spec (prompt + medium) and produces an asset via
  the appropriate backend:
    - vector/wireframe spec → Frame0 CLI (.f0), as ui-designer does today
    - raster/photographic/ad-creative spec → image-gen via the openai-image MCP,
      as logo-exploration does today
  It writes the asset to a caller-supplied output dir and returns the path(s).

  "Adaptable" = the skill exposes a backend-agnostic interface; each calling agent
  passes its own medium + output location. The skill owns the tool plumbing
  (Frame0 invocation, image MCP calls, fallbacks) so personas stay declarative.

  Scope guard: this story creates the shared skill and points existing callers at
  it where trivial; it does NOT rewrite logo-exploration or the /design wireframe
  protocol wholesale (those are larger refactors, follow-on if desired).

acceptance_criteria:
  - "Given a visual spec with medium=vector, when the skill runs, then it produces a Frame0 asset via the Frame0 CLI and returns its path; if Frame0 is unavailable it falls back to an ASCII/text layout spec (mirrors ui-designer required_tools fallback)."
  - "Given a visual spec with medium=raster, when the skill runs, then it produces a generated image via the openai-image MCP and returns its path; if the MCP is unavailable it returns the rendered prompt(s) for manual generation."
  - "Given any caller, then the skill accepts a caller-supplied output directory and does not hard-code a marketing-specific path (so ui-designer / logo-exploration can reuse it)."
  - "Given the skill, then ad-creative (b3) and /marketing-campaign (b5) reference it as their render backend, and the skill is documented as adaptable by ui-designer + logo-exploration."
  - "The skill follows the agent-facing sub-skill conventions under skills/hive/skills/ (frontmatter, use-when)."

steps:
  - id: research
    description: |
      Read how ui-designer invokes Frame0 (required_tools cli-anything-frame-zero +
      fallback) and how logo-exploration calls the openai-image MCP. Identify the
      common interface (spec in, asset path out) and the two backends + their
      fallbacks. Confirm the agent-facing sub-skill conventions under skills/hive/skills/.
    agent: researcher
  - id: implement
    description: |
      Author skills/hive/skills/visual-asset/SKILL.md with a backend-agnostic
      interface (medium: vector|raster, prompt/spec, output_dir) dispatching to
      Frame0 or the image MCP, each with the documented fallback. Keep callers
      declarative. Note adaptation points for ui-designer / logo-exploration.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Verify vector path produces/falls-back correctly, raster path produces/falls-back
      correctly, and the output dir is caller-supplied. Validate sub-skill frontmatter.
    agent: tester
    depends_on: [implement]
  - id: review
    description: |
      Confirm the interface is genuinely backend-agnostic and reusable (no marketing
      hard-coding), fallbacks match the existing ui-designer / logo-exploration behavior,
      and b3 + b5 can consume it.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to the feature branch.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/.claude/worktrees/hive-composability-design
  key_files:
    - path: hive/agents/ui-designer.md
      purpose: "Frame0 CLI usage + required_tools fallback pattern to fold into the shared skill."
    - path: skills/logo-exploration/SKILL.md
      purpose: "openai-image MCP usage + contact-sheet/render pattern — the raster backend reference."
    - path: skills/design/SKILL.md
      purpose: "Wireframe-protocol context; a future caller of the shared skill."

files_to_modify:
  - file: skills/hive/skills/visual-asset/SKILL.md
    change: "New shared, agent-facing visual-asset render skill (Frame0 + image-gen)."

design_decisions:
  - decision: One shared skill, two backends (vector=Frame0, raster=image-gen)
    rationale: "Maintainer #3 — render capability is reusable across ad-creative, ui-designer, logo-exploration; centralizing avoids three divergent implementations."
  - decision: Agent-facing sub-skill, not a top-level command
    rationale: "Personas reference it via skills: frontmatter; it is plumbing, not a user-invoked ceremony (that is /marketing-campaign, /design, /logo-exploration)."

cross_cutting: []

metric:
  applies: false
  justification: "Shared substrate skill; deliverable is the reusable render surface. Reuse breadth is a design outcome, not a falsifiable product metric for this story."

risks:
  - severity: medium
    description: "Over-reaching into a full rewrite of logo-exploration / wireframe-protocol."
    mitigation: "Scope guard: create the shared skill + trivial caller wiring only; wholesale caller migration is follow-on."
  - severity: low
    description: "Backend unavailability (Frame0 / image MCP) at runtime."
    mitigation: "Documented fallbacks per backend (text layout / rendered prompts), matching existing behavior."

references:
  - path: hive/agents/ui-designer.md
    relevant_excerpt: |
      required_tools: cli-anything-frame-zero (cli) with fallback "Produce text-based
      layout specs and ASCII mockups instead of .f0 files" — the vector backend + fallback.
  - path: skills/logo-exploration/SKILL.md
    relevant_excerpt: |
      Generates image-backed candidates via the openai-image MCP tool — the raster
      backend the shared skill wraps.
