id: b5-campaign-entry-skill
epic: marketing-team
title: /campaign entry skill — strategist → copy → creative ceremony
status: pending
complexity: medium
methodology: classic
depends_on: [b1-marketing-strategist-persona, b2-marketing-copywriter-persona, b3-ad-creative-persona]

parallel_allowed: true
parallel_rationale: bounded-slice

description: |
  Give the marketing team an invocation surface, analogous to how /design is the
  entry skill for the UI team. /campaign runs the team ceremony:
  marketing-strategist produces a campaign brief (positioning, audience, channels,
  message), then marketing-copywriter and ad-creative consume that brief to
  produce copy and creative concepts. Output lands in .pHive/campaigns/<topic>/
  with a handoff index, mirroring .pHive/design/ + index.yaml.

  Callable standalone (`/campaign <brief>`) or atomically from /plan on a
  marketing-detected story (`--from-plan <story-id>`), the same dual-mode contract
  /design uses. /plan should delegate to /campaign rather than inlining the
  ceremony (atomic external call, per the /design precedent in plan step 16).

acceptance_criteria:
  - "Given a campaign brief, when /campaign runs, then marketing-strategist emits a campaign brief artifact, then copywriter + ad-creative emit copy + creative concepts consuming it, written under .pHive/campaigns/<topic>/."
  - "Given the run completes, then a handoff entry is registered in .pHive/campaigns/index.yaml (topic, artifacts, status)."
  - "Given /campaign is invoked with --from-plan <story-id>, when it completes, then the handoff entry exists and the marketing-detected story can proceed to execution (blocking-gate contract mirrors /design)."
  - "The skill is listed in the plugin skills and follows the SKILL.md frontmatter conventions of existing top-level skills."

steps:
  - id: research
    description: |
      Read skills/design/SKILL.md and the wireframe-protocol / handoff-index
      pattern (.pHive/design/index.yaml). Mirror its structure: dual-mode entry,
      persona ceremony, output dir, handoff registration, blocking-gate contract.
    agent: researcher
  - id: implement
    description: |
      Author skills/campaign/SKILL.md: frontmatter + ceremony (strategist brief →
      copywriter + ad-creative handoff), output to .pHive/campaigns/<topic>/,
      register .pHive/campaigns/index.yaml. Add the /plan step-16-style atomic
      delegation note so plan can call /campaign without inlining it.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Verify standalone and --from-plan modes produce the output dir + index
      entry; verify the blocking-gate contract (story not execution-ready until
      handoff exists). Validate SKILL.md frontmatter parses like sibling skills.
    agent: tester
    depends_on: [implement]
  - id: review
    description: |
      Confirm /campaign mirrors /design's atomic-boundary discipline (ceremony
      lives in /campaign, not inlined in /plan) and the personas are dispatched,
      not improvised.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to the feature branch.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/.claude/worktrees/hive-composability-design
  key_files:
    - path: skills/design/SKILL.md
      purpose: "Entry-skill precedent: dual-mode (standalone + --from-plan), persona ceremony, handoff index, blocking gate. /campaign mirrors it."
    - path: skills/plan/SKILL.md
      purpose: "Step 16 shows the atomic external-call delegation pattern (/plan delegates UI ceremony to /design); /campaign is the marketing analogue."

files_to_modify:
  - file: skills/campaign/SKILL.md
    change: "New entry skill for the marketing team ceremony."

design_decisions:
  - decision: Mirror /design exactly (dual-mode, handoff index, atomic boundary)
    rationale: "The UI team's entry-skill pattern is proven; reusing it keeps the marketing team consistent with Hive conventions and lets /plan delegate atomically instead of inlining the ceremony."

cross_cutting: []

metric:
  applies: false
  justification: "New process/entry skill; its value is enabling the team ceremony. No falsifiable product metric — exercised and verified by its own tests and by downstream consumer-project campaign runs."

risks:
  - severity: low
    description: "Skill name collision or divergence from /design conventions."
    mitigation: "Follow sibling-skill frontmatter; reviewer checks parity with /design."

references:
  - path: skills/design/SKILL.md
    relevant_excerpt: |
      /design is callable standalone or atomically from /plan; emits a
      .pHive/design/<topic>/ dir and registers a handoff in index.yaml. /campaign
      is the marketing-team analogue of this contract.
