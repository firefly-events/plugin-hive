id: b2-marketing-copywriter-persona
epic: marketing-team
title: Author the marketing-copywriter persona
status: in_progress
tracker_id: plugin-hive/PLU-375

complexity: medium
methodology: classic
depends_on: []

parallel_allowed: true
parallel_rationale: variation

description: |
  Author hive/agents/marketing-copywriter.md — produces persuasive copy across
  surfaces (ad copy, landing/email/social copy, taglines, CTAs) from the
  marketing-strategist's campaign brief (b1). Consumer-projects only, gated off
  hive's own work like ui-designer.

  MUST be authored against the dual-runtime contract in
  .pHive/epics/marketing-team/docs/agent-config-grounding.md — full agent config,
  dispatched to BOTH Claude Code Agent tool and Codex backend (dual-dispatch
  mapping §3, reviewer checklist §4).

acceptance_criteria:
  - "Given the persona file, then frontmatter has all 5 Claude Code fields plus Hive knowledge + domain, mirroring hive/agents/ui-designer.md."
  - "Given the dual-dispatch contract, then `model` is a tier word, and the body works verbatim as a standalone system prompt (== Codex developer_instructions)."
  - "Given tool restriction, then it is expressed both as a `tools` allowlist and in prose."
  - "Given the role boundary, then the persona consumes the strategist brief and stays in its lane (copy, not strategy or visual creative)."
  - "No behavior-critical instruction lives only in a Hive-only or Claude-Code-only field (grounding §4)."

steps:
  - id: research
    description: Read agent-config-grounding.md + ui-designer.md + the strategist persona (b1) output format so copy outputs consume the brief cleanly.
    agent: researcher
  - id: implement
    description: |
      Write hive/agents/marketing-copywriter.md per the grounding contract:
      frontmatter, Hive knowledge/domain, 150–400 word standalone-system-prompt
      body. Define copy output format (per-surface copy blocks consuming the brief).
    agent: developer
    depends_on: [research]
  - id: review
    description: Run grounding §4 reviewer checklist; confirm dual-backend safety and clean role boundary vs strategist/ad-creative.
    agent: reviewer
    depends_on: [implement]

context:
  codebase: /Users/don/.claude/worktrees/hive-composability-design
  key_files:
    - path: .pHive/epics/marketing-team/docs/agent-config-grounding.md
      purpose: "Authoring contract — full CC + Codex config + dual-dispatch mapping."
    - path: hive/agents/ui-designer.md
      purpose: "Structural template + consumer-gating precedent."

files_to_modify:
  - file: hive/agents/marketing-copywriter.md
    change: "New copywriter persona."

design_decisions:
  - decision: Copywriter consumes the strategist brief, owns no strategy
    rationale: "Clear division of labor across the team; brief-driven copy mirrors the /design handoff flow."

cross_cutting: []

metric:
  applies: false
  justification: "Persona-authoring substrate; deliverable is the agent definition. Copy quality is a downstream consumer-project outcome, not falsifiable here."

risks:
  - severity: low
    description: "Overlap with strategist (messaging) blurs the role boundary."
    mitigation: "Persona explicitly scopes to copy execution from the brief; reviewer checks the boundary."

references:
  - path: .pHive/epics/marketing-team/docs/agent-config-grounding.md
    relevant_excerpt: |
      Persona body is the one artifact both backends consume (CC system prompt ==
      Codex developer_instructions). Tool restriction in both allowlist and prose.
