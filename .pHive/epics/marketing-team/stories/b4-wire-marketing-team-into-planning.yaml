id: b4-wire-marketing-team-into-planning
epic: marketing-team
title: Wire the marketing team into planning selection + specialist-triggers (consumer-gated)
status: pending
complexity: medium
methodology: classic
depends_on: [b1-marketing-strategist-persona, b2-marketing-copywriter-persona, b3-ad-creative-persona]

parallel_allowed: true
parallel_rationale: bounded-slice

description: |
  Make the three marketing personas selectable by Hive's planning + execution
  machinery, gated to consumer projects only (hive's own work excluded, exactly
  as ui-designer is excluded — see feedback "hive has no UI").

  Two wiring surfaces:
  1. Planning-team selection: /plan Phase 0 assembles "core planning personas
     plus conditional architect/ui-designer selected from the requirement."
     Extend that conditional selection so the marketing team joins when
     marketing/campaign/go-to-market keywords fire AND project_type is consumer.
  2. Specialist-triggers catalog: add marketing trigger entries following the
     existing placement / responds_with contract. The execute skill branches
     ONLY on `placement` and `responds_with.type` (never on specific trigger
     IDs — forward-compat constraint, specialist-triggers.md lines 8-10), so new
     triggers require only catalog entries, no routing-logic changes.

  Detection keywords (case-insensitive): marketing, campaign, advertisement, ad,
  go-to-market, GTM, launch, positioning, brand campaign, copywriting, tagline,
  landing page, email campaign, social campaign. NOTE: some of these already
  trigger /plan's UI detection (e.g. "landing page", "marketing") — keep the
  marketing-team selection orthogonal to UI detection; both teams may be
  selected for the same requirement.

acceptance_criteria:
  - "Given a consumer-project requirement containing marketing keywords, when /plan Phase 0 assembles the team, then the marketing personas are included in the planning team."
  - "Given the hive plugin's own work (project_type != consumer), when /plan runs with marketing keywords present, then the marketing team is NOT selected (gated off), mirroring ui-designer exclusion."
  - "Given the specialist-triggers catalog, then marketing trigger entries exist with valid `placement` and `responds_with` fields, and execute routing consumes them without any change to its ID-agnostic branch logic."
  - "Given a non-marketing requirement, then no marketing persona is selected (no false-positive activation)."

steps:
  - id: research
    description: |
      Locate the conditional-persona selection logic in /plan Phase 0 and the
      planning-routing skill. Read specialist-triggers.md to match the exact
      catalog entry shape (placement, raised_by, responds_with). Find how
      project_type / consumer gating is expressed for ui-designer and reuse that
      exact mechanism.
    agent: researcher
  - id: implement
    description: |
      Add marketing detection + consumer-gated selection to the planning team
      assembly, and add marketing trigger entries to specialist-triggers.md.
      Reuse the ui-designer gating idiom verbatim; do not invent a new gate.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Verify selection fires for consumer + marketing keywords, stays off for
      hive project_type, and stays off for non-marketing requirements. Verify
      catalog entries validate against the specialist-triggers schema.
    agent: tester
    depends_on: [implement]
  - id: review
    description: |
      Confirm the gate matches the ui-designer precedent, no execute routing
      logic was changed (catalog-only extension), and marketing/UI selection
      remain orthogonal.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to the feature branch.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/.claude/worktrees/hive-composability-design
  key_files:
    - path: hive/references/specialist-triggers.md
      purpose: "Catalog of trigger IDs + placement rules; marketing triggers are added here. Execute routing is ID-agnostic, so this is the only routing surface."
    - path: skills/plan/SKILL.md
      purpose: "Phase 0 assembles conditional personas (architect/ui-designer) from the requirement — marketing selection extends this."
    - path: skills/hive/skills/planning-routing/SKILL.md
      purpose: "Owns team assembly + routing; marketing personas flow through here."
    - path: hive/agents/ui-designer.md
      purpose: "Reference for the consumer-only gating precedent to mirror."

files_to_modify:
  - file: hive/references/specialist-triggers.md
    change: "Add marketing trigger catalog entries (placement + responds_with)."
  - file: skills/plan/SKILL.md
    change: "Extend Phase 0 conditional-persona selection with consumer-gated marketing detection."
  - file: skills/hive/skills/planning-routing/SKILL.md
    change: "Accept marketing personas in assembled_personas / routing."

design_decisions:
  - decision: Catalog-only trigger extension, no execute routing change
    rationale: "specialist-triggers.md forward-compat constraint: execute branches only on placement + responds_with.type. Adding marketing as new catalog entries keeps routing untouched."
  - decision: Reuse ui-designer's consumer gate verbatim
    rationale: "A second gating mechanism would drift; the hive-has-no-UI precedent already encodes consumer-only conditional selection."

cross_cutting: []

metric:
  applies: false
  justification: "Wiring/substrate story — it makes personas selectable. Whether selection improves consumer-project planning quality is a downstream behavioral outcome measured (if at all) by future consumer-project runs, not by this wiring change."

risks:
  - severity: medium
    description: "Keyword overlap with /plan UI detection could double-select or mis-route."
    mitigation: "Keep marketing selection orthogonal to UI detection; both may select independently. Test the non-marketing and hive-project negative cases."

references:
  - path: hive/references/specialist-triggers.md
    relevant_excerpt: |
      The execute skill branches ONLY on `placement` and `responds_with.type` —
      never on specific trigger IDs. Adding a new trigger requires only a new
      catalog entry; no changes to execute routing logic.
