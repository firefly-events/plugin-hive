id: hpr-3-slack-app-and-secrets
epic: hermes-production-readiness
title: Slack app + webhook + secrets configuration
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  Foundation story (no deps). Create the Slack app and capture the credentials the
  inbound (hpr-1) and bootstrap (hpr-4) stories depend on. Without this there is no
  signing secret to verify inbound requests and no bot token to post confirmations.

  Scope:
  - Create a Slack app with interactivity enabled + the bot scopes needed to post to a
    channel/thread and receive interaction payloads (chat:write, plus interactivity
    request URL pointing at hpr-1's receiver — URL filled once hpr-1 lands).
  - Capture: signing secret, bot token (xoxb-), incoming webhook URL (outbound, already
    consumed by surface*Hook), target channel ID.
  - Store as Studio secrets — keychain or a root-only env file sourced by the Hermes
    runtime. NEVER committed to the repo. Provide a reproducible runbook so the app can
    be recreated/rotated.

  Mostly ops + Slack-admin, not code. Deliverable on the repo side = the runbook +
  the documented env var names the receiver/cron expect (no secret values).

acceptance_criteria:
  - "A Slack app exists with interactivity enabled and chat:write; its signing secret, bot token, webhook URL, and channel ID are recorded as Studio secrets (keychain/env), not in the repo."
  - "The Hermes runtime can read the signing secret + bot token from the agreed env var names (documented), so hpr-1's receiver and outbound posts authenticate."
  - "A runbook documents app creation, scope list, secret storage location, and rotation — reproducible without tribal knowledge."
  - "git-grep confirms no secret value (token, signing secret) is committed anywhere in the repo."

steps:
  - id: implement
    description: Create the Slack app + scopes + interactivity; capture credentials; store in Studio keychain/env under documented names; write the runbook.
    agent: developer
  - id: review
    description: Verify no secret committed; verify env var names match what hpr-1/hpr-4 expect; verify rotation steps.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit the runbook (no secrets) to feat/hermes-production-readiness; document env var contract in operations-guide.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: hive/lib/hermes-reconciler/slack-notify-await.mjs
      purpose: surface*Hook already consumes the outbound webhook; hpr-1 will consume the signing secret + bot token captured here.
  notes: |
    Env var name contract is the load-bearing repo-side artifact (e.g.
    HERMES_SLACK_SIGNING_SECRET, HERMES_SLACK_BOT_TOKEN, HERMES_SLACK_CHANNEL_ID,
    HERMES_SLACK_WEBHOOK_URL) — hpr-1 and hpr-4 read these names.

cross_cutting:
  - concern: security
    action: "Secrets in Studio keychain/env only; never committed; runbook documents rotation."

metric:
  applies: false
  justification: "Pure provisioning/ops story — creating a Slack app and storing secrets has no observable runtime metric of its own; its value is realized only when hpr-1's signed receiver authenticates against these credentials, which hpr-1's metric measures."

risks:
  - severity: medium
    description: Secret leaks into repo or logs.
    mitigation: keychain/env only; git-grep gate in review; documented redaction.
  - severity: low
    description: Scope/interactivity misconfig blocks hpr-1 later.
    mitigation: scope list pinned in the runbook; interactivity URL wired when hpr-1 lands.

references:
  - path: hive/references/orchestrator-skills/slack-notify-await.md
    relevant_excerpt: "notify-and-await posts to Slack and awaits a human verdict — this story provisions the Slack side."
