id: hpr-1-inbound-slack-resolve-gate
epic: hermes-production-readiness
title: Inbound Slack action → resolveGate (the loop-closer)
status: complete
complexity: high
methodology: classic
depends_on: [hpr-3-slack-app-and-secrets]

description: |
  THE LOOP-CLOSER. Today only the OUTBOUND half exists: surfaceVerdictHook /
  surfaceErrorHook post a verdict/error to a Slack webhook. The RETURN PATH is
  missing — a human's Slack reply (approve / continue / revise / reject) must reach
  resolveGate(cycleStatePath, {storyId, action}). Without it the gate latches
  review_awaiting_human but the human cannot resolve it from Slack; the loop stalls.

  resolveGate (hive/lib/hermes-reconciler/slack-notify-await.mjs:221) is ALREADY BUILT
  + tested (precondition guard: must be review_awaiting_human; approve→story done;
  revise→dispatched_impl attempt++; reject→rejected; continue→resume). This story builds
  the TRANSPORT that invokes it.

  Two slices:
  - REPO slice (plugin-hive): extend buildVerdictMessage/buildErrorMessage to emit Block
    Kit blocks with action buttons whose value encodes {epic_handle, story_id, action};
    keep the plain-text fallback. Add a thin, testable resolveGate-invoker entrypoint
    (parse {epic_handle, story_id, action} → cycleStatePath → resolveGate) so the Studio
    receiver stays a thin HTTP shell over tested logic.
  - STUDIO slice (~/Code/hermes-agent): an HTTP endpoint reachable by Slack
    (interactivity request URL) that verifies the Slack request signature BEFORE any
    state write, parses the payload, calls the resolveGate-invoker, and posts a thread
    confirmation. Candidate: extend mcp_serve.py (it already exposes permissions_list_open
    / permissions_respond, which map conceptually onto notify-and-await) vs a small
    dedicated receiver — decide in research.

mechanism_options:
  - "Interactive Block Kit buttons on the verdict/error message (RECOMMENDED — best UX): action_id/value encodes {epic_handle, story_id, action}; Slack POSTs to the interactivity request URL."
  - "Slash command /hive-gate <approve|revise|reject> <epic> [story] — simpler, no buttons, human types it."
  - "Events API + bot-mention parsing — most flexible, most build."

acceptance_criteria:
  - "Given a surfaced gate (review_awaiting_human), when the human clicks approve/revise/reject in Slack, then the corresponding resolveGate action runs and the gate transitions per the contract."
  - "Given a Slack interaction payload, when received, then its signature is verified (X-Slack-Signature HMAC-SHA256 over v0:timestamp:body with the signing secret, timestamp freshness checked) BEFORE any state write — unsigned/forged/stale requests are rejected with no state change."
  - "Given the payload, when parsed, then epic_handle + story_id + action are extracted unambiguously (encoded in action_id/value, not free text)."
  - "Given resolveGate throws (stale gate, unknown story, not review_awaiting_human), when it fails, then the human gets a clear Slack error reply and NO state change occurs."
  - "Given a successful resolve, when done, then a confirmation is posted to the Slack thread (e.g. 'story X → done')."
  - "buildVerdictMessage/buildErrorMessage emit Block Kit blocks with the encoded buttons AND retain a text fallback; existing slack-notify-await.test.mjs assertions still pass."

steps:
  - id: research
    description: |
      Confirm the Slack signing contract (header names X-Slack-Signature /
      X-Slack-Request-Timestamp, v0 basestring). Decide receiver host: extend
      hermes-agent mcp_serve.py (reuse permissions_* surface) vs dedicated receiver.
      Read the existing buildVerdictMessage/buildErrorMessage + resolveGate + their tests.
    agent: researcher
  - id: implement
    description: |
      REPO: extend buildVerdictMessage/buildErrorMessage to emit Block Kit + text
      fallback; add resolveGate-invoker entrypoint (parse encoded action → resolveGate).
      STUDIO: build the signed HTTP receiver in hermes-agent calling the invoker; post
      thread confirmation. Secrets read from Studio env/keychain (hpr-3), never hardcoded.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Repo: unit-test Block Kit emission (encoded value round-trips) + the invoker
      (valid action resolves; bad action / missing fields error). Signature-verification
      unit test with a known good/forged signature. Verify slack-notify-await.test.mjs
      still green. Studio: smoke-test the receiver end-to-end against a fixture payload.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review for the no-state-write-before-signature invariant, secret handling (no leak in logs), and contract alignment with resolveGate.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit repo slice to feat/hermes-production-readiness; commit Studio slice to hermes-agent; note the cross-repo split in the commit body.
    agent: developer
    depends_on: [review]

