cross_cutting:
  - concern: security
    action: "Slack request-signature verification (HMAC-SHA256, timestamp freshness) is mandatory and precedes any state write; redact signature/token in logs."

metric:
  applies: true
  name: hermes.gate_resolve_roundtrip_ok
  direction: up
  unit: boolean-per-attempt
  baseline: "0 (no inbound path exists)"
  target: "1 (a Slack click resolves the gate end-to-end)"
  window: story-integrate
  source:
    kind: manual
