risks:
  - severity: high
    description: An unauthenticated receiver lets anyone resolve gates (bypass the human gate entirely).
    mitigation: Signature verification is an AC, not optional. No state write before the signature check passes.
  - severity: medium
    description: Cross-repo slice (repo + hermes-agent) — review/CI sees only the repo half.
    mitigation: Repo slice fully tested in-repo; Studio slice smoke-tested on-host; commit bodies cross-link.

