id: s5-tests-and-schema
epic: plan-dag-cutover
title: "tests, schema doc, graduation registry — cutover acceptance + parity + Order 10"
status: in_progress
complexity: low
methodology: classic
depends_on:
  - s4-gate-signals

description: |
  Close the epic with four deliverables:

  1. **Cutover acceptance test** — verify that `/plan` routes to the DAG
     executor if and only if the graduation conditions are met, and that the
     default narrated path is byte-for-byte unchanged otherwise.

  2. **UserGateHandler unit tests** — full coverage of the handler contract
     landed in s3/s4:
     - auto-pass predicate True → proceed (no sentinel written)
     - halt predicate False → suspend (sentinel dirs written, state saved)
     - always-halt (no auto_pass_when) → always suspend
     - `.approve` sentinel → Walker.replay() resumes forward
     - `.reject` sentinel → run aborted (terminal failure)
     - absent-dotpath fail direction for EACH gate predicate (confidence,
       open_questions_count, first_run) → halts, never auto-passes

  3. **Spine-parity test for plan.workflow.yaml** — verify the plan workflow
     graph (with the inserted user_gate nodes from s3/s4) runs under the
     executor and produces a parity-clean spine result. This is the required
     prerequisite before adding `plan` to the graduation registry.

  4. **`/execute` dispatch-parity guard** — verify that the s1 plan-dispatch
     sibling skill leaves `/execute` behavior untouched. Run the existing
     execute-dispatch test suite and add one explicit parity assertion
     confirming that execute-dispatch's output is unchanged when
     `HIVE_PLANNING_MODE=hive-dag` is set.

  After all tests pass:

  5. **Graduate `plan` workflow** — uncomment the Order 10 placeholder entry
     in `.pHive/runtime/executor-graduated-workflows.yaml` (added in s1).
     `plan` becomes the 10th workflow in the graduation registry. This
     activates the executor path for consumers who set `executor_default: true`.

  6. **Schema documentation** — add a `user_gate` node type section to
     `hive/references/workflow-schema.md`:
     - EBNF and field table for `auto_pass_when`
     - Absent-dotpath fail-direction note (halts, never auto-passes)
     - Actor contract: `.approve`/`.reject` MUST be written by a human reviewer;
       CI automation is explicitly excluded
     - Binding scope note: filesystem binding only; multica sentinel bridge is
       a named precondition for multica deployment
     - Cross-reference to the gate-ownership invariant amendment note

  7. **Version bump** — bump `.claude-plugin/plugin.json` and
     `.claude-plugin/marketplace.json` to the next minor version (additive
     feature: new consumer-visible config key, new node type, new command
     routing). Update README version badge. Add CHANGELOG.md entry dated
     2026-06-23 covering: plan-dispatch skill, /plan DAG routing, user_gate
     node type, gate signals, graduation of plan workflow.
     The version bump commit MUST be the LAST commit on the feat/plan-dag-cutover
     branch.

acceptance_criteria:
  - "Cutover acceptance test: given executor_default=true and plan in registry, when /plan runs under hive-dag, then the DAG executor is invoked (verified by intercepting run() call or checking run_state files). Given executor_default=false or plan not in registry, when /plan runs, then the narrated path runs unchanged."
  - "UserGateHandler auto-pass test: given auto_pass_when predicate evaluates True, then no sentinel dirs are written and execution proceeds to the next node."
  - "UserGateHandler halt test: given auto_pass_when predicate evaluates False, then sentinel dirs are written and wait_for_signal() is called."
  - "UserGateHandler always-halt test: given no auto_pass_when field, then the handler always suspends."
  - "UserGateHandler approve test: given .approve sentinel is written, then Walker.replay() resumes and the successor node executes."
  - "UserGateHandler reject test: given .reject sentinel is written, then the run raises a terminal failure (not continued)."
  - "Absent-dotpath fail-closed test: for each of (confidence, open_questions_count, first_run), given the dotpath is absent in the node output, then the gate halts — verified for all three gate predicates."
  - "Spine-parity test: plan.workflow.yaml with user_gate nodes passes spine-parity under the executor before graduation."
  - "/execute dispatch-parity guard: execute-dispatch test suite passes 100% with HIVE_PLANNING_MODE=hive-dag set; the planning env var has zero effect on /execute behavior."
  - "plan is listed as Order 10 in .pHive/runtime/executor-graduated-workflows.yaml (uncommented, active)."
  - "hive/references/workflow-schema.md contains a user_gate section covering auto_pass_when EBNF, absent-dotpath behavior, actor contract, and binding scope."
  - "Plugin version is bumped and CHANGELOG.md contains a dated entry covering all five epic stories."

steps:
  - id: research
    description: "Read the existing cutover acceptance test pattern (test_cutover_acceptance_* in hive/lib/dag_executor/__tests__/) to confirm the test structure. Read verify-dispatch-parity.mjs to confirm the parity check mechanism. Read hive/references/workflow-schema.md to identify the insertion point for the user_gate section. Read .claude-plugin/plugin.json to confirm current version."
    agent: researcher
  - id: implement
    description: |
      1. Write cutover acceptance test for /plan (mirrors test_cutover_acceptance_* for execute).
      2. Write UserGateHandler unit tests (7 test cases covering ACs 2-7).
      3. Write spine-parity test for plan.workflow.yaml with user_gate nodes.
      4. Add /execute dispatch-parity guard (one assertion + HIVE_PLANNING_MODE env set).
      5. Uncomment Order 10 entry for plan in .pHive/runtime/executor-graduated-workflows.yaml.
      6. Add user_gate section to hive/references/workflow-schema.md.
      7. Bump plugin version in .claude-plugin/plugin.json and .claude-plugin/marketplace.json; update README badge; add CHANGELOG.md entry.
    agent: developer
    depends_on:
      - research
  - id: test
    description: "Run the full test suite: cutover acceptance, user_gate unit tests, spine-parity, /execute parity guard. Confirm all 12 ACs pass. Confirm no regressions in existing execute-dispatch tests."
    agent: tester
    depends_on:
      - implement
  - id: review
    description: "Verify: absent-dotpath test covers all three gate predicates; graduation entry is uncommented and in correct order; schema doc covers actor contract and binding scope; version bump is the last commit on the branch; CHANGELOG entry is dated and accurate."
    agent: reviewer
    depends_on:
      - test
  - id: integrate
    description: "Final commit on feat/plan-dag-cutover branch with prefix [plan-graph]. Version bump commit must be last."
    agent: developer
    depends_on:
      - review

