design_decisions:
  - decision: "Graduate plan only after spine-parity passes on the new topology"
    rationale: "The user_gate node insertions in s3 change the plan graph topology. Graduating the workflow before parity passes would mean the registry points at a graph that has not been validated under the executor. Ordering: land user_gate topology (s3) -> fill signals (s4) -> prove parity (s5) -> then graduate (s5)."
  - decision: "Version bump commit is the LAST commit on the feature branch"
    rationale: "The version must reflect the full landed state, not a partial state. Landing it last ensures the version number corresponds to the complete epic."

cross_cutting:
  - concern: documentation
    action: "The user_gate schema section in workflow-schema.md IS the primary documentation deliverable. Also confirm that all prior stories' documentation cross-cutting actions are complete before this story's review step."
  - concern: versioning
    action: "This story owns the version bump. Minor semver increment (new consumer-visible config key planning.mode, new node_type user_gate, new /plan routing behavior)."

metric:
  applies: false
  justification: "Test and schema story — ships the evidence framework (tests) and the reference documentation. No new measurable outcome is introduced here; the observable planning-flow metric belongs to a post-epic retro after production data is available."

risks:
  - severity: medium
    description: "Absent-dotpath evaluator behavior may not be easily testable if the evaluator swallows null comparisons silently. The test may need to introspect the evaluator's null-handling code path."
    mitigation: "If the evaluator does not fail closed on null == 0, the SO gate predicate must be rewritten to open_questions_count >= 1 (auto-halt posture, inverting direction). The test confirms which direction is safe BEFORE graduation."
  - severity: low
    description: "verify-dispatch-parity.mjs may not have a mechanism to set env vars per-assertion."
    mitigation: "Researcher confirms the parity script's mechanism. If env injection is not supported, implement the guard as a standalone Python test instead."

references:
  - path: "hive/lib/dag_executor/__tests__/"
    relevant_excerpt: "Contains test_cutover_acceptance_* tests — the pattern to mirror for the /plan acceptance test."
  - path: ".pHive/runtime/executor-graduated-workflows.yaml"
    relevant_excerpt: "Graduation registry. Comment: 'added during cutover events per the locked Order 1-9 sequence.' plan becomes Order 10."
  - path: "design-discussion.md §7"
    relevant_excerpt: "VERIFICATION PLAN: Tools: pytest (hive/lib/dag_executor/__tests__), node verify-dispatch-parity.mjs. Automated: cutover-acceptance test; user_gate handler unit tests; predicate-fail-closed test; spine-parity for plan.workflow.yaml; dispatch-parity check. Not verifying: t-005 converge-loop (explicitly out of scope); grammar extensions (none being made)."
  - path: "design-discussion.md §4"
    relevant_excerpt: "[medium] Absent-dotpath fail direction must be safe for ALL three gates, not just confidence. Story 5 must pin the evaluator's absent-dotpath semantics and add a test that a missing scalar halts (never auto-passes) for every gate."
