design_decisions:
  - decision: "UserGateHandler as union of gate + pause, not a subclass of either"
    rationale: "Subclassing PauseHandler would inherit unconditional-halt logic that would need to be overridden. Composition (call GateHandler evaluator, then branch to PauseHandler halt path) is cleaner and keeps each primitive's contract intact."
  - decision: "reject is terminal, not iterative"
    rationale: "Forward-only pause/resume cleanly covers auto-pass and halt-then-approve. Revise-in-loop requires a backward edge that graph/model.py:34 forbids. Deferring revise-on-reject to t-005 keeps this story genuinely decoupled. Stated, not hidden."
  - decision: "Scope to filesystem binding; multica pause surface is a named out-of-scope precondition"
    rationale: "hde-8 waits on filesystem sentinel files. Under the multica binding the human signs off via issue comment — a binding-aware bridge is a named precondition for multica deployment, called out explicitly and not silently assumed."
  - decision: "Absent auto_pass_when (None) is always-halt, not an error"
    rationale: "The design gate must always halt; using None as the always-halt signal avoids a special-case node attribute and keeps the schema clean."

cross_cutting:
  - concern: documentation
    action: "Document the scoped gate-ownership invariant amendment in hive/references/workflow-schema.md (or a new hive/references/user-gate-invariant-amendment.md): the invariant holds verbatim on the narrated path; the executor owns the approval event on the graduated path only, bounded by the registry gate. Document the actor contract (human-only sentinel) in the UserGateHandler module docstring."
  - concern: versioning
    action: "New node_type: user_gate is a consumer-visible schema extension. Flag as minor additive for the epic version bump in s5."

metric:
  applies: false
  justification: "Deep substrate story — the conditional gate is infrastructure. The measurable outcome (fewer unnecessary human interruptions during planning) requires the signals from s4 and the full routing from s1+s2 to be observable. Metric deferred to s5 or post-epic retro."

risks:
  - severity: high
    description: "Absent-dotpath fail direction under the GateHandler evaluator. For SO's open_questions_count == 0, a missing/null dotpath could evaluate open or error depending on evaluator null handling."
    mitigation: "Story s5 pins the evaluator's absent-dotpath semantics and tests that a missing scalar halts for all three gates. Handler implementation must not auto-pass on missing signals."
  - severity: high
    description: "plan.workflow.yaml graph topology change (inserting user_gate node) means the plan workflow is not a clean graduation candidate until spine-parity passes on the new topology."
    mitigation: "s5 proves spine-parity on the new plan.workflow.yaml topology before adding plan to the graduation registry. Ordering: land user_gate topology here (s3) -> prove spine-parity (s5) -> registry Order 10 (s5)."
  - severity: medium
    description: "The multica binding has no filesystem sentinel surface; if a consumer enables the graduated plan path under the multica binding, pause nodes will hang waiting for files that are never written."
    mitigation: "Document the filesystem-binding scope restriction prominently in UserGateHandler docstring and in the handler's binding-check block. A binding-aware pause bridge is a named precondition, not this story's scope."

