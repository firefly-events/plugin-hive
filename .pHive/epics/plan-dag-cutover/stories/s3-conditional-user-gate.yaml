id: s3-conditional-user-gate
epic: plan-dag-cutover
title: "conditional user-gate node type — evaluate predicate, auto-pass or halt-surface-resume"
status: complete
complexity: high
methodology: classic
depends_on:
  - s2-plan-cutover

description: |
  Add a new `node_type: user_gate` to the DAG executor. This is the deep
  story. The node type is the **union of two existing primitives** — the
  `gate` (pure predicate, no human) and the `pause` (unconditional halt) —
  switched by one per-node predicate: `auto_pass_when`.

  Behavior:
  - Evaluate `auto_pass_when` (a predicate string in the existing frozen
    grammar) against the node's upstream outputs.
  - If the predicate is True → proceed exactly like `output-validation` gate
    (GateHandler evaluator path, no human halt).
  - If the predicate is False (or absent/always-halt) → suspend exactly like
    a hde-8 PAUSE node: call `_record_pause_suspended()` + `save_state()`,
    emit a signed resume token, write sentinel dirs at
    `<runs_root>/<run_id>/pause/<node_id>.{approve,reject}`, and wait for
    `wait_for_signal()`.
  - On `.approve` sentinel → resume via `Walker.replay()` from `run_state_path`
    checkpoint.
  - On `.reject` sentinel → **abort the run** (terminal failure, not iterative).
    Revise-on-reject is explicitly out of scope and deferred to the t-005
    converge-loop epic.

  Predicate grammar: the EXISTING frozen grammar is used unchanged. The
  companion-scalar pattern handles grammar constraints (see story s4). The
  `auto_pass_when` field reuses the GateHandler evaluator byte-for-byte —
  zero new grammar constructs. Any evaluator behavior change is a hard stop
  and must be escalated as an epic-scope grammar change.

  Gate-ownership invariant amendment: on the DEFAULT orchestrator-narrated
  path the invariant is preserved verbatim (gates stay orchestrator-local,
  zero change). On the GRADUATED hive-dag path the executor owns the
  approval event via the pause-sentinel mechanism. This is a **scoped
  amendment** to the invariant, bounded by the graduation registry. The actor
  who drops `.approve`/`.reject` MUST be a human reviewer — CI automation or
  agent automation must NOT be allowed to write these sentinels (the story
  must document this constraint in the handler and in workflow-schema.md).

  The `efcl-s6` / t-005 converge-loop is **explicitly NOT a dependency**.
  The design decouples by building the gate from existing `pause` + `run_state`
  primitives. Reject is terminal; revise-in-loop is a t-005-dependent
  follow-on.

  Changes across Python layers:
  1. `hive/lib/dag_executor/graph/model.py` — extend `NodeType` enum with
     `USER_GATE = "user_gate"`. Add `auto_pass_when: Optional[str]` field to
     `Node` model (None → always-halt semantics).
  2. `hive/lib/dag_executor/graph/loader.py` — parse `user_gate` node type,
     validate `auto_pass_when` field if present.
  3. `hive/lib/dag_executor/executor/handlers/user_gate.py` — NEW handler.
     `UserGateHandler.run(node, context)`: evaluate `auto_pass_when` via the
     existing GateHandler evaluator; if True → return proceed signal; if
     False/absent → invoke PauseHandler halt path. Document human-only
     actor constraint in a module-level docstring.
  4. `hive/lib/dag_executor/executor/dispatcher.py` — register
     `NodeType.USER_GATE → UserGateHandler`.
  5. `hive/lib/dag_executor/executor/walker.py` — add `_is_user_gate_node()`
     predicate (mirrors `_is_pause_node()`); exclude user_gate nodes from
     parallel waves (sequential scheduling, same treatment as pause).
  6. `hive/workflows/plan.workflow.yaml` — insert `user_gate` nodes:
     (a) between `design` and `author` (always-halt design gate, no
         `auto_pass_when`); (b) placeholder positions for H/V and SO gates
         (populated in story s4 when signals are available).

  Absent-dotpath safety: the GateHandler evaluator's null/absent-dotpath
  behavior MUST be documented and tested (see story s5). The handler must
  fail closed (halt) when a dotpath is absent, for ALL three gate predicates
  — confirmed in s5, but the handler must be written to never auto-pass on
  a missing signal.

acceptance_criteria:
  - "Given a user_gate node with auto_pass_when evaluating True, when the walker executes it, then the handler returns a proceed signal (no human halt, no sentinel written)."
  - "Given a user_gate node with auto_pass_when evaluating False, when the walker executes it, then the handler suspends (calls _record_pause_suspended + save_state), writes the sentinel dirs, and emits a resume token."
  - "Given a user_gate node with no auto_pass_when field (always-halt semantics), when the walker executes it, then the handler always suspends — never auto-passes."
  - "Given an .approve sentinel is written, when wait_for_signal() returns, then Walker.replay() resumes from the run_state_path checkpoint and execution continues forward."
  - "Given a .reject sentinel is written, when wait_for_signal() returns, then the run is aborted (terminal failure raised, not continued or retried)."
  - "Given a user_gate node, when the walker builds the wave schedule, then user_gate nodes are excluded from parallel wave dispatch (treated as sequential barriers, same as pause nodes)."
  - "Given the .approve or .reject sentinel is dropped by an automated process (not a human), the handler provides no technical mechanism to distinguish; the actor contract is enforced by the documentation and ops practice, not by the code — the handler docstring documents this constraint explicitly."
  - "Given the default orchestrator-narrated /plan path (un-graduated), when any gate is reached, then no user_gate node type code is invoked — the invariant is preserved verbatim on the narrated path."
  - "The auto_pass_when predicate is evaluated by the EXISTING GateHandler evaluator unchanged — no new grammar constructs, no evaluator modifications."
  - "plan.workflow.yaml gains a user_gate node between design and author (the always-halt design gate) and is parseable by the loader without error."

