name: story-loop-closure
title: "Close the Multica-issue side of the story lifecycle on PR merge"
description: |
  Complement to autonomous-cycle-loop's e-1 (file-side YAML reconcile).
  This epic adds the missing leg: after a story's PR merges to develop or
  main, the matching Multica issue (PLU-N) transitions from in_review →
  done. Operator-side hook fires immediately on /execute integrate; an
  optional CI workflow + reverse sync round out the slice.
target_codebase: /Users/don/Documents/plugin-hive
methodology: classic

git_flow:
  base_branch: develop
  branch_strategy: per-epic

stories:
  - id: s0-1-episode-marker-audit
    title: "S0.1 — audit episode-marker schema for issue_identifier presence"
    complexity: low
    depends_on: []
  - id: s1-1-multica-issue-closer-module
    title: "S1.1 — hive/lib/multica-issue-closer.mjs module"
    complexity: medium
    depends_on: [s0-1-episode-marker-audit]
  - id: s1-2-execute-integrate-hook
    title: "S1.2 — /execute integrate-step hook: close Multica issue after commit+push"
    complexity: low
    depends_on: [s1-1-multica-issue-closer-module]
  - id: s1-3-gh-action-optional
    title: "S1.3 — optional CI workflow: close Multica on PR merge (gated on secret)"
    complexity: low
    depends_on: [s1-1-multica-issue-closer-module]
  - id: s2-1-reverse-sync-optional
    title: "S2.1 — (optional) reverse sync: Multica cancelled → story YAML status: deferred"
    complexity: medium
    depends_on: [s1-1-multica-issue-closer-module]
  - id: s3-1-runbook
    title: "S3.1 — runbook: failure modes + manual sweep instructions"
    complexity: low
    depends_on: [s1-2-execute-integrate-hook]
