id: s1-3-gh-action-optional
epic: story-loop-closure
title: "S1.3 — optional CI workflow: close Multica on PR merge (gated on secret)"
status: pending
complexity: low
methodology: classic
depends_on: [s1-1-multica-issue-closer-module]

description: |
  Companion to the operator-side hook (s1-2): a GH Action that fires on
  PR merge to `develop` or `main`, parses merged commits for story-id
  refs (reusing the same regex shape that
  `.github/workflows/story-status-reconcile.yml` uses for its file-side
  reconciliation), and invokes the closer for each match. Gated on the
  repo-level secret `MULTICA_SERVER_URL` — when absent, the workflow
  exits 0 immediately with a one-line skip log. This is the bridge for a
  future hosted-Multica deployment; locally it stays dormant.

acceptance_criteria:
  - "New file `.github/workflows/multica-issue-close.yml` mirrors `story-status-reconcile.yml`'s trigger shape (`pull_request: closed`, `if: merged == true`, base in {main, develop})."
  - "First step: if `secrets.MULTICA_SERVER_URL` is empty, log `Multica server URL not configured — skipping` and exit 0."
  - "Second step: parse the merged PR's commits for story-id refs (existing pattern from the file-side reconcile workflow)."
  - "Third step: invoke `node hive/scripts/close-multica-issues.mjs --story <id> --epic <id>` for each match. (CLI wrapper is in the same story; thin — just maps argv to `closeStoryIssue(...)` and exits.)"
  - "CLI wrapper exits 0 even on closer failures (best-effort contract); writes warn lines to stdout."
  - "yamllint clean on the new workflow YAML."

steps:
  - id: research
    description: Re-read `.github/workflows/story-status-reconcile.yml` for its commit-parsing regex; mirror it.
    agent: researcher
  - id: implement
    description: Write the workflow YAML + the thin CLI wrapper at `hive/scripts/close-multica-issues.mjs`.
    agent: developer
    depends_on: [research]
  - id: test
    description: yamllint the workflow; fixture-test the CLI wrapper with a fake closer.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm the secret-gate is the FIRST step + workflow has zero side effects when the secret is absent.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit + push.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: .github/workflows/story-status-reconcile.yml
      purpose: template for the trigger + checkout + parse pattern
    - path: hive/lib/multica-issue-closer.mjs
      purpose: the module wrapped by the CLI

files_to_modify:
  - file: .github/workflows/multica-issue-close.yml
    change: new workflow
  - file: hive/scripts/close-multica-issues.mjs
    change: new thin CLI wrapper

design_decisions:
  - decision: Gate via a repo secret, not via `hive.config.yaml` `task_tracking.adapter`
    rationale: GH Action runs against the checked-out repo. `task_tracking.adapter` may say `multica` but the runner has no daemon to talk to. The secret presence is the authoritative signal "Multica is reachable from CI." When this is wired up properly later, `MULTICA_SERVER_URL` + a token secret will both be set.

risks:
  - severity: low
    description: This workflow could become bit-rot for years if no hosted Multica ever exists
    mitigation: The secret-gate first-step keeps it a no-op when the deployment doesn't exist — costs only a few seconds of CI runner per PR merge. Acceptable.

references:
  - path: .github/workflows/story-status-reconcile.yml
    relevant_excerpt: |
      on:
        pull_request:
          types: [closed]
          branches:
            - main
            - develop
