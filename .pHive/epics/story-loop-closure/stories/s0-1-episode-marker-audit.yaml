id: s0-1-episode-marker-audit
epic: story-loop-closure
title: "S0.1 — audit episode-marker schema for issue_identifier presence"
status: pending
complexity: low
methodology: classic
depends_on: []

description: |
  The closer (s1-1) reads `.pHive/episodes/<epic>/<story>/multica-run.yaml`
  and looks up the Multica issue by `issue_id` (UUID) and/or
  `issue_identifier` (PLU-N). Before building the closer, audit every
  existing episode marker on the repo's epic dirs to confirm those two
  fields are present + well-formed; backfill the helper that writes the
  marker (in `hive/lib/multica-story-dispatch/`) so future markers always
  include both fields.

acceptance_criteria:
  - "Audit script at `hive/scripts/audit-episode-markers.mjs` walks every `.pHive/epics/*/<story>/multica-run.yaml` under the repo and reports missing/empty `issue_id` or `issue_identifier` fields."
  - "Audit script exits 0 when every marker is well-formed; exits 1 with a list of offenders when any are not."
  - "Running the audit against the current repo (post autonomous-cycle-loop + sandcastle-adoption-followon, etc.) reports zero offenders — confirming the existing dispatcher already populates both fields."
  - "If the audit finds offenders, this story also updates the dispatcher in `hive/lib/multica-story-dispatch/` to write both fields and adds a unit test against the dispatcher's serializer."
  - "Brief one-paragraph note added to `hive/references/episode-schema.md` documenting that `issue_id` and `issue_identifier` are required-when-mode=multica."

steps:
  - id: research
    description: Walk `.pHive/episodes/` and confirm marker shape across all existing epics. Re-read `hive/lib/multica-story-dispatch/index.mjs` to find the write-site.
    agent: researcher
  - id: implement
    description: Write the audit script; if offenders found, also patch the dispatcher write-site.
    agent: developer
    depends_on: [research]
  - id: test
    description: Run audit against the live repo; verify zero offenders or that the patched dispatcher fixes them. Unit test the audit's exit-code contract on a fixture marker dir.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm audit covers all epics + the schema doc note is accurate.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit + push.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: hive/lib/multica-story-dispatch/index.mjs
      purpose: write-site for episode markers — confirm both fields land
    - path: hive/references/episode-schema.md
      purpose: schema doc to update
    - path: .pHive/episodes/autonomous-cycle-loop/a-1-standup-interactive-flag/multica-run.yaml
      purpose: reference marker (shipped, post-lint-fix)

files_to_modify:
  - file: hive/scripts/audit-episode-markers.mjs
    change: new — walk + validate
  - file: hive/references/episode-schema.md
    change: add a paragraph documenting the required-when-multica fields

design_decisions:
  - decision: Audit script is its own file under `hive/scripts/`, not a CLI flag on the dispatcher
    rationale: Dispatcher is a write path; audit is a read path. Separate concerns + the audit can be wired into CI later if needed.

risks:
  - severity: low
    description: A marker file in an unexpected shape (markdown body left over from old wave-1 dispatch) crashes the audit
    mitigation: Audit handles both `---` frontmatter-only files and files with trailing markdown (already-fixed in PR #213 chore commit)

references:
  - path: hive/references/episode-schema.md
    relevant_excerpt: |
      (read in research step — current shape may not mention issue_id / issue_identifier yet)
