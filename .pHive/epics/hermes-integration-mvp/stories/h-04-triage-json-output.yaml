id: h-04-triage-json-output
status: in_progress
epic: hermes-integration-mvp
title: Triage --json output across read + state-transition sub-commands
complexity: small
methodology: classic
depends_on: [h-02-context-snapshot-skill]
wave: W3
action_id: H-04

description: |
  Add --json output flag to /hive:triage applicable to all sub-commands:
    - /hive:triage --list [<state>] --json → array of entries
    - /hive:triage <id> --json → single entry detail
    - /hive:triage <description> --json → confirmation with new entry id
    - /hive:triage <id> --advance <state> [...] --json → state transition confirmation
    - /hive:triage <id> --hand-off --json → handoff confirmation + linked epic/story
    - /hive:triage <id> --close [--reason ...] --json → close confirmation
  Reuse JSON envelope conventions from h-01 schema (schema_version, error shape).
  Triage's single-writer invariant on queue.yaml is preserved — --json only
  changes output formatting, never adds write paths.

acceptance_criteria:
  - "skills/triage/SKILL.md documents new --json flag with examples per sub-command"
  - "All read sub-commands (--list, single-id inspect) emit valid JSON to stdout under --json"
  - "All state-transition sub-commands emit confirmation JSON under --json including: action, entry_id, prior_state, new_state (where applicable), timestamp"
  - "JSON envelope includes schema_version: 1 at top level for forward compat"
  - "Output without --json preserves current human-readable behavior byte-equivalently (regression snapshot test)"
  - "State machine invariant preserved: --json branches do NOT introduce any additional writes to .pHive/triage/queue.yaml beyond what the non-json path already writes (write-count assertion in test)"
  - "Snapshot tests at tests/skills/triage-json.test.* cover each sub-command's --json output"
  - "Default-behavior regression snapshot covers each sub-command's non-json output"

metric:
  applies: false
  justification: "Triage --json output flag is pure substrate — the Hermes-side Slack bot calling triage CLI (deferred to companion epic) is what measures any user-facing metric like intake-to-prioritization-latency; this story ships only the output formatting flag and preserves the existing state machine + single-writer invariant unchanged."

steps:
  - id: implement
    description: |
      Add --json flag parsing to skills/triage/SKILL.md (or its sub-command
      step files). Each sub-command branches output composition by --json value.
      Reuse JSON envelope shape from h-01 schema (top-level schema_version: 1,
      consistent error format). Confirm no new writes to queue.yaml in any
      --json branch (read-only flag, output-only effect).
    agent: developer

  - id: test
    description: |
      Write tests/skills/triage-json.test.* — one snapshot per sub-command for
      --json output, one regression snapshot per sub-command for default
      (non-json) output. Include write-count assertion: spy on queue.yaml file
      writes; --json branches must produce same write count as non-json
      branches for equivalent invocations.
    agent: tester
    depends_on: [implement]

  - id: review
    description: |
      Review for: state machine invariant (no new write paths), envelope
      consistency with h-01 schema, default-behavior preservation, parseability
      under jq (validate snapshots with jq parse in test). Pay specific
      attention to --hand-off path which crosses skill boundaries (/plan
      --from-triage handoff).
    agent: reviewer
    depends_on: [test]

  - id: integrate
    description: |
      Commit on feat/hermes-integration-mvp branch.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: skills/triage/SKILL.md
      purpose: "Skill to modify — single writer of queue.yaml; --json must NOT introduce new write paths"
    - path: .pHive/epics/hermes-integration-mvp/docs/horizontal-plan.md
      purpose: "References JSON envelope conventions to reuse from h-01"
    - path: hive/references/context-snapshot-schema.md
      purpose: "Schema doc from h-01 — reuse schema_version + envelope shape conventions for consistency"

files_to_modify:
  - file: skills/triage/SKILL.md
    change: Add --json flag handling per sub-command; document output shapes inline
  - file: hive/workflows/steps/* (if triage logic is step-fileized — check)
    change: Branch output composition by --json value where applicable
  - file: tests/skills/triage-json.test.* (extension matches existing convention)
    change: NEW — snapshot tests for --json output + non-json regression + write-count assertions

code_examples:
  - title: Triage state machine reference (existing — do not modify)
    file: skills/triage/SKILL.md
    snippet: |
      | State | Meaning |
      |---|---|
      | `inbox` | Raw report received. Title + free-form description only. |
      | `clarified` | Enough detail to act on. |
      | `prioritized` | Priority + severity assigned. |
      | `plan-ready` | Handed to planning. |
      | `closed` | Resolved, rejected, or duplicate. Terminal. |

design_decisions:
  - decision: "Reuse h-01 JSON envelope conventions (schema_version: 1 at top, consistent error shape)"
    rationale: "Consumer parsing logic stays uniform across context-snapshot and triage outputs. Hermes-side parsers can share envelope handling."
  - decision: "Add write-count assertion in tests rather than rely on code review for single-writer invariant"
    rationale: "Mechanical guard against regression. Test fails if any --json branch accidentally introduces a new write — protects the load-bearing triage invariant."
  - decision: "--json applies to ALL sub-commands (not just reads)"
    rationale: "Hermes flow needs confirmation parseability after state transitions (operator approval in Slack → triage --advance --json → parse confirmation → post next step). Half-coverage forces shell parsing which is fragile."

cross_cutting:
  - concern: documentation
    action: "Inline documentation of --json output shape per sub-command in skills/triage/SKILL.md. No new reference doc — keep documentation close to the flag definition. Cross-reference h-01 context-snapshot-schema.md for envelope conventions shared."

risks:
  - severity: high
    description: Accidental write path in --json branch breaks single-writer invariant — corrupts triage state machine
    mitigation: Write-count assertion in test catches mechanically; reviewer specifically validates read vs write paths in each --json branch
  - severity: low
    description: JSON envelope drift between h-01 and h-04 if h-01 schema evolves between merges
    mitigation: h-04 depends_on h-02 (the skill consumer of h-01), so envelope conventions are settled before h-04 implements

references:
  - path: .pHive/epics/hermes-integration-mvp/docs/design-discussion.md
    relevant_excerpt: |
      Slice 3: Slack-to-triage intake bridge — Triage's single-writer invariant
      is preserved because Hermes always calls the CLI, never writes queue.yaml
      directly. Hive-side changes (Slice 3 scope): add --json output flag on
      triage commands so Hermes's parsing is reliable; otherwise no triage skill
      behavior changes.
  - path: skills/triage/SKILL.md
    relevant_excerpt: |
      The triage skill is the single writer of this file. Other skills read it;
      only triage updates it. ... Transition rules: Entries advance forward only.

parallel_allowed: false

