id: h-03-standup-format-slack
epic: hermes-integration-mvp
title: Standup --format slack flag for cron-friendly Phase 1 report
status: pending
complexity: small
methodology: classic
depends_on: []
wave: W2
action_id: H-03

description: |
  Add --format <default|slack> flag to /hive:standup. When --format slack:
    - Emit Phase 1 standup report only (skip interactive Phase 2/3)
    - Markdown-flavored, Slack-thread-aware (code blocks for tables; no ANSI)
    - Suppress interactive prompts so it works under cron capture
  Default behavior preservation: --format default (or omitted) byte-equivalent
  to current standup output (regression guard via snapshot test).

  Enables Hermes (the external supervisor) to invoke standup from cron, capture
  stdout, and post to Slack channel verbatim — using the existing Routines bridge
  contract (which becomes "external coordinators bridge" in the doc update).

acceptance_criteria:
  - "skills/standup/SKILL.md documents new --format flag with values 'default' and 'slack'"
  - "/hive:standup --format slack emits ONLY Phase 1 standup report (no Phase 2 planning prompts, no Phase 3 execution kickoff)"
  - "Output under --format slack uses markdown (headings, code blocks for tabular data) and is free of ANSI escape codes"
  - "/hive:standup without --format (or with --format default) produces byte-identical output to current behavior (regression guard via snapshot test)"
  - "hive/references/standup-slack-format.md exists and documents the slack output conventions (heading levels, code block usage, line length guidance, no-emoji-required rule)"
  - "hive/references/routines-integration.md updated with a new §'External coordinators (Hermes equivalence)' noting that any cron/webhook-capable coordinator plugs in via the same scheduler-as-trigger contract"
  - "Snapshot test at tests/skills/standup-format-slack.test.* validates --format slack output against committed snapshot fixture"
  - "Default-behavior regression snapshot test validates --format default output unchanged"

metric:
  applies: false
  justification: "Standup --format slack output flag is pure substrate — the Hermes-side cron job posting to Slack (deferred to companion epic) is what measures any user-facing metric like operator-time-to-daily-report; this story ships only the output-shaping flag and reference doc, with no observable user surface absent the Hermes consumer."

steps:
  - id: research
    description: |
      Read current standup skill phase-1 output composition. Identify where to
      insert format branching. Confirm Routines integration doc's existing
      section structure for clean addition. Check for ANSI/color helpers in
      current standup output path that need conditional suppression.
    agent: researcher

  - id: implement
    description: |
      Add --format flag parsing to skills/standup/SKILL.md (or its step files
      if logic lives there). Under --format slack: branch Phase 1 output through
      a slack-formatter (markdown, no ANSI), skip Phase 2/3 entirely. Under
      --format default (or omitted): preserve current behavior byte-for-byte.
      Write hive/references/standup-slack-format.md and update routines-
      integration.md per acceptance criteria.
    agent: developer
    depends_on: [research]

  - id: test
    description: |
      Write tests/skills/standup-format-slack.test.* — snapshot of --format slack
      output against fixture cycle-state, AND regression snapshot of --format
      default to guarantee byte-equivalence with pre-change behavior.
    agent: tester
    depends_on: [implement]

  - id: review
    description: |
      Review for: behavior-preservation invariant on default path, markdown
      compliance on slack path, no ANSI escapes leaking into slack output, no
      Phase 2/3 prompts firing under --format slack, doc cross-references intact.
      Manually preview slack output by pasting into a Slack message preview to
      eyeball formatting.
    agent: reviewer
    depends_on: [test]

  - id: integrate
    description: |
      Commit on feat/hermes-integration-mvp branch.
    agent: developer
    depends_on: [review]

