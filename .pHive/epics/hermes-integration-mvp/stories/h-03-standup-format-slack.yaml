code_examples:
  - title: Routines integration §"Capability Skip When Routines Is Unreachable" pattern (to extend with Hermes equivalence)
    file: hive/references/routines-integration.md
    snippet: |
      ## Capability Skip When Routines Is Unreachable

      Routines is an optional trigger capability, not a hard runtime dependency for the
      ceremony itself. If Routines is unreachable, unavailable, or not configured:

      - Do not treat that condition as a workflow error.
      - Do not synthesize a fake scheduler context.
      - Fall back to the normal interactive ceremony entry path.

design_decisions:
  - decision: "--format <default|slack> as enumerated flag, not multiple boolean flags"
    rationale: "Future formats (e.g., html, json) can extend the enum without flag explosion. Default value preserves byte-equivalence with prior behavior."
  - decision: "Slack output is markdown-only; no Slack-specific block-kit JSON at MVP"
    rationale: "Markdown renders cleanly in Slack messages without bot SDK. Block-kit is over-engineering for an MVP cron post."
  - decision: "Phase 1 only under slack; no auto-approve under cron"
    rationale: "Per design-discussion §4 H4 finding — auto-approve under cron carries idempotency risk. Operator-driven Phase 2/3 from a session at MVP."

cross_cutting:
  - concern: documentation
    action: "Update skills/standup/SKILL.md to document --format flag. NEW hive/references/standup-slack-format.md. UPDATE hive/references/routines-integration.md with Hermes equivalence section."
  - concern: simulated-manual
    action: |
      Slack output is a perceptual outcome — markdown rendering correctness is best
      verified by pasting into Slack. Add a test scenario at
      .pHive/test-scenarios/h-03-standup-format-slack-manual.yaml describing:
        invocation: skill /hive:standup --format slack
        pre-conditions: project has at least one active epic + episode markers
        pass expectations: copy/paste into Slack DM, rendering matches expected
          shape (headings render, tables render in code blocks, no raw ANSI text)
      Set manual_verdict.scenario_ref to that path.

manual_verdict:
  scenario_ref: .pHive/test-scenarios/h-03-standup-format-slack-manual.yaml
  verdict: null
  timestamp: null
