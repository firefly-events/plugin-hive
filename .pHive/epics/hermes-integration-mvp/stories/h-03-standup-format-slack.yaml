risks:
  - severity: medium
    description: Byte-equivalent default-path regression hard to fully guarantee — incidental whitespace or formatting changes could break the snapshot
    mitigation: Snapshot test pinned to a specific fixture state; if snapshot breaks legitimately, regenerate after manual diff review
  - severity: low
    description: Slack markdown rendering varies across Slack clients (desktop, mobile, web)
    mitigation: Spec targets the lowest common denominator (no advanced features); manual verdict covers desktop preview

