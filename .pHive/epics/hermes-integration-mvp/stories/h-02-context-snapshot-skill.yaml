id: h-02-context-snapshot-skill
epic: hermes-integration-mvp
title: /hive:context-snapshot skill wrapping the composer
complexity: small
methodology: classic
depends_on: [h-01-context-snapshot-composer]
wave: W1
action_id: H-02

description: |
  Wrap the composer from h-01 in a user-invocable skill at
  /hive:context-snapshot. Read-only — emits JSON to stdout by default; optional
  --write flag also persists to .pHive/context-snapshot.json. Optional
  --epic <id> filter narrows output to one epic. --schema-version prints the
  current schema_version and exits.

  Skill follows the standard skill prelude (kickoff gate + persona/config/memory
  loading) in read-only/warning mode (no hard-block on missing project-profile).

acceptance_criteria:
  - "skills/context-snapshot/SKILL.md exists with standard skill frontmatter (name + description)"
  - "/hive:context-snapshot invocation emits valid JSON to stdout matching context-snapshot-schema.md"
  - "/hive:context-snapshot --write writes byte-identical content to .pHive/context-snapshot.json AND stdout"
  - "/hive:context-snapshot --epic <id> filters epics + stories + episodes to the named epic only"
  - "/hive:context-snapshot --schema-version prints '1' to stdout and exits with code 0"
  - "Unknown flag prints a usage line + exits non-zero"
  - "Skill prelude reference present (cites hive/references/skill-prelude.md per convention)"
  - "Skill uses warning-only kickoff gate (read-only convention) — works on uninitialized brownfield repo with warning, not hard-block"
  - "Integration tests at tests/skills/context-snapshot.test.* exercise: default stdout, --write file equality, --epic filter, --schema-version, unknown-flag failure"

metric:
  applies: false
  justification: "Skill wrapper is pure substrate exposing the h-01 composer through Hive's CLI surface — no user-facing metric ships without the Hermes-side consumer (deferred to companion epic); the user-facing metric this enables (operator-time-to-context-query) requires Hermes-side code that does not exist yet."

steps:
  - id: implement
    description: |
      Create skills/context-snapshot/SKILL.md with standard prelude reference,
      warning-only kickoff gate, and argument parsing for --write, --epic <id>,
      --schema-version. Invoke composeContextSnapshot from h-01 library;
      JSON.stringify with 2-space indent for stdout; same content to file when
      --write is passed.
    agent: developer

  - id: test
    description: |
      Write tests/skills/context-snapshot.test.* covering acceptance criteria.
      Use fixture state dir under tests/fixtures/ if existing pattern, else
      tmpdir setup. Verify stdout/file byte-equality. Confirm --epic narrows
      output. Confirm --schema-version short-circuit.
    agent: tester
    depends_on: [implement]

  - id: review
    description: |
      Review skill for: skill-prelude compliance, kickoff-gate warning posture,
      flag parsing correctness, read-only invariant (no writes to anything
      except optional --write target), error handling on missing composer
      output. Cross-reference h-01 schema doc for shape consistency.
    agent: reviewer
    depends_on: [test]

  - id: integrate
    description: |
      Commit skill + tests on feat/hermes-integration-mvp branch.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: hive/lib/context-snapshot.mjs
      purpose: "Composer this skill wraps — produced by h-01"
    - path: hive/references/skill-prelude.md
      purpose: "Standard skill preamble — kickoff gate + persona/config/memory loading; this skill cites it"
    - path: hive/references/context-snapshot-schema.md
      purpose: "JSON schema this skill's output conforms to — produced by h-01"
    - path: skills/standup/SKILL.md
      purpose: "Reference for warning-only kickoff gate pattern on read-only-shaped skills"
    - path: skills/triage/SKILL.md
      purpose: "Reference for warning-only kickoff gate pattern + atomic-skill posture"

files_to_modify:
  - file: skills/context-snapshot/SKILL.md
    change: NEW — user-invocable skill wrapping composer
  - file: tests/skills/context-snapshot.test.* (extension matches existing convention)
    change: NEW — integration tests for skill CLI behavior

code_examples:
  - title: Warning-only kickoff gate pattern (from triage)
    file: skills/triage/SKILL.md
    snippet: |
      ## Skill Preamble
      See [`hive/references/skill-prelude.md`](../../hive/references/skill-prelude.md)
      — kickoff gate + persona / config / memory loading.

      **Kickoff gate override — warn, don't block.** Triage is intended to be
      standalone-usable on brownfield repos that may not be Hive-initialized.
      On a fresh repo without `.pHive/project-profile.yaml`, emit the warning
      below and proceed with sane defaults.

design_decisions:
  - decision: "stdout default; --write opt-in for file output"
    rationale: "Most consumers will pipe (Hermes, jq, scripts). File output is convenience for caching consumers; not the default since it would always overwrite the cached file."
  - decision: "--epic filter at skill level, not composer level"
    rationale: "Composer returns the full state; skill filters for CLI convenience. Keeps composer simple + reusable for callers who want full state."
  - decision: "Warning-only kickoff gate (not hard-block)"
    rationale: "Read-only skill convention per skill-prelude.md gate_mode warning posture; consistent with standup/triage/status."

cross_cutting:
  - concern: documentation
    action: "Add cross-reference from hive/references/context-snapshot-schema.md → skills/context-snapshot/SKILL.md. Update top-level skill index (if one exists) to list new skill. No README update required at this story; epic-level versioning concern (h-05) handles README + CHANGELOG."

risks:
  - severity: low
    description: --write may collide with concurrent skill invocations writing the same path
    mitigation: Document that --write overwrites unconditionally; no locking. Operator's responsibility if they invoke concurrently. Acceptable for MVP read surface.

references:
  - path: .pHive/epics/hermes-integration-mvp/docs/design-discussion.md
    relevant_excerpt: |
      Transport-agnostic by design — the skill writes to stdout (default) AND
      optional file at .pHive/context-snapshot.json (--write flag), so Hermes
      can consume via whatever cross-machine sync protocol the operator picks.
  - path: .pHive/epics/hermes-integration-mvp/docs/vertical-plan.md
    relevant_excerpt: |
      Slice 1: Composer first (h-01), skill wrapper second (h-02). VERIFIED BY:
      stdout vs --write produce byte-identical content (snapshot test).

parallel_allowed: false

