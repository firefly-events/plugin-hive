  - title: deriveStoryStatus usage (existing pattern)
    file: hive/lib/story-status.mjs
    snippet: |
      // From callers like standup Phase 1 — composer follows same pattern:
      import { deriveStoryStatus } from "./story-status.mjs";
      const statusDerived = await deriveStoryStatus({ epic_id, story_id });

design_decisions:
  - decision: "schema_version: 1 (integer) at top of payload; additive-only future changes"
    rationale: "Versioned contract from day one. Consumers can pin to a version. Additive-only rule means schema_version: 1 stays valid as fields are added; only removals/renames bump the version."
  - decision: "Graceful-absence over hard-fail for optional sources"
    rationale: "Composer should produce a useful snapshot even on a half-initialized repo. Missing triage queue → empty array, not error. Reviewer + tests verify the no-exception invariant."
  - decision: ".mjs (or matching) extension chosen to match existing hive/lib/ convention"
    rationale: "Avoid mixing extensions in the same dir. Researcher confirms current convention before implement step."

cross_cutting:
  - concern: documentation
    action: "New reference doc hive/references/context-snapshot-schema.md is itself the documentation. No other Hive docs reference context-snapshot yet — h-02 will add cross-references when the skill ships."

risks:
  - severity: medium
    description: JSON schema shape becomes long-term contract — bad initial shape costs consumer churn later
    mitigation: Keep schema minimal at v1 (only what's needed today); additive-only versioning rule documented; reviewer specifically validates additive-only posture
  - severity: low
    description: hive/lib/ extension convention may not be uniform — guessing wrong extension creates lint/import friction
    mitigation: Researcher step confirms convention before implement step

references:
