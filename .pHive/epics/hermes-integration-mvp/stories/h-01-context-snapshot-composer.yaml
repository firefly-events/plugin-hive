id: h-01-context-snapshot-composer
status: in_progress
epic: hermes-integration-mvp
title: Library composer + JSON schema for context-snapshot
complexity: medium
methodology: classic
depends_on: []
wave: W1
action_id: H-01

description: |
  Build the read-only composer that produces a single JSON blob describing
  current Hive state for a project. Consumed by the /hive:context-snapshot
  skill (h-02) and by any external coordinator (e.g., Hermes supervisor).
  Also ship the versioned JSON schema doc that defines the output contract.

  The composer is pure read — no writes to any Hive state. Inputs:
  - git current branch
  - .pHive/epics/*/epic.yaml and per-story YAMLs (using deriveStoryStatus, not raw status)
  - .pHive/cycle-state/*.yaml
  - .pHive/episodes/ (most recent N per story)
  - .pHive/triage/queue.yaml (gracefully absent OK)
  - Story metric: blocks (gracefully absent OK)

  Schema starts small (additive-only versioning rule). schema_version: 1 at
  top of payload. Future fields are additive; removals require version bump.

acceptance_criteria:
  - "composeContextSnapshot({ stateDir, epic? }) is exported from hive/lib/context-snapshot.mjs"
  - "Composer returns an object with top-level keys: schema_version, branch, epics, stories, episodes_recent, triage_open, metrics_health"
  - "schema_version is the integer 1"
  - "epics is an array of {id, title, status, story_count}"
  - "stories is an array of {id, epic, title, status_derived, complexity, methodology, wave}"
  - "episodes_recent is an array of the 10 most recent episodes across all epics, shape {epic, story, step, status, at}"
  - "triage_open is an array of {id, state, kind, title, priority, severity} for any entry whose state != closed; empty array if queue.yaml is missing"
  - "metrics_health is an array of {epic, story, name, direction, verdict_outcome, verify_at, overdue} for stories with applies:true metric blocks; empty array if no such stories"
  - "story status uses deriveStoryStatus from hive/lib/story-status.mjs (NOT raw YAML status field) per feedback_story_status_stale"
  - "Composer handles graceful absence: missing .pHive/triage/queue.yaml → triage_open: []; missing .pHive/epics/ → epics: [] + stories: []; no exceptions raised"
  - "hive/references/context-snapshot-schema.md exists and documents the schema with JSON example payload + per-key shape + additive-only versioning rule"
  - "Unit tests in tests/lib/context-snapshot.test.* exercise: full state fixture, empty-everything fixture, missing-triage fixture, missing-metrics fixture"
  - "All unit tests pass under bun test"

metric:
  applies: false
  justification: "Library composer + JSON schema doc are pure substrate — the Hermes-side consumer (deferred to companion epic) is what measures any user-facing context-query metric like operator-time-to-state-query or schema-coverage; this story has no observable surface beyond passing tests."

steps:
  - id: research
    description: |
      Verify the read sources: cycle-state YAML shape, episode-schema, triage queue
      schema, story metric block shape. Confirm hive/lib/story-status.mjs API
      (deriveStoryStatus signature). Identify existing .mjs vs .ts convention under
      hive/lib/ (pick matching extension for new file).
    agent: researcher

  - id: implement
    description: |
      Create hive/lib/context-snapshot.mjs (or .ts matching existing convention)
      exporting composeContextSnapshot({ stateDir, epic? }). Read all six sources
      with graceful-absence handling. Use deriveStoryStatus for story status.
      Also write hive/references/context-snapshot-schema.md per acceptance criteria.
    agent: developer
    depends_on: [research]

  - id: test
    description: |
      Write unit tests at tests/lib/context-snapshot.test.* exercising: full-state
      fixture, empty-everything fixture, missing-triage fixture, missing-metrics
      fixture. Validate output structure against schema. Run bun test, confirm all
      pass.
    agent: tester
    depends_on: [implement]

  - id: review
    description: |
      Review the composer for: read-only correctness (no writes), schema completeness,
      additive-only versioning posture, graceful-absence handling, use of
      deriveStoryStatus over raw status field. Review the schema doc for clarity and
      examples. Flag any deviation from the additive-only versioning rule.
    agent: reviewer
    depends_on: [test]

  - id: integrate
    description: |
      Commit composer + schema doc + tests on feat/hermes-integration-mvp branch
      following per-epic-branch-PR flow + caveman commit conventions.
    agent: developer
    depends_on: [review]

