name: ui-logo-imagegen-integration
title: UI Logo — Image-Gen Integration (OpenAI GPT Image)
description: |
  Implements the hybrid logo-generation pipeline recommended by
  `.pHive/research/ui-logo-approach-may2026.md` (PR #101, story mhg-6).

  Goal: stop asking ui-designer to emit production logos as inline SVG.
  Replace with a hybrid flow:
    1. Hive (ui-designer + brand-system) produces brand brief + 2-3
       concept directions
    2. Dedicated image-gen tool (OpenAI GPT Image, primary) generates
       concept boards + iterative edits
    3. Human selects a winning direction
    4. Follow-on finalization step turns the winner into vector/logo
       package (out of scope for this epic — separate follow-on)

  Provenance issue: #102 (planning request)
  Recommendation source: PR #101 / .pHive/research/ui-logo-approach-may2026.md
target_codebase: /Users/don/Documents/plugin-hive
methodology: classic

