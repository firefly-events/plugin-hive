id: ulo-5-downstream-flow-docs
epic: ui-logo-imagegen-integration
title: Document downstream approval + vectorization flow
status: pending
complexity: low
methodology: classic
depends_on: []

description: |
  The hybrid pipeline ends at "human picks a winner" — but the winner
  is a raster image, not a final logo package. Real brand work needs
  vectorization, brand-package assembly (full color / mono / favicon /
  social variants), and usage guidelines.

  This story produces ONE reference doc at
  `hive/references/logo-finalization-flow.md` that:

  1. Documents the manual/external steps after /logo-exploration picks
     a winner (vectorize via Adobe Illustrator, Recraft, Vectorizer.ai,
     Inkscape autotrace, etc. — pros/cons of each)
  2. Specifies the final brand-package layout under .pHive/brand/logo/
     (color, mono, favicon.ico, social-1500x500.png, etc.)
  3. Names the manual approval gate (who signs off, what evidence)
  4. Links to a future story idea: "Hive skill that wraps a
     vectorization API" (deferred — not implemented in this epic)

  Pure doc-only. No code, no skill, no tests.

acceptance_criteria:
  - "Given a reader opens hive/references/logo-finalization-flow.md, when they reach the end, then they know exactly what manual steps + tools + files convert a selected raster mark into a final brand package."
  - "Given the doc lists vectorization tools, when reviewed, then each tool has a one-line pro and a one-line con, no thin recommendations."
  - "Given the doc references future work, when read, then the future story title + scope are crisp enough that a planner could file it later without re-research."

steps:
  - id: research
    agent: researcher
    description: |
      Web research on vectorization options as of 2026-05: Recraft,
      Vectorizer.ai, Inkscape autotrace, Adobe Illustrator (manual),
      Vector Magic. Note access model + cost + agent-friendliness.
  - id: implement
    agent: technical-writer
    description: |
      Write hive/references/logo-finalization-flow.md per the structure
      in the description. Keep it under ~150 lines.
    depends_on: [research]
  - id: review
    agent: reviewer
    description: |
      Validate balance — no over-recommending a specific tool, no
      pretending Hive will solve vectorization in this epic.
    depends_on: [implement]
  - id: integrate
    agent: developer
    description: Commit + push.
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: .pHive/research/ui-logo-approach-may2026.md
      purpose: Cite section "6. Follow-on Story" + "5. Integration Details" — the recommendation already names vectorization as the downstream step.
    - path: hive/references/
      purpose: Where the new doc lives (alongside other reference docs)

files_to_modify:
  - file: hive/references/logo-finalization-flow.md
    change: NEW — manual approval + vectorization flow reference

design_decisions:
  - decision: Doc-only, no code in this epic
    rationale: Vectorization is its own product surface area. Scoping it into the hybrid-pipeline epic would balloon scope. Future story can wrap a vectorization API if it earns the priority.
  - decision: Multiple vectorization options listed (no single winner)
    rationale: Tool quality varies by mark complexity; one-size-fits-all recommendation would be wrong. Reader picks.

risks:
  - severity: low
    description: Recommendations could become stale as 2026 tools shift
    mitigation: Doc carries a date stamp at the top. Re-audit annually.

references:
  - path: .pHive/research/ui-logo-approach-may2026.md
    relevant_excerpt: |
      ## 6. Follow-on Story To Open After Endorsement
      Suggested scope:
      - Document human approval and final vectorization as required
        downstream steps.
