files_to_modify:
  - file: hive/lib/openai-image-mcp-server.js
    change: NEW — stdio MCP server
  - file: .mcp.json
    change: Add `openai-image` server entry pointing at hive/lib/openai-image-mcp-server.js
  - file: tests/openai-image-mcp-server.test.js
    change: NEW — mocked-client unit tests

design_decisions:
  - decision: MCP server, not CLI wrapper
    rationale: Lines up with how plugin-hive distributes integrations (.mcp.json convention). Composable with Claude Code's MCP tool surface.
  - decision: No root package.json — BYO via npm install --no-save inside MCP server
    rationale: feedback_byo_enhancements_no_root_deps. Consumers opt in to the OpenAI SDK install.
  - decision: API key via env (OPENAI_API_KEY), not config file
    rationale: Standard OpenAI SDK convention. Avoids new secret-management surface in Hive.

risks:
  - severity: medium
    description: gpt-image-2 may require OpenAI org verification, blocking some consumers
    mitigation: Document the verification requirement in the MCP server's README section. Surface a clear error message ("API access requires verified org") when 403s are returned.
  - severity: low
    description: Output format (URL vs base64 vs file path) may vary by API mode
    mitigation: Normalize to file paths in the tool response by streaming URLs to a configurable output dir.

references:
  - path: .pHive/research/ui-logo-approach-may2026.md
    relevant_excerpt: |
      ### Recommended path
      Adopt **Hybrid + OpenAI GPT Image first**.
      - Add a new dedicated logo-generation tool stage using **OpenAI GPT Image**.
      - exposed to Hive through either: an MCP server, or a thin CLI wrapper
