name: hermes-orchestrator-skills
title: Hermes Orchestrator Skills
description: |
  Codify the Hive orchestrator as 5 Hermes-side skills so a persistent Hermes cron
  can drive the forked Multica instance toward the lights-on software-factory north
  star — human in the loop only at planning and review; orchestrator + agents own
  the rest. plugin-hive holds the canonical runbook sources + contract; Hermes
  (~/Code/hermes-agent, Studio) is the consumer, ported in its native skill format.
target_codebase: /Users/don/Documents/plugin-hive
methodology: classic
version_bump: minor

git_flow:
  base_branch: develop
  branch_strategy: per-epic

planning_team:
  matched_tags: [orchestration, multica, hermes, skills, automation]
  roster: [orchestrator-direct]
  per_tag_reasoning:
    orchestration: Codifies orchestrator behavior into a fixed skill contract.
    multica: All skills bind to the cli.mjs / multica_* MCP bridge surface.
    hermes: Deliverables are Hermes-side; consumer is the Studio hermes-agent.
  confidence: high
  gate_decisions:
    design_discussion_gate: human-approved
    open_questions_gate: human-resolved (native format, all-5 scope, Slack notify-await)

scope_decisions:
  grounding: plan-off-repo-bridge (cli.mjs + cycle-reconciler.md are the contract; reconcile fork at /execute)
  deliverable_home: Hermes-side native skill registry (~/Code/hermes-agent on Studio)
  story_creation: excluded by design — Hermes never mints stories; /plan + /triage --hand-off are the only gated creation paths
  review_gate: Slack notify-and-await (notify + await action; generalizes to errors/approvals)

stories:
  - id: h-01-hermes-skill-format-recon
    title: Recon and spec the Hermes-agent native skill registry format
    complexity: medium
    depends_on: []
  - id: h-02-multica-mcp-surface
    title: Confirm or expose the multica_* MCP tool surface over cli.mjs
    complexity: medium
    depends_on: []
  - id: h-03-gate-state-latch
    title: Harden the gate_state pre_approved latch + epic-of-record pointer
    complexity: medium
    depends_on: []
  - id: h-04-monitor-epic-skill
    title: Author the monitor-epic orchestrator skill (read-only)
    complexity: medium
    depends_on: [h-02-multica-mcp-surface]
  - id: h-05-reconcile-tick-skill
    title: Formalize reconcile-tick from the cycle-reconciler runbook
    complexity: high
    depends_on: [h-02-multica-mcp-surface, h-03-gate-state-latch]
  - id: h-06-slack-notify-await
    title: Slack notify-and-await human-gate transport
    complexity: high
    depends_on: []
  - id: h-07-kickoff-exec-skill
    title: Author the kickoff-exec skill (start the reconcile loop, gated)
    complexity: medium
    depends_on: [h-05-reconcile-tick-skill, h-06-slack-notify-await]
  - id: h-08-kickoff-plan-skill
    title: Author the kickoff-plan skill (start /plan, route gates to human)
    complexity: medium
    depends_on: [h-06-slack-notify-await]
  - id: h-09-watch-cron-skill
    title: Author the watch-cron skill (routine + daemon health)
    complexity: low
    depends_on: [h-06-slack-notify-await]
  - id: h-10-studio-port-and-docs
    title: Port the 5 skills into Hermes native format on Studio + parity tests + docs
    complexity: high
    depends_on:
      - h-01-hermes-skill-format-recon
      - h-04-monitor-epic-skill
      - h-05-reconcile-tick-skill
      - h-07-kickoff-exec-skill
      - h-08-kickoff-plan-skill
      - h-09-watch-cron-skill
