id: h-07-kickoff-exec-skill
epic: hermes-orchestrator-skills
title: Author the kickoff-exec skill (start the reconcile loop, gated)
status: pending
complexity: medium
methodology: classic
side: plugin-hive
depends_on: [h-05-reconcile-tick-skill, h-06-slack-notify-await]

description: |
  The "go" button for autonomous execution of already-planned work. kickoff-exec
  starts the reconcile loop over an epic that a human has approved
  (gate_state == pre_approved). It REFUSES to start on a non-approved epic. No human
  gate to start (the approval already happened) — but the loop it starts honors the
  review_terminal halt + Slack notify-await from h-05/h-06.

  This is where lights-on begins: a human approves an epic, says go (or a cron does),
  and Hermes drives impl -> review for each ready story, pausing only at review
  verdicts and errors.

acceptance_criteria:
  - "Given gate_state != pre_approved, when kickoff-exec is invoked, then it refuses to start and reports the epic is not approved."
  - "Given gate_state == pre_approved, when invoked, then it begins the reconcile loop and advances ready stories per reconcile-tick."
  - "Given a review_terminal during the loop, when reached, then it halts via the Slack notify-await gate (does not auto-continue)."
  - "Given the loop is already running for the epic, when invoked again, then it is idempotent (no double-dispatch)."

steps:
  - id: research
    description: Define the loop driver over reconcile-tick; confirm the pre_approved precondition + idempotency guard.
    agent: researcher
  - id: implement
    description: Write hive/references/orchestrator-skills/kickoff-exec.md — loop start, refusal path, idempotency, delegation to reconcile-tick.
    agent: developer
    depends_on: [research]
  - id: test
    description: Tests for refusal-when-unapproved, start-when-approved, halt-at-verdict, double-invoke idempotency.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm refusal path solid; loop honors all reconcile-tick gates.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit on feat/hermes-orchestrator-skills.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: hive/references/cycle-reconciler.md
      purpose: The per-tick logic kickoff-exec loops over.

risks:
