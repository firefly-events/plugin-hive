risks:
  - severity: high
    description: A notify-and-continue (not notify-and-await) would defeat the human gate.
    mitigation: The gate blocks on gate_state awaiting; test asserts no advance until a human action resolves it.
  - severity: medium
    description: Slack credentials/secret handling on Studio.
    mitigation: Reuse Studio secret store conventions; do not hardcode tokens.

