id: h-01-hermes-skill-format-recon
epic: hermes-orchestrator-skills
title: Recon and spec the Hermes-agent native skill registry format
status: done
complexity: medium
methodology: classic
side: studio
depends_on: []
parallel_allowed: true
parallel_rationale: read-only
files_to_modify:
  - file: .pHive/epics/hermes-orchestrator-skills/docs/hermes-skill-format-spec.md
    change: write the native-format spec the other skills author against

description: |
  The user confirmed Hermes-agent (Studio, ~/Code/hermes-agent) uses its OWN native
  skill/tool registry — NOT the Claude-Code SKILL.md pattern and NOT bare
  paste-as-prompt runbooks. Before any orchestrator skill can be authored we must
  know that native format: where skills are registered, the file/manifest shape,
  how a skill declares its allowed tools (the multica_* MCP surface), how the cron
  loop selects + invokes a skill per tick, and how state/inputs are passed in.

  This is Studio-side recon (plan-off-repo-bridge): inspect the live fork at
  ~/Code/hermes-agent, do not assume upstream Nous/Hermes docs. Output a concrete
  spec doc that h-04..h-09 author their skills against and h-10 ports into.

acceptance_criteria:
  - "Given the Hermes-agent repo on Studio, when recon completes, then hermes-skill-format-spec.md documents: skill manifest/file shape, registration mechanism, tool-declaration syntax, per-tick invocation + input passing, and state access."
  - "Given the spec, when an author reads it, then they can scaffold one trivial no-op Hermes skill and see it registered + invocable on a tick (proof-of-format)."
  - "Given the multica_* MCP tools, when the spec is written, then it records whether they are already registered in Hermes or must be wired (feeds h-02)."

steps:
  - id: research
    description: On Studio, inspect ~/Code/hermes-agent — skill registry, existing skills, tool wiring, cron tick loop. Capture concrete file paths and the manifest shape.
    agent: researcher
  - id: implement
    description: Write hermes-skill-format-spec.md; scaffold one trivial proof-of-format skill and confirm it registers + runs on a tick.
    agent: developer
    depends_on: [research]
  - id: review
    description: Verify the spec is concrete enough to author against (no hand-waving); confirm proof-of-format skill actually ran.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit spec to the epic docs dir on feat/hermes-orchestrator-skills.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  note: |
    Execution touches ~/Code/hermes-agent on Studio (consumer), but the spec
    artifact lands in plugin-hive (source of contract).
  key_files:
    - path: hive/references/cycle-reconciler.md
      purpose: The current orchestrator runbook; shows what logic must fit the native format.

risks:
  - severity: high
    description: Hermes native format may not cleanly express a multi-step state machine (reconcile-tick), forcing a runbook-as-prompt fallback.
    mitigation: If native format can't hold the machine, spec a hybrid (native skill shell + embedded runbook prompt) and flag to the human before h-05.

references:
  - path: .pHive/epics/hermes-orchestrator-skills/docs/research-brief.md
    relevant_excerpt: |
      §9 gap 2: Hermes-agent skill consumption format on Studio — confirm the
      pattern or whether Hermes has a native skill registry.
