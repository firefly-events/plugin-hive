id: css-4-worker-prompt-rewrite
epic: claude-in-sandcastle-switch
title: Worker prompt invokes /hive:execute instead of inlining work
status: blocked
complexity: medium
methodology: classic
depends_on:
  - css-1-runner-factory-swap
  - css-2-dockerfile-claude-cli
  - css-3-workflow-token-passthrough

description: |
  Current `.sandcastle/prompts/worker-issue-pickup.md` is codex-shaped —
  it inlines the full read-story → plan → edit → test → commit → PR flow
  in ~150 lines because codex has no skill resolver. With css-1/2/3
  landed, the container now runs Claude Code, which DOES resolve
  /hive:execute (and its full TeamCreate orchestration).

  Rewrite the prompt so the worker:

  1. Selects the issue (unchanged from current)
  2. Claims it (unchanged)
  3. Locates the story YAML via `hive:story:<id>` label (unchanged)
  4. Invokes `/hive:execute <story-id-or-path>` — let the skill do the
     orchestration (developer + reviewer + tester per the story's
     methodology + agent_backends routing)
  5. After /hive:execute returns, push the branch + open PR (gh CLI
     pieces stay in the worker because /hive:execute today commits
     locally; PR creation is the worker's responsibility)
  6. Emit `<result>{...}</result>` + `<promise>COMPLETE</promise>`

  Prompt shrinks from ~150 lines to ~60 lines. Quality lifts because:
    - cross-LLM verification fires (orchestrator Claude + dev/research
      Codex sub-agents per existing agent_backends policy)
    - methodology routing fires (TDD/BDD/classic per project config)
    - skill ecosystem available (specialist auto-triggers, /hive:why,
      KG signal emission, etc.)
    - per-story complexity informs team size (low-complexity stories
      may skip review/test steps; medium+ get the full team)

  This is the actual user-facing switchpoint — pre-css-4, container has
  Claude installed + authed but the prompt still treats it like codex.
  Post-css-4, sandcastle worker IS Hive team in a sandbox.

acceptance_criteria:
  - "Given the rewritten prompt is loaded, when claude reads it, then step 4 issues a literal `/hive:execute` invocation (not inlined dev work)."
  - "Given /hive:execute completes inside the container, when control returns to the prompt, then step 5 pushes the branch + opens the PR via gh CLI."
  - "Given the worker runs on a story with `methodology: tdd`, when claude executes, then the team includes a test-spec step BEFORE implementation (verified by reading the worker's emitted log file post-run)."
  - "Given the prompt-invariant test suite (tests/sandcastle-worker-prompt.test.js), when run, then all assertions pass against the new prompt shape — including the new `/hive:execute` invocation assertion."

steps:
  - id: research
    agent: researcher
    description: |
      Read current .sandcastle/prompts/worker-issue-pickup.md in full.
      Read skills/hive/skills/execute/SKILL.md (or wherever /hive:execute
      lives — likely skills/execute/) for what the skill accepts as
      input + what it does NOT handle (so we know what stays in the
      worker prompt — PR creation, label flips, result emission).
      Read tests/sandcastle-worker-prompt.test.js for invariants that
      need updating.
  - id: implement
    agent: developer
    description: |
      Rewrite worker-issue-pickup.md per the description above. Shorter,
      delegates the work-of-implementation to /hive:execute, keeps the
      worker as the issue-lifecycle + result-emission layer. Update the
      prompt-invariant tests.
    depends_on: [research]
  - id: test
    agent: tester
    description: |
      Run node --test tests/sandcastle-worker-prompt.test.js. All pass
      with updated assertions.
    depends_on: [implement]
  - id: review
    agent: reviewer
    description: |
      Sanity-check: worker prompt does NOT duplicate /hive:execute's
      responsibilities. PR-creation stays in the worker. Label flips
      stay in the worker.
    depends_on: [test]
  - id: integrate
    agent: developer
    description: Commit + push.
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: .sandcastle/prompts/worker-issue-pickup.md
      purpose: The prompt being rewritten.
    - path: skills/execute/SKILL.md
      purpose: The skill the rewritten prompt delegates to (read this for the exact invocation contract).
    - path: tests/sandcastle-worker-prompt.test.js
      purpose: Prompt-invariant tests need new assertions for /hive:execute.
    - path: hive/lib/sandcastle-worker-runner.js
      purpose: Runner stays mostly unchanged; sanity-check that nothing in css-1/2/3 left a codex assumption behind.

files_to_modify:
  - file: .sandcastle/prompts/worker-issue-pickup.md
    change: Rewrite to delegate implementation work to /hive:execute
  - file: tests/sandcastle-worker-prompt.test.js
    change: Update assertions to match new prompt shape (drop "inlined dev work" assertions, add "/hive:execute invoked" assertion)

design_decisions:
  - decision: PR creation stays in the worker prompt (NOT /hive:execute)
    rationale: /hive:execute is consumer-agnostic — it implements + tests + commits but doesn't know it's running in a sandcastle context. Worker owns the sandcastle-specific lifecycle (claim issue, push branch, PR, label flip, result emit).
  - decision: Keep current label-based issue → story lookup
    rationale: Already proven (smoke #11+). No reason to change.

risks:
  - severity: medium
    description: /hive:execute may not gracefully run in non-interactive headless mode (designed for Claude Code's interactive UI)
    mitigation: First test will catch this. If the skill prompts for user input that has no source in headless, file a follow-up story to add a --headless or --autonomous flag to /hive:execute that auto-defaults user gates.
  - severity: medium
    description: Cost spike — Claude team-mode is more expensive than single-codex per story
    mitigation: Budget gate already in workflow. Monitor first 5 runs; if median cost > $5/story, file css-5 hybrid-routing as follow-on.
  - severity: low
    description: Prompt rewrite may regress prompt-invariant tests that asserted on the inlined-work shape
    mitigation: Test step explicitly catches this; rewrite assertions alongside the prompt.

references:
  - path: skills/execute/SKILL.md
    relevant_excerpt: "(read at story-execution time — exact invocation contract lives here)"
