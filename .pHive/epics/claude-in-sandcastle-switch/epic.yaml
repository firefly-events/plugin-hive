name: claude-in-sandcastle-switch
title: Sandcastle worker — switch from Codex to Claude Code
description: |
  Swap the in-container agent from Codex (gpt-5.4 family) to Claude Code,
  unlocking TeamCreate, /hive:execute, skill ecosystem, and methodology
  workflows inside the sandcastle container. Preserves subscription cost
  profile via CLAUDE_CODE_OAUTH_TOKEN (verified portable on GH-hosted
  runners — see claude-auth-spike run 25982110989).

  Motivation: current codex-based worker is functionally a "smart commit
  bot" — single agent, no collaboration, no skill calls, no TDD/BDD
  methodology. Worked for grooming-class stories (ulo-1 shipped 605 LOC,
  mhg-3 shipped a small skill patch), but plateaus on anything needing
  cross-LLM verification, multi-role review, or skill orchestration.

  Switching to Claude Code in-container = "Hive team in a sandbox":
    - claudeCode CLI resolves /hive:execute (which spawns dev + reviewer
      + tester per project methodology + agent_backends routing)
    - Cross-LLM verification stays (per existing routing policy: claude
      orchestrates, codex sub-agents handle dev/researcher/writer work)
    - Skill ecosystem visible via bind-mounted worktree
    - KG signal emission integrates (worker runs through the same paths
      as local /hive:execute)

  Provenance: spike PR #114, verified by run 25982110989 ("OK" returned
  from claude --print via subscription OAuth on GH-hosted ubuntu).
target_codebase: /Users/don/Documents/plugin-hive
methodology: classic

stories:
