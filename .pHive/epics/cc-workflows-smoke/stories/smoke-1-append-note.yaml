description: |
  Append a single timestamped line to the NOTES-1.md sentinel file at
  .pHive/smoke/cc-workflows/NOTES-1.md. This story exists ONLY to exercise the
  cc-workflows execution substrate end-to-end with a minimal write surface.

  The story is intentionally trivial. The interesting behavior under test is
  NOT the file edit — it is the surrounding plumbing:
    - Workflow tool dispatch path resolution
    - Per-story polling + terminal status normalization
    - Episode marker + .messages.jsonl sidecar write
    - Orchestrator-attributed serial reconcile and commit on feat/cc-workflows-smoke

  Disposition: throwaway. Never merges.

acceptance_criteria:
  - "Given the cc-workflows-smoke epic is being executed via /hive:execute with HIVE_EXECUTION_RUNTIME=workflows, when this story dispatches, then .pHive/smoke/cc-workflows/NOTES-1.md is appended with one line in the form `<ISO-8601-utc> smoke-1-append-note <run-id>`."
  - "Given the story completes, when the orchestrator runs serial reconcile, then a single commit lands on feat/cc-workflows-smoke whose subject begins with `chore(smoke): smoke-1-append-note`."
  - "Given the story dispatched through cc-workflows mode, when execution finishes, then an episode marker + .messages.jsonl sidecar exist under the run state directory and reference this story's ID."

steps:
  - id: implement
    description: |
      Append exactly one line of the form `<ISO-8601-utc> smoke-1-append-note <run-id>`
      to .pHive/smoke/cc-workflows/NOTES-1.md. Create the file if missing. Do not
      modify any other file.
    agent: developer

