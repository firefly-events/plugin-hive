description: |
  /hive:why crashes in free-form mode with "RuntimeError: dictionary changed size during iteration" propagating from the ChromaDB provider call. Fix: wrap _extract_chroma_response (hive/lib/kg_why.py:292) to catch RuntimeError and return ([] | False) — degrades free-form mode to sqlite-only when ChromaDB misbehaves. Add a single log line on catch: "kg_why.chromadb_runtime_error reason=<message>" so we know how often it fires. NOT a chromadb library fix — bounded containment only.

acceptance_criteria:
  - "Given a ChromaDB provider that raises RuntimeError(\"dictionary changed size during iteration\"), when _extract_chroma_response is called, then it catches the RuntimeError and returns (False, []) without re-raising."
  - "Given the catch fires, when stderr is captured, then it contains one line of the form \"kg_why.chromadb_runtime_error reason=<message>\"."
  - "Given a ChromaDB provider that raises any other exception class, when _extract_chroma_response is called, then the exception still propagates — catch is RuntimeError-scoped, not catch-all."
  - "Given python3 -m hive.lib.kg_why \"test query\" --limit 5 is invoked end-to-end against a kg.sqlite with no matching triples, when the run completes, then exit code is 0 and stdout contains \"No decisions found\"."

