description: |
  Per grill finding H2: DAG walker (walker.py:944,954,968,1199,1204) emits phase_blocked + phase_failed but audited DB has only 1 phase_blocked triple from /plan, not from walker. Three possible causes: (a) same DB, just rare; (b) different DB path; (c) silently dropped (FK off, knob off, missing-sqlite swallow). Use /hive:kg-stats from s1 + manual queries to determine which. Write a findings doc; if (b) or (c), this story scopes a fix path (sequenced into s3-phase-lifecycle-wire as blocker if non-trivial).

acceptance_criteria:
  - "Given the DAG walker emit callsites at walker.py:944,954,968,1199,1204 are instrumented (temporary print or log line), when a representative DAG run executes (any /execute call), then we observe exactly which sqlite path and predicate values are written and whether INSERT succeeds."
  - "Given the investigation completes, when findings are written to .pHive/epics/kg-repair-activation/docs/h2-investigation.md, then the doc names cause (a/b/c) + evidence (log lines, SELECT outputs) + recommended fix for s3 to consume."
  - "Given cause (b) different-DB: docs recommend consolidation approach. Given (c) silently dropped: docs name root cause (FK / knob / swallow) and bounded fix scope."
  - "Given cause (a) same-DB-just-rare: docs confirm s3 phase-lifecycle wiring is additive-only and recommend no extra scope."

