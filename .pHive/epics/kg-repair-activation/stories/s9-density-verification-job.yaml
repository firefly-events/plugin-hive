description: |
  Scripted check runs (manual or scheduled) at epic-merge + 30 days. Queries kg.sqlite for: density (triples/day over last 30d), distinct firing predicates, distinct source_agents. If thresholds met (≥6/day, ≥5 predicates, ≥3 source_agents), script opens a draft PR bumping hive.config.yaml line 49 from kg_signal: 0.4 to kg_signal: 0.8. Maintainer reviews + merges. Does NOT auto-commit the weight change.

acceptance_criteria:
  - "Given scripts/kg-density-verification.mjs is run, when kg.sqlite contains 30d of triples meeting thresholds (≥6/day, ≥5 distinct firing predicates, ≥3 source_agents), then the script opens a draft PR via gh pr create with the diff bumping kg_signal: 0.4 → 0.8."
  - "Given thresholds NOT met, when the script runs, then it prints the gap (e.g. \"density=4.2/day, target=6/day\") and exits 1 without opening a PR."
  - "Given the script is idempotent, when run twice in succession with thresholds met, then a second open draft PR is NOT created (checks for existing open PR with same branch name first)."
  - "Given the maintainer reviews the draft PR, when they merge it, then meta-optimize step-02c-kg-signal weighting reflects the new value on next ceremony run."

