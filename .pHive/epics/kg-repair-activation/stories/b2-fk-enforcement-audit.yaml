title: "Audit + enable PRAGMA foreign_keys on kg.sqlite connections"
status: complete
complexity: low
methodology: classic
depends_on: []
parallel_allowed: true
parallel_rationale: bounded-slice

description: |
  Schema declares "predicate TEXT NOT NULL REFERENCES predicates(predicate)" but SQLite does not enforce FKs unless "PRAGMA foreign_keys = ON" runs per-connection. If FK is off, undeclared-predicate emits (e.g. phase_handoff bug) succeed silently. Audit every sqlite3.connect callsite in hive/lib/kg_*, hive/lib/dag_executor, scripts/kg-*. Ensure PRAGMA is set after every connect. Add a regression test: attempt INSERT with undeclared predicate; expect IntegrityError.

acceptance_criteria:
  - "Given every sqlite3.connect() on kg.sqlite in the repo, when audited, then each connection has \"PRAGMA foreign_keys = ON\" executed immediately after open OR uses a shared connection helper that does so."
  - "Given an INSERT statement attempts to write a triple with an undeclared predicate, when foreign keys are ON, then the INSERT raises sqlite3.IntegrityError."
  - "Given the regression test runs against a fresh kg.sqlite seeded from schema bootstrap, when the test attempts to insert with predicate=\"bogus_undeclared\", then sqlite3.IntegrityError is raised."
  - "Given the audit finds connections that previously skipped the PRAGMA, when those callsites are patched, then they pass a lint test that greps for \"sqlite3.connect.*kg\" without \"PRAGMA foreign_keys\" within 10 lines."

