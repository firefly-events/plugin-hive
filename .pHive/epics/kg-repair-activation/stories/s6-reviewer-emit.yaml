id: s6-reviewer-emit
epic: kg-repair-activation
tracker_id: "d873e322-ce5f-4dd3-b5e7-a17d291ae503"
tracker_url: ""
tracker_number: "PLU-90"
title: "Reviewer agent emits validated at shutdown"
status: complete
complexity: low
methodology: classic
depends_on: ["s5-role-predicates-schema"]
parallel_allowed: true
parallel_rationale: variation

description: |
  Reviewer persona emits one validated triple per story-review completion, at shutdown (same call sequence as insights-before-shutdown but as a separate structured emit, NOT inside insight text). Subject=<story-id>, predicate=validated, object=<verdict: approve|approve-with-changes|reject>, source_agent=reviewer, source_epic=<epic-id>. Hook in hive/agents/reviewer.md persona contract + the agent-shutdown coordination point.

acceptance_criteria:
  - "Given the reviewer agent completes a story review, when shutdown_request is received, then exactly one validated triple is emitted with object=<verdict>."
  - "Given the reviewer review yields verdict=approve, when the emit fires, then object=\"approve\" (case-stable)."
  - "Given the reviewer is shut down without completing a review, when shutdown fires, then no validated triple is emitted (silent — must have an actual review to emit on)."
  - "Given a 30-day post-merge audit, when SELECT COUNT(*) FROM triples WHERE predicate='validated' AND source_agent='reviewer', then count > 0."

steps:
  - id: research
    description: Explore the codebase for relevant patterns, files, and constraints
    agent: researcher
  - id: implement
    description: Implement the story according to spec and research findings
    agent: developer
    depends_on: [research]
  - id: test
    description: Write tests covering acceptance criteria and verify they pass
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review implementation and tests for correctness and convention compliance
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch
    agent: developer
    depends_on: [review]

files_to_modify:
  - file: hive/agents/reviewer.md
    change: Add shutdown-emit contract referencing kg_emit_cli with predicate=validated
  - file: hive/lib/agent_shutdown_emits.py
    change: New helper (shared by s6/s7/s8) — single fn to emit role triple at shutdown
  - file: tests/test_reviewer_kg_emit.py
    change: Test shutdown emits validated

metric:
  applies: true
  name: kg.validated_triples
  direction: up
  unit: triples
  baseline: 0
  target: 5
  window: epic-merge-plus-30-days
  source:
    kind: sql
    ref: "SELECT COUNT(*) FROM triples WHERE predicate='validated' AND source_agent='reviewer'"
  verify_at: epic-merge-plus-30-days
  owner: maintainer
