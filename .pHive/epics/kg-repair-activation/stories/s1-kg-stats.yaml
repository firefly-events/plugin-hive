description: |
  Add a top-level skill skills/hive/skills/kg-stats/SKILL.md plus a Python helper hive/lib/kg_stats.py that prints: total triple count, per-predicate count, per-source-agent count, per-source-epic count, last-write timestamp, distinct (source_agent, predicate) tuple count, and trailing-30-day density. Output as a formatted table by default; --json for machine-readable. This is the baseline tool s2/s9 will use to measure progress.

acceptance_criteria:
  - "Given the skill is invoked via /hive:kg-stats, when ~/.claude/hive/kg.sqlite exists, then a formatted table prints total triples, per-predicate breakdown, per-source-agent breakdown, distinct-tuple count, last-write timestamp, and 30-day density."
  - "Given --json flag is passed, when the skill runs, then the same data emits as JSON to stdout with no formatting."
  - "Given the kg.sqlite file is missing, when the skill runs, then it exits 0 with a one-line \"no kg database found at <path>\" message — silent-soft-fail per other KG tooling."
  - "Given the predicates table contains predicates that have zero triples in the triples table, when the skill runs, then those zombie predicates are listed in a dedicated \"DECLARED-BUT-NEVER-WRITTEN\" section."

