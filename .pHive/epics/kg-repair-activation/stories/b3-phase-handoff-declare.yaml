description: |
  hive/lib/handoff/dispatch.mjs:90 emits the predicate "phase_handoff" which is not in the declared list at hive/references/knowledge-graph-schema.md:183. Once b2 enables FK enforcement, these emits will start raising IntegrityError. Add phase_handoff to declared schema, bootstrap migration to INSERT into predicates table on existing DBs.

acceptance_criteria:
  - "Given hive/references/knowledge-graph-schema.md is read, when the predicates list is inspected, then phase_handoff is present alongside the 9 existing predicates."
  - "Given an existing kg.sqlite without phase_handoff in the predicates table, when the bootstrap migration runs, then phase_handoff is inserted (idempotent — re-run is safe)."
  - "Given handoff/dispatch.mjs emits a phase_handoff triple after b2 enables FK enforcement, when the INSERT runs, then it succeeds (no IntegrityError)."
  - "Given the schema doc explains predicate semantics, when phase_handoff is added, then it carries a one-line semantic description alongside phase_started/phase_complete/phase_failed/phase_blocked."

