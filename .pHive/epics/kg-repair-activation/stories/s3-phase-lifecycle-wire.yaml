title: "Wire phase_started + phase_complete in DAG walker"
status: pending
complexity: medium
methodology: classic
depends_on: ["s2-dag-walker-emit-investigation"]

description: |
  Wire phase_started and phase_complete emits in hive/lib/dag_executor/executor/walker.py at the same call sites that already emit phase_blocked + phase_failed. Per grill U1, this story consumes s2 findings: if H2 found cause (a), this is purely additive; if (b)/(c), this story incorporates the fix scope s2 names. Update meta-optimize step-02c-kg-signal.md consumer query to include phase_started + phase_complete in its predicate set.

acceptance_criteria:
  - "Given the DAG walker enters a step, when the step starts, then a phase_started triple is emitted with subject=<step-id>, source_agent=<step-agent>, source_epic=<epic-id>."
  - "Given the DAG walker exits a step successfully, when the step completes, then a phase_complete triple is emitted with the same subject + provenance."
  - "Given a step that already emits phase_blocked or phase_failed, when those branches execute, then phase_started still emits at entry (no double-emit of complete on blocked/failed paths)."
  - "Given meta-optimize step-02c-kg-signal.md, when it reads the KG, then its predicate query includes phase_started and phase_complete alongside phase_failed, phase_blocked, superseded."
  - "Given a 1-week post-merge density check via /hive:kg-stats, when phase_started/phase_complete are counted, then both have non-zero triples (firing state per V1 taxonomy)."

