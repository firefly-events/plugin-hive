files_to_modify:
  - file: hive/lib/dag_executor/executor/walker.py
    change: Add phase_started emit at step entry + phase_complete at success exit
  - file: hive/workflows/steps/meta-team-cycle/step-02c-kg-signal.md
    change: Expand consumer predicate set to include phase_started + phase_complete
  - file: tests/test_dag_walker_kg_emits.py
    change: New test asserting both predicates emit on a representative step run

