description: |
  Add three new declared predicates — validated (reviewer), tested (tester), implemented (developer) — to hive/references/knowledge-graph-schema.md and seed them in the predicates table via kg_bootstrap. Update meta-optimize step-02c-kg-signal.md consumer query to include the new predicates (per grill P1 — contract change, not side-effect risk). No agent emits yet — s6/s7/s8 own those.

acceptance_criteria:
  - "Given hive/references/knowledge-graph-schema.md, when the predicates list is read, then validated, tested, and implemented are declared with one-line semantic descriptions."
  - "Given an existing kg.sqlite, when the bootstrap migration runs, then the three new predicates are inserted into the predicates table (idempotent)."
  - "Given meta-optimize step-02c-kg-signal.md, when it reads the KG, then its consumer query includes validated, tested, implemented alongside existing predicates."
  - "Given a manual emit via kg_emit_cli with predicate=validated, when FK enforcement is on (b2), then the INSERT succeeds."

