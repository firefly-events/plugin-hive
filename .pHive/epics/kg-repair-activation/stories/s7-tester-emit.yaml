release_id: "v2.11.0"
complexity: low
methodology: classic
depends_on: ["s5-role-predicates-schema"]
parallel_allowed: true
parallel_rationale: variation

description: |
  Tester persona emits one tested triple per story-test completion at shutdown. Subject=<story-id>, predicate=tested, object=<verdict: pass|fail|inconclusive>, source_agent=tester, source_epic=<epic-id>. Uses the shared helper from s6.

acceptance_criteria:
  - "Given the tester agent completes story tests, when shutdown_request is received, then exactly one tested triple is emitted with object=<verdict>."
  - "Given test results are pass, when the emit fires, then object=\"pass\"."
  - "Given a 30-day post-merge audit, when SELECT COUNT(*) WHERE predicate='tested', then count > 0."

steps:
  - id: research
    description: Explore the codebase for relevant patterns, files, and constraints
    agent: researcher
  - id: implement
    description: Implement the story according to spec and research findings
    agent: developer
    depends_on: [research]
  - id: test
    description: Write tests covering acceptance criteria and verify they pass
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review implementation and tests for correctness and convention compliance
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch
    agent: developer
    depends_on: [review]

files_to_modify:
  - file: hive/agents/tester.md
    change: Add shutdown-emit contract referencing kg_emit_cli with predicate=tested
  - file: tests/test_tester_kg_emit.py
    change: Test shutdown emits tested

metric:
  applies: true
  name: kg.tested_triples
  direction: up
  unit: triples
  baseline: 0
  target: 5
  window: epic-merge-plus-30-days
  source:
    kind: sql
    ref: "SELECT COUNT(*) FROM triples WHERE predicate='tested' AND source_agent='tester'"
  verify_at: epic-merge-plus-30-days
  owner: maintainer
