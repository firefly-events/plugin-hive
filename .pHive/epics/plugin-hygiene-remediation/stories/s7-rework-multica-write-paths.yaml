risks:
  - severity: high
    description: Changing write paths breaks live multica dispatch (episode sync, cycle-state persistence) for current consumers.
    mitigation: Default-config byte-identical assertion + conformance fixture; this is a bridge surface (charter) so conformance is mandatory.
  - severity: medium
    description: Node and Python resolvers drift, splitting where runs land.
    mitigation: Shared conformance fixture is the gate; Python is resolver-primary per charter.
