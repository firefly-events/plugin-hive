id: mhg-2-readme-toc
epic: meta-hive-grooming-may2026
title: Add table of contents to README
status: pending
complexity: low
methodology: classic
depends_on: []

description: |
  README.md lacks a TOC. Users hunting for installation, quickstart, or
  concept sections must scroll. Add a markdown TOC at the top after the
  hero/intro block so anchor links jump to each top-level section.

  Keep TOC manual (not auto-generated) — README is short enough and
  manual control avoids tooling deps. Match GitHub anchor convention
  (lowercase, hyphens for spaces, strip punctuation).

acceptance_criteria:
  - "Given README.md is opened on GitHub, when scrolled to top, then a Table of Contents block appears between the hero/intro and the first major section."
  - "Given a TOC entry is clicked, when the link resolves, then the page jumps to the matching section heading."
  - "Given any future README section is added or renamed, when the TOC is reviewed, then the entry can be added/updated by hand without tooling."

steps:
  - id: implement
    agent: developer
    description: |
      Edit README.md. Insert TOC block between hero block and first
      "## " heading. Validate every link resolves to an existing
      heading using GitHub's anchor convention.
  - id: review
    agent: reviewer
    description: Visual review on GitHub preview. Confirm anchor links work.
    depends_on: [implement]
  - id: integrate
    agent: developer
    description: Commit on feat/meta-hive-grooming-may2026 branch.
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: README.md
      purpose: Sole file edited.

risks:
  - severity: low
    description: README sections may be reorganized later, breaking anchors.
    mitigation: Add a one-line comment near the TOC reminding the editor to update it on rename.
