id: s1-multica-adapter
epic: multica-substrate-adoption
title: Multica task-tracking adapter (Hive ABI 1.0.0)
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  Implement a Multica adapter conforming to Hive's task-tracking ABI
  (`hive/adapters/<vendor>/index.ts`), mirroring the shape of the existing
  `github` and `linear` adapters. The adapter is the single creation point
  for Multica issues from /plan Phase D (story s2 consumes it).

  Wire format: JSON request on stdin → JSON response on stdout. Success
  `{"result": {...}}` exit 0; error `{"error": {"code":...}}` exit 1.

  Methods implemented (ABI 1.0.0 surface):
  - `createStory({ title, body, labels, parent_id })` → returns issue id + url
  - `updateStory({ id, status })` — issue status transitions (todo/in_progress/in_review/done/cancelled)
  - `addComment({ id, body })` — post comment to issue
  - `getStory({ id })` — fetch issue metadata for round-trip

  Story ID encoding: `<workspace-slug>/<identifier>` (e.g. `plugin-hive/PLU-42`).
  Identifier is Multica's prefix + number, returned in the issue create
  response. Use this as the round-trip key in story YAML `tracker_id`.

  Auth: bearer PAT from `~/.multica/config.json` (the `token` field) OR
  `MULTICA_TOKEN` env override. No interactive auth in this adapter — the
  bootstrap story (s3) handles auth setup.

  Transport: direct HTTP via Node fetch. No multica CLI shell-out (avoids
  per-call process spawn). Base URL from `~/.multica/config.json`
  `server_url` field or `MULTICA_SERVER_URL` env override.

acceptance_criteria:
  - "Given a request `{\"method\":\"createStory\",\"params\":{\"title\":\"T\",\"body\":\"B\",\"labels\":[\"hive:ready\"]}}` on stdin, when the adapter runs, then stdout emits `{\"result\":{\"id\":\"plugin-hive/PLU-N\",\"url\":\"http://localhost:3000/plugin-hive/issues/N\"}}` and exit code is 0."
  - "Given a request with method `updateStory` and `params: { id: 'plugin-hive/PLU-1', status: 'done' }`, when the adapter runs, then the Multica issue status transitions and the response shape is `{\"result\":{\"id\":...,\"status\":\"done\"}}`."
  - "Given a request with method `addComment` and `params: { id: 'plugin-hive/PLU-1', body: '...' }`, when the adapter runs, then a comment is posted to the issue and the response includes the new comment id."
  - "Given missing/invalid PAT, when any method runs, then stderr explains how to set it and exit code is 1 with error code `AUTH_FAILURE`."
  - "Given an unsupported method, then exit code is 1 with error code `UNKNOWN_METHOD`."
  - "Given a rate-limit response from Multica, then exit code is 1 with error code `RATE_LIMIT` and `retry_after_ms` populated from Retry-After header (or null if absent)."

