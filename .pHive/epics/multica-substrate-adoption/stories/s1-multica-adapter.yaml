    description: Read hive/adapters/github/index.ts + hive/adapters/linear/index.ts to lock the ABI shape; probe Multica's REST surface (POST /api/issues, PATCH /api/issues/:id, POST /api/issues/:id/comments — verify against running spike at http://127.0.0.1:8080)
    agent: researcher
  - id: implement
    description: Write hive/adapters/multica/index.ts + package.json + README.md + .gitignore mirroring linear adapter structure
    agent: developer
    depends_on: [research]
  - id: test
    description: hive/adapters/multica/test/adapter.test.ts — covers 6 AC cases against a mock Multica HTTP server
    agent: tester
    depends_on: [implement]
  - id: review
    description: Verify ABI parity with github + linear adapters; check no Multica-specific leakage into ABI surface
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feat/multica-substrate-adoption
    agent: developer
    depends_on: [review]

