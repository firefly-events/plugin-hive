design_decisions:
  - decision: Direct HTTP fetch, no multica CLI shell-out
    rationale: Avoids per-call process spawn; ABI runs in the same lifecycle as github (gh CLI) so a fast in-process call beats CLI overhead
  - decision: PAT from ~/.multica/config.json with env override
    rationale: Consistent with multica CLI's own auth lookup; bootstrap (s3) writes this file as first step
  - decision: Story ID format = workspace-slug/identifier (e.g. plugin-hive/PLU-42)
    rationale: Mirrors github's owner/repo#N pattern; round-trips cleanly without needing UUID lookups
  - decision: addComment + updateStory are MVP-required even though /plan only calls createStory
    rationale: /execute and /review will call these via dispatch in follow-on epics; better to land the full surface now than churn the adapter

cross_cutting:
  - concern: documentation
    action: README.md in adapter dir + friction-notes.md for API quirks; cross-link from hive/lib/task-tracking-dispatch/README.md
  - concern: versioning
    action: New adapter — no consumer-visible behavior change until s2 wires it in. No version bump for this story alone.

metric:
  applies: false
  justification: This story implements a substrate component (the adapter binary itself). The user-facing impact arrives via s2 (/plan Phase D wiring) which is where the metric — issues filed per /plan run — properly attaches.

risks:
  - severity: medium
    description: Multica's REST API surface is moving (30k stars, active dev); endpoint paths may drift
    mitigation: Friction-notes.md records observed shapes; adapter integration tests against mock pin the contract we depend on; bump adapter version when Multica shifts
  - severity: low
    description: PAT expires after 90 days by default; adapter won't refresh
    mitigation: AUTH_FAILURE error message instructs user to re-run bootstrap (s3) which refreshes PAT

