id: s3-multica-init-bootstrap
epic: multica-substrate-adoption
title: /hive:multica-init bootstrap skill (one-command Multica setup)
status: pending
complexity: medium
methodology: classic
depends_on: [s1-multica-adapter, s4-persona-agent-config]

description: |
  A single skill — `/hive:multica-init` — that bootstraps Multica adoption
  end-to-end on a developer's machine. Idempotent on re-run. Behaviors:

  1. **Server check.** Detect whether `http://localhost:8080/healthz` returns
     200. If not, walk the user through `cd <multica-repo> && podman compose -f docker-compose.selfhost.yml up -d`
     OR offer to run it (require explicit confirmation — touches their system).

  2. **CLI install.** Detect `multica` on PATH; if missing, run
     `brew install multica-ai/tap/multica` (or print instructions if brew
     unavailable).

  3. **Auth.** If `~/.multica/config.json` has no token, walk through the
     dev verification code path (POST /auth/send-code → POST /auth/verify-code
     with MULTICA_DEV_VERIFICATION_CODE OR prompt for the code shown in
     backend logs); mint a PAT via POST /api/tokens; write config file.

  4. **Workspace.** Read `task_tracking.team_value` (workspace slug from
     hive.config.yaml). If workspace doesn't exist, create via
     POST /api/workspaces. Set as default via `multica workspace switch`.

  5. **Daemon.** Run `multica daemon start` if not running; verify
     `multica daemon status` returns running.

  6. **Agents.** Read `.pHive/multica/agents.yaml` (from s4). For each
     entry, look up agent by name in the workspace; create if missing,
     update env/instructions/model if drift detected. Idempotent.

  7. **Repo allowlist.** If `task_tracking.repo_url` is set in
     hive.config.yaml, add to the workspace's repo allowlist via
     POST /api/workspaces/{id}/repos (or similar endpoint — verify in s1
     research).

  Exit cleanly with a status report: workspace URL, daemon PID, registered
  agents.

acceptance_criteria:
  - "Given Multica is not yet running, when /hive:multica-init runs, then it prompts the user to start podman compose, waits for /healthz=200, and then continues. The skill never tries to silently start containers."
  - "Given multica CLI is not installed, when /hive:multica-init runs, then it offers to install via brew (with explicit consent) or prints exact install command."
  - "Given ~/.multica/config.json has no token, when /hive:multica-init runs, then it walks through send-code + verify-code + create PAT (using MULTICA_DEV_VERIFICATION_CODE if set in the running backend's env), and writes the config file."
  - "Given everything above is already set up, when /hive:multica-init runs again, then it makes zero state-changing API calls and exits with a 'all set' report (idempotent)."
  - "Given .pHive/multica/agents.yaml declares 3 agents (developer/tester/reviewer) and only 2 exist in the workspace, when /hive:multica-init runs, then it creates the missing one without touching the existing two."
  - "Given .pHive/multica/agents.yaml declares an agent with a custom_env that drifts from the workspace state, when /hive:multica-init runs, then it patches the existing agent rather than creating a duplicate."

steps:
  - id: research
    description: Confirm Multica APIs for workspace create, agent CRUD (POST /api/agents, GET /api/workspaces/{id}/agents, PATCH /api/agents/{id}), repo allowlist endpoint, and PAT creation flow against the running spike
    agent: researcher
  - id: implement
    description: Write skills/multica-init/SKILL.md with steps + helper scripts under hive/lib/multica-bootstrap/ for HTTP calls; resolve dependencies on s4 agents.yaml schema
    agent: developer
    depends_on: [research]
  - id: test
    description: tests/multica-init/bootstrap.test.mjs — covers 6 AC cases against mock Multica server; smoke test runs full bootstrap against real running spike
    agent: tester
    depends_on: [implement]
  - id: review
    description: Verify idempotency (re-run produces no API writes when nothing changed); verify no auto-execution of destructive shell commands without consent
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: skills/kickoff/SKILL.md
      purpose: Reference for skill structure + how it interacts with hive.config.yaml
    - path: hive/adapters/multica/index.ts
      purpose: Adapter produced by s1 — bootstrap may reuse its HTTP helpers
    - path: .pHive/multica/agents.yaml
      purpose: Consumed by step 6 — declarative agent specs (s4 owns the schema)
    - path: ~/.multica/config.json
      purpose: Output written by step 3

files_to_modify:
  - file: skills/multica-init/SKILL.md
    change: NEW — the bootstrap skill
  - file: hive/lib/multica-bootstrap/index.mjs
    change: NEW — shared HTTP helpers for the bootstrap flow (workspace ensure, agent upsert, repo allowlist sync)
  - file: hive/lib/multica-bootstrap/README.md
    change: NEW — module README
  - file: tests/multica-init/bootstrap.test.mjs
    change: NEW — covers 6 AC cases

design_decisions:
  - decision: Explicit consent before any state-changing shell command (podman compose, brew install)
    rationale: Bootstrap touches user system; default to safe — explain, ask, then act
  - decision: Bootstrap is its own skill, not folded into /hive:kickoff
    rationale: /hive:kickoff is project-init; /hive:multica-init is substrate-init. Different lifecycles — bootstrap may be re-run after migrations or auth expiry
  - decision: Upsert semantics for agents (create-or-update by name)
    rationale: Allows the agents.yaml spec to evolve over time without manual cleanup; matches the principle that .pHive/ is the source of truth for declarative state
  - decision: PAT created with no explicit expiration (Multica default = no expiry for self-host PATs verified during spike)
    rationale: Self-host means user owns rotation discipline; documenting expiry surprises later beats silent failures

cross_cutting:
  - concern: documentation
    action: README + GUIDE updates (covered in s5) reference /hive:multica-init as the first step for new contributors

metric:
  applies: false
  justification: Bootstrap is a one-time infra setup skill — there is no meaningful trend over time to measure. Its success is binary (system in expected state after run) and is verified by AC #4's idempotency check.

risks:
  - severity: medium
    description: Multica's API endpoints for agent CRUD and repo allowlist may differ from what spike observed for workspace/issue/comment surfaces
    mitigation: Step 1 (research) confirms each endpoint against running spike before implement; friction-notes.md (s1) captures any shape differences
  - severity: low
    description: Brew install may require admin password on first run
    mitigation: Skill prints command + waits for user to run it explicitly when admin is needed; never sudo-pipes installers

references:
  - path: ~/.multica/config.json
    relevant_excerpt: |
      {
        "server_url": "http://localhost:8080",
        "app_url": "http://localhost:3000",
        "token": "mul_..."
      }
