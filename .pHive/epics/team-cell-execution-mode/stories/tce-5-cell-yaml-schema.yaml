    relevant_section: "§4.4 Slice 2; §5.2 Roster resolution / Cell YAML shape; §10 V2; §11 slice-2.3"
  - path: .pHive/epics/team-cell-execution-mode/docs/hv-plan.md
    relevant_section: "§1.4 Config layer; §2 Slice 2"
  - path: .pHive/epics/team-cell-execution-mode/docs/design-discussion.md
    relevant_section: "§2.2; §8 #2 / #4 / #5; §10 V2"
