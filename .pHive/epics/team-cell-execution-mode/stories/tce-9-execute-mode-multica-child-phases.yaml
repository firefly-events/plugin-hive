    - path: hive/lib/multica-story-dispatch/index.mjs
      purpose: `dispatchStoryToAgent` + `pollTaskUntilTerminal` reused as-is.
    - path: hive/lib/multica-story-dispatch/episode-sync.mjs
      purpose: `writeMulticaRunEpisode` with `phase` parameter (tce-6).
    - path: hive/team-cells/execute-cell.yaml
      purpose: Roster spec consumed by the resolver (tce-5).

files_to_modify:
  - file: skills/hive/skills/execute-mode-multica/SKILL.md
    change: Add steps 3-4 — child issue per workflow-phase, brief injection, termination polling, marker write, U2 failure-policy table, parent close.

design_decisions:
  - decision: U2 failure-policy is one explicit mapping table.
    rationale: Grill U2 — design had three overlapping behaviors (§2.3 step 3e, §3 R3, §5 Q2); table consolidates them.
  - decision: Inter-phase context channel is marker `artifacts:` file paths only.
    rationale: R2 mitigation — next child's brief includes those file refs verbatim; no prose in markers.

risks:
  - severity: high
    description: R1 — N+1 CLI roundtrips per story may multiply latency 2-4x; multiplied across an epic this is the dominant scaling risk.
    mitigation: Optional slots capped in cell YAML; circuit-breaker at `story_timeout_minutes=45` aborts pathological cases.
  - severity: high
    description: R2 — Without disciplined `artifacts:` plumbing, child N+1 starts cold without phase-N output and retry rate degrades.
    mitigation: Marker schema doc (tce-7) forbids prose; brief-injection step references marker artifacts verbatim.

