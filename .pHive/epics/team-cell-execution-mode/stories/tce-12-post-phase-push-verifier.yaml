files_to_modify:
  - file: hive/lib/multica-story-dispatch/index.mjs
    change: Add `verifyPushTarget(taskId, epicId)` function using `git ls-remote origin agent/developer/{task_id}`.
  - file: skills/hive/skills/execute-mode-multica/SKILL.md
    change: Wire verifier into step 3c→3d termination handling.

design_decisions:
  - decision: Outcome label on orphan-push detection is `failed`, NOT `escalated`.
    rationale: H3 — failure triggers retry per `max_step_retries`; escalation has different semantics in the U2 table.
  - decision: Verifier uses `git ls-remote` rather than a daemon-side hook.
    rationale: hv-plan §1.7 / outline §4.7 — out-of-band verification keeps the check independent of daemon state.

risks:
  - severity: medium
    description: R3 contingency — if verifier false-positives on legitimate `agent/<role>/<task>` patterns, the verifier may need an allow-list.
    mitigation: Per outline §6 R3 contingency, add allow-list to verifier config rather than weakening the rule.

