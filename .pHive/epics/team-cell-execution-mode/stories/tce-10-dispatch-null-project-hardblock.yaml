    change: Add F1 hard-block hook before step 3 (child fan-out); document warn-only as future-epic relax-path.

design_decisions:
  - decision: Hard-block on null `project_id` stands; warn-only is doc-only future-epic relax-path.
    rationale: P1 resolution per outline §5.1 + hv-plan §0 P1 — parallel-dispatch-gate precedent (ed-7) is hard-block; this is an enforcement gate, not a kickoff gate.

risks:
