description: |
  Build a reproducible fixture that seeds a temporary `~/.claude/hive/kg.sqlite`
  with a known set of triples and walks step-02c-kg-signal.md against it to
  produce a `kg-findings.yaml` artifact. The fixture proves the kg-signal
  feed actually emits non-empty findings when triples exist — the per-epic
  smoke test for the kg-augmented-meta-signal epic's third proposal-source
  feed. No package.json, no better-sqlite3 — `/usr/bin/sqlite3` only.

acceptance_criteria:
  - "tests/fixtures/kg-augmented-meta-signal/seed.sql + run.sh exist and run end-to-end"
  - "Fixture seeds kg.sqlite with ≥7 triples across phase_failed, phase_blocked, superseded predicates"
  - "Walking step-02c against the seeded KG produces a kg-findings.yaml with ≥1 finding entry"
  - "Step-03 routing predicate evaluates true when kg-findings is non-empty (mental trace via spec quotation)"

steps:
  - id: research
    description: Read step-02c-kg-signal.md task sequence; pick the predicate set + recency window the fixture must exercise.
    agent: researcher
  - id: implement
    description: Author seed.sql with 7 triples (3 phase_failed + 3 phase_blocked + 1 superseded). Author run.sh that seeds a tmp kg.sqlite under HOME=fake_home, emits a fixture-state.txt, and supports --keep for hand-walk testing.
    agent: developer
    depends_on: [research]
  - id: test
    description: Run the fixture, walk step-02c's task sequence against the seeded DB, capture kg-findings.yaml, assert ≥1 finding emitted.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm no package.json / no node deps added; confirm fixture cleanup is hermetic; confirm test-results.md cites quoted spec evidence for AC1/AC4.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit on feat/kg-augmented-meta-signal.
    agent: developer
    depends_on: [review]

