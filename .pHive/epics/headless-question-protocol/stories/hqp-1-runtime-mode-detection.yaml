    file: hive/lib/config.py
    snippet: |
      DEFAULT_PROJECT_CONFIG_PATH = Path.cwd() / "hive.config.yaml"
      DEFAULT_BASELINE_CONFIG_PATH = Path(__file__).resolve().parents[1] / "hive.config.yaml"

      def read_config_file(file_path):
          if not file_path:
              return {}
          path = Path(file_path)
          if not path.exists():
              return {}
          return parse_config_text(path.read_text(encoding="utf-8"))

design_decisions:
  - decision: No TTY-probe fallback tier.
    rationale: Bash-tool subprocess stdio is not a reliable signal for "is a human present in this session" — grill finding H1 during planning. Only explicit env (HIVE_HEADLESS) and CI=true are decisive; everything else defaults safely to interactive.

