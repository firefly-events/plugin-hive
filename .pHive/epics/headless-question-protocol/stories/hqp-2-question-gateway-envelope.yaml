risks:
  - severity: medium
    description: The renewable-deadline logic (comparing timestamps, handling renewal races) is the trickiest correctness surface in this epic and everything downstream depends on it.
    mitigation: Dedicated fixture tests for renewal-before-expiry and expiry-without-renewal as explicit, separate acceptance criteria (not folded into a single generic test).

