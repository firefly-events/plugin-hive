design_decisions:
  - decision: Batch questions per skill-phase into one envelope, not one envelope per question.
    rationale: Grill finding U2 during planning — kickoff alone has 7+ prompt points; per-question envelopes would mean 7+ full skill re-invocations for a headless run, worse than the prose-scraping workaround this epic replaces.
  - decision: Renewable deadline instead of a poll loop.
    rationale: User feedback during planning explicitly rejected a poll-mode design (skill process sitting in a loop) in favor of an OAuth-refresh-style renewable expiry, matching how this repo already tolerates long-running Multica story/persona timeouts (1800s precedent).

cross_cutting:
  - concern: documentation
    action: "question-envelope-schema.md IS the primary documentation deliverable for this story — no separate doc update needed beyond it and this story's own YAML."
  - concern: versioning
    action: "New public config keys (headless.answer_deadline_seconds, headless.deadline_expired_action) in the shipped hive/hive.config.yaml baseline are consumer-visible — covered by the epic-level minor version bump (see epic.yaml), not per-story."

