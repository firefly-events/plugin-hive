id: hqp-2-question-gateway-envelope
epic: headless-question-protocol
title: Question-gateway primitive + question-envelope schema
status: pending
complexity: medium
methodology: classic
depends_on: [hqp-1-runtime-mode-detection]

description: |
  Build the shared "ask or emit" gateway that skills call instead of directly using
  AskUserQuestion or blocking prose. This is the single primitive every skill
  integration story (hqp-3 kickoff, hqp-4 design, hqp-5 plan) routes through — the
  whole point is one envelope shape and one detection path, not three divergent ones
  (research brief confirmed the current interactive-only gap spans 15+ call sites
  across three skills with zero shared handling).

  Interactive path (detect_interactive_mode() from hqp-1 resolves to "interactive"):
  behaves exactly as today at the call site — calls AskUserQuestion where the call
  site already does, or emits the existing prose where it doesn't. This story does
  NOT change call-site behavior; hqp-3/4/5 wire the actual call sites.

  Headless path: batches every question passed in one call into a single envelope
  file at `.pHive/questions/<skill>-<invocation-id>.yaml`, scoped to the calling
  skill's current *phase* (not one envelope per individual question — see the
  batching rationale in design-discussion.md §2.1b; per-question envelopes would mean
  a headless kickoff needs 7+ full skill re-invocations instead of ~4-5). Prints a
  structured `AWAITING_ANSWERS` status block to stdout and exits cleanly — no polling,
  no process left waiting.

  Envelope carries a renewable `deadline` field (OAuth-refresh shape, not a poll
  loop — this was corrected during planning after an earlier poll-mode draft was
  rejected). An orchestrator that needs more time than
  `headless.answer_deadline_seconds` (default 1800, matching this repo's existing
  Multica timeout precedents) writes a fresh, later `deadline` before the current one
  lapses; `renewal_count` increments each time. On re-invocation, the skill consumes
  an `answered` envelope, re-exits unchanged on a still-valid `pending` envelope, and
  on an expired unrenewed envelope follows `headless.deadline_expired_action`
  (`re-emit` default, non-destructive; `fail` for orchestrators that want expiry
  treated as unrecoverable).

acceptance_criteria:
  - "Given interactive mode, when ask_or_emit() is called with a question spec, then it invokes the call site's existing AskUserQuestion/prose path unchanged and does not write an envelope file"
  - "Given headless mode and a batch of N questions for one phase, when ask_or_emit() is called, then exactly one envelope file is written at .pHive/questions/<skill>-<invocation-id>.yaml containing all N questions, with status: pending and a deadline computed from headless.answer_deadline_seconds"
  - "Given a pending envelope with an orchestrator write of answer: values and status: answered, when the skill re-invokes ask_or_emit() for the same phase, then it returns the answers without re-prompting and without creating a new envelope"
  - "Given a pending envelope whose deadline has not lapsed, when the skill re-invokes ask_or_emit() for the same phase, then it re-exits with the same AWAITING_ANSWERS status and does not mutate the envelope"
  - "Given a pending envelope whose deadline lapses with no renewal and no answer, when the skill re-invokes ask_or_emit() for the same phase, then it follows headless.deadline_expired_action (default re-emit: writes a fresh envelope with a new deadline; fail: raises a machine-readable error)"
  - "Given a pending envelope, when an external writer updates deadline to a later timestamp and increments renewal_count before the prior deadline lapses, then the envelope remains valid pending (no expiry action fires) on the next re-invocation"
  - "hive/references/question-envelope-schema.md documents the schema per this repo's established schema-doc convention (Purpose/Data-shape/Cardinality/Storage-rule table, mutation-rules with an explicit pending->answered/pending->pending(renewed) transition table, closure invariant, worked examples, closing 'does NOT commit to' fence)"

steps:
  - id: research
    description: Re-confirm hqp-1's detect_interactive_mode() contract is landed and stable. Read hive/references/triage-queue-schema.md and .pHive/metrics/experiment-envelope.schema.md as the two closest schema-doc precedents to follow for structure and tone.
    agent: researcher
  - id: implement
    description: |
      Add hive/lib/question_gateway.py and hive/lib/question_gateway.js exporting
      ask_or_emit(question_spec_list) -> answers_list, implementing the interactive
      passthrough, headless envelope-write, resume-consume, and deadline
      renewal/expiry logic described above. Add the headless.* config block
      (answer_deadline_seconds default 1800, deadline_expired_action default
      re-emit) to hive/hive.config.yaml (shipped baseline) with root-first
      precedence, matching the pattern used elsewhere in this file for
      planning.mode/sidecar_retention. Write hive/references/question-envelope-schema.md.
    agent: developer
    depends_on: [research]
  - id: test
    description: |
      Fixture-driven tests: (1) write envelope, external answer-write, resume
      consumes without re-prompt; (2) deadline renewal keeps envelope valid past
      the original deadline; (3) expiry with no renewal triggers
      deadline_expired_action for both re-emit and fail settings; (4) interactive
      mode never writes an envelope file.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review the schema doc against triage-queue-schema.md's structural convention (does it have every required section?). Review the gateway module for exact mirroring of the interactive-path passthrough (no behavior change on that path).
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feat/headless-question-protocol.
    agent: developer
    depends_on: [review]

