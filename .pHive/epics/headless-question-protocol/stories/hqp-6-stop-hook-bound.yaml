risks:
  - severity: medium
    description: The streaming rewrite could subtly change what gets counted if the jq filter isn't preserved exactly (e.g. edge cases in the assistant/usage selector).
    mitigation: Mandatory byte-for-byte regression test against the current implementation's output on a shared fixture, before cutover — not a "looks equivalent" review.

