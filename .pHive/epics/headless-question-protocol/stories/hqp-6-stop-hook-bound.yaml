id: hqp-6-stop-hook-bound
epic: headless-question-protocol
title: Bound the global Stop hook (streaming rewrite + size guard)
status: pending
complexity: medium
methodology: classic
depends_on: []
parallel_allowed: true
parallel_rationale: bounded-slice

description: |
  `.claude-plugin/plugin.json:36-51` registers metrics-stop-dispatch.sh on `matcher: ""`
  — every session Stop, unconditionally. Its hot path
  (hooks/metrics-stop-dispatch.sh:111-130, `_extract_tokens`) uses `jq -c -s` (slurp)
  to load the ENTIRE JSONL transcript into memory before aggregating token counts —
  O(n) time and memory in transcript size, with zero size guard, zero line cap, zero
  streaming. The only existing cost bound is the harness-level `timeout: 15` wrapper
  in plugin.json, whose enforcement reliability is unverified from inside this repo.
  On large transcripts this is a real per-session tax that can make `claude --bg`
  sessions (exactly the kind a headless orchestrator drives) slow to close.

  Two independent, defense-in-depth fixes:

  1. Replace the `jq -c -s` slurp with a true streaming pass (`jq -c` without `-s`,
     or an incremental awk/sum pass) that never holds the full transcript in memory.
     The transcript is already one JSON object per line — slurp mode was never
     required for this aggregation.
  2. Add an in-script size guard before any parse is attempted: a new
     `metrics.stop_dispatch_max_transcript_bytes` config key (root `hive.config.yaml`
     -> shipped `hive/hive.config.yaml` baseline -> hardcoded default — root-first
     precedence, no env tier, matching every other knob added in this epic). If the
     transcript exceeds it, skip the parse, log one line to the existing
     metrics-events stream noting the skip (not silent), and exit 0.

  This design deliberately does NOT try to detect "is this a `claude --bg` session"
  and skip the hook only for those — no such signal exists anywhere in this repo
  today (confirmed by research), and bounding cost for every session is a strict
  superset of protecting background ones specifically (confirmed acceptable with the
  user during planning — open question 4).

  The default byte threshold must be derived from a benchmark, not guessed — build a
  synthetic large-transcript fixture, time the streaming rewrite against it, and pick
  a threshold with measured margin under the 15s harness timeout.

acceptance_criteria:
  - "Given a normal-size fixture transcript, when the rewritten _extract_tokens runs, then its output (input_tokens, output_tokens, cache_creation_input_tokens, cache_read_input_tokens, model, TOTAL_TOKENS) is byte-for-byte identical to the current jq -c -s implementation's output on the same fixture"
  - "Given a synthetic transcript larger than metrics.stop_dispatch_max_transcript_bytes, when the hook runs, then it skips the parse, appends one log line to the metrics-events stream noting the skip (session id + byte size), and exits 0 without attempting jq at all"
  - "Given the synthetic large-transcript benchmark fixture, when the streaming rewrite parses a transcript just under the configured threshold, then it completes with measured wall-clock time under the 15s plugin.json timeout with a documented margin (not asserted, benchmarked and recorded in the story's episode notes)"
  - "Given metrics.enabled: false, when the hook runs, then it exits 0 immediately exactly as it does today (existing short-circuit at hooks/metrics-stop-dispatch.sh:65-74 is unchanged)"
  - "The existing || true + trap 'exit 0' ERR safety net (hooks/metrics-stop-dispatch.sh:25, .claude-plugin/plugin.json:49) is unchanged — this story extends the cheap-normal-path guarantee, it does not remove the failure-path guarantee"

steps:
  - id: research
    description: Re-read hooks/metrics-stop-dispatch.sh:111-130 and hooks/common.sh's _resolve_state_dir against current HEAD. Confirm the exact jq filter (select(.type == "assistant" and .message.usage != null)) to preserve semantics for.
    agent: researcher
  - id: implement
    description: Rewrite _extract_tokens to stream instead of slurp; add the size guard ahead of it; add metrics.stop_dispatch_max_transcript_bytes to hive.config.yaml (root override) and hive/hive.config.yaml (shipped baseline) with root-first precedence.
    agent: developer
    depends_on: [research]
  - id: test
    description: Build a normal-size fixture transcript and a synthetic large one (for both the byte-for-byte regression and the timing benchmark). Run the byte-for-byte regression, the size-guard-skip test, and the benchmark; record the measured timing margin.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm the streaming rewrite's jq filter is semantically identical to the original (not just "looks similar"), and that the benchmark's measured margin under 15s is real, not asserted.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feat/headless-question-protocol.
    agent: developer
    depends_on: [review]

