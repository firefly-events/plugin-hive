design_decisions:
  - decision: No background-session-specific detection; bound cost universally instead.
    rationale: No reliable "is this a claude --bg session" signal exists anywhere in this repo (grill finding U1); a universal bound is a strict superset of the literal request and was explicitly confirmed acceptable during planning.
  - decision: Benchmark-derived default threshold, not an asserted number.
    rationale: Grill finding H2 — an earlier draft asserted "10MB stays well under 15s" with no measurement; this story requires an actual timed benchmark before picking the shipped default.

cross_cutting:
  - concern: documentation
    action: "Add a short note to hooks/metrics-stop-dispatch.sh's header comment (currently describes the slurp mechanism at lines 10-11 as the 'C2.0 chosen mechanism') updating it to describe the streaming approach + size guard as the current mechanism."
  - concern: versioning
    action: "New public config key (metrics.stop_dispatch_max_transcript_bytes) in the shipped baseline is consumer-visible — covered by the epic-level minor version bump."

