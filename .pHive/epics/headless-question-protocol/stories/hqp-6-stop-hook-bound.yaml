  - file: hive.config.yaml
    change: No change required unless overriding the shipped default — this is the maintainer override layer, left as-is unless the benchmark suggests plugin-hive itself needs a custom threshold.
  - file: hive/hive.config.yaml
    change: Add metrics.stop_dispatch_max_transcript_bytes with the benchmark-derived default.

