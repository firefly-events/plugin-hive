id: hqp-3-kickoff-headless-integration
epic: headless-question-protocol
title: Route kickoff's prose prompts through the question gateway
status: pending
complexity: medium
methodology: classic
depends_on: [hqp-2-question-gateway-envelope]

description: |
  Kickoff is the largest and most load-bearing prompt surface in this plugin: 7+
  distinct "Ask the user:" prose prompts across roughly 4 phases (research brief:
  skills/kickoff/SKILL.md:13,22,24,26,36,41,46; hive/references/kickoff-protocol.md:45,
  58,99,145,182,320-363,756-786,906). Route every one of them through
  hive/lib/question_gateway.py's ask_or_emit() (hqp-2), batched per phase per the
  mapping in horizontal-plan.md:

  - Phase 1a (metrics opt-in, project-type, has-ui) -> one envelope
  - Phase 1b (ship-target) -> one envelope
  - Phase 2b-iii elicitation (5 questions) -> one envelope
  - Phase 3b discovery (north-star, optional) -> one envelope

  Interactive kickoff must be byte-identical to current behavior — this story only
  adds the headless branch, it does not touch the prose text or question content
  itself. Do NOT change the actual questions being asked, their order, or their
  options — only how they're delivered when headless.

acceptance_criteria:
  - "Given HIVE_HEADLESS unset and no CI, when /hive:kickoff runs against a fresh project, then every prompt point behaves exactly as before this story (prose/AskUserQuestion unchanged, no envelope files written)"
  - "Given HIVE_HEADLESS=1, when /hive:kickoff runs against a fresh project, then it writes a Phase-1a envelope, exits with AWAITING_ANSWERS, and writes nothing to project-profile.yaml yet"
  - "Given a Phase-1a envelope answered externally, when /hive:kickoff is re-invoked with HIVE_HEADLESS=1, then it consumes the Phase-1a answers, proceeds to Phase 1b, and writes a new Phase-1b envelope"
  - "Given all four phase envelopes answered in sequence across repeated re-invocations, when /hive:kickoff completes, then project-profile.yaml is populated identically to what an interactive run with the same answers would produce"
  - "Re-kickoff (preservation-branch) prompts at kickoff-protocol.md:26,41,46,99,182 also route through the gateway, not just fresh-kickoff prompts"

steps:
  - id: research
    description: Re-read every kickoff prompt site (skills/kickoff/SKILL.md and hive/references/kickoff-protocol.md, line numbers in the description) against current HEAD to confirm no drift since planning, and confirm the phase boundaries for envelope batching.
    agent: researcher
  - id: implement
    description: Wire each identified prompt site to call question_gateway.ask_or_emit() with the phase id from the mapping above, replacing direct AskUserQuestion/prose emission with a gateway call that internally does the right thing per detect_interactive_mode().
    agent: developer
    depends_on: [research]
  - id: test
    description: End-to-end headless run against a scratch project directory driving all 4 phase envelopes to completion via fixture answers; separately, an interactive-mode regression run confirming unchanged prompts/behavior.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm no prompt text, options, or ordering changed — only delivery mechanism. Confirm project-profile.yaml output is identical between interactive and headless runs given the same answers.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feat/headless-question-protocol.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/dostal/Documents/work/dostal/code/plugin-hive-fork
  tech_stack: {}
  key_files:
    - path: skills/kickoff/SKILL.md
      purpose: Primary skill file with 6 direct "Ask:" prompt points.
    - path: hive/references/kickoff-protocol.md
      purpose: Detailed protocol doc with the remaining prompt points and phase structure (1a, 1b, 2b-iii, 3b) that defines the envelope-batching boundaries.
    - path: hive/lib/question_gateway.py
      purpose: The gateway primitive from hqp-2 that every prompt site now calls instead of prompting directly.

files_to_modify:
  - file: skills/kickoff/SKILL.md
    change: Route lines 13,22,24,26,36,41,46 through question_gateway.ask_or_emit().
  - file: hive/references/kickoff-protocol.md
    change: Route lines 45,58,99,145,182,320-363,756-786,906 through the gateway, batched per the 4-phase mapping.

design_decisions:
  - decision: Batch kickoff's prompts into exactly 4 phase envelopes (1a, 1b, 2b-iii, 3b), not 7 individual ones.
    rationale: Matches hqp-2's phase-batching contract; keeps a fully headless kickoff run to ~4 round trips instead of 7+.

cross_cutting:
  - concern: documentation
    action: "kickoff-protocol.md itself is the documentation of kickoff's behavior — this story's changes to that file ARE the doc update. No separate doc needed."
  - concern: versioning
    action: "Consumer-visible new behavior (headless kickoff) — covered by the epic-level minor version bump."

metric:
  applies: true
  name: kickoff.headless_completion_rate
  direction: up
  unit: ratio
  baseline: 0
  target: 1.0
  window: "story integrate step"
  source:
    kind: manual
    ref: "End-to-end headless fixture run described in the test step — target is a full kickoff completing via envelopes with output identical to an equivalent interactive run"
  verify_at: "story integrate step"
  owner: tester

risks:
  - severity: high
    description: Kickoff is the most load-bearing skill in this plugin; a regression to interactive-mode behavior here is the highest-visibility failure mode in the whole epic.
    mitigation: Interactive-mode regression test is a mandatory, separate acceptance criterion, not folded into the headless test.

references:
  - path: .pHive/epics/headless-question-protocol/docs/research-brief.md
    relevant_excerpt: |
      hive/references/kickoff-protocol.md:320-363 — Phase 2b-iii "Step 2: Present
      Elicitation (5 Questions)" — conversational-block prompt with numbered options,
      "wait for input" for methodology/PR-style/etc.
