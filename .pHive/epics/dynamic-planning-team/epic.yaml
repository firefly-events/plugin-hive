name: dynamic-planning-team
title: Dynamic Planning-Team Composition
description: |
  Generalize /plan's fixed-spine + two-hardcoded-conditional (architect, ui-designer)
  planning team into an N-way, classification-driven, project-gated, provenance-recorded
  composition. At plan step 1 the orchestrator classifies the requirement into work-type
  tags and resolves the planning team from a tracked work-type→specialist map. Extends the
  existing specialist-triggers.md catalog (composition section, distinct from escalation),
  adds an atomic planning-classification skill, an explicit project_type gate in
  project-profile.yaml, and a planning_team provenance block in epic.yaml.
target_codebase: /Users/don/Documents/plugin-hive
methodology: classic

git_flow:
  base_branch: develop
  branch_strategy: per-epic

stories:
  - id: dpt-1-composition-catalog
    title: Add planning_composition section to specialist-triggers.md
    complexity: low
    depends_on: []
  - id: dpt-2-project-type-gate
    title: Add project_type gate field to project-profile.yaml + schema
    complexity: low
    depends_on: []
  - id: dpt-3-classification-skill
    title: New atomic skill planning-classification
    complexity: medium
    depends_on: [dpt-1-composition-catalog, dpt-2-project-type-gate]
  - id: dpt-4-wire-plan-and-provenance
    title: Wire classification into /plan + emit planning_team provenance
    complexity: medium
    depends_on: [dpt-3-classification-skill]
  - id: dpt-5-tests
    title: Tests — map schema, fallback, project-gate, roster-only invariant
    complexity: medium
    depends_on: [dpt-3-classification-skill, dpt-4-wire-plan-and-provenance]
