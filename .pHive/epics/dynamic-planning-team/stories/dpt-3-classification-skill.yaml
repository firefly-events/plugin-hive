design_decisions:
  - decision: Classification is a skill, not inline /plan prose.
    rationale: Matches atomic-call pattern; testable in isolation; reusable by future entrypoints (triage, standup).
  - decision: No root dependency added.
    rationale: memory feedback_byo_enhancements_no_root_deps — use vendored python3/node yaml reads.

risks:
  - severity: medium
    description: Classifier mis-tags requirement → wrong specialists.
    mitigation: Spine self-sufficient; provenance (dpt-4) makes the call operator-visible + overridable at confirmation gate.
