depends_on: [dpt-1-composition-catalog, dpt-2-project-type-gate]

description: |
  Create a new atomic skill skills/hive/skills/planning-classification/SKILL.md that the
  orchestrator invokes at /plan step 1. It classifies the requirement into work-type tags,
  reads the planning_composition map (dpt-1), applies the project gate (dpt-2), and returns
  the resolved planning roster + classification reasoning.

  This is an atomic external skill in the same style as grill / design / planning-routing —
  /plan calls it and consumes its output; the classification logic does NOT live inline in
  /plan.

  Contract:
    Input:  requirement_summary, project-profile path (for has_ui / project_type gate).
    Process:
      1. Analyze requirement → emit 1+ work-type tags (architecture, ui, security,
         performance, accessibility, data, infra, ...). Tags come from the catalog
         vocabulary only.
      2. Read planning_composition.spine + work_types from specialist-triggers.md.
      3. resolved_roster = spine ∪ (specialists for each matched tag, after project gate).
         project_gate: requires_ui rows resolve EMPTY when project has_ui=false.
      4. Dedupe personas (union, stable order: spine first, then specialists by tag order).
    Invariants (HARD):
      - Roster-only: every chosen specialist must resolve to an existing hive/agents/*.md.
        NEVER invent a persona. (Failure mode: improvised persona self-implements +
        bypasses backend routing — see memory feedback_no_team_lead_intermediary.)
      - Spine self-sufficient: low-confidence / no tag matched → spine-only roster.
        Never block planning on a bad/empty classification. Specialists only augment.
      - Absent has_ui: treat as unknown → conservative default (ungated tags apply;
        requires_ui slots stay empty unless tech_stack heuristic clearly indicates UI).
    Output:
      - assembled_personas: [persona, ...]   (handed to planning-routing unchanged)
      - classification: { tags: [...], per_tag_reasoning: {...}, confidence: <matched|low>,
        gate_decisions: {...} }   (handed to the provenance writer in dpt-4)

  No new package.json dependency — prefer prose-skill + existing CLI tooling (yaml read via
  python3/node already vendored). Per memory feedback_byo_enhancements_no_root_deps.

acceptance_criteria:
  - "Given a requirement mentioning auth/secrets, when classified, then tags include `security` and the roster includes security-reviewer (project ungated)."
  - "Given a UI requirement on a has_ui=false project (plugin-hive), when classified, then the `ui` tag's ui-designer slot resolves EMPTY and the roster is spine-only (plus any other ungated matched specialists)."
  - "Given a requirement with no recognizable work-type, when classified, then confidence=low and assembled_personas == spine exactly."
  - "Given a multi-tag requirement (e.g. perf + security), when classified, then the roster is the deduped union of spine + both specialists."
  - "Given any resolved roster, when validated, then every persona resolves to an existing hive/agents/*.md (roster-only invariant holds)."
  - "Given the skill output, when inspected, then it returns both assembled_personas and a classification object with tags + reasoning + confidence + gate_decisions."

steps:
  - id: research
    description: Read planning-routing Step 0.1 (input contract for assembled_personas), grill/design SKILL.md for the atomic-skill authoring pattern, and the dpt-1/dpt-2 outputs.
    agent: researcher
  - id: implement
    description: Author skills/hive/skills/planning-classification/SKILL.md implementing the contract + invariants above.
    agent: developer
    depends_on: [research]
  - id: test
    description: Covered by dpt-5 (shared test story). Here, hand-verify the four core scenarios (security, ui-gated, no-match fallback, multi-tag union) against the catalog.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm roster-only + spine-fallback invariants are unambiguous and the output contract matches what planning-routing/dpt-4 consume.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit to feat/dynamic-planning-team.
    agent: developer
    depends_on: [review]

