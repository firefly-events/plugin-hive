id: dpt-1-composition-catalog
epic: dynamic-planning-team
title: Add planning_composition section to specialist-triggers.md
status: in_review
tracker_adapter: multica
tracker_id: PLU-149
tracker_uuid: 9d8afd70-5ac4-4007-b989-d5f4e7cc1504
complexity: low
methodology: classic
depends_on: []
parallel_allowed: true
parallel_rationale: bounded-slice

description: |
  Add a new top-level `planning_composition:` section to
  hive/references/specialist-triggers.md that maps work-type tag → planning specialist
  persona(s). This is the tracked config table that the planning-classification skill
  (dpt-3) reads to resolve the planning team at /plan step 1.

  Keep it as a clearly-labelled section DISTINCT from the existing escalation `Catalog`
  list. Do NOT reuse the escalation `placement` field for composition — composition and
  escalation are different lifecycles (compose-at-intake vs raise-at-review-gate). Add a
  short cross-reference note linking the two sections so future readers understand the
  split.

  The existing two hardcoded conditionals in planning-routing (architect, ui-designer)
  become the `architecture` and `ui` rows here — this is generalization, not replacement.

acceptance_criteria:
  - "Given specialist-triggers.md, when read, then a top-level `planning_composition:` block exists with `schema_version`, `spine: [researcher, technical-writer, tpm]`, and a `work_types:` list."
  - "Given the work_types list, when inspected, then it includes at minimum: architecture→[architect], ui→[ui-designer], security→[security-reviewer], performance→[performance-reviewer], accessibility→[accessibility-specialist], data→[architect]."
  - "Given any specialists entry, when validated, then every persona name resolves to an existing file under hive/agents/*.md."
  - "Given the ui and accessibility rows, when inspected, then they carry `project_gate: requires_ui`; ungated rows carry `project_gate: ~` (null)."
  - "Given the existing escalation Catalog list, when diffed, then it is unchanged (no entries added/removed/edited)."
  - "Given the file, when read, then a cross-reference note explains composition (this section) vs escalation (Catalog) lifecycles."

steps:
  - id: research
    description: Read hive/references/specialist-triggers.md fully; confirm the escalation Catalog structure and the roster persona filenames in hive/agents/.
    agent: researcher
  - id: implement
    description: Add the planning_composition section + cross-reference note per the design discussion D1. Verify every persona resolves to hive/agents/*.md.
    agent: developer
    depends_on: [research]
  - id: test
    description: Validate YAML parses, schema_version present, spine matches, every specialist persona file exists, escalation Catalog byte-unchanged.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm composition vs escalation separation is clean and no escalation semantics were overloaded.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit to feat/dynamic-planning-team.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: hive/references/specialist-triggers.md
      purpose: The catalog being extended; new planning_composition section lands here.
    - path: hive/agents/
      purpose: Roster — every specialist persona referenced must resolve to a file here.

files_to_modify:
  - file: hive/references/specialist-triggers.md
    change: Add top-level planning_composition section + cross-reference note; leave escalation Catalog untouched.

code_examples:
  - title: planning_composition section shape (from design discussion D1)
    file: .pHive/epics/dynamic-planning-team/docs/design-discussion.md
    snippet: |
      planning_composition:
        schema_version: "1.0.0"
        spine: [researcher, technical-writer, tpm]
        work_types:
          - tag: architecture
            specialists: [architect]
            project_gate: ~
          - tag: ui
            specialists: [ui-designer]
            project_gate: requires_ui

references:
  - path: hive/references/specialist-triggers.md
    relevant_excerpt: |
      Forward-compatibility constraint: execute branches ONLY on `placement` and
      `responds_with.type` — never on specific trigger IDs. (Composition must not
      disturb this: the new section is separate and does not add placement values.)

risks:
  - severity: low
    description: Overloading escalation semantics by reusing placement for composition.
    mitigation: Separate top-level section; no placement field on composition entries.
