id: dpt-5-tests
epic: dynamic-planning-team
title: Tests — map schema, fallback, project-gate, roster-only invariant
status: shipped
shipped_at: "2026-06-20T19:03:12Z"
release_id: "v2.12.0"
tracker_adapter: multica
tracker_id: PLU-153
tracker_uuid: 741fed99-4d79-43cc-bf81-8325c002cea5
complexity: medium
methodology: classic
depends_on: [dpt-3-classification-skill, dpt-4-wire-plan-and-provenance]

description: |
  Add automated tests covering the classification + composition behavior. plugin-hive's
  test_runner is bun (per project-profile); place tests with the existing suite convention
  (confirm in research). Where logic is prose-skill rather than executable, assert against
  the catalog/profile data files and a small harness that exercises the resolution rules.

  Coverage targets (the four invariants + schema):
    1. Map schema — planning_composition parses; schema_version present; spine == the three
       expected personas; every specialist persona resolves to hive/agents/*.md.
    2. Low-confidence fallback — a no-match requirement resolves to spine-only.
    3. Project gate — has_ui=false suppresses requires_ui specialists (ui-designer,
       accessibility-specialist); has_ui=true admits them.
    4. Roster-only invariant — resolution never emits a persona absent from hive/agents/.
    5. Multi-tag union + dedupe — overlapping tags (e.g. data+architecture both → architect)
       yield architect once, stable order.
    6. Provenance — a planning_team block conforming to story-yaml-schema §6 validates.

acceptance_criteria:
  - "Given the test suite, when run, then all six coverage targets above have at least one passing assertion."
  - "Given planning_composition in specialist-triggers.md, when the schema test runs, then it fails loudly if any specialist persona file is missing."
  - "Given a no-match requirement fixture, when resolved, then the test asserts assembled_personas == spine exactly."
  - "Given has_ui=false, when the gate test runs, then ui-designer and accessibility-specialist are asserted absent from the roster."
  - "Given a roster resolution, when the invariant test runs, then it asserts every persona exists under hive/agents/."
  - "Given the suite, when run via the project test_runner, then it integrates with the existing test convention (no new root dependency)."

steps:
  - id: research
    description: Locate the existing test suite + convention (bun); confirm how prose-skill behavior is currently tested in the repo (fixtures, data-file assertions, harness).
    agent: researcher
  - id: implement
    description: Write tests for the six coverage targets. Use catalog/profile data + a thin resolution harness mirroring the dpt-3 rules. No root dependency added.
    agent: developer
    depends_on: [research]
  - id: test
    description: Run the suite; confirm all targets pass and the schema test fails correctly when a persona is removed (negative check).
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm tests assert the invariants (not just happy path) and the negative/missing-persona case is covered.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit to feat/dynamic-planning-team.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: hive/references/specialist-triggers.md
      purpose: Data under test — planning_composition map.
    - path: skills/hive/skills/planning-classification/SKILL.md
      purpose: Behavior under test — resolution rules + invariants.
    - path: .pHive/project-profile.yaml
      purpose: Gate input under test — has_ui / project_type.

files_to_modify:
  - file: tests/
    change: Add planning-classification tests (exact path/convention confirmed in research).

design_decisions:
  - decision: Tests assert against catalog/profile data + a thin harness.
    rationale: Classification is prose-skill; data-file + rule-harness assertions are the testable surface without re-implementing the orchestrator.

risks:
  - severity: low
    description: Prose-skill logic is not directly executable, so the harness may drift from the skill text.
    mitigation: Keep the harness rules a literal mirror of dpt-3's contract; review step cross-checks harness vs skill.
