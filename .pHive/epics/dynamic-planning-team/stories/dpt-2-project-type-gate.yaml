    description: Locate the project-profile schema/doc surface (kickoff skill + any references) and the current .pHive/project-profile.yaml.
    agent: researcher
  - id: implement
    description: Add project_type + has_ui to plugin-hive's profile and to the schema/kickoff docs; document the absent-field contract.
    agent: developer
    depends_on: [research]
  - id: test
    description: Validate profile YAML parses; fields present + correct types; plugin-hive values are framework/false; docs mention absent-field contract.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm field naming + enum values align with design discussion D3 and won't collide with existing profile keys.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit to feat/dynamic-planning-team.
    agent: developer
    depends_on: [review]

