description: |
  Create hive/references/squad-leader-terminal-contract.md — the canonical
  definition of how a Multica squad-leader run must terminate. This is the
  source of truth that sls-2 applies to the live squad.instructions and that
  sls-3's sweep enforces as a backstop.

  Contract content (from design-discussion §2):
  1. Children-terminal check: all delegated child issues must be terminal
     before the leader closes out. "Terminal for delegation" = done, cancelled,
     or in_review-with-output-consumed (members routinely stop at in_review;
     the leader consuming their artifact counts as terminal).
  2. Final summary comment: leader posts child id + member + status (+ per-task
     outcome) on its own parent issue. Existing convention, now binding.
  3. Self status flip: leader runs
     `multica issue update <own-issue-uuid> --status done` as its LAST action.
     The leader's own issue UUID is always available in its task context.
  4. Blocked path: if children are stuck, post a BLOCKED comment and leave
     status in_progress (stale-by-intent; the sweep surfaces it).

  Also record Fork C (upstream Multica auto-complete: parent auto-completes
  when squad-assigned and all children terminal) as a Deferred Upstream Ask
  section so the upstream issue is ready to file.

  Scope guard: do NOT amend skills/hive/skills/plan-mode-multica/SKILL.md —
  that skill's per-persona carrier decision is out of scope (design §5).

acceptance_criteria:
  - "Given hive/references/squad-leader-terminal-contract.md exists, when read, then it defines all four protocol steps (children-terminal, summary comment, self flip, blocked path) with the exact CLI command for step 3"
  - "Given the doc, when grepped for 'in_review', then the terminal-for-delegation semantics are explicitly defined"
  - "Given the doc, when read, then a Deferred Upstream Ask section records the Fork C semantics"
  - "Given skills/hive/skills/plan-mode-multica/SKILL.md, when diffed, then it is unchanged by this story"

