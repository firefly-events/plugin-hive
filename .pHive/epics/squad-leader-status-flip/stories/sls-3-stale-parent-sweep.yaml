  - concern: versioning
    action: "New operator-facing script — counted in epic-level version_bump decision"

metric:
  applies: true
  name: sweep_stale_detection_accuracy
  direction: up
  unit: ratio
  baseline: 0
  target: 1.0
  window: story-integrate
  source:
    kind: manual
    ref: "Live report-mode pass at integrate: every reported STALE verified by hand against issue threads; zero false positives required"
  verify_at: integrate
  owner: reviewer

design_decisions:
  - decision: CLI subprocess, not HTTP client against Multica server
    rationale: stdlib-first charter; CLI already handles auth/profile/workspace resolution
  - decision: report-first, --apply opt-in
    rationale: status mutation is outward-facing; mirrors the manual-confirm pattern used in the 2026-06-09 cleanup

risks:
  - severity: medium
    description: CLI lacks a children-by-parent query; comment-mention fallback is brittle
    mitigation: Probe `multica issue list --parent <uuid>` / JSON parent_issue_id field first; if absent, constrain fallback to leader 'Delegated' comment mention parsing and flag LOW-CONFIDENCE in report
  - severity: low
    description: Issue volume growth makes full-list sweep slow
    mitigation: --status in_progress already bounds the set; fine at current scale

references:
