id: sls-3-stale-parent-sweep
epic: squad-leader-status-flip
title: Build the stale-parent sweep script (Fork B lite)
status: complete
tracker_id: plugin-hive/PLU-315
tracker_url: http://localhost:3000/plugin-hive/issues/315
complexity: medium
methodology: tdd
depends_on: [sls-1-terminal-contract-doc]

description: |
  Create scripts/multica-sweep-stale-parents.py (Python 3, stdlib-first per
  charter — use subprocess against the multica CLI with --output json; no new
  pip deps). The sweep is the backstop for leaders that fail the terminal
  contract (sls-1), and the measurement instrument for the epic metric.

  Behavior:
  - Enumerate `multica issue list --status in_progress --output json`.
  - For each parent issue assigned to a squad OR agent: fetch child issues
    (issues whose parent_issue_id == parent uuid; fall back to parsing the
    leader's "Delegated" comment mentions if the API exposes no child query)
    and the comment thread.
  - Classify STALE when ALL of: (a) every child is terminal (done / cancelled /
    in_review), (b) parent updated_at older than --min-age (default 30m),
    (c) no BLOCKED comment present (blocked-by-intent parents are reported in a
    separate section, never auto-flipped).
  - Default mode: report table (key, title, age, child summary, verdict).
    --apply: flip STALE parents to done via `multica issue update`, appending
    a sweep-attribution comment first.
  - --json for machine-readable output.
  - Exit 0 always in report mode; non-zero only on CLI/auth failure.

  Tests (tdd): pure functions for classification take fixture JSON (no live
  CLI in tests). Cover: all-terminal+old → STALE; one child in_progress → not
  stale; fresh parent → not stale; BLOCKED comment → blocked section; agent
  -assigned parent with no children → not stale (PLU-312 case).

acceptance_criteria:
  - "Given fixture data modeling PLU-277/298/302/305/308 (children terminal, parent old), when classify runs, then all five are STALE"
  - "Given fixture data modeling PLU-312 (agent-assigned, live, no children), when classify runs, then it is NOT stale"
  - "Given a BLOCKED comment in the thread, when classify runs, then the parent lands in the blocked section and --apply does not touch it"
  - "Given report mode (no --apply), when run, then no issue status is mutated"
  - "Given --apply on a STALE parent, when run, then the issue is flipped to done and a sweep-attribution comment exists"
  - "Given `python3 -m pytest` (or the repo's test runner) on the new tests, then all pass with no live Multica calls"

steps:
  - id: test-spec
    description: Write failing classification tests from the acceptance criteria with fixtures modeling the five stale parents + PLU-312 + blocked case
    agent: tester
  - id: implement
    description: Implement the sweep script; make tests pass without modifying them
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Review for false-positive safety (quiet-age + all-terminal AND-gate), charter compliance (Python stdlib), CLI error handling
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit script + tests; run one live report-mode pass and capture output in the PR body
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/.claude/worktrees/substrate-coverage
  key_files:
    - path: hive/references/squad-leader-terminal-contract.md
      purpose: Defines terminal-for-delegation semantics the classifier implements (produced by sls-1)
    - path: hive/lib/multica-story-dispatch/index.mjs
      purpose: Existing Multica API surface (Node bridge) — do NOT extend it; sweep is Python via CLI per charter
  tech_stack:
