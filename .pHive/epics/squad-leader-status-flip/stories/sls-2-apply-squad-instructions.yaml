id: sls-2-apply-squad-instructions
epic: squad-leader-status-flip
title: Apply the terminal contract to planning-team-squad squad.instructions
status: blocked
tracker_id: plugin-hive/PLU-314
tracker_url: http://localhost:3000/plugin-hive/issues/314
complexity: low
methodology: tdd
depends_on: [sls-1-terminal-contract-doc]

description: |
  Append the terminal-contract section (from
  hive/references/squad-leader-terminal-contract.md, sls-1) to the live
  `planning-team-squad` squad.instructions in Multica workspace
  21c6d282-d6b4-4b25-8d0d-a85e96038416, via
  `multica squad update <squad-id> --instructions ...` (preserve existing
  instructions content — append, don't replace).

  Verification follows the PLU-293 spike pattern: create a throwaway probe
  issue assigned to the squad whose brief asks the leader to (a) echo a
  TERMINAL-ACK marker proving it read the contract section, and (b) execute the
  protocol — meaning the probe issue itself must end in status `done` with a
  final summary comment, flipped by the leader, not by the operator.

  Document the re-apply procedure (one CLI command + where the canonical text
  lives) inside the contract doc's "Applying to a squad" section so future
  squad reconfigs can restore the contract.

acceptance_criteria:
  - "Given `multica squad get planning-team-squad`, when instructions are read, then they contain the terminal-contract section matching the canonical doc"
  - "Given a probe issue assigned to planning-team-squad, when the leader run completes, then the probe issue status is `done` without operator intervention and the final comment includes the TERMINAL-ACK marker"
  - "Given the canonical doc, when read, then an 'Applying to a squad' section documents the exact re-apply CLI command"
  - "Given `multica issue list --status in_progress` after the probe run, then the probe issue does not appear"

steps:
  - id: test-spec
    description: Define the probe-issue brief + expected observables (TERMINAL-ACK marker, final status done, summary comment) BEFORE applying instructions — this is the failing test
    agent: tester
  - id: implement
    description: Append contract section to squad.instructions via multica squad update; run the probe
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Verify probe observables; confirm existing instructions content was preserved
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit the doc's Applying-to-a-squad section + probe transcript notes to the branch
    agent: developer
    depends_on: [review]

