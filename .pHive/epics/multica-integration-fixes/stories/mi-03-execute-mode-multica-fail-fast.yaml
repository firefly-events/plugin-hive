design_decisions:
  - decision: "Explicit clone before dispatch instead of detect-and-fall-back-to-caller-checkout"
    rationale: "Per grill H4 + design discussion §6 Q2: cleaner contract surface. The skill's documented behavior is 'Multica owns the workdir' — making it explicit catches Multica regressions early instead of silently working sometimes."
  - decision: "Pre-implementation verification step before writing the patch"
    rationale: "Per grill H4: --ref CLI is unverified at planning time. Cheap probe prevents shape mismatch costing a rewrite. Committed log makes the assumption auditable."
  - decision: "Manual smoke test instead of unit tests"
    rationale: "execute-mode-* skills are skill-md prose, not code. No unit test framework exists for them. Manual smoke is the existing convention for skill changes."

cross_cutting:
  - concern: documentation
    action: "Skill itself is documentation; this patch updates it. Add explicit reconciliation pattern section. New `.pHive/upstream-watch/multica-repo-checkout-behavior.md` verification log."
  - concern: versioning
    action: "If shipped consumer-facing, qualifies as minor bump. Decision deferred to epic-close (no h-05-equivalent in this 4-story plan; the patch + spike briefs land together as one PR — see Done definition in design discussion)."

risks:
  - severity: high
    description: "`multica repo checkout --ref` might not behave the way the help text implies (require pre-fetched ref, leave workdir in inconsistent state, etc.)"
    mitigation: Pre-implementation verification step is exactly this check; commit message documents actual behavior; patch is written to match what was observed
  - severity: medium
    description: Patch regresses the h-01-style auto-clone success path
    mitigation: Acceptance criterion explicitly requires preservation; manual smoke verifies both paths
  - severity: low
    description: Reconciliation pattern doc could over-prescribe; orchestrator might want flexibility
    mitigation: Doc names the canonical pattern + lists when each alternative (cherry-pick vs fetch+rebase) is appropriate, not a hard rule

references:
  - path: .pHive/epics/multica-integration-fixes/docs/research-brief.md
    relevant_excerpt: |
      execute-mode-multica skill never calls `multica repo checkout --ref`.
      Three of four h-* runs had no clone in workdir; agent improvised by
      writing to caller checkout or h-01's leftover workdir. Patch scope:
      (a) extend skill to call --ref explicitly, (b) verify clone exists +
      fail loudly if not, (c) document canonical reconciliation pattern.

