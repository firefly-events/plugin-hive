design_decisions:
  - decision: "Workaround appendix included but marked 'not recommended for this epic'"
    rationale: "Per grill P1: composable-substrate posture says fail-fast + clear error, not workarounds. Listing options helps future planning; recommending them violates posture. Explicit framing keeps the door open without taking the wrong step."
  - decision: "Slightly larger budget (100 lines) than mi-01 (80 lines)"
    rationale: "Session lifecycle is multi-step (init → keepalive → retry → teardown). The brief needs to name each step to be actionable for an upstream maintainer. Still tight enough to fit on one screen at standard zoom."

cross_cutting:
  - concern: documentation
    action: "Brief IS the deliverable. Same .pHive/upstream-watch/ tracked subtree as mi-01."

risks:
  - severity: medium
    description: Root cause may be in Anthropic SDK (claude-code or anthropic npm package) not Multica itself
    mitigation: Brief documents which side owns the fix (Multica vs Anthropic SDK); if Anthropic-side, recommend Multica file the upstream issue + workaround locally
  - severity: medium
    description: Spike could conflate symptoms — socket drop after idle could also be Bun runtime issue inside Multica or local network instability
    mitigation: Repro section cites the cross-task pattern (302e56c4 also dropped); if spike can't disambiguate, brief documents the ambiguity + suggests two parallel upstream questions
  - severity: low
    description: cmux MODULE_NOT_FOUND noise might tempt the spike to chase the wrong target
    mitigation: Story spec explicitly reframes cmux as cosmetic per research-brief; spike confirms during research step + cites that finding

