id: mi-02-spike-session-lifecycle
epic: multica-integration-fixes
title: Spike — Multica Claude provider session lifecycle + API socket idle drop
status: blocked
complexity: small
methodology: classic
depends_on: [mi-01-spike-plugin-loading]   # serial per grill C3 (defensive vs codex race; also serializes Multica-source-read budget across spikes)
wave: W1
action_id: MI-02

description: |
  Read Multica source to determine how the Claude provider manages its
  Anthropic API connection lifecycle — keepalive, idle timeout, retry,
  reconnect. Diagnose the API socket idle drop seen in hermes-integration-mvp
  h-04 attempt 1 (16-minute idle gap between agent's last message and socket
  drop; pattern affects multiple unrelated tasks per daemon log).

  Pre-step: same as mi-01 — verify ~/Code/spikes/multica or fresh-clone.

  HARD BUDGET: ≤2 hours wall-clock OR ≤15 file reads. Non-completion path:
  brief documenting search effort + recommended upstream question.

  IMPORTANT — composable-substrate posture (per grill P1): this brief ships
  diagnosis + upstream-fix-spec ONLY. Hive-side workaround proposals
  (retry-with-backoff, smaller stories, keepalive-tickle) go in an APPENDIX
  marked "options NOT recommended for this epic — see follow-on" so the
  composable substrate posture isn't violated. The right Hive-side response
  to upstream socket drops is fail-fast + clear error, not workarounds.

acceptance_criteria:
  - "Pre-step documented same as mi-01 (which source read, SHA verified)"
  - "`.pHive/upstream-watch/multica-session-lifecycle.md` exists with four required sections: ## Repro, ## Root cause, ## Suggested fix, ## Recommended Multica-side change"
  - "Repro section cites the h-04 attempt 1 daemon log lines (task 6b08b856, 16-min idle gap, socket drop after 7m9s)"
  - "Root cause names: keepalive mechanism (if any), idle timeout (Multica-configurable vs Anthropic-server-imposed), retry-on-disconnect (present or absent), connection pooling posture"
  - "Suggested fix is a concrete change at a named Multica code site OR a concrete config knob to expose"
  - "Workaround appendix lists 3-5 Hive-side options with brief pros/cons but explicitly states 'not recommended for this epic' per composable-substrate posture"
  - "Brief ≤100 lines (excluding code blocks + appendix); slightly larger than mi-01 because session lifecycle is multi-step"

metric:
  applies: false
  justification: "Spike story — deliverable is a written brief at .pHive/upstream-watch/multica-session-lifecycle.md documenting an upstream connection-management gap. No observable user-facing surface to measure; success is the brief shipping with four sections + repro citation + composable-substrate-aware workaround appendix, verified by reviewer reading the file."

steps:
  - id: research
    description: |
      Read Multica source for the Claude provider's connection management:
      Anthropic SDK initialization, keepalive code, retry/reconnect handlers,
      idle timeout config, WebSocket vs HTTP transport choice. Cross-reference
      ~/.multica/daemon.log for h-04 attempt 1 (task 6b08b856) timing
      evidence. Identify whether the 16-min idle drop is Anthropic-side
      timeout (suggests increase keepalive frequency) or Multica-side
      (suggests connection-pool or retry change).
    agent: researcher

  - id: implement
    description: |
      Write .pHive/upstream-watch/multica-session-lifecycle.md per acceptance
      criteria. Four sections + repro citation + workaround appendix marked
      "not recommended for this epic." Brief ≤100 lines.
    agent: technical-writer
    depends_on: [research]

  - id: review
    description: |
      Verify four sections + repro citation + ≤100-line cap + workaround
      appendix's "not recommended" disclaimer present. Confirm root cause
      names actual Multica code site (or explicit "couldn't find within
      budget"). Confirm fix is actionable (upstream maintainer could open
      the PR from this brief alone).
    agent: reviewer
    depends_on: [implement]

  - id: integrate
    description: |
      Commit the brief on feat/multica-integration-fixes branch.
    agent: developer
    depends_on: [review]

