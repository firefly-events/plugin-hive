id: s9-plan-wire
epic: dag-flows-multica
title: Wire /plan to the DAG front door (planning-routing seam)
status: shipped
shipped_at: "2026-06-22T01:30:00Z"
release_id: "v2.12.1"
complexity: medium
methodology: classic
depends_on: [s8-plan-graph]

description: |
  Route /plan through the DAG run entrypoint (s2) when the backend resolves to
  DAG/Multica, via the existing planning-routing seam — so plan's non-deterministic
  per-node work runs behind AgentSpawn while the DAG owns flow/gates. Preserve the
  gate-ownership invariant: the orchestrator still presents + waits at the local
  design-discussion / H-V / structured-outline sign-off gates; graph/Multica
  completion is an artifact-readiness signal, not user sign-off.

  Backend selection follows the existing mode knobs (planning.mode: multica /
  HIVE_PLANNING_MODE) and the binding selector from s2 (local fallback when unset).

acceptance_criteria:
  - "Given planning.mode resolves to the DAG/Multica backend, when /plan runs, then planning-routing dispatches the plan graph (s8) via the front door instead of inline persona dispatch."
  - "Given the user-gate invariant, when the graph produces/refines artifacts, then the orchestrator still presents the design-discussion / H-V / outline gates locally and waits for user input."
  - "Given backend unset, when /plan runs, then existing direct/local behaviour is preserved (no regression)."

steps:
  - id: research
    description: Read skills/hive/skills/planning-routing/SKILL.md + plan/SKILL.md Phase 0c mode-resolve to find the dispatch seam.
    agent: researcher
  - id: implement
    description: Wire planning-routing to invoke the DAG front door for DAG/Multica backend; keep user gates orchestrator-local.
    agent: developer
    depends_on: [research]
  - id: test
    description: Test backend routing (DAG path vs local fallback) + that user gates are not auto-advanced.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm gate-ownership invariant + no regression to default path.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit to feature branch.
    agent: developer
    depends_on: [review]

