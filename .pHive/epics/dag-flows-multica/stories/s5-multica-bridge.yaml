files_to_modify:
  - file: hive/lib/multica-story-dispatch/index.mjs
    change: Add createIssue (POST /api/issues) + reconcileBranch (fetch + ff-merge) exports.
  - file: hive/lib/multica-story-dispatch/cli.mjs
    change: Add create-issue + reconcile subcommands.

risks:
  - severity: high
    description: Non-ff reconcile silently creates a merge commit / corrupts tree.
    mitigation: ff-only; fail loud with a specific code on non-ff; tested.
  - severity: medium
    description: JSON contract drift breaks the Python binding.
    mitigation: Single stringified-JSON stdout line; contract test.

references:
  - path: hive/lib/multica-story-dispatch/cli.mjs
    relevant_excerpt: |
      Prints JSON.stringify(data)+'\n' to stdout; errors {code,message} to stderr, exit 1.
