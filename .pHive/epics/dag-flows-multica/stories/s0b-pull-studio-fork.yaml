    description: "Studio unreachable / SSH auth issues block the exact-code pull (memory ref: SSH probe lies, Keychain GUI-session caveat)."
    mitigation: Fall back to firefly-events GitHub clone (loses unpushed commits) — documented; do not probe Keychain.
  - severity: medium
    description: Fork build deps differ from brew (Go toolchain / build steps) on this machine.
    mitigation: research step confirms build method before swapping off brew; brew binary stays as one-step rollback.
  - severity: medium
    description: Fork-vs-upstream API drift silently breaks bridge assumptions.
    mitigation: Re-verify epic-critical surfaces against the fork + document deltas before s4/s5/s6.

references:
