id: s0-multica-upgrade
epic: dag-flows-multica
title: Upgrade local Multica (server + CLI) to latest + re-verify epic-critical endpoints
status: pending
complexity: low
methodology: classic
depends_on: []

description: |
  Pre-execution prep (user-requested 2026-06-21): bring the local Multica instance to
  the latest release BEFORE the Multica-dependent stories run. The bridge stories
  target the CURRENT API (CLI 0.3.4, built 2026-05-20): PUT /api/workspaces {repos}
  (s4 repo-bind), POST /api/issues (s5 create-issue), dispatch/poll (s5/s6). A newer
  release may change endpoint shapes, add a native repo-bind/create surface, or alter
  the cli.mjs/HTTP contract — so pin and re-verify against the upgraded server, and
  fix any drift before building on it.

  This story is a hard prerequisite for the Multica chain (gates s4). The local-stub
  substrate stories (s1-s3) do NOT depend on Multica and may proceed independently.

acceptance_criteria:
  - "Given the current install (CLI 0.3.4), when the upgrade runs, then both the Multica server and CLI are at the latest available release and `multica --version` + server /health confirm it."
  - "Given the upgraded server, when the epic-critical endpoints are probed, then PUT /api/workspaces {repos}, POST /api/issues, and dispatch/poll are re-verified (status + response shape) and any contract change is documented for s4/s5/s6."
  - "Given the multica-init SKILL + bootstrap, when read, then any hard-coded version assertions (e.g. 'v0.3.4', the deferred-repo-binding note) are reconciled with the upgraded version's actual capabilities."
  - "Given the daemon, when restarted post-upgrade, then it is healthy and agent dispatch still works (smoke one dispatch)."

steps:
  - id: research
    description: Determine the local install method + path (CLI 0.3.4; server bin), find the latest release, and list the endpoint/contract deltas the epic depends on.
    agent: researcher
  - id: implement
    description: Upgrade server + CLI to latest; restart daemon; re-verify the three epic-critical endpoints + record any contract drift; reconcile multica-init version assertions.
    agent: developer
    depends_on: [research]
  - id: test
    description: Smoke — /health 200, `multica --version` latest, one dispatch→poll round-trip, PUT workspaces repos 200, POST issues 200.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm endpoints verified + any contract changes captured for s4/s5/s6; no half-upgraded state.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit any version-assertion reconciliation to the feature branch.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: skills/multica-init/SKILL.md
      purpose: Hard-codes "v0.3.4" + deferred-repo-binding note; reconcile against upgraded version.
    - path: hive/lib/multica-bootstrap/index.mjs
      purpose: ensureRepos PUT /api/workspaces {repos} — re-verify against upgraded API.
    - path: hive/lib/multica-story-dispatch/cli.mjs
      purpose: dispatch/poll/create-issue contract that s5/s6 build on.

risks:
  - severity: high
    description: Upgrade changes the API/contract the bridge stories assume → silent breakage in s4/s5/s6.
    mitigation: Re-verify the three epic-critical endpoints post-upgrade + document deltas before those stories run.
  - severity: medium
    description: Half-upgraded state (CLI vs server version skew) or unhealthy daemon.
    mitigation: Upgrade both, restart daemon, smoke /health + one dispatch before marking done.

references:
  - path: .pHive/epics/dag-flows-multica/docs/research-deepen.md
    relevant_excerpt: |
      Bridge: PUT updates existing issues only (no create); cli.mjs JSON stdout contract; poll returns code_push_sha/work_dir.

