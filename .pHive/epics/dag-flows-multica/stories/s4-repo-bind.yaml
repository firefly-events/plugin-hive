id: s4-repo-bind
epic: dag-flows-multica
title: Finish Multica repo-binding (wire ensureRepos + un-defer multica-init)
status: pending
complexity: low
methodology: classic
depends_on: [s0-multica-upgrade]
parallel_allowed: true
parallel_rationale: bounded-slice

description: |
  Complete the hard prerequisite for running any flow on Multica: a bound repo so each
  task workdir is a real checkout (`multica repo checkout <url>`) the agent can write +
  commit to. `ensureRepos()` already exists + is exported from multica-bootstrap (this
  epic's first commit) but is UNUSED, and skills/multica-init/SKILL.md still says repo
  binding is deferred ("endpoint does not exist in v0.3.4") — STALE; PUT /api/workspaces
  {repos} returns 200 now (verified live 2026-06-21, workspace c6bef1ec bound).

  Wire ensureRepos into the multica-init bootstrap sequence (as Step 10, after agents),
  un-defer the SKILL text (lines 33-34 + 58-66), add it to the status report, and unit-
  test it. Gates Slice 2 (Multica cannot reconcile a real checkout without this).

acceptance_criteria:
  - "Given multica-init runs, when bootstrap reaches Step 10, then ensureRepos is invoked (consent-gated) and binds the project origin remote to the workspace; idempotent no-op when already bound."
  - "Given skills/multica-init/SKILL.md, when read, then the deferred-repo-allowlist language at lines 33-34 and 58-66 is replaced with a real Step 10 (ensureRepos) and the init sequence lists it."
  - "Given the status report, when shown, then it reports repo-bind state (bound url / not bound)."
  - "Given a unit test, when ensureRepos runs against a fake workspace API, then bind, idempotent-skip, and REPO_URL_UNRESOLVED error paths are covered."

steps:
  - id: research
    description: Read ensureRepos in multica-bootstrap/index.mjs + the multica-init SKILL deferred lines + the bootstrap sequence/status reporter.
    agent: researcher
  - id: implement
    description: Add Step 10 ensureRepos to the init sequence + status; rewrite SKILL.md deferred lines into a real step.
    agent: developer
    depends_on: [research]
  - id: test
    description: Unit-test ensureRepos (bind / idempotent / unresolved-url).
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm SKILL text no longer claims deferral; sequence + status updated.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit to feature branch.
    agent: developer
    depends_on: [review]

