id: s3-validation-gate
epic: dag-flows-multica
title: Deterministic output-validation gate (verify committed artifacts in code)
status: pending
complexity: medium
methodology: classic
depends_on: [s2-run-frontdoor]

description: |
  Build a reusable output-validation gate that runs after an artifact-producing node
  and validates the COMMITTED files in code — never the agent's self-report. North
  star 2: the squad lead over-claimed "committed" with nothing committed; the gate is
  the deterministic boundary. Reuses the existing GateHandler/GateFailedError +
  Dispatcher; this story adds the validation logic + a reusable gate/script node
  shape graphs can reference.

  Validation targets are flow-specific (parameterised): plan → committed
  .pHive/epics/<id>/{epic.yaml,stories/*.yaml} conform to the story/epic schema;
  execute/test/review → expected changed/added artifacts exist + parse. Start with
  the plan schema validator (consumed by s5); make the gate generic enough for s8/
  s10/s11 to plug their own check.

acceptance_criteria:
  - "Given a node that claims to have produced .pHive/epics output, when the gate runs, then it reads the files from disk/repo and validates them against the epic/story schema; missing or malformed → GateFailedError with a specific message."
  - "Given an agent that reports success but committed nothing, when the gate runs, then it FAILS (self-report is ignored)."
  - "Given a valid set of committed artifacts, when the gate runs, then it returns gate_passed: True."
  - "Given execute/test/review, when their graphs reference the gate with a different validation target, then the gate validates that target without code changes (parameterised)."

steps:
  - id: research
    description: Read handlers/gate.py + GateFailedError + the epic/story schema (hive/references/story-yaml-schema.md, agent-ready-checklist) to fix what 'valid plan output' means.
    agent: researcher
  - id: implement
    description: Implement parameterised validation (schema check over committed files) wired as a gate/script node; plan validator first.
    agent: developer
    depends_on: [research]
  - id: test
    description: Tests — valid output passes; empty/missing fails; malformed YAML fails; self-report-only fails.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm it reads committed files (not node outputs/self-report) and reuses GateHandler.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit to feature branch.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/don/Documents/plugin-hive
  key_files:
    - path: hive/lib/dag_executor/executor/handlers/gate.py
      purpose: GateHandler.handle → gate_passed or raises GateFailedError. Reuse.
    - path: hive/references/story-yaml-schema.md
      purpose: Canonical story/epic schema the plan validator checks against.
    - path: hive/references/agent-ready-checklist.md
      purpose: 9-point story validity rules.

risks:
  - severity: high
    description: Validating node outputs/self-report instead of committed files (the exact bug we are guarding against).
    mitigation: Gate reads from disk/repo post-reconcile; AC explicitly fails self-report-only.

references:
  - path: hive/lib/dag_executor/executor/handlers/gate.py
    relevant_excerpt: |
      Success: NodeOutput(outputs={"gate_passed": True}); Failure: raise GateFailedError(...).
