id: s1-local-spawn
epic: dag-flows-multica
title: Local AgentSpawn binding (wraps agent-spawn Step 7)
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  Implement the default, local `AgentSpawn` binding that satisfies the Protocol in
  hive/lib/dag_executor/executor/handlers/agent.py. It wraps Step 7 of
  skills/hive/skills/agent-spawn/SKILL.md (the existing local persona dispatch) and
  returns the node's outputs dict. This is the fallback binding; MulticaAgentSpawn
  (s4) is the swap-in sibling. No production binding exists today — see
  dag_executor/__init__.py:173-177 which puts assembly on the caller.

  Do NOT modify AgentHandler or re-implement any part of agent-spawn inside the
  binding. The binding builds the call into the spawn chain and returns outputs.

acceptance_criteria:
  - "Given a Node with agent + step_file_content + inputs, when the local binding is called with (agent, step_file_content, inputs, run_id, step_id), then it dispatches via the agent-spawn Step 7 surface and returns a dict keyed by the node's declared OutputRef names."
  - "Given the verbatim contract, when the binding builds the prompt, then step_file_content is passed without paraphrase/summarise (asserted analogously to test_handlers_agent.py)."
  - "Given AgentHandler(spawn=local_binding), when run against the StubAgentSpawn spine fixture's graph, then behaviour matches the documented call shape."

steps:
  - id: research
    description: Read agent.py (AgentSpawn/AgentHandler/StubAgentSpawn), test_handlers_agent.py, and agent-spawn/SKILL.md Step 7 to fix the exact call surface and output contract.
    agent: researcher
  - id: implement
    description: Implement the local binding callable/class satisfying AgentSpawn; wire output mapping to OutputRef names.
    agent: developer
    depends_on: [research]
  - id: test
    description: Unit test the binding (call shape, verbatim step_file, output dict keys) using a recording spy paralleling StubAgentSpawn.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Verify no AgentHandler/agent-spawn re-implementation; verbatim contract honoured.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit to feature branch.
    agent: developer
    depends_on: [review]

