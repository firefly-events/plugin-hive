name: dag-flows-multica
title: DAG-driven Hive flows on Multica
description: |
  Make the deterministic DAG executor the single orchestration substrate for all Hive
  command flows (plan, execute classic/tdd/bdd, test, review), with Multica providing
  only agent execution behind the AgentSpawn Protocol. DAG owns flow/gates/routing/
  schema-validation/resume; one binding swaps local<->Multica. Loops handled by bounded
  Node.retry (no LOOP primitive — preserves the acyclic invariant). Backend follows the
  existing mode knobs with local fallback.
target_codebase: /Users/don/Documents/plugin-hive
methodology: classic
version_bump: minor

git_flow:
  base_branch: develop
  branch_strategy: per-epic

stories:
  - id: s0-multica-upgrade
    title: Upgrade local Multica (server + CLI) to latest + re-verify endpoints
    complexity: low
    depends_on: []
  - id: s1-local-spawn
    title: Local AgentSpawn binding (wraps agent-spawn Step 7)
    complexity: medium
    depends_on: []
  - id: s2-run-frontdoor
    title: Production executor assembly + run/resume entrypoint
    complexity: high
    depends_on: [s1-local-spawn]
  - id: s3-validation-gate
    title: Deterministic output-validation gate (verify committed artifacts)
    complexity: medium
    depends_on: [s2-run-frontdoor]
  - id: s4-repo-bind
    title: Finish Multica repo-binding (wire ensureRepos + un-defer multica-init)
    complexity: low
    depends_on: [s0-multica-upgrade]
  - id: s5-multica-bridge
    title: Multica bridge surface — create-issue + reconcile helpers + JSON contract
    complexity: high
    depends_on: [s4-repo-bind]
  - id: s6-multica-spawn
    title: MulticaAgentSpawn binding (Python) + Codex-headless smoke
    complexity: high
    depends_on: [s2-run-frontdoor, s5-multica-bridge]
  - id: s7-reconcile-node
    title: Reconcile SCRIPT node (fetch + ff-merge before the gate)
    complexity: medium
    depends_on: [s5-multica-bridge, s6-multica-spawn]
  - id: s8-plan-graph
    title: Plan flow graph (plan.workflow.yaml + verbatim step_files)
    complexity: high
    depends_on: [s3-validation-gate, s6-multica-spawn, s7-reconcile-node]
  - id: s9-plan-wire
    title: Wire /plan to the DAG front door (planning-routing seam)
    complexity: medium
    depends_on: [s8-plan-graph]
  - id: s10-execute-graphs
    title: Execute/develop flow graphs (extend development.*.workflow.yaml)
    complexity: high
    depends_on: [s3-validation-gate, s6-multica-spawn, s7-reconcile-node]
  - id: s11-execute-wire
    title: Wire /execute to the DAG front door (execution mode-resolve seam)
    complexity: medium
    depends_on: [s10-execute-graphs]
  - id: s12-test-flow
    title: Test flow graph (extend test-swarm.workflow.yaml + reconcile + gate)
    complexity: medium
    depends_on: [s3-validation-gate, s6-multica-spawn, s7-reconcile-node]
  - id: s13-review-flow
    title: Review flow graph (new review.workflow.yaml + reconcile + gate)
    complexity: medium
    depends_on: [s3-validation-gate, s6-multica-spawn, s7-reconcile-node]
  - id: s14-backend-episodes
    title: Unify backend selection + episode markers + resume across all flows
    complexity: medium
    depends_on: [s9-plan-wire, s11-execute-wire, s12-test-flow, s13-review-flow]
  - id: s15-docs
    title: Document the DAG-on-Multica substrate (README + operations-guide)
    complexity: low
    depends_on: [s14-backend-episodes]
