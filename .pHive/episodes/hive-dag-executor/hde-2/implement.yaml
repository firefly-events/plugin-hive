telemetry_blocker_resolution: |
  hive.lib.metrics.core.append_event enforces a metrics-experiment schema
  (metric_type whitelist + story_id/proposal_id requirement) incompatible
  with the executor's per-node event taxonomy. Resolved per team-lead
  confirmation (option A): telemetry.py defines its own
  REQUIRED_EXECUTOR_EVENT_FIELDS = {run_id, step_id, event_type,
  timestamp, payload}, validates field PRESENCE against that constant,
  and JSONL-appends to events/{run_id}.jsonl via
  hive.lib.metrics.paths.resolve_metrics_path — same stream as
  append_event, different validator. append_event itself is untouched.
  Persistence is opt-in via Telemetry(persist=True); buffer-only by
  default for tests. Walker call sites pass (event_type, step_id,
  payload) explicitly so the strict schema is enforced at the seam.
