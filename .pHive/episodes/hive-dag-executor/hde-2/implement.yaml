  hive.lib.metrics.core.append_event enforces a metrics-experiment schema
  (metric_type whitelist + story_id/proposal_id requirement) incompatible
  with the executor's per-node event taxonomy. Implementation choice (option
  A from SendMessage to team-lead): telemetry.py validates field PRESENCE
  against REQUIRED_EVENT_FIELDS, auto-fills metrics-vocabulary defaults
  (metric_type=executor_event, value=0, unit=event, source=dag_executor,
  dimensions={}, event_id=evt-<uuid>), and does NOT call append_event.
  append_event itself is untouched. Pending team-lead reply on whether to
  switch to option B (separate stream) before merge.
