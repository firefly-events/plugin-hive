step: research
story_id: r-3-review-mode-cc-workflows
epic: substrate-coverage-and-test-cleanup
agent: researcher
status: passed
timestamp: "2026-06-08T00:00:00Z"

notes:
  summary: >
    All 12 research items mapped. r-3 is a thin-wrapper cc-workflows atom for solo
    reviewer dispatch. Its anatomy mirrors test-mode-cc-workflows (single agent() call,
    single Workflow run, one episode marker) rather than plan-mode-cc-workflows
    (per-persona fan-out). Key patterns captured below.

  item_1_plan_mode_atom_anatomy:
    invocation_contract:
      inputs: [assembled_personas[], planning_story, epic_handle, hive_config, integration_branch]
      outputs: [dispatched[], completed[], failed[], run_id]
    step_0_precondition:
      import: "import { assertWorktreeIsolation } from '../../../hive/lib/cc-workflows-preconditions.mjs';"
      call: "assertWorktreeIsolation(); // throws precondition_failed if cwd is not a worktree"
      must_be_first: true
    step_1_dispatch:
      pattern: serial per-persona within team assembly
      agent_call: "agent(prompt, { schema, phase, label, model: tier })"
      opts_model: REQUIRED on every agent() call
      resolveModelTier_import: "import { resolveModelTier } from 'hive/lib/cc-workflows-model-tier.mjs';"
      resolveModelTier_call: "const { tier, source } = resolveModelTier(persona, { config: hive_config });"
      args_parse_contract: "const a = typeof args === 'string' ? JSON.parse(args) : args;"
    no_codex:
      rule: No agentType on any agent() call; cc-workflows is inline-Claude substrate
      enforcement: s-3 lint 4 checks
    insight_capture_suffix: |
      INSIGHT CAPTURE (before returning your structured output)

      If you encountered any reusable lesson during this turn — a constraint that surprised
      you, a pattern that worked unexpectedly well, a footgun the next <persona> on this
      codebase will hit — append it to:

        hive/agents/memories/<persona>/<kebab-case-title>.md

      File shape (frontmatter + 3-5 line body):

      ---
      name: <kebab-case-title>
      description: <one-line summary, second-person imperative>
      applies_to: <persona>
      ---

      <2-4 lines: the lesson + why it matters. Concrete, not generic. Cite file paths
      or line numbers where useful.>

      Skip the capture entirely if nothing on this turn is reusable across stories.
      Do NOT write a memory just to satisfy this clause; empty captures pollute the
      memory dir. Fire-and-forget — do not block your return on the write. If the
      directory does not exist, create it.
    episode_marker_path: "${HIVE_STATE_DIR}/episodes/{epic_handle}/{planning_story.id}-{persona}/cc-workflows-run.yaml"
    episode_marker_filename: cc-workflows-run.yaml (shared family with execute-mode and test-mode)

  item_2_r2_multica_shape:
    thin_wrapper: true
    steps: [0_precondition, 1_issue_resolve_brief, 2_dispatch, 3_poll, 4_episode_marker, 5_close_issue, 6_aggregate_return]
    solo_reviewer_only: true
    panel_mode: DEFERRED
    scope_drift_observed: null
    scope_drift_semantics: >
      atom does NOT duplicate emit; r-1 owns the contract declaration;
      scope_drift_observed: null in marker confirms atom verified obligation.
    sequential_flag: "accepted verbatim; no-op for single-agent dispatch"
    mode_resolver_call: "resolveMode('HIVE_REVIEW_MODE', { env, rootConfig, shippedBaseline, skillOverride, default: 'auto' })"

  item_3_dr3_patterns:
    opts_model_wiring: >
      resolveModelTier() called per-role BEFORE script assembly; tier injected
      into opts.model on every agent() call.
    insight_capture_suffix: MANDATORY on every documented agent() prompt; persona substituted per call
    no_codex_code_block_hygiene: >
      agentType: <default | codex:codex-rescue> placeholder does NOT trigger lint
      (angle-bracket, not literal) — safe to include in schema-doc prose.
      NO agentType literal in code blocks.
    single_workflow_run: ONE Workflow run, FOUR agent() calls inside one phase()
    episode_marker: ONE marker capturing all step outputs

  item_4_t3_shape:
    unit_of_work: scenario (not persona, not story — maps cleanly to r-3's unit: review run)
    dispatch_shape: ONE Workflow run, ONE agent() call (tester), ONE episode marker
    closest_mirror_for_r3: >
      t-3 is the closest structural mirror for r-3 because both have a single
      agent() call (tester in t-3, reviewer in r-3) inside a single Workflow run.
      plan-mode is per-persona fan-out; dr-3 is 4 sequential calls — neither is r-3's model.
    agent_role: tester (single reviewer agent → r-3 maps to reviewer)
    episode_marker_path: "${HIVE_STATE_DIR}/episodes/{epic_handle}/{story_id}/cc-workflows-run.yaml"

  item_5_r1_router:
    env_var: HIVE_REVIEW_MODE
    workflow_name: code-review
    cc_workflows_dispatch: "When mode_decision == 'cc-workflows', hand off to review-mode-cc-workflows/SKILL.md"
    arguments_forwarded: "PR number, branch name, file paths, --sequential flag — all verbatim"
    scope_drift_contract: >
      Any downstream review-mode-* atom MUST preserve the scope_drift emit at
      review:complete. One of exactly 3 sanctioned emit_scope_drift call sites
      in the codebase (others: plan:phase-c, execute:story). Atom owns the emit
      inside its agent prompt; r-3 marker sets scope_drift_observed: null to confirm.
    sequential_flag: captured from arguments, forwarded verbatim, no-op for solo dispatch

  item_6_review_skill_phase1_solo_pattern:
    phase_0_dispatch: resolves mode via r-1; cc-workflows → hand off to r-3
    phase_1_inline_solo:
      step_a_researcher: scope analysis, complexity, affected modules
      step_b_reviewer: correctness, security, conventions, performance
      step_5_display: structured findings with verdict (passed | needs_optimization | needs_revision)
      step_6_scope_drift: emit_scope_drift at review:complete with extra_dimensions.verdict
    r3_must_preserve: >
      r-3's single reviewer agent() call must internally run both the researcher
      and reviewer subagent steps (matching r-2's brief which instructs the
      dispatched agent to run the solo reviewer pattern: step a + step b).

  item_7_mode_resolver_registration:
    file: hive/lib/mode-resolver.mjs
    hive_review_mode_registered: true
    registry_location: "module doc-block lines 39-44 (HIVE_REVIEW_MODE listed among 6 recognized varNames)"
    recognized_modes: [sandcastle, multica, cc-workflows, sequential, auto]
    confirmed: "HIVE_REVIEW_MODE is the 6th entry in the resolver-name registry"

  item_8_lint_checks:
    file: hive/scripts/lint-cc-workflows-no-codex.mjs
    scope: "skills/hive/skills/*-mode-cc-workflows/SKILL.md ONLY"
    r3_in_scope: true  # review-mode-cc-workflows matches *-mode-cc-workflows pattern
    check_1:
      name: agentType-literal-ast
      pattern: "/agentType\\s*:\\s*[\"']?codex:codex-rescue[\"']?/"
      scope: fenced code blocks only
      exclusion: "angle-bracket placeholder <default | codex:codex-rescue> does NOT match"
    check_2:
      name: codex-rescue-grep
      pattern: "codex:codex-rescue in code blocks, excluding <...> placeholders"
      scope: fenced code blocks only
    check_3:
      name: agent-backends-grep
      pattern: "agent_backends in code blocks"
      scope: fenced code blocks only
    check_4:
      name: cc-workflows-preconditions-import
      pattern: "'hive/lib/cc-workflows-preconditions.mjs' anywhere in file"
      scope: full file (not code-block scoped)
      requirement: "SKILL.md must contain the string hive/lib/cc-workflows-preconditions.mjs"

  item_9_preconditions_helper:
    file: hive/lib/cc-workflows-preconditions.mjs
    export: assertWorktreeIsolation
    default_export: assertWorktreeIsolation
    signature: "assertWorktreeIsolation(cwd = process.cwd())"
    throws: "Error with .precondition_failed=true and .field_sources on violation"
    pattern: "WORKTREE_RE = /\\.claude\\/worktrees\\/[^/]+/"
    import_statement: "import { assertWorktreeIsolation } from '../../../hive/lib/cc-workflows-preconditions.mjs';"

  item_10_model_tier_resolver:
    file: hive/lib/cc-workflows-model-tier.mjs
    export: resolveModelTier
    signature: "resolveModelTier(persona, { config: hive_config })"
    returns: "{ tier: 'sonnet' | 'opus' | 'haiku', source: 'model_overrides' | 'model_tiers' | 'default' }"
    precedence: "model_overrides > model_tiers > default('sonnet' + WARN)"
    never_read: persona frontmatter model: field
    r3_persona: reviewer (single solo reviewer agent() call)
    call_example: |
      import { resolveModelTier } from '../../../hive/lib/cc-workflows-model-tier.mjs';
      const { tier, source } = resolveModelTier('reviewer', { config: hive_config });
      // agent(prompt, { schema, phase: 'Review', label: 'reviewer', model: tier })

  item_11_r3_canonical_dispatch_shape:
    unit_of_work: review run (mapped to unit_id = PR#, branch, or 'ad-hoc')
    workflow_runs: ONE per /review trigger
    agent_calls: ONE (reviewer persona, solo)
    episode_markers: ONE cc-workflows-run.yaml per dispatch
    marker_path: "${HIVE_STATE_DIR}/episodes/{epic_handle}/{unit_id}/cc-workflows-run.yaml"
    phase_name_suggestion: Review
    insight_capture_suffix: MANDATORY on the sole reviewer agent() prompt
    scope_drift: reviewer agent emits inside its prompt-driven run; atom sets scope_drift_observed: null in marker
    no_git_contract: reviewer prompt carries explicit "do not run git commit/add/push" instruction
    args_parse_contract: "const a = typeof args === 'string' ? JSON.parse(args) : args;"

  item_12_files_examined:
    - path: hive/agents/researcher.md
      relevance: persona spec — researcher role, output format, scope discipline
    - path: .pHive/epics/substrate-coverage-and-test-cleanup/stories/r-3-review-mode-cc-workflows.yaml
      relevance: AC, design decisions, file targets
    - path: skills/hive/skills/plan-mode-cc-workflows/SKILL.md
      relevance: canonical atom anatomy, Step 0 pattern, opts.model, args parse, insight-capture suffix
    - path: skills/hive/skills/review-mode-multica/SKILL.md
      relevance: r-2 sister atom; thin-wrapper Steps 0-6, scope_drift_observed:null, solo reviewer shape
    - path: skills/hive/skills/design-review-mode-cc-workflows/SKILL.md
      relevance: dr-3; opts.model wiring per-call, insight-capture suffix mandatory, no-codex hygiene
    - path: skills/hive/skills/test-mode-cc-workflows/SKILL.md
      relevance: t-3; CLOSEST dispatch shape mirror (single agent() call inside single Workflow run)
    - path: skills/hive/skills/review-dispatch/SKILL.md
      relevance: r-1; env var HIVE_REVIEW_MODE, workflow_name 'code-review', argument forwarding, scope_drift contract
    - path: skills/review/SKILL.md
      relevance: Phase 0 dispatch branching, Phase 1 solo reviewer pattern r-3 must preserve
    - path: hive/lib/cc-workflows-preconditions.mjs
      relevance: assertWorktreeIsolation export + import statement shape
    - path: hive/lib/cc-workflows-model-tier.mjs
      relevance: resolveModelTier(persona, { config }) signature
    - path: hive/lib/mode-resolver.mjs
      relevance: HIVE_REVIEW_MODE registration confirmed (lines 39-44 registry)
    - path: hive/scripts/lint-cc-workflows-no-codex.mjs
      relevance: 4 check implementations, scope pattern, code-block extraction logic

  risks:
    - severity: low
      signal: >
        r-3 uses ONE agent() call (reviewer) but the solo reviewer pattern in
        skills/review/SKILL.md Phase 1 internally runs two subagents (researcher +
        reviewer). The reviewer's prompt must explicitly instruct it to run BOTH
        steps a and b — this is the same pattern r-2 uses in its brief. Developer
        must carry this into the agent() prompt body, not split into two agent() calls.
    - severity: low
      signal: >
        scope_drift emit site: r-3's reviewer agent() prompt must emit scope_drift at
        review:complete. The atom sets scope_drift_observed: null in marker to confirm
        it verified the obligation rather than owning the call directly. Same as r-2.

  validation_note:
    checked: "No external libraries/SDKs referenced; codebase-only research"
    source: codebase-only
    confidence: high
    findings: "All patterns confirmed from existing shipped atoms (t-3, dr-3, r-2, plan-mode). No gaps."
