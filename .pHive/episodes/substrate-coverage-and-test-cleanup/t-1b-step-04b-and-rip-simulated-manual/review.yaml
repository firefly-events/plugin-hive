      (2) The test-scenario YAML at .pHive/test-scenarios/t-1b-step-04b-and-rip-simulated-manual.yaml
      does NOT validate against the loader (`loadScenario`). The in-house YAML parser in
      hive/lib/scenarios/load.mjs does not handle `>` folded scalars; the step at
      index 6 (lines 76-86) contains an `expected:` block where the folded content
      includes literal "id: scenario-replay-folded ..." which the parser misreads as
      a sub-key, raising VALIDATION_ERROR "unrecognized field 'steps[6].id'".
      AC for the scenario step ("CREATE — test-scenario per test-scenario-schema.md")
      requires the file to conform to the schema; the loader is the schema authority.
      Either rewrite the offending expected: blocks to avoid embedded "id:" / "status:"
      tokens, or quote/restructure to prevent the parser misreading them as keys.
      Until reconciled the scenario file is non-loadable.

findings:
  improvements:
    - category: test-coverage
      severity: improvement
      location: hive/lib/scenarios/__tests__/load.test.mjs:344
      issue: |
        Stale assertion from t-1a: "validate-coverage.depends_on must contain execute-platform-a"
        now fails because t-1b correctly retargets validate-coverage to depend on scenario-replay.
        Cross-story DAG sequencing artifact.
      suggestion: |
        Update the assertion to match the post-t-1b graph: validate-coverage.depends_on must
        contain scenario-replay (not execute-platform-a). This is a 1-line fix to the existing
        t-1a test and should be folded into t-1b's integrate commit so the integration branch
        stays green.

    - category: test-coverage
      severity: improvement
      location: .pHive/test-scenarios/t-1b-step-04b-and-rip-simulated-manual.yaml:76-86
      issue: |
        The step at index 6 (step 7 in the YAML) has an `expected:` folded-scalar block
        containing literal "id: scenario-replay-folded" and "status: retired" tokens.
        The in-house YAML parser used by loadScenario (hive/lib/scenarios/load.mjs) does
        not understand `>` folded scalars and re-reads the indented content as nested
        sub-keys, raising VALIDATION_ERROR `unrecognized field 'steps[6].id'`.
        The scenario file does not validate against the loader.
      suggestion: |
        Rewrite the offending expected: block to remove embedded `id:` / `status:` tokens
        (e.g. quote the keys as 'id\\:' or restructure the prose to say "an entry whose id is
        scenario-replay-folded and whose status is retired"). Verify via:
        `node -e "import('./hive/lib/scenarios/load.mjs').then(m =>
          { const s = m.loadScenario('.pHive/test-scenarios/t-1b-step-04b-and-rip-simulated-manual.yaml');
            console.log('OK ' + s.id); })"`
        before integrate.

