      and proposed reconciling in a future story. The t-1b tests are authored correctly
      and assert the final state independently, but the repository as a whole has a
      regressed test until the t-1a assertion is updated. This should be fixed before
      t-1b's integrate commit lands so that `node --test hive/lib/scenarios/__tests__/`
