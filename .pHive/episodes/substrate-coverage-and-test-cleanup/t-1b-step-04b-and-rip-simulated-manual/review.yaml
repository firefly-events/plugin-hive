    severity: improvement
    outcome: fail
    evidence: |
      Tests cover 16 cases across all 5 ACs (loader contract, output shape, DAG assertions).
      However, two issues found:

      (1) t-1a load.test.mjs has a stale assertion ("validate-coverage depends_on
      execute-platform-a") that now fails because t-1b severed that edge.
      `node --test hive/lib/scenarios/__tests__/load.test.mjs` reports 11/12 pass, 1 fail.
