  ## Item 8 — Phase 1 behaviors r-2 must prescribe

  1. Single reviewer agent dispatch — ONE reviewer agent (resolveAgentUuidByName('reviewer')) as Multica assignee
  2. PR/branch arg forwarding — issue brief must include the PR number, branch, or file paths from /review $ARGUMENTS
     so the reviewer inside Multica can run the correct diff command
  3. --sequential flag pass-through — forwarded verbatim from r-1; atom must document its semantics
     (for a single-agent run, --sequential is effectively a no-op but must be accepted without error)
  4. scope_drift emit preservation — atom MUST call emit_scope_drift(phase_label='review:complete',
     extra_dimensions={'verdict': ...}) after verdict is rendered; this is the atom's obligation per r-1 contract
     The emit must NOT be omitted or delegated back to r-1

  ## Item 9 — dr-2 cc-workflows-run.yaml artifacts.created as structural precedent

  The parallel atom (dr-2 = design-review-mode-multica) created:
    - skills/hive/skills/design-review-mode-multica/SKILL.md           ← main atom SKILL.md
    - skills/hive/skills/design-review-mode-multica/test/resolver.test.mjs  ← vitest spec
    - .pHive/test-scenarios/dr-2-design-review-mode-multica-smoke.yaml ← smoke scenario
    - .pHive/episodes/.../implement.yaml, test.yaml, review.yaml       ← step episode records
    - .pHive/episodes/.../workflow-script.js                           ← cc-workflows script
    - hive/agents/memories/{persona}/*.md                              ← insight memories (4)

  For r-2, the analogous set (from files_to_modify in story YAML) is:
    - skills/hive/skills/review-mode-multica/SKILL.md
    - skills/hive/skills/review-mode-multica/test/resolver.test.mjs
    - .pHive/test-scenarios/r-2-review-mode-multica-smoke.yaml

  ## Item 10 — Key non-obvious finding

  review/SKILL.md Phase 1 Step 3 dispatches TWO agents (researcher + reviewer) sequentially
  per the code-review.workflow.yaml. r-2 must decide: dispatch ONE issue whose internal agent
  runs BOTH workflow steps (researcher then reviewer), OR dispatch to the reviewer persona only?

  The story AC says "dispatches a single (solo) reviewer" and the contract invariant says
  "Solo (single) reviewer dispatch — ONE reviewer agent inside ONE Multica run."
  This means r-2 assigns to the 'reviewer' agent persona (not researcher), and the brief
  must embed the researcher step as an inline task the reviewer runs internally (or the
  reviewer handles analysis + critique in one pass). This differs from the inline path
  where researcher and reviewer are separate subagents. The dr-2 precedent (ui-designer
  runs 4 agent() calls internally) confirms this pattern: the Multica assignee can
  internally call agent() for sub-steps.

  Recommended: reviewer agent resolves + assigns; brief instructs internal researcher agent()
  call for Step 3a analysis, then reviewer performs Step 3b critique. Matches dr-2 pattern.
  This is a non-obvious delta from test-mode-multica (tester only, no prior subagent steps).

