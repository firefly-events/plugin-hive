notes: |
  ## Item 1 — Execute-mode-multica lifecycle (Steps 0-5)

  Step 0 (Precondition gate):
    - Resolve server_url: hive_config.task_tracking.multica.server_url > ~/.multica/config.json > MULTICA_SERVER_URL
    - Resolve PAT: MULTICA_TOKEN > ~/.multica/config.json token
    - Resolve workspace UUID via GET /api/workspaces matching slug
    - Resolve assignee agent (resolveAgentUuidByName) — BOOTSTRAP_REQUIRED aborts with exit 1; NO sequential fallback
    - Three execution sub-modes: phase-loop (TDD), squad, single-agent (default for r-2)

  Step 1 (createIssue + label):
    - If story.tracker_id exists: fetch via getStory (multica/index.ts)
    - Else: createStory({title, body: placeholder, labels: []}) — NO label convention found in either skill
    - Call moveOutOfBacklogIfNeeded before assignment
    - Write brief via serializeStoryBrief / ensureIssueBriefMatches
    - Serial-within-depth dispatch in Phase 1; parallel is Phase 2 future

  Step 2 (assignIssue):
    - Single-agent: dispatchStoryToAgent(serverUrl, token, workspaceId, issueUuid, assigneeUuid)
    - Returns 200 with assignee_type + assignee_id

  Step 3 (poll-to-terminal):
    - pollTaskUntilTerminal from episode-sync.mjs
    - onStateTransition callback: "[multica:{story_id}] {prev} → {next}"
    - maxWallClockMs default 1_800_000; pollIntervalMs default 5_000
    - terminal shape: { status, notes, messages, task_id, agent_id, agent_name, work_dir, attempts, started_at, completed_at }
    - Timeout-cancelled → status: 'cancelled', notes: 'timeout after Ns'
    - 3-consecutive-transport-errors → throws TRANSPORT

  Step 4 (marker + scope_drift):
    - writeMulticaRunEpisode from episode-sync.mjs
    - Marker path: ${HIVE_STATE_DIR}/episodes/{epic_handle}/{story_id}/multica-run.yaml
    - Sidecar: multica-run.messages.jsonl
    - Status mapping: completed→passed, failed→failed, cancelled→cancelled
    - scope_drift emit fire-and-forget IMMEDIATELY after marker write (execute:story phase_label)
    - NOTE: For r-2, scope_drift emit phase_label is 'review:complete' (not 'execute:story') — owned by r-1 contract

  Step 5 (closeIssue / return):
    - Labeled "Step 5" in execute-mode-multica = wait for all depth-0 terminal then return summary
    - Returns { dispatched[], completed[], failed[] } to /execute
    - Reconciliation: cherry-pick or ff-merge of agent/<persona>/<run-short> branch

  ## Item 2 — test-mode-multica as closer mirror

  test-mode-multica is the direct shape mirror for r-2:
  - ONE scenario → ONE Multica issue → ONE assigned agent (tester) → ONE episode marker
  - r-2 maps: ONE /review invocation → ONE Multica issue → ONE assigned agent (reviewer) → ONE episode marker
  - Steps: Step 0 (precondition), Step 1 (issue+brief), Step 2 (dispatch), Step 3 (poll), Step 4 (verify artifact), Step 5 (episode marker), Step 6 (aggregate+return)
  - Config namespace: hive_config.test.multica.* — r-2 should use hive_config.review.multica.*
  - Doc/verdict completion_kind dialect used for test; r-2 likely uses same dialect (verdict exists)
  - Key difference: test-mode has Step 4 verify-artifact (reads story YAML manual_verdict); r-2 has no equivalent artifact to verify — reviewer produces inline structured output, NOT a committed file

  ## Item 3 — review-dispatch (r-1) contract

  Env var: HIVE_REVIEW_MODE (confirmed registration in mode-resolver.mjs)
  workflow_name passed to dispatch: 'code-review'
  Inputs received from review/SKILL.md Phase 0:
    - env (HIVE_SESSIONS_ENABLED, HIVE_PARALLEL_TEAMS, HIVE_TERMINAL_MUX, HIVE_REVIEW_MODE, CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS)
    - rootConfig, consumerConfig, graduationRegistry
    - workflow_name: 'code-review'
    - epic_id (when known), arguments (PR/branch/--sequential), unblocked_stories[]

  Outputs:
    - mode_decision enum: sessions|team|team-cmux|sequential|sandcastle|multica|cc-workflows
    - mode_reason, runner_path, runner_reason, field_sources, gate_violations[]

  --sequential pass-through:
    - Dispatch skill does NOT consume or strip --sequential
    - Captured from arguments, forwarded verbatim to resolved atom (review-mode-multica)
    - Atom applies the same gate-check and pipeline-skipping logic as inline path

  scope_drift contract obligation (r-1 header):
    - "any downstream review-mode-* atom MUST preserve the scope_drift emit at review:complete"
    - phase_label='review:complete', extra_dimensions={'verdict': '<passed|needs_optimization|needs_revision>'}
    - One of exactly 3 sanctioned emit points (plan:phase-c, execute:story, review:complete)
    - Atom must NOT omit, rename, or merge this emit
    - CRITICAL: the scope_drift emit lives in the ATOM (r-2), not in r-1 — r-1 only states the obligation

  ## Item 4 — review/SKILL.md Phase 1 solo reviewer pattern

  Phase 0: call review-dispatch once; if mode_decision==multica → hand off to review-mode-multica/SKILL.md + STOP
  Phase 1 (inline solo path, preserved by r-2):
    Step 1: obtain diff (git diff --cached / git diff main..branch / gh pr diff 123 / git diff -- files)
    Step 2: read hive/workflows/code-review.workflow.yaml; fallback to two-step
    Step 3: execute workflow steps sequentially
      - Two primary agents: researcher (scope analysis) + reviewer (correctness/security/conventions/perf)
      - Spawn subagent with: persona, step task, diff content, prior step inputs
    Step 4: write episode records at .pHive/episodes/review/{timestamp}/{step-id}.yaml
    Step 5: display structured findings (Analysis→Review→Verdict→Summary format)
    Step 6: emit scope_drift_score at review:complete
      - expected_scope = file list in PR/branch diff
      - delivered_scope = file list reviewer actually evaluated
      - extra_dimensions={'verdict': '<passed|needs_optimization|needs_revision>'}

  Agent that runs the review: reviewer (hive/agents/reviewer.md) via workflow steps
  r-2 must dispatch ONE reviewer agent — the reviewer persona is the Multica assignee

