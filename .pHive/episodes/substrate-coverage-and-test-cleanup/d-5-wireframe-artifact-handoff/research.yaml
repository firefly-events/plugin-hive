  # Item 7: design-review/SKILL.md downstream consumer field access
  design_review_consumer:
    path: skills/design-review/SKILL.md
    reads_from: ".pHive/design/index.yaml"
    fields_read:
      - "brief_path"
      - "export_paths"
    step_2_verbatim: >
      "For artifact_target: design, use explicit paths if provided; otherwise collect
      .pHive/design/index.yaml brief_path and export_paths entries plus
      .pHive/brand/brand-system.yaml when present."
    field_named_rationale: >
      /design-review reads by named field (brief_path, export_paths) from index.yaml.
      A file-glob approach would silently include ui-designer working state (v1.png, v2.png,
      brief.md, accessibility-constraints.md, animations-constraints.md all co-exist
      under .pHive/design/<topic>/). Named fields prevent working-state leakage into
      the handoff bundle. This is the design decision rationale for "field-named not
      file-glob-based" in the story spec.
    index_yaml_constraint_fields:
      - "constraint_doc_path: .pHive/design/<topic>/accessibility-constraints.md  # toggle ON"
      - "animations_constraint_doc_path: .pHive/design/<topic>/animations-constraints.md  # toggle ON"
    note: >
      design-review does NOT currently read constraints.md by a bundled payload field.
      d-5 defines the payload contract; the downstream consumer wiring is a follow-up
      concern. The payload contract section in wireframe-protocol.md names the three
      minimum fields so design-review implementors can reference them by name.

