  d4_dispatch_shape:
    one_workflow_run_per_design_dispatch: true
    internal_structure: "pipeline()/phase() chain executing N personas serially"
    n_when_toggle_off: 1  # ui-designer only
    n_when_toggle_on: 3   # accessibility-specialist, animations-specialist, ui-designer
    each_agent_carries: [opts.model, insight_capture_suffix]
