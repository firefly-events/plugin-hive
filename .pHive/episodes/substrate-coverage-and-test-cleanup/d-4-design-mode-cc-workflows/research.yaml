    d4_in_scope: true  # design-mode-cc-workflows ends in -mode-cc-workflows
    check_1: "agentType-literal-ast — no agentType: codex:codex-rescue in code blocks (angle-bracket placeholder exempt)"
    check_2: "codex-rescue-grep — no codex:codex-rescue string in code blocks (placeholder exempt)"
    check_3: "agent-backends-grep — no agent_backends in code blocks"
    check_4: "cc-workflows-preconditions-import — file must contain 'hive/lib/cc-workflows-preconditions.mjs'"
    all_4_must_pass: true

