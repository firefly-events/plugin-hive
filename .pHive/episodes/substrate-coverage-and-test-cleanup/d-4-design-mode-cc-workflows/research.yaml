  d3_persona_set:
    toggle_off_default:
      include_constraints: false
      persona_set: ["ui-designer"]
      issue_count: 1
    toggle_on:
      include_constraints: true
      persona_set: ["accessibility-specialist", "animations-specialist", "ui-designer"]
      issue_count: 3
    dispatch_order: "accessibility-specialist → animations-specialist → ui-designer (serial)"
    prior_outputs_map: "accumulates terminal.notes per persona; passed as context to later personas"
    q10_contract: "one issue per persona — do NOT collapse into single bundled issue"
    d4_difference: "d-4 uses same persona resolution but dispatches via Workflow tool, not Multica issue creation"

  # 3. design-review-mode-cc-workflows (dr-3) atom anatomy
  dr3_atom_anatomy:
    shape: "ONE Workflow run, FOUR sequential agent() calls inside ONE phase()"
    contrast_with_plan_mode: "plan-mode = per-persona fan-out (N runs); dr-3 = single run, N calls inside"
    step_0_identical: "same assertWorktreeIsolation import + call"
    step_1_dispatch:
      model_tier_calls: 4  # all resolved before assembly
      phase_name: "DesignReview"
      four_agents: [accessibility-specialist, animations-specialist, ui-designer-critique, ui-designer-synthesis]
    step_3_marker: "ONE marker capturing all 4 outputs (contrast: plan-mode = one marker per persona)"
    insight_capture_suffix: "MANDATORY on EACH of the 4 agent() prompts"
    field_sources_agent_models: "keyed by phase/role (DesignReview/accessibility-specialist etc.)"

  # 4. review-mode-cc-workflows (r-3) solo dispatch
  r3_solo_dispatch:
    shape: "ONE Workflow run, ONE agent() call (solo reviewer)"
    reduces_to_when_toggle_off: "d-4 toggle OFF reduces to same single-agent dispatch shape"
