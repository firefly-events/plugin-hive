    step_1: "ONE phase() named Review, ONE agent(reviewer, opts.model=reviewerTier)"
    marker: "ONE cc-workflows-run.yaml (not per-persona)"

  # 5. design/SKILL.md Phase 0 handoff
  design_skill_phase_0:
    mode_decision_cc_workflows: >
      When design-dispatch returns mode_decision=cc-workflows, /design stops inline
      and hands off to skills/hive/skills/design-mode-cc-workflows/SKILL.md.
      Does NOT continue inline persona phase.
    include_constraints_toggle_flows_through: >
      --include-constraints toggle resolved in Phase A affects persona set passed
      to the cc-workflows atom (same toggle OFF=[ui-designer], ON=[3 personas]).

  # 6. design-dispatch (d-2) contract
  design_dispatch_contract:
    input_key: "HIVE_DESIGN_MODE"
    resolveMode_call: "resolveMode('HIVE_DESIGN_MODE', ctx)"
    outputs: [mode_decision, mode_reason, runner_path, runner_reason, field_sources, gate_violations]
    routing: "cc-workflows → forward to design-mode-cc-workflows/SKILL.md"

  # 7. cc-workflows-preconditions.mjs
  preconditions_helper:
    export: "assertWorktreeIsolation(cwd = process.cwd())"
    import_path_from_skill: "../../../hive/lib/cc-workflows-preconditions.mjs"
    worktree_re: "/\\.claude\\/worktrees\\/[^/]+/"
    throws_on_fail: true
    error_shape: "err.precondition_failed = true; err.field_sources = { worktree_isolation: {...} }"

  # 8. cc-workflows-model-tier.mjs
  model_tier_resolver:
    signature: "resolveModelTier(persona, { config })"
    precedence: "model_overrides > model_tiers > default('sonnet' + WARN)"
    returns: "{ tier: 'sonnet'|'opus'|'haiku', source: 'model_overrides'|'model_tiers'|'default' }"
