findings:

  # 1. plan-mode-cc-workflows canonical shape
  plan_mode_mirror:
    h1: "Hive Plan Mode — CC Workflows"
    summary: >
      Atomic skill for cc-workflows planning dispatch. Per-persona fan-out via Workflow tool.
      One Workflow script per persona (not one script for all personas).
    state_dir_resolution: "HIVE_STATE_DIR = hive_config.paths.state_dir || '.pHive'"
    invocation_contract:
      inputs: [assembled_personas[], planning_story, epic_handle, hive_config, integration_branch]
      outer_seam_invariant: true  # fixed call signature never changes
    step_0_precondition:
      import_path: "../../../hive/lib/cc-workflows-preconditions.mjs"
      call: "assertWorktreeIsolation()"
      first_action: true
    step_1_dispatch:
      pattern: per_persona_serial
      script_shape: "one meta block + one phase() per persona + one agent() per persona"
      defensive_args: "const a = typeof args === 'string' ? JSON.parse(args) : args;"
      opts_model_required: true
      model_tier_import: "import { resolveModelTier } from 'hive/lib/cc-workflows-model-tier.mjs'"
      model_tier_call: "resolveModelTier(persona, { config: hive_config })"
      no_codex: "every agent() call uses default workflow subagent — agentType:codex forbidden"
    step_2_poll: "per-persona poll to terminal via <task-notification> with <result>/<status>/<usage>"
    step_3_marker:
      path: "${HIVE_STATE_DIR}/episodes/{epic_handle}/{planning_story.id}-{persona}/cc-workflows-run.yaml"
      sidecar: "${HIVE_STATE_DIR}/episodes/{epic_handle}/{planning_story.id}-{persona}/cc-workflows-run.messages.jsonl"
      field_sources_agent_models: true  # records per-phase model tier with source tracing
    step_4_sidecar_deferral: "documented no-op — mirrors execute-mode-cc-workflows structure"
    reconciliation: "serial persona-dispatch order; orchestrator commits after skill returns"
    configuration:
      hive_config_key: "planning.mode: cc-workflows"
      env_var: "HIVE_PLANNING_MODE=cc-workflows"
    insight_capture_suffix: "MANDATORY on every agent() prompt — persona-substituted template"

