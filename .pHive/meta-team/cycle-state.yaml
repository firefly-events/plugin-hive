      as Tier: Opus, but all three have model: sonnet in their agent files and
      in hive.config.yaml model_tiers.sonnet. The Model Tier Routing table in
      the same document correctly lists these three as Sonnet (corrected in
      meta-2026-05-20 — the Planning Agents table was missed).
    evidence: >
      GUIDE.md line 187: "Analyst ... Opus", line 188: "Architect ... Opus",
      line 189: "TPM ... Opus". analyst.md: model: sonnet. architect.md: model:
      sonnet. tpm.md: model: sonnet. hive.config.yaml model_tiers.sonnet
      includes analyst, architect, tpm. Model Tier Routing table line 179
      correctly lists all three under Sonnet.
  - id: finding-2
