      Already flagged out_of_scope in meta-2026-05-11, -12, -14, -15.
approved_proposals:
  - id: proposal-1
    title: Add claude-haiku-4-5-20251001 key to RATES_PER_MTOK in budget-gate.js
    discovery_source: internal_audit
    addresses_findings:
      - finding-1
    impact_score: 3
    risk_score: 1
    effort_score: 1
    priority_score: 15
    charter_objective: consistency
    metric:
      applies: true
      name: budget_gate.haiku_rate_lookup_accuracy
      direction: up
      unit: ratio
      baseline: 0.0
      target: 1.0
      window: next-3-cycles
      source:
        kind: manual
        ref: verify rateLookup(claude-haiku-4-5-20251001) returns haiku rate not opus rate
      verify_at: first cycle post-merge
      owner: developer
    implementation_plan:
      - step: Add claude-haiku-4-5-20251001 entry to RATES_PER_MTOK with same rates as claude-haiku-4-5
        file: hive/lib/budget-gate.js
        action: add_entry
    rationale: |
      The budget gate RATES_PER_MTOK used claude-haiku-4-5 as the haiku key. The
      actual runtime model ID logged by API calls is claude-haiku-4-5-20251001.
      When the gate processes events with the full model ID, rateLookup falls back
      to opus rates (15x more expensive), over-counting spend. Adding the full model
      ID key with identical rates fixes the lookup; old key retained for backward
      compatibility.
    risk_notes: |
      Purely additive: new key added alongside existing key. No deletion, no
      surrounding code changes. Old key remains for backward compatibility.
