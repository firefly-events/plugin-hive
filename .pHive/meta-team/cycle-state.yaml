      justification: >
        Pure schema-doc accuracy correction (tier label in guide table) — no
        measurable throughput, error-rate, or quality-rate claim; no observable
        performance surface to instrument.
    implementation_plan:
      - step: >
          Update the Tier column for Analyst (line 187), Architect (line 188),
          and TPM (line 189) in the Planning Agents table from "Opus" to
          "Sonnet" to match the Model Tier Routing table, agent model fields,
          and hive.config.yaml model_tiers.sonnet.
        file: hive/GUIDE.md
        action: update_field
    rationale: |
      The Planning Agents table in hive/GUIDE.md has stale "Opus" tier labels
      for Analyst, Architect, and TPM. The meta-2026-05-20 cycle corrected the
      Model Tier Routing table to show these three as Sonnet, but the Planning
      Agents table was not updated in that cycle. The three agents have
      model: sonnet in their individual agent files (analyst.md, architect.md,
      tpm.md) and hive.config.yaml model_tiers.sonnet explicitly lists them.
      The stale "Opus" label misleads operators into thinking Opus-cost calls
      will be made for these agents, inflating cost expectations.
    risk_notes: |
      Update three table cells in a single doc. No cross-references depend on
      this table. No runtime behavior changes. Revert is a three-cell restore.
      Risk: none beyond typo.
