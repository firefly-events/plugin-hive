      out_of_scope finding across multiple prior cycles.
approved_proposals:
  - id: proposal-1
    title: Correct Planning Agents tier column in hive/GUIDE.md — Analyst, Architect,
      TPM are Sonnet not Opus
    discovery_source: internal_audit
    addresses_findings:
      - finding-1
    impact_score: 3
    risk_score: 1
    effort_score: 1
    priority_score: 15
    charter_objective: consistency
    metric:
