findings:
  - id: finding-1
    category: SCHEMA_INCONSISTENCY
    severity: medium
    location: hive/lib/budget-gate.js
    description: Haiku rate-card key is `claude-haiku-4-5` but runtime model ID is `claude-haiku-4-5-20251001`
    evidence: >
      budget-gate.js line 50 maps haiku to claude-haiku-4-5 in RATES_PER_MTOK.
      orchestrator.md and agent-config-schema.md confirm the runtime model ID is
      claude-haiku-4-5-20251001. When events log the full model ID, rateLookup
      falls back to opus rates (15x over-counting spend).
  - id: finding-2
    category: STUB_DOC
    severity: low
    location: hive/references/hive-cloud-roadmap.md
    description: 13-line placeholder stub for deferred Hive Cloud epic
    evidence: >
