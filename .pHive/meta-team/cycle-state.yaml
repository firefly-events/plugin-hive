    implementation_plan:
      - step: >
          Remove lines 19-20 from hive/agents/backend-developer.md domain block
          (the duplicate write: false and delete: false entries that override
          the intended write: true and delete: false).
        file: hive/agents/backend-developer.md
        action: update_field
    rationale: |
      backend-developer.md domain block has duplicate write and delete fields.
      YAML parsers honour last-value-wins, making write: false the effective value
      despite write: true appearing first and the "Default: permissive" comment.
      This means the backend-developer agent cannot write files in contexts where
      the domain block is consumed directly. frontend-developer.md has the correct
      single-entry form.
    risk_notes: |
      Removing two duplicate YAML lines from a frontmatter block. No cross-references
      depend on this field. Revert is a two-line insert. Risk: none beyond typo.
