extends: relaxed
ignore: |
  node_modules/
  pytest-of-don/
  ttd-fixture-*/
  ttd-state-*/
  chroma/
  .pHive-test/
rules:
  line-length: disable
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  key-duplicates: disable  # cycle-state files use intentional duplicate keys (status/phase) to track progression
